<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="380" fill="#fbf7ef"/><path d="M21.1 20.0L980.3 20.4L978.9 95.3L20.7 94.2Z" fill="#d6e1cf" stroke="none"/><path d="M18.5 20.0Q500.1 20.0 981.8 19.6M19.5 20.4Q500.5 19.6 981.5 20.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.8 18.3Q979.6 57.2 980.0 96.2M979.9 17.9Q981.3 57.0 980.3 96.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.5 94.4Q500.1 97.2 18.7 94.5M981.4 94.7Q499.6 93.2 17.8 95.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 96.0Q20.2 56.8 20.1 17.7M20.2 95.9Q18.8 57.6 19.1 19.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="52.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Best: federated sign-in with temporary credentials</text><text x="500.0" y="74.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">workforce via IAM Identity Center or direct federation; third parties via roles</text><path d="M19.1 104.9L980.2 104.7L980.7 179.7L21.0 179.8Z" fill="#d6e1cf" stroke="none"/><path d="M18.4 104.3Q499.7 105.9 981.0 104.1M17.7 104.3Q499.6 106.7 981.5 104.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 102.9Q981.0 142.1 979.3 181.3M979.2 103.5Q979.1 142.0 980.4 180.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 179.5Q499.6 180.0 17.9 179.1M980.9 180.2Q499.4 181.3 17.9 180.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.2 182.1Q22.0 143.0 20.3 103.9M19.8 182.0Q18.6 142.7 19.0 103.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="137.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Workloads: IAM roles (EC2, Lambda, IAM Roles Anywhere outside AWS)</text><text x="500.0" y="159.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">no keys in code, credentials issued and rotated automatically</text><path d="M21.1 189.0L980.3 190.4L980.5 263.8L19.4 266.1Z" fill="#efe0ca" stroke="none"/><path d="M18.4 189.4Q500.0 191.4 981.6 189.4M19.6 190.2Q500.0 190.6 980.5 190.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 189.2Q981.5 227.3 980.3 265.5M981.1 187.5Q979.2 226.5 979.8 265.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 264.6Q499.5 266.6 18.0 265.0M982.1 264.3Q500.2 263.6 18.4 264.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.6 266.3Q21.5 227.7 20.1 189.1M19.5 267.4Q19.6 227.6 20.0 187.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="222.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">If a secret is unavoidable: Secrets Manager with rotation</text><text x="500.0" y="244.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">fetch at runtime, never in source or config files</text><path d="M19.3 275.1L981.1 275.8L981.1 351.1L19.7 348.8Z" fill="#eed5cc" stroke="none"/><path d="M18.5 275.8Q499.6 277.0 980.6 275.5M17.6 275.4Q499.4 277.4 981.1 275.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 273.1Q981.0 312.4 980.5 351.8M980.0 274.0Q980.3 312.3 979.1 350.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 350.4Q500.6 349.3 19.3 349.1M981.7 350.0Q500.0 348.7 18.3 349.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 352.0Q21.0 312.2 20.3 272.5M21.0 351.4Q21.4 312.9 19.0 274.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="307.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Avoid: long-term access keys and shared accounts</text><text x="500.0" y="329.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">if unavoidable, rotate on a schedule and audit use</text><text x="500" y="365" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">SEC02: order of preference for credentials (top is best)</text></svg>