<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 125.3L10.7 124.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.3 69.7 495.0 126.2M494.9 12.9Q496.7 69.5 495.3 126.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 124.4Q252.6 127.2 8.7 124.5M496.4 124.7Q252.1 123.2 7.8 125.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 126.0Q10.1 69.3 10.1 12.7M10.2 125.9Q8.6 70.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Business alignment (Fig 1-3, left)</text><text x="252.5" y="76.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one team fully owns each business context:</text><text x="252.5" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">application code and its data store</text><path d="M504.1 14.9L990.2 14.7L990.7 124.7L506.0 124.8Z" fill="#eed5cc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.4 69.6 989.3 126.3M989.2 13.5Q988.9 69.5 990.4 125.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 124.5Q747.1 125.0 502.9 124.1M990.9 125.2Q746.9 126.3 502.9 125.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 127.1Q507.4 70.5 505.3 13.9M504.8 127.0Q503.4 70.2 504.0 13.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Technical alignment (Fig 1-3, right)</text><text x="747.5" y="76.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">teams split by layer (application and data):</text><text x="747.5" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">explicit team and implicit business dependencies</text><path d="M11.1 139.0L990.3 140.4L990.5 238.8L9.4 241.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 139.4Q500.0 141.4 991.6 139.4M9.6 140.2Q500.0 140.6 990.5 140.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 139.2Q991.7 189.8 990.3 240.5M991.1 137.5Q989.0 189.0 989.8 240.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 239.6Q499.5 241.6 8.0 240.0M992.1 239.3Q500.2 238.6 8.4 239.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 241.3Q11.7 190.2 10.1 139.1M9.5 242.4Q9.6 190.1 10.0 137.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="174.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">Trade-off of business alignment: code and similar data access patterns may be replicated across services. Exposing data directly to cut the repetition</text><text x="500.0" y="196.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">ties services together and produces complex APIs, which may cost far more than repeating logic and storing similar data.</text><text x="500.0" y="218.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Technically aligned services still suit non-functional needs (authentication, logging, monitoring).</text><path d="M9.3 255.1L991.1 255.8L991.1 376.1L9.7 373.8Z" fill="#dfd6e7" stroke="none"/><path d="M8.5 255.8Q499.6 257.0 990.6 255.5M7.6 255.4Q499.4 257.4 991.1 255.6" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 253.1Q991.3 314.9 990.5 376.8M990.0 254.0Q990.6 314.8 989.1 375.7" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 375.4Q500.6 374.3 9.3 374.1M991.7 375.0Q500.0 373.7 8.3 374.4" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 377.0Q11.4 314.7 10.3 252.5M11.0 376.4Q12.0 315.4 9.0 254.5" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="310.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">Event-driven microservices work because they decouple what a service does from how it accesses data: legacy monoliths and point-to-point</text><text x="500.0" y="332.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">request-response services bundle data and service together; event streams split them apart.</text></svg>