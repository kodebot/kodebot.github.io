<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 125.3L10.7 124.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.3 69.7 330.0 126.2M329.9 12.9Q331.7 69.5 330.3 126.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 124.4Q170.1 127.2 8.7 124.5M331.4 124.7Q169.6 123.2 7.8 125.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 126.0Q10.1 69.3 10.1 12.7M10.2 125.9Q8.6 70.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Business communication (Fig 1-4)</text><text x="170.0" y="76.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">teams and departments: engineering builds,</text><text x="170.0" y="98.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">sales sells, support keeps customers happy</text><path d="M339.1 14.9L660.2 14.7L660.7 124.7L341.0 124.8Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.4 69.6 659.3 126.3M659.2 13.5Q658.9 69.5 660.4 125.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 124.5Q499.6 125.0 337.9 124.1M660.9 125.2Q499.4 126.3 337.9 125.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 127.1Q342.4 70.5 340.3 13.9M339.8 127.0Q338.4 70.2 339.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Implementation communication (1-5)</text><text x="500.0" y="76.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">data and logic that solve a business problem;</text><text x="500.0" y="98.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">classic example: the monolithic database app</text><path d="M671.1 14.0L990.3 15.4L990.5 123.8L669.4 126.1Z" fill="#efe0ca" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.8 69.8 990.3 125.5M991.1 12.5Q988.9 69.0 989.8 125.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 124.6Q829.5 126.6 668.0 125.0M992.1 124.3Q830.2 123.6 668.4 124.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 126.3Q671.8 70.2 670.1 14.1M669.5 127.4Q669.6 70.1 670.0 12.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Data communication (Fig 1-6)</text><text x="830.0" y="76.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">how the organisation accesses data across it;</text><text x="830.0" y="98.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">usually an afterthought, bolted on to the service</text><path d="M9.3 145.1L991.1 145.8L991.1 266.1L9.7 263.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 145.8Q499.6 147.0 990.6 145.5M7.6 145.4Q499.4 147.4 991.1 145.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 143.1Q991.3 204.9 990.5 266.8M990.0 144.0Q990.6 204.8 989.1 265.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 265.4Q500.6 264.3 9.3 264.1M991.7 265.0Q500.0 263.7 8.3 264.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 267.0Q11.4 204.7 10.3 142.5M11.0 266.4Q12.0 205.4 9.0 144.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="189.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Conway&#x27;s law (1968): systems copy the communication structures of the organisation. Implementation structures give easy access to data inside one bounded</text><text x="500.0" y="211.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">context (the carrot: keep everything in one store) and make cross-context data hard (the stick: it discourages new, separate products).</text><text x="500.0" y="233.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">Workarounds have costs: shared databases couple on internal models; read replicas still couple on private models; batch dumps are error prone.</text><path d="M9.1 279.1L989.6 279.3L989.6 415.2L9.4 415.1Z" fill="#d6e1cf" stroke="none"/><path d="M7.7 279.3Q499.8 281.0 991.8 279.3M9.1 279.1Q500.1 282.8 991.2 280.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 279.4Q992.1 347.9 989.4 416.3M990.1 278.9Q990.8 347.7 990.0 416.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 415.6Q500.2 414.2 8.1 414.5M992.5 414.0Q500.2 414.8 7.9 414.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 416.0Q10.9 347.4 11.0 278.7M10.3 415.5Q10.2 346.8 9.6 278.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="331.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">Event-driven architecture gives data its own communication structure: event streams that hold durable, canonical, replayable business facts,</text><text x="500.0" y="353.5" font-size="13.5" fill="#3b2f20" text-anchor="middle">so a new service can ingest history, keep only the fields it needs and own its model. Producers are responsible for format, schema and content;</text><text x="500.0" y="375.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumers build their own models and queries. Share only what other teams need.</text></svg>