ext-anchor="middle">Input stream B</text><path d="M331.1 19.0L670.3 20.4L670.5 208.8L329.4 211.1Z" fill="#d3dbe0" stroke="none"/><path d="M328.4 19.4Q500.0 21.4 671.6 19.4M329.6 20.2Q500.0 20.6 670.5 20.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.9 19.2Q671.9 114.8 670.3 210.5M671.1 17.5Q668.6 114.0 669.8 210.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M671.1 209.6Q499.5 211.6 328.0 210.0M672.1 209.3Q500.2 208.6 328.4 209.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.6 211.3Q332.0 115.2 330.1 19.1M329.5 212.4Q329.6 115.1 330.0 17.8" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="88.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event-driven microservice (Fig 1-1)</text><text x="500.0" y="110.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">consumes events, applies its own business logic,</text><text x="500.0" y="132.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">keeps its own state store, scales itself,</text><text x="500.0" y="154.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">integrates with monitoring</text><path d="M769.3 75.1L991.1 75.8L991.1 146.1L769.7 143.8Z" fill="#d6e1cf" stroke="none"/><path d="M768.5 75.8Q879.6 77.0 990.6 75.5M767.6 75.4Q879.4 77.4 991.1 75.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 73.1Q990.9 109.9 990.5 146.8M990.0 74.0Q990.3 109.8 989.1 145.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 145.4Q880.6 144.3 769.3 144.1M991.7 145.0Q880.0 143.7 768.3 144.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M769.9 147.0Q771.0 109.7 770.3 72.5M771.0 146.4Q771.4 110.4 