ound"/><path d="M990.8 314.7Q500.2 312.3 9.5 314.8M991.2 314.8Q500.3 316.8 9.5 315.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 316.0Q7.7 275.2 9.4 234.5M9.1 316.7Q8.4 274.6 8.9 232.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="270.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">Consumer services read streams; producer services write them; most do both. Events are not destroyed on consumption (unlike message passing)</text><text x="500.0" y="292.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">so other consumers can read them whenever they need. Stateless or stateful, but most non-trivial services need state.</text></svg>