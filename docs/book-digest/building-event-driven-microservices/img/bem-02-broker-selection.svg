text><path d="M669.5 124.2L989.1 125.5L990.6 224.4L669.8 226.2Z" fill="#dfd6e7" stroke="none"/><path d="M668.0 124.5Q830.2 121.6 992.4 125.0M667.8 125.6Q830.1 126.6 992.4 125.2" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 122.6Q990.0 175.1 990.3 227.5M990.0 123.5Q988.6 175.2 990.9 227.0" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 225.9Q830.1 222.3 668.9 224.2M991.4 224.3Q830.2 221.8 669.0 225.4" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.9 227.5Q672.5 175.3 669.3 123.2M669.8 227.3Q672.1 175.3 669.7 123.3" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="159.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">What a broker cluster provides</text><text x="830.0" y="181.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">scalability, durability (replication), high</text><text x="830.0" y="203.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">availability, high performance</text><path d="M11.0 234.5L990.5 234.4L989.4 336.1L8.8 334.1Z" fill="#f1ede5" stroke="none"/><path d="M8.7 233.9Q499.6 231.7 990.6 234.7M9.2 235.4Q500.8 234.5 992.4 235.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 233.5Q987.8 285.4 989.0 337.3M990.6 233.4Q991.0 285.1 990.7 336.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 334.2Q500.4 334.3 8.2 335.1M990.6 334.0Q500.0 336.3 9.4 334.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.8 336.2Q11.2 285.2 10.5 234.3M9.9 335.7Q8.4 284.1 8.9 232.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="280.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Event data needs a common schema (Avro, Protobuf): an evolution framework and generated typed classes, so consumers interpret events without asking</text><text x="500.0" y="302.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the producer&#x27;s owner (Chapter 4). Selecting a broker: weigh these factors rather than comparing technologies directly.</text></svg>