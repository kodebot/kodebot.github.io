round" stroke-linejoin="round"/><path d="M340.2 117.1Q342.3 65.5 340.3 13.9M339.8 117.0Q338.4 65.2 339.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="49.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Hosted services</text><text x="500.0" y="71.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">hosted or in-house; monitoring, scaling, disaster</text><text x="500.0" y="93.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">recovery, multizone; lock-in; paid support</text><path d="M671.1 14.0L990.3 15.4L990.5 113.8L669.4 116.1Z" fill="#efe0ca" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.7 64.8 990.3 115.5M991.1 12.5Q989.0 64.0 989.8 115.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 114.6Q829.5 116.6 668.0 115.0M992.1 114.3Q830.2 113.6 668.4 114.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 116.3Q671.7 65.2 670.1 14.1M669.5 117.4Q669.6 65.1 670.0 12.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="49.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Client libraries</text><text x="830.0" y="71.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">languages and frameworks you use; can you</text><text x="830.0" y="93.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">build missing ones; common or home-grown</text><path d="M9.3 125.1L331.1 125.8L331.1 226.1L9.7 223.8Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 125.8Q169.6 127.0 330.6 125.5M7.6 125.4Q169.4 127.4 331.1 125.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 123.1Q331.1 174.9 330.5 2