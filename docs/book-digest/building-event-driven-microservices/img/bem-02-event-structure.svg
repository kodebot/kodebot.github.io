<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 135.3L10.7 134.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.3 74.7 330.0 136.2M329.9 12.9Q331.8 74.5 330.3 136.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 134.4Q170.1 137.2 8.7 134.5M331.4 134.7Q169.6 133.2 7.8 135.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 136.0Q10.0 74.3 10.1 12.7M10.2 135.9Q8.6 75.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="59.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Header</text><text x="170.0" y="81.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">metadata: datetimes, tracking IDs,</text><text x="170.0" y="103.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">user-defined key-value pairs</text><path d="M339.1 14.9L660.2 14.7L660.7 134.7L341.0 134.8Z" fill="#efe0ca" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.5 74.6 659.3 136.3M659.2 13.5Q658.8 74.5 660.4 135.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 134.5Q499.6 135.0 337.9 134.1M660.9 135.2Q499.4 136.3 337.9 135.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 137.1Q342.6 75.5 340.3 13.9M339.8 137.0Q338.3 75.2 339.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="59.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Key (optional)</text><text x="500.0" y="81.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">routes to a partition (data locality);</text><text x="500.0" y="103.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">may identify a unique entity</text><path d="M671.1 14.0L990.3 15.4L990.5 133.8L669.4 136.1Z" fill="#d6e1cf" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 74.8 990.3 135.5M991.1 12.5Q988.7 74.0 989.8 135.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 134.6Q829.5 136.6 668.0 135.0M992.1 134.3Q830.2 133.6 668.4 134.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 136.3Q671.9 75.2 670.1 14.1M669.5 137.4Q669.6 75.1 670.0 12.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="59.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Value</text><text x="830.0" y="81.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the bulk of the data: like all the other</text><text x="830.0" y="103.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fields of a database row</text><path d="M9.3 150.1L331.1 150.8L331.1 301.1L9.7 298.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 150.8Q169.6 152.0 330.6 150.5M7.6 150.4Q169.4 152.4 331.1 150.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 148.1Q331.3 224.9 330.5 301.8M330.0 149.0Q330.6 224.8 329.1 300.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M332.0 300.4Q170.6 299.3 9.3 299.1M331.7 300.0Q170.0 298.7 8.3 299.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 302.0Q11.5 224.7 10.3 147.5M11.0 301.4Q12.1 225.4 9.0 149.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="198.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Unkeyed event (2-6)</text><text x="170.0" y="220.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">independent, no routing; raw measurement,</text><text x="170.0" y="242.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">for example a red-light camera photo</text><text x="170.0" y="264.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">in the format the device gives you</text><path d="M339.1 149.1L659.6 149.3L659.6 300.2L339.4 300.1Z" fill="#efe0ca" stroke="none"/><path d="M337.7 149.3Q499.8 151.0 661.8 149.3M339.1 149.1Q500.1 152.8 661.2 150.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.0 149.4Q662.1 225.4 659.4 301.3M660.1 148.9Q660.8 225.2 660.0 301.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M662.4 300.6Q500.2 299.2 338.1 299.5M662.5 299.0Q500.2 299.8 337.9 299.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.9 301.0Q340.9 224.9 341.0 148.7M340.3 300.5Q340.2 224.3 339.6 148.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="198.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Keyed event (2-7, 2-8)</text><text x="500.0" y="220.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">non-null key set by the producer, immutable;</text><text x="500.0" y="242.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">all events with the same key (a licence plate,</text><text x="500.0" y="264.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">FAST 321) go to one partition</text><path d="M669.5 149.2L989.1 150.5L990.6 299.4L669.8 301.2Z" fill="#d6e1cf" stroke="none"/><path d="M668.0 149.5Q830.2 146.6 992.4 150.0M667.8 150.6Q830.1 151.6 992.4 150.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 147.6Q989.9 225.1 990.3 302.5M990.0 148.5Q988.2 225.2 990.9 302.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 300.9Q830.1 297.3 668.9 299.2M991.4 299.3Q830.2 296.8 669.0 300.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.9 302.5Q673.0 225.3 669.3 148.2M669.8 302.3Q672.6 225.3 669.7 148.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="187.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Entity event (2-9 to 2-11)</text><text x="830.0" y="209.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a unique thing keyed by its ID: its full state at a</text><text x="830.0" y="231.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">point in time (a Car; repainted blue = a new</text><text x="830.0" y="253.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">event with all fields); basis of event-carried</text><text x="830.0" y="275.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">state transfer (ECST)</text><path d="M11.0 314.5L990.5 314.4L989.4 416.1L8.8 414.1Z" fill="#f1ede5" stroke="none"/><path d="M8.7 313.9Q499.6 311.7 990.6 314.7M9.2 315.4Q500.8 314.5 992.4 315.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 313.5Q987.8 365.4 989.0 417.3M990.6 313.4Q991.0 365.1 990.7 416.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 414.2Q500.4 414.3 8.2 415.1M990.6 414.0Q500.0 416.3 9.4 414.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.8 416.2Q11.2 365.2 10.5 314.3M9.9 415.7Q8.4 364.1 8.9 312.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="360.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">An entity event is like a database row with a primary key; an update appends a new full entity event (created, updated or deleted).</text><text x="500.0" y="382.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Events are immutable: publish a new corrective event rather than changing one. Avoid the word &#x27;message&#x27;: events are more like a public post than a private chat.</text></svg>