<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="450" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 145.3L10.7 144.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 79.7 495.0 146.2M494.9 12.9Q496.9 79.5 495.3 146.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 144.4Q252.6 147.2 8.7 144.5M496.4 144.7Q252.1 143.2 7.8 145.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Kappa architecture (Fig 2-18)</text><text x="252.5" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Jay Kreps, 2014) the event stream is the only record;</text><text x="252.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">each service starts at the head and builds its own</text><text x="252.5" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">state; no secondary store; cheap storage makes it viable</text><path d="M504.1 14.9L990.2 14.7L990.7 144.7L506.0 144.8Z" fill="#eed5cc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 79.6 989.3 146.3M989.2 13.5Q988.8 79.5 990.4 145.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 144.5Q747.1 145.0 502.9 144.1M990.9 145.2Q746.9 146.3 502.9 145.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 147.1Q507.7 80.5 505.3 13.9M504.8 147.0Q503.2 80.2 504.0 13.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Lambda architecture (2-19, 2-20)</text><text x="747.5" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">stream for real time plus a historical repository;</text><text x="747.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumers load history first, then switch to the stream;</text><text x="747.5" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">based on the outdated idea that streams cannot keep data</text><path d="M11.1 159.0L495.3 160.4L495.5 293.8L9.4 296.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 159.4Q252.5 161.4 496.6 159.4M9.6 160.2Q252.5 160.6 495.5 160.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 159.2Q496.9 227.3 495.3 295.5M496.1 157.5Q493.6 226.5 494.8 295.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 294.6Q252.0 296.6 8.0 295.0M497.1 294.3Q252.7 293.6 8.4 294.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 296.3Q12.0 227.7 10.1 159.1M9.5 297.4Q9.6 227.6 10.0 157.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="200.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Kappa trade-off</text><text x="252.5" y="222.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">hydration time: a large set with few partitions may take</text><text x="252.5" y="244.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">hours or days to materialise; mitigate with snapshots and</text><text x="252.5" y="266.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">backups of state (Kafka Streams, Flink, Spark)</text><path d="M504.3 160.1L991.1 160.8L991.1 296.1L504.7 293.8Z" fill="#eed5cc" stroke="none"/><path d="M503.5 160.8Q747.1 162.0 990.6 160.5M502.6 160.4Q746.9 162.4 991.1 160.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 158.1Q991.3 227.4 990.5 296.8M990.0 159.0Q990.6 227.3 989.1 295.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 295.4Q748.1 294.3 504.3 294.1M991.7 295.0Q747.5 293.7 503.3 294.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 297.0Q506.5 227.2 505.3 157.5M506.0 296.4Q507.1 227.9 504.0 159.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="200.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Lambda problems</text><text x="747.5" y="222.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">producer code writes both and is not atomic, so they</text><text x="747.5" y="244.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">diverge; consumers keep two code paths; models evolve in</text><text x="747.5" y="266.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">sync; merging data sets needs four reconciliations</text><path d="M9.1 309.1L989.6 309.3L989.6 435.2L9.4 435.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 309.3Q499.8 311.0 991.8 309.3M9.1 309.1Q500.1 312.8 991.2 310.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 309.4Q992.0 372.9 989.4 436.3M990.1 308.9Q990.8 372.7 990.0 436.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 435.6Q500.2 434.2 8.1 434.5M992.5 434.0Q500.2 434.8 7.9 434.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 436.0Q10.9 372.4 11.0 308.7M10.3 435.5Q10.2 371.8 9.6 308.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="367.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">Even the version where the historical store is built from the stream resembles kappa with an awkward split. The book includes lambda for context,</text><text x="500.0" y="389.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">not as an endorsement: too hard at scale, and it puts the whole onus of data access on the consumer.</text></svg>