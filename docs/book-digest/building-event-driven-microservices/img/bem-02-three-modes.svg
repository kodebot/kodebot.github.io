<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="450" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 205.3L10.7 204.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 109.7 330.0 206.2M329.9 12.9Q331.9 109.5 330.3 206.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 204.4Q170.1 207.2 8.7 204.5M331.4 204.7Q169.6 203.2 7.8 205.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Ephemeral messaging (2-2)</text><text x="170.0" y="94.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">a channel: messages go to current subscribers</text><text x="170.0" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">only, not stored; at-most-once</text><text x="170.0" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">NATS Core; Tinder notifications</text><text x="170.0" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">no replay: unsuited to data products</text><path d="M339.1 14.9L660.2 14.7L660.7 204.7L341.0 204.8Z" fill="#efe0ca" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 109.6 659.3 206.3M659.2 13.5Q658.8 109.5 660.4 205.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 204.5Q499.6 205.0 337.9 204.1M660.9 205.2Q499.4 206.3 337.9 205.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 207.1Q342.7 110.5 340.3 13.9M339.8 207.0Q338.2 110.2 339.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Queue (2-3, 2-4)</text><text x="500.0" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">durable, consumers compete first-come</text><text x="500.0" y="116.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">first-served; acknowledged records are usually</text><text x="500.0" y="138.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">deleted; at-least-once; priority; exchange fans</text><text x="500.0" y="160.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">out to per-consumer queues; RabbitMQ, ActiveMQ</text><path d="M671.1 14.0L990.3 15.4L990.5 203.8L669.4 206.1Z" fill="#d6e1cf" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 109.8 990.3 205.5M991.1 12.5Q988.6 109.0 989.8 205.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 204.6Q829.5 206.6 668.0 205.0M992.1 204.3Q830.2 203.6 668.4 204.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 206.3Q672.0 110.2 670.1 14.1M669.5 207.4Q669.6 110.1 670.0 12.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event stream</text><text x="830.0" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">durable ordered log; partition-exclusive</text><text x="830.0" y="116.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">subscriptions; retained (even indefinitely);</text><text x="830.0" y="138.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">every consumer gets every event; replayable;</text><text x="830.0" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Apache Kafka</text><path d="M9.3 220.1L991.1 220.8L991.1 431.1L9.7 428.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 220.8Q499.6 222.0 990.6 220.5M7.6 220.4Q499.4 222.4 991.1 220.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 218.1Q991.3 324.9 990.5 431.8M990.0 219.0Q990.6 324.8 989.1 430.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 430.4Q500.6 429.3 9.3 429.1M991.7 430.0Q500.0 428.7 8.3 429.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 432.0Q11.5 324.7 10.3 217.5M11.0 431.4Q12.1 325.4 9.0 219.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="298.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">Queues for Kafka (KIP-932, early access in Kafka 4.0): share groups treat a topic as a queue. Fixes: one consumer per partition limit,</text><text x="500.0" y="320.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">head-of-line blocking, per-record failure and retry. Gives multiple instances per partition, individual acknowledgement, retries (default maximum 5),</text><text x="500.0" y="342.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">processing time-outs, and rewindable progress. Modern queue brokers may also offer replayable logs (Solace, RabbitMQ Streams) and unlimited TTL.</text><text x="500.0" y="364.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Use queues as input buffers for parallel work where order does not matter; use event streams as the backbone for data products.</text></svg>