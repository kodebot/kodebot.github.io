<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 145.3L10.7 144.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 79.7 495.0 146.2M494.9 12.9Q496.9 79.5 495.3 146.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 144.4Q252.6 147.2 8.7 144.5M496.4 144.7Q252.1 143.2 7.8 145.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event-driven (Fig 3-1)</text><text x="252.5" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">events drive the business logic as water turns a mill wheel;</text><text x="252.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the service does work only when events arrive (or a timer</text><text x="252.5" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fires, also an event); otherwise it is idle</text><path d="M504.1 14.9L990.2 14.7L990.7 144.7L506.0 144.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 79.6 989.3 146.3M989.2 13.5Q988.8 79.5 990.4 145.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 144.5Q747.1 145.0 502.9 144.1M990.9 145.2Q746.9 146.3 502.9 145.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 147.1Q507.7 80.5 505.3 13.9M504.8 147.0Q503.2 80.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Consumer group (Fig 3-2)</text><text x="747.5" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">instances viewed as one logical consumer; each partition</text><text x="747.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">goes to one instance; each tracks its own offset per</text><text x="747.5" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">partition; a new instance triggers rebalancing</text><path d="M11.1 159.0L990.3 160.4L990.5 268.8L9.4 271.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 159.4Q500.0 161.4 991.6 159.4M9.6 160.2Q500.0 160.6 990.5 160.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 159.2Q991.8 214.8 990.3 270.5M991.1 157.5Q988.9 214.0 989.8 270.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 269.6Q499.5 271.6 8.0 270.0M992.1 269.3Q500.2 268.6 8.4 269.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 271.3Q11.8 215.2 10.1 159.1M9.5 272.4Q9.6 215.1 10.0 157.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="210.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">The offset is the position of the current event from the start of the stream. Offsets let several consumers track progress independently.</text><text x="500.0" y="232.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">State, especially local state, may also need rebalancing when partitions move (Chapter 8).</text><path d="M9.3 285.1L991.1 285.8L991.1 386.1L9.7 383.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 285.8Q499.6 287.0 990.6 285.5M7.6 285.4Q499.4 287.4 991.1 285.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 283.1Q991.1 334.9 990.5 386.8M990.0 284.0Q990.4 334.8 989.1 385.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 385.4Q500.6 384.3 9.3 384.1M991.7 385.0Q500.0 383.7 8.3 384.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 387.0Q11.2 334.7 10.3 282.5M11.0 386.4Q11.7 335.4 9.0 284.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="330.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">A consumer service uses compute, storage, network, source control, build and deploy tools, monitoring and logging like any other application;</text><text x="500.0" y="352.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">its output may be new events, API calls or other work.</text></svg>