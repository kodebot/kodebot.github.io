<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 105.3L10.7 104.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.5 59.7 495.0 106.2M494.9 12.9Q496.5 59.5 495.3 106.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 104.4Q252.6 107.2 8.7 104.5M496.4 104.7Q252.1 103.2 7.8 105.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 106.0Q10.1 59.3 10.1 12.7M10.2 105.9Q8.7 60.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="44.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Boundaries and scope</text><text x="252.5" y="66.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">map services to bounded contexts to avoid</text><text x="252.5" y="88.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">guesswork about what each service owns</text><path d="M504.1 14.9L990.2 14.7L990.7 104.7L506.0 104.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.2 59.6 989.3 106.3M989.2 13.5Q989.0 59.5 990.4 105.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 104.5Q747.1 105.0 502.9 104.1M990.9 105.2Q746.9 106.3 502.9 105.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 107.1Q507.2 60.5 505.3 13.9M504.8 107.0Q503.5 60.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="44.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Scalability</text><text x="747.5" y="66.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">scale horizontally or vertically; compute either per</text><text x="747.5" y="88.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">service or a shared pool; built-in scaling is attractive</text><path d="M11.1 114.0L495.3 115.4L495.5 203.8L9.4 206.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 114.4Q252.5 116.4 496.6 114.4M9.6 115.2Q252.5 115.6 495.5 115.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 114.2Q496.6 159.8 495.3 205.5M496.1 112.5Q494.1 159.0 494.8 205.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 204.6Q252.0 206.6 8.0 205.0M497.1 204.3Q252.7 203.6 8.4 204.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 206.3Q11.6 160.2 10.1 114.1M9.5 207.4Q9.6 160.1 10.0 112.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="144.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">State management</text><text x="252.5" y="166.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">solely responsible for creates, reads, updates and</text><text x="252.5" y="188.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">deletes of its own store, including disk and testing</text><path d="M504.3 115.1L991.1 115.8L991.1 206.1L504.7 203.8Z" fill="#efe0ca" stroke="none"/><path d="M503.5 115.8Q747.1 117.0 990.6 115.5M502.6 115.4Q746.9 117.4 991.1 115.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 113.1Q991.1 159.9 990.5 206.8M990.0 114.0Q990.4 159.8 989.1 205.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 205.4Q748.1 204.3 504.3 204.1M991.7 205.0Q747.5 203.7 503.3 204.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 207.0Q506.2 159.7 505.3 112.5M506.0 206.4Q506.6 160.4 504.0 114.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="144.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Stream progress</text><text x="747.5" y="166.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">track offsets (Kafka consumer group per service);</text><text x="747.5" y="188.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">may manage offsets manually to replay</text><path d="M9.1 214.1L494.6 214.3L494.6 305.2L9.4 305.1Z" fill="#eed5cc" stroke="none"/><path d="M7.7 214.3Q252.3 216.0 496.8 214.3M9.1 214.1Q252.6 217.8 496.2 215.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.0 214.4Q496.5 260.4 494.4 306.3M495.1 213.9Q495.7 260.2 495.0 306.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.4 305.6Q252.7 304.2 8.1 304.5M497.5 304.0Q252.7 304.8 7.9 304.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 306.0Q10.9 259.9 11.0 213.7M10.3 305.5Q10.2 259.3 9.6 213.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="244.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Failure recovery</text><text x="252.5" y="266.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">resume from last good offsets (duplicates possible);</text><text x="252.5" y="288.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">snapshots, restore from streams, replay (Chapter 8)</text><path d="M504.5 214.2L989.1 215.5L990.6 304.4L504.8 306.2Z" fill="#dfd6e7" stroke="none"/><path d="M503.0 214.5Q747.7 211.6 992.4 215.0M502.8 215.6Q747.6 216.6 992.4 215.2" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 212.6Q990.1 260.1 990.3 307.5M990.0 213.5Q988.7 260.2 990.9 307.0" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 305.9Q747.6 302.3 503.9 304.2M991.4 304.3Q747.7 301.8 504.0 305.4" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 307.5Q507.4 260.3 504.3 213.2M504.8 307.3Q506.9 260.3 504.7 213.3" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="244.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Single writer per stream</text><text x="747.5" y="266.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one producing service owns each stream: known</text><text x="747.5" y="288.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">source of truth and lineage; enforce with access control</text><path d="M11.0 314.5L495.5 314.4L494.4 406.1L8.8 404.1Z" fill="#d3dbe0" stroke="none"/><path d="M8.7 313.9Q252.1 311.7 495.6 314.7M9.2 315.4Q253.3 314.5 497.4 315.8" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.2 313.5Q492.8 360.4 494.0 407.3M495.6 313.4Q495.9 360.1 495.7 406.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.5 404.2Q252.9 404.3 8.2 405.1M495.6 404.0Q252.5 406.3 9.4 404.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.8 406.2Q11.1 360.2 10.5 314.3M9.9 405.7Q8.5 359.1 8.9 312.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="344.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Keys and partitioning</text><text x="252.5" y="366.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">choose the output key and partition (same key, same</text><text x="252.5" y="388.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">partition; round-robin, random or custom possible)</text><path d="M505.7 316.1L988.9 315.6L991.1 405.6L504.4 405.8Z" fill="#d0dfdc" stroke="none"/><path d="M502.8 314.2Q746.7 316.5 990.5 315.6M502.8 314.5Q747.1 316.6 991.5 314.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 314.3Q991.8 360.6 990.7 407.0M988.9 313.1Q989.4 359.8 990.1 406.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.7 405.8Q747.2 407.3 502.7 405.8M990.7 405.8Q747.5 403.8 504.3 405.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.7 406.6Q505.7 360.5 504.8 314.5M504.5 405.6Q505.8 359.4 504.0 313.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="344.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Schemas and data contracts</text><text x="747.5" y="366.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">define field names, types and defaults with Avro,</text><text x="747.5" y="388.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Protobuf or JSON schema (Chapter 4)</text></svg>