<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="420" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 115.3L10.7 114.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.4 64.7 495.0 116.2M494.9 12.9Q496.6 64.5 495.3 116.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 114.4Q252.6 117.2 8.7 114.5M496.4 114.7Q252.1 113.2 7.8 115.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 116.0Q10.1 64.3 10.1 12.7M10.2 115.9Q8.7 65.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="49.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Backward</text><text x="252.5" y="71.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">new schema reads old data</text><text x="252.5" y="93.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(deleting a field is backward compatible)</text><path d="M504.1 14.9L990.2 14.7L990.7 114.7L506.0 114.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.3 64.6 989.3 116.3M989.2 13.5Q988.9 64.5 990.4 115.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 114.5Q747.1 115.0 502.9 114.1M990.9 115.2Q746.9 116.3 502.9 115.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 117.1Q507.3 65.5 505.3 13.9M504.8 117.0Q503.4 65.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="49.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Forward</text><text x="747.5" y="71.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">old schema reads new data; needs a default</text><text x="747.5" y="93.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">so the missing field can be filled at read time</text><path d="M11.1 124.0L495.3 125.4L495.5 223.8L9.4 226.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 124.4Q252.5 126.4 496.6 124.4M9.6 125.2Q252.5 125.6 495.5 125.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 124.2Q496.7 174.8 495.3 225.5M496.1 122.5Q494.0 174.0 494.8 225.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 224.6Q252.0 226.6 8.0 225.0M497.1 224.3Q252.7 223.6 8.4 224.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 226.3Q11.7 175.2 10.1 124.1M9.5 227.4Q9.6 175.1 10.0 122.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="159.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Full</text><text x="252.5" y="181.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">convertible both forward and backward</text><text x="252.5" y="203.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">to the immediately adjacent version</text><path d="M504.3 125.1L991.1 125.8L991.1 226.1L504.7 223.8Z" fill="#d3dbe0" stroke="none"/><path d="M503.5 125.8Q747.1 127.0 990.6 125.5M502.6 125.4Q746.9 127.4 991.1 125.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 123.1Q991.1 174.9 990.5 226.8M990.0 124.0Q990.4 174.8 989.1 225.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 225.4Q748.1 224.3 504.3 224.1M991.7 225.0Q747.5 223.7 503.3 224.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 227.0Q506.2 174.7 505.3 122.5M506.0 226.4Q506.7 175.4 504.0 124.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="159.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Full-transitive</text><text x="747.5" y="181.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">convertible to any other version in the stream:</text><text x="747.5" y="203.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the strongest guarantee, the best place to start</text><path d="M9.1 234.1L989.6 234.3L989.6 410.2L9.4 410.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 234.3Q499.8 236.0 991.8 234.3M9.1 234.1Q500.1 237.8 991.2 235.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 234.4Q992.1 322.9 989.4 411.3M990.1 233.9Q990.8 322.7 990.0 411.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 410.6Q500.2 409.2 8.1 409.5M992.5 409.0Q500.2 409.8 7.9 409.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 411.0Q10.9 322.4 11.0 233.7M10.3 410.5Q10.2 321.8 9.6 233.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="295.5" font-size="16.0" fill="#3b2f20" text-anchor="middle">Defaults are applied at read time and only if the record lacks the field (unlike a database default applied at write time).</text><text x="500.0" y="317.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">Example: version 1 has id and foobar with no default; version 2 drops foobar. Version 2 is backward compatible, but not forward compatible</text><text x="500.0" y="339.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">until version 1 gets a default such as DEFAULT_VALUE_STRING (a marker for &#x27;missing&#x27;, not a real null).</text><text x="500.0" y="361.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">You can loosen compatibility later but it is extremely hard to tighten it. Protobuf v3 removed custom defaults, so it suits evolution less.</text></svg>