<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="470" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 120.3L10.7 119.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.4 67.2 990.0 121.2M989.9 12.9Q991.6 67.0 990.3 121.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 119.4Q500.1 122.2 8.7 119.5M991.4 119.7Q499.6 118.2 7.8 120.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 121.0Q10.1 66.8 10.1 12.7M10.2 120.9Q8.6 67.6 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="62.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">A data contract is the compact between a producer and all consumers past, present and future: the schema(s), service-level objectives, ownership,</text><text x="500.0" y="84.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">access restrictions, field-level encryption and schema evolution rules. Not every stream needs one: tightly coupled, same-team workflows may skip it.</text><path d="M9.1 134.9L247.2 134.7L247.7 224.7L11.0 224.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 134.3Q128.2 135.9 248.0 134.1M7.7 134.3Q128.1 136.7 248.5 134.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M246.9 132.9Q248.2 179.6 246.3 226.3M246.2 133.5Q246.0 179.5 247.4 225.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M248.3 224.5Q128.1 225.0 7.9 224.1M247.9 225.2Q127.9 226.3 7.9 225.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 227.1Q12.2 180.5 10.3 133.9M9.8 227.0Q8.5 180.2 9.0 133.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="128.5" y="175.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1. Design</text><text x="128.5" y="197.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">owner proposes the new schema</text><path d="M258.1 134.0L494.3 135.4L494.5 223.8L256.4 226.1Z" fill="#d6e1cf" stroke="none"/><path d="M255.4 134.4Q375.5 136.4 495.6 134.4M256.6 135.2Q375.5 135.6 494.5 135.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 134.2Q495.6 179.8 494.3 225.5M495.1 132.5Q493.1 179.0 493.8 225.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.1 224.6Q375.0 226.6 255.0 225.0M496.1 224.3Q375.7 223.6 255.4 224.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M257.6 226.3Q258.6 180.2 257.1 134.1M256.5 227.4Q256.6 180.1 257.0 132.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="375.5" y="175.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2. Consult</text><text x="375.5" y="197.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumers review and approve</text><path d="M503.3 135.1L742.1 135.8L742.1 226.1L503.7 223.8Z" fill="#efe0ca" stroke="none"/><path d="M502.5 135.8Q622.1 137.0 741.6 135.5M501.6 135.4Q621.9 137.4 742.1 135.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M740.9 133.1Q742.1 179.9 741.5 226.8M741.0 134.0Q741.4 179.8 740.1 225.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M743.0 225.4Q623.1 224.3 503.3 224.1M742.7 225.0Q622.5 223.7 502.3 224.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M503.9 227.0Q505.2 179.7 504.3 132.5M505.0 226.4Q505.6 180.4 503.0 134.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="622.5" y="175.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3. Plan</text><text x="622.5" y="197.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">release, migration, deprecation</text><path d="M750.1 134.1L987.6 134.3L987.6 225.2L750.4 225.1Z" fill="#eed5cc" stroke="none"/><path d="M748.7 134.3Q869.3 136.0 989.8 134.3M750.1 134.1Q869.6 137.8 989.2 135.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M988.0 134.4Q989.5 180.4 987.4 226.3M988.1 133.9Q988.7 180.2 988.0 226.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.4 225.6Q869.7 224.2 749.1 224.5M990.5 224.0Q869.7 224.8 748.9 224.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M751.9 226.0Q751.9 179.9 752.0 133.7M751.3 225.5Q751.2 179.3 750.6 133.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="869.5" y="175.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">4. Execute</text><text x="869.5" y="197.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">run old and new streams side by side</text><path d="M9.5 239.2L989.1 240.5L990.6 459.4L9.8 461.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 239.5Q500.2 236.6 992.4 240.0M7.8 240.6Q500.1 241.6 992.4 240.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 237.6Q989.9 350.1 990.3 462.5M990.0 238.5Q988.2 350.2 990.9 462.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 460.9Q500.1 457.3 8.9 459.2M991.4 459.3Q500.2 456.8 9.0 460.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 462.5Q13.0 350.3 9.3 238.2M9.8 462.3Q12.6 350.3 9.7 238.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="323.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Breaking change (User to User_v2: address string becomes home_address and work_address objects):</text><text x="500.0" y="345.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">history is hard: the old address is not known to be home or work, and a backfill captures only the current point in time.</text><text x="500.0" y="367.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Support both streams for a period such as 8 to 12 weeks; mark the old one deprecated to block new consumers and redirect them.</text><text x="500.0" y="389.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Set a hard cut-off date and send many warnings, or consumers will never migrate; never run two versions indefinitely (inconsistent data, outages, debt).</text></svg>