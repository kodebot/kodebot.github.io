<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="440" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 165.3L10.7 164.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 89.7 330.0 166.2M329.9 12.9Q331.9 89.5 330.3 166.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 164.4Q170.1 167.2 8.7 164.5M331.4 164.7Q169.6 163.2 7.8 165.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 166.0Q10.0 89.3 10.1 12.7M10.2 165.9Q8.5 90.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="63.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">State event</text><text x="170.0" y="85.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">full state of an entity at a time (a database row);</text><text x="170.0" y="107.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">also level, noun or fact events</text><text x="170.0" y="129.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Item, Order, Payment, Driver</text><path d="M339.1 14.9L660.2 14.7L660.7 164.7L341.0 164.8Z" fill="#efe0ca" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 89.6 659.3 166.3M659.2 13.5Q658.8 89.5 660.4 165.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 164.5Q499.6 165.0 337.9 164.1M660.9 165.2Q499.4 166.3 337.9 165.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 167.1Q342.7 90.5 340.3 13.9M339.8 167.0Q338.2 90.2 339.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="63.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Delta event</text><text x="500.0" y="85.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">the transition between states; only what changed;</text><text x="500.0" y="107.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">also edge, verb or action events</text><text x="500.0" y="129.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">itemAddedToCart, orderShipped</text><path d="M671.1 14.0L990.3 15.4L990.5 163.8L669.4 166.1Z" fill="#eed5cc" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 89.8 990.3 165.5M991.1 12.5Q988.6 89.0 989.8 165.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 164.6Q829.5 166.6 668.0 165.0M992.1 164.3Q830.2 163.6 668.4 164.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 166.3Q672.0 90.2 670.1 14.1M669.5 167.4Q669.6 90.1 670.0 12.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="63.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Hybrid event</text><text x="830.0" y="85.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">state plus a bit of why or how;</text><text x="830.0" y="107.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">usually a kludge when a rework is not possible;</text><text x="830.0" y="129.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">couples consumers to the producer</text><path d="M9.3 180.1L496.1 180.8L496.1 291.1L9.7 288.8Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 180.8Q252.1 182.0 495.6 180.5M7.6 180.4Q251.9 182.4 496.1 180.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 178.1Q496.2 234.9 495.5 291.8M495.0 179.0Q495.5 234.8 494.1 290.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 290.4Q253.1 289.3 9.3 289.1M496.7 290.0Q252.5 288.7 8.3 289.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 292.0Q11.3 234.7 10.3 177.5M11.0 291.4Q11.9 235.4 9.0 179.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="219.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Three stages of any change (Fig 5-1)</text><text x="252.5" y="241.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">initial state, the delta, the final state (which is the</text><text x="252.5" y="263.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">initial state of the next change)</text><path d="M504.1 179.1L989.6 179.3L989.6 290.2L504.4 290.1Z" fill="#d0dfdc" stroke="none"/><path d="M502.7 179.3Q747.3 181.0 991.8 179.3M504.1 179.1Q747.6 182.8 991.2 180.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 179.4Q991.8 235.4 989.4 291.3M990.1 178.9Q990.7 235.2 990.0 291.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 290.6Q747.7 289.2 503.1 289.5M992.5 289.0Q747.7 289.8 502.9 289.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 291.0Q505.9 234.9 506.0 178.7M505.3 290.5Q505.2 234.3 504.6 178.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="219.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Inferring change from state (Fig 5-2)</text><text x="747.5" y="241.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">compare the new state event with the previous one for the</text><text x="747.5" y="263.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">key: name, price and stock changed, so react</text><path d="M9.5 304.2L989.1 305.5L990.6 429.4L9.8 431.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 304.5Q500.2 301.6 992.4 305.0M7.8 305.6Q500.1 306.6 992.4 305.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 302.6Q989.9 367.6 990.3 432.5M990.0 303.5Q988.3 367.7 990.9 432.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 430.9Q500.1 427.3 8.9 429.2M991.4 429.3Q500.2 426.8 9.0 430.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 432.5Q12.9 367.8 9.3 303.2M9.8 432.3Q12.5 367.8 9.7 303.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="362.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">State events give: event-carried state transfer, easy materialisation, strong decoupling (the producer&#x27;s bounded context owns the shape),</text><text x="500.0" y="384.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">and inferable changes. Measurement and notification events are the other two kinds covered later in the chapter.</text></svg>