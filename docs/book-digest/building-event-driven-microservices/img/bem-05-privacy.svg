<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Right to be forgotten</text><text x="252.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">GDPR Article 17: delete personal data on request without</text><text x="252.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">significant delay; streams are immutable, so encrypt first</text><text x="252.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(field-level or whole event); keys in a KMS, one per user,</text><text x="252.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">account or other entity</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Crypto-shredding</text><text x="747.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">delete the key in the KMS and all encrypted data becomes</text><text x="747.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">inaccessible everywhere at once, including backups and cold</text><text x="747.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">storage; usually sufficient but check with your lawyers;</text><text x="747.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">does not stop consumers storing decrypted data or keys</text><path d="M11.1 219.0L990.3 220.4L990.5 388.8L9.4 391.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 219.4Q500.0 221.4 991.6 219.4M9.6 220.2Q500.0 220.6 990.5 220.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 219.2Q991.9 304.8 990.3 390.5M991.1 217.5Q988.6 304.0 989.8 390.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 389.6Q499.5 391.6 8.0 390.0M992.1 389.3Q500.2 388.6 8.4 389.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 391.3Q12.0 305.2 10.1 219.1M9.5 392.4Q9.6 305.1 10.0 217.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="289.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Why it matters: large data in backups, tape and cold storage is expensive to rewrite; partial encryption keeps non-PII data useful; deletion across many</text><text x="500.0" y="311.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">systems happens at once; encrypted leaks are less damaging (defence in depth). Consumers should keep the same encryption in their stores, avoid storing sensitive</text><text x="500.0" y="333.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">data, limit key retention and never write decrypted data to disk. Adding encryption later is usually a breaking change, so design it in early.</text></svg>