<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="440" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 215.3L10.7 214.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 114.7 495.0 216.2M494.9 12.9Q496.9 114.5 495.3 216.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 214.4Q252.6 217.2 8.7 214.5M496.4 214.7Q252.1 213.2 7.8 215.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 216.0Q10.0 114.3 10.1 12.7M10.2 215.9Q8.5 115.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Current state events (preferred)</text><text x="252.5" y="99.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">lean (small, less network), simple (history by replaying offsets;</text><text x="252.5" y="121.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">compaction per stream), compactable (size follows unique keys)</text><text x="252.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">agnostic to why it changed: no coupling to internal transitions</text><text x="252.5" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumers keep their own state to detect transitions</text><path d="M504.1 14.9L990.2 14.7L990.7 214.7L506.0 214.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 114.6 989.3 216.3M989.2 13.5Q988.8 114.5 990.4 215.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 214.5Q747.1 215.0 502.9 214.1M990.9 215.2Q746.9 216.3 502.9 215.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 217.1Q507.7 115.5 505.3 13.9M504.8 217.0Q503.2 115.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="66.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Before/after state events</text><text x="747.5" y="88.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">common in change-data capture (Debezium)</text><text x="747.5" y="110.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">benefit: simple transitions in one event; stateless detection of</text><text x="747.5" y="132.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one move (breaks on Madagascar to Ethiopia to Canada)</text><text x="747.5" y="154.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">drawbacks: deletion sets only &#x27;after&#x27; to null, not a tombstone;</text><text x="747.5" y="176.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">old data lingers in &#x27;before&#x27;; roughly double storage and network</text><path d="M11.1 229.0L990.3 230.4L990.5 428.8L9.4 431.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 229.4Q500.0 231.4 991.6 229.4M9.6 230.2Q500.0 230.6 990.5 230.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 229.2Q991.9 329.8 990.3 430.5M991.1 227.5Q988.6 329.0 989.8 430.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 429.6Q499.5 431.6 8.0 430.0M992.1 429.3Q500.2 428.6 8.4 429.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 431.3Q12.0 330.2 10.1 229.1M9.5 432.4Q9.6 330.1 10.0 227.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="303.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">Compaction problem (Fig 5-3): a deletion before/after event is not recognised as a tombstone by Kafka, so a second tombstone event must follow,</text><text x="500.0" y="325.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">then the broker compacts the data away eventually (a delay remains where old data can leak).</text><text x="500.0" y="347.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Doubling data matters at high volume: cross-region transfer fees, broker disk and replication.</text><text x="500.0" y="369.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">The book&#x27;s verdict: current state events are far better; consumers keep only the state they care about, and disk is relatively cheap.</text></svg>