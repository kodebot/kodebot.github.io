<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="440" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 145.3L10.7 144.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 79.7 495.0 146.2M494.9 12.9Q496.9 79.5 495.3 146.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 144.4Q252.6 147.2 8.7 144.5M496.4 144.7Q252.1 143.2 7.8 145.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Data liberation (Fig 6-1, 6-2)</text><text x="252.5" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">publish cross-domain data sets to event streams; replaces</text><text x="252.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">point-to-point queries to a legacy system with coupling</text><text x="252.5" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">only on the streams (single source of truth)</text><path d="M504.1 14.9L990.2 14.7L990.7 144.7L506.0 144.8Z" fill="#eed5cc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 79.6 989.3 146.3M989.2 13.5Q988.8 79.5 990.4 145.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 144.5Q747.1 145.0 502.9 144.1M990.9 145.2Q746.9 146.3 502.9 145.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 147.1Q507.7 80.5 505.3 13.9M504.8 147.0Q503.2 80.2 504.0 13.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Dual write antipattern (Fig 6-3)</text><text x="747.5" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">writing a data store and a stream independently cannot be</text><text x="747.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">atomic; one commit succeeds, the other fails, and the two</text><text x="747.5" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">diverge permanently once retries are exhausted</text><path d="M11.1 159.0L330.3 160.4L330.5 288.8L9.4 291.1Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 159.4Q170.0 161.4 331.6 159.4M9.6 160.2Q170.0 160.6 330.5 160.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.9 159.2Q331.9 224.8 330.3 290.5M331.1 157.5Q328.6 224.0 329.8 290.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.1 289.6Q169.5 291.6 8.0 290.0M332.1 289.3Q170.2 288.6 8.4 289.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 291.3Q12.0 225.2 10.1 159.1M9.5 292.4Q9.6 225.1 10.0 157.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="220.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Query-based</text><text x="170.0" y="242.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">query the state store; works on any store</text><path d="M339.3 160.1L661.1 160.8L661.1 291.1L339.7 288.8Z" fill="#d6e1cf" stroke="none"/><path d="M338.5 160.8Q499.6 162.0 660.6 160.5M337.6 160.4Q499.4 162.4 661.1 160.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 158.1Q661.3 224.9 660.5 291.8M660.0 159.0Q660.6 224.8 659.1 290.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M662.0 290.4Q500.6 289.3 339.3 289.1M661.7 290.0Q500.0 288.7 338.3 289.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.9 292.0Q341.5 224.7 340.3 157.5M341.0 291.4Q342.1 225.4 339.0 159.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="209.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Log-based (CDC)</text><text x="500.0" y="231.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">follow the store&#x27;s append-only log;</text><text x="500.0" y="253.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">only for stores that keep one</text><path d="M669.1 159.1L989.6 159.3L989.6 290.2L669.4 290.1Z" fill="#efe0ca" stroke="none"/><path d="M667.7 159.3Q829.8 161.0 991.8 159.3M669.1 159.1Q830.1 162.8 991.2 160.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 159.4Q992.1 225.4 989.4 291.3M990.1 158.9Q990.8 225.2 990.0 291.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 290.6Q830.2 289.2 668.1 289.5M992.5 289.0Q830.2 289.8 667.9 289.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.9 291.0Q670.9 224.9 671.0 158.7M670.3 290.5Q670.2 224.3 669.6 158.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="209.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Outbox table</text><text x="830.0" y="231.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">write to an output table in the same</text><text x="830.0" y="253.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">transaction; another process publishes</text><path d="M9.5 304.2L989.1 305.5L990.6 429.4L9.8 431.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 304.5Q500.2 301.6 992.4 305.0M7.8 305.6Q500.1 306.6 992.4 305.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 302.6Q989.9 367.6 990.3 432.5M990.0 303.5Q988.3 367.7 990.9 432.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 430.9Q500.1 427.3 8.9 429.2M991.4 429.3Q500.2 426.8 9.0 430.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 432.5Q12.9 367.8 9.3 303.2M9.8 432.3Q12.5 367.8 9.7 303.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="351.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Liberated data must be the whole data set plus every later insert, update and delete. All three should emit events in timestamp order using the source record&#x27;s</text><text x="500.0" y="373.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">updated_at in the header, so the stream reflects when events happened, not when published. Two-phase commit is rarely supported by stores or brokers</text><text x="500.0" y="395.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Kafka&#x27;s 2PC project was still in progress at publication). Frameworks: Kafka Connect, Debezium, Apache NiFi.</text></svg>