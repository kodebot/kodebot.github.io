<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="470" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 205.3L10.7 204.2Z" fill="#efe0ca" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 109.7 330.0 206.2M329.9 12.9Q331.9 109.5 330.3 206.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 204.4Q170.1 207.2 8.7 204.5M331.4 204.7Q169.6 203.2 7.8 205.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Frequency</text><text x="170.0" y="94.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Inventory changes on every sale or return (Black</text><text x="170.0" y="116.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Friday): joining it re-emits Item each time; could</text><text x="170.0" y="138.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">emit periodically (5 or 30 seconds) at the cost of</text><text x="170.0" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">latency</text><path d="M339.1 14.9L660.2 14.7L660.7 204.7L341.0 204.8Z" fill="#eed5cc" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 109.6 659.3 206.3M659.2 13.5Q658.8 109.5 660.4 205.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 204.5Q499.6 205.0 337.9 204.1M660.9 205.2Q499.4 206.3 337.9 205.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 207.1Q342.7 110.5 340.3 13.9M339.8 207.0Q338.2 110.2 339.0 13.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="83.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Size</text><text x="500.0" y="105.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">top 100 reviews rarely change, but every Item or</text><text x="500.0" y="127.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">Reviews update re-emits the whole payload to</text><text x="500.0" y="149.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumers that do not care</text><path d="M671.1 14.0L990.3 15.4L990.5 203.8L669.4 206.1Z" fill="#d3dbe0" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 109.8 990.3 205.5M991.1 12.5Q988.6 109.0 989.8 205.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 204.6Q829.5 206.6 668.0 205.0M992.1 204.3Q830.2 203.6 668.4 204.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 206.3Q672.0 110.2 670.1 14.1M669.5 207.4Q669.6 110.1 670.0 12.8" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="83.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Both together</text><text x="830.0" y="105.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">high rate times large size compounds load on the</text><text x="830.0" y="127.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">broker, the eventification process and consumers;</text><text x="830.0" y="149.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">avoid joining in frequently changing or large data</text><path d="M9.3 220.1L496.1 220.8L496.1 336.1L9.7 333.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 220.8Q252.1 222.0 495.6 220.5M7.6 220.4Q251.9 222.4 496.1 220.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 218.1Q496.2 277.4 495.5 336.8M495.0 219.0Q495.5 277.3 494.1 335.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 335.4Q253.1 334.3 9.3 334.1M496.7 335.0Q252.5 333.7 8.3 334.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 337.0Q11.4 277.2 10.3 217.5M11.0 336.4Q11.9 277.9 9.0 219.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="261.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Type 1 SCD: overwrite</text><text x="252.5" y="283.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">keep only the latest (Ex 7-3, 7-4: premium_partner false</text><text x="252.5" y="305.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">to true); the broker may compact old events; no history</text><path d="M504.1 219.1L989.6 219.3L989.6 335.2L504.4 335.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 219.3Q747.3 221.0 991.8 219.3M504.1 219.1Q747.6 222.8 991.2 220.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 219.4Q991.9 277.9 989.4 336.3M990.1 218.9Q990.8 277.7 990.0 336.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 335.6Q747.7 334.2 503.1 334.5M992.5 334.0Q747.7 334.8 502.9 334.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 336.0Q505.9 277.4 506.0 218.7M505.3 335.5Q505.2 276.8 504.6 218.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="261.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Type 2 SCD: append</text><text x="747.5" y="283.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">keep versions with version IDs (Ex 7-5); consumers see</text><text x="747.5" y="305.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">history, must choose which value to join; more verbose</text><path d="M9.5 349.2L989.1 350.5L990.6 459.4L9.8 461.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 349.5Q500.2 346.6 992.4 350.0M7.8 350.6Q500.1 351.6 992.4 350.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 347.6Q990.0 405.1 990.3 462.5M990.0 348.5Q988.5 405.2 990.9 462.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 460.9Q500.1 457.3 8.9 459.2M991.4 459.3Q500.2 456.8 9.0 460.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 462.5Q12.7 405.3 9.3 348.2M9.8 462.3Q12.3 405.3 9.7 348.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="400.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Fig 7-3: the Enriched_Item joins the commonly used data and omits Reviews (size) and Inventory (frequency). A slowly changing dimension is usually static but can change</text><text x="500.0" y="422.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">unpredictably (a merchant&#x27;s name). Type 1 is the usual default for state events; consumers opt in to keeping previous values in their own store.</text></svg>