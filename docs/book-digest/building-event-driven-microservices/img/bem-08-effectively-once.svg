<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 215.3L10.7 214.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 114.7 495.0 216.2M494.9 12.9Q496.9 114.5 495.3 216.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 214.4Q252.6 217.2 8.7 214.5M496.4 214.7Q252.1 213.2 7.8 215.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 216.0Q10.0 114.3 10.1 12.7M10.2 215.9Q8.5 115.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Effectively once (client-broker transactions)</text><text x="252.5" y="99.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">commit output events, changelog events and consumer offsets in one</text><text x="252.5" y="121.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">atomic broker transaction (Kafka, Pulsar); consumers skip uncommitted</text><text x="252.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">transactions; on a fatal error the replacement restores from</text><text x="252.5" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">changelogs and the last good offsets (Fig 8-14 to 8-16)</text><path d="M504.1 14.9L990.2 14.7L990.7 214.7L506.0 214.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 114.6 989.3 216.3M989.2 13.5Q988.8 114.5 990.4 215.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 214.5Q747.1 215.0 502.9 214.1M990.9 215.2Q746.9 216.3 502.9 215.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 217.1Q507.7 115.5 505.3 13.9M504.8 217.0Q503.2 115.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Why &#x27;effectively&#x27;, not exactly</text><text x="747.5" y="99.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the logic and its side effects (calls to external endpoints) may</text><text x="747.5" y="121.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">still run more than once for an event</text><text x="747.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">idempotent writes (producer ID plus sequence) stop duplicate</text><text x="747.5" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">records on retries but not duplicates from faulty business logic</text><path d="M11.1 229.0L495.3 230.4L495.5 428.8L9.4 431.1Z" fill="#eed5cc" stroke="none"/><path d="M8.4 229.4Q252.5 231.4 496.6 229.4M9.6 230.2Q252.5 230.6 495.5 230.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 229.2Q496.9 329.8 495.3 430.5M496.1 227.5Q493.6 329.0 494.8 430.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 429.6Q252.0 431.6 8.0 430.0M497.1 429.3Q252.7 428.6 8.4 429.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 431.3Q12.0 330.2 10.1 229.1M9.5 432.4Q9.6 330.1 10.0 227.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="292.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Without broker transactions</text><text x="252.5" y="314.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">duplicates arise when an ack is lost and a retry occurs, or the</text><text x="252.5" y="336.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">producer crashes before updating offsets; a unique dedupe ID</text><text x="252.5" y="358.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(from high-cardinality fields) lets consumers deduplicate;</text><text x="252.5" y="380.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">keep a store with TTL and a size cap, within one partition (Fig 8-17)</text><path d="M504.3 230.1L991.1 230.8L991.1 431.1L504.7 428.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.5 230.8Q747.1 232.0 990.6 230.5M502.6 230.4Q746.9 232.4 991.1 230.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 228.1Q991.3 329.9 990.5 431.8M990.0 229.0Q990.6 329.8 989.1 430.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 430.4Q748.1 429.3 504.3 429.1M991.7 430.0Q747.5 428.7 503.3 429.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 432.0Q506.5 329.7 505.3 227.5M506.0 431.4Q507.1 330.4 504.0 229.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="292.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">State store transactions (Fig 8-18 to 8-20)</text><text x="747.5" y="314.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">keep the input offsets in the data store and update state and</text><text x="747.5" y="336.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">offsets in one transaction; recover to the last good state;</text><text x="747.5" y="358.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">gives effectively once processing but not production:</text><text x="747.5" y="380.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">output is still at-least-once</text><path d="M9.1 444.1L989.6 444.3L989.6 510.2L9.4 510.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 444.3Q499.8 446.0 991.8 444.3M9.1 444.1Q500.1 447.8 991.2 445.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 444.4Q991.2 477.9 989.4 511.3M990.1 443.9Q990.6 477.7 990.0 511.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 510.6Q500.2 509.2 8.1 509.5M992.5 509.0Q500.2 509.8 7.9 509.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 511.0Q10.9 477.4 11.0 443.7M10.3 510.5Q10.1 476.8 9.6 443.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="472.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Example: an inventory accounting service sums additions and subtractions to emit a low-stock purchase event; at-least-once or at-most-once would give wrong totals (Fig</text><text x="500.0" y="494.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">8-13).</text></svg>