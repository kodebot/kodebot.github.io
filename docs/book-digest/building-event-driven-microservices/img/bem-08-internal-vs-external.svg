<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 235.3L10.7 234.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 124.7 495.0 236.2M494.9 12.9Q496.9 124.5 495.3 236.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 234.4Q252.6 237.2 8.7 234.5M496.4 234.7Q252.1 233.2 7.8 235.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 236.0Q10.0 124.3 10.1 12.7M10.2 235.9Q8.5 125.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="76.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Internal: advantages</text><text x="252.5" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">scalability offloaded to broker and compute (add instances)</text><text x="252.5" y="120.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">fast local disk: RocksDB on SSD about 65 microseconds per read,</text><text x="252.5" y="142.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">ceiling about 15.4k requests per second; memory far faster</text><text x="252.5" y="164.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">network-attached disk: 1 ms round trip cuts it to 939 per second,</text><text x="252.5" y="186.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">but the volume can be reattached after a restart</text><path d="M504.1 14.9L990.2 14.7L990.7 234.7L506.0 234.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 124.6 989.3 236.3M989.2 13.5Q988.8 124.5 990.4 235.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 234.5Q747.1 235.0 502.9 234.1M990.9 235.2Q746.9 236.3 502.9 235.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 237.1Q507.7 125.5 505.3 13.9M504.8 237.0Q503.2 125.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="76.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Internal: disadvantages</text><text x="747.5" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">limited to disk attached at runtime; resizing needs a halt and</text><text x="747.5" y="120.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">volumes can often only grow; wasted disk for cyclical traffic</text><text x="747.5" y="142.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(3 p.m. versus 3 a.m.) compared with pay-per-byte services</text><text x="747.5" y="164.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Related fix, hot replicas (Fig 8-9 to 8-11): a standby copy of each partition</text><text x="747.5" y="186.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">on another instance for zero-downtime failover, costing disk and CPU</text><path d="M11.1 249.0L495.3 250.4L495.5 448.8L9.4 451.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 249.4Q252.5 251.4 496.6 249.4M9.6 250.2Q252.5 250.6 495.5 250.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 249.2Q496.9 349.8 495.3 450.5M496.1 247.5Q493.6 349.0 494.8 450.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 449.6Q252.0 451.6 8.0 450.0M497.1 449.3Q252.7 448.6 8.4 449.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 451.3Q12.0 350.2 10.1 249.1M9.5 452.4Q9.6 350.1 10.0 247.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="312.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">External: advantages</text><text x="252.5" y="334.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">full data locality (lookups, relational and geospatial queries)</text><text x="252.5" y="356.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">state survives restarts and outages; familiar technology;</text><text x="252.5" y="378.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">good for basic producer/consumer (Chapter 11) and</text><text x="252.5" y="400.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">functions as a service (Chapter 15); use strong read-after-write</text><path d="M504.3 250.1L991.1 250.8L991.1 451.1L504.7 448.8Z" fill="#eed5cc" stroke="none"/><path d="M503.5 250.8Q747.1 252.0 990.6 250.5M502.6 250.4Q746.9 252.4 991.1 250.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 248.1Q991.3 349.9 990.5 451.8M990.0 249.0Q990.6 349.8 989.1 450.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 450.4Q748.1 449.3 504.3 449.1M991.7 450.0Q747.5 448.7 503.3 449.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 452.0Q506.5 349.7 505.3 247.5M506.0 451.4Q507.1 350.4 504.0 249.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="312.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">External: drawbacks</text><text x="747.5" y="334.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">extra technology to manage and scale (per team, from an approved</text><text x="747.5" y="356.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">list); network latency; higher financial cost; harder to debug a</text><text x="747.5" y="378.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">shared store; races and nondeterminism because each instance has its</text><text x="747.5" y="400.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">own stream time (a join key may not exist yet)</text><path d="M9.1 464.1L989.6 464.3L989.6 510.2L9.4 510.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 464.3Q499.8 466.0 991.8 464.3M9.1 464.1Q500.1 467.8 991.2 465.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 464.4Q990.9 487.9 989.4 511.3M990.1 463.9Q990.5 487.7 990.0 511.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 510.6Q500.2 509.2 8.1 509.5M992.5 509.0Q500.2 509.8 7.9 509.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 511.0Q10.9 487.4 11.0 463.7M10.3 510.5Q10.1 486.8 9.6 463.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="493.5" font-size="14.5" fill="#3b2f20" text-anchor="middle">Do not share state access between microservices: each materialises its own copy, trading extra storage and processing for decoupling.</text></svg>