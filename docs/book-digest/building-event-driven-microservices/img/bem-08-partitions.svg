<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="470" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 175.3L10.7 174.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 94.7 495.0 176.2M494.9 12.9Q496.9 94.5 495.3 176.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 174.4Q252.6 177.2 8.7 174.5M496.4 174.7Q252.1 173.2 7.8 175.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 176.0Q10.0 94.3 10.1 12.7M10.2 175.9Q8.5 95.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="57.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Partition assignment</text><text x="252.5" y="79.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Kafka: the first online client of the group (leader) assigns;</text><text x="252.5" y="101.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Pulsar: the broker assigns; work pauses during reassignment so</text><text x="252.5" y="123.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">revoked partitions are not still processed (no duplicate output);</text><text x="252.5" y="145.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">rebalance on join or when an instance is gone (for example a minute)</text><path d="M504.1 14.9L990.2 14.7L990.7 174.7L506.0 174.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 94.6 989.3 176.3M989.2 13.5Q988.8 94.5 990.4 175.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 174.5Q747.1 175.0 502.9 174.1M990.9 175.2Q746.9 176.3 502.9 175.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 177.1Q507.7 95.5 505.3 13.9M504.8 177.0Q503.2 95.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="57.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Repartitioning (Fig 8-1)</text><text x="747.5" y="79.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">new stream with a different partition count, key or partitioner;</text><text x="747.5" y="101.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">key unkeyed events by id into 3 partitions; may reorder events;</text><text x="747.5" y="123.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">gives key locality, not more throughput (2 partitions into 1,000</text><text x="747.5" y="145.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">is still limited by the 2-partition input)</text><path d="M11.1 189.0L495.3 190.4L495.5 328.8L9.4 331.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 189.4Q252.5 191.4 496.6 189.4M9.6 190.2Q252.5 190.6 495.5 190.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 189.2Q496.9 259.8 495.3 330.5M496.1 187.5Q493.6 259.0 494.8 330.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 329.6Q252.0 331.6 8.0 330.0M497.1 329.3Q252.7 328.6 8.4 329.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 331.3Q12.0 260.2 10.1 189.1M9.5 332.4Q9.6 260.1 10.0 187.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="233.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Copartitioning (Fig 8-2)</text><text x="252.5" y="255.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">same partition count and same assignor as another stream, so a</text><text x="252.5" y="277.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">join of a user event stream and a user entity stream keeps each</text><text x="252.5" y="299.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">key on one instance; frameworks infer it, basic clients need manual care</text><path d="M504.3 190.1L991.1 190.8L991.1 331.1L504.7 328.8Z" fill="#efe0ca" stroke="none"/><path d="M503.5 190.8Q747.1 192.0 990.6 190.5M502.6 190.4Q746.9 192.4 991.1 190.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 188.1Q991.3 259.9 990.5 331.8M990.0 189.0Q990.6 259.8 989.1 330.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 330.4Q748.1 329.3 504.3 329.1M991.7 330.0Q747.5 328.7 503.3 329.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 332.0Q506.5 259.7 505.3 187.5M506.0 331.4Q507.1 260.4 504.0 189.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="233.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Round-robin assignment (Fig 8-3, 8-4)</text><text x="747.5" y="255.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">three streams, two copartitioned: C0 and C1 share partitions;</text><text x="747.5" y="277.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">adding C2 and C3 spreads the rest; beyond the partition count,</text><text x="747.5" y="299.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">more instances add no parallelism</text><path d="M9.1 344.1L989.6 344.3L989.6 460.2L9.4 460.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 344.3Q499.8 346.0 991.8 344.3M9.1 344.1Q500.1 347.8 991.2 345.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 344.4Q991.9 402.9 989.4 461.3M990.1 343.9Q990.8 402.7 990.0 461.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 460.6Q500.2 459.2 8.1 459.5M992.5 459.0Q500.2 459.8 7.9 459.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 461.0Q10.9 402.4 11.0 343.7M10.3 460.5Q10.2 401.8 9.6 343.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="397.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">If order matters a lot, generate events in order in the same partition: here, key by id from the start. Partitions also drive state: state built from a</text><text x="500.0" y="419.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">revoked partition must move with it. Check your broker&#x27;s and framework&#x27;s rebalancing behaviour and test before production.</text></svg>