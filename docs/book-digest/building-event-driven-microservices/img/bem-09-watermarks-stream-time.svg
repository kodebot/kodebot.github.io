<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="510" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 185.3L10.7 184.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 99.7 495.0 186.2M494.9 12.9Q496.9 99.5 495.3 186.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 184.4Q252.6 187.2 8.7 184.5M496.4 184.7Q252.1 183.2 7.8 185.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 186.0Q10.0 99.3 10.1 12.7M10.2 185.9Q8.5 100.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="62.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event scheduling</text><text x="252.5" y="84.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">pick the next event across input partitions by event time;</text><text x="252.5" y="106.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the common choice is the oldest timestamp across all assigned</text><text x="252.5" y="128.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">partitions; present in many frameworks, absent from basic</text><text x="252.5" y="150.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumers; needed whenever order matters to the logic</text><path d="M504.1 14.9L990.2 14.7L990.7 184.7L506.0 184.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 99.6 989.3 186.3M989.2 13.5Q988.8 99.5 990.4 185.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 184.5Q747.1 185.0 502.9 184.1M990.9 185.2Q746.9 186.3 502.9 185.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 187.1Q507.7 100.5 505.3 13.9M504.8 187.0Q503.2 100.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="62.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Timestamp extraction and custom schedulers</text><text x="747.5" y="84.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">an extractor sets each record&#x27;s event time from key, value or</text><text x="747.5" y="106.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">metadata and it is used for the rest of processing; custom</text><text x="747.5" y="128.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">schedulers (Samza MessageChooser) are often nondeterministic;</text><text x="747.5" y="150.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">external request-response calls can break determinism</text><path d="M11.1 199.0L495.3 200.4L495.5 388.8L9.4 391.1Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 199.4Q252.5 201.4 496.6 199.4M9.6 200.2Q252.5 200.6 495.5 200.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 199.2Q496.9 294.8 495.3 390.5M496.1 197.5Q493.6 294.0 494.8 390.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 389.6Q252.0 391.6 8.0 390.0M497.1 389.3Q252.7 388.6 8.4 389.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 391.3Q12.0 295.2 10.1 199.1M9.5 392.4Q9.6 295.1 10.0 197.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="246.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Watermarks (Fig 9-3, 9-4)</text><text x="252.5" y="268.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">a special event injected by the framework: all events of time t or</text><text x="252.5" y="290.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">earlier have been processed; each node updates its event time and</text><text x="252.5" y="312.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">forwards it; a node with several inputs uses the minimum; events</text><text x="252.5" y="334.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">earlier than the watermark are late; Spark, Flink, Beam use a</text><text x="252.5" y="356.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">cluster and their own shuffle</text><path d="M504.3 200.1L991.1 200.8L991.1 391.1L504.7 388.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.5 200.8Q747.1 202.0 990.6 200.5M502.6 200.4Q746.9 202.4 991.1 200.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 198.1Q991.3 294.9 990.5 391.8M990.0 199.0Q990.6 294.8 989.1 390.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 390.4Q748.1 389.3 504.3 389.1M991.7 390.0Q747.5 388.7 503.3 389.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 392.0Q506.5 294.7 505.3 197.5M506.0 391.4Q507.1 295.4 504.0 199.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="246.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Stream time (Fig 9-5, 9-6)</text><text x="747.5" y="268.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Kafka Streams: the highest event timestamp seen by the node;</text><text x="747.5" y="290.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">events are scheduled from the buffers, each processed fully</text><text x="747.5" y="312.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(depth first) before the next; a repartition topic splits the</text><text x="747.5" y="334.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">topology into subtopologies with their own stream time;</text><text x="747.5" y="356.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a grace period delays advancing</text><path d="M9.1 404.1L989.6 404.3L989.6 500.2L9.4 500.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 404.3Q499.8 406.0 991.8 404.3M9.1 404.1Q500.1 407.8 991.2 405.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 404.4Q991.6 452.9 989.4 501.3M990.1 403.9Q990.7 452.7 990.0 501.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 500.6Q500.2 499.2 8.1 499.5M992.5 499.0Q500.2 499.8 7.9 499.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 501.0Q10.9 452.4 11.0 403.7M10.3 500.5Q10.2 451.8 9.6 403.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="447.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Watermarks do not change scheduling, they only mark what counts as late. Samza&#x27;s standalone mode uses watermarks with repartition streams. Further reading:</text><text x="500.0" y="469.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">Google&#x27;s watermark whitepaper; Akidau, Chernyak and Lax, Streaming Systems, chapters 2 and 3.</text></svg>