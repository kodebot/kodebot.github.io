<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 165.3L10.7 164.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 89.7 495.0 166.2M494.9 12.9Q496.9 89.5 495.3 166.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 164.4Q252.6 167.2 8.7 164.5M496.4 164.7Q252.1 163.2 7.8 165.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 166.0Q10.0 89.3 10.1 12.7M10.2 165.9Q8.5 90.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="52.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">What a BPC is</text><text x="252.5" y="74.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">basic consumer and producer clients only: no event scheduling,</text><text x="252.5" y="96.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">watermarks, materialisation, changelogs, or scaling beyond</text><text x="252.5" y="118.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumer group balancing; the whole workflow sits in one</text><text x="252.5" y="140.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">service; easy to start; usually an external state store</text><path d="M504.1 14.9L990.2 14.7L990.7 164.7L506.0 164.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 89.6 989.3 166.3M989.2 13.5Q988.8 89.5 990.4 165.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 164.5Q747.1 165.0 502.9 164.1M990.9 165.2Q746.9 166.3 502.9 165.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 167.1Q507.7 90.5 505.3 13.9M504.8 167.0Q503.2 90.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="52.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Sidecar (Fig 11-1, 11-2)</text><text x="747.5" y="74.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">a BPC sinks Product Info and Product Inventory streams into the</text><text x="747.5" y="96.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">frontend&#x27;s data store, replacing a scheduled batch copy, with no</text><text x="747.5" y="118.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">change to the legacy code; deployed as a Kubernetes sidecar or in</text><text x="747.5" y="140.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the same container; costs: testing and joint deploy and rollback</text><path d="M11.1 179.0L495.3 180.4L495.5 328.8L9.4 331.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 179.4Q252.5 181.4 496.6 179.4M9.6 180.2Q252.5 180.6 495.5 180.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 179.2Q496.9 254.8 495.3 330.5M496.1 177.5Q493.6 254.0 494.8 330.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 329.6Q252.0 331.6 8.0 330.0M497.1 329.3Q252.7 328.6 8.4 329.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 331.3Q12.0 255.2 10.1 179.1M9.5 332.4Q9.6 255.1 10.0 177.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="217.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Gating pattern (Fig 11-3)</text><text x="252.5" y="239.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">order does not matter but all must eventually arrive: a book needs</text><text x="252.5" y="261.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">contents, cover art and pricing before going to the printer;</text><text x="252.5" y="283.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">each event is materialised then the other tables are checked;</text><text x="252.5" y="305.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">ISBN 0010 published, 0011 waits for cover art</text><path d="M504.3 180.1L991.1 180.8L991.1 331.1L504.7 328.8Z" fill="#efe0ca" stroke="none"/><path d="M503.5 180.8Q747.1 182.0 990.6 180.5M502.6 180.4Q746.9 182.4 991.1 180.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 178.1Q991.3 254.9 990.5 331.8M990.0 179.0Q990.6 254.8 989.1 330.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 330.4Q748.1 329.3 504.3 329.1M991.7 330.0Q747.5 328.7 503.3 329.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 332.0Q506.5 254.7 505.3 177.5M506.0 331.4Q507.1 255.4 504.0 179.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="217.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Data store does the work</text><text x="747.5" y="239.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">geospatial, document or ML stores: classify scraped products</text><text x="747.5" y="261.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">with a batch-trained model via per-event lookups; match user</text><text x="747.5" y="283.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">events to nearest retailers; the BPC just consumes, looks up</text><text x="747.5" y="305.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and emits</text><path d="M9.1 344.1L989.6 344.3L989.6 510.2L9.4 510.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 344.3Q499.8 346.0 991.8 344.3M9.1 344.1Q500.1 347.8 991.2 345.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 344.4Q992.1 427.9 989.4 511.3M990.1 343.9Q990.8 427.7 990.0 511.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 510.6Q500.2 509.2 8.1 509.5M992.5 509.0Q500.2 509.8 7.9 509.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 511.0Q10.9 427.4 11.0 343.7M10.3 510.5Q10.2 426.8 9.6 343.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="400.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Independent scaling: aggregate user events into 24-hour sessions (key userId + timestamp, value a list of productIds, Table 11-1); scale processors down at night and up</text><text x="500.0" y="422.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">in the day, but the state&#x27;s upper bound stays constant (any user may log in), so the store must still cover everyone; caching, partitioning and batching keep store load</text><text x="500.0" y="444.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">below linear. Limits: no joins between streams (load into a database and join there), no state materialisation, event scheduling or timestamp-based decisions: those</text><text x="500.0" y="466.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">come with the frameworks in Chapters 12 and 13. Cloud key-value stores allow independent read and write scaling with proportional cost.</text></svg>