<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="540" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 195.3L10.7 194.2Z" fill="#efe0ca" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 104.7 495.0 196.2M494.9 12.9Q496.9 104.5 495.3 196.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 194.4Q252.6 197.2 8.7 194.5M496.4 194.7Q252.1 193.2 7.8 195.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 196.0Q10.0 104.3 10.1 12.7M10.2 195.9Q8.5 105.1 9.1 14.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="67.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Scaling by restart</text><text x="252.5" y="89.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">pause, checkpoint, stop, restart with new parallelism and reload;</text><text x="252.5" y="111.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">supported by all; needed because state redistribution takes time and</text><text x="252.5" y="133.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">terminating a node mid-shuffle loses data (Fig 12-8); downtime</text><text x="252.5" y="155.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">grows with checkpoint size; also a good disaster-recovery test</text><path d="M504.1 14.9L990.2 14.7L990.7 194.7L506.0 194.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 104.6 989.3 196.3M989.2 13.5Q988.8 104.5 990.4 195.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 194.5Q747.1 195.0 502.9 194.1M990.9 195.2Q746.9 196.3 502.9 195.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 197.1Q507.7 105.5 505.3 13.9M504.8 197.0Q503.2 105.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="67.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Scaling while running</text><text x="747.5" y="89.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">only some frameworks: Spark dynamic allocation needs coarse-grained mode</text><text x="747.5" y="111.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">plus an external shuffle service (ESS) that stores shuffled events so</text><text x="747.5" y="133.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">tasks can leave (Fig 12-9, 12-10); also shuffle tracking and block</text><text x="747.5" y="155.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">decommissioning; Flink&#x27;s adaptive scheduler</text><path d="M11.1 209.0L495.3 210.4L495.5 358.8L9.4 361.1Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 209.4Q252.5 211.4 496.6 209.4M9.6 210.2Q252.5 210.6 495.5 210.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 209.2Q496.9 284.8 495.3 360.5M496.1 207.5Q493.6 284.0 494.8 360.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 359.6Q252.0 361.6 8.0 360.0M497.1 359.3Q252.7 358.6 8.4 359.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 361.3Q12.0 285.2 10.1 209.1M9.5 362.4Q9.6 285.1 10.0 207.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="247.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Parallelism limits</text><text x="252.5" y="269.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">maximum parallelism is bounded by input partition counts;</text><text x="252.5" y="291.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">daily cyclical load (Fig 12-7) benefits from scaling down at night;</text><text x="252.5" y="313.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">stateless apps just join or leave the consumer group; stateful</text><text x="252.5" y="335.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">apps must match state to partitions</text><path d="M504.3 210.1L991.1 210.8L991.1 361.1L504.7 358.8Z" fill="#d3dbe0" stroke="none"/><path d="M503.5 210.8Q747.1 212.0 990.6 210.5M502.6 210.4Q746.9 212.4 991.1 210.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 208.1Q991.3 284.9 990.5 361.8M990.0 209.0Q990.6 284.8 989.1 360.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 360.4Q748.1 359.3 504.3 359.1M991.7 360.0Q747.5 358.7 503.3 359.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 362.0Q506.5 284.7 505.3 207.5M506.0 361.4Q507.1 285.4 504.0 209.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="247.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Autoscaling</text><text x="747.5" y="269.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">automatic scaling on metrics such as latency, consumer lag, memory,</text><text x="747.5" y="291.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">CPU; built in for Google Dataflow and Spark dynamic allocation;</text><text x="747.5" y="313.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">otherwise wire your own metrics (lag monitoring) to the framework;</text><text x="747.5" y="335.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">still evolving; app scaling differs from cluster scaling</text><path d="M9.1 374.1L989.6 374.3L989.6 530.2L9.4 530.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 374.3Q499.8 376.0 991.8 374.3M9.1 374.1Q500.1 377.8 991.2 375.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 374.4Q992.1 452.9 989.4 531.3M990.1 373.9Q990.8 452.7 990.0 531.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 530.6Q500.2 529.2 8.1 529.5M992.5 529.0Q500.2 529.8 7.9 529.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 531.0Q10.9 452.4 11.0 373.7M10.3 530.5Q10.2 451.8 9.6 373.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="425.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Multitenancy: a new app reprocessing from the start can grab most free resources and starve others, breaking SLOs. Mitigate with several smaller clusters per team (more</text><text x="500.0" y="447.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">overhead, best if requisitioned programmatically) or namespaces with resource allocations (spare capacity fragments). Languages: JVM (Java, then Scala) and Python, with</text><text x="500.0" y="469.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">MapReduce-style chained APIs. Choosing: weigh operational overhead and popularity (Flink strongest growth; Spark structured streaming popular; Beam mostly via</text><text x="500.0" y="491.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">Dataflow); it may not suit your microservice.</text></svg>