<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="470" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 165.3L10.7 164.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 89.7 495.0 166.2M494.9 12.9Q496.9 89.5 495.3 166.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 164.4Q252.6 167.2 8.7 164.5M496.4 164.7Q252.1 163.2 7.8 165.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 166.0Q10.0 89.3 10.1 12.7M10.2 165.9Q8.5 90.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="63.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Example: session windows of clicks and views</text><text x="252.5" y="85.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Click (userId, productId, time) and AdView (userId, adId,</text><text x="252.5" y="107.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">productId, time) streams; sessions end after 30 minutes of event</text><text x="252.5" y="129.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">time without activity; emit AdEngagements: views that have a click</text><path d="M504.1 14.9L990.2 14.7L990.7 164.7L506.0 164.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 89.6 989.3 166.3M989.2 13.5Q988.8 89.5 990.4 165.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 164.5Q747.1 165.0 502.9 164.1M990.9 165.2Q746.9 166.3 502.9 165.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 167.1Q507.7 90.5 505.3 13.9M504.8 167.0Q503.2 90.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="63.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Flink code (Ex 12-3, 12-4)</text><text x="747.5" y="85.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">union both streams, keyBy, EventTimeSessionWindows.withGap(30 min),</text><text x="747.5" y="107.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">ProcessClickViewWindowFunction pairs views with clicks and emits a</text><text x="747.5" y="129.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">List of adIds per userId (Table 12-1); sink to a Kafka topic</text><path d="M11.1 179.0L330.3 180.4L330.5 278.8L9.4 281.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 179.4Q170.0 181.4 331.6 179.4M9.6 180.2Q170.0 180.6 330.5 180.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.9 179.2Q331.7 229.8 330.3 280.5M331.1 177.5Q329.0 229.0 329.8 280.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.1 279.6Q169.5 281.6 8.0 280.0M332.1 279.3Q170.2 278.6 8.4 279.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 281.3Q11.7 230.2 10.1 179.1M9.5 282.4Q9.6 230.1 10.0 177.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="225.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Stage 1</text><text x="170.0" y="247.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">tasks get partitions; union; keyBy prep</text><path d="M339.3 180.1L661.1 180.8L661.1 281.1L339.7 278.8Z" fill="#efe0ca" stroke="none"/><path d="M338.5 180.8Q499.6 182.0 660.6 180.5M337.6 180.4Q499.4 182.4 661.1 180.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 178.1Q661.1 229.9 660.5 281.8M660.0 179.0Q660.4 229.8 659.1 280.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M662.0 280.4Q500.6 279.3 339.3 279.1M661.7 280.0Q500.0 278.7 338.3 279.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.9 282.0Q341.2 229.7 340.3 177.5M341.0 281.4Q341.7 230.4 339.0 179.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="225.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Stage 2</text><text x="500.0" y="247.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">shuffle so a key lands on one instance</text><path d="M669.1 179.1L989.6 179.3L989.6 280.2L669.4 280.1Z" fill="#d3dbe0" stroke="none"/><path d="M667.7 179.3Q829.8 181.0 991.8 179.3M669.1 179.1Q830.1 182.8 991.2 180.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 179.4Q991.7 230.4 989.4 281.3M990.1 178.9Q990.7 230.2 990.0 281.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 280.6Q830.2 279.2 668.1 279.5M992.5 279.0Q830.2 279.8 667.9 279.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.9 281.0Q670.9 229.9 671.0 178.7M670.3 280.5Q670.2 229.3 669.6 178.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="225.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Stage 3</text><text x="830.0" y="247.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">window, process, write AdEngagements</text><path d="M9.5 294.2L989.1 295.5L990.6 459.4L9.8 461.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 294.5Q500.2 291.6 992.4 295.0M7.8 295.6Q500.1 296.6 992.4 295.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 292.6Q989.9 377.6 990.3 462.5M990.0 293.5Q988.2 377.7 990.9 462.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 460.9Q500.1 457.3 8.9 459.2M991.4 459.3Q500.2 456.8 9.0 460.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 462.5Q13.0 377.8 9.3 293.2M9.8 462.3Q12.6 377.8 9.7 293.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="361.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Scaling to one instance (Fig 12-2): halt, restore from the last checkpoint with the new parallelism (operator state restored to partitions); instance 0 then reads every</text><text x="500.0" y="383.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">partition and still shuffles, to itself. Frameworks can keep closed windows for a while to merge late events and emit an update. A click may happen without an ad view</text><text x="500.0" y="405.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">(browsing, search results). (Listing note: the Flink snippet is as printed and abbreviated; its map is keyed by one key and its types are illustrative.)</text></svg>