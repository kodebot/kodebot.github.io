<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Internal state with checkpoints</text><text x="252.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">most frameworks favour internal state (in memory, spilled to</text><text x="252.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">disk); risks: disk or node failure, aggressive scaling;</text><text x="252.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a checkpoint is a snapshot persisted outside the workers (once</text><text x="252.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">HDFS, now S3, Google Cloud Storage, Azure Blob Storage)</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">What a checkpoint holds (Fig 12-6)</text><text x="747.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">operator state: pairs of &lt;partitionId, offset&gt;; key state: pairs</text><text x="747.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">of &lt;key, state&gt; (aggregations, windows, joins); recorded</text><text x="747.5" y="138.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">synchronously so state matches the offsets, otherwise events are</text><text x="747.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">skipped or processed twice</text><path d="M11.1 219.0L990.3 220.4L990.5 413.8L9.4 416.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 219.4Q500.0 221.4 991.6 219.4M9.6 220.2Q500.0 220.6 990.5 220.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 219.2Q991.9 317.3 990.3 415.5M991.1 217.5Q988.6 316.5 989.8 415.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 414.6Q499.5 416.6 8.0 415.0M992.1 414.3Q500.2 413.6 8.4 414.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 416.3Q12.0 317.7 10.1 219.1M9.5 417.4Q9.6 317.6 10.0 217.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="290.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">State must be fully loaded from the checkpoint before new data is processed, and the framework verifies operator and key state match per task. Equivalent to snapshots</text><text x="500.0" y="312.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">for external stores (Chapter 8). Failures: a failed worker&#x27;s tasks move to another worker, state reloaded from the checkpoint with partition assignments; resource</text><text x="500.0" y="334.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">manager failures are transparent to running jobs (new deployments may be blocked); ZooKeeper-backed high availability mitigates it. Monitor and alert on resource</text><text x="500.0" y="356.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">managers and workers.</text></svg>