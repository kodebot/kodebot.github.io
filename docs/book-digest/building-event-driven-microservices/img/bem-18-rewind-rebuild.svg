<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 225.3L10.7 224.2Z" fill="#efe0ca" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 119.7 495.0 226.2M494.9 12.9Q496.9 119.5 495.3 226.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 224.4Q252.6 227.2 8.7 224.5M496.4 224.7Q252.1 223.2 7.8 225.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 226.0Q10.0 119.3 10.1 12.7M10.2 225.9Q8.5 120.1 9.1 14.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="82.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">From an external source</text><text x="252.5" y="104.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">e.g. NGINX logs parsed into events; a log-format change broke the parser; fix the</text><text x="252.5" y="126.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">parser, reprocess the logs; with schemas and quality checks a DLQ would have</text><text x="252.5" y="148.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">shielded consumers (but delayed them); the contaminated stream cannot be compacted</text><text x="252.5" y="170.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">or edited: purge and rebuild it; treat it as an incident with a postmortem</text><path d="M504.1 14.9L990.2 14.7L990.7 224.7L506.0 224.8Z" fill="#eed5cc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 119.6 989.3 226.3M989.2 13.5Q988.8 119.5 990.4 225.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 224.5Q747.1 225.0 502.9 224.1M990.9 225.2Q746.9 226.3 502.9 225.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 227.1Q507.7 120.5 505.3 13.9M504.8 227.0Q503.2 120.2 504.0 13.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="82.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">From the topic as the source</text><text x="747.5" y="104.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">a clickstream written verbatim through a gateway with no schema or tests;</text><text x="747.5" y="126.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">state events could simply be overwritten, measurements cannot; write a stream</text><text x="747.5" y="148.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">processor (streaming SQL works) to detect and repair into a new topic; fix the</text><text x="747.5" y="170.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">producer and migrate consumers; missing data is lost for good</text><path d="M11.1 239.0L990.3 240.4L990.5 398.8L9.4 401.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 239.4Q500.0 241.4 991.6 239.4M9.6 240.2Q500.0 240.6 990.5 240.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 239.2Q991.9 319.8 990.3 400.5M991.1 237.5Q988.6 319.0 989.8 400.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 399.6Q499.5 401.6 8.0 400.0M992.1 399.3Q500.2 398.6 8.4 399.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 401.3Q12.0 320.2 10.1 239.1M9.5 402.4Q9.6 320.1 10.0 237.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="304.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Consumers: stop, reset or restore state, then consume the new stream. From the beginning is easiest (mute output until a logical point, since re-emitting may be</text><text x="500.0" y="326.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">unwanted); offsets from the old stream mean nothing. From a snapshot or savepoint: it corresponds to a known good time; start at an event timestamp earlier than the</text><text x="500.0" y="348.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">snapshot&#x27;s latest, and keep all processing idempotent. Expensive, labour-intensive, risky: a last resort for any event type.</text><path d="M9.3 415.1L991.1 415.8L991.1 511.1L9.7 508.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 415.8Q499.6 417.0 990.6 415.5M7.6 415.4Q499.4 417.4 991.1 415.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 413.1Q991.1 462.4 990.5 511.8M990.0 414.0Q990.4 462.3 989.1 510.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 510.4Q500.6 509.3 9.3 509.1M991.7 510.0Q500.0 508.7 8.3 509.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 512.0Q11.2 462.2 10.3 412.5M11.0 511.4Q11.7 462.9 9.0 414.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="457.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Summary: prevent (schemas, validation, data quality checks, testing); design events as state so fixes propagate and compaction cleans up (also GDPR and CCPA deletion);</text><text x="500.0" y="479.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">rewind, rebuild and retry only if needed.</text></svg>