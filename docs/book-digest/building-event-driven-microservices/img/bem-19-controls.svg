<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="580" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 185.3L10.7 184.2Z" fill="#efe0ca" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 99.7 495.0 186.2M494.9 12.9Q496.9 99.5 495.3 186.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 184.4Q252.6 187.2 8.7 184.5M496.4 184.7Q252.1 183.2 7.8 185.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 186.0Q10.0 99.3 10.1 12.7M10.2 185.9Q8.5 100.1 9.1 14.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="62.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Quotas</text><text x="252.5" y="84.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">a cap on a client&#x27;s broker throughput (for example Kafka quotas) so one chatty</text><text x="252.5" y="106.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">producer or a parallel consumer group replaying from the start cannot</text><text x="252.5" y="128.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">saturate the cluster; start with a global 25% maximum and allow surge-prone</text><text x="252.5" y="150.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">services up to 75%; do not throttle producers fed by external data (they drop data)</text><path d="M504.1 14.9L990.2 14.7L990.7 184.7L506.0 184.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 99.6 989.3 186.3M989.2 13.5Q988.8 99.5 990.4 185.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 184.5Q747.1 185.0 502.9 184.1M990.9 185.2Q746.9 186.3 502.9 185.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 187.1Q507.7 100.5 505.3 13.9M504.8 187.0Q503.2 100.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="73.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Schema registry</text><text x="747.5" y="95.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">less bandwidth (no schema per event), a single reference, data discovery,</text><text x="747.5" y="117.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">schema evolution enforcement; the Confluent Schema Registry (free)</text><text x="747.5" y="139.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">supports Avro, Protobuf and JSON; choice follows your broker</text><path d="M11.1 199.0L495.3 200.4L495.5 388.8L9.4 391.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 199.4Q252.5 201.4 496.6 199.4M9.6 200.2Q252.5 200.6 495.5 200.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 199.2Q496.9 294.8 495.3 390.5M496.1 197.5Q493.6 294.0 494.8 390.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 389.6Q252.0 391.6 8.0 390.0M497.1 389.3Q252.7 388.6 8.4 389.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 391.3Q12.0 295.2 10.1 199.1M9.5 392.4Q9.6 295.1 10.0 197.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="257.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Permissions: ACLs and RBAC</text><text x="252.5" y="279.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">ACLs are per entity (Kafka and Pulsar offer only ACLs); RBAC groups</text><text x="252.5" y="301.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">permissions in roles (Confluent, StreamNative); READ, WRITE, CREATE,</text><text x="252.5" y="323.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">DELETE, MODIFY, DESCRIBE; only the producing team grants access; one</text><text x="252.5" y="345.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">writer per stream; services must be identified from day one</text><path d="M504.3 200.1L991.1 200.8L991.1 391.1L504.7 388.8Z" fill="#d3dbe0" stroke="none"/><path d="M503.5 200.8Q747.1 202.0 990.6 200.5M502.6 200.4Q746.9 202.4 991.1 200.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 198.1Q991.3 294.9 990.5 391.8M990.0 199.0Q990.6 294.8 989.1 390.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 390.4Q748.1 389.3 504.3 389.1M991.7 390.0Q747.5 388.7 503.3 389.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 392.0Q506.5 294.7 505.3 197.5M506.0 391.4Q507.1 295.4 504.0 199.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="246.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Typical service permissions (Table 19-1)</text><text x="747.5" y="268.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">input streams: READ</text><text x="747.5" y="290.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">output streams: CREATE, WRITE (maybe READ)</text><text x="747.5" y="312.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">internal and changelog streams: CREATE, WRITE, READ</text><text x="747.5" y="334.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">never couple on another service&#x27;s internal streams; keep grants as an event</text><text x="747.5" y="356.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">stream for audit; find orphan streams and services from permissions</text><path d="M9.1 404.1L989.6 404.3L989.6 570.2L9.4 570.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 404.3Q499.8 406.0 991.8 404.3M9.1 404.1Q500.1 407.8 991.2 405.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 404.4Q992.1 487.9 989.4 571.3M990.1 403.9Q990.8 487.7 990.0 571.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 570.6Q500.2 569.2 8.1 569.5M992.5 569.0Q500.2 569.8 7.9 569.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 571.0Q10.9 487.4 11.0 403.7M10.3 570.5Q10.2 486.8 9.6 403.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="460.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Schema notifications: alert consumers before a schema they depend on evolves (the permissions graph shows who depends on it; Git webhooks flag schema file changes in</text><text x="500.0" y="482.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">pull requests); also auto-check proposed changes for PII leaks or bloat. Consumer offset management: reset to the start (logic change), advance to the latest, or set a</text><text x="500.0" y="504.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">point in time (failover: N minutes before the crash); only the owner or an admin may change them. Application reset tool: delete internal and changelog streams and</text><text x="500.0" y="526.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">state materialisations, reset offsets, purge external stores where supported; never another team&#x27;s streams or state.</text></svg>