<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="580" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Local integration testing</text><text x="252.5" y="94.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">a local copy of production: broker, schema registry, data stores, the service,</text><text x="252.5" y="116.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">any framework; control each part and script failures (broker or store outages,</text><text x="252.5" y="138.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">out-of-order events, lost network), copartitioning and state when scaling,</text><text x="252.5" y="160.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">and exercise request-response logic as another source of events</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">What each component lets you do</text><text x="747.5" y="94.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">broker: create and delete streams, order events, change partitions, induce</text><text x="747.5" y="116.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">failures; registry: publish compatible schemas, induce failures; stores: change</text><text x="747.5" y="138.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">schemas, rebuild state, induce failures; framework: shuffle, checkpoints,</text><text x="747.5" y="160.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">kill workers; app: scale instances, check rebalancing, state and queries</text><path d="M11.1 219.0L330.3 220.4L330.5 408.8L9.4 411.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 219.4Q170.0 221.4 331.6 219.4M9.6 220.2Q170.0 220.6 330.5 220.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.9 219.2Q331.9 314.8 330.3 410.5M331.1 217.5Q328.6 314.0 329.8 410.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.1 409.6Q169.5 411.6 8.0 410.0M332.1 409.3Q170.2 408.6 8.4 409.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 411.3Q12.0 315.2 10.1 219.1M9.5 412.4Q9.6 315.1 10.0 217.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="277.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Embedded in test code (Ex 20-6)</text><text x="170.0" y="299.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">start broker, registry and two topology instances</text><text x="170.0" y="321.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">inside the test; publish, stop one, check the output;</text><text x="170.0" y="343.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">rebalancing, joins, scaling, faults; works only for JVM</text><text x="170.0" y="365.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">stacks (Kafka and Confluent Schema Registry are Java)</text><path d="M339.3 220.1L661.1 220.8L661.1 411.1L339.7 408.8Z" fill="#d3dbe0" stroke="none"/><path d="M338.5 220.8Q499.6 222.0 660.6 220.5M337.6 220.4Q499.4 222.4 661.1 220.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 218.1Q661.3 314.9 660.5 411.8M660.0 219.0Q660.6 314.8 659.1 410.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M662.0 410.4Q500.6 409.3 339.3 409.1M661.7 410.0Q500.0 408.7 338.3 409.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.9 412.0Q341.5 314.7 340.3 217.5M341.0 411.4Q342.1 315.4 339.0 219.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="277.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Containers (Ex 20-7, Fig 20-1)</text><text x="500.0" y="299.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">Testcontainers composes Kafka, Postgres with pgvector</text><text x="500.0" y="321.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">and HashiCorp Vault from test code in many languages;</text><text x="500.0" y="343.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">pin versions to match production or try newer ones; one</text><text x="500.0" y="365.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">shared all-in-one container is customisable but opaque</text><path d="M669.1 219.1L989.6 219.3L989.6 410.2L669.4 410.1Z" fill="#eed5cc" stroke="none"/><path d="M667.7 219.3Q829.8 221.0 991.8 219.3M669.1 219.1Q830.1 222.8 991.2 220.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 219.4Q992.1 315.4 989.4 411.3M990.1 218.9Q990.8 315.2 990.0 411.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 410.6Q830.2 409.2 668.1 409.5M992.5 409.0Q830.2 409.8 667.9 409.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.9 411.0Q670.9 314.9 671.0 218.7M670.3 410.5Q670.2 314.3 669.6 218.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="255.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Hosted and SaaS (Fig 20-2)</text><text x="830.0" y="277.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Google PubSub has an emulator, LocalStack emulates</text><text x="830.0" y="299.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Kinesis, Azure Event Hubs has none (Kafka clients can</text><text x="830.0" y="321.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">substitute); FaaS platforms offer local runners;</text><text x="830.0" y="343.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">heavyweight frameworks run resource manager, workers</text><text x="830.0" y="365.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">and broker in one container; keep test, staging and</text><text x="830.0" y="387.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">production separate</text><path d="M9.5 424.2L989.1 425.5L990.6 569.4L9.8 571.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 424.5Q500.2 421.6 992.4 425.0M7.8 425.6Q500.1 426.6 992.4 425.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 422.6Q989.9 497.6 990.3 572.5M990.0 423.5Q988.2 497.7 990.9 572.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 570.9Q500.1 567.3 8.9 569.2M991.4 569.3Q500.2 566.8 9.0 570.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 572.5Q13.0 497.8 9.3 423.2M9.8 572.3Q12.6 497.8 9.7 423.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="492.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Fully managed, FaaS and SaaS options are far more common than in the first edition; many organisations host nothing themselves and use provider environments for</text><text x="500.0" y="514.5" font-size="13.5" fill="#3b2f20" text-anchor="middle">development, testing and staging, so there may be no emulator. Containers are probably the most common route for integration testing today.</text></svg>