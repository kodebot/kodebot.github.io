<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 235.3L10.7 234.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 124.7 495.0 236.2M494.9 12.9Q496.9 124.5 495.3 236.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 234.4Q252.6 237.2 8.7 234.5M496.4 234.7Q252.1 233.2 7.8 235.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 236.0Q10.0 124.3 10.1 12.7M10.2 235.9Q8.5 125.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="76.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Deployment principles</text><text x="252.5" y="98.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">team autonomy; one standard process (created with the service); supportive</text><text x="252.5" y="120.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">tooling (reset offsets, purge state, check schemas, delete internal streams);</text><text x="252.5" y="142.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">weigh reprocessing impact (stale results, output surges, side effects such as</text><text x="252.5" y="164.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">resending years of promotional emails); honour SLAs including worst-case state</text><text x="252.5" y="186.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">rebuilds; minimise dependent changes; negotiate breaking changes first</text><path d="M504.1 14.9L990.2 14.7L990.7 234.7L506.0 234.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 124.6 989.3 236.3M989.2 13.5Q988.8 124.5 990.4 235.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 234.5Q747.1 235.0 502.9 234.1M990.9 235.2Q746.9 236.3 502.9 235.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 237.1Q507.7 125.5 505.3 13.9M504.8 237.0Q503.2 125.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="76.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Independence, CI and CMS</text><text x="747.5" y="98.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">if a deployment regularly forces others to deploy too, bounded contexts may be</text><text x="747.5" y="120.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">ill-defined (exception: a few codependent services owned by one team);</text><text x="747.5" y="142.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">CI merges and validates (build, tests, style, schema evolution, linter) and yields</text><text x="747.5" y="164.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">a container; delivery keeps it deployable with a manual deploy; deployment is</text><text x="747.5" y="186.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">automatic, hard for stateful services; CMS deploys it on commodity hardware</text><path d="M11.1 249.0L990.3 250.4L990.5 373.8L9.4 376.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 249.4Q500.0 251.4 991.6 249.4M9.6 250.2Q500.0 250.6 990.5 250.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 249.2Q991.9 312.3 990.3 375.5M991.1 247.5Q988.7 311.5 989.8 375.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 374.6Q499.5 376.6 8.0 375.0M992.1 374.3Q500.2 373.6 8.4 374.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 376.3Q11.9 312.7 10.1 249.1M9.5 377.4Q9.6 312.6 10.0 247.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="307.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Pools of special hardware (graphics cards, fast storage, high parallelism) can be created for services that need them; commodity hardware is cheap, reliable enough and</text><text x="500.0" y="329.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">scales horizontally.</text><path d="M9.3 390.1L199.1 390.8L199.1 541.1L9.7 538.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 390.8Q103.6 392.0 198.6 390.5M7.6 390.4Q103.4 392.4 199.1 390.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M197.9 388.1Q199.3 464.9 198.5 541.8M198.0 389.0Q198.6 464.8 197.1 540.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M200.0 540.4Q104.6 539.3 9.3 539.1M199.7 540.0Q104.0 538.7 8.3 539.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 542.0Q11.5 464.7 10.3 387.5M11.0 541.4Q12.1 465.4 9.0 389.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="104.0" y="460.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1 Commit</text><text x="104.0" y="482.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">webhook starts the CI pipeline</text><path d="M207.1 389.1L395.6 389.3L395.6 540.2L207.4 540.1Z" fill="#d6e1cf" stroke="none"/><path d="M205.7 389.3Q301.8 391.0 397.8 389.3M207.1 389.1Q302.1 392.8 397.2 390.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M396.0 389.4Q398.1 465.4 395.4 541.3M396.1 388.9Q396.8 465.2 396.0 541.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M398.4 540.6Q302.2 539.2 206.1 539.5M398.5 539.0Q302.2 539.8 205.9 539.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M208.9 541.0Q208.9 464.9 209.0 388.7M208.3 540.5Q208.2 464.3 207.6 388.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="302.0" y="449.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2 Test</text><text x="302.0" y="471.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">unit and integration tests in</text><text x="302.0" y="493.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">isolated environments</text><path d="M405.5 389.2L593.1 390.5L594.6 539.4L405.8 541.2Z" fill="#efe0ca" stroke="none"/><path d="M404.0 389.5Q500.2 386.6 596.4 390.0M403.8 390.6Q500.1 391.6 596.4 390.2" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M595.0 387.6Q593.9 465.1 594.3 542.5M594.0 388.5Q592.2 465.2 594.9 542.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M595.3 540.9Q500.1 537.3 404.9 539.2M595.4 539.3Q500.2 536.8 405.0 540.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M406.9 542.5Q409.0 465.3 405.3 388.2M405.8 542.3Q408.6 465.3 405.7 388.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="449.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3 Pre-deploy checks</text><text x="500.0" y="471.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">streams, permissions, schema</text><text x="500.0" y="493.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">evolution</text><path d="M605.0 389.5L792.5 389.4L791.4 541.1L602.8 539.1Z" fill="#eed5cc" stroke="none"/><path d="M602.7 388.9Q697.6 386.7 792.6 389.7M603.2 390.4Q698.8 389.5 794.4 390.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M791.2 388.5Q789.5 465.4 791.0 542.3M792.6 388.4Q793.0 465.1 792.7 541.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M794.5 539.2Q698.4 539.3 602.2 540.1M792.6 539.0Q698.0 541.3 603.4 539.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M603.8 541.2Q605.4 465.2 604.5 389.3M603.9 540.7Q602.2 464.1 602.9 387.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="698.0" y="449.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">4 Deploy</text><text x="698.0" y="471.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">stop, reset, start, wait for</text><text x="698.0" y="493.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">ready; roll back on failure</text><path d="M802.7 391.1L988.9 390.6L991.1 540.6L801.4 540.8Z" fill="#d3dbe0" stroke="none"/><path d="M799.8 389.2Q895.2 391.5 990.5 390.6M799.8 389.5Q895.6 391.6 991.5 389.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 389.3Q992.3 465.6 990.7 542.0M988.9 388.1Q989.4 464.8 990.1 541.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.7 540.8Q895.7 542.3 799.7 540.8M990.7 540.8Q896.0 538.8 801.3 540.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M802.7 541.6Q802.9 465.5 801.8 389.5M801.5 540.6Q803.2 464.4 801.0 388.2" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="896.0" y="449.0" font-size="16.0" fill="#3b2f20" text-anchor="middle">5 Post-deploy checks</text><text x="896.0" y="471.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">lag normal, no errors, endpoints</text><text x="896.0" y="493.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">work</text></svg>