<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Rolling update</text><text x="252.5" y="94.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">stop, update and start one instance at a time (only step 4 changes), so near-</text><text x="252.5" y="116.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">real-time processing continues with old and new logic mixed; prerequisites:</text><text x="252.5" y="138.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">no breaking change to state stores, internal topology or internal schemas, and</text><text x="252.5" y="160.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">no replaying of input; accidentally changing the topology is the commonest mistake</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="94.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Good fits for a rolling update</text><text x="747.5" y="116.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">new fields in input streams to use, consuming from new streams, bug fixes that</text><text x="747.5" y="138.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">do not need rewinding; benefit: no downtime; drawback: the prerequisites limit it</text><path d="M11.1 219.0L330.3 220.4L330.5 438.8L9.4 441.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 219.4Q170.0 221.4 331.6 219.4M9.6 220.2Q170.0 220.6 330.5 220.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.9 219.2Q331.9 329.8 330.3 440.5M331.1 217.5Q328.6 329.0 329.8 440.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.1 439.6Q169.5 441.6 8.0 440.0M332.1 439.3Q170.2 438.6 8.4 439.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 441.3Q12.0 330.2 10.1 219.1M9.5 442.4Q9.6 330.1 10.0 217.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="292.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Variant 1: same old stream</text><text x="170.0" y="314.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">simplest for the producer; old and new events share a</text><text x="170.0" y="336.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">stream; consumers handle both schemas and hopefully</text><text x="170.0" y="358.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">throw on the new one, but may silently fail, discard or</text><text x="170.0" y="380.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">mis-decode into bad data (Fig 21-2)</text><path d="M339.3 220.1L661.1 220.8L661.1 441.1L339.7 438.8Z" fill="#eed5cc" stroke="none"/><path d="M338.5 220.8Q499.6 222.0 660.6 220.5M337.6 220.4Q499.4 222.4 661.1 220.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 218.1Q661.3 329.9 660.5 441.8M660.0 219.0Q660.6 329.8 659.1 440.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M662.0 440.4Q500.6 439.3 339.3 439.1M661.7 440.0Q500.0 438.7 338.3 439.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.9 442.0Q341.5 329.7 340.3 217.5M341.0 441.4Q342.1 330.4 339.0 219.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="281.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Variant 2: new stream only</text><text x="500.0" y="303.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">big bang for every consumer (Fig 21-3): notify and</text><text x="500.0" y="325.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">coordinate all; test thoroughly; needed when the</text><text x="500.0" y="347.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">business model changes (Account split into BuyerAccount</text><text x="500.0" y="369.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">and SellerAccount); risk: consumers miss that the old</text><text x="500.0" y="391.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">stream went quiet</text><path d="M669.1 219.1L989.6 219.3L989.6 440.2L669.4 440.1Z" fill="#d6e1cf" stroke="none"/><path d="M667.7 219.3Q829.8 221.0 991.8 219.3M669.1 219.1Q830.1 222.8 991.2 220.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 219.4Q992.1 330.4 989.4 441.3M990.1 218.9Q990.8 330.2 990.0 441.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 440.6Q830.2 439.2 668.1 439.5M992.5 439.0Q830.2 439.8 667.9 439.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.9 441.0Q670.9 329.9 671.0 218.7M670.3 440.5Q670.2 329.3 669.6 218.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="281.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">Variant 3: both in parallel (Fig 21-4, 21-5)</text><text x="830.0" y="303.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">old stream deprecated, consumers move deliberately (no</text><text x="830.0" y="325.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">silent failure); needs data for both formats and no</text><text x="830.0" y="347.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">inconsistency; suits small changes such as Integer to</text><text x="830.0" y="369.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">String; avoid prolonged dual production; or a second</text><text x="830.0" y="391.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">service writes the new one</text><path d="M9.5 454.2L989.1 455.5L990.6 549.4L9.8 551.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 454.5Q500.2 451.6 992.4 455.0M7.8 455.6Q500.1 456.6 992.4 455.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 452.6Q990.1 502.6 990.3 552.5M990.0 453.5Q988.7 502.7 990.9 552.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 550.9Q500.1 547.3 8.9 549.2M991.4 549.3Q500.2 546.8 9.0 550.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 552.5Q12.5 502.8 9.3 453.2M9.8 552.3Q12.0 502.8 9.7 453.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="497.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Dual production risks: migration never finishes, new services subscribe to the old stream (use deprecation metadata tags), offsets in the new stream will not match the</text><text x="500.0" y="519.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">old, and a cloned service must be managed separately.</text></svg>