<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="340" fill="#ffffff"/><rect x="20" y="15" width="430" height="310" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Monolith: one schema</text><rect x="50" y="70" width="150" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="125.0" y="105.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Monolith</text><rect x="250" y="70" width="170" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="335.0" y="105.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Monolithic database</text><rect x="250" y="190" width="170" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="335.0" y="225.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Read replica</text><rect x="50" y="190" width="150" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="125.0" y="225.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Reports</text><line x1="200" y1="100" x2="250" y2="100" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="335" y1="130" x2="335" y2="190" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="250" y1="220" x2="200" y2="220" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="225.0" y="210" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">joins</text><rect x="480" y="15" width="460" height="310" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="502" y="49" font-size="16" font-weight="700" fill="#14324f">Microservices: scattered schemas</text><rect x="500" y="65" width="130" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="565.0" y="88.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Service 1</text><text x="565.0" y="108.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">own schema</text><line x1="630" y1="93" x2="700" y2="190" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="500" y="145" width="130" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="565.0" y="168.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Service 2</text><text x="565.0" y="188.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">own schema</text><line x1="630" y1="173" x2="700" y2="190" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="500" y="225" width="130" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="565.0" y="248.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Service 3</text><text x="565.0" y="268.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">own schema</text><line x1="630" y1="253" x2="700" y2="190" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="700" y="150" width="220" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="810.0" y="185.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Central reporting database,</text><text x="810.0" y="205.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">data lake or stream</text><text x="710" y="290" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">publish data from each service to one place for reporting</text></svg>