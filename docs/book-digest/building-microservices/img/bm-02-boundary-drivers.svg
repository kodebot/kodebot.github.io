<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="440" fill="#ffffff"/><rect x="370" y="170" width="240" height="90" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="490.0" y="210.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Service boundary</text><text x="490.0" y="230.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">weigh several forces</text><rect x="30" y="30" width="240" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="150.0" y="60.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Domain (DDD)</text><text x="150.0" y="80.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">default, with organisation</text><line x1="150" y1="100" x2="490" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="370" y="20" width="240" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="490.0" y="50.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Volatility</text><text x="490.0" y="70.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">extract fast-changing parts</text><line x1="490" y1="90" x2="490" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="710" y="30" width="240" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="830.0" y="60.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Data</text><text x="830.0" y="80.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">PII, PCI scope</text><line x1="830" y1="100" x2="490" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="30" y="340" width="240" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="150.0" y="370.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Technology</text><text x="150.0" y="390.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">different runtime models</text><line x1="150" y1="340" x2="490" y2="260" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="710" y="340" width="240" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="830.0" y="370.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Organisation</text><text x="830.0" y="390.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">Conway&#x27;s law; team ownership</text><line x1="830" y1="340" x2="490" y2="260" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="430" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">no single rule: a goal (speed to market, scaling, compliance) decides which force dominates</text></svg>