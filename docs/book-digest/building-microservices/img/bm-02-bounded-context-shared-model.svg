<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><rect x="20" y="20" width="440" height="330" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="34" y="44" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Warehouse bounded context</text><rect x="500" y="20" width="460" height="330" rx="12" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="514" y="44" font-size="15" font-weight="700" fill="#5c4007" text-anchor="start">Finance bounded context</text><rect x="50" y="80" width="170" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="135.0" y="103.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Picker</text><text x="135.0" y="123.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">internal only</text><rect x="240" y="80" width="190" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="335.0" y="103.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Shelves</text><text x="335.0" y="123.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">stock locations</text><rect x="50" y="180" width="380" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="240.0" y="210.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Stock Item</text><text x="240.0" y="230.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">includes shelf locations (internal)</text><rect x="530" y="80" width="170" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="615.0" y="103.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">General ledger</text><text x="615.0" y="123.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">internal only</text><rect x="530" y="180" width="400" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="730.0" y="210.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Asset (Stock Count)</text><text x="730.0" y="230.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">value of stock held</text><line x1="430" y1="215" x2="530" y2="215" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="200" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">shared: a count only</text><text x="490" y="380" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the same real thing has a different model, and name, in each context; share only what others need</text></svg>