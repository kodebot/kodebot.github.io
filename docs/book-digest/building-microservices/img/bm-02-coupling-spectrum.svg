<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 260" width="1020" height="260" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1020" height="260" fill="#ffffff"/><text x="20" y="28" font-size="13" font-weight="700" fill="#14324f" text-anchor="start">loose (low, desirable)</text><text x="1000" y="28" font-size="13" font-weight="700" fill="#14324f" text-anchor="end">tight (high, undesirable)</text><line x1="190" y1="22" x2="820" y2="22" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="50" width="230" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="135.0" y="80.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Domain coupling</text><text x="135.0" y="100.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">needs another service&#x27;s</text><text x="135.0" y="120.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">functionality</text><rect x="280" y="50" width="230" height="90" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="395.0" y="80.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Pass-through</text><text x="395.0" y="100.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">data passed only for a</text><text x="395.0" y="120.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">downstream service</text><rect x="540" y="50" width="230" height="90" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="655.0" y="80.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Common coupling</text><text x="655.0" y="100.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">shared data: database,</text><text x="655.0" y="120.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">memory, filesystem</text><rect x="800" y="50" width="230" height="90" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="915.0" y="80.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Content coupling</text><text x="915.0" y="100.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">reaches into another&#x27;s</text><text x="915.0" y="120.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">internals and changes them</text><line x1="250" y1="95.0" x2="280" y2="95.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="510" y1="95.0" x2="540" y2="95.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="770" y1="95.0" x2="800" y2="95.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="510" y="185" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">temporal coupling (needing another service up at the same time) is a related concern, not a rung</text><text x="510" y="210" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">some coupling is unavoidable: reduce it, do not expect to eliminate it</text></svg>