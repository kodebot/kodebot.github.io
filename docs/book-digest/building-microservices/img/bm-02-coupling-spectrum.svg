ont-size="15.0" fill="#1e1e1e" text-anchor="middle">functionality</text><path d="M279.2 49.8L509.2 49.1L509.9 140.4L279.0 140.4Z" fill="#fbeed1" stroke="none"/><path d="M278.3 49.5Q394.6 48.6 510.9 49.1M277.9 50.2Q394.4 49.3 510.9 50.4" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.2 49.1Q508.4 95.5 510.3 141.9M509.8 49.0Q510.3 95.2 509.0 141.5" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M512.5 139.1Q395.7 138.3 278.8 140.3M510.4 139.4Q395.0 141.5 279.5 139.9" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M280.1 140.9Q280.8 95.2 280.7 49.6M279.0 141.6Q281.1 95.5 280.1 49.4" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="395.0" y="79.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">Pass-through</text><text x="395.0" y="101.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">data passed only for a</text><text x="395.0" y="123.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">downstream service</text><path d="M540.4 48.9L769.5 51.2L768.9 139.8L538.9 140.7Z" fill="#f9dada" stroke="none"/><path d="M538.1 49.6Q654.5 47.9 771.0 50.0M539.1 49.3Q655.2 50.4 771.4 49.7" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M770.6 48.3Q769.0 95.2 770.1 142.1M769.5 49.4Q769.9 95.1 770.0 140.8" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M770.9 140.1Q655.2 137.5 539.5 140.7M772.5 139.8Q654.9 137.4 537.4 140.0" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M539.1 142.0Q540.6 94.8 540.4 47.6M539.6 142.1Q539.1 95.3 540.6 48.4" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="655.0" y="79.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">Common coupling</text><text x="655.0" y="101.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">shared data: database,</text><text x="655.0" y="123.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">memory, filesystem</text><path d="M800.5 50.3L1029.6 50.0L1030.5 139.1L799.1 139.6Z" fill="#f9dada" stroke="none"/><path d="M799.0 50.4Q915.6 50.2 1032.3 49.1M798.7 50.0Q915.0 50.8 1031.3 49.4" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1029.9 49.0Q1029.0 94.7 1030.3 140.5M1031.0 48.4Q1028.4 95.4 1029.0 142.5" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1030.6 139.1Q914.4 140.4 798.2 139.3M1031.7 139.5Q915.1 141.4 798.6 139.2" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M800.3 140.8Q798.4 95.0 800.6 49.1M799.7 142.1Q802.4 95.3 801.0 48.5" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="915.0" y="79.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">Content coupling</text><text x="915.0" y="101.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">reaches into another&#x27;s</text><text x="915.0" y="123.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">internals and changes them</text><path d="M249.4 94.8Q264.3 95.4 279.2 95.1M250.0 95.1Q264.9 96.3 279.7 95.9" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M279.8 94.8Q274.4 92.8 269.5 90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M279.7 95.0Q274.6 98.2 269.3 101.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M511.0 95.2Q525.5 94.1 540.0 95.3M509.6 94.5Q524.9 93.6 540.1 94.5" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><pat