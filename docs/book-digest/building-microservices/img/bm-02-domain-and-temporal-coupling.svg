<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="360" fill="#ffffff"/><rect x="20" y="15" width="440" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Domain coupling</text><rect x="50" y="120" width="130" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="115.0" y="145.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Order</text><text x="115.0" y="165.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">Processor</text><rect x="280" y="60" width="150" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="355.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Warehouse</text><text x="355.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">reserve stock</text><rect x="280" y="200" width="150" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="355.0" y="223.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Payment</text><text x="355.0" y="243.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">take payment</text><line x1="180" y1="140" x2="280" y2="90" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="180" y1="160" x2="280" y2="228" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="240" y="300" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">no coupling between Warehouse and Payment</text><text x="240" y="320" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">many downstream calls can mean too much logic here</text><rect x="490" y="15" width="470" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="512" y="49" font-size="16" font-weight="700" fill="#14324f">Temporal coupling</text><rect x="510" y="100" width="130" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="575.0" y="125.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Order</text><text x="575.0" y="145.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">Processor</text><rect x="800" y="100" width="140" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="870.0" y="125.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Warehouse</text><text x="870.0" y="145.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">must be up now</text><line x1="640" y1="120" x2="800" y2="120" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="720.0" y="108" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">synchronous HTTP call</text><line x1="800" y1="145" x2="640" y2="145" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="725" y="200" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">if Warehouse is down the operation fails</text><text x="725" y="220" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">and the caller blocks waiting</text><rect x="560" y="255" width="340" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="730.0" y="275.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Fix: asynchronous communication</text><text x="730.0" y="295.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">for example a message broker</text></svg>