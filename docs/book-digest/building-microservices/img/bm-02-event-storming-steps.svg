<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><rect x="20" y="40" width="215" height="100" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="127.5" y="75.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">1 Domain events</text><text x="127.5" y="95.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">orange notes: facts,</text><text x="127.5" y="115.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">e.g. Order Placed</text><rect x="280" y="40" width="215" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="387.5" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">2 Commands</text><text x="387.5" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">blue notes: human</text><text x="387.5" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">decisions that cause them</text><rect x="540" y="40" width="215" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="647.5" y="75.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">3 Aggregates</text><text x="647.5" y="95.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">yellow notes: the nouns,</text><text x="647.5" y="115.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">events and commands cluster</text><rect x="800" y="40" width="215" height="100" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="907.5" y="75.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4 Bounded contexts</text><text x="907.5" y="95.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">group aggregates, often</text><text x="907.5" y="115.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">along the organisation</text><line x1="235" y1="90.0" x2="280" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="495" y1="90.0" x2="540" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="755" y1="90.0" x2="800" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="200" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">run with all stakeholders in one room, brown paper on the walls, sticky notes</text><text x="500" y="225" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">do not let the current implementation warp the picture of the domain</text></svg>