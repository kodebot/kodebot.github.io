<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><rect x="20" y="15" width="440" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Horizontal slice (the anti-pattern)</text><rect x="50" y="70" width="180" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="140.0" y="100.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">California team</text><text x="140.0" y="120.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">stateless front end</text><rect x="250" y="70" width="180" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="340.0" y="100.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Brazil team</text><text x="340.0" y="120.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">RPC over a data store</text><line x1="230" y1="105" x2="250" y2="105" stroke="#6f8aa3" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="240.0" y="70" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">chatty RPC</text><text x="240" y="190" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">both services change together; brittle, chatty</text><text x="240" y="210" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">RPC calls, batching needed: &#x27;onion architecture&#x27;</text><rect x="490" y="15" width="470" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="512" y="49" font-size="16" font-weight="700" fill="#14324f">Vertical slices (better)</text><rect x="520" y="70" width="200" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="620.0" y="105.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">California team</text><text x="620.0" y="125.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">front end + data access</text><text x="620.0" y="145.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">for its slice</text><rect x="740" y="70" width="200" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="840.0" y="105.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Brazil team</text><text x="840.0" y="125.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">front end + data access</text><text x="840.0" y="145.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">for another slice</text><text x="725" y="230" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">layering inside a service is fine; do not make layers</text><text x="725" y="250" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the ownership boundary between teams</text></svg>