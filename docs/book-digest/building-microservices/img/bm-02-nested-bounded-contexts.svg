<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><rect x="20" y="130" width="150" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="95.0" y="165.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Consumers</text><rect x="240" y="25" width="400" height="300" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="254" y="49" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Warehouse (looks like one service)</text><text x="254" y="68" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">coarse-grained API shown outside</text><rect x="270" y="110" width="160" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="350.0" y="140.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Inventory</text><text x="350.0" y="160.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">owns Stock Items</text><rect x="450" y="110" width="160" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="530.0" y="140.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Shipping</text><text x="530.0" y="160.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">owns Shipments</text><line x1="170" y1="160" x2="240" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="440" y="240" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">splitting is an implementation decision: hide it,</text><text x="440" y="260" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">keep one aggregate in one microservice</text><text x="440" y="300" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">also helps testing: stub the coarse API, not each inner service</text></svg>