<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="380" fill="#ffffff"/><rect x="20" y="15" width="960" height="135" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">The problem: the manifest passes through Warehouse, so a change Shipping needs forces upstream changes</text><rect x="50" y="70" width="240" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="170.0" y="95.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Order Processor</text><text x="170.0" y="115.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">sends Shipping Manifest</text><rect x="370" y="70" width="240" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="490.0" y="95.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Warehouse</text><text x="490.0" y="115.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">just passes it on</text><rect x="690" y="70" width="240" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="810.0" y="95.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Shipping</text><text x="810.0" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">needs the manifest</text><line x1="290" y1="100.0" x2="370" y2="100.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="330.0" y="92.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">manifest</text><line x1="610" y1="100.0" x2="690" y2="100.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="650.0" y="92.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">manifest</text><rect x="20" y="165" width="960" height="200" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="199" font-size="16" font-weight="700" fill="#14324f">Three ways to reduce it</text><rect x="40" y="215" width="290" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="185.0" y="235.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">1 Bypass the middle</text><text x="185.0" y="255.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Order Processor calls Shipping;</text><text x="185.0" y="275.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">more logic moves into it</text><rect x="350" y="215" width="290" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="495.0" y="235.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">2 Hide the manifest</text><text x="495.0" y="255.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">Warehouse builds it locally from</text><text x="495.0" y="275.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">data in its own contract</text><rect x="660" y="215" width="300" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="810.0" y="235.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">3 Treat it as a blob</text><text x="810.0" y="255.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Warehouse forwards it without</text><text x="810.0" y="275.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">looking inside</text><text x="480" y="315" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">with 2, a new required Customs Declaration still touches all three services,</text><text x="480" y="335" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">but you gain control over when and how each change is made (no lockstep rollout)</text></svg>