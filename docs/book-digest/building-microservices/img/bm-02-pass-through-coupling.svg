95.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Shipping</text><text x="810.0" y="117.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">needs the manifest</text><path d="M289.1 99.1Q329.4 98.4 369.7 99.3M290.2 99.5Q330.1 97.9 370.1 99.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M370.2 99.7Q364.7 97.6 359.7 94.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M369.8 100.3Q364.7 102.6 359.9 105.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="330.0" y="92.0" font-size="15" fill="#3b2f20" text-anchor="middle" stroke="#fbf7ef" stroke-width="5" paint-order="stroke">manifest</text><path d="M609.4 99.8Q649.3 100.7 689.2 100.1M610.0 100.1Q649.9 101.8 689.7 100.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M689.8 99.8Q684.4 97.8 679.5 95.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M689.7 100.0Q684.6 103.2 679.3 106.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="650.0" y="92.0" font-size="15" fill="#3b2f20" text-anchor="middle" stroke="#fbf7ef" stroke-width="5" paint-order="stroke">manifest</text><path d="M21.1 165.2L980.0 165.3L978.9 364.6L19.4 365.1Z" fill="#f3eee4" stroke="none"/><path d="M18.0 164.3Q499.4 166.4 980.7 165.4M17.9 164.9Q500.2 163.3 982.6 164.5" fill="none" stroke="#b9ae99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 163.5Q978.2 264.7 978.9 365.8M980.9 163.7Q983.3 265.6 980.4 367.5" fill="none" stroke="#b9ae99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.8 366.0Q500.3 365.6 18.8 365.0M982.4 365.5Q500.8 362.7 19.3 364.8" fill="none" stroke="#b9ae99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.4 365.7Q18.6 264.5 21.0 163.4M20.5 366.9Q23.6 265.6 21.0 164.4" fill="none" stroke="#b9ae99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="199" font-size="20.0" fill="#3b2f20">Three ways to reduce it</text><path d="M39.3 214.6L331.1 214.7L330.9 284.7L39.8 286.1Z" fill="#f1ede5" stroke="none"/><path d="M39.4 214.5Q185.7 212.8 332.0 214.5M39.5 213.9Q185.1 211.4 330.6 215.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.1 213.2Q328.3 250.2 329.1 287.2M330.9 214.3Q330.3 250.0 329.6 285.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.5 285.8Q184.8 286.1 39.1 285.6M332.2 285.4Q185.3 288.2 38.4 286.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M39.7 286.6Q38.0 249.6 40.1 212.6M40.9 286.1Q39.5 249.7 39.3 213.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="185.0" y="234.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1 Bypass the middle</text><text x="185.0" y="256.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Order Processor calls Shipping;</text><text x="185.0" y="278.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">more logic moves into it</text><path d="M350.6 215.8L640.5 214.9L639.1 283.8L348.9 284.5Z" fill="#d6e1cf" stroke="none"/><path d="M349.1 216.0Q494.8 218.8 640.5 215.6M349.1 214.4Q495.7 212.0 642.2 214.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M639.0 214.1Q640.8 250.0 640.5 285.8M640.0 212.9Q638.9 249.6 640.8 286.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M642.2 285.5Q495.0 285.9 347.8 283.9M641.6 285.0Q495.1 282.6 348.6 285.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M349.2 287.3Q350.8 250.0 349.5 212.7M350.8 286.6Q351.0 250.4 350.6 214.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="495.0" y="234.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2 Hide the manifest</text><text x="495.0" y="256.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Warehouse builds it locally from</text><text x="495.0" y="278.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">data in its own contract</text><path d="M659.7 216.0L960.2 214.4L959.0 283.9L659.6 285.7Z" fill="#d0dfdc" stroke="none"/><path d="M657.6 214.0Q809.6 216.5 961.5 214.5M658.4 214.9Q809.5 212.8 960.7 215.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M960.3 214.2Q958.4 250.5 960.1 286.7M959.6 214.0Q962.2 250.2 960.8 286.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M962.1 285.4Q810.5 287.2 659.0 284.2M960.4 285.7Q809.3 284.9 658.2 285.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.2 285.9Q660.8 249.8 660.0 213.7M659.7 286.4Q661.9 249.7 660.3 212.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="810.0" y="234.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3 Treat it as a blob</text><text x="810.0" y="256.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Warehouse forwards it without</text><text x="810.0" y="278.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">looking inside</text><text x="480" y="315" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">with 2, a new required Customs Declaration still touches all three services,</text><text x="480" y="335" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">but you gain control over when and how each change is made (no lockstep rollout)</text></svg>