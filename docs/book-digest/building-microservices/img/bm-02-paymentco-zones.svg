<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><rect x="20" y="150" width="150" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="95.0" y="190.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Clients</text><rect x="230" y="150" width="150" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="305.0" y="180.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Gateway</text><text x="305.0" y="200.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">diverts by zone</text><line x1="170" y1="185" x2="230" y2="185" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="440" y="20" width="300" height="160" rx="12" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="454" y="44" font-size="15" font-weight="700" fill="#134a26" text-anchor="start">Green zone</text><text x="454" y="63" font-size="12" font-weight="400" fill="#134a26" text-anchor="start">never sees card data</text><rect x="460" y="90" width="120" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="520.0" y="123.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Service 1</text><rect x="595" y="90" width="120" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="655.0" y="123.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Service 2</text><rect x="440" y="210" width="300" height="160" rx="12" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="454" y="234" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="start">Red zone</text><text x="454" y="253" font-size="12" font-weight="400" fill="#6b1c1c" text-anchor="start">handles card data: PCI scope</text><rect x="460" y="280" width="120" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="520.0" y="313.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Service 3</text><rect x="595" y="280" width="120" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="655.0" y="313.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Service 4</text><line x1="380" y1="170" x2="440" y2="100" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="380" y1="200" x2="440" y2="290" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="860" y="100" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">exempt from a</text><text x="860" y="118" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">full PCI audit</text><text x="860" y="290" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">in scope for</text><text x="860" y="308" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">PCI Level 1</text><text x="490" y="392" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">card data must never flow to the green zone, or the separation breaks down</text></svg>