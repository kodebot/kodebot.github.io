<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><rect x="20" y="60" width="220" height="140" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="130.0" y="125.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Monolith</text><text x="130.0" y="145.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">everything together</text><line x1="240" y1="130" x2="330" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="285.0" y="118" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">extract one piece</text><rect x="330" y="60" width="220" height="140" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="440.0" y="125.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Smaller monolith</text><text x="440.0" y="145.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">e.g. 90% remains</text><rect x="570" y="60" width="150" height="66" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="645.0" y="88.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Microservice</text><text x="645.0" y="108.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">the bottleneck</text><line x1="550" y1="150" x2="740" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="645.0" y="138" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">learn, repeat or stop</text><rect x="740" y="60" width="200" height="100" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="840.0" y="105.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Monolith may remain,</text><text x="840.0" y="125.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">diminished</text><rect x="740" y="180" width="200" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="840.0" y="210.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Microservices</text><text x="490" y="280" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">big-bang rewrite: the only thing guaranteed is a big bang (Martin Fowler)</text><text x="490" y="303" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">each small step can be learned from, and a wrong step is only a small one</text></svg>