<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><rect x="20" y="15" width="440" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">In the monolith: one join</text><rect x="50" y="80" width="180" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="140.0" y="103.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Finance code</text><text x="140.0" y="123.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">monthly bestsellers</text><rect x="270" y="70" width="170" height="44" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="355.0" y="87.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Ledger table</text><text x="355.0" y="107.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">SKU, date</text><rect x="270" y="130" width="170" height="44" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="355.0" y="147.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Albums table</text><text x="355.0" y="167.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">title by SKU</text><line x1="230" y1="100" x2="270" y2="92" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="230" y1="116" x2="270" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="240" y="230" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">one SELECT joining Ledger to Albums:</text><text x="240" y="250" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">databases are very good at this</text><rect x="480" y="15" width="500" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="502" y="49" font-size="16" font-weight="700" fill="#14324f">After extraction: a join in application code</text><rect x="500" y="80" width="160" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="580.0" y="113.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Finance service</text><rect x="760" y="60" width="170" height="44" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="845.0" y="87.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Ledger table</text><rect x="760" y="190" width="170" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="845.0" y="217.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Catalog service</text><rect x="760" y="250" width="170" height="44" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="845.0" y="277.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Albums table</text><line x1="660" y1="95" x2="760" y2="82" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="710" y="68" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">1 SELECT best SKUs</text><line x1="660" y1="125" x2="760" y2="205" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="700" y="180" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">2 get these SKUs</text><line x1="845" y1="234" x2="845" y2="250" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="730" y="330" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">logically the same join, now slower; mitigate with bulk lookups</text><text x="730" y="350" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">or caching album data locally</text></svg>