<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><rect x="20" y="150" width="130" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="85.0" y="185.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Clients</text><rect x="220" y="130" width="200" height="100" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="320.0" y="165.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Proxy</text><text x="320.0" y="185.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">intercepts calls</text><text x="320.0" y="205.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">feature toggle here</text><line x1="150" y1="180" x2="220" y2="180" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="540" y="40" width="200" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="640.0" y="70.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Microservice</text><text x="640.0" y="90.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">functionality already moved</text><rect x="540" y="250" width="200" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="640.0" y="280.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Monolith</text><text x="640.0" y="300.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">functionality still here</text><line x1="420" y1="160" x2="540" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="100" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">moved</text><line x1="420" y1="200" x2="540" y2="280" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="470" y="260" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">not yet moved</text><line x1="420" y1="180" x2="540" y2="180" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="480" y="168" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">parallel run: both, compare</text><text x="500" y="360" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">strangler fig: wrap the old system, new functionality takes over incrementally,</text><text x="500" y="380" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">often with no change to the monolith, which is unaware it is wrapped</text></svg>