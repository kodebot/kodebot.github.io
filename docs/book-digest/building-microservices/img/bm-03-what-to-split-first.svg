<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><line x1="80" y1="340" x2="860" y2="340" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="470" y="372" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">benefit of extracting</text><line x1="80" y1="340" x2="80" y2="40" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="40" y="190" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">ease</text><rect x="110" y="60" width="330" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="275.0" y="95.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Low priority</text><text x="275.0" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">easy but little benefit</text><rect x="480" y="60" width="330" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="645.0" y="95.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">First picks</text><text x="645.0" y="115.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">easy and useful: quick wins, momentum</text><rect x="110" y="190" width="330" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="275.0" y="225.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Skip for now</text><text x="275.0" y="245.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">hard and little benefit</text><rect x="480" y="190" width="330" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="645.0" y="225.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Later</text><text x="645.0" y="245.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">valuable but tangled or critical: higher risk</text><text x="470" y="392" font-size="11" font-weight="400" fill="#14324f" text-anchor="middle">goal decides benefit: load bottlenecks for scaling, volatile code (e.g. CodeScene hotspots) for speed</text></svg>