<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="300" fill="#ffffff"/><rect x="20" y="110" width="170" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="105.0" y="150.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Order Processor</text><rect x="250" y="40" width="170" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="335.0" y="73.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Request queue</text><rect x="480" y="110" width="170" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="565.0" y="140.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Inventory</text><text x="565.0" y="160.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">reserves stock</text><rect x="250" y="200" width="170" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="335.0" y="233.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Response queue</text><line x1="190" y1="130" x2="250" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="200" y="100" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">1 reserve stock</text><line x1="420" y1="70" x2="480" y2="125" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="480" y1="165" x2="420" y2="225" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="470" y="210" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">2 stock reserved</text><line x1="250" y1="230" x2="190" y2="165" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="235" y="250" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">3 correlate</text><rect x="20" y="230" width="190" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="115.0" y="255.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Store request state</text><text x="115.0" y="275.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">so any instance can match</text><line x1="105" y1="180" x2="105" y2="230" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="500" y="285" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">queues buffer requests; add a timeout; the responder must know where to send the reply</text></svg>