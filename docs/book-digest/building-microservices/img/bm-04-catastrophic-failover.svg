<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="340" fill="#ffffff"/><rect x="20" y="50" width="210" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="125.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Worker picks up</text><text x="125.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">a bad message</text><rect x="275" y="50" width="210" height="76" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="380.0" y="83.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Worker crashes</text><text x="380.0" y="103.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">(a bug in that case)</text><rect x="530" y="50" width="210" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="635.0" y="83.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Lock times out</text><text x="635.0" y="103.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">message returns to queue</text><rect x="785" y="50" width="210" height="76" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="890.0" y="83.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Another worker</text><text x="890.0" y="103.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">picks it up and dies</text><line x1="230" y1="88.0" x2="275" y2="88.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="485" y1="88.0" x2="530" y2="88.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="740" y1="88.0" x2="785" y2="88.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="850" y1="126" x2="850" y2="190" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5"/><line x1="850" y1="190" x2="125" y2="190" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5"/><line x1="125" y1="190" x2="125" y2="126" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="490" y="220" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">catastrophic failover: all workers eventually die</text><rect x="210" y="255" width="270" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="345.0" y="280.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Fix: maximum retry count</text><text x="345.0" y="300.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">on the queue</text><rect x="520" y="255" width="300" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="670.0" y="280.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Dead letter queue / message hospital</text><text x="670.0" y="300.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">to view and replay failed messages</text></svg>