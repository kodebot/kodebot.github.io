<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="420" fill="#ffffff"/><rect x="20" y="120" width="220" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="130.0" y="155.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Synchronous blocking</text><text x="130.0" y="175.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">caller waits for the response</text><rect x="20" y="250" width="220" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="130.0" y="285.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Asynchronous nonblocking</text><text x="130.0" y="305.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">caller carries on</text><rect x="330" y="20" width="200" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="430.0" y="55.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Request-response</text><rect x="570" y="20" width="180" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="660.0" y="55.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Event-driven</text><rect x="790" y="20" width="150" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="865.0" y="55.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Common data</text><rect x="330" y="120" width="200" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="430.0" y="155.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">yes</text><text x="430.0" y="175.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">usually, nearly always</text><rect x="330" y="250" width="200" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="430.0" y="285.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">yes</text><text x="430.0" y="305.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">e.g. via queues</text><rect x="570" y="120" width="180" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="660.0" y="155.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">no</text><text x="660.0" y="175.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">events are asynchronous</text><rect x="570" y="250" width="180" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="660.0" y="285.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">yes</text><text x="660.0" y="305.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">emitter unaware</text><rect x="790" y="120" width="150" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="865.0" y="165.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">no</text><rect x="790" y="250" width="150" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="865.0" y="285.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">yes</text><text x="865.0" y="305.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">shared data source</text><text x="480" y="375" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">first choose request-response or event-driven; for request-response then choose sync or async;</text><text x="480" y="395" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">event-driven limits you to nonblocking asynchronous implementations</text></svg>