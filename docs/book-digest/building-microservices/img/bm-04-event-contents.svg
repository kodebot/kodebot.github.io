<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><rect x="20" y="15" width="470" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Event with just an ID</text><rect x="40" y="70" width="150" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="115.0" y="93.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Customer</text><text x="115.0" y="113.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">emits: new customer 42</text><rect x="300" y="60" width="170" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="385.0" y="87.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Loyalty: enough</text><rect x="300" y="130" width="170" height="44" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="385.0" y="157.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Notifications</text><line x1="190" y1="90" x2="300" y2="82" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="190" y1="110" x2="300" y2="152" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="300" y1="168" x2="190" y2="125" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="220" y="170" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">callback: email, name?</text><text x="255" y="240" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">extra domain coupling and a barrage of</text><text x="255" y="258" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">requests on Customer as consumers grow</text><rect x="510" y="15" width="470" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="532" y="49" font-size="16" font-weight="700" fill="#14324f">Fully detailed event (preferred)</text><rect x="530" y="70" width="150" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="605.0" y="93.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Customer</text><text x="605.0" y="113.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">emits ID, name, email</text><rect x="790" y="60" width="170" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="875.0" y="87.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Loyalty</text><rect x="790" y="130" width="170" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="875.0" y="157.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Notifications</text><line x1="680" y1="90" x2="790" y2="82" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="680" y1="110" x2="790" y2="152" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="745" y="240" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">self-sufficient consumers, a historical record</text><text x="745" y="258" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">but size, PII exposure and a wider contract</text><text x="745" y="300" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">rule: put in only what you would share over an API</text></svg>