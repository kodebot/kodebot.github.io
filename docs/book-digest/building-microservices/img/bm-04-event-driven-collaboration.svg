<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="340" fill="#ffffff"/><rect x="20" y="130" width="170" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="105.0" y="160.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Warehouse</text><text x="105.0" y="180.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">emits events</text><rect x="270" y="130" width="170" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="355.0" y="160.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Message broker</text><text x="355.0" y="180.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">e.g. RabbitMQ</text><line x1="190" y1="165" x2="270" y2="165" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="230.0" y="155" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">publish</text><rect x="560" y="50" width="200" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="660.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Notifications</text><text x="660.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">emails customer</text><rect x="560" y="210" width="200" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="660.0" y="243.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Inventory</text><text x="660.0" y="263.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">updates stock</text><line x1="440" y1="150" x2="560" y2="90" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="100" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">subscribe</text><line x1="440" y1="180" x2="560" y2="245" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="235" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">subscribe</text><text x="860" y="150" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the emitter knows</text><text x="860" y="168" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">nothing of consumers</text><text x="480" y="325" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">an event is a fact; a message is the medium that carries it</text></svg>