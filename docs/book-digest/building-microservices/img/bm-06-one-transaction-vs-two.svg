<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><rect x="20" y="15" width="450" height="300" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">One database: one ACID transaction</text><rect x="40" y="70" width="410" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="245.0" y="100.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Customer + PendingEnrollments tables</text><text x="245.0" y="120.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">status to VERIFIED and delete row: both or neither</text><text x="245" y="200" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">atomicity holds for the whole operation</text><rect x="510" y="15" width="450" height="300" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="532" y="49" font-size="16" font-weight="700" fill="#14324f">Two databases: two transactions</text><rect x="530" y="70" width="190" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="625.0" y="100.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Customer service</text><text x="625.0" y="120.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">own transaction</text><rect x="750" y="70" width="190" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="845.0" y="100.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Enrollments service</text><text x="845.0" y="120.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">own transaction</text><text x="735" y="200" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">each can succeed or fail independently;</text><text x="735" y="220" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">atomicity of the whole is lost</text></svg>