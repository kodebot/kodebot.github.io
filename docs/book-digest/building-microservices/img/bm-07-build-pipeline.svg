<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Build pipeline: one artifact, many stages</text><rect x="20" y="45" width="210" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="125.0" y="78.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Fast tests</text><text x="125.0" y="98.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">build artifact once</text><rect x="275" y="45" width="210" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="380.0" y="88.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Slow tests</text><rect x="530" y="45" width="210" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="635.0" y="78.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Performance</text><text x="635.0" y="98.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">tests</text><rect x="785" y="45" width="210" height="76" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="890.0" y="88.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Production</text><line x1="230" y1="83.0" x2="275" y2="83.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="485" y1="83.0" x2="530" y2="83.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="740" y1="83.0" x2="785" y2="83.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="170" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the same build-123 artifact is deployed at every stage; config lives outside it</text><text x="20" y="215" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Pipeline history</text><rect x="20" y="232" width="300" height="50" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="170.0" y="262.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">build-120: failed fast tests</text><rect x="350" y="232" width="300" height="50" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="500.0" y="262.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">build-121: failed performance tests</text><rect x="680" y="232" width="300" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="830.0" y="262.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">build-122: reached production</text></svg>