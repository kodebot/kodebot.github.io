<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="340" fill="#ffffff"/><rect x="20" y="15" width="440" height="310" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Multirepo: two commits</text><rect x="40" y="70" width="190" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="135.0" y="90.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Inventory repo</text><text x="135.0" y="110.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">commit 1: new API</text><rect x="40" y="150" width="190" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="135.0" y="170.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Shipping repo</text><text x="135.0" y="190.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">commit 2: use API</text><text x="240" y="250" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">stage them: Inventory first</text><text x="240" y="270" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">frequent cross-repo change signals</text><text x="240" y="290" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">wrong service boundaries</text><rect x="500" y="15" width="440" height="310" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="522" y="49" font-size="16" font-weight="700" fill="#14324f">Monorepo: one commit</text><rect x="520" y="70" width="400" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="720.0" y="100.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Inventory + Shipping changed in one commit</text><text x="720" y="170" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">atomic commit is not atomic deploy:</text><text x="720" y="195" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">still deploy independently, in order</text></svg>