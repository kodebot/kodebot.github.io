<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="320" fill="#ffffff"/><rect x="20" y="100" width="190" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="115.0" y="130.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Developer laptop</text><text x="115.0" y="150.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">fastest feedback</text><rect x="330" y="100" width="190" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="425.0" y="130.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Test environments</text><text x="425.0" y="150.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">closer to production</text><rect x="640" y="100" width="190" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="735.0" y="130.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Production</text><text x="735.0" y="150.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">most realistic, slowest</text><line x1="210" y1="135" x2="330" y2="135" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="520" y1="135" x2="640" y2="135" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="230" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">moving right: more certainty, more production-like, more cost and time</text><text x="480" y="255" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">moving left: faster feedback, less like production</text></svg>