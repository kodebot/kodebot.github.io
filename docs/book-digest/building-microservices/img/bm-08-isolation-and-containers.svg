<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="340" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Isolation versus cost and speed</text><rect x="20" y="45" width="290" height="76" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="165.0" y="78.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Dedicated machine</text><text x="165.0" y="98.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">best isolation, costliest</text><rect x="355" y="45" width="290" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="500.0" y="78.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Virtual machine</text><text x="500.0" y="98.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">strong isolation, hypervisor cost</text><rect x="690" y="45" width="290" height="76" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="835.0" y="78.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Container</text><text x="835.0" y="98.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">weaker, cheaper, seconds to start</text><line x1="310" y1="83.0" x2="355" y2="83.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="645" y1="83.0" x2="690" y2="83.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="160" width="460" height="165" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="194" font-size="16" font-weight="700" fill="#14324f">Type 2 virtualisation</text><rect x="40" y="200" width="420" height="28" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="250.0" y="219.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Hypervisor on host OS (takes CPU, I/O, memory)</text><rect x="40" y="235" width="200" height="28" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="140.0" y="254.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">VM: own OS and kernel</text><rect x="260" y="235" width="200" height="28" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="360.0" y="254.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">VM: own OS and kernel</text><rect x="520" y="160" width="460" height="165" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="542" y="194" font-size="16" font-weight="700" fill="#14324f">Containers</text><rect x="540" y="200" width="420" height="28" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="750.0" y="219.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Shared host kernel (no hypervisor)</text><rect x="540" y="235" width="200" height="28" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="640.0" y="254.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Container</text><rect x="760" y="235" width="200" height="28" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="860.0" y="254.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Container</text></svg>