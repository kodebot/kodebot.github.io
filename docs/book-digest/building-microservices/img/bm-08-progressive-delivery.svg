<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="430" fill="#ffffff"/><rect x="20" y="15" width="470" height="195" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Blue-green</text><rect x="40" y="65" width="140" height="44" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="110.0" y="92.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Router</text><rect x="250" y="60" width="210" height="40" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="355.0" y="85.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Blue: live version</text><rect x="250" y="115" width="210" height="40" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="355.0" y="140.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Green: new, verified</text><line x1="180" y1="85" x2="250" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="180" y1="95" x2="250" y2="135" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="170" y="150" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">switch when ready</text><rect x="510" y="15" width="470" height="195" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="532" y="49" font-size="16" font-weight="700" fill="#14324f">Canary release</text><rect x="530" y="65" width="140" height="44" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="600.0" y="92.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Router</text><rect x="740" y="60" width="220" height="40" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="850.0" y="85.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Old version: most traffic</text><rect x="740" y="115" width="220" height="40" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="850.0" y="140.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">New version: small share</text><line x1="670" y1="85" x2="740" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="670" y1="95" x2="740" y2="135" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="745" y="185" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">ramp up while watching error rates</text><rect x="20" y="225" width="470" height="190" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="259" font-size="16" font-weight="700" fill="#14324f">Parallel run</text><rect x="40" y="275" width="140" height="44" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="110.0" y="302.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Request</text><rect x="250" y="265" width="220" height="40" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="360.0" y="290.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Source of truth (old)</text><rect x="250" y="320" width="220" height="40" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="360.0" y="345.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">New: compare only</text><line x1="180" y1="290" x2="250" y2="285" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="180" y1="300" x2="250" y2="340" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="510" y="225" width="470" height="190" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="532" y="259" font-size="16" font-weight="700" fill="#14324f">Feature toggle</text><rect x="530" y="275" width="160" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="610.0" y="302.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Deployed feature</text><rect x="750" y="275" width="200" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="850.0" y="302.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Toggle: off, on, per user</text><line x1="690" y1="297" x2="750" y2="297" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="745" y="350" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">deployment is not release</text><text x="745" y="375" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">trunk-based work hidden until ready</text></svg>