<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><rect x="20" y="160" width="200" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="120.0" y="185.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Consumer team</text><text x="120.0" y="205.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">(helpdesk, web shop)</text><text x="120.0" y="225.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">writes expectations</text><rect x="320" y="60" width="220" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="430.0" y="85.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Pact file (JSON)</text><text x="430.0" y="105.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">contract</text><line x1="220" y1="185" x2="320" y2="100" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="140" y="130" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">1 generated with a mock server</text><rect x="300" y="250" width="260" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="430.0" y="280.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Pact Broker</text><text x="430.0" y="300.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">stores versions, shows who depends</text><line x1="430" y1="120" x2="430" y2="250" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="470" y="190" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">2 publish</text><rect x="640" y="160" width="340" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="810.0" y="185.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Producer build (Customer microservice)</text><text x="810.0" y="205.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">3 replays contracts against the service,</text><text x="810.0" y="225.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">dependencies stubbed</text><line x1="540" y1="285" x2="640" y2="220" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="590.0" y="244.5" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">fetch</text><text x="500" y="365" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">scope like a service test; a broken contract tells you which consumer is affected, then talk</text></svg>