<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><rect x="20" y="15" width="300" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Unit test</text><rect x="40" y="70" width="260" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="170.0" y="100.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Customer: one function or class</text><text x="170" y="170" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">no services launched,</text><text x="170" y="190" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">no network or files</text><text x="170" y="220" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">thousands per minute</text><rect x="350" y="15" width="300" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="372" y="49" font-size="16" font-weight="700" fill="#14324f">Service test</text><rect x="370" y="70" width="260" height="50" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="500.0" y="100.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Customer microservice (real)</text><rect x="370" y="160" width="260" height="50" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="500.0" y="190.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Loyalty (stub, e.g. mountebank)</text><line x1="500" y1="120" x2="500" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="260" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">one service in scope;</text><text x="500" y="280" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">collaborators stubbed</text><rect x="680" y="15" width="300" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="702" y="49" font-size="16" font-weight="700" fill="#14324f">End-to-end test</text><rect x="700" y="70" width="120" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="760.0" y="97.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Helpdesk</text><rect x="840" y="70" width="120" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="900.0" y="97.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Web shop</text><rect x="770" y="150" width="120" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="830.0" y="177.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Customer</text><rect x="770" y="230" width="120" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="830.0" y="257.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Loyalty</text><line x1="760" y1="114" x2="810" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="900" y1="114" x2="850" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="830" y1="194" x2="830" y2="230" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="830" y="315" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">everything real: most confidence,</text><text x="830" y="335" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">flaky, slow, hard to diagnose</text></svg>