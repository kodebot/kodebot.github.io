<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Spans collected into a trace</text><rect x="20" y="50" width="600" height="36" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="320.0" y="73.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Span: Gateway request</text><rect x="100" y="100" width="300" height="36" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="250.0" y="123.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Span: Streaming service</text><rect x="180" y="150" width="160" height="36" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="260.0" y="173.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Span: Payment</text><rect x="350" y="150" width="150" height="36" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="425.0" y="173.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Span: Customer</text><rect x="510" y="150" width="110" height="36" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="565.0" y="173.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Span: Email</text><rect x="660" y="50" width="320" height="130" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="820.0" y="90.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Collector assembles spans</text><text x="820.0" y="110.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">start/end, logs, key-value tags</text><text x="820.0" y="130.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">via local agent; sampling needed</text><text x="820.0" y="150.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">(Dapper, Jaeger 1 in 1,000)</text><text x="500" y="240" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">(illustrative nesting) gives true causality and latency; use OpenTelemetry (from OpenTracing and OpenCensus)</text><text x="500" y="262" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">Jaeger open source; Honeycomb and Lightstep commercial and high cardinality</text></svg>