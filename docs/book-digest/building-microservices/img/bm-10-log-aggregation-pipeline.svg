<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/><rect x="20" y="140" width="160" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="100.0" y="165.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Microservice</text><text x="100.0" y="185.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">instance</text><rect x="230" y="140" width="150" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="305.0" y="175.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Local log file</text><rect x="430" y="140" width="150" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="505.0" y="165.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Forwarding</text><text x="505.0" y="185.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">agent (daemon)</text><rect x="630" y="140" width="150" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="705.0" y="165.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Central log</text><text x="705.0" y="185.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">store</text><rect x="830" y="140" width="150" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="905.0" y="165.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Operators</text><text x="905.0" y="185.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">query</text><line x1="180" y1="170" x2="230" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="380" y1="170" x2="430" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="580" y1="170" x2="630" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="780" y1="170" x2="830" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="80" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">services just write to the local filesystem; no special API</text><text x="500" y="250" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">standard format: date, time, service, level, correlation ID in fixed places</text><text x="500" y="275" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">prerequisite for microservices: build it before anything else</text></svg>