<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="380" fill="#fbf7ef"/><path d="M301.1 20.0L700.3 20.4L698.9 100.3L300.7 99.2Z" fill="#eed5cc" stroke="none"/><path d="M298.5 20.0Q500.1 20.0 701.8 19.6M299.5 20.4Q500.5 19.6 701.5 20.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M700.8 18.3Q699.5 59.7 700.0 101.2M699.9 17.9Q701.4 59.5 700.3 101.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M701.5 99.4Q500.1 102.2 298.7 99.5M701.4 99.7Q499.6 98.2 297.8 100.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M300.9 101.0Q300.2 59.3 300.1 17.7M300.2 100.9Q298.8 60.1 299.1 19.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="55.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Secret zone: health data</text><text x="500.0" y="77.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">zero trust</text><path d="M199.1 129.9L800.2 129.7L800.7 209.7L201.0 209.8Z" fill="#efe0ca" stroke="none"/><path d="M198.4 129.3Q499.7 130.9 801.0 129.1M197.7 129.3Q499.6 131.7 801.5 129.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M799.9 127.9Q801.1 169.6 799.3 211.3M799.2 128.5Q799.0 169.5 800.4 210.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M801.3 209.5Q499.6 210.0 197.9 209.1M800.9 210.2Q499.4 211.3 197.9 210.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M200.2 212.1Q202.0 170.5 200.3 128.9M199.8 212.0Q198.6 170.2 199.0 128.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="165.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Private zone: logged-in users&#x27; data</text><text x="500.0" y="187.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(e.g. insurance plan)</text><path d="M101.1 239.0L900.3 240.4L900.5 318.8L99.4 321.1Z" fill="#d6e1cf" stroke="none"/><path d="M98.4 239.4Q500.0 241.4 901.6 239.4M99.6 240.2Q500.0 240.6 900.5 240.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M900.9 239.2Q901.6 279.8 900.3 320.5M901.1 237.5Q899.2 279.0 899.8 320.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M901.1 319.6Q499.5 321.6 98.0 320.0M902.1 319.3Q500.2 318.6 98.4 319.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M100.6 321.3Q101.5 280.2 100.1 239.1M99.5 322.4Q99.6 280.1 100.0 237.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="275.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Public zone: freely shareable data</text><text x="500.0" y="297.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">closer to implicit trust</text><path d="M499.4 100.1Q499.0 115.4 501.0 130.7M501.0 99.8Q498.9 114.9 498.9 130.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M499.6 130.3Q502.8 124.7 505.8 118.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M499.8 130.3Q497.1 124.9 494.8 119.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="760" y="118" font-size="15" fill="#3b2f20" text-anchor="middle" stroke="#fbf7ef" stroke-width="5" paint-order="stroke">more secure zones may call less secure ones</text><path d="M500.5 210.3Q499.5 225.1 499.6 240.0M499.1 209.2Q498.9 224.8 499.6 240.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M500.4 239.5Q503.0 234.5 505.6 229.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M499.9 239.7Q497.5 234.4 494.6 229.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="355" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">a service runs in the zone of the most sensitive data it uses; services cannot reach down into more secure zones</text></svg>