<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="380" fill="#ffffff"/><rect x="300" y="20" width="400" height="80" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="500.0" y="55.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Secret zone: health data</text><text x="500.0" y="75.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">zero trust</text><rect x="200" y="130" width="600" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="500.0" y="165.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Private zone: logged-in users&#x27; data</text><text x="500.0" y="185.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">(e.g. insurance plan)</text><rect x="100" y="240" width="800" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="500.0" y="275.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Public zone: freely shareable data</text><text x="500.0" y="295.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">closer to implicit trust</text><line x1="500" y1="100" x2="500" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="760" y="118" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">more secure zones may call less secure ones</text><line x1="500" y1="210" x2="500" y2="240" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="355" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a service runs in the zone of the most sensitive data it uses; services cannot reach down into more secure zones</text></svg>