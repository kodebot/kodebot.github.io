<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><rect x="20" y="15" width="470" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Before: one shared pool</text><rect x="40" y="70" width="130" height="50" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="105.0" y="100.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Requests</text><rect x="210" y="70" width="150" height="50" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="285.0" y="90.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">One HTTP pool</text><text x="285.0" y="110.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">exhausted</text><line x1="170" y1="95" x2="210" y2="95" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="390" y="50" width="90" height="36" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="435.0" y="73.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Turnip</text><rect x="390" y="100" width="90" height="36" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="435.0" y="123.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Legacy B</text><rect x="390" y="150" width="90" height="36" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="435.0" y="173.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Legacy C</text><line x1="360" y1="90" x2="390" y2="68" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="360" y1="95" x2="390" y2="118" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="360" y1="100" x2="390" y2="168" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="255" y="250" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">slow turnip calls hold every worker;</text><text x="255" y="270" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">40 connections became about 800</text><text x="255" y="300" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">no timeout waiting for a worker</text><rect x="510" y="15" width="470" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="532" y="49" font-size="16" font-weight="700" fill="#14324f">After: bulkheads, timeouts, breakers</text><rect x="530" y="60" width="120" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="590.0" y="87.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Pool: Turnip</text><rect x="700" y="60" width="120" height="44" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="760.0" y="87.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Circuit breaker</text><line x1="650" y1="82" x2="700" y2="82" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="850" y="60" width="110" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="905.0" y="87.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Turnip</text><line x1="820" y1="82" x2="850" y2="82" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="530" y="130" width="120" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="590.0" y="157.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Pool: Legacy B</text><rect x="700" y="130" width="120" height="44" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="760.0" y="157.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Circuit breaker</text><line x1="650" y1="152" x2="700" y2="152" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="850" y="130" width="110" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="905.0" y="157.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Legacy B</text><line x1="820" y1="152" x2="850" y2="152" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="530" y="200" width="120" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="590.0" y="227.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Pool: Legacy C</text><rect x="700" y="200" width="120" height="44" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="760.0" y="227.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Circuit breaker</text><line x1="650" y1="222" x2="700" y2="222" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="850" y="200" width="110" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="905.0" y="227.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Legacy C</text><line x1="820" y1="222" x2="850" y2="222" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="745" y="290" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">1 s call timeout, 1 s wait for a worker;</text><text x="745" y="310" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">breaker fails fast; UI shows turnip ads</text><text x="745" y="330" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">temporarily unavailable</text></svg>