<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="370" fill="#ffffff"/><rect x="20" y="15" width="460" height="300" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">AP: available, eventually consistent</text><rect x="40" y="70" width="170" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="125.0" y="93.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">DC1 node</text><text x="125.0" y="113.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">accepts writes</text><rect x="290" y="70" width="170" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="375.0" y="93.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">DC2 node</text><text x="375.0" y="113.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">serves stale reads</text><line x1="210" y1="98" x2="290" y2="98" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="250" y="88" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">link down</text><text x="250" y="200" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">keeps working in a partition; must resync later</text><text x="250" y="222" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">easier to build and scale</text><rect x="500" y="15" width="480" height="300" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="522" y="49" font-size="16" font-weight="700" fill="#14324f">CP: consistent, may refuse requests</text><rect x="520" y="70" width="170" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="605.0" y="103.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">DC1 node</text><rect x="790" y="70" width="170" height="56" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="875.0" y="93.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">DC2 node</text><text x="875.0" y="113.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">refuses to answer</text><line x1="690" y1="98" x2="790" y2="98" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="740" y="88" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">link down</text><text x="740" y="200" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">coordination needs locks; very hard</text><text x="740" y="222" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">use Consul or an off-the-shelf store</text><text x="500" y="350" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">CA does not exist over a network; choose per capability (stale balance reads, consistent updates)</text></svg>