<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><rect x="20" y="120" width="220" height="76" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="130.0" y="153.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Closed</text><text x="130.0" y="173.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">calls flow normally</text><rect x="400" y="120" width="220" height="76" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="510.0" y="153.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Open (blown)</text><text x="510.0" y="173.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">all calls fail fast</text><rect x="760" y="120" width="220" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="870.0" y="153.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Half-open</text><text x="870.0" y="173.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">probe with a few requests</text><line x1="240" y1="145" x2="400" y2="145" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="320" y="100" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">failures reach threshold (errors, timeouts, some 5XX)</text><line x1="620" y1="145" x2="760" y2="145" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="690" y="132" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">after a wait</text><line x1="870" y1="196" x2="870" y2="262" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5"/><line x1="870" y1="262" x2="130" y2="262" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5"/><line x1="130" y1="262" x2="130" y2="196" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="500" y="285" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">enough healthy responses: reset</text><line x1="760" y1="175" x2="620" y2="175" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="690" y="205" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">probe fails</text><text x="500" y="50" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">open breakers by hand during maintenance; scope one breaker per downstream</text></svg>