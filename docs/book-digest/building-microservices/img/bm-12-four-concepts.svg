<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Woods&#x27; four concepts of resilience</text><rect x="20" y="45" width="215" height="90" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="127.5" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Robustness</text><text x="127.5" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">absorb expected</text><text x="127.5" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">perturbation</text><rect x="275" y="45" width="215" height="90" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="382.5" y="75.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Rebound</text><text x="382.5" y="95.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">recover after</text><text x="382.5" y="115.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">a traumatic event</text><rect x="530" y="45" width="215" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="637.5" y="75.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Graceful extensibility</text><text x="637.5" y="95.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">handle the</text><text x="637.5" y="115.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">unexpected</text><rect x="785" y="45" width="215" height="90" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="892.5" y="75.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Sustained adaptability</text><text x="892.5" y="95.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">keep adapting to</text><text x="892.5" y="115.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">a changing future</text><line x1="235" y1="90.0" x2="275" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="490" y1="90.0" x2="530" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="745" y1="90.0" x2="785" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="185" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">microservices mainly help robustness; resilience is a property of the people and organisation</text><text x="500" y="215" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">robustness adds complexity (Kubernetes fixes some failures, adds new ones); automation cannot handle surprise</text><text x="500" y="245" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">blame-free learning, game days and chaos engineering feed rebound and adaptability</text></svg>