chor="middle">TTL trade-off: 5 min to 1 min cuts staleness to a fifth but means five times the origin calls</text><text x="500" y="315" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">cache poisoning: an Expires: Never header left browsers holding pages forever</text></svg>