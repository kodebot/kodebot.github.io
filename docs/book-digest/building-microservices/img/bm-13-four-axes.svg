<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="350" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">The four axes of scaling</text><rect x="20" y="45" width="215" height="90" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="127.5" y="85.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Vertical</text><text x="127.5" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">a bigger machine</text><rect x="275" y="45" width="215" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="382.5" y="85.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Horizontal duplication</text><text x="382.5" y="105.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">more copies of the same</text><rect x="530" y="45" width="215" height="90" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="637.5" y="75.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Data partitioning</text><text x="637.5" y="95.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">by a key such as</text><text x="637.5" y="115.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">customer ID</text><rect x="785" y="45" width="215" height="90" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="892.5" y="85.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Functional decomposition</text><text x="892.5" y="105.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">split out services</text><line x1="235" y1="90.0" x2="275" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="490" y1="90.0" x2="530" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="745" y1="90.0" x2="785" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="180" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">vertical: quick to try, little robustness gain, multicore limits</text><text x="500" y="205" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">horizontal: load balancer, competing consumers, read replicas; avoid sticky sessions</text><text x="500" y="230" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">partitioning: good for writes; needs an even key (ID, not surname); a failed partition loses its share</text><text x="500" y="255" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">decomposition: rightsize each workload; the biggest change; try the others first</text><text x="500" y="305" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">FoodCo: vertical exhausted, replicas used, partitioning rejected, so decompose (deliveries, menus first)</text></svg>