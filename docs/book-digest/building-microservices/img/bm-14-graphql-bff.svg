<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="320" fill="#ffffff"/><rect x="20" y="110" width="180" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="110.0" y="140.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Mobile client</text><text x="110.0" y="160.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">one GraphQL query</text><rect x="300" y="110" width="200" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="400.0" y="140.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">GraphQL server</text><text x="400.0" y="160.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">resolvers map to calls</text><line x1="200" y1="145" x2="300" y2="145" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="600" y="40" width="180" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="690.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Order service</text><rect x="600" y="120" width="180" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="690.0" y="150.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Delivery service</text><rect x="600" y="200" width="180" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="690.0" y="230.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Customer service</text><line x1="500" y1="130" x2="600" y2="65" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="500" y1="145" x2="600" y2="145" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="500" y1="160" x2="600" y2="225" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="290" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">client picks fields and nesting; a BFF can be implemented with GraphQL; new types still need server changes</text></svg>