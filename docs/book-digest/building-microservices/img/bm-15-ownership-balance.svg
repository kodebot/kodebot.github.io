<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="380" fill="#ffffff"/><path d="M21.1 15.0L490.3 15.4L488.9 365.3L20.7 364.2Z" fill="#f6f6f6" stroke="none"/><path d="M18.5 15.0Q255.1 15.0 491.8 14.6M19.5 15.4Q255.5 14.6 491.5 15.9" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 13.3Q489.2 189.7 490.0 366.2M489.9 12.9Q491.9 189.5 490.3 366.0" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 364.4Q255.1 367.2 18.7 364.5M491.4 364.7Q254.6 363.2 17.8 365.1" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 366.0Q20.0 189.3 20.1 12.7M20.2 365.9Q18.5 190.1 19.1 14.3" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="49" font-size="20.0" fill="#1e1e1e">Strong ownership</text><path d="M39.1 69.9L470.2 69.7L470.7 119.7L41.0 119.8Z" fill="#daeedd" stroke="none"/><path d="M38.4 69.3Q254.7 70.9 471.0 69.1M37.7 69.3Q254.6 71.7 471.5 69.5" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M469.9 67.9Q470.7 94.6 469.3 121.3M469.2 68.5Q469.2 94.5 470.4 120.6" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.3 119.5Q254.6 120.0 37.9 119.1M470.9 120.2Q254.4 121.3 37.9 120.4" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.2 122.1Q41.6 95.5 40.3 68.9M39.8 122.0Q38.8 95.2 39.0 68.5" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="101.0" font-size="16.5" fill="#1e1e1e" text-anchor="middle">One team decides changes, technology, deployment</text><text x="255" y="160" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">more autonomy and local optimisation;</text><text x="255" y="182" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">others send requests or pull requests</text><text x="255" y="220" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">aim: full life-cycle ownership over time</text><path d="M511.1 14.0L980.3 15.4L980.5 363.8L509.4 366.1Z" fill="#f6f6f6" stroke="none"/><path d="M508.4 14.4Q745.0 16.4 981.6 14.4M509.6 15.2Q745.0 15.6 980.5 15.1" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 14.2Q981.9 189.8 980.3 365.5M981.1 12.5Q978.6 189.0 979.8 365.5" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 364.6Q744.5 366.6 508.0 365.0M982.1 364.3Q745.2 363.6 508.4 364.7" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 366.3Q512.0 190.2 510.1 14.1M509.5 367.4Q509.6 190.1 510.0 12.8" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="532" y="49" font-size="20.0" fill="#1e1e1e">Collective ownership</text><path d="M529.3 70.1L961.1 70.8L961.1 121.1L529.7 118.8Z" fill="#fbeed1" stroke="none"/><path d="M528.5 70.8Q744.6 72.0 960.6 70.5M527.6 70.4Q744.4 72.4 961.1 70.6" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M959.9 68.1Q960.8 94.9 960.5 121.8M960.0 69.0Q960.1 94.8 959.1 120.7" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M962.0 120.4Q745.6 119.3 529.3 119.1M961.7 120.0Q745.0 118.7 528.3 119.4" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M529.9 122.0Q530.9 94.7 530.3 67.5M531.0 121.4Q531.2 95.4 529.0 69.5" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="101.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">Any team may change any service</text><text x="745" y="160" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">flexible staffing, but needs global consistency;</text><text x="745" y="182" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">more coordination, so coupling</text><text x="745" y="220" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">fine inside a team, risky across a large organisation</text><text x="500" y="345" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle">consistency at the left, local optimisation at the right; the best organisations keep moving right</text></svg>