<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="340" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">From goals to practices</text><rect x="20" y="45" width="290" height="90" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="165.0" y="85.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Strategic goals</text><text x="165.0" y="105.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">where the company is going</text><rect x="360" y="45" width="290" height="90" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="505.0" y="85.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Principles</text><text x="505.0" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">fewer than 10; stable</text><rect x="700" y="45" width="290" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="845.0" y="75.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Practices</text><text x="845.0" y="95.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">technology specific;</text><text x="845.0" y="115.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">change more often</text><line x1="310" y1="90.0" x2="360" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="650" y1="90.0" x2="700" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="185" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">example: goal faster time to market, principle full life-cycle ownership,</text><text x="500" y="207" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">practice deploy each microservice into an isolated AWS account</text><text x="500" y="245" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">constraints are very hard to change; principles are chosen; the platform makes practices easy</text><text x="500" y="280" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">fitness functions measure whether the architecture still meets its principles (e.g. response within 100 ms)</text></svg>