<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/><rect x="20" y="15" width="960" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Town planner: zones, not buildings</text><rect x="40" y="60" width="420" height="150" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="62" y="94" font-size="16" font-weight="700" fill="#14324f">Marketing zone (one team)</text><rect x="52" y="105" width="130" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="117.0" y="125.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Recommend-</text><text x="117.0" y="145.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">ations</text><rect x="197" y="105" width="110" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="252.0" y="135.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Promotions</text><rect x="332" y="105" width="110" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="387.0" y="135.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Sales</text><line x1="182" y1="130" x2="197" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="307" y1="130" x2="332" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="520" y="100" width="200" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="620.0" y="125.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Rest of the system</text><text x="620.0" y="145.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">other zones</text><line x1="460" y1="130" x2="520" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="115" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">team API</text><text x="500" y="245" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">free inside a zone (technology, data store); be careful between zones (protocols, monitoring)</text><text x="500" y="270" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">&quot;worry about what happens between the boxes, be liberal inside&quot;</text><text x="500" y="305" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">information hiding at team level; hard-to-change things (organisation) help define zones</text></svg>