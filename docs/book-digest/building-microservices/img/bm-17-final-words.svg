<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="300" fill="#ffffff"/><rect x="20" y="40" width="215" height="90" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="127.5" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Make each decision</text><text x="127.5" y="100.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">small in scope</text><rect x="275" y="40" width="215" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="382.5" y="80.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Evolutionary</text><text x="382.5" y="100.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">architecture</text><rect x="530" y="40" width="215" height="90" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="637.5" y="80.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Incremental change,</text><text x="637.5" y="100.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">no big bang</text><rect x="785" y="40" width="215" height="90" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="892.5" y="80.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Embrace change</text><text x="892.5" y="100.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">continually</text><line x1="235" y1="85.0" x2="275" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="490" y1="85.0" x2="530" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="745" y1="85.0" x2="785" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="190" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">microservices give more options and more decisions; some will be wrong, so limit their blast radius</text><text x="500" y="220" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">the journey, not a destination: the discipline to keep changing the system matters most</text></svg>