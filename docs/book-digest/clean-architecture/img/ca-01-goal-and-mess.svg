<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 175.3L10.7 174.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 94.7 495.0 176.2M494.9 12.9Q496.9 94.5 495.3 176.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 174.4Q252.6 177.2 8.7 174.5M496.4 174.7Q252.1 173.2 7.8 175.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 176.0Q10.0 94.3 10.1 12.7M10.2 175.9Q8.5 95.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="68.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Design and architecture are one</text><text x="252.5" y="90.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">no dividing line: an architect&#x27;s house plans show the outer shape and every</text><text x="252.5" y="112.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">outlet, switch and pipe; low-level details and high-level structure form one</text><text x="252.5" y="134.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">continuous fabric, a continuum of decisions from highest to lowest</text><path d="M504.1 14.9L990.2 14.7L990.7 174.7L506.0 174.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 94.6 989.3 176.3M989.2 13.5Q988.8 94.5 990.4 175.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 174.5Q747.1 175.0 502.9 174.1M990.9 175.2Q746.9 176.3 502.9 175.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 177.1Q507.7 95.5 505.3 13.9M504.8 177.0Q503.2 95.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="68.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The goal</text><text x="747.5" y="90.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">minimise the human resources required to build and maintain the system;</text><text x="747.5" y="112.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">design quality is the effort needed to meet customer needs: low and staying low</text><text x="747.5" y="134.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">over the lifetime is good, growing with each release is bad</text><path d="M11.1 189.0L330.3 190.4L330.5 368.8L9.4 371.1Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 189.4Q170.0 191.4 331.6 189.4M9.6 190.2Q170.0 190.6 330.5 190.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.9 189.2Q331.9 279.8 330.3 370.5M331.1 187.5Q328.6 279.0 329.8 370.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.1 369.6Q169.5 371.6 8.0 370.0M332.1 369.3Q170.2 368.6 8.4 369.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 371.3Q12.0 280.2 10.1 189.1M9.5 372.4Q9.6 280.1 10.0 187.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="264.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Staff grows (Fig 1.1)</text><text x="170.0" y="286.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">engineering headcount rises steadily across releases,</text><text x="170.0" y="308.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">which looks like success</text><path d="M339.3 190.1L661.1 190.8L661.1 371.1L339.7 368.8Z" fill="#efe0ca" stroke="none"/><path d="M338.5 190.8Q499.6 192.0 660.6 190.5M337.6 190.4Q499.4 192.4 661.1 190.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 188.1Q661.3 279.9 660.5 371.8M660.0 189.0Q660.6 279.8 659.1 370.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M662.0 370.4Q500.6 369.3 339.3 369.1M661.7 370.0Q500.0 368.7 338.3 369.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.9 372.0Q341.5 279.7 340.3 187.5M341.0 371.4Q342.1 280.4 339.0 189.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="264.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Output stalls (Fig 1.2)</text><text x="500.0" y="286.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">lines of code per release approach an asymptote despite</text><text x="500.0" y="308.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">more developers</text><path d="M669.1 189.1L989.6 189.3L989.6 370.2L669.4 370.1Z" fill="#eed5cc" stroke="none"/><path d="M667.7 189.3Q829.8 191.0 991.8 189.3M669.1 189.1Q830.1 192.8 991.2 190.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 189.4Q992.1 280.4 989.4 371.3M990.1 188.9Q990.8 280.2 990.0 371.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 370.6Q830.2 369.2 668.1 369.5M992.5 369.0Q830.2 369.8 667.9 369.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.9 371.0Q670.9 279.9 671.0 188.7M670.3 370.5Q670.2 279.3 669.6 188.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="253.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Cost explodes (Fig 1.3, 1.5)</text><text x="830.0" y="275.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">code 40 times more expensive per line in release 8 than</text><text x="830.0" y="297.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">release 1; monthly payroll from a few hundred thousand</text><text x="830.0" y="319.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">dollars to $20 million</text><path d="M9.5 384.2L989.1 385.5L990.6 509.4L9.8 511.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 384.5Q500.2 381.6 992.4 385.0M7.8 385.6Q500.1 386.6 992.4 385.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 382.6Q989.9 447.6 990.3 512.5M990.0 383.5Q988.3 447.7 990.9 512.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 510.9Q500.1 507.3 8.9 509.2M991.4 509.3Q500.2 506.8 9.0 510.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 512.5Q12.9 447.8 9.3 383.2M9.8 512.3Q12.5 447.8 9.7 383.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="431.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Case study with real data from an anonymous company (Fig 1.1 to 1.5): the signature of a mess. Developers start near 100% productivity and decline each release (Fig</text><text x="500.0" y="453.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">1.4); effort goes to managing the mess, not features. Nobody works less; they move the mess from place to place to add one more small feature. The curves drain profit</text><text x="500.0" y="475.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">and can stall or collapse the business (illustrative shapes, numbers from the book).</text></svg>