<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="500" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#efe0ca" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The hare&#x27;s overconfidence</text><text x="252.5" y="94.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">&#x27;We can clean it up later; we just have to get to market first!&#x27; Cleanup never</text><text x="252.5" y="116.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">comes because market pressure never abates; mess building is the bigger lie:</text><text x="252.5" y="138.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">it is always slower than staying clean, on any time scale; modern developers</text><text x="252.5" y="160.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">work hard but a part of their brain sleeps (Aesop&#x27;s Tortoise and the Hare)</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Jason Gorman&#x27;s experiment (Fig 1.6)</text><text x="747.5" y="94.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">six days, each day a Roman numeral converter finished when predefined acceptance</text><text x="747.5" y="116.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">tests passed, each a little under 30 minutes; TDD on days 1, 3 and 5; learning</text><text x="747.5" y="138.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">curve visible; TDD days about 10% faster; even the slowest TDD day beat the fastest</text><text x="747.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">non-TDD day</text><path d="M11.1 219.0L990.3 220.4L990.5 348.8L9.4 351.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 219.4Q500.0 221.4 991.6 219.4M9.6 220.2Q500.0 220.6 990.5 220.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 219.2Q991.9 284.8 990.3 350.5M991.1 217.5Q988.6 284.0 989.8 350.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 349.6Q499.5 351.6 8.0 350.0M992.1 349.3Q500.2 348.6 8.4 349.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 351.3Q12.0 285.2 10.1 219.1M9.5 352.4Q9.6 285.1 10.0 217.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="269.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">&#x27;The only way to go fast, is to go well.&#x27; A rewrite from scratch is the hare talking again: the same overconfidence will drive the redesign into the same mess. The way</text><text x="500.0" y="291.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">out is for developers to take responsibility for the mess, recognise their overconfidence and take software architecture seriously by learning what good architecture</text><text x="500.0" y="313.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">looks like (what the rest of the book covers).</text></svg>