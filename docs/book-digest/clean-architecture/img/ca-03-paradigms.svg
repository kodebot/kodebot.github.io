<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="480" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 215.3L10.7 214.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 114.7 330.0 216.2M329.9 12.9Q331.9 114.5 330.3 216.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 214.4Q170.1 217.2 8.7 214.5M331.4 214.7Q169.6 213.2 7.8 215.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 216.0Q10.0 114.3 10.1 12.7M10.2 215.9Q8.5 115.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Structured programming</text><text x="170.0" y="99.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Edsger Dijkstra, 1968</text><text x="170.0" y="121.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">unrestrained jumps (goto) harm structure;</text><text x="170.0" y="143.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">replaced by if/then/else and do/while/until</text><text x="170.0" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">disciplines direct transfer of control</text><path d="M339.1 14.9L660.2 14.7L660.7 214.7L341.0 214.8Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 114.6 659.3 216.3M659.2 13.5Q658.8 114.5 660.4 215.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 214.5Q499.6 215.0 337.9 214.1M660.9 215.2Q499.4 216.3 337.9 215.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 217.1Q342.7 115.5 340.3 13.9M339.8 217.0Q338.2 115.2 339.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="66.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Object-oriented programming</text><text x="500.0" y="88.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">Ole Johan Dahl and Kristen Nygaard, 1966 ALGOL&#x27;s stack</text><text x="500.0" y="110.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">frame moved to a heap: function = constructor, locals =</text><text x="500.0" y="132.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">instance variables, nested functions = methods;</text><text x="500.0" y="154.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">polymorphism via disciplined function pointers;</text><text x="500.0" y="176.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">disciplines indirect transfer of control</text><path d="M671.1 14.0L990.3 15.4L990.5 213.8L669.4 216.1Z" fill="#efe0ca" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 114.8 990.3 215.5M991.1 12.5Q988.6 114.0 989.8 215.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 214.6Q829.5 216.6 668.0 215.0M992.1 214.3Q830.2 213.6 668.4 214.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 216.3Q672.0 115.2 670.1 14.1M669.5 217.4Q669.6 115.1 670.0 12.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="66.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Functional programming</text><text x="830.0" y="88.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Alonzo Church, lambda calculus, 1936;</text><text x="830.0" y="110.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">LISP by John McCarthy, 1958;</text><text x="830.0" y="132.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">immutability: symbol values do not change, so no</text><text x="830.0" y="154.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">assignment (strictly controlled if present);</text><text x="830.0" y="176.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">disciplines assignment</text><path d="M9.3 230.1L991.1 230.8L991.1 336.1L9.7 333.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 230.8Q499.6 232.0 990.6 230.5M7.6 230.4Q499.4 232.4 991.1 230.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 228.1Q991.2 282.4 990.5 336.8M990.0 229.0Q990.5 282.3 989.1 335.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 335.4Q500.6 334.3 9.3 334.1M991.7 335.0Q500.0 333.7 8.3 334.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 337.0Q11.3 282.2 10.3 227.5M11.0 336.4Q11.8 282.9 9.0 229.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="277.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Each paradigm removes a capability and none adds one: goto, function pointers (unrestricted) and assignment are taken away. All three were found within ten years (1958</text><text x="500.0" y="299.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">to 1968) and nothing negative has been added since; the paradigms tell us what not to do.</text><path d="M9.1 349.1L329.6 349.3L329.6 460.2L9.4 460.1Z" fill="#d0dfdc" stroke="none"/><path d="M7.7 349.3Q169.8 351.0 331.8 349.3M9.1 349.1Q170.1 352.8 331.2 350.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.0 349.4Q331.8 405.4 329.4 461.3M330.1 348.9Q330.7 405.2 330.0 461.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M332.4 460.6Q170.2 459.2 8.1 459.5M332.5 459.0Q170.2 459.8 7.9 459.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 461.0Q10.9 404.9 11.0 348.7M10.3 460.5Q10.2 404.3 9.6 348.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="389.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Function</text><text x="170.0" y="411.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">structured programming is the algorithmic foundation of</text><text x="170.0" y="433.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">modules</text><path d="M339.5 349.2L659.1 350.5L660.6 459.4L339.8 461.2Z" fill="#d6e1cf" stroke="none"/><path d="M338.0 349.5Q500.2 346.6 662.4 350.0M337.8 350.6Q500.1 351.6 662.4 350.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.0 347.6Q660.0 405.1 660.3 462.5M660.0 348.5Q658.5 405.2 660.9 462.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 460.9Q500.1 457.3 338.9 459.2M661.4 459.3Q500.2 456.8 339.0 460.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.9 462.5Q342.7 405.3 339.3 348.2M339.8 462.3Q342.3 405.3 339.7 348.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="400.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Separation of components</text><text x="500.0" y="422.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">polymorphism crosses architectural boundaries</text><path d="M671.0 349.5L990.5 349.4L989.4 461.1L668.8 459.1Z" fill="#efe0ca" stroke="none"/><path d="M668.7 348.9Q829.6 346.7 990.6 349.7M669.2 350.4Q830.8 349.5 992.4 350.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 348.5Q987.7 405.4 989.0 462.3M990.6 348.4Q991.0 405.1 990.7 461.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 459.2Q830.4 459.3 668.2 460.1M990.6 459.0Q830.0 461.3 669.4 459.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.8 461.2Q671.3 405.2 670.5 349.3M669.9 460.7Q668.3 404.1 668.9 347.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="389.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Data management</text><text x="830.0" y="411.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">functional programming disciplines where data lives and</text><text x="830.0" y="433.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">who can change it</text></svg>