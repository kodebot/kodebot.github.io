<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="540" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 105.3L10.7 104.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.5 59.7 990.0 106.2M989.9 12.9Q991.5 59.5 990.3 106.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 104.4Q500.1 107.2 8.7 104.5M991.4 104.7Q499.6 103.2 7.8 105.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 106.0Q10.1 59.3 10.1 12.7M10.2 105.9Q8.7 60.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="66.0" font-size="15.5" fill="#3b2f20" text-anchor="middle">SRP: a module should be responsible to one, and only one, actor (an actor is a group of people who require the same change)</text><path d="M9.1 119.9L330.2 119.7L330.7 209.7L11.0 209.8Z" fill="#eed5cc" stroke="none"/><path d="M8.4 119.3Q169.7 120.9 331.0 119.1M7.7 119.3Q169.6 121.7 331.5 119.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 117.9Q331.2 164.6 329.3 211.3M329.2 118.5Q329.0 164.5 330.4 210.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 209.5Q169.6 210.0 7.9 209.1M330.9 210.2Q169.4 211.3 7.9 210.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 212.1Q12.2 165.5 10.3 118.9M9.8 212.0Q8.5 165.2 9.0 118.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="160.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Employee</text><text x="170.0" y="182.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">calculatePay(), reportHours(), save()</text><path d="M341.1 119.0L660.3 120.4L660.5 208.8L339.4 211.1Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 119.4Q500.0 121.4 661.6 119.4M339.6 120.2Q500.0 120.6 660.5 120.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 119.2Q661.6 164.8 660.3 210.5M661.1 117.5Q659.1 164.0 659.8 210.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 209.6Q499.5 211.6 338.0 210.0M662.1 209.3Q500.2 208.6 338.4 209.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 211.3Q341.6 165.2 340.1 119.1M339.5 212.4Q339.6 165.1 340.0 117.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="160.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Accounting (CFO)</text><text x="500.0" y="182.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">specifies calculatePay()</text><path d="M669.3 120.1L991.1 120.8L991.1 211.1L669.7 208.8Z" fill="#d6e1cf" stroke="none"/><path d="M668.5 120.8Q829.6 122.0 990.6 120.5M667.6 120.4Q829.4 122.4 991.1 120.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 118.1Q991.1 164.9 990.5 211.8M990.0 119.0Q990.4 164.8 989.1 210.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 210.4Q830.6 209.3 669.3 209.1M991.7 210.0Q830.0 208.7 668.3 209.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 212.0Q671.2 164.7 670.3 117.5M671.0 211.4Q671.6 165.4 669.0 119.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="160.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">HR (COO)</text><text x="830.0" y="182.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">specifies and uses reportHours()</text><path d="M339.1 224.1L659.6 224.3L659.6 315.2L339.4 315.1Z" fill="#efe0ca" stroke="none"/><path d="M337.7 224.3Q499.8 226.0 661.8 224.3M339.1 224.1Q500.1 227.8 661.2 225.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.0 224.4Q661.5 270.4 659.4 316.3M660.1 223.9Q660.7 270.2 660.0 316.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M662.4 315.6Q500.2 314.2 338.1 314.5M662.5 314.0Q500.2 314.8 337.9 314.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.9 316.0Q340.9 269.9 341.0 223.7M340.3 315.5Q340.2 269.3 339.6 223.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="265.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">DBAs (CTO)</text><text x="500.0" y="287.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">specify save()</text><path d="M9.5 224.2L329.1 225.5L330.6 314.4L9.8 316.2Z" fill="#eed5cc" stroke="none"/><path d="M8.0 224.5Q170.2 221.6 332.4 225.0M7.8 225.6Q170.1 226.6 332.4 225.2" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.0 222.6Q330.1 270.1 330.3 317.5M330.0 223.5Q328.7 270.2 330.9 317.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 315.9Q170.1 312.3 8.9 314.2M331.4 314.3Q170.2 311.8 9.0 315.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 317.5Q12.4 270.3 9.3 223.2M9.8 317.3Q11.9 270.3 9.7 223.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="265.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Symptom 1: accidental duplication</text><text x="170.0" y="287.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">both calculatePay and reportHours use regularHours()</text><path d="M671.0 224.5L990.5 224.4L989.4 316.1L668.8 314.1Z" fill="#eed5cc" stroke="none"/><path d="M668.7 223.9Q829.6 221.7 990.6 224.7M669.2 225.4Q830.8 224.5 992.4 225.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 223.5Q987.8 270.4 989.0 317.3M990.6 223.4Q990.9 270.1 990.7 316.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 314.2Q830.4 314.3 668.2 315.1M990.6 314.0Q830.0 316.3 669.4 314.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.8 316.2Q671.1 270.2 670.5 224.3M669.9 315.7Q668.5 269.1 668.9 222.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="254.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Symptom 2: merges</text><text x="830.0" y="276.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">schema change and report format change collide in one</text><text x="830.0" y="298.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">file</text><path d="M10.7 331.1L988.9 330.6L991.1 530.6L9.4 530.8Z" fill="#f1ede5" stroke="none"/><path d="M7.8 329.2Q499.2 331.5 990.5 330.6M7.8 329.5Q499.6 331.6 991.5 329.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 329.3Q992.3 430.6 990.7 532.0M988.9 328.1Q989.4 429.8 990.1 531.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.7 530.8Q499.7 532.3 7.7 530.8M990.7 530.8Q500.0 528.8 9.3 530.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.7 531.6Q10.9 430.5 9.8 329.5M9.5 530.6Q11.2 429.4 9.0 328.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="403.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Accidental duplication: the CFO&#x27;s team tweaks how non-overtime hours are calculated; a developer changes the shared regularHours() without noticing reportHours() also</text><text x="500.0" y="425.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">uses it; accounting validates, deployed; HR&#x27;s reports now hold wrong numbers and the COO is livid because bad data cost his budget millions. Merges: two developers from</text><text x="500.0" y="447.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">different teams change the same Employee class and collide, risking the CTO, COO and possibly the CFO. Cause: code that different actors depend on sits in close</text><text x="500.0" y="469.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">proximity. Cure: separate the code that different actors depend on. (Do not confuse SRP with &#x27;a function should do one thing&#x27;: that is a different, lower-level rule.)</text></svg>