" font-size="17.0" fill="#3b2f20" text-anchor="middle">PayCalculator</text><path d="M251.1 99.0L450.3 100.4L450.5 168.8L249.4 171.1Z" fill="#d0dfdc" stroke="none"/><path d="M248.4 99.4Q350.0 101.4 451.6 99.4M249.6 100.2Q350.0 100.6 450.5 100.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M450.9 99.2Q451.5 134.8 450.3 170.5M451.1 97.5Q449.3 134.0 449.8 170.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M451.1 169.6Q349.5 171.6 248.0 170.0M452.1 169.3Q350.2 168.6 248.4 169.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M250.6 171.3Q251.4 135.2 250.1 99.1M249.5 172.4Q249.7 135.1 250.0 97.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="350.0" y="141.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">HourReporter</text><path d="M479.3 100.1L681.1 100.8L681.1 171.1L479.7 168.8Z" fill="#d0dfdc" stroke="none"/><path d="M478.5 100.8Q579.6 102.0 680.6 100.5M477.6 100.4Q579.4 102.4 681.1 100.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M679.9 98.1Q680.9 134.9 680.5 171.8M680.0 99.0Q680.3 134.8 679.1 170.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M682.0 170.4Q580.6 169.3 479.3 169.1M681.7 170.0Q580.0 168.7 478.3 169.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M479.9 172.0Q481.0 134.7 480.3 97.5M481.0 171.4Q481.4 135.4 479.0 99.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="580.0" y="141.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">EmployeeSaver</text><path d="M739.1 99.1L979.6 99.3L979.6 170.2L739.4 170.1Z" fill="#efe0ca" stroke="none"/><path d="M737.7 99.3Q859.8 101.0 981.8 99.3M739.1 99.1Q860.1 102.8 981.2 100.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.0 99.4Q981.3 135.4 979.4 171.3M980.1 98.9Q980.6 135.2 980.0 171.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.4 170.6Q860.2 169.2 738.1 169.5M982.5 169.0Q860.2 169.8 737.9 169.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M740.9 171.0Q740.9 134.9 741.0 98.7M740.3 170.5Q740.1 134.3 739.6 98.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="860.0" y="130.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">EmployeeData</text><text x="860.0" y="152.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(no methods)</text><path d="M219.5 134.3Q479.4 136.4 739.2 135.4M219.4 134.9Q480.2 133.3 741.1 134.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M740.4 135.0Q734.7 131.8 728.8 129.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M740.4 135.1Q735.2 138.5 729.6 141.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.4 186.1L495.3 185.0L495.0 336.0L10.6 335.8Z" fill="#d3dbe0" stroke="none"/><path d="M8.3 185.9Q252.6 187.8 496.9 184.2M8.4 184.3Q252.7 187.8 497.0 185.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 184.5Q492.2 260.3 494.3 336.2M494.8 184.3Q491.9 260.3 494.7 336.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.4 334.5Q253.2 336.2 9.0 334.5M497.5 333.9Q252.6 337.7 7.6 335.2" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.1 336.2Q10.3 260.2 9.1 184.2M10.9 337.3Q10.2 260.0 9.6 182.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="244.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Facade (Fig 7.4)</text><text x="252.5" y="266.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">three classes to instantiate and track: an EmployeeFacade with very little code</text><text x="252.5" y="288.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">instantiates and delegates to them; the classes do not know each other</text><path d="M503.9 185.9L990.6 185.6L989.9 335.7L505.4 334.9Z" fill="#efe0ca" stroke="none"/><path d="M504.5 184.2Q747.9 184.9 991.2 185.1M502.6 184.0Q747.5 182.4 992.4 184.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.8 183.2Q988.9 260.2 990.5 337.3M989.9 182.7Q990.7 259.1 988.9 335.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.1 336.0Q747.3 332.7 502.5 335.6M992.1 334.4Q748.2 336.7 504.2 334.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.0 337.1Q503.2 260.0 505.5 182.8M505.0 335.9Q507.6 259.6 505.8 183.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="244.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Keep the main rule near the data (Fig 7.5)</text><text x="747.5" y="266.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">leave the most important method in Employee, and have it act as the Facade for the</text><text x="747.5" y="288.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">lesser functions</text><path d="M10.8 350.6L989.3 348.8L989.6 490.1L10.0 490.1Z" fill="#f1ede5" stroke="none"/><path d="M8.7 350.8Q499.7 349.4 990.7 350.8M7.7 350.8Q500.0 352.1 992.3 350.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.7 348.6Q989.6 420.5 989.8 492.5M989.5 347.6Q987.2 419.4 989.0 491.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.6 489.0Q499.6 486.9 8.5 489.5M991.4 489.9Q499.5 493.1 7.7 490.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.3 492.2Q13.0 420.5 10.1 348.7M9.6 492.0Q7.1 420.2 10.8 348.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="404.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Each class is a scope with many private methods, not a single function: calculating pay, reporting and saving each need many functions; outside that scope no one knows</text><text x="500.0" y="426.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">the private members exist. SRP returns at the component level as the Common Closure Principle and at the architectural level as the Axis of Change that creates</text><text x="500.0" y="448.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">architectural boundaries.</text></svg>