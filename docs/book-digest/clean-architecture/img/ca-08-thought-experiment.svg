<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="500" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 105.3L10.7 104.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.5 59.7 990.0 106.2M989.9 12.9Q991.5 59.5 990.3 106.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 104.4Q500.1 107.2 8.7 104.5M991.4 104.7Q499.6 103.2 7.8 105.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 106.0Q10.1 59.3 10.1 12.7M10.2 105.9Q8.7 60.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="66.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">OCP (Bertrand Meyer, 1988): a software artifact should be open for extension but closed for modification: extend behaviour without changing the artifact</text><path d="M9.1 119.9L495.2 119.7L495.7 309.7L11.0 309.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 119.3Q252.2 120.9 496.0 119.1M7.7 119.3Q252.1 121.7 496.5 119.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 117.9Q496.6 214.6 494.3 311.3M494.2 118.5Q493.8 214.5 495.4 310.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 309.5Q252.1 310.0 7.9 309.1M495.9 310.2Q251.9 311.3 7.9 310.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 312.1Q12.7 215.5 10.3 118.9M9.8 312.0Q8.2 215.2 9.0 118.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="188.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Thought experiment</text><text x="252.5" y="210.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">a web page shows a scrollable financial summary, negatives in red; now stakeholders</text><text x="252.5" y="232.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">want a paginated black-and-white printed report with headers, footers, column</text><text x="252.5" y="254.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">labels and negatives in parentheses: how much old code must change? Ideally zero</text><path d="M506.1 119.0L990.3 120.4L990.5 308.8L504.4 311.1Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 119.4Q747.5 121.4 991.6 119.4M504.6 120.2Q747.5 120.6 990.5 120.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 119.2Q991.9 214.8 990.3 310.5M991.1 117.5Q988.6 214.0 989.8 310.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 309.6Q747.0 311.6 503.0 310.0M992.1 309.3Q747.7 308.6 503.4 309.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 311.3Q507.0 215.2 505.1 119.1M504.5 312.4Q504.6 215.1 505.0 117.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="177.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">How: SRP then DIP (Fig 8.1)</text><text x="747.5" y="199.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">separate what changes for different reasons: calculating the reportable data versus</text><text x="747.5" y="221.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">presenting it in web and printer forms; an analysis procedure produces reportable</text><text x="747.5" y="243.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">data and two reporter processes format it; then arrange source dependencies so</text><text x="747.5" y="265.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one responsibility&#x27;s change does not touch the other</text><path d="M9.3 325.1L991.1 325.8L991.1 486.1L9.7 483.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 325.8Q499.6 327.0 990.6 325.5M7.6 325.4Q499.4 327.4 991.1 325.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 323.1Q991.3 404.9 990.5 486.8M990.0 324.0Q990.6 404.8 989.1 485.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 485.4Q500.6 484.3 9.3 484.1M991.7 485.0Q500.0 483.7 8.3 484.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 487.0Q11.5 404.7 10.3 322.5M11.0 486.4Q12.1 405.4 9.0 324.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="378.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Fig 8.2: partition the processes into classes and the classes into components (Controller, Interactor, Database, and four Presenter and View components). &lt;I&gt; marks</text><text x="500.0" y="400.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">interfaces and &lt;DS&gt; data structures; open arrowheads are &#x27;uses&#x27;, closed arrowheads are implements or inheritance. Every arrow is a source code dependency (A mentions B,</text><text x="500.0" y="422.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">B mentions nothing of A): FinancialDataMapper knows FinancialDataGateway by implementing it, not the reverse. Each double line (component boundary) is crossed in one</text><text x="500.0" y="444.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">direction only, so component relationships are unidirectional (Fig 8.3).</text></svg>