<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 105.3L10.7 104.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.5 59.7 990.0 106.2M989.9 12.9Q991.5 59.5 990.3 106.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 104.4Q500.1 107.2 8.7 104.5M991.4 104.7Q499.6 103.2 7.8 105.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 106.0Q10.1 59.3 10.1 12.7M10.2 105.9Q8.7 60.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="55.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">DIP: the most flexible systems have source code dependencies that refer only to abstractions, not concretions (interfaces and abstract classes, not the modules that</text><text x="500.0" y="77.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">implement the called functions)</text><path d="M9.1 119.9L495.2 119.7L495.7 279.7L11.0 279.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 119.3Q252.2 120.9 496.0 119.1M7.7 119.3Q252.1 121.7 496.5 119.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 117.9Q496.6 199.6 494.3 281.3M494.2 118.5Q493.8 199.5 495.4 280.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 279.5Q252.1 280.0 7.9 279.1M495.9 280.2Q251.9 281.3 7.9 280.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 282.1Q12.7 200.5 10.3 118.9M9.8 282.0Q8.2 200.2 9.0 118.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="162.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Not an absolute rule</text><text x="252.5" y="184.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">systems must depend on concrete facilities: Java&#x27;s String is concrete and stable,</text><text x="252.5" y="206.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">rarely and tightly controlled in change; ignore the stable background of OS and</text><text x="252.5" y="228.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">platform; avoid depending on volatile concrete modules, the ones under active</text><text x="252.5" y="250.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">development</text><path d="M506.1 119.0L990.3 120.4L990.5 278.8L504.4 281.1Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 119.4Q747.5 121.4 991.6 119.4M504.6 120.2Q747.5 120.6 990.5 120.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 119.2Q991.9 199.8 990.3 280.5M991.1 117.5Q988.6 199.0 989.8 280.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 279.6Q747.0 281.6 503.0 280.0M992.1 279.3Q747.7 278.6 503.4 279.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 281.3Q507.0 200.2 505.1 119.1M504.5 282.4Q504.6 200.1 505.0 117.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="173.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Stable abstractions</text><text x="747.5" y="195.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">every interface change forces changes in its implementations, but implementation</text><text x="747.5" y="217.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">changes rarely change the interface, so interfaces are less volatile: good</text><text x="747.5" y="239.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">designers add functionality without changing interfaces (Software Design 101)</text><path d="M9.3 295.1L496.1 295.8L496.1 551.1L9.7 548.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 295.8Q252.1 297.0 495.6 295.5M7.6 295.4Q251.9 297.4 496.1 295.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 293.1Q496.3 422.4 495.5 551.8M495.0 294.0Q495.6 422.3 494.1 550.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 550.4Q253.1 549.3 9.3 549.1M496.7 550.0Q252.5 548.7 8.3 549.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 552.0Q11.5 422.2 10.3 292.5M11.0 551.4Q12.1 422.9 9.0 294.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="362.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Four practices</text><text x="252.5" y="384.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">1. do not refer to volatile concrete classes; use abstract interfaces (this</text><text x="252.5" y="406.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">constrains object creation and generally enforces Abstract Factories) 2. do not</text><text x="252.5" y="428.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">derive from volatile concrete classes: inheritance is the strongest, most rigid</text><text x="252.5" y="450.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">source relationship 3. do not override concrete functions: you inherit their</text><text x="252.5" y="472.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">dependencies; make the function abstract with several implementations 4. never</text><text x="252.5" y="494.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">mention the name of anything concrete and volatile</text><path d="M504.1 294.1L989.6 294.3L989.6 550.2L504.4 550.1Z" fill="#d3dbe0" stroke="none"/><path d="M502.7 294.3Q747.3 296.0 991.8 294.3M504.1 294.1Q747.6 297.8 991.2 295.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 294.4Q992.1 422.9 989.4 551.3M990.1 293.9Q990.8 422.7 990.0 551.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 550.6Q747.7 549.2 503.1 549.5M992.5 549.0Q747.7 549.8 502.9 549.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 551.0Q505.9 422.4 506.0 293.7M505.3 550.5Q505.2 421.8 504.6 293.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="373.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Concrete components</text><text x="747.5" y="395.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">the concrete side still has dependencies (the factory implementation names</text><text x="747.5" y="417.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">ConcreteImpl): DIP violations cannot be removed, only gathered into a few concrete</text><text x="747.5" y="439.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">components kept apart from the rest; most systems have at least one, often main: it</text><text x="747.5" y="461.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">instantiates ServiceFactoryImpl and stores it in a global variable of type</text><text x="747.5" y="483.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">ServiceFactory for the Application to use</text></svg>