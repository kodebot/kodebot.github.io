<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 115.3L10.7 114.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.4 64.7 990.0 116.2M989.9 12.9Q991.6 64.5 990.3 116.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 114.4Q500.1 117.2 8.7 114.5M991.4 114.7Q499.6 113.2 7.8 115.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 116.0Q10.1 64.3 10.1 12.7M10.2 115.9Q8.7 65.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="60.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Architecture is the shape given to a system by those who build it: the division into components, their arrangement and how they communicate. Its purpose: facilitate</text><text x="500.0" y="82.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">development, deployment, operation and maintenance. Its strategy: leave as many options open as possible, for as long as possible.</text><path d="M9.1 129.9L495.2 129.7L495.7 329.7L11.0 329.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 129.3Q252.2 130.9 496.0 129.1M7.7 129.3Q252.1 131.7 496.5 129.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 127.9Q496.6 229.6 494.3 331.3M494.2 128.5Q493.8 229.5 495.4 330.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 329.5Q252.1 330.0 7.9 329.1M495.9 330.2Q251.9 331.3 7.9 330.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 332.1Q12.7 230.5 10.3 128.9M9.8 332.0Q8.2 230.2 9.0 128.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="181.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Development</text><text x="252.5" y="203.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a small team of five can build a monolith with no well-defined components, and</text><text x="252.5" y="225.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">structure feels like an impediment early (why many systems start with no</text><text x="252.5" y="247.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">architecture); five teams of seven cannot make progress without well-defined</text><text x="252.5" y="269.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">components and stable interfaces, and the architecture drifts to one component per</text><text x="252.5" y="291.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">team, not best for deployment, operation or maintenance</text><path d="M506.1 129.0L990.3 130.4L990.5 328.8L504.4 331.1Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 129.4Q747.5 131.4 991.6 129.4M504.6 130.2Q747.5 130.6 990.5 130.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 129.2Q991.9 229.8 990.3 330.5M991.1 127.5Q988.6 229.0 989.8 330.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 329.6Q747.0 331.6 503.0 330.0M992.1 329.3Q747.7 328.6 503.4 329.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 331.3Q507.0 230.2 505.1 129.1M504.5 332.4Q504.6 230.1 505.0 127.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="181.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Deployment</text><text x="747.5" y="203.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">the higher the deployment cost the less useful the system; aim for deployment with</text><text x="747.5" y="225.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a single action; strategy is seldom considered early: a micro-service architecture</text><text x="747.5" y="247.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">may ease development but leave a daunting number of services and error-prone</text><text x="747.5" y="269.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">connections and start-up timing; consider fewer services or a hybrid with in-</text><text x="747.5" y="291.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">process components</text><path d="M9.3 345.1L496.1 345.8L496.1 546.1L9.7 543.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 345.8Q252.1 347.0 495.6 345.5M7.6 345.4Q251.9 347.4 496.1 345.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 343.1Q496.3 444.9 495.5 546.8M495.0 344.0Q495.6 444.8 494.1 545.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 545.4Q253.1 544.3 9.3 544.1M496.7 545.0Q252.5 543.7 8.3 544.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 547.0Q11.5 444.7 10.3 342.5M11.0 546.4Q12.1 445.4 9.0 344.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="407.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Operation</text><text x="252.5" y="429.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">least dramatic: operational difficulty can usually be fixed by adding hardware</text><text x="252.5" y="451.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">(hardware is cheap, people are expensive); but a good architecture reveals</text><text x="252.5" y="473.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">operation: use cases, features and required behaviours become first-class, visible</text><text x="252.5" y="495.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">landmarks for developers</text><path d="M504.1 344.1L989.6 344.3L989.6 545.2L504.4 545.1Z" fill="#eed5cc" stroke="none"/><path d="M502.7 344.3Q747.3 346.0 991.8 344.3M504.1 344.1Q747.6 347.8 991.2 345.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 344.4Q992.1 445.4 989.4 546.3M990.1 343.9Q990.8 445.2 990.0 546.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 545.6Q747.7 544.2 503.1 544.5M992.5 544.0Q747.7 544.8 502.9 544.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 546.0Q505.9 444.9 506.0 343.7M505.3 545.5Q505.2 444.3 504.6 343.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="407.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Maintenance</text><text x="747.5" y="429.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">the most costly aspect: spelunking (digging through existing software to find where</text><text x="747.5" y="451.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">and how to add a feature or fix a defect) and risk of inadvertent breakage;</text><text x="747.5" y="473.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">components isolated by stable interfaces light the pathways for future features and</text><text x="747.5" y="495.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">cut the risk</text></svg>