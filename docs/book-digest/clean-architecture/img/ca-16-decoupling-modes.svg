<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 215.3L10.7 214.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 114.7 330.0 216.2M329.9 12.9Q331.9 114.5 330.3 216.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 214.4Q170.1 217.2 8.7 214.5M331.4 214.7Q169.6 213.2 7.8 215.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 216.0Q10.0 114.3 10.1 12.7M10.2 215.9Q8.5 115.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="88.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Source level</text><text x="170.0" y="110.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">control source module dependencies (for example Ruby</text><text x="170.0" y="132.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Gems); components share one address space, call each</text><text x="170.0" y="154.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">other by functions, single executable: a monolith</text><path d="M339.1 14.9L660.2 14.7L660.7 214.7L341.0 214.8Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 114.6 659.3 216.3M659.2 13.5Q658.8 114.5 660.4 215.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 214.5Q499.6 215.0 337.9 214.1M660.9 215.2Q499.4 216.3 337.9 215.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 217.1Q342.7 115.5 340.3 13.9M339.8 217.0Q338.2 115.2 339.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="88.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Deployment level</text><text x="500.0" y="110.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">independently deployable units (jar, Gem, DLL); some in</text><text x="500.0" y="132.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">the same address space, others in other processes</text><text x="500.0" y="154.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">(interprocess communication, sockets, shared memory)</text><path d="M671.1 14.0L990.3 15.4L990.5 213.8L669.4 216.1Z" fill="#efe0ca" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 114.8 990.3 215.5M991.1 12.5Q988.6 114.0 989.8 215.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 214.6Q829.5 216.6 668.0 215.0M992.1 214.3Q830.2 213.6 668.4 214.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 216.3Q672.0 115.2 670.1 14.1M669.5 217.4Q669.6 115.1 670.0 12.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Service level</text><text x="830.0" y="99.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">dependencies reduced to data structures; communication</text><text x="830.0" y="121.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">solely by network packets; each execution unit</text><text x="830.0" y="143.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">independent of source and binary changes (services,</text><text x="830.0" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">micro-services)</text><path d="M9.3 230.1L496.1 230.8L496.1 381.1L9.7 378.8Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 230.8Q252.1 232.0 495.6 230.5M7.6 230.4Q251.9 232.4 496.1 230.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 228.1Q496.3 304.9 495.5 381.8M495.0 229.0Q495.6 304.8 494.1 380.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 380.4Q253.1 379.3 9.3 379.1M496.7 380.0Q252.5 378.7 8.3 379.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 382.0Q11.5 304.7 10.3 227.5M11.0 381.4Q12.1 305.4 9.0 229.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="256.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Choosing a mode</text><text x="252.5" y="278.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">hard to know early and it changes as the project matures; decoupling at service</text><text x="252.5" y="300.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">level by default is expensive in development time and resources and encourages</text><text x="252.5" y="322.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">coarse-grained splits (however micro the services); the author&#x27;s preference: push</text><text x="252.5" y="344.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">decoupling to the point where a service could be formed but keep components in one</text><text x="252.5" y="366.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">address space as long as possible</text><path d="M504.1 229.1L989.6 229.3L989.6 380.2L504.4 380.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 229.3Q747.3 231.0 991.8 229.3M504.1 229.1Q747.6 232.8 991.2 230.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 229.4Q992.1 305.4 989.4 381.3M990.1 228.9Q990.8 305.2 990.0 381.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 380.6Q747.7 379.2 503.1 379.5M992.5 379.0Q747.7 379.8 502.9 379.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 381.0Q505.9 304.9 506.0 228.7M505.3 380.5Q505.2 304.3 504.6 228.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="278.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Moving along the spectrum</text><text x="747.5" y="300.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">born a monolith, grow into deployable units, then services; later slide back as</text><text x="747.5" y="322.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">operational needs decline; a good architecture protects most of the source from</text><text x="747.5" y="344.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">those changes; not a trivial configuration option, but a foreseen change</text><path d="M9.5 394.2L989.1 395.5L990.6 549.4L9.8 551.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 394.5Q500.2 391.6 992.4 395.0M7.8 395.6Q500.1 396.6 992.4 395.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 392.6Q989.9 472.6 990.3 552.5M990.0 393.5Q988.2 472.7 990.9 552.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 550.9Q500.1 547.3 8.9 549.2M991.4 549.3Q500.2 546.8 9.0 550.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 552.5Q13.0 472.8 9.3 393.2M9.8 552.3Q12.6 472.8 9.7 393.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="434.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Duplication trap: true duplication (every change to one needs the same change to the other) should be removed; accidental duplication (similar screens, algorithms,</text><text x="500.0" y="456.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">queries or a database record shaped like a view) evolves along different paths at different rates and for different reasons, so resist knee-jerk elimination and make</text><text x="500.0" y="478.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">sure it is real; passing a database record up to the UI instead of a separate view model is almost certainly accidental duplication. Operation: leave open whether the</text><text x="500.0" y="500.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">system runs as services, lightweight threads in one process, a few isolated processes or a monolith (a monolith that depends on being one is hard to upgrade);</text><text x="500.0" y="522.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">throughput needs (100,000 customers a second, big data cubes in milliseconds) shape it.</text></svg>