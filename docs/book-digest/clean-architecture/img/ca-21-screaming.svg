<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 175.3L10.7 174.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 94.7 495.0 176.2M494.9 12.9Q496.9 94.5 495.3 176.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 174.4Q252.6 177.2 8.7 174.5M496.4 174.7Q252.1 173.2 7.8 175.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 176.0Q10.0 94.3 10.1 12.7M10.2 175.9Q8.5 95.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="68.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Blueprints scream their purpose</text><text x="252.5" y="90.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a single-family home&#x27;s plans scream &#x27;HOME&#x27; (entrance, foyer, living room, dining</text><text x="252.5" y="112.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">room, kitchen, family room); a library&#x27;s plans scream &#x27;LIBRARY&#x27; (grand entrance,</text><text x="252.5" y="134.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">check-in and check-out clerks, reading areas, galleries for bookshelves)</text><path d="M504.1 14.9L990.2 14.7L990.7 174.7L506.0 174.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 94.6 989.3 176.3M989.2 13.5Q988.8 94.5 990.4 175.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 174.5Q747.1 175.0 502.9 174.1M990.9 175.2Q746.9 176.3 502.9 175.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 177.1Q507.7 95.5 505.3 13.9M504.8 177.0Q503.2 95.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="68.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">What does your application scream?</text><text x="747.5" y="90.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">its top-level directory structure and highest-level package should scream &#x27;Health</text><text x="747.5" y="112.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Care System&#x27;, &#x27;Accounting System&#x27; or &#x27;Inventory Management System&#x27;, not &#x27;Rails&#x27;,</text><text x="747.5" y="134.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">&#x27;Spring/Hibernate&#x27; or &#x27;ASP&#x27;</text><path d="M11.1 189.0L495.3 190.4L495.5 348.8L9.4 351.1Z" fill="#d3dbe0" stroke="none"/><path d="M8.4 189.4Q252.5 191.4 496.6 189.4M9.6 190.2Q252.5 190.6 495.5 190.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 189.2Q496.9 269.8 495.3 350.5M496.1 187.5Q493.6 269.0 494.8 350.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 349.6Q252.0 351.6 8.0 350.0M497.1 349.3Q252.7 348.6 8.4 349.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 351.3Q12.0 270.2 10.1 189.1M9.5 352.4Q9.6 270.1 10.0 187.8" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="232.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Use case driven (Ivar Jacobson)</text><text x="252.5" y="254.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Object Oriented Software Engineering is subtitled &#x27;A Use Case Driven Approach&#x27;:</text><text x="252.5" y="276.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">architectures are structures that support the use cases; frameworks are tools to</text><text x="252.5" y="298.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">use, not architectures to conform to; a framework-based architecture cannot be use-</text><text x="252.5" y="320.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">case based</text><path d="M504.3 190.1L991.1 190.8L991.1 351.1L504.7 348.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.5 190.8Q747.1 192.0 990.6 190.5M502.6 190.4Q746.9 192.4 991.1 190.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 188.1Q991.3 269.9 990.5 351.8M990.0 189.0Q990.6 269.8 989.1 350.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 350.4Q748.1 349.3 504.3 349.1M991.7 350.0Q747.5 348.7 503.3 349.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 352.0Q506.5 269.7 505.3 187.5M506.0 351.4Q507.1 270.4 504.0 189.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="232.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Purpose: defer and delay</text><text x="747.5" y="254.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">centre on use cases so the structure can be described without committing to</text><text x="747.5" y="276.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">frameworks, tools or environments, as a house plan ensures the house is usable</text><text x="747.5" y="298.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">before the exterior (brick, stone, cedar) is chosen; frameworks are options to</text><text x="747.5" y="320.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">leave open (Rails, Spring, Hibernate, Tomcat, MySQL)</text><path d="M9.1 364.1L494.6 364.3L494.6 515.2L9.4 515.1Z" fill="#efe0ca" stroke="none"/><path d="M7.7 364.3Q252.3 366.0 496.8 364.3M9.1 364.1Q252.6 367.8 496.2 365.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.0 364.4Q497.1 440.4 494.4 516.3M495.1 363.9Q495.8 440.2 495.0 516.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.4 515.6Q252.7 514.2 8.1 514.5M497.5 514.0Q252.7 514.8 7.9 514.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 516.0Q10.9 439.9 11.0 363.7M10.3 515.5Q10.2 439.3 9.6 363.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="413.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The web is a delivery mechanism</text><text x="252.5" y="435.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">an IO device: a detail that should not dominate the structure; be as ignorant as</text><text x="252.5" y="457.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">possible of delivery so the same system can be a console app, web app, thick client</text><text x="252.5" y="479.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or web service without undue change</text><path d="M504.5 364.2L989.1 365.5L990.6 514.4L504.8 516.2Z" fill="#d6e1cf" stroke="none"/><path d="M503.0 364.5Q747.7 361.6 992.4 365.0M502.8 365.6Q747.6 366.6 992.4 365.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 362.6Q989.9 440.1 990.3 517.5M990.0 363.5Q988.2 440.2 990.9 517.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 515.9Q747.6 512.3 503.9 514.2M991.4 514.3Q747.7 511.8 504.0 515.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 517.5Q508.0 440.3 504.3 363.2M504.8 517.3Q507.6 440.3 504.7 363.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="413.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Frameworks, and testability</text><text x="747.5" y="435.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">look at each framework skeptically (it may help, but at what cost?) and keep it</text><text x="747.5" y="457.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">from taking over; with use cases central and frameworks at arm&#x27;s length, unit-test</text><text x="747.5" y="479.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">all use cases with no web server or database; Entities are plain old objects</text></svg>