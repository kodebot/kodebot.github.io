<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="600" fill="#fbf7ef"/><path d="M11.1 15.0L610.3 15.4L608.9 585.3L10.7 584.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q310.1 15.0 611.8 14.6M9.5 15.4Q310.5 14.6 611.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M610.8 13.3Q609.2 299.7 610.0 586.2M609.9 12.9Q611.9 299.5 610.3 586.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M611.5 584.4Q310.1 587.2 8.7 584.5M611.4 584.7Q309.6 583.2 7.8 585.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 586.0Q10.0 299.3 10.1 12.7M10.2 585.9Q8.5 300.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="41" font-size="12.0" fill="#3b2f20">Frameworks and drivers: web, database, devices, UI (mechanisms; glue code only; all the details)</text><path d="M39.1 69.9L580.2 69.7L580.7 559.7L41.0 559.8Z" fill="#efe0ca" stroke="none"/><path d="M38.4 69.3Q309.7 70.9 581.0 69.1M37.7 69.3Q309.6 71.7 581.5 69.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M579.9 67.9Q581.6 314.6 579.3 561.3M579.2 68.5Q578.8 314.5 580.4 560.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M581.3 559.5Q309.6 560.0 37.9 559.1M580.9 560.2Q309.4 561.3 37.9 560.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.2 562.1Q42.7 315.5 40.3 68.9M39.8 562.0Q38.2 315.2 39.0 68.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="96" font-size="11.5" fill="#3b2f20">Interface adapters: controllers, presenters, gateways, views; MVC lives here; SQL only here</text><path d="M71.1 124.0L550.3 125.4L550.5 523.8L69.4 526.1Z" fill="#d0dfdc" stroke="none"/><path d="M68.4 124.4Q310.0 126.4 551.6 124.4M69.6 125.2Q310.0 125.6 550.5 125.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M550.9 124.2Q551.9 324.8 550.3 525.5M551.1 122.5Q548.6 324.0 549.8 525.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M551.1 524.6Q309.5 526.6 68.0 525.0M552.1 524.3Q310.2 523.6 68.4 524.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M70.6 526.3Q72.0 325.2 70.1 124.1M69.5 527.4Q69.6 325.1 70.0 122.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="151" font-size="18.0" fill="#3b2f20">Use cases: application-specific business rules</text><path d="M99.3 180.1L521.1 180.8L521.1 491.1L99.7 488.8Z" fill="#d6e1cf" stroke="none"/><path d="M98.5 180.8Q309.6 182.0 520.6 180.5M97.6 180.4Q309.4 182.4 521.1 180.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M519.9 178.1Q521.3 334.9 520.5 491.8M520.0 179.0Q520.6 334.8 519.1 490.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M522.0 490.4Q310.6 489.3 99.3 489.1M521.7 490.0Q310.0 488.7 98.3 489.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M99.9 492.0Q101.5 334.7 100.3 177.5M101.0 491.4Q102.1 335.4 99.0 179.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="206" font-size="17.0" fill="#3b2f20">Entities: enterprise-wide critical business rules</text><path d="M149.1 249.1L469.6 249.3L469.6 340.2L149.4 340.1Z" fill="#d3dbe0" stroke="none"/><path d="M147.7 249.3Q309.8 251.0 471.8 249.3M149.1 249.1Q310.1 252.8 471.2 250.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M470.0 249.4Q471.5 295.4 469.4 341.3M470.1 248.9Q470.7 295.2 470.0 341.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M472.4 340.6Q310.2 339.2 148.1 339.5M472.5 339.0Q310.2 339.8 147.9 339.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M150.9 341.0Q150.9 294.9 151.0 248.7M150.3 340.5Q150.2 294.3 149.6 248.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="310.0" y="290.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The Dependency Rule</text><text x="310.0" y="312.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">source code dependencies point only inward</text><path d="M149.5 359.2L469.1 360.5L470.6 449.4L149.8 451.2Z" fill="#f1ede5" stroke="none"/><path d="M148.0 359.5Q310.2 356.6 472.4 360.0M147.8 360.6Q310.1 361.6 472.4 360.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.0 357.6Q470.1 405.1 470.3 452.5M470.0 358.5Q468.7 405.2 470.9 452.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.3 450.9Q310.1 447.3 148.9 449.2M471.4 449.3Q310.2 446.8 149.0 450.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M150.9 452.5Q152.4 405.3 149.3 358.2M149.8 452.3Q151.9 405.3 149.7 358.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="310.0" y="400.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Outer: low-level concrete mechanisms; inner: abstract,</text><text x="310.0" y="422.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">higher-level policy</text><path d="M631.0 14.5L990.5 14.4L989.4 186.1L628.8 184.1Z" fill="#f1ede5" stroke="none"/><path d="M628.7 13.9Q809.6 11.7 990.6 14.7M629.2 15.4Q810.8 14.5 992.4 15.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 13.5Q987.5 100.4 989.0 187.3M990.6 13.4Q991.0 100.1 990.7 186.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 184.2Q810.4 184.3 628.2 185.1M990.6 184.0Q810.0 186.3 629.4 184.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M629.8 186.2Q631.4 100.2 630.5 14.3M629.9 185.7Q628.2 99.1 628.9 12.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="810.0" y="62.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">Common goals Hexagonal (Ports and Adapters, Alistair Cockburn;</text><text x="810.0" y="84.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Steve Freeman and Nat Pryce), DCI (James Coplien and Trygve</text><text x="810.0" y="106.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Reenskaug), BCE (Ivar Jacobson): separation of concerns by</text><text x="810.0" y="128.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">layers with at least one for business rules and one for</text><text x="810.0" y="150.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">interfaces</text><path d="M630.7 201.1L988.9 200.6L991.1 585.6L629.4 585.8Z" fill="#d6e1cf" stroke="none"/><path d="M627.8 199.2Q809.2 201.5 990.5 200.6M627.8 199.5Q809.6 201.6 991.5 199.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 199.3Q992.3 393.1 990.7 587.0M988.9 198.1Q989.4 392.3 990.1 586.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.7 585.8Q809.7 587.3 627.7 585.8M990.7 585.8Q810.0 583.8 629.3 585.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M630.7 586.6Q630.9 393.0 629.8 199.5M629.5 585.6Q631.2 391.9 629.0 198.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="810.0" y="321.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Properties of these architectures</text><text x="810.0" y="343.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">independent of frameworks (tools, not constraints) testable</text><text x="810.0" y="365.5" font-size="10.5" fill="#3b2f20" text-anchor="middle">without UI, database or web server independent of the UI (web</text><text x="810.0" y="387.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">to console without touching the rules) independent of the</text><text x="810.0" y="409.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">database (Oracle, SQL Server, Mongo, BigTable, CouchDB)</text><text x="810.0" y="431.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">independent of any external agency (the rules know nothing of</text><text x="810.0" y="453.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">the outside) Four circles are schematic; add more if needed,</text><text x="810.0" y="475.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">but the Dependency Rule always holds</text></svg>