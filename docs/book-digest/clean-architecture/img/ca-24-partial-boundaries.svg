<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 105.3L10.7 104.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.5 59.7 990.0 106.2M989.9 12.9Q991.5 59.5 990.3 106.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 104.4Q500.1 107.2 8.7 104.5M991.4 104.7Q499.6 103.2 7.8 105.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 106.0Q10.1 59.3 10.1 12.7M10.2 105.9Q8.7 60.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="55.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Full boundaries are expensive: reciprocal polymorphic boundary interfaces, input and output data structures and the dependency management to make both sides</text><text x="500.0" y="77.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">independently compilable and deployable. A partial boundary holds the place in case you might need it (against YAGNI)</text><path d="M9.1 119.9L495.2 119.7L495.7 269.7L11.0 269.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 119.3Q252.2 120.9 496.0 119.1M7.7 119.3Q252.1 121.7 496.5 119.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 117.9Q496.6 194.6 494.3 271.3M494.2 118.5Q493.8 194.5 495.4 270.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 269.5Q252.1 270.0 7.9 269.1M495.9 270.2Q251.9 271.3 7.9 270.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 272.1Q12.7 195.5 10.3 118.9M9.8 272.0Q8.2 195.2 9.0 118.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="146.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1. Skip the last step</text><text x="252.5" y="168.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">do all the work for independent components then keep them in one component: same</text><text x="252.5" y="190.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">code and design effort, but no multi-component administration (versions, release</text><text x="252.5" y="212.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">management); FitNesse&#x27;s web server was separable but shipped with the wiki</text><text x="252.5" y="234.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">(&#x27;download and go&#x27;); the separation weakened and dependencies crossed the line</text><text x="252.5" y="256.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">wrongly</text><path d="M506.1 119.0L990.3 120.4L990.5 268.8L504.4 271.1Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 119.4Q747.5 121.4 991.6 119.4M504.6 120.2Q747.5 120.6 990.5 120.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 119.2Q991.9 194.8 990.3 270.5M991.1 117.5Q988.6 194.0 989.8 270.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 269.6Q747.0 271.6 503.0 270.0M992.1 269.3Q747.7 268.6 503.4 269.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 271.3Q507.0 195.2 505.1 119.1M504.5 272.4Q504.6 195.1 505.0 117.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="168.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2. One-dimensional boundary (Fig 24.1)</text><text x="747.5" y="190.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">the Strategy pattern: a ServiceBoundary interface used by clients and implemented</text><text x="747.5" y="212.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">by ServiceImpl classes; dependency inversion is in place but without reciprocal</text><text x="747.5" y="234.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">interfaces nothing blocks a backchannel except discipline</text><path d="M9.3 285.1L496.1 285.8L496.1 436.1L9.7 433.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 285.8Q252.1 287.0 495.6 285.5M7.6 285.4Q251.9 287.4 496.1 285.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 283.1Q496.3 359.9 495.5 436.8M495.0 284.0Q495.6 359.8 494.1 435.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 435.4Q253.1 434.3 9.3 434.1M496.7 435.0Q252.5 433.7 8.3 434.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 437.0Q11.5 359.7 10.3 282.5M11.0 436.4Q12.1 360.4 9.0 284.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="322.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3. Facade (Fig 24.2)</text><text x="252.5" y="344.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">the simplest: a Facade class lists the services as methods and forwards to classes</text><text x="252.5" y="366.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">the client should not touch; even dependency inversion is sacrificed; the Client</text><text x="252.5" y="388.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">has a transitive dependency on all service classes, so a change to one forces</text><text x="252.5" y="410.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">recompilation in static languages; backchannels are easy</text><path d="M504.1 284.1L989.6 284.3L989.6 435.2L504.4 435.1Z" fill="#d3dbe0" stroke="none"/><path d="M502.7 284.3Q747.3 286.0 991.8 284.3M504.1 284.1Q747.6 287.8 991.2 285.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 284.4Q992.1 360.4 989.4 436.3M990.1 283.9Q990.8 360.2 990.0 436.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 435.6Q747.7 434.2 503.1 434.5M992.5 434.0Q747.7 434.8 502.9 434.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 436.0Q505.9 359.9 506.0 283.7M505.3 435.5Q505.2 359.3 504.6 283.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="333.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Conclusion</text><text x="747.5" y="355.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">three simple examples among many, each with costs and benefits, each a placeholder</text><text x="747.5" y="377.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">that degrades if the boundary never materialises; the architect decides where a</text><text x="747.5" y="399.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">boundary might one day exist and whether to implement it fully or partially</text><path d="M9.5 449.2L989.1 450.5L990.6 549.4L9.8 551.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 449.5Q500.2 446.6 992.4 450.0M7.8 450.6Q500.1 451.6 992.4 450.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 447.6Q990.0 500.1 990.3 552.5M990.0 448.5Q988.6 500.2 990.9 552.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 550.9Q500.1 547.3 8.9 549.2M991.4 549.3Q500.2 546.8 9.0 550.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 552.5Q12.5 500.3 9.3 448.2M9.8 552.3Q12.1 500.3 9.7 448.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="495.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Skip-the-last-step: reciprocal interfaces and data structures exist, but all compile and deploy as one component. One-dimensional: only one direction is isolated.</text><text x="500.0" y="517.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Facade: only a named entry point.</text></svg>