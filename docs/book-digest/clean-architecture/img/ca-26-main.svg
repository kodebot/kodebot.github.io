<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 95.3L10.7 94.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.5 54.7 990.0 96.2M989.9 12.9Q991.4 54.5 990.3 96.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 94.4Q500.1 97.2 8.7 94.5M991.4 94.7Q499.6 93.2 7.8 95.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 96.0Q10.2 54.3 10.1 12.7M10.2 95.9Q8.8 55.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="61.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Every system has at least one component that creates, coordinates and oversees the others: Main</text><path d="M9.1 109.9L495.2 109.7L495.7 299.7L11.0 299.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 109.3Q252.2 110.9 496.0 109.1M7.7 109.3Q252.1 111.7 496.5 109.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 107.9Q496.6 204.6 494.3 301.3M494.2 108.5Q493.8 204.5 495.4 300.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 299.5Q252.1 300.0 7.9 299.1M495.9 300.2Q251.9 301.3 7.9 300.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 302.1Q12.7 205.5 10.3 108.9M9.8 302.0Q8.2 205.2 9.0 108.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="145.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The ultimate detail</text><text x="252.5" y="167.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">the lowest-level policy and the initial entry point; nothing but the operating</text><text x="252.5" y="189.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">system depends on it; it creates all the Factories, Strategies and other global</text><text x="252.5" y="211.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">facilities, then hands control to the high-level abstract parts; the place for a</text><text x="252.5" y="233.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Dependency Injection framework to inject dependencies into Main, which then</text><text x="252.5" y="255.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">distributes them normally without the framework; &#x27;the dirtiest of all the dirty</text><text x="252.5" y="277.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">components&#x27;</text><path d="M506.1 109.0L990.3 110.4L990.5 298.8L504.4 301.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 109.4Q747.5 111.4 991.6 109.4M504.6 110.2Q747.5 110.6 990.5 110.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 109.2Q991.9 204.8 990.3 300.5M991.1 107.5Q988.6 204.0 989.8 300.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 299.6Q747.0 301.6 503.0 300.0M992.1 299.3Q747.7 298.6 503.4 299.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 301.3Q507.0 205.2 505.1 109.1M504.5 302.4Q504.6 205.1 505.0 107.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="145.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The Hunt the Wumpus Main</text><text x="747.5" y="167.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">loads the strings the main body of the code should not know (environments, shapes,</text><text x="747.5" y="189.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">cavern types, adornments) and uses an HtwFactory with the class name</text><text x="747.5" y="211.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">htw.game.HuntTheWumpusFacade, even dirtier than Main, so changes there do not</text><text x="747.5" y="233.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">recompile or redeploy Main; it creates the input stream, runs the main loop turning</text><text x="747.5" y="255.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">input into commands (move, shoot, rest, quit), defers processing to higher-level</text><text x="747.5" y="277.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">components and builds a random map of 10 to 39 caverns</text><path d="M9.3 315.1L991.1 315.8L991.1 506.1L9.7 503.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 315.8Q499.6 317.0 990.6 315.5M7.6 315.4Q499.4 317.4 991.1 315.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 313.1Q991.3 409.9 990.5 506.8M990.0 314.0Q990.6 409.8 989.1 505.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 505.4Q500.6 504.3 9.3 504.1M991.7 505.0Q500.0 503.7 8.3 504.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 507.0Q11.5 409.7 10.3 312.5M11.0 506.4Q12.1 410.4 9.0 314.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="394.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Main is a plugin to the application: it sets up initial conditions and configuration, gathers outside resources, then hands control to the high-level policy. Because it</text><text x="500.0" y="416.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">is a plugin there can be many Mains: Dev, Test and Production; one per country, jurisdiction or customer. Seen as a plugin behind an architectural boundary,</text><text x="500.0" y="438.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">configuration becomes much easier to solve.</text></svg>