<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="500" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 95.3L10.7 94.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.5 54.7 990.0 96.2M989.9 12.9Q991.4 54.5 990.3 96.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 94.4Q500.1 97.2 8.7 94.5M991.4 94.7Q499.6 93.2 7.8 95.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 96.0Q10.2 54.3 10.1 12.7M10.2 95.9Q8.8 55.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="50.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">The GUI is a detail; the web is a GUI; so the web is a detail. Put it behind a boundary, apart from the core business logic: the web is an IO device, and since the</text><text x="500.0" y="72.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">1960s we have written device-independent applications</text><path d="M9.1 109.9L495.2 109.7L495.7 259.7L11.0 259.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 109.3Q252.2 110.9 496.0 109.1M7.7 109.3Q252.1 111.7 496.5 109.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 107.9Q496.6 184.6 494.3 261.3M494.2 108.5Q493.8 184.5 495.4 260.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 259.5Q252.1 260.0 7.9 259.1M495.9 260.2Q251.9 261.3 7.9 260.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 262.1Q12.7 185.5 10.3 108.9M9.8 262.0Q8.2 185.2 9.0 108.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="136.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The endless pendulum</text><text x="252.5" y="158.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">computing power swings between centre and edge: punched cards, mainframes with</text><text x="252.5" y="180.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">smart green-screen terminals, minicomputers with dumb terminals, client-server, web</text><text x="252.5" y="202.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">with stupid browsers, applets, server-side content, Web 2.0 with Ajax and</text><text x="252.5" y="224.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">JavaScript, whole applications in browsers, and now JavaScript back on the server</text><text x="252.5" y="246.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">with Node; short-term oscillations to push away from the core business rules</text><path d="M506.1 109.0L990.3 110.4L990.5 258.8L504.4 261.1Z" fill="#efe0ca" stroke="none"/><path d="M503.4 109.4Q747.5 111.4 991.6 109.4M504.6 110.2Q747.5 110.6 990.5 110.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 109.2Q991.9 184.8 990.3 260.5M991.1 107.5Q988.6 184.0 989.8 260.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 259.6Q747.0 261.6 503.0 260.0M992.1 259.3Q747.7 258.6 503.4 259.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 261.3Q507.0 185.2 505.1 109.1M504.5 262.4Q504.6 185.1 505.0 107.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="147.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Marketing geniuses</text><text x="747.5" y="169.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">company Q&#x27;s desktop finance app was restyled to look like a browser, then gradually</text><text x="747.5" y="191.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">reverted; company A&#x27;s phone OS upgrade changed every app&#x27;s look and feel:</text><text x="747.5" y="213.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">architects who decoupled business rules from the UI are protected; there is always</text><text x="747.5" y="235.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">someone waiting to pounce on the next bit of coupling</text><path d="M9.3 275.1L496.1 275.8L496.1 386.1L9.7 383.8Z" fill="#eed5cc" stroke="none"/><path d="M8.5 275.8Q252.1 277.0 495.6 275.5M7.6 275.4Q251.9 277.4 496.1 275.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 273.1Q496.2 329.9 495.5 386.8M495.0 274.0Q495.5 329.8 494.1 385.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 385.4Q253.1 384.3 9.3 384.1M496.7 385.0Q252.5 383.7 8.3 384.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 387.0Q11.3 329.7 10.3 272.5M11.0 386.4Q11.9 330.4 9.0 274.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="303.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Is device independence impractical?</text><text x="252.5" y="325.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">partly: the dance between UI and application is chatty in GUI-specific ways</text><text x="252.5" y="347.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">(JavaScript validation, drag-and-drop Ajax), unlikely to be abstracted like UNIX</text><text x="252.5" y="369.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">devices</text><path d="M504.1 274.1L989.6 274.3L989.6 385.2L504.4 385.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 274.3Q747.3 276.0 991.8 274.3M504.1 274.1Q747.6 277.8 991.2 275.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 274.4Q991.8 330.4 989.4 386.3M990.1 273.9Q990.7 330.2 990.0 386.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 385.6Q747.7 384.2 503.1 384.5M992.5 384.0Q747.7 384.8 502.9 384.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 386.0Q505.9 329.9 506.0 273.7M505.3 385.5Q505.2 329.3 504.6 273.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="303.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">But another boundary can be abstracted</text><text x="747.5" y="325.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">business logic is a suite of use cases, each with input data, processing and output</text><text x="747.5" y="347.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">data; once the UI&#x27;s dance completes the input, put it in a data structure, run the</text><text x="747.5" y="369.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">use case, and feed the output data back</text><path d="M9.5 399.2L989.1 400.5L990.6 489.4L9.8 491.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 399.5Q500.2 396.6 992.4 400.0M7.8 400.6Q500.1 401.6 992.4 400.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 397.6Q990.1 445.1 990.3 492.5M990.0 398.5Q988.7 445.2 990.9 492.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 490.9Q500.1 487.3 8.9 489.2M991.4 489.3Q500.2 486.8 9.0 490.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 492.5Q12.4 445.3 9.3 398.2M9.8 492.3Q11.9 445.3 9.7 398.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="440.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Each use case operates the UI&#x27;s IO device device-independently. This abstraction is not easy and takes several iterations to get right, but it is possible, and often</text><text x="500.0" y="462.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">very necessary.</text></svg>