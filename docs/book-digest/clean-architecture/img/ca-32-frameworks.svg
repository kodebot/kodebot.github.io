<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="500" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 85.3L10.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.6 49.7 990.0 86.2M989.9 12.9Q991.3 49.5 990.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 84.4Q500.1 87.2 8.7 84.5M991.4 84.7Q499.6 83.2 7.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 86.0Q10.2 49.3 10.1 12.7M10.2 85.9Q8.9 50.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="56.0" font-size="16.5" fill="#3b2f20" text-anchor="middle">Frameworks are not architectures, though some try to be; don&#x27;t marry the framework: use it, but do not couple to it</text><path d="M9.1 99.9L495.2 99.7L495.7 249.7L11.0 249.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 99.3Q252.2 100.9 496.0 99.1M7.7 99.3Q252.1 101.7 496.5 99.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 97.9Q496.6 174.6 494.3 251.3M494.2 98.5Q493.8 174.5 495.4 250.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 249.5Q252.1 250.0 7.9 249.1M495.9 250.2Q251.9 251.3 7.9 250.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 252.1Q12.7 175.5 10.3 98.9M9.8 252.0Q8.2 175.2 9.0 98.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="126.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Asymmetric marriage</text><text x="252.5" y="148.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">you make a huge commitment (derive from its base classes, import its facilities</text><text x="252.5" y="170.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">into your business objects, couple as tightly as possible); the author makes none;</text><text x="252.5" y="192.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">the author wants the coupling since he or she controls the framework and it is hard</text><text x="252.5" y="214.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">to break away from; authors write for their own and their friends&#x27; problems, not</text><text x="252.5" y="236.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">yours</text><path d="M506.1 99.0L990.3 100.4L990.5 248.8L504.4 251.1Z" fill="#eed5cc" stroke="none"/><path d="M503.4 99.4Q747.5 101.4 991.6 99.4M504.6 100.2Q747.5 100.6 990.5 100.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 99.2Q991.9 174.8 990.3 250.5M991.1 97.5Q988.6 174.0 989.8 250.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 249.6Q747.0 251.6 503.0 250.0M992.1 249.3Q747.7 248.6 503.4 249.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 251.3Q507.0 175.2 505.1 99.1M504.5 252.4Q504.6 175.1 505.0 97.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="126.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The risks</text><text x="747.5" y="148.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">(1) frameworks tend to violate the Dependency Rule, asking to be inherited into</text><text x="747.5" y="170.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">your Entities, the innermost circle; (2) as the product matures it outgrows the</text><text x="747.5" y="192.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">framework, which fights you; (3) it may evolve in an unhelpful direction, with</text><text x="747.5" y="214.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">upgrades that do not help and features that change or vanish; (4) a better</text><text x="747.5" y="236.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">framework may arrive</text><path d="M9.3 265.1L496.1 265.8L496.1 406.1L9.7 403.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 265.8Q252.1 267.0 495.6 265.5M7.6 265.4Q251.9 267.4 496.1 265.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 263.1Q496.3 334.9 495.5 406.8M495.0 264.0Q495.6 334.8 494.1 405.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 405.4Q253.1 404.3 9.3 404.1M496.7 405.0Q252.5 403.7 8.3 404.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 407.0Q11.5 334.7 10.3 262.5M11.0 406.4Q12.1 335.4 9.0 264.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="308.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The solution</text><text x="252.5" y="330.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">keep the framework at arm&#x27;s length in an outer circle; if it wants business objects</text><text x="252.5" y="352.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">derived from its base classes, say no: derive proxies kept in components that plug</text><text x="252.5" y="374.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">in to the business rules, following the Dependency Rule</text><path d="M504.1 264.1L989.6 264.3L989.6 405.2L504.4 405.1Z" fill="#d0dfdc" stroke="none"/><path d="M502.7 264.3Q747.3 266.0 991.8 264.3M504.1 264.1Q747.6 267.8 991.2 265.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 264.4Q992.1 335.4 989.4 406.3M990.1 263.9Q990.8 335.2 990.0 406.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 405.6Q747.7 404.2 503.1 404.5M992.5 404.0Q747.7 404.8 502.9 404.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 406.0Q505.9 334.9 506.0 263.7M505.3 405.5Q505.2 334.3 504.6 263.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="308.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Example: Spring</text><text x="747.5" y="330.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">fine as a dependency injection framework, but do not sprinkle @autowired through</text><text x="747.5" y="352.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">business objects, which must not know Spring; instead use Spring to inject</text><text x="747.5" y="374.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">dependencies into Main, the dirtiest, lowest-level component</text><path d="M9.5 419.2L989.1 420.5L990.6 489.4L9.8 491.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 419.5Q500.2 416.6 992.4 420.0M7.8 420.6Q500.1 421.6 992.4 420.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 417.6Q990.2 455.1 990.3 492.5M990.0 418.5Q989.0 455.2 990.9 492.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 490.9Q500.1 487.3 8.9 489.2M991.4 489.3Q500.2 486.8 9.0 490.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 492.5Q12.0 455.3 9.3 418.2M9.8 492.3Q11.6 455.3 9.7 418.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="450.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Some marriages are unavoidable (STL in C++, the standard library in Java): still make it a decision; date a framework a while, keep it behind a boundary as long as</text><text x="500.0" y="472.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">possible, and perhaps get the milk without buying the cow.</text></svg>