oin="round"/><path d="M669.9 202.0Q671.4 139.7 670.3 77.5M671.0 201.4Q672.0 140.4 669.0 79.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="800.0" y="124.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The runtime</text><text x="800.0" y="146.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">security, portability across</text><text x="800.0" y="168.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">operating systems, garbage collection</text><text x="490" y="235" font-size="17" font-weight="400" fill="#3b2f20" text-anchor="middle">Java wins because the three work together, not because of syntax alone</text></svg>