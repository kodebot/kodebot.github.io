<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M21.1 20.0L490.3 20.4L488.9 150.3L20.7 149.2Z" fill="#d6e1cf" stroke="none"/><path d="M18.5 20.0Q255.1 20.0 491.8 19.6M19.5 20.4Q255.5 19.6 491.5 20.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 18.3Q489.2 84.7 490.0 151.2M489.9 17.9Q491.9 84.5 490.3 151.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 149.4Q255.1 152.2 18.7 149.5M491.4 149.7Q254.6 148.2 17.8 150.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 151.0Q20.0 84.3 20.1 17.7M20.2 150.9Q18.5 85.1 19.1 19.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="58.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Primary defences</text><text x="255.0" y="80.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">parameterised queries for data values;</text><text x="255.0" y="102.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fixed application-owned allow-list for table names,</text><text x="255.0" y="124.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">column names and sort direction</text><path d="M509.1 19.9L980.2 19.7L980.7 149.7L511.0 149.8Z" fill="#eed5cc" stroke="none"/><path d="M508.4 19.3Q744.7 20.9 981.0 19.1M507.7 19.3Q744.6 21.7 981.5 19.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 17.9Q981.6 84.6 979.3 151.3M979.2 18.5Q978.8 84.5 980.4 150.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 149.5Q744.6 150.0 507.9 149.1M980.9 150.2Q744.4 151.3 507.9 150.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.2 152.1Q512.7 85.5 510.3 18.9M509.8 152.0Q508.2 85.2 509.0 18.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="58.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Strongly discouraged</text><text x="745.0" y="80.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">manual escaping: dialect-specific rules,</text><text x="745.0" y="102.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">database settings change behaviour,</text><text x="745.0" y="124.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">easy to get wrong</text><path d="M21.1 174.0L490.3 175.4L490.5 323.8L19.4 326.1Z" fill="#d0dfdc" stroke="none"/><path d="M18.4 174.4Q255.0 176.4 491.6 174.4M19.6 175.2Q255.0 175.6 490.5 175.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.9 174.2Q491.9 249.8 490.3 325.5M491.1 172.5Q488.6 249.0 489.8 325.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.1 324.6Q254.5 326.6 18.0 325.0M492.1 324.3Q255.2 323.6 18.4 324.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.6 326.3Q22.0 250.2 20.1 174.1M19.5 327.4Q19.6 250.1 20.0 172.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="223.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Defence in depth</text><text x="255.0" y="245.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">least privilege (no DBA or admin rights for apps),</text><text x="255.0" y="267.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one account per application, views limiting columns,</text><text x="255.0" y="289.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">DBMS running as a low-privilege OS account</text><path d="M509.3 175.1L981.1 175.8L981.1 326.1L509.7 323.8Z" fill="#efe0ca" stroke="none"/><path d="M508.5 175.8Q744.6 177.0 980.6 175.5M507.6 175.4Q744.4 177.4 981.1 175.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 173.1Q981.3 249.9 980.5 326.8M980.0 174.0Q980.6 249.8 979.1 325.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 325.4Q745.6 324.3 509.3 324.1M981.7 325.0Q745.0 323.7 508.3 324.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.9 327.0Q511.5 249.7 510.3 172.5M511.0 326.4Q512.1 250.4 509.0 174.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="223.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Does not replace binding</text><text x="745.0" y="245.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">input validation (type, length, format)</text><text x="745.0" y="267.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">complements parameters; a validated value</text><text x="745.0" y="289.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">still must not be concatenated into SQL</text><text x="500" y="355" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">Stored procedures and ORM query languages (HQL, JPQL) can be injectable too:</text><text x="500" y="378" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">binding the call does not protect dynamic SQL built inside the procedure</text></svg>