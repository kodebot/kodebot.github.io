<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><rect x="20" y="160" width="200" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="120.0" y="185.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Outside objects</text><text x="120.0" y="205.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">may reference only</text><text x="120.0" y="225.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">the root</text><rect x="300" y="20" width="660" height="360" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="322" y="54" font-size="16" font-weight="700" fill="#14324f">Aggregate boundary</text><rect x="340" y="150" width="200" height="100" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="440.0" y="175.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Customer</text><text x="440.0" y="195.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">ROOT ENTITY</text><text x="440.0" y="215.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">global identity</text><text x="440.0" y="235.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">enforces invariants</text><rect x="620" y="80" width="300" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="770.0" y="110.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Address</text><text x="770.0" y="130.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">value object</text><rect x="620" y="170" width="300" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="770.0" y="200.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">ContactInfo</text><text x="770.0" y="220.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">phones, fax, e-mail</text><rect x="620" y="260" width="300" height="90" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="770.0" y="300.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Internal entities</text><text x="770.0" y="320.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">local identity: only meaningful inside</text><line x1="540" y1="190" x2="620" y2="115" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="200" x2="620" y2="205" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="215" x2="620" y2="300" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="220" y1="200" x2="340" y2="200" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="280.0" y="190" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">allowed</text><rect x="20" y="290" width="240" height="60" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="140.0" y="315.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Direct access to</text><text x="140.0" y="335.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">internal objects: not allowed</text></svg>