><text x="308.0" y="319.0" font-size="15" fill="#3b2f20" text-anchor="start" stroke="#fbf7ef" stroke-width="5" paint-order="stroke">uses</text><text x="750" y="120" font-size="16" font-weight="400" fill="#3b2f20" text-anchor="middle">each layer depends only</text><text x="750" y="142" font-size="16" font-weight="400" fill="#3b2f20" text-anchor="middle">on the layers below it</text><text x="750" y="230" font-size="15" font-weight="400" fill="#3b2f20" text-anchor="middle">all domain-model code lives</text><text x="750" y="250" font-size="15" font-weight="400" fill="#3b2f20" text-anchor="middle">in one layer, isolated from</text><text x="750" y="270" font-size="15" font-weight="400" fill="#3b2f20" text-anchor="middle">UI, application and</text><text x="750" y="290" font-size="15" font-weight="400" fill="#3b2f20" text-anchor="middle">infrastructure code</text></svg>