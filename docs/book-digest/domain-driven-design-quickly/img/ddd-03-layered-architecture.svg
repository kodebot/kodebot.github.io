<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><rect x="20" y="20" width="560" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="300.0" y="50.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">User Interface</text><text x="300.0" y="70.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">presents information, interprets user commands</text><rect x="20" y="124" width="560" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="300.0" y="154.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Application</text><text x="300.0" y="174.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">thin: coordinates activity, no business logic</text><rect x="20" y="228" width="560" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="300.0" y="258.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Domain</text><text x="300.0" y="278.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">the heart of the business software, holds object state</text><rect x="20" y="332" width="560" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="300.0" y="362.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Infrastructure</text><text x="300.0" y="382.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">persistence, communication, supporting libraries</text><line x1="300.0" y1="90" x2="300.0" y2="124" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="308.0" y="111.0" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">uses</text><line x1="300.0" y1="194" x2="300.0" y2="228" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="308.0" y="215.0" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">uses</text><line x1="300.0" y1="298" x2="300.0" y2="332" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="308.0" y="319.0" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">uses</text><text x="750" y="120" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">each layer depends only</text><text x="750" y="142" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">on the layers below it</text><text x="750" y="230" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">all domain-model code lives</text><text x="750" y="250" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">in one layer, isolated from</text><text x="750" y="270" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">UI, application and</text><text x="750" y="290" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">infrastructure code</text></svg>