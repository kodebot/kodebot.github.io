<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="940" height="330" fill="#ffffff"/><rect x="20" y="110" width="170" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="105.0" y="140.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Client</text><text x="105.0" y="160.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">domain code</text><rect x="300" y="40" width="330" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="465.0" y="65.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Repository</text><text x="465.0" y="85.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">illusion of an in-memory</text><text x="465.0" y="105.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">collection of one type</text><rect x="740" y="40" width="180" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="830.0" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Persistence</text><text x="830.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">infrastructure</text><text x="830.0" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">database</text><line x1="190" y1="130" x2="300" y2="90" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="630" y1="80" x2="740" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="685" y="65" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">Strategy</text><rect x="300" y="210" width="330" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="465.0" y="240.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Direct database access</text><text x="465.0" y="260.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">SQL and record sets in the domain</text><line x1="190" y1="160" x2="300" y2="235" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="630" y1="245" x2="830" y2="120" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="470" y="315" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the repository decouples the model from storage; the shortcut buries domain logic in queries</text></svg>