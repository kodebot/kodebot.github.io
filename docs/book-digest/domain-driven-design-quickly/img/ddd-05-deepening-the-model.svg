<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><rect x="20" y="50" width="170" height="84" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="105.0" y="87.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">First model</text><text x="105.0" y="107.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">always shallow</text><rect x="225" y="50" width="170" height="84" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="310.0" y="87.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Learn the</text><text x="310.0" y="107.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">domain more</text><rect x="430" y="50" width="170" height="84" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="515.0" y="87.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Spot an implicit</text><text x="515.0" y="107.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">concept</text><rect x="635" y="50" width="170" height="84" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="720.0" y="77.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Make it explicit</text><text x="720.0" y="97.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">constraint, process,</text><text x="720.0" y="117.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">specification</text><rect x="840" y="50" width="170" height="84" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="925.0" y="87.0" font-size="15" font-weight="700" fill="#134