 257.9 169.1M485.9 170.2Q371.9 171.3 257.9 170.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M260.2 172.1Q262.4 115.5 260.3 58.9M259.8 172.0Q258.4 115.2 259.0 58.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="372.5" y="99.0" font-size="16.0" fill="#3b2f20" text-anchor="middle">Awkwardness in the design</text><text x="372.5" y="121.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a hard-to-follow path or a</text><text x="372.5" y="143.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">fat object: a missing concept</text><path d="M506.1 59.0L730.3 60.4L730.5 168.8L504.4 171.1Z" fill="#eed5cc" stroke="none"/><path d="M503.4 59.4Q617.5 61.4 731.6 59.4M504.6 60.2Q617.5 60.6 730.5 60.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M730.9 59.2Q731.8 114.8 730.3 170.5M731.1 57.5Q728.9 114.0 729.8 170.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M731.1 169.6Q617.0 171.6 503.0 170.0M732.1 169.3Q617.7 168.6 503.4 169.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 171.3Q506.8 115.2 505.1 59.1M504.5 172.4Q504.6 115.1 505.0 57.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="617.5" y="99.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Contradictions</text><text x="617.5" y="121.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">between experts or requirements;</text><text x="617.5" y="143.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">reconcile them to reveal concepts</text><path d="M749.3 60.1L976.1 60.8L976.1 171.1L749.7 168.8Z" fill="#d6e1cf" stroke="none"/><path d="M748.5 60.8Q862.1 62.0 975.6 60.5M747.6 60.4Q861.9 62.4 976.1 60.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-line