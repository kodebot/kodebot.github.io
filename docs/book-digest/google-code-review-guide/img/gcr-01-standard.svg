<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="340" fill="#fbf7ef"/><path d="M21.1 20.0L480.3 20.4L478.9 140.3L20.7 139.2Z" fill="#efe0ca" stroke="none"/><path d="M18.5 20.0Q250.1 20.0 481.8 19.6M19.5 20.4Q250.5 19.6 481.5 20.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M480.8 18.3Q479.3 79.7 480.0 141.2M479.9 17.9Q481.8 79.5 480.3 141.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M481.5 139.4Q250.1 142.2 18.7 139.5M481.4 139.7Q249.6 138.2 17.8 140.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 141.0Q20.0 79.3 20.1 17.7M20.2 140.9Q18.6 80.1 19.1 19.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="64.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Developers must be able to make progress</text><text x="250.0" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">no change ever lands, no improvement ever happens;</text><text x="250.0" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">hard reviews discourage future improvements</text><path d="M519.1 19.9L980.2 19.7L980.7 139.7L521.0 139.8Z" fill="#d3dbe0" stroke="none"/><path d="M518.4 19.3Q749.7 20.9 981.0 19.1M517.7 19.3Q749.6 21.7 981.5 19.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 17.9Q981.5 79.6 979.3 141.3M979.2 18.5Q978.8 79.5 980.4 140.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 139.5Q749.6 140.0 517.9 139.1M980.9 140.2Q749.4 141.3 517.9 140.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M520.2 142.1Q522.6 80.5 520.3 18.9M519.8 142.0Q518.3 80.2 519.0 18.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="64.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Reviewers protect code health</text><text x="750.0" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">small drops in health add up, especially</text><text x="750.0" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">under time pressure and shortcuts</text><path d="M211.1 174.0L790.3 175.4L790.5 263.8L209.4 266.1Z" fill="#d6e1cf" stroke="none"/><path d="M208.4 174.4Q500.0 176.4 791.6 174.4M209.6 175.2Q500.0 175.6 790.5 175.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M790.9 174.2Q791.6 219.8 790.3 265.5M791.1 172.5Q789.1 219.0 789.8 265.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M791.1 264.6Q499.5 266.6 208.0 265.0M792.1 264.3Q500.2 263.6 208.4 264.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M210.6 266.3Q211.6 220.2 210.1 174.1M209.5 267.4Q209.6 220.1 210.0 172.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="215.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Approve once the change definitely improves overall code health,</text><text x="500.0" y="237.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">even if it is not perfect: there is no perfect code, only better code</text><path d="M249.4 140.1Q324.5 160.8 401.0 175.7M251.0 139.8Q324.4 159.7 398.9 175.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M399.6 175.3Q395.5 170.9 391.1 166.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M399.8 175.3Q394.3 176.8 388.7 177.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M750.5 140.3Q674.7 156.3 599.6 175.0M749.1 139.2Q674.1 156.1 599.6 175.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600.4 174.5Q606.0 176.3 611.7 178.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M599.9 174.7Q604.8 171.1 609.3 167.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="300" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">The standard of code review: balance progress against code health</text><text x="500" y="322" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">Exception: nothing justifies a change that definitely worsens code health, except a real emergency</text></svg>