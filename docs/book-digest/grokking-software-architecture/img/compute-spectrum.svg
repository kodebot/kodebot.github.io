<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="300" fill="#ffffff"/><line x1="40" y1="50" x2="940" y2="50" stroke="#6f8aa3" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="40" y="35" font-size="14" font-weight="700" fill="#14324f">MORE CONTROL, MORE WORK</text><text x="940" y="35" font-size="14" font-weight="700" fill="#14324f" text-anchor="end">MORE CONVENIENCE, LESS CONTROL</text><rect x="30" y="100" width="170" height="100" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="115.0" y="145.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">IaaS</text><text x="115.0" y="165.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">VMs: you run the OS</text><rect x="220" y="100" width="170" height="100" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="305.0" y="145.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">CaaS</text><text x="305.0" y="165.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">containers + Kubernetes</text><rect x="410" y="100" width="170" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="495.0" y="145.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">PaaS</text><text x="495.0" y="165.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">hand over your code</text><rect x="600" y="100" width="170" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="685.0" y="145.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">FaaS</text><text x="685.0" y="165.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">functions, per millisecond</text><rect x="790" y="100" width="170" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="875.0" y="145.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">AIaaS</text><text x="875.0" y="165.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">prompt in, answer out</text><rect x="30" y="225" width="930" height="50" rx="8" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="495.0" y="255.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Rule: pick the most convenient model that still gives you the control you need</text></svg>