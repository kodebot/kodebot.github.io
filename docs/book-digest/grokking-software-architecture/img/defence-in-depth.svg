<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><rect x="40" y="30" width="900" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="490.0" y="55.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Network</text><text x="490.0" y="75.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">VPC, subnets, no public route to the data</text><rect x="100" y="98" width="780" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="490.0" y="123.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Perimeter</text><text x="490.0" y="143.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">WAF, rate limits, API gateway</text><rect x="160" y="166" width="660" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="490.0" y="191.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Identity</text><text x="490.0" y="211.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">IdP, JWT checks, mTLS between services</text><rect x="220" y="234" width="540" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="259.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Application</text><text x="490.0" y="279.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">input validation, lockouts, least privilege</text><rect x="280" y="302" width="420" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="490.0" y="327.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Data</text><text x="490.0" y="347.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">encryption at rest and in transit</text><line x1="490" y1="15" x2="490" y2="40" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/></svg>