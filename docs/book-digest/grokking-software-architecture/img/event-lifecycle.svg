<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="360" fill="#ffffff"/><rect x="20" y="120" width="150" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="95.0" y="155.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Producer</text><text x="95.0" y="175.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Order Service</text><rect x="250" y="120" width="170" height="80" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="335.0" y="155.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Broker</text><text x="335.0" y="175.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">persists to disk</text><rect x="520" y="120" width="170" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="605.0" y="155.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Consumer</text><text x="605.0" y="175.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Shipping Service</text><rect x="790" y="120" width="170" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="875.0" y="155.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Done</text><text x="875.0" y="175.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">message deleted</text><rect x="520" y="270" width="170" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="605.0" y="300.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Dead letter queue</text><text x="605.0" y="320.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">after N failed tries</text><line x1="170" y1="145" x2="250" y2="145" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="210.0" y="137.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">1 publish</text><line x1="250" y1="180" x2="170" y2="180" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="210.0" y="198" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">ACK</text><line x1="420" y1="160" x2="520" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="470.0" y="150" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">2 deliver</text><line x1="690" y1="160" x2="790" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="740.0" y="150" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">3 ACK</text><line x1="605" y1="200" x2="605" y2="270" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="665" y="240" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">N failures</text><rect x="250" y="270" width="170" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="335.0" y="300.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Redelivery</text><text x="335.0" y="320.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">back in the queue</text><line x1="525" y1="200" x2="420" y2="285" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="430" y="232" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">no ACK / crash</text><line x1="335" y1="270" x2="335" y2="200" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="20" width="940" height="50" rx="8" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="50.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Producer moves on at the first ACK. No consumer ACK = the broker redelivers (at-least-once).</text></svg>