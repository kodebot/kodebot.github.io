<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="300" fill="#ffffff"/><rect x="20" y="70" width="290" height="120" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="165.0" y="115.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">1 Expand</text><text x="165.0" y="135.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">add phone_mobile beside</text><text x="165.0" y="155.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">customer_phone; old code still works</text><line x1="310" y1="130" x2="340" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="340" y="70" width="290" height="120" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="485.0" y="115.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">2 Transition</text><text x="485.0" y="135.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">write both columns, backfill</text><text x="485.0" y="155.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">history; read old, then new</text><line x1="630" y1="130" x2="660" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="660" y="70" width="290" height="120" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="805.0" y="115.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">3 Contract</text><text x="805.0" y="135.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">all instances on new code: drop</text><text x="805.0" y="155.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">customer_phone</text><rect x="20" y="220" width="930" height="50" rx="8" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="485.0" y="250.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Every step is backward compatible, so each release can be rolled back safely</text></svg>