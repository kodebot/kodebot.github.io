<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="470" fill="#ffffff"/><rect x="40" y="30" width="600" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="340.0" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Presentation</text><text x="340.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">controllers, UI: HTTP, JSON, views</text><line x1="340" y1="110" x2="340" y2="135" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="135" width="600" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="340.0" y="170.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Application</text><text x="340.0" y="190.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">use cases, orchestration, transactions</text><line x1="340" y1="215" x2="340" y2="240" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="240" width="600" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="340.0" y="275.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Domain</text><text x="340.0" y="295.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">entities, rules, business state</text><line x1="340" y1="320" x2="340" y2="345" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="345" width="600" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="340.0" y="380.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Infrastructure</text><text x="340.0" y="400.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">database, email, APIs, queues</text><rect x="700" y="30" width="240" height="395" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="820.0" y="182.5" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Cross-cutting</text><text x="820.0" y="202.5" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">logging, security,</text><text x="820.0" y="222.5" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">caching, errors</text><text x="820.0" y="242.5" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle"></text><text x="820.0" y="262.5" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">injected as abstractions</text><text x="820.0" y="282.5" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">(ILogger), not static calls</text><line x1="640" y1="70" x2="700" y2="70" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="640" y1="175" x2="700" y2="175" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="640" y1="280" x2="700" y2="280" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="640" y1="385" x2="700" y2="385" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="40" y="440" width="600" height="24" rx="6" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="340.0" y="457.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Dependencies point down only; data (results) flows back up</text></svg>