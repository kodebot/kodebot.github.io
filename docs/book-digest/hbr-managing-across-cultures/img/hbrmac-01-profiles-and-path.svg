<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Six CQ profiles (most managers fit at least one) and a six-step development path</text><path d="M9.1 89.9L330.2 89.7L330.7 209.7L11.0 209.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 89.3Q169.7 90.9 331.0 89.1M7.7 89.3Q169.6 91.7 331.5 89.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 87.9Q331.5 149.6 329.3 211.3M329.2 88.5Q328.8 149.5 330.4 210.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 209.5Q169.6 210.0 7.9 209.1M330.9 210.2Q169.4 211.3 7.9 210.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 212.1Q12.6 150.5 10.3 88.9M9.8 212.0Q8.3 150.2 9.0 88.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="134.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The provincial</text><text x="170.0" y="156.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">effective with similar people, stumbles farther afield</text><text x="170.0" y="178.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(the Chevrolet engineer at Saturn)</text><path d="M341.1 89.0L660.3 90.4L660.5 208.8L339.4 211.1Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 89.4Q500.0 91.4 661.6 89.4M339.6 90.2Q500.0 90.6 660.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 89.2Q661.9 149.8 660.3 210.5M661.1 87.5Q658.7 149.0 659.8 210.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 209.6Q499.5 211.6 338.0 210.0M662.1 209.3Q500.2 208.6 338.4 209.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 211.3Q341.9 150.2 340.1 89.1M339.5 212.4Q339.6 150.1 340.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="123.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The analyst</text><text x="500.0" y="145.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">decodes rules with elaborate learning strategies</text><text x="500.0" y="167.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">(Deirdre held one-to-one meetings and revised the</text><text x="500.0" y="189.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">negotiating strategy)</text><path d="M669.3 90.1L991.1 90.8L991.1 211.1L669.7 208.8Z" fill="#d0dfdc" stroke="none"/><path d="M668.5 90.8Q829.6 92.0 990.6 90.5M667.6 90.4Q829.4 92.4 991.1 90.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 88.1Q991.3 149.9 990.5 211.8M990.0 89.0Q990.6 149.8 989.1 210.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 210.4Q830.6 209.3 669.3 209.1M991.7 210.0Q830.0 208.7 668.3 209.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 212.0Q671.4 149.7 670.3 87.5M671.0 211.4Q672.0 150.4 669.0 89.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="134.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The natural</text><text x="830.0" y="156.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">relies on intuition and first impressions; may falter</text><text x="830.0" y="178.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">when ambiguity needs improvised learning</text><path d="M9.1 219.1L329.6 219.3L329.6 340.2L9.4 340.1Z" fill="#d0dfdc" stroke="none"/><path d="M7.7 219.3Q169.8 221.0 331.8 219.3M9.1 219.1Q170.1 222.8 331.2 220.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.0 219.4Q331.9 280.4 329.4 341.3M330.1 218.9Q330.8 280.2 330.0 341.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M332.4 340.6Q170.2 339.2 8.1 339.5M332.5 339.0Q170.2 339.8 7.9 339.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 341.0Q10.9 279.9 11.0 218.7M10.3 340.5Q10.2 279.3 9.6 218.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="264.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The ambassador</text><text x="170.0" y="286.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">convinces others he belongs, though he may know little;</text><text x="170.0" y="308.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the most common type; needs humility</text><path d="M339.5 219.2L659.1 220.5L660.6 339.4L339.8 341.2Z" fill="#d6e1cf" stroke="none"/><path d="M338.0 219.5Q500.2 216.6 662.4 220.0M337.8 220.6Q500.1 221.6 662.4 220.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.0 217.6Q660.0 280.1 660.3 342.5M660.0 218.5Q658.4 280.2 660.9 342.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 340.9Q500.1 337.3 338.9 339.2M661.4 339.3Q500.2 336.8 339.0 340.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.9 342.5Q342.9 280.3 339.3 218.2M339.8 342.3Q342.4 280.3 339.7 218.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="264.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The mimic</text><text x="500.0" y="286.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">high control of behaviour, less insight into meaning;</text><text x="500.0" y="308.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">builds trust, but pure imitation can read as mocking</text><path d="M671.0 219.5L990.5 219.4L989.4 341.1L668.8 339.1Z" fill="#d3dbe0" stroke="none"/><path d="M668.7 218.9Q829.6 216.7 990.6 219.7M669.2 220.4Q830.8 219.5 992.4 220.8" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 218.5Q987.6 280.4 989.0 342.3M990.6 218.4Q991.0 280.1 990.7 341.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 339.2Q830.4 339.3 668.2 340.1M990.6 339.0Q830.0 341.3 669.4 339.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.8 341.2Q671.4 280.2 670.5 219.3M669.9 340.7Q668.2 279.1 668.9 217.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="264.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The chameleon</text><text x="830.0" y="286.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">high on all three; only about 5 percent of 2,000</text><text x="830.0" y="308.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">managers surveyed (Nigel in Lahore)</text><path d="M10.7 236.1L988.9 235.6L991.1 545.6L9.4 545.8Z" fill="#f1ede5" stroke="none"/><path d="M7.8 234.2Q499.2 236.5 990.5 235.6M7.8 234.5Q499.6 236.6 991.5 234.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 234.3Q992.3 390.6 990.7 547.0M988.9 233.1Q989.4 389.8 990.1 546.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.7 545.8Q499.7 547.3 7.7 545.8M990.7 545.8Q500.0 543.8 9.3 545.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.7 546.6Q10.9 390.5 9.8 234.5M9.5 545.6Q11.2 389.4 9.0 233.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="352.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Development path (Deutsche Bank programme, two and a half days): 1) assess strengths and weaknesses (self-assessment, simulations, 360-degree feedback); 2) choose</text><text x="500.0" y="374.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">training aimed at weaknesses (acting classes for physical CQ, case studies for cognitive CQ); 3) apply it, starting with simple tasks such as buying a newspaper or</text><text x="500.0" y="396.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">greeting a visitor; 4) organise support and time; 5) enter the setting, playing to strengths (a mimic ventures first, an analyst observes then explains); 6) re-evaluate</text><text x="500.0" y="418.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">with feedback. Helmut, a northern German leading southern German staff, built confidence this way, then led a quality-improvement team with a two-stage style:</text><text x="500.0" y="440.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">commanding first, then more personal and inclusive.</text></svg>