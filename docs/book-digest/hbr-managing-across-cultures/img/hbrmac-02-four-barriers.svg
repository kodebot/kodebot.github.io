<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 85.3L10.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.6 49.7 990.0 86.2M989.9 12.9Q991.3 49.5 990.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 84.4Q500.1 87.2 8.7 84.5M991.4 84.7Q499.6 83.2 7.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 86.0Q10.2 49.3 10.1 12.7M10.2 85.9Q8.9 50.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="56.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Cultural differences cause four kinds of barrier on multicultural teams; the wrong managerial intervention can sideline valuable members or create resistance</text><path d="M9.1 99.9L495.2 99.7L495.7 249.7L11.0 249.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 99.3Q252.2 100.9 496.0 99.1M7.7 99.3Q252.1 101.7 496.5 99.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 97.9Q496.6 174.6 494.3 251.3M494.2 98.5Q493.8 174.5 495.4 250.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 249.5Q252.1 250.0 7.9 249.1M495.9 250.2Q251.9 251.3 7.9 250.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 252.1Q12.7 175.5 10.3 98.9M9.8 252.0Q8.2 175.2 9.0 98.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="148.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Direct versus indirect communication</text><text x="252.5" y="170.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Western meaning sits on the surface; elsewhere it is embedded in the message; the</text><text x="252.5" y="192.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">American who emailed flaws directly was isolated in a storage room by Japanese</text><text x="252.5" y="214.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">colleagues, and a Japanese yes may only mean &#x27;I&#x27;m listening&#x27;</text><path d="M506.1 99.0L990.3 100.4L990.5 248.8L504.4 251.1Z" fill="#efe0ca" stroke="none"/><path d="M503.4 99.4Q747.5 101.4 991.6 99.4M504.6 100.2Q747.5 100.6 990.5 100.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 99.2Q991.9 174.8 990.3 250.5M991.1 97.5Q988.6 174.0 989.8 250.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 249.6Q747.0 251.6 503.0 250.0M992.1 249.3Q747.7 248.6 503.4 249.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 251.3Q507.0 175.2 505.1 99.1M504.5 252.4Q504.6 175.1 505.0 97.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="159.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Accents and fluency</text><text x="747.5" y="181.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">the most expert member may be hard to understand, so the team underrates them; non-</text><text x="747.5" y="203.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">native members may stop contributing or worry about evaluations</text><path d="M9.3 260.1L496.1 260.8L496.1 411.1L9.7 408.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 260.8Q252.1 262.0 495.6 260.5M7.6 260.4Q251.9 262.4 496.1 260.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 258.1Q496.3 334.9 495.5 411.8M495.0 259.0Q495.6 334.8 494.1 410.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 410.4Q253.1 409.3 9.3 409.1M496.7 410.0Q252.5 408.7 8.3 409.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 412.0Q11.5 334.7 10.3 257.5M11.0 411.4Q12.1 335.4 9.0 259.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="308.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Attitudes to hierarchy</text><text x="252.5" y="330.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Mexican humility (framing statements as questions) read as wavering by Americans;</text><text x="252.5" y="352.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Americans going over Korean counterparts&#x27; heads to their bosses nearly wrecked a</text><text x="252.5" y="374.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">deal</text><path d="M504.1 259.1L989.6 259.3L989.6 410.2L504.4 410.1Z" fill="#d0dfdc" stroke="none"/><path d="M502.7 259.3Q747.3 261.0 991.8 259.3M504.1 259.1Q747.6 262.8 991.2 260.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 259.4Q992.1 335.4 989.4 411.3M990.1 258.9Q990.8 335.2 990.0 411.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 410.6Q747.7 409.2 503.1 409.5M992.5 409.0Q747.7 409.8 502.9 409.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 411.0Q505.9 334.9 506.0 258.7M505.3 410.5Q505.2 334.3 504.6 258.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="319.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Decision-making norms</text><text x="747.5" y="341.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">speed and amount of analysis differ: Koreans reopened points one to three on day</text><text x="747.5" y="363.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">two while the Americans wanted point four</text><path d="M9.5 429.2L989.1 430.5L990.6 549.4L9.8 551.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 429.5Q500.2 426.6 992.4 430.0M7.8 430.6Q500.1 431.6 992.4 430.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 427.6Q990.0 490.1 990.3 552.5M990.0 428.5Q988.4 490.2 990.9 552.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 550.9Q500.1 547.3 8.9 549.2M991.4 549.3Q500.2 546.8 9.0 550.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 552.5Q12.9 490.3 9.3 428.2M9.8 552.3Q12.4 490.3 9.7 428.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="485.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Remedies for decision speed: make minor concessions on process, keep impatient bosses out of meetings and give them brief frequent updates, and say explicitly what you</text><text x="500.0" y="507.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">need (&#x27;we have to see the big picture before we talk details&#x27;).</text></svg>