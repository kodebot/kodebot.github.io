<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Eight preconditions for the shift (most, not all, should be in place) and four leader actions</text><path d="M9.1 89.9L495.2 89.7L495.7 209.7L11.0 209.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 89.3Q252.2 90.9 496.0 89.1M7.7 89.3Q252.1 91.7 496.5 89.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 87.9Q496.5 149.6 494.3 211.3M494.2 88.5Q493.8 149.5 495.4 210.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 209.5Q252.1 210.0 7.9 209.1M495.9 210.2Q251.9 211.3 7.9 210.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 212.1Q12.6 150.5 10.3 88.9M9.8 212.0Q8.3 150.2 9.0 88.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="123.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Preconditions 1 and 2</text><text x="252.5" y="145.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">leaders value varied approaches (a sales firm found its top earners used slow</text><text x="252.5" y="167.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">relationship-building, not cold calls) and persevere through the learning and</text><text x="252.5" y="189.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">challenge</text><path d="M506.1 89.0L990.3 90.4L990.5 208.8L504.4 211.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 89.4Q747.5 91.4 991.6 89.4M504.6 90.2Q747.5 90.6 990.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 149.8 990.3 210.5M991.1 87.5Q988.7 149.0 989.8 210.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 209.6Q747.0 211.6 503.0 210.0M992.1 209.3Q747.7 208.6 503.4 209.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 211.3Q506.9 150.2 505.1 89.1M504.5 212.4Q504.6 150.1 505.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="134.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Preconditions 3 and 4</text><text x="747.5" y="156.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">high performance standards for everyone (no self-fulfilling low expectations) and</text><text x="747.5" y="178.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">support for personal development</text><path d="M9.3 220.1L496.1 220.8L496.1 341.1L9.7 338.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 220.8Q252.1 222.0 495.6 220.5M7.6 220.4Q251.9 222.4 496.1 220.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 218.1Q496.3 279.9 495.5 341.8M495.0 219.0Q495.6 279.8 494.1 340.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 340.4Q253.1 339.3 9.3 339.1M496.7 340.0Q252.5 338.7 8.3 339.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 342.0Q11.4 279.7 10.3 217.5M11.0 341.4Q12.0 280.4 9.0 219.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="264.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Preconditions 5 and 6</text><text x="252.5" y="286.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">openness: tolerance for debate and constructive conflict; people feel valued and</text><text x="252.5" y="308.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">take initiative</text><path d="M504.1 219.1L989.6 219.3L989.6 340.2L504.4 340.1Z" fill="#d0dfdc" stroke="none"/><path d="M502.7 219.3Q747.3 221.0 991.8 219.3M504.1 219.1Q747.6 222.8 991.2 220.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 219.4Q991.9 280.4 989.4 341.3M990.1 218.9Q990.8 280.2 990.0 341.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 340.6Q747.7 339.2 503.1 339.5M992.5 339.0Q747.7 339.8 502.9 339.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 341.0Q505.9 279.9 506.0 218.7M505.3 340.5Q505.2 279.3 504.6 218.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="264.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Preconditions 7 and 8</text><text x="747.5" y="286.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a clear, widely understood mission so debates stay on goals, and an egalitarian,</text><text x="747.5" y="308.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">non-bureaucratic structure that welcomes challenge</text><path d="M9.5 339.2L494.1 340.5L495.6 549.4L9.8 551.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.0 339.5Q252.7 336.6 497.4 340.0M7.8 340.6Q252.6 341.6 497.4 340.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 337.6Q494.9 445.1 495.3 552.5M495.0 338.5Q493.2 445.2 495.9 552.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 550.9Q252.6 547.3 8.9 549.2M496.4 549.3Q252.7 546.8 9.0 550.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 552.5Q13.0 445.3 9.3 338.2M9.8 552.3Q12.6 445.3 9.7 338.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="407.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Four leader actions (1 and 2)</text><text x="252.5" y="429.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">make the mental connection between identity differences and how work gets done (a</text><text x="252.5" y="451.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Mastiff vice president asked why a leader&#x27;s effective community style was not used</text><text x="252.5" y="473.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">at work); legitimate open discussion (a Chinese chemist solved a soup problem using</text><text x="252.5" y="495.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Chinese cooking knowledge but hid the source)</text><path d="M506.0 339.5L990.5 339.4L989.4 551.1L503.8 549.1Z" fill="#d6e1cf" stroke="none"/><path d="M503.7 338.9Q747.1 336.7 990.6 339.7M504.2 340.4Q748.3 339.5 992.4 340.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 338.5Q987.5 445.4 989.0 552.3M990.6 338.4Q991.0 445.1 990.7 551.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 549.2Q747.9 549.3 503.2 550.1M990.6 549.0Q747.5 551.3 504.4 549.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.8 551.2Q506.4 445.2 505.5 339.3M504.9 550.7Q503.2 444.1 503.9 337.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="407.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Four leader actions (3 and 4)</text><text x="747.5" y="429.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">work against dominance and subordination (a CEO opened the strategy conference to a</text><text x="747.5" y="451.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">diagonal slice of the hierarchy; another leader tested his own low assumptions</text><text x="747.5" y="473.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">about inner-city plants); keep organisational trust intact by acknowledging</text><text x="747.5" y="495.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">tensions and resolving them sensitively and swiftly</text></svg>