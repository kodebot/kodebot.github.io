<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="420" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Four rules for using the map (each with a manager&#x27;s story from the article)</text><path d="M9.1 89.9L495.2 89.7L495.7 239.7L11.0 239.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 89.3Q252.2 90.9 496.0 89.1M7.7 89.3Q252.1 91.7 496.5 89.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 87.9Q496.6 164.6 494.3 241.3M494.2 88.5Q493.8 164.5 495.4 240.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 239.5Q252.1 240.0 7.9 239.1M495.9 240.2Q251.9 241.3 7.9 240.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 242.1Q12.7 165.5 10.3 88.9M9.8 242.0Q8.2 165.2 9.0 88.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="149.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1. Don&#x27;t underestimate the challenge</text><text x="252.5" y="171.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">styles are lifelong habits; Carlos, from Mexico, found Dutch colleagues challenging</text><text x="252.5" y="193.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">his process and had to unlearn techniques</text><path d="M506.1 89.0L990.3 90.4L990.5 238.8L504.4 241.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 89.4Q747.5 91.4 991.6 89.4M504.6 90.2Q747.5 90.6 990.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 164.8 990.3 240.5M991.1 87.5Q988.6 164.0 989.8 240.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 239.6Q747.0 241.6 503.0 240.0M992.1 239.3Q747.7 238.6 503.4 239.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 241.3Q507.0 165.2 505.1 89.1M504.5 242.4Q504.6 165.1 505.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="149.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2. Apply multiple perspectives</text><text x="747.5" y="171.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">understand how each culture sees each other culture; a Chinese manager in Mexico</text><text x="747.5" y="193.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">saw the same egalitarianism Carlos saw in the Dutch</text><path d="M9.3 250.1L496.1 250.8L496.1 401.1L9.7 398.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 250.8Q252.1 252.0 495.6 250.5M7.6 250.4Q251.9 252.4 496.1 250.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 248.1Q496.3 324.9 495.5 401.8M495.0 249.0Q495.6 324.8 494.1 400.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 400.4Q253.1 399.3 9.3 399.1M496.7 400.0Q252.5 398.7 8.3 399.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 402.0Q11.5 324.7 10.3 247.5M11.0 401.4Q12.1 325.4 9.0 249.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="309.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3. Find the positive in other approaches</text><text x="252.5" y="331.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Steve, an Australian in China, learned the reciprocal duty of higher-ups to protect</text><text x="252.5" y="353.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">and care; Carlos valued ideas and problems surfaced by challenge</text><path d="M504.1 249.1L989.6 249.3L989.6 400.2L504.4 400.1Z" fill="#d3dbe0" stroke="none"/><path d="M502.7 249.3Q747.3 251.0 991.8 249.3M504.1 249.1Q747.6 252.8 991.2 250.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 249.4Q992.1 325.4 989.4 401.3M990.1 248.9Q990.8 325.2 990.0 401.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 400.6Q747.7 399.2 503.1 399.5M992.5 399.0Q747.7 399.8 502.9 399.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 401.0Q505.9 324.9 506.0 248.7M505.3 400.5Q505.2 324.3 504.6 248.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="309.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">4. Adjust, and readjust, your position</text><text x="747.5" y="331.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Aaron learned to direct more in Russia, then was accused of centralising back home;</text><text x="747.5" y="353.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">widen your comfort zone on all eight scales</text></svg>