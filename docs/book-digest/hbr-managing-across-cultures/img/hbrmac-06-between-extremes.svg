<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="16.0" fill="#3b2f20" text-anchor="middle">Ethics away from home: neither &#x27;do as the Romans do&#x27; nor &#x27;do as at home&#x27;; three guiding principles between two extremes</text><path d="M9.1 89.9L495.2 89.7L495.7 259.7L11.0 259.8Z" fill="#eed5cc" stroke="none"/><path d="M8.4 89.3Q252.2 90.9 496.0 89.1M7.7 89.3Q252.1 91.7 496.5 89.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 87.9Q496.6 174.6 494.3 261.3M494.2 88.5Q493.8 174.5 495.4 260.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 259.5Q252.1 260.0 7.9 259.1M495.9 260.2Q251.9 261.3 7.9 260.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 262.1Q12.7 175.5 10.3 88.9M9.8 262.0Q8.2 175.2 9.0 88.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="148.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Cultural relativism (too lax)</text><text x="252.5" y="170.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">no culture&#x27;s ethics is better; so tolerate everything; fails when harm is large:</text><text x="252.5" y="192.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">toxic PCB barrels unloaded by unprotected workers in Nigeria; SS United States</text><text x="252.5" y="214.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">asbestos removal for under $2 million instead of over $100 million in Sevastopol</text><path d="M506.1 89.0L990.3 90.4L990.5 258.8L504.4 261.1Z" fill="#efe0ca" stroke="none"/><path d="M503.4 89.4Q747.5 91.4 991.6 89.4M504.6 90.2Q747.5 90.6 990.5 90.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 174.8 990.3 260.5M991.1 87.5Q988.6 174.0 989.8 260.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 259.6Q747.0 261.6 503.0 260.0M992.1 259.3Q747.7 258.6 503.4 259.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 261.3Q507.0 175.2 505.1 89.1M504.5 262.4Q504.6 175.1 505.0 87.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="148.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Ethical imperialism (too rigid)</text><text x="747.5" y="170.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">do everywhere as at home; absolutism assumes one list of truths, one set of</text><text x="747.5" y="192.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">concepts, one behaviour; a harassment course in Saudi Arabia was ludicrous; a US</text><text x="747.5" y="214.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">manager&#x27;s report of a thief in China led to execution</text><path d="M9.3 275.1L991.1 275.8L991.1 366.1L9.7 363.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 275.8Q499.6 277.0 990.6 275.5M7.6 275.4Q499.4 277.4 991.1 275.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 273.1Q991.1 319.9 990.5 366.8M990.0 274.0Q990.4 319.8 989.1 365.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 365.4Q500.6 364.3 9.3 364.1M991.7 365.0Q500.0 363.7 8.3 364.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 367.0Q11.2 319.7 10.3 272.5M11.0 366.4Q11.6 320.4 9.0 274.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="326.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Three guiding principles: respect core human values (the absolute threshold), respect local traditions, and believe that context matters in deciding right from wrong</text><path d="M9.1 379.1L494.6 379.3L494.6 550.2L9.4 550.1Z" fill="#d0dfdc" stroke="none"/><path d="M7.7 379.3Q252.3 381.0 496.8 379.3M9.1 379.1Q252.6 382.8 496.2 380.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.0 379.4Q497.1 465.4 494.4 551.3M495.1 378.9Q495.8 465.2 495.0 551.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.4 550.6Q252.7 549.2 8.1 549.5M497.5 549.0Q252.7 549.8 7.9 549.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 551.0Q10.9 464.9 11.0 378.7M10.3 550.5Q10.2 464.3 9.6 378.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="427.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Core human values</text><text x="252.5" y="449.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">three overlapping Western and non-Western values: respect for human dignity,</text><text x="252.5" y="471.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">respect for basic rights, good citizenship; for example dumping pollutants near</text><text x="252.5" y="493.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">homes, child employment that denies basic education, and lying about product</text><text x="252.5" y="515.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">specifications are intolerable</text><path d="M504.5 379.2L989.1 380.5L990.6 549.4L504.8 551.2Z" fill="#d0dfdc" stroke="none"/><path d="M503.0 379.5Q747.7 376.6 992.4 380.0M502.8 380.6Q747.6 381.6 992.4 380.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 377.6Q989.9 465.1 990.3 552.5M990.0 378.5Q988.2 465.2 990.9 552.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 550.9Q747.6 547.3 503.9 549.2M991.4 549.3Q747.7 546.8 504.0 550.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 552.5Q508.0 465.3 504.3 378.2M504.8 552.3Q507.6 465.3 504.7 378.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="438.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Moral free space</text><text x="747.5" y="460.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">a gray zone where practices differ without violating core values and managers chart</text><text x="747.5" y="482.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">their own course; Indian firms promising a child of an employee a job reflect clan</text><text x="747.5" y="504.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">values and unemployment, so the author cannot condemn them for Indians</text></svg>