<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="16.5" fill="#3b2f20" text-anchor="middle">English is now the global language of business: unrestricted multilingualism is inefficient; adopting it is hard and messy</text><path d="M9.1 89.9L495.2 89.7L495.7 239.7L11.0 239.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 89.3Q252.2 90.9 496.0 89.1M7.7 89.3Q252.1 91.7 496.5 89.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 87.9Q496.6 164.6 494.3 241.3M494.2 88.5Q493.8 164.5 495.4 240.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 239.5Q252.1 240.0 7.9 239.1M495.9 240.2Q251.9 241.3 7.9 240.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 242.1Q12.7 165.5 10.3 88.9M9.8 242.0Q8.2 165.2 9.0 88.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="138.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Why English only</text><text x="252.5" y="160.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">competitive pressure (reach customers and suppliers); globalised tasks (a Belgian</text><text x="252.5" y="182.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">needing input from Beirut); cross-border M&amp;A (Aventis chose English over French or</text><text x="252.5" y="204.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">German to avoid favouritism)</text><path d="M506.1 89.0L990.3 90.4L990.5 238.8L504.4 241.1Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 89.4Q747.5 91.4 991.6 89.4M504.6 90.2Q747.5 90.6 990.5 90.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 164.8 990.3 240.5M991.1 87.5Q988.6 164.0 989.8 240.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 239.6Q747.0 241.6 503.0 240.0M992.1 239.3Q747.7 238.6 503.4 239.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 241.3Q507.0 165.2 505.1 89.1M504.5 242.4Q504.6 165.1 505.0 87.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="138.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Rakuten&#x27;s mandate (2010)</text><text x="747.5" y="160.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">CEO Hiroshi Mikitani made English the official language for about 7,100 employees,</text><text x="747.5" y="182.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">with a two-year test or risk of demotion; later half could engage in internal</text><text x="747.5" y="204.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">English and 25 percent used it regularly with foreign colleagues</text><path d="M9.3 250.1L496.1 250.8L496.1 401.1L9.7 398.8Z" fill="#eed5cc" stroke="none"/><path d="M8.5 250.8Q252.1 252.0 495.6 250.5M7.6 250.4Q251.9 252.4 496.1 250.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 248.1Q496.3 324.9 495.5 401.8M495.0 249.0Q495.6 324.8 494.1 400.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 400.4Q253.1 399.3 9.3 399.1M496.7 400.0Q252.5 398.7 8.3 399.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 402.0Q11.5 324.7 10.3 247.5M11.0 401.4Q12.1 325.4 9.0 249.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="298.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Costs found in the research</text><text x="252.5" y="320.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">shock (translator headsets felt humiliating), spotty compliance (a German-language</text><text x="252.5" y="342.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">crisis call while India waited), eroding self-confidence, job insecurity,</text><text x="252.5" y="364.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">resistance, people going silent, lost documentation</text><path d="M504.1 249.1L989.6 249.3L989.6 400.2L504.4 400.1Z" fill="#efe0ca" stroke="none"/><path d="M502.7 249.3Q747.3 251.0 991.8 249.3M504.1 249.1Q747.6 252.8 991.2 250.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 249.4Q992.1 325.4 989.4 401.3M990.1 248.9Q990.8 325.2 990.0 401.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 400.6Q747.7 399.2 503.1 399.5M992.5 399.0Q747.7 399.8 502.9 399.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 401.0Q505.9 324.9 506.0 248.7M505.3 400.5Q505.2 324.3 504.6 248.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="298.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Numbers in the article</text><text x="747.5" y="320.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">about 3,500 words move a learner from beginner to advanced; about 10,000 more reach</text><text x="747.5" y="342.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">native; 3,000 to 5,000 words are enough for most work; 70 percent of GlobalTech</text><text x="747.5" y="364.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">employees were still frustrated after two years</text><path d="M9.5 404.2L989.1 405.5L990.6 549.4L9.8 551.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 404.5Q500.2 401.6 992.4 405.0M7.8 405.6Q500.1 406.6 992.4 405.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 402.6Q989.9 477.6 990.3 552.5M990.0 403.5Q988.2 477.7 990.9 552.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 550.9Q500.1 547.3 8.9 549.2M991.4 549.3Q500.2 546.8 9.0 550.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 552.5Q13.0 477.8 9.3 403.2M9.8 552.3Q12.6 477.8 9.7 403.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="461.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Four implementation tips: involve all employees (explain why, offer support), managers act as referees and enforcers, native speakers level the playing field (speak</text><text x="500.0" y="483.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">slower, simplify vocabulary, avoid dominating, draw others in), non-native speakers comply and do not retreat into their mother tongue or exclude others (for example</text><text x="500.0" y="505.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">scheduling meetings at awkward hours).</text></svg>