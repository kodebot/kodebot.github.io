<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="420" fill="#fbf7ef"/><path d="M21.1 20.0L490.3 20.4L488.9 110.3L20.7 109.2Z" fill="#eed5cc" stroke="none"/><path d="M18.5 20.0Q255.1 20.0 491.8 19.6M19.5 20.4Q255.5 19.6 491.5 20.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 18.3Q489.5 64.7 490.0 111.2M489.9 17.9Q491.5 64.5 490.3 111.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 109.4Q255.1 112.2 18.7 109.5M491.4 109.7Q254.6 108.2 17.8 110.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 111.0Q20.1 64.3 20.1 17.7M20.2 110.9Q18.7 65.1 19.1 19.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="49.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Whole order (Fig 1-13)</text><text x="255.0" y="71.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Order Processing sends everything; Warehouse then</text><text x="255.0" y="93.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">calls Customer for the address; card details exposed</text><path d="M509.1 19.9L980.2 19.7L980.7 109.7L511.0 109.8Z" fill="#d6e1cf" stroke="none"/><path d="M508.4 19.3Q744.7 20.9 981.0 19.1M507.7 19.3Q744.6 21.7 981.5 19.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 17.9Q981.2 64.6 979.3 111.3M979.2 18.5Q979.0 64.5 980.4 110.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 109.5Q744.6 110.0 507.9 109.1M980.9 110.2Q744.4 111.3 507.9 110.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.2 112.1Q512.2 65.5 510.3 18.9M509.8 112.0Q508.5 65.2 509.0 18.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="49.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Pick Instruction (Fig 1-14)</text><text x="745.0" y="71.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">only what the warehouse needs: what to pack</text><text x="745.0" y="93.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and where to send; invoice as a rendered PDF</text><path d="M21.1 134.0L490.3 135.4L490.5 223.8L19.4 226.1Z" fill="#d6e1cf" stroke="none"/><path d="M18.4 134.4Q255.0 136.4 491.6 134.4M19.6 135.2Q255.0 135.6 490.5 135.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.9 134.2Q491.6 179.8 490.3 225.5M491.1 132.5Q489.1 179.0 489.8 225.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.1 224.6Q254.5 226.6 18.0 225.0M492.1 224.3Q255.2 223.6 18.4 224.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.6 226.3Q21.6 180.2 20.1 134.1M19.5 227.4Q19.6 180.1 20.0 132.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="164.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Richer Pick Instruction (Fig 1-15)</text><text x="255.0" y="186.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">includes the customer details too, so Warehouse</text><text x="255.0" y="208.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">need not call Customer at all</text><path d="M509.3 135.1L981.1 135.8L981.1 226.1L509.7 223.8Z" fill="#d0dfdc" stroke="none"/><path d="M508.5 135.8Q744.6 137.0 980.6 135.5M507.6 135.4Q744.4 137.4 981.1 135.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 133.1Q981.1 179.9 980.5 226.8M980.0 134.0Q980.4 179.8 979.1 225.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 225.4Q745.6 224.3 509.3 224.1M981.7 225.0Q745.0 223.7 508.3 224.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.9 227.0Q511.2 179.7 510.3 132.5M511.0 226.4Q511.6 180.4 509.0 134.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="164.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event (Fig 1-16)</text><text x="745.0" y="186.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Order Processing emits an event; Warehouse listens,</text><text x="745.0" y="208.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">so the dependency is flipped</text><path d="M19.1 249.1L979.6 249.3L979.6 390.2L19.4 390.1Z" fill="#f1ede5" stroke="none"/><path d="M17.7 249.3Q499.8 251.0 981.8 249.3M19.1 249.1Q500.1 252.8 981.2 250.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.0 249.4Q982.1 320.4 979.4 391.3M980.1 248.9Q980.8 320.2 980.0 391.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.4 390.6Q500.2 389.2 18.1 389.5M982.5 389.0Q500.2 389.8 17.9 389.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 391.0Q20.9 319.9 21.0 248.7M20.3 390.5Q20.2 319.3 19.6 248.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="293.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Domain coupling cannot be removed: some order information must reach the warehouse.</text><text x="500.0" y="315.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Share only what is needed (information hiding). Which of the API call or the event is better depends on a wider</text><text x="500.0" y="337.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">understanding of the interactions, which domain modelling helps with. Order Processing already needs customer</text><text x="500.0" y="359.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">information for other reasons, so building the instruction there adds little cost.</text></svg>