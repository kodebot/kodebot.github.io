<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M21.1 20.0L320.3 20.4L318.9 200.3L20.7 199.2Z" fill="#eed5cc" stroke="none"/><path d="M18.5 20.0Q170.1 20.0 321.8 19.6M19.5 20.4Q170.5 19.6 321.5 20.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.8 18.3Q319.2 109.7 320.0 201.2M319.9 17.9Q321.9 109.5 320.3 201.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.5 199.4Q170.1 202.2 18.7 199.5M321.4 199.7Q169.6 198.2 17.8 200.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 201.0Q20.0 109.3 20.1 17.7M20.2 200.9Q18.5 110.1 19.1 19.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Single-process monolith</text><text x="170.0" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Fig 1-6)</text><text x="170.0" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">all code in one process;</text><text x="170.0" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">usually still talks to</text><text x="170.0" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a database</text><path d="M349.1 19.9L650.2 19.7L650.7 199.7L351.0 199.8Z" fill="#efe0ca" stroke="none"/><path d="M348.4 19.3Q499.7 20.9 651.0 19.1M347.7 19.3Q499.6 21.7 651.5 19.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.9 17.9Q651.6 109.6 649.3 201.3M649.2 18.5Q648.8 109.5 650.4 200.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.3 199.5Q499.6 200.0 347.9 199.1M650.9 200.2Q499.4 201.3 347.9 200.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M350.2 202.1Q352.7 110.5 350.3 18.9M349.8 202.0Q348.2 110.2 349.0 18.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Modular monolith</text><text x="500.0" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Fig 1-7)</text><text x="500.0" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">separate modules in one</text><text x="500.0" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">process; parallel work,</text><text x="500.0" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one deployment</text><path d="M681.1 19.0L980.3 20.4L980.5 198.8L679.4 201.1Z" fill="#d6e1cf" stroke="none"/><path d="M678.4 19.4Q830.0 21.4 981.6 19.4M679.6 20.2Q830.0 20.6 980.5 20.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 19.2Q981.9 109.8 980.3 200.5M981.1 17.5Q978.6 109.0 979.8 200.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 199.6Q829.5 201.6 678.0 200.0M982.1 199.3Q830.2 198.6 678.4 199.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M680.6 201.3Q682.0 110.2 680.1 19.1M679.5 202.4Q679.6 110.1 680.0 17.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Modular monolith with</text><text x="830.0" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">decomposed database</text><text x="830.0" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Fig 1-8)</text><text x="830.0" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">DB split along module</text><text x="830.0" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">lines; hard to retrofit</text><path d="M19.3 225.1L981.1 225.8L981.1 296.1L19.7 293.8Z" fill="#f1ede5" stroke="none"/><path d="M18.5 225.8Q499.6 227.0 980.6 225.5M17.6 225.4Q499.4 227.4 981.1 225.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 223.1Q980.9 259.9 980.5 296.8M980.0 224.0Q980.3 259.8 979.1 295.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 295.4Q500.6 294.3 19.3 294.1M981.7 295.0Q500.0 293.7 18.3 294.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 297.0Q21.0 259.7 20.3 222.5M21.0 296.4Q21.4 260.4 19.0 224.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="255.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Also named as monoliths: the distributed monolith (deployed together despite many services)</text><text x="500.0" y="277.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and third-party black-box systems (payroll, CRM, HR, SaaS) whose code you cannot change</text></svg>