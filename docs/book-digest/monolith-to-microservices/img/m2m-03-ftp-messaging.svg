<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 20.0L990.3 20.4L988.9 120.3L10.7 119.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 20.0Q500.1 20.0 991.8 19.6M9.5 20.4Q500.5 19.6 991.5 20.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 18.3Q989.4 69.7 990.0 121.2M989.9 17.9Q991.6 69.5 990.3 121.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 119.4Q500.1 122.2 8.7 119.5M991.4 119.7Q499.6 118.2 7.8 120.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 121.0Q10.1 69.3 10.1 17.7M10.2 120.9Q8.7 70.1 9.1 19.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="65.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">FTP (Fig 3-15), Homegate: customers still upload by FTP; uploads are detected from the FTP server log and sent through an adapter</text><text x="500.0" y="87.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">to a new REST-based listings service; both paths ran in parallel, so customers saw the same process but listings went live faster</text><path d="M9.1 139.9L495.2 139.7L495.7 269.7L11.0 269.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 139.3Q252.2 140.9 496.0 139.1M7.7 139.3Q252.1 141.7 496.5 139.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 137.9Q496.6 204.6 494.3 271.3M494.2 138.5Q493.8 204.5 495.4 270.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 269.5Q252.1 270.0 7.9 269.1M495.9 270.2Q251.9 271.3 7.9 270.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 272.1Q12.7 205.5 10.3 138.9M9.8 272.0Q8.2 205.2 9.0 138.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="178.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Content-based router (Fig 3-16, 3-17)</text><text x="252.5" y="200.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">intercept all queue messages and forward each to the</text><text x="252.5" y="222.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">monolith or the new service; monolith untouched, but</text><text x="252.5" y="244.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">adds a queue, latency and a smart pipe</text><path d="M506.1 139.0L990.3 140.4L990.5 268.8L504.4 271.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 139.4Q747.5 141.4 991.6 139.4M504.6 140.2Q747.5 140.6 990.5 140.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 139.2Q991.9 204.8 990.3 270.5M991.1 137.5Q988.6 204.0 989.8 270.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 269.6Q747.0 271.6 503.0 270.0M992.1 269.3Q747.7 268.6 503.4 269.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 271.3Q507.0 205.2 505.1 139.1M504.5 272.4Q504.6 205.1 505.0 137.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="178.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Selective consumption (Fig 3-18)</text><text x="747.5" y="200.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">monolith and service share the queue and each</text><text x="747.5" y="222.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">filters (for example a JMS message selector);</text><text x="747.5" y="244.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">needs two coordinated changes to cut over or back</text><path d="M9.3 295.1L991.1 295.8L991.1 411.1L9.7 408.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 295.8Q499.6 297.0 990.6 295.5M7.6 295.4Q499.4 297.4 991.1 295.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 293.1Q991.2 352.4 990.5 411.8M990.0 294.0Q990.5 352.3 989.1 410.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 410.4Q500.6 409.3 9.3 409.1M991.7 410.0Q500.0 408.7 8.3 409.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 412.0Q11.4 352.2 10.3 292.5M11.0 411.4Q11.9 352.9 9.0 294.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="336.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">Risks of selective consumption: overlapping rules deliver a message twice, gaps drop it; keep it to few consumers and simple rules.</text><text x="500.0" y="358.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">Async request-response needs a route back to the client. Other protocols: for batch file upload, intercept the file,</text><text x="500.0" y="380.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">extract the calls you want and forward the rest. See Enterprise Integration Patterns.</text></svg>