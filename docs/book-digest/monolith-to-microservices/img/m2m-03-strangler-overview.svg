<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="420" fill="#fbf7ef"/><path d="M11.1 20.0L320.3 20.4L318.9 120.3L10.7 119.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 20.0Q165.1 20.0 321.8 19.6M9.5 20.4Q165.5 19.6 321.5 20.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.8 18.3Q319.4 69.7 320.0 121.2M319.9 17.9Q321.6 69.5 320.3 121.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.5 119.4Q165.1 122.2 8.7 119.5M321.4 119.7Q164.6 118.2 7.8 120.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 121.0Q10.1 69.3 10.1 17.7M10.2 120.9Q8.7 70.1 9.1 19.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="165.0" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1 Identify</text><text x="165.0" y="76.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the part of the monolith</text><text x="165.0" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">to migrate</text><path d="M319.2 69.9Q329.7 70.5 340.1 69.7M319.7 70.9Q329.7 69.6 339.8 69.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.8 69.6Q334.6 67.1 329.7 64.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.0 69.8Q335.0 72.9 329.7 75.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.2 19.8L649.2 19.1L649.9 120.4L339.0 120.4Z" fill="#d0dfdc" stroke="none"/><path d="M338.3 19.5Q494.6 18.6 650.9 19.1M337.9 20.2Q494.4 19.3 650.9 20.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M650.2 19.1Q648.3 70.5 650.3 121.9M649.8 19.0Q650.4 70.2 649.0 121.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M652.5 119.1Q495.7 118.3 338.8 120.3M650.4 119.4Q495.0 121.5 339.5 119.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.1 120.9Q340.9 70.2 340.7 19.6M339.0 121.6Q341.3 70.5 340.1 19.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="495.0" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2 Implement</text><text x="495.0" y="76.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the functionality in</text><text x="495.0" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a new microservice</text><path d="M650.3 69.0Q660.0 69.0 669.6 71.1M649.8 69.0Q660.2 68.9 670.6 69.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.7 70.0Q664.3 67.6 659.0 64.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.0 69.8Q664.8 72.9 659.5 75.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.1 20.7L980.6 19.5L981.0 120.0L669.2 119.9Z" fill="#d6e1cf" stroke="none"/><path d="M667.9 20.1Q825.2 23.4 982.5 20.7M669.5 19.8Q824.9 22.3 980.4 20.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.1 19.0Q978.9 69.8 980.4 120.6M979.6 19.1Q981.2 70.3 980.6 121.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 120.3Q825.0 118.8 668.1 120.0M980.6 119.2Q824.4 118.6 668.1 120.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.8 120.6Q670.5 69.6 670.2 18.7M669.8 120.9Q671.4 69.6 670.4 18.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="825.0" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3 Redirect</text><text x="825.0" y="76.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">calls from the monolith</text><text x="825.0" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">to the microservice</text><path d="M10.3 148.9L495.5 151.1L494.9 258.9L11.1 260.8Z" fill="#d6e1cf" stroke="none"/><path d="M7.6 149.1Q251.9 148.1 496.2 149.3M8.7 149.5Q252.6 147.3 496.6 149.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.3 147.8Q497.8 205.0 495.6 262.1M494.7 149.1Q493.0 205.3 496.0 261.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 259.8Q251.8 258.9 7.7 260.1M496.5 260.1Q252.4 258.6 8.2 260.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.6 261.0Q7.4 205.3 10.3 149.5M9.4 261.4Q8.4 205.4 9.9 149.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="178.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Works well (Fig 3-2, 3-3)</text><text x="252.5" y="200.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">end-to-end slice (Inventory Management), or a shallow</text><text x="252.5" y="222.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">extraction (Payroll) where the monolith still exposes</text><text x="252.5" y="244.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">User Notifications to the new service</text><path d="M506.1 150.2L990.0 150.3L988.9 259.6L504.4 260.1Z" fill="#eed5cc" stroke="none"/><path d="M503.0 149.3Q746.9 151.4 990.7 150.4M502.9 149.9Q747.7 148.3 992.6 149.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 148.5Q988.4 204.7 988.9 260.8M990.9 148.7Q993.0 205.6 990.4 262.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.8 261.0Q747.8 260.6 503.8 260.0M992.4 260.5Q748.3 257.7 504.3 259.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.4 260.7Q503.9 204.5 506.0 148.4M505.5 261.9Q508.3 205.6 506.0 149.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="178.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Does not work well (Fig 3-4)</text><text x="747.5" y="200.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">functionality deep inside, fired by many inbound calls</text><text x="747.5" y="222.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Notifications): calls cannot be redirected from outside;</text><text x="747.5" y="244.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">use branch by abstraction instead</text><path d="M9.3 284.6L991.1 284.7L990.9 394.7L9.8 396.1Z" fill="#f1ede5" stroke="none"/><path d="M9.4 284.5Q500.7 282.8 992.0 284.5M9.5 283.9Q500.1 281.4 990.6 285.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.1 283.2Q988.0 340.2 989.1 397.2M990.9 284.3Q990.3 340.0 989.6 395.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.5 395.8Q499.8 396.1 9.1 395.6M992.2 395.4Q500.3 398.2 8.4 396.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.7 396.6Q7.3 339.6 10.1 282.6M10.9 396.1Q9.3 339.7 9.3 283.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="324.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Until calls are redirected the new service is deployed but not released: separate deployment from release.</text><text x="500.0" y="346.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Easy rollback: switch the redirect back. Needs a clear mapping from inbound call to the asset; HTTP redirects easily,</text><text x="500.0" y="368.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">some RPC protocols do not. The more the proxy must understand or transform, the less viable the pattern.</text></svg>