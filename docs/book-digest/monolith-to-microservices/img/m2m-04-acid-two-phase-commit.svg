<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 135.3L10.7 134.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.3 74.7 495.0 136.2M494.9 12.9Q496.8 74.5 495.3 136.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 134.4Q252.6 137.2 8.7 134.5M496.4 134.7Q252.1 133.2 7.8 135.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 136.0Q10.0 74.3 10.1 12.7M10.2 135.9Q8.6 75.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">One ACID transaction (Fig 4-46)</text><text x="252.5" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">set Customer status to VERIFIED and delete the</text><text x="252.5" y="92.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">PendingEnrollments row: both or neither</text><text x="252.5" y="114.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">atomicity, consistency, isolation, durability</text><path d="M504.1 14.9L990.2 14.7L990.7 134.7L506.0 134.8Z" fill="#eed5cc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.5 74.6 989.3 136.3M989.2 13.5Q988.8 74.5 990.4 135.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 134.5Q747.1 135.0 502.9 134.1M990.9 135.2Q746.9 136.3 502.9 135.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 137.1Q507.6 75.5 505.3 13.9M504.8 137.0Q503.3 75.2 504.0 13.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Two databases (Fig 4-47)</text><text x="747.5" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">two separate transactions, each can fail</text><text x="747.5" y="92.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">alone; sequencing helps but atomicity of the</text><text x="747.5" y="114.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">whole is lost</text><path d="M11.1 149.0L495.3 150.4L495.5 268.8L9.4 271.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 149.4Q252.5 151.4 496.6 149.4M9.6 150.2Q252.5 150.6 495.5 150.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 149.2Q496.9 209.8 495.3 270.5M496.1 147.5Q493.7 209.0 494.8 270.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 269.6Q252.0 271.6 8.0 270.0M497.1 269.3Q252.7 268.6 8.4 269.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 271.3Q11.9 210.2 10.1 149.1M9.5 272.4Q9.6 210.1 10.0 147.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="183.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Two-phase commit: phase 1 (Fig 4-48)</text><text x="252.5" y="205.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">coordinator asks each worker to vote;</text><text x="252.5" y="227.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a yes promises the change later, usually by</text><text x="252.5" y="249.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">locking the record</text><path d="M504.3 150.1L991.1 150.8L991.1 271.1L504.7 268.8Z" fill="#efe0ca" stroke="none"/><path d="M503.5 150.8Q747.1 152.0 990.6 150.5M502.6 150.4Q746.9 152.4 991.1 150.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 148.1Q991.3 209.9 990.5 271.8M990.0 149.0Q990.6 209.8 989.1 270.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 270.4Q748.1 269.3 504.3 269.1M991.7 270.0Q747.5 268.7 503.3 269.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 272.0Q506.4 209.7 505.3 147.5M506.0 271.4Q507.0 210.4 504.0 149.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="183.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Phase 2 (Fig 4-49)</text><text x="747.5" y="205.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">all yes: commit and release locks; any no:</text><text x="747.5" y="227.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">roll back. Commits are not simultaneous, so</text><text x="747.5" y="249.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">isolation is lost and failures are hard</text><path d="M9.1 289.1L989.6 289.3L989.6 390.2L9.4 390.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 289.3Q499.8 291.0 991.8 289.3M9.1 289.1Q500.1 292.8 991.2 290.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 289.4Q991.7 340.4 989.4 391.3M990.1 288.9Q990.7 340.2 990.0 391.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 390.6Q500.2 389.2 8.1 389.5M992.5 389.0Q500.2 389.8 7.9 389.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 391.0Q10.9 339.9 11.0 288.7M10.3 390.5Q10.2 339.3 9.6 288.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="335.0" font-size="16.0" fill="#3b2f20" text-anchor="middle">Newman: avoid distributed transactions. Better options: keep the data together (do not split what needs atomicity yet),</text><text x="500.0" y="357.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or use a saga. Locks across services lengthen latency; the longer the operation, the longer resources stay locked.</text></svg>