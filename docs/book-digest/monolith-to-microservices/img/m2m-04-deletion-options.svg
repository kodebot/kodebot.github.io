<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 145.3L10.7 144.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 79.7 330.0 146.2M329.9 12.9Q331.9 79.5 330.3 146.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 144.4Q170.1 147.2 8.7 144.5M331.4 144.7Q169.6 143.2 7.8 145.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Check before deleting</text><text x="170.0" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">ask Finance if it uses SKU 683:</text><text x="170.0" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">racy, needs locks, creates a reverse</text><text x="170.0" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">dependency. Do not.</text><path d="M339.1 14.9L660.2 14.7L660.7 144.7L341.0 144.8Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 79.6 659.3 146.3M659.2 13.5Q658.8 79.5 660.4 145.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 144.5Q499.6 145.0 337.9 144.1M660.9 145.2Q499.4 146.3 337.9 145.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 147.1Q342.7 80.5 340.3 13.9M339.8 147.0Q338.2 80.2 339.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Handle deletion gracefully</text><text x="500.0" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">report &#x27;album information not</text><text x="500.0" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">available&#x27;; return 410 GONE, not 404;</text><text x="500.0" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or copy data on a delete event</text><path d="M671.1 14.0L990.3 15.4L990.5 143.8L669.4 146.1Z" fill="#d6e1cf" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 79.8 990.3 145.5M991.1 12.5Q988.6 79.0 989.8 145.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 144.6Q829.5 146.6 668.0 145.0M992.1 144.3Q830.2 143.6 668.4 144.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 146.3Q672.0 80.2 670.1 14.1M669.5 147.4Q669.6 80.1 670.0 12.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Do not allow deletion</text><text x="830.0" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">soft delete with a status column</text><text x="830.0" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or a graveyard table; the record can</text><text x="830.0" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">still be requested</text><path d="M9.3 165.1L991.1 165.8L991.1 266.1L9.7 263.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 165.8Q499.6 167.0 990.6 165.5M7.6 165.4Q499.4 167.4 991.1 165.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 163.1Q991.1 214.9 990.5 266.8M990.0 164.0Q990.4 214.8 989.1 265.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 265.4Q500.6 264.3 9.3 264.1M991.7 265.0Q500.0 263.7 8.3 264.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 267.0Q11.2 214.7 10.3 162.5M11.0 266.4Q11.7 215.4 9.0 164.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="210.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Newman&#x27;s choice here: do not delete album records and also make Finance cope with a missing record</text><text x="500.0" y="232.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(a Catalog restored from an earlier state could lose it), so it does not fall over.</text></svg>