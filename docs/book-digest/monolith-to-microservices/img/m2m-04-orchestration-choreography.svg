<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 155.3L10.7 154.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 84.7 495.0 156.2M494.9 12.9Q496.9 84.5 495.3 156.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 154.4Q252.6 157.2 8.7 154.5M496.4 154.7Q252.1 153.2 7.8 155.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 156.0Q10.0 84.3 10.1 12.7M10.2 155.9Q8.5 85.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="47.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Orchestrated saga (Fig 4-54)</text><text x="252.5" y="69.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">an Order Processor tells each service what to do</text><text x="252.5" y="91.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and handles failure: visible process, easier tracking;</text><text x="252.5" y="113.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">but domain coupling, and logic can drift into the</text><text x="252.5" y="135.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">orchestrator (anaemic services)</text><path d="M504.1 14.9L990.2 14.7L990.7 154.7L506.0 154.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 84.6 989.3 156.3M989.2 13.5Q988.8 84.5 990.4 155.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 154.5Q747.1 155.0 502.9 154.1M990.9 155.2Q746.9 156.3 502.9 155.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 157.1Q507.7 85.5 505.3 13.9M504.8 157.0Q503.2 85.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="47.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Choreographed saga (Fig 4-55)</text><text x="747.5" y="69.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">services react to events (Order Placed, Insufficient</text><text x="747.5" y="91.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Stock) through a broker and topics; loose coupling,</text><text x="747.5" y="113.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">no central logic; hard to see the process: add a</text><text x="747.5" y="135.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">correlation ID and a service that projects saga state</text><path d="M11.1 169.0L990.3 170.4L990.5 268.8L9.4 271.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 169.4Q500.0 171.4 991.6 169.4M9.6 170.2Q500.0 170.6 990.5 170.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 169.2Q991.7 219.8 990.3 270.5M991.1 167.5Q989.0 219.0 989.8 270.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 269.6Q499.5 271.6 8.0 270.0M992.1 269.3Q500.2 268.6 8.4 269.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 271.3Q11.7 220.2 10.1 169.1M9.5 272.4Q9.6 220.1 10.0 167.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="215.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Choose: relaxed about orchestration when one team owns the whole saga; prefer choreography when several teams are involved.</text><text x="500.0" y="237.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">Different orchestrators for different flows avoid centralising everything; mixing styles is fine, but keep a clear view of what happened.</text><path d="M9.3 285.1L991.1 285.8L991.1 386.1L9.7 383.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 285.8Q499.6 287.0 990.6 285.5M7.6 285.4Q499.4 287.4 991.1 285.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 283.1Q991.1 334.9 990.5 386.8M990.0 284.0Q990.4 334.8 989.1 385.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 385.4Q500.6 384.3 9.3 384.1M991.7 385.0Q500.0 383.7 8.3 384.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 387.0Q11.2 334.7 10.3 282.5M11.0 386.4Q11.7 335.4 9.0 284.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="330.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">BPM tools: Newman dislikes them (non-developers rarely define the process; GUI-based, hard to version or test); use code, and project a visual view from code.</text><text x="500.0" y="352.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">Camunda and Zeebe are developer-oriented orchestration frameworks. Pat Helland: with distributed transactions adding an engine lowers availability.</text></svg>