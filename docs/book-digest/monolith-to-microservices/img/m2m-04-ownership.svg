<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="360" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 145.3L10.7 144.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 79.7 495.0 146.2M494.9 12.9Q496.9 79.5 495.3 146.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 144.4Q252.6 147.2 8.7 144.5M496.4 144.7Q252.1 143.2 7.8 145.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Aggregate exposing monolith (4-8, 4-9)</text><text x="252.5" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the monolith exposes Employee data through an</text><text x="252.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">API or event stream; the Invoice service calls it;</text><text x="252.5" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the endpoint may become an Employee service</text><path d="M504.1 14.9L990.2 14.7L990.7 144.7L506.0 144.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 79.6 989.3 146.3M989.2 13.5Q988.8 79.5 990.4 145.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 144.5Q747.1 145.0 502.9 144.1M990.9 145.2Q746.9 146.3 502.9 145.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 147.1Q507.7 80.5 505.3 13.9M504.8 147.0Q503.2 80.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Change data ownership (4-10, 4-11)</text><text x="747.5" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">invoice data moves into the Invoice service;</text><text x="747.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the monolith calls the service, or for reads only</text><text x="747.5" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">gets a view projected from the service&#x27;s database</text><path d="M11.1 164.0L990.3 165.4L990.5 273.8L9.4 276.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 164.4Q500.0 166.4 991.6 164.4M9.6 165.2Q500.0 165.6 990.5 165.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 164.2Q991.8 219.8 990.3 275.5M991.1 162.5Q988.9 219.0 989.8 275.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 274.6Q499.5 276.6 8.0 275.0M992.1 274.3Q500.2 273.6 8.4 274.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 276.3Q11.8 220.2 10.1 164.1M9.5 277.4Q9.6 220.1 10.0 162.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="204.0" font-size="15.5" fill="#3b2f20" text-anchor="middle">Treat the monolith&#x27;s aggregate as state plus allowed transitions, not as a database wrapper. Moving data raises foreign-key,</text><text x="500.0" y="226.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">transaction and join problems (later in the chapter). Prefer calling the new service over a view.</text><text x="500.0" y="248.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Use a view or change data capture only if the monolith cannot be changed.</text></svg>