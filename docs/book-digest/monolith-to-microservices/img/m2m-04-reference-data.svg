<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="440" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 135.3L10.7 134.2Z" fill="#efe0ca" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.3 74.7 495.0 136.2M494.9 12.9Q496.8 74.5 495.3 136.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 134.4Q252.6 137.2 8.7 134.5M496.4 134.7Q252.1 133.2 7.8 135.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 136.0Q10.0 74.3 10.1 12.7M10.2 135.9Q8.6 75.1 9.1 14.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Duplicate the data (4-40)</text><text x="252.5" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">each service has its own country codes;</text><text x="252.5" y="92.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fine if used only locally; worry if both</text><text x="252.5" y="114.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">sides must agree</text><path d="M504.1 14.9L990.2 14.7L990.7 134.7L506.0 134.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.5 74.6 989.3 136.3M989.2 13.5Q988.8 74.5 990.4 135.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 134.5Q747.1 135.0 502.9 134.1M990.9 135.2Q746.9 136.3 502.9 135.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 137.1Q507.6 75.5 505.3 13.9M504.8 137.0Q503.3 75.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Dedicated schema (4-41)</text><text x="747.5" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one reference-data schema as a versioned</text><text x="747.5" y="92.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">interface; allows joins on one engine;</text><text x="747.5" y="114.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">breaking changes hurt</text><path d="M11.1 144.0L495.3 145.4L495.5 263.8L9.4 266.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 144.4Q252.5 146.4 496.6 144.4M9.6 145.2Q252.5 145.6 495.5 145.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 144.2Q496.9 204.8 495.3 265.5M496.1 142.5Q493.7 204.0 494.8 265.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 264.6Q252.0 266.6 8.0 265.0M497.1 264.3Q252.7 263.6 8.4 264.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 266.3Q11.9 205.2 10.1 144.1M9.5 267.4Q9.6 205.1 10.0 142.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="178.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Static library (4-42, 4-43)</text><text x="252.5" y="200.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">codes in a shared library or config file;</text><text x="252.5" y="222.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">small, rarely changing data; versions</text><text x="252.5" y="244.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">may differ between services</text><path d="M504.3 145.1L991.1 145.8L991.1 266.1L504.7 263.8Z" fill="#d3dbe0" stroke="none"/><path d="M503.5 145.8Q747.1 147.0 990.6 145.5M502.6 145.4Q746.9 147.4 991.1 145.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 143.1Q991.3 204.9 990.5 266.8M990.0 144.0Q990.6 204.8 989.1 265.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 265.4Q748.1 264.3 504.3 264.1M991.7 265.0Q747.5 263.7 503.3 264.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 267.0Q506.4 204.7 505.3 142.5M506.0 266.4Q507.0 205.4 504.0 144.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="178.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Dedicated service (4-44, 4-45)</text><text x="747.5" y="200.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">country code service holding data in memory;</text><text x="747.5" y="222.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">cache with TTL or update events; cost is the</text><text x="747.5" y="244.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">price of making a new service</text><path d="M9.1 269.1L989.6 269.3L989.6 430.2L9.4 430.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 269.3Q499.8 271.0 991.8 269.3M9.1 269.1Q500.1 272.8 991.2 270.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 269.4Q992.1 350.4 989.4 431.3M990.1 268.9Q990.8 350.2 990.0 431.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 430.6Q500.2 429.2 8.1 429.5M992.5 429.0Q500.2 429.8 7.9 429.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 431.0Q10.9 349.9 11.0 268.7M10.3 430.5Q10.2 349.3 9.6 268.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="323.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">Newman&#x27;s choice: if consistency across services is not needed at all times, a shared library (small, simple data such as country codes or sizes).</text><text x="500.0" y="345.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">Larger or more complex data: a local database in each service. If the data must be consistent, a dedicated service (or part of a bigger reference-data</text><text x="500.0" y="367.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">service); a dedicated schema only if a new service is hard to justify. Sharing libraries needs lead time for changes (Stitch Fix: adding a colour).</text><text x="500.0" y="389.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Books: Refactoring Databases (Ambler and Sadalage).</text></svg>