<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 145.3L10.7 144.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 79.7 495.0 146.2M494.9 12.9Q496.9 79.5 495.3 146.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 144.4Q252.6 147.2 8.7 144.5M496.4 144.7Q252.1 143.2 7.8 145.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Shared database (Fig 4-1)</text><text x="252.5" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">several services read and write one</text><text x="252.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">schema: you cannot hide anything,</text><text x="252.5" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">logic is spread, cohesion is low</text><path d="M504.1 14.9L990.2 14.7L990.7 144.7L506.0 144.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 79.6 989.3 146.3M989.2 13.5Q988.8 79.5 990.4 145.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 144.5Q747.1 145.0 502.9 144.1M990.9 145.2Q746.9 146.3 502.9 145.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 147.1Q507.7 80.5 505.3 13.9M504.8 147.0Q503.2 80.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Database view (Fig 4-3, 4-4)</text><text x="747.5" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a read-only projection of the schema,</text><text x="747.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">for example customer ID and loyalty ID;</text><text x="747.5" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">same engine; owner keeps it current</text><path d="M11.1 154.0L495.3 155.4L495.5 283.8L9.4 286.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 154.4Q252.5 156.4 496.6 154.4M9.6 155.2Q252.5 155.6 495.5 155.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 154.2Q496.9 219.8 495.3 285.5M496.1 152.5Q493.6 219.0 494.8 285.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 284.6Q252.0 286.6 8.0 285.0M497.1 284.3Q252.7 283.6 8.4 284.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 286.3Q12.0 220.2 10.1 154.1M9.5 287.4Q9.6 220.1 10.0 152.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="193.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Database wrapping service (4-5, 4-6)</text><text x="252.5" y="215.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">hide the schema behind a thin service;</text><text x="252.5" y="237.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the Entitlements example at a bank;</text><text x="252.5" y="259.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">can take writes and richer projections</text><path d="M504.3 155.1L991.1 155.8L991.1 286.1L504.7 283.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.5 155.8Q747.1 157.0 990.6 155.5M502.6 155.4Q746.9 157.4 991.1 155.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 153.1Q991.3 219.9 990.5 286.8M990.0 154.0Q990.6 219.8 989.1 285.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 285.4Q748.1 284.3 504.3 284.1M991.7 285.0Q747.5 283.7 503.3 284.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 287.0Q506.5 219.7 505.3 152.5M506.0 286.4Q507.1 220.4 504.0 154.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="193.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Database as a service interface (4-7)</text><text x="747.5" y="215.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a separate read-only database fed by a</text><text x="747.5" y="237.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">mapping engine (change data capture,</text><text x="747.5" y="259.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">batch or events); data may be stale</text><path d="M9.1 294.1L989.6 294.3L989.6 390.2L9.4 390.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 294.3Q499.8 296.0 991.8 294.3M9.1 294.1Q500.1 297.8 991.2 295.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 294.4Q991.6 342.9 989.4 391.3M990.1 293.9Q990.7 342.7 990.0 391.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 390.6Q500.2 389.2 8.1 389.5M992.5 389.0Q500.2 389.8 7.9 389.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 391.0Q10.9 342.4 11.0 293.7M10.3 390.5Q10.2 341.8 9.6 293.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="337.5" font-size="14.5" fill="#3b2f20" text-anchor="middle">Sharing is acceptable only for read-only static reference data, or for a database deliberately designed and managed as an endpoint.</text><text x="500.0" y="359.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">Schema is a logically separated set of tables; one engine can host many schemas (Fig 4-2). Prefer splitting; use these as stepping stones.</text></svg>