<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="420" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 105.3L10.7 104.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.5 59.7 990.0 106.2M989.9 12.9Q991.5 59.5 990.3 106.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 104.4Q500.1 107.2 8.7 104.5M991.4 104.7Q499.6 103.2 7.8 105.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 106.0Q10.1 59.3 10.1 12.7M10.2 105.9Q8.7 60.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="55.0" font-size="16.5" fill="#3b2f20" text-anchor="middle">Tracer write (Fig 4-18): move the source of truth incrementally, tolerating two sources of truth during the migration.</text><text x="500.0" y="77.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Start with a small set of data (basic invoice data, then contact information, then payment records: Fig 4-19) and grow it and its consumers (Fig 4-20).</text><path d="M9.1 119.9L330.2 119.7L330.7 239.7L11.0 239.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 119.3Q169.7 120.9 331.0 119.1M7.7 119.3Q169.6 121.7 331.5 119.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 117.9Q331.5 179.6 329.3 241.3M329.2 118.5Q328.8 179.5 330.4 240.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 239.5Q169.6 240.0 7.9 239.1M330.9 240.2Q169.4 241.3 7.9 240.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 242.1Q12.6 180.5 10.3 118.9M9.8 242.0Q8.3 180.2 9.0 118.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="164.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Write to one source</text><text x="170.0" y="186.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">then synchronise to the</text><text x="170.0" y="208.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">other after the write</text><path d="M341.1 119.0L660.3 120.4L660.5 238.8L339.4 241.1Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 119.4Q500.0 121.4 661.6 119.4M339.6 120.2Q500.0 120.6 660.5 120.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 119.2Q661.9 179.8 660.3 240.5M661.1 117.5Q658.7 179.0 659.8 240.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 239.6Q499.5 241.6 338.0 240.0M662.1 239.3Q500.2 238.6 338.4 239.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 241.3Q341.9 180.2 340.1 119.1M339.5 242.4Q339.6 180.1 340.0 117.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="164.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Send writes to both</text><text x="500.0" y="186.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">client or intermediary</text><text x="500.0" y="208.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">calls each source</text><path d="M669.3 120.1L991.1 120.8L991.1 241.1L669.7 238.8Z" fill="#eed5cc" stroke="none"/><path d="M668.5 120.8Q829.6 122.0 990.6 120.5M667.6 120.4Q829.4 122.4 991.1 120.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 118.1Q991.3 179.9 990.5 241.8M990.0 119.0Q990.6 179.8 989.1 240.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 240.4Q830.6 239.3 669.3 239.1M991.7 240.0Q830.0 238.7 668.3 239.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 242.0Q671.4 179.7 670.3 117.5M671.0 241.4Q672.0 180.4 669.0 119.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="164.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Writes to either</text><text x="830.0" y="186.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">needs two-way sync:</text><text x="830.0" y="208.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">avoid</text><path d="M9.1 254.1L494.6 254.3L494.6 405.2L9.4 405.1Z" fill="#d0dfdc" stroke="none"/><path d="M7.7 254.3Q252.3 256.0 496.8 254.3M9.1 254.1Q252.6 257.8 496.2 255.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.0 254.4Q497.1 330.4 494.4 406.3M495.1 253.9Q495.8 330.2 495.0 406.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.4 405.6Q252.7 404.2 8.1 404.5M497.5 404.0Q252.7 404.8 7.9 404.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 406.0Q10.9 329.9 11.0 253.7M10.3 405.5Q10.2 329.3 9.6 253.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="292.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Square orders (Fig 4-21 to 4-23)</text><text x="252.5" y="314.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">new Fulfillments service for restaurant and delivery</text><text x="252.5" y="336.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">workflows; a background worker copied data via its API</text><text x="252.5" y="358.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">behind a feature flag; updates then written to both,</text><text x="252.5" y="380.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or both subscribe to the same events</text><path d="M504.5 254.2L989.1 255.5L990.6 404.4L504.8 406.2Z" fill="#efe0ca" stroke="none"/><path d="M503.0 254.5Q747.7 251.6 992.4 255.0M502.8 255.6Q747.6 256.6 992.4 255.2" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 252.6Q989.9 330.1 990.3 407.5M990.0 253.5Q988.2 330.2 990.9 407.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 405.9Q747.6 402.3 503.9 404.2M991.4 404.3Q747.7 401.8 504.0 405.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 407.5Q508.0 330.3 504.3 253.2M504.8 407.3Q507.6 330.3 504.7 253.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="292.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Rules</text><text x="747.5" y="314.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">eventual consistency: decide the acceptable lag;</text><text x="747.5" y="336.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">reconcile with queries; run the new source with no</text><text x="747.5" y="358.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumers first; Square kept the duplicate data so</text><text x="747.5" y="380.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">restaurant data stays visible if the service is down</text></svg>