<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 135.3L10.7 134.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.3 74.7 495.0 136.2M494.9 12.9Q496.8 74.5 495.3 136.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 134.4Q252.6 137.2 8.7 134.5M496.4 134.7Q252.1 133.2 7.8 135.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 136.0Q10.0 74.3 10.1 12.7M10.2 135.9Q8.6 75.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Monolith reporting (Fig 5-4)</text><text x="252.5" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">reports run directly against the monolithic database</text><text x="252.5" y="92.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(maybe a read replica); stakeholders use SQL tools</text><text x="252.5" y="114.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">tied to that schema</text><path d="M504.1 14.9L990.2 14.7L990.7 134.7L506.0 134.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.5 74.6 989.3 136.3M989.2 13.5Q988.8 74.5 990.4 135.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 134.5Q747.1 135.0 502.9 134.1M990.9 135.2Q746.9 136.3 502.9 135.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 137.1Q507.6 75.5 505.3 13.9M504.8 137.0Q503.3 75.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Dedicated reporting database (Fig 5-5)</text><text x="747.5" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">microservices push data into a separate schema, shaped</text><text x="747.5" y="92.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">for reporting (maybe like the old schema); decoupled from</text><text x="747.5" y="114.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">each service&#x27;s storage</text><path d="M11.1 149.0L990.3 150.4L990.5 308.8L9.4 311.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 149.4Q500.0 151.4 991.6 149.4M9.6 150.2Q500.0 150.6 990.5 150.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 149.2Q991.9 229.8 990.3 310.5M991.1 147.5Q988.6 229.0 989.8 310.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 309.6Q499.5 311.6 8.0 310.0M992.1 309.3Q500.2 308.6 8.4 309.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 311.3Q12.0 230.2 10.1 149.1M9.5 312.4Q9.6 230.1 10.0 147.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="203.0" font-size="16.5" fill="#3b2f20" text-anchor="middle">How to push: change data capture, views projected from the service databases, programmatic copying in the services,</text><text x="500.0" y="225.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or intermediaries listening to events. If you already have a data warehouse or data lake, copy the data there.</text><text x="500.0" y="247.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">This bites early, often only discovered halfway through (reporting sits outside normal development: out of sight, out of mind).</text><text x="500.0" y="269.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">See Chapter 5 of Building Microservices.</text></svg>