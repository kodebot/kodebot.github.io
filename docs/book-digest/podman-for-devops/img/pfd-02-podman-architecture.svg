<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="270" fill="#ffffff"/><rect x="20" y="50" width="170" height="76" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="105.0" y="73.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">podman</text><text x="105.0" y="93.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">CLI + engine</text><text x="105.0" y="113.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">(fork/exec)</text><rect x="250" y="50" width="170" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="335.0" y="83.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">conmon</text><text x="335.0" y="103.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">one per container</text><rect x="480" y="50" width="170" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="565.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">crun or runc</text><text x="565.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">OCI runtime</text><rect x="710" y="50" width="170" height="76" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="795.0" y="93.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Container</text><line x1="190" y1="88.0" x2="250" y2="88.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="420" y1="88.0" x2="480" y2="88.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="650" y1="88.0" x2="710" y2="88.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="170" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">no daemon: Podman can exit while conmon keeps the container running</text></svg>