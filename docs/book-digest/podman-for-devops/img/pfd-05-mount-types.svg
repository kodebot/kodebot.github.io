<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="940" height="340" fill="#ffffff"/><rect x="20" y="20" width="300" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="170.0" y="43.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Bind mount (-v, --mount)</text><text x="170.0" y="63.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">existing host path;</text><text x="170.0" y="83.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">hides what is underneath</text><line x1="320" y1="58" x2="600" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="120" width="300" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="170.0" y="143.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Volume (podman volume)</text><text x="170.0" y="163.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">engine-managed, anonymous</text><text x="170.0" y="183.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">or named; plugin drivers</text><line x1="320" y1="158" x2="600" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="220" width="300" height="76" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="170.0" y="253.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">tmpfs, image, devpts</text><text x="170.0" y="273.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">other mount types</text><line x1="320" y1="258" x2="600" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="600" y="110" width="320" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="760.0" y="155.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Container</text><text x="760.0" y="175.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">mount point inside</text><text x="470" y="330" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">SELinux: :z shared label, :Z private label; a wrong label gives 403</text></svg>