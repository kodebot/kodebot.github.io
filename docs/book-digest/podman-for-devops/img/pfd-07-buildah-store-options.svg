<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><rect x="20" y="130" width="200" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="120.0" y="165.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Kubernetes or CI</text><text x="120.0" y="185.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">runs the container</text><rect x="330" y="120" width="240" height="100" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="450.0" y="155.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Buildah in a container</text><text x="450.0" y="175.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">quay.io/buildah/stable</text><text x="450.0" y="195.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">--device /dev/fuse</text><line x1="220" y1="170" x2="330" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="670" y="20" width="220" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="780.0" y="50.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Volume</text><text x="780.0" y="70.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">store in a volume</text><line x1="570" y1="170" x2="670" y2="55" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="670" y="130" width="220" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="780.0" y="160.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Bind mount</text><text x="780.0" y="180.0" font-size="13" font-weight="400"