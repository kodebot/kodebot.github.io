<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="250" fill="#ffffff"/><rect x="20" y="50" width="180" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="110.0" y="80.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Stage 1: builder</text><text x="110.0" y="100.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">compilers + source</text><rect x="260" y="50" width="180" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="350.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Build artifact</text><text x="350.0" y="100.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">e.g. the Go binary</text><rect x="500" y="50" width="180" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="590.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Stage 2: runtime</text><text x="590.0" y="100.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">minimal base image</text><rect x="740" y="50" width="180" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="830.0" y="80.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Final image</text><text x="830.0" y="100.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">36.1 MB (Go example)</text><line x1="200" y1="85.0" x2="260" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="230.0" y="77.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">build</text><line x1="440" y1="85.0" x2="500" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="470.0" y="77.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">COPY --from</text><line x1="680" y1="85.0" x2="740" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="710.0" y="77.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">ship</text><text x="480" y="170" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">only the final stage ships: compilers and source stay behind</text></svg>