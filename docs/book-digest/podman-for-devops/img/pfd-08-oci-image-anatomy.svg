<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><rect x="330" y="15" width="240" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="450.0" y="38.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Image index</text><text x="450.0" y="58.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">optional: one manifest per platform</text><rect x="130" y="110" width="240" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="250.0" y="133.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Manifest</text><text x="250.0" y="153.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">e.g. amd64</text><line x1="450" y1="71" x2="250" y2="110" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="130" y="215" width="110" height="50" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="185.0" y="245.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Config</text><rect x="260" y="215" width="110" height="50" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="315.0" y="245.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Layers</text><line x1="190" y1="166" x2="185" y2="215" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="310" y1="166" x2="315" y2="215" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="530" y="110" width="240" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="650.0" y="133.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Manifest</text><text x="650.0" y="153.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">e.g. arm64</text><line x1="450" y1="71" x2="650" y2="110" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="530" y="215" width="110" height="50" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="585.0" y="245.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Config</text><rect x="660" y="215" width="110" height="50" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="715.0" y="245.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Layers</text><line x1="590" y1="166" x2="585" y2="215" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="710" y1="166" x2="715" y2="215" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="315" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the manifest gives a hashable image ID, enables multi-architecture images,</text><text x="450" y="333" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">and maps to the runtime spec</text></svg>