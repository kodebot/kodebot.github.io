<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><text x="20" y="30" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Publish</text><rect x="20" y="42" width="210" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="125.0" y="67.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Sign the image</text><text x="125.0" y="87.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Cosign (Sigstore) or GPG</text><rect x="280" y="42" width="210" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="385.0" y="67.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Push image +</text><text x="385.0" y="87.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">signature (OCI artifact)</text><rect x="540" y="42" width="210" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="645.0" y="77.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Registry</text><line x1="230" y1="72.0" x2="280" y2="72.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="490" y1="72.0" x2="540" y2="72.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="20" y="160" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Pull</text><rect x="20" y="172" width="210" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="125.0" y="207.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">podman pull</text><rect x="280" y="172" width="210" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="385.0" y="197.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">policy.json</text><text x="385.0" y="217.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">sigstoreSigned or signedBy</text><rect x="540" y="172" width="210" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="645.0" y="197.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Signature</text><text x="645.0" y="217.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">valid?</text><line x1="230" y1="202.0" x2="280" y2="202.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="490" y1="202.0" x2="540" y2="202.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="830" y="140" width="140" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="900.0" y="170.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Accepted</text><rect x="830" y="220" width="140" height="50" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="900.0" y="250.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Pull fails</text><line x1="740" y1="190" x2="830" y2="165" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="740" y1="215" x2="830" y2="245" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="305" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the default policy, insecureAcceptAnything, accepts every image</text></svg>