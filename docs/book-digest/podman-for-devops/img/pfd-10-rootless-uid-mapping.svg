<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="860" height="330" fill="#ffffff"/><rect x="20" y="15" width="360" height="300" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Host</text><rect x="480" y="15" width="360" height="300" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="502" y="49" font-size="16" font-weight="700" fill="#14324f">Container (user namespace)</text><rect x="50" y="70" width="300" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="200.0" y="95.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Your host user</text><text x="200.0" y="115.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">a normal, unprivileged user</text><rect x="510" y="70" width="300" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="660.0" y="95.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">UID 0 (root)</text><text x="660.0" y="115.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">inside the container only</text><line x1="350" y1="100" x2="510" y2="100" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="430.0" y="90" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">mapped to</text><rect x="50" y="170" width="300" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="200.0" y="200.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">/etc/subuid, /etc/subgid</text><text x="200.0" y="220.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">range of 65,536 IDs</text><rect x="510" y="170" width="300" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="660.0" y="200.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Other UIDs and GIDs</text><text x="660.0" y="220.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">inside the container</text><line x1="350" y1="205" x2="510" y2="205" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="430.0" y="195" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">mapped to</text><text x="430" y="285" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">an escaped process has only that host user&#x27;s privileges</text></svg>