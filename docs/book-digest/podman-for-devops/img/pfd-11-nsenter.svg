<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="860" height="300" fill="#ffffff"/><rect x="20" y="40" width="190" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="115.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Host tools</text><text x="115.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">not in the image</text><rect x="290" y="40" width="190" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="385.0" y="70.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">nsenter</text><text x="385.0" y="90.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">joins the namespaces</text><rect x="560" y="30" width="280" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="700.0" y="70.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Container namespaces</text><text x="700.0" y="90.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">network, mount, ...</text><line x1="210" y1="75" x2="290" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="480" y1="75" x2="560" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="290" y="190" width="190" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="385.0" y="220.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">podman exec</text><text x="385.0" y="240.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">only what the image has</text><line x1="480" y1="225" x2="700" y2="120" stroke="#6f8aa3" stroke-width