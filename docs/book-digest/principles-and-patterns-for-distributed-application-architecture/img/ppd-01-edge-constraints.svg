oke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="47.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Lack of global consistency</text><text x="745.0" y="69.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">consensus across devices is prohibitively expensive</text><path d="M21.1 94.0L490.3 95.4L490.5 158.8L19.4 161.1Z" fill="#d0dfdc" stroke="none"/><path d="M18.4 94.4Q255.0 96.4 491.6 94.4M19.6 95.2Q255.0 95.6 490.5 95.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.9 94.2Q491.5 127.3 490.3 160.5M491.1 92.5Q489.3 126.5 489.8 160.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.1 159.6Q254.5 161.6 18.0 160.0M492.1 159.3Q255.2 158.6 18.4 159.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.6 161.3Q21.4 127.7 20.1 94.1M19.5 162.4Q19.7 127.6 20.0 92.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="122.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Unstable networks</text><text x="255.0" y="144.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">multi-hop mesh links, unreliable and slow</text><path d="M509.3 95.1L981.1 95.8L981.1 161.1L509.7 158.8Z" fill="#d3dbe0" stroke="none"/><path d="M508.5 95.8Q744.6 97.0 980.6 95.5M507.6 95.4Q744.4 97.4 981.1 95.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 93.1Q980.9 127.4 980.5 161.8M980.0 94.0Q980.2 127.3 979.1 160.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 160.4Q745.6 159.3 509.3 159.1M981.7 160.0Q745.0 158.7 508.3 159.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.9 162.0Q511.0 127.2 510.3 92.5M511.0 161.4Q511.3 127.9 509.0 9