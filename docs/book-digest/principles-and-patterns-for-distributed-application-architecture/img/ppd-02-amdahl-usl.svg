<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="300" fill="#fbf7ef"/><path d="M21.1 40.0L490.3 40.4L488.9 260.3L20.7 259.2Z" fill="#efe0ca" stroke="none"/><path d="M18.5 40.0Q255.1 40.0 491.8 39.6M19.5 40.4Q255.5 39.6 491.5 40.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 38.3Q489.2 149.7 490.0 261.2M489.9 37.9Q491.9 149.5 490.3 261.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 259.4Q255.1 262.2 18.7 259.5M491.4 259.7Q254.6 258.2 17.8 260.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 261.0Q20.0 149.3 20.1 37.7M20.2 260.9Q18.5 150.1 19.1 39.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="123.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Amdahl&#x27;s law (Figure 2-2)</text><text x="255.0" y="145.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">serial (nonparallelizable) fraction caps the speedup</text><text x="255.0" y="167.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">example: 80% parallel, 20% serial</text><text x="255.0" y="189.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">maximum speedup 5x however many processors</text><path d="M509.1 39.9L980.2 39.7L980.7 259.7L511.0 259.8Z" fill="#eed5cc" stroke="none"/><path d="M508.4 39.3Q744.7 40.9 981.0 39.1M507.7 39.3Q744.6 41.7 981.5 39.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 37.9Q981.6 149.6 979.3 261.3M979.2 38.5Q978.8 149.5 980.4 260.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 259.5Q744.6 260.0 507.9 259.1M980.9 260.2Q744.4 261.3 507.9 260.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.2 262.1Q512.7 150.5 510.3 38.9M509.8 262.0Q508.2 150.2 509.0 38.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="123.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Universal scalability law (Figure 2-3)</text><text x="745.0" y="145.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">adds contention and coherency</text><text x="745.0" y="167.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">after a point more resources make performance worse</text><text x="745.0" y="189.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">example: servers syncing sessions with each other</text></svg>