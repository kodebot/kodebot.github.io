<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="300" fill="#fbf7ef"/><path d="M21.1 20.0L490.3 20.4L488.9 280.3L20.7 279.2Z" fill="#d0dfdc" stroke="none"/><path d="M18.5 20.0Q255.1 20.0 491.8 19.6M19.5 20.4Q255.5 19.6 491.5 20.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 18.3Q489.2 149.7 490.0 281.2M489.9 17.9Q491.9 149.5 490.3 281.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 279.4Q255.1 282.2 18.7 279.5M491.4 279.7Q254.6 278.2 17.8 280.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 281.0Q20.0 149.3 20.1 17.7M20.2 280.9Q18.5 150.1 19.1 19.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="46" font-size="18.0" fill="#3b2f20">Convergent / state-based (CvRDT)</text><text x="34" y="66" font-size="14.0" fill="#3b2f20">keeps the history of state changes in the data type</text><path d="M39.1 99.9L470.2 99.7L470.7 154.7L41.0 154.8Z" fill="#f1ede5" stroke="none"/><path d="M38.4 99.3Q254.7 100.9 471.0 99.1M37.7 99.3Q254.6 101.7 471.5 99.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M469.9 97.9Q470.8 127.1 469.3 156.3M469.2 98.5Q469.2 127.0 470.4 155.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.3 154.5Q254.6 155.0 37.9 154.1M470.9 155.2Q254.4 156.3 37.9 155.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.2 157.1Q41.7 128.0 40.3 98.9M39.8 157.0Q38.7 127.7 39.0 98.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="133.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">Converges if all changes eventually reach all replicas (gossip)</text><path d="M41.1 169.0L470.3 170.4L470.5 258.8L39.4 261.1Z" fill="#f1ede5" stroke="none"/><path d="M38.4 169.4Q255.0 171.4 471.6 169.4M39.6 170.2Q255.0 170.6 470.5 170.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M470.9 169.2Q471.6 214.8 470.3 260.5M471.1 167.5Q469.1 214.0 469.8 260.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.1 259.6Q254.5 261.6 38.0 260.0M472.1 259.3Q255.2 258.6 38.4 259.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.6 261.3Q41.6 215.2 40.1 169.1M39.5 262.4Q39.6 215.1 40.0 167.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="199.0" font-size="15.5" fill="#3b2f20" text-anchor="middle">Reads: from the data you have (maybe inconsistent),</text><text x="255.0" y="221.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">from a quorum (usually good enough),</text><text x="255.0" y="243.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or from all replicas (strongest)</text><path d="M509.3 20.1L981.1 20.8L981.1 281.1L509.7 278.8Z" fill="#d6e1cf" stroke="none"/><path d="M508.5 20.8Q744.6 22.0 980.6 20.5M507.6 20.4Q744.4 22.4 981.1 20.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 18.1Q981.3 149.9 980.5 281.8M980.0 19.0Q980.6 149.8 979.1 280.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 280.4Q745.6 279.3 509.3 279.1M981.7 280.0Q745.0 278.7 508.3 279.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.9 282.0Q511.5 149.7 510.3 17.5M511.0 281.4Q512.1 150.4 509.0 19.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="524" y="46" font-size="18.0" fill="#3b2f20">Commutative / operation-based (CmRDT)</text><text x="524" y="66" font-size="14.0" fill="#3b2f20">replicates the state-changing operations</text><path d="M529.1 99.1L959.6 99.3L959.6 170.2L529.4 170.1Z" fill="#f1ede5" stroke="none"/><path d="M527.7 99.3Q744.8 101.0 961.8 99.3M529.1 99.1Q745.1 102.8 961.2 100.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M960.0 99.4Q961.3 135.4 959.4 171.3M960.1 98.9Q960.6 135.2 960.0 171.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M962.4 170.6Q745.2 169.2 528.1 169.5M962.5 169.0Q745.2 169.8 527.9 169.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M530.9 171.0Q530.9 134.9 531.0 98.7M530.3 170.5Q530.1 134.3 529.6 98.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="141.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Order of operations kept when replicated</text><path d="M529.5 184.2L959.1 185.5L960.6 259.4L529.8 261.2Z" fill="#f1ede5" stroke="none"/><path d="M528.0 184.5Q745.2 181.6 962.4 185.0M527.8 185.6Q745.1 186.6 962.4 185.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M961.0 182.6Q960.2 222.6 960.3 262.5M960.0 183.5Q958.9 222.7 960.9 262.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M961.3 260.9Q745.1 257.3 528.9 259.2M961.4 259.3Q745.2 256.8 529.0 260.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M530.9 262.5Q532.1 222.8 529.3 183.2M529.8 262.3Q531.7 222.8 529.7 183.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="217.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Needs a reliable broadcast channel with</text><text x="745.0" y="239.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">exactly-once delivery (like event sourcing)</text></svg>