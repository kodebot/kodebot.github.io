<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="300" fill="#fbf7ef"/><path d="M21.1 20.0L490.3 20.4L488.9 280.3L20.7 279.2Z" fill="#d0dfdc" stroke="none"/><path d="M18.5 20.0Q255.1 20.0 491.8 19.6M19.5 20.4Q255.5 19.6 491.5 20.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 18.3Q489.2 149.7 490.0 281.2M489.9 17.9Q491.9 149.5 490.3 281.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 279.4Q255.1 282.2 18.7 279.5M491.4 279.7Q254.6 278.2 17.8 280.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 281.0Q20.0 149.3 20.1 17.7M20.2 280.9Q18.5 150.1 19.1 19.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="46" font-size="18.0" fill="#3b2f20">Decouple in time</text><text x="34" y="66" font-size="14.0" fill="#3b2f20">do not require the other side to be available now</text><path d="M39.1 99.9L470.2 99.7L470.7 154.7L41.0 154.8Z" fill="#f1ede5" stroke="none"/><path d="M38.4 99.3Q254.7 100.9 471.0 99.1M37.7 99.3Q254.6 101.7 471.5 99.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M469.9 97.9Q470.8 127.1 469.3 156.3M469.2 98.5Q469.2 127.0 470.4 155.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.3 154.5Q254.6 155.0 37.9 154.1M470.9 155.2Q254.4 156.3 37.9 155.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.2 157.1Q41.7 128.0 40.3 98.9M39.8 157.0Q38.7 127.7 39.0 98.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-lin