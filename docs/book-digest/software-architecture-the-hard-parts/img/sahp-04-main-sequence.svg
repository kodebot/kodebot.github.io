<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="360" fill="#fbf7ef"/><path d="M41.1 20.0L460.3 20.4L458.9 320.3L40.7 319.2Z" fill="#f1ede5" stroke="none"/><path d="M38.5 20.0Q250.1 20.0 461.8 19.6M39.5 20.4Q250.5 19.6 461.5 20.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M460.8 18.3Q459.2 169.7 460.0 321.2M459.9 17.9Q461.9 169.5 460.3 321.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M461.5 319.4Q250.1 322.2 38.7 319.5M461.4 319.7Q249.6 318.2 37.8 320.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.9 321.0Q40.0 169.3 40.1 17.7M40.2 320.9Q38.5 170.1 39.1 19.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="176.0" font-size="17.0" fill="#3b2f20" text-anchor="middle"></text><text x="250" y="45" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">Abstractness (A, vertical) against instability (I, horizontal)</text><path d="M79.2 89.9Q248.7 191.4 420.1 289.7M79.7 90.9Q250.8 188.5 419.8 289.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M419.8 289.6Q416.6 284.7 413.9 279.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M420.0 289.8Q414.2 289.8 408.4 289.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="200" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">main sequence: A + I = 1</text><text x="380" y="80" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">upper right: uselessness</text><text x="120" y="300" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">lower left: pain</text><path d="M499.2 29.8L979.2 29.1L979.9 170.4L499.0 170.4Z" fill="#efe0ca" stroke="none"/><path d="M498.3 29.5Q739.6 28.6 980.9 29.1M497.9 30.2Q739.4 29.3 980.9 30.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.2 29.1Q977.8 100.5 980.3 171.9M979.8 29.0Q980.6 100.2 979.0 171.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.5 169.1Q740.7 168.3 498.8 170.3M980.4 169.4Q740.0 171.5 499.5 169.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M500.1 170.9Q501.0 100.2 500.7 29.6M499.0 171.6Q501.6 100.5 500.1 29.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="740.0" y="95.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Zone of uselessness (upper right)</text><text x="740.0" y="117.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">code too abstract becomes difficult to use</text><path d="M500.4 188.9L979.5 191.2L978.9 329.8L498.9 330.7Z" fill="#eed5cc" stroke="none"/><path d="M498.1 189.6Q739.5 187.9 981.0 190.0M499.1 189.3Q740.2 190.4 981.4 189.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.6 188.3Q978.7 260.2 980.1 332.1M979.5 189.4Q979.9 260.1 980.0 330.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 330.1Q740.2 327.5 499.5 330.7M982.5 329.8Q739.9 327.4 497.4 330.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M499.1 332.0Q500.9 259.8 500.4 187.6M499.6 332.1Q498.9 260.3 500.6 188.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="740.0" y="244.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Zone of pain (lower left)</text><text x="740.0" y="266.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">too much implementation, not enough abstraction:</text><text x="740.0" y="288.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">brittle and hard to maintain</text><text x="250" y="345" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">components near the line are well balanced; far from it, they are not</text></svg>