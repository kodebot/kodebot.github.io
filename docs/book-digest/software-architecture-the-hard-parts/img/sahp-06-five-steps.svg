<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M11.1 30.0L196.3 30.4L194.9 180.3L10.7 179.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 30.0Q103.1 30.0 197.8 29.6M9.5 30.4Q103.5 29.6 197.5 30.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M196.8 28.3Q195.2 104.7 196.0 181.2M195.9 27.9Q197.9 104.5 196.3 181.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M197.5 179.4Q103.1 182.2 8.7 179.5M197.4 179.7Q102.6 178.2 7.8 180.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 181.0Q10.0 104.3 10.1 27.7M10.2 180.9Q8.5 105.1 9.1 29.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="103.0" y="100.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1. Analyse</text><text x="103.0" y="122.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">find data domains</text><path d="M195.2 104.9Q201.7 105.4 208.1 104.7M195.7 105.9Q201.7 104.7 207.8 104.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.8 104.6Q202.6 102.1 197.7 99.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M208.0 104.8Q203.0 107.9 197.7 110.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.2 29.8L393.2 29.1L393.9 180.4L207.0 180.4Z" fill="#d0dfdc" stroke="none"/><path d="M206.3 29.5Q300.6 28.6 394.9 29.1M205.9 30.2Q300.4 29.3 394.9 30.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M394.2 29.1Q391.8 105.5 394.3 181.9M393.8 29.0Q394.6 105.2 393.0 181.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M396.5 179.1Q301.7 178.3 206.8 180.3M394.4 179.4Q301.0 181.5 207.5 179.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M208.1 180.9Q209.0 105.2 208.7 29.6M207.0 181.6Q209.6 105.5 208.1 29.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="301.0" y="100.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2. Assign tables</text><text x="301.0" y="122.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one schema per domain</text><path d="M394.3 104.0Q400.0 104.1 405.6 106.1M393.8 104.0Q400.2 103.9 406.6 104.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M405.7 105.0Q400.3 102.6 395.0 99.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M406.0 104.8Q400.8 107.9 395.5 110.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M406.1 30.7L592.6 29.5L593.0 180.0L405.2 179.9Z" fill="#efe0ca" stroke="none"/><path d="M403.9 30.1Q499.2 33.4 594.5 30.7M405.5 29.8Q498.9 32.3 592.4 30.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M591.1 29.0Q590.7 104.8 592.4 180.6M591.6 29.1Q593.4 105.3 592.6 181.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M594.0 180.3Q499.0 178.8 404.1 180.0M592.6 179.2Q498.4 178.6 404.1 180.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M406.8 180.6Q406.5 104.6 406.2 28.7M405.8 180.9Q407.7 104.6 406.4 28.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="89.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">3. Separate connections</text><text x="499.0" y="111.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">each service reaches its own</text><text x="499.0" y="133.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">schema only (hardest step)</text><path d="M592.3 104.0Q598.4 104.9 604.5 106.0M591.0 106.0Q597.9 104.3 604.7 104.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M603.8 104.7Q598.4 102.3 593.2 99.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M604.0 104.6Q598.7 107.9 593.0 110.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M604.6 30.7L789.0 29.6L790.7 181.1L604.0 181.0Z" fill="#d6e1cf" stroke="none"/><path d="M601.9 29.8Q696.3 31.0 790.7 30.1M602.5 30.1Q696.9 32.4 791.2 30.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M789.6 28.0Q792.8 105.3 790.3 182.5M789.4 28.4Q791.1 105.4 789.9 182.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M792.5 180.2Q697.5 183.1 602.5 180.3M791.1 179.5Q696.9 181.6 602.6 179.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M603.2 181.9Q603.4 104.9 604.5 27.9M605.1 181.0Q604.4 105.2 603.5 29.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="697.0" y="78.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">4. Move schemas</text><text x="697.0" y="100.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">to separate database</text><text x="697.0" y="122.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">servers: backup/restore</text><text x="697.0" y="144.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or replicate</text><path d="M788.9 104.3Q795.8 105.3 802.6 