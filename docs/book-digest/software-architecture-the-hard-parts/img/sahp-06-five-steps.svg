.9Q500.8 303.8 9.3 305.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.3 305.4Q9.5 254.5 9.6 203.6M10.1 306.7Q12.4 254.7 10.8 202.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="239.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Step 3 ends in data sovereignty per service: each service owns its data. Benefit: schema changes stay local,</text><text x="500.0" y="261.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">each service can pick its database type. Cost: no cross-domain foreign keys, large reads are slower,</text><text x="500.0" y="283.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">database code that touches other domains must move into services</text></svg>