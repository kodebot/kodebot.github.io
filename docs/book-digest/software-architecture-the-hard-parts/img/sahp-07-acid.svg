<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M21.1 30.0L320.3 30.4L318.9 110.3L20.7 109.2Z" fill="#d3dbe0" stroke="none"/><path d="M18.5 30.0Q170.1 30.0 321.8 29.6M19.5 30.4Q170.5 29.6 321.5 30.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.8 28.3Q319.5 69.7 320.0 111.2M319.9 27.9Q321.4 69.5 320.3 111.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.5 109.4Q170.1 112.2 18.7 109.5M321.4 109.7Q169.6 108.2 17.8 110.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 111.0Q20.2 69.3 20.1 27.7M20.2 110.9Q18.8 70.1 19.1 29.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="65.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Profile Service</text><text x="170.0" y="87.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">inserts profile, commits</text><path d="M379.1 29.9L680.2 29.7L680.7 109.7L381.0 109.8Z" fill="#d0dfdc" stroke="none"/><path d="M378.4 29.3Q529.7 30.9 681.0 29.1M377.7 29.3Q529.6 31.7 681.5 29.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M679.9 27.9Q681.1 69.6 679.3 111.3M679.2 28.5Q679.0 69.5 680.4 110.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M681.3 109.5Q529.6 110.0 377.9 109.1M680.9 110.2Q529.4 111.3 377.9 110.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M380.2 112.1Q382.0 70.5 380.3 28.9M379.8 112.0Q378.6 70.2 379.0 28.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="530.0" y="65.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Password Service</text><text x="530.0" y="87.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">inserts password, commits</text><path d="M321.0 69.1Q350.7 70.5 380.3 70.3M318.9 69.4Q350.0 68.6 381.0 69.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M380.1 69.7Q374.9 67.3 369.7 65.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M379.5 70.1Q374.3 72.8 369.4 76.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.4 138.9L679.5 141.2L678.9 209.8L18.9 210.7Z" fill="#eed5cc" stroke="none"/><path d="M18.1 139.6Q349.5 137.9 681.0 140.0M19.1 139.3Q350.2 140.4 681.4 139.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M680.6 138.3Q679.2 175.2 680.1 212.1M679.5 139.4Q679.8 175.1 680.0 210.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M680.9 210.1Q350.2 207.5 19.5 210.7M682.5 209.8Q349.9 207.4 17.4 210.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.1 212.0Q20.5 174.8 20.4 137.6M19.6 212.1Q19.3 175.3 20.6 138.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="350.0" y="170.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">If Password Service fails, the profile insert is already committed:</text><text x="350.0" y="192.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">inconsistent data and complex compensating error handling</text><path d="M720.5 30.3L979.6 30.0L980.5 209.1L719.1 209.6Z" fill="#f1ede5" stroke="none"/><path d="M719.0 30.4Q850.6 30.2 982.3 29.1M718.7 30.0Q850.0 30.8 981.3 29.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 29.0Q978.7 119.7 980.3 210.5M981.0 28.4Q977.9 120.4 979.0 212.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.6 209.1Q849.4 210.4 718.2 209.3M981.7 209.5Q850.1 211.4 718.6 209.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M720.3 210.8Q717.7 120.0 720.6 29.1M719.7 212.1Q723.0 120.3 721.0 28.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="850.0" y="71.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Separate services:</text><text x="850.0" y="93.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ access control per service</text><text x="850.0" y="115.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">- no ACID transaction for</text><text x="850.0" y="137.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">register or unsubscribe</text><text x="850.0" y="159.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Single service: ACID, but</text><text x="850.0" y="181.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">less isolated access</text><path d="M19.4 234.8L979.1 235.1L980.4 315.0L20.1 314.7Z" fill="#d6e1cf" stroke="none"/><path d="M19.4 235.6Q500.2 236.0 981.1 234.5M19.5 234.0Q500.2 234.1 980.9 234.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 233.0Q981.0 274.9 981.0 316.7M980.3 232.5Q979.8 274.3 979.6 316.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.0 314.3Q499.4 313.3 17.7 315.4M980.9 314.9Q500.2 316.0 19.6 314.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 316.5Q21.1 274.7 18.9 232.8M20.9 316.7Q18.7 275.6 20.4 234.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="270.0" font-size="16.0" fill="#3b2f20" text-anchor="middle">If the business needs all-or-nothing, consolidate (Figure 7-11). Sysops Squad did exactly this and used a security library</text><text x="500.0" y="292.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">in the API gateway and service mesh: security by design, not by separate deployment units</text></svg>