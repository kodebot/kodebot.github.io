"17.0" fill="#3b2f20" text-anchor="middle">Disintegrator: assignment algorithm changes 2 to 3</text><text x="255.0" y="129.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">times a month (volatility)</text><text x="255.0" y="151.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Integrator: tight synchronous workflow, error handling,</text><text x="255.0" y="173.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">performance. Chosen: one service, with assignment,</text><text x="255.0" y="195.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">routing and shared code as separate namespaces</text><path d="M511.1 19.0L980.3 20.4L980.5 58.8L509.4 61.1Z" fill="#d0dfdc" stroke="none"/><path d="M508.4 19.4Q745.0 21.4 981.6 19.4M509.6 20.2Q745.0 20.6 980.5 20.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 19.2Q981.3 39.8 980.3 60.5M981.1 17.5Q979.6 39.0 979.8 60.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 59.6Q744.5 61.6 508.0 60.0M982.1 59.3Q745.2 58.6 508.4 59.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 61.3Q511.1 40.2 510.1 19.1M509.5 62.4Q509.7 40.1 510.0 17.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Customer registration: one service</text><path d="M509.3 70.1L981.1 70.8L981.1 221.1L509.7 218.8Z" fill="#f1ede5" stroke="none"/><path d="M508.5 70.8Q744.6 72.0 980.6 70.5M507.6 70.4Q744.4 72.4 981.1 70.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 68.1Q981.3 144.9 980.5 221.8M980.0 69.0Q980.6 144.8 979.1 220.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 220.4Q745.6 219.3 509.3 219.1M981.7 220.0Q745.0 218.7 508.3 219.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.9 222.0Q511.5 144.7 510.3 67.5M511.0 221.4Q512.1 145.4 509.0 69.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="118.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Disintegrator: security of credit card and password</text><text x="745.0" y="140.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Integrator: all-or-nothing registration (ACID)</text><text x="745.0" y="162.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Chosen: one customer service, security via the</text><text x="745.0" y="184.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Tortoise library in API gateway and service mesh</text><path d="M19.1 239.1L979.6 239.3L979.6 320.2L19.4 320.1Z" fill="#d6e1cf" stroke="none"/><path d="M17.7 239.3Q499.8 241.0 981.8 239.3M19.1 239.1Q500.1 242.8 981.2 240.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.0 239.4Q981.4 280.4 979.4 321.3M980.1 238.9Q980.6 280.2 980.0 321.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.4 320.6Q500.2 319.2 18.1 319.5M982.5 319.0Q500.2 319.8 17.9 319.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 321.0Q20.9 279.9 21.0 238.7M20.3 320.5Q20.2 279.3 19.6 238.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="275.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Trade-off statements are put to the business: more time-to-market or stronger data integrity? Each ADR records the cost:</text><text x="500.0" y="297.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">larger testing scope and deployment risk, and the functions scale as one unit</text></svg>