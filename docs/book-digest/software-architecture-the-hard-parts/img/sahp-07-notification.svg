<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="360" fill="#fbf7ef"/><path d="M21.1 20.0L980.3 20.4L978.9 70.3L20.7 69.2Z" fill="#f1ede5" stroke="none"/><path d="M18.5 20.0Q500.1 20.0 981.8 19.6M19.5 20.4Q500.5 19.6 981.5 20.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.8 18.3Q979.7 44.7 980.0 71.2M979.9 17.9Q981.1 44.5 980.3 71.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.5 69.4Q500.1 72.2 18.7 69.5M981.4 69.7Q499.6 68.2 17.8 70.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 71.0Q20.2 44.3 20.1 17.7M20.2 70.9Q19.0 45.1 19.1 19.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">One Notification Service: SMS, email, postal letter. Cohesion is strong, so scope alone does not justify a split</text><path d="M19.1 89.9L325.2 89.7L325.7 239.7L21.0 239.8Z" fill="#efe0ca" stroke="none"/><path d="M18.4 89.3Q172.2 90.9 326.0 89.1M17.7 89.3Q172.1 91.7 326.5 89.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M324.9 87.9Q326.6 164.6 324.3 241.3M324.2 88.5Q323.8 164.5 325.4 240.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M326.3 239.5Q172.1 240.0 17.9 239.1M325.9 240.2Q171.9 241.3 17.9 240.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.2 242.1Q22.7 165.5 20.3 88.9M19.8 242.0Q18.2 165.2 19.0 88.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="172.5" y="138.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Code volatility</text><text x="172.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">SMS and email: change every ~6 months</text><text x="172.5" y="182.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Letter: changes weekly</text><text x="172.5" y="204.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Split into Electronic and Letter</text><path d="M346.1 89.0L650.3 90.4L650.5 238.8L344.4 241.1Z" fill="#d0dfdc" stroke="none"/><path d="M343.4 89.4Q497.5 91.4 651.6 89.4M344.6 90.2Q497.5 90.6 650.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M650.9 89.2Q651.9 164.8 650.3 240.5M651.1 87.5Q648.6 164.0 649.8 240.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.1 239.6Q497.0 241.6 343.0 240.0M652.1 239.3Q497.7 238.6 343.4 239.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M345.6 241.3Q347.0 165.2 345.1 89.1M344.5 242.4Q344.6 165.1 345.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="497.5" y="138.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Scalability</text><text x="497.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">SMS 220,000/min, email 500/min,</text><text x="497.5" y="182.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">letter 1/min</text><text x="497.5" y="204.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Split into SMS, Email, Letter</text><path d="M669.3 90.1L976.1 90.8L976.1 241.1L669.7 238.8Z" fill="#eed5cc" stroke="none"/><path d="M668.5 90.8Q822.1 92.0 975.6 90.5M667.6 90.4Q821.9 92.4 976.1 90.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M974.9 88.1Q976.3 164.9 975.5 241.8M975.0 89.0Q975.6 164.8 974.1 240.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M977.0 240.4Q823.1 239.3 669.3 239.1M976.7 240.0Q822.5 238.7 668.3 239.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 242.0Q671.5 164.7 670.3 87.5M671.0 241.4Q672.1 165.4 669.0 89.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="822.5" y="138.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Fault tolerance</text><text x="822.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Email crashes (out of memory)</text><text x="822.5" y="182.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">take the others down</text><text x="822.5" y="204.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Only a 3-way split has good names</text><path d="M19.1 259.1L979.6 259.3L979.6 340.2L19.4 340.1Z" fill="#d6e1cf" stroke="none"/><path d="M17.7 259.3Q499.8 261.0 981.8 259.3M19.1 259.1Q500.1 262.8 981.2 260.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.0 259.4Q981.4 300.4 979.4 341.3M980.1 258.9Q980.6 300.2 980.0 341.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.4 340.6Q500.2 339.2 18.1 339.5M982.5 339.0Q500.2 339.8 17.9 339.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 341.0Q20.9 299.9 21.0 258.7M20.3 340.5Q20.2 299.3 19.6 258.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="295.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Check the leftover: after removing the offender, can the rest form a cohesive, nameable service?</text><text x="500.0" y="317.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Email + &#x27;Other Notification&#x27; or &#x27;SMS-Letter&#x27; are poor names, so the rest would not be cohesive</text></svg>