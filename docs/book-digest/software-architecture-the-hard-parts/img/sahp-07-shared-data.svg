<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="350" fill="#fbf7ef"/><path d="M21.1 20.0L490.3 20.4L488.9 60.3L20.7 59.2Z" fill="#d6e1cf" stroke="none"/><path d="M18.5 20.0Q255.1 20.0 491.8 19.6M19.5 20.4Q255.5 19.6 491.5 20.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 18.3Q489.8 39.7 490.0 61.2M489.9 17.9Q491.0 39.5 490.3 61.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 59.4Q255.1 62.2 18.7 59.5M491.4 59.7Q254.6 58.2 17.8 60.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 61.0Q20.3 39.3 20.1 17.7M20.2 60.9Q19.1 40.1 19.1 19.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Shared code as an integrator</text><path d="M19.1 69.9L490.2 69.7L490.7 199.7L21.0 199.8Z" fill="#f1ede5" stroke="none"/><path d="M18.4 69.3Q254.7 70.9 491.0 69.1M17.7 69.3Q254.6 71.7 491.5 69.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 67.9Q491.6 134.6 489.3 201.3M489.2 68.5Q488.8 134.5 490.4 200.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 199.5Q254.6 200.0 17.9 199.1M490.9 200.2Q254.4 201.3 17.9 200.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.2 202.1Q22.7 135.5 20.3 68.9M19.8 202.0Q18.2 135.2 19.0 68.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="108.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Domain code (business logic) shared by services:</text><text x="255.0" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consider merging when the shared share is high</text><text x="255.0" y="152.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(example: over 40% of the codebase), changes often,</text><text x="255.0" y="174.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or fixes cannot be versioned</text><path d="M21.1 214.0L490.3 215.4L490.5 333.8L19.4 336.1Z" fill="#f1ede5" stroke="none"/><path d="M18.4 214.4Q255.0 216.4 491.6 214.4M19.6 215.2Q255.0 215.6 490.5 215.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.9 214.2Q491.9 274.8 490.3 335.5M491.1 212.5Q488.7 274.0 489.8 335.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.1 334.6Q254.5 336.6 18.0 335.0M492.1 334.3Q255.2 333.6 18.4 334.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.6 336.3Q21.9 275.2 20.1 214.1M19.5 337.4Q19.6 275.1 20.0 212.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="259.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Not an integrator: infrastructure cross-cutting code</text><text x="255.0" y="281.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(logging, auditing, authentication, authorization,</text><text x="255.0" y="303.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">monitoring)</text><path d="M509.3 20.1L981.1 20.8L981.1 61.1L509.7 58.8Z" fill="#d6e1cf" stroke="none"/><path d="M508.5 20.8Q744.6 22.0 980.6 20.5M507.6 20.4Q744.4 22.4 981.1 20.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 18.1Q980.8 39.9 980.5 61.8M980.0 19.0Q980.1 39.8 979.1 60.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 60.4Q745.6 59.3 509.3 59.1M981.7 60.0Q745.0 58.7 508.3 59.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.9 62.0Q510.8 39.7 510.3 17.5M511.0 61.4Q511.0 40.4 509.0 19.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Data relationships as an integrator</text><path d="M509.1 69.1L729.6 69.3L729.6 150.2L509.4 150.1Z" fill="#d3dbe0" stroke="none"/><path d="M507.7 69.3Q619.8 71.0 731.8 69.3M509.1 69.1Q620.1 72.8 731.2 70.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M730.0 69.4Q731.4 110.4 729.4 151.3M730.1 68.9Q730.6 110.2 730.0 151.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M732.4 150.6Q620.2 149.2 508.1 149.5M732.5 149.0Q620.2 149.8 507.9 149.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.9 151.0Q510.9 109.9 511.0 68.7M510.3 150.5Q510.2 109.3 509.6 68.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="620.0" y="105.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Service B owns table 3</text><text x="620.0" y="127.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">needs table 5</text><path d="M759.5 69.2L979.1 70.5L980.6 149.4L759.8 151.2Z" fill="#d0dfdc" stroke="none"/><path d="M758.0 69.5Q870.2 66.6 982.4 70.0M757.8 70.6Q870.1 71.6 982.4 70.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.0 67.6Q980.1 110.1 980.3 152.5M980.0 68.5Q978.9 110.2 980.9 152.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 150.9Q870.1 147.3 758.9 149.2M981.4 149.3Q8