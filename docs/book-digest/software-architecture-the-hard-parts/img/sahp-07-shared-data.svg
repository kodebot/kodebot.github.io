ound" stroke-linejoin="round"/><path d="M509.2 337.3Q511.6 252.5 509.5 167.7M510.8 336.6Q511.1 252.9 510.6 169.2" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="214.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Neither may read the other&#x27;s table</text><text x="745.0" y="236.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">(bounded context), so they must call each other</text><text x="745.0" y="258.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">back and forth: latency, fault tolerance and</text><text x="745.0" y="280.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">scalability costs. Merge B and C.</text><text x="745.0" y="302.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">Fewest trade-offs of the integrators</text></svg>