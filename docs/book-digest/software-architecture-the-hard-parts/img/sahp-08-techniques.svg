<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="360" fill="#fbf7ef"/><path d="M11.1 20.0L245.3 20.4L243.9 210.3L10.7 209.2Z" fill="#efe0ca" stroke="none"/><path d="M8.5 20.0Q127.6 20.0 246.8 19.6M9.5 20.4Q128.0 19.6 246.5 20.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M245.8 18.3Q244.2 114.7 245.0 211.2M244.9 17.9Q246.9 114.5 245.3 211.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M246.5 209.4Q127.6 212.2 8.7 209.5M246.4 209.7Q127.1 208.2 7.8 210.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 211.0Q10.0 114.3 10.1 17.7M10.2 210.9Q8.5 115.1 9.1 19.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="127.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Code replication</text><text x="127.5" y="99.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">copy code into each service</text><text x="127.5" y="121.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">keeps bounded context</text><text x="127.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">hard to change, inconsistent</text><text x="127.5" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">for static one-off code</text><path d="M256.1 19.9L492.2 19.7L492.7 209.7L258.0 209.8Z" fill="#d6e1cf" stroke="none"/><path d="M255.4 19.3Q374.2 20.9 493.0 19.1M254.7 19.3Q374.1 21.7 493.5 19.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.9 17.9Q493.6 114.6 491.3 211.3M491.2 18.5Q490.8 114.5 492.4 210.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M493.3 209.5Q374.1 210.0 254.9 209.1M492.9 210.2Q373.9 211.3 254.9 210.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M257.2 212.1Q259.7 115.5 257.3 18.9M256.8 212.0Q255.2 115.2 256.0 18.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="374.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Shared library</text><text x="374.5" y="99.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">JAR, DLL, GEM at compile time</text><text x="374.5" y="121.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">versionable, no runtime cost</text><text x="374.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">dependency and version pain</text><text x="374.5" y="165.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">homogeneous, low-moderate change</text><path d="M505.1 19.0L739.3 20.4L739.5 208.8L503.4 211.1Z" fill="#d0dfdc" stroke="none"/><path d="M502.4 19.4Q621.5 21.4 740.6 19.4M503.6 20.2Q621.5 20.6 739.5 20.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M739.9 19.2Q740.9 114.8 739.3 210.5M740.1 17.5Q737.6 114.0 738.8 210.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M740.1 209.6Q621.0 211.6 502.0 210.0M741.1 209.3Q621.7 208.6 502.4 209.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.6 211.3Q506.0 115.2 504.1 19.1M503.5 212.4Q503.6 115.1 504.0 17.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="621.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Shared service</text><text x="621.5" y="99.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">runtime call to a service</text><text x="621.5" y="121.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">good for volatile code, polyglot</text><text x="621.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">latency, scale, fault risk</text><text x="621.5" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">runtime change risk</text><path d="M750.3 20.1L987.1 20.8L987.1 211.1L750.7 208.8Z" fill="#d3dbe0" stroke="none"/><path d="M749.5 20.8Q868.1 22.0 986.6 20.5M748.6 20.4Q867.9 22.4 987.1 20.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M985.9 18.1Q987.3 114.9 986.5 211.8M986.0 19.0Q986.6 114.8 985.1 210.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M988.0 210.4Q869.1 209.3 750.3 209.1M987.7 210.0Q868.5 208.7 749.3 209.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M750.9 212.0Q752.5 114.7 751.3 17.5M752.0 211.4Q753.1 115.4 750.0 19.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="868.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Sidecar / service mesh</text><text x="868.5" y="99.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">operational coupling only</text><text x="868.5" y="121.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">monitoring, logging, discovery,</text><text x="868.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">authentication, authorization</text><text x="868.5" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">sidecar per platform</text><path d="M9.1 234.1L989.6 234.3L989.6 335.2L9.4 335.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 234.3Q499.8 236.0 991.8 234.3M9.1 234.1Q500.1 237.8 991.2 235.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 234.4Q991.7 285.4 989.4 336.3M990.1 233.9Q990.7 285.2 990.0 336.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 335.6Q500.2 334.2 8.1 334.5M992.5 334.0Q500.2 334.8 7.9 334.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 336.0Q10.9 284.9 11.0 233.7M10.3 335.5Q10.2 284.3 9.6 233.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="280.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Four code-reuse techniques for distributed architectures. Each preserves or breaks something:</text><text x="500.0" y="302.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">bounded context, agility, runtime characteristics (performance, scalability, availability) or consistent governance</text></svg>