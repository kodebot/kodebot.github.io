<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="380" fill="#fbf7ef"/><path d="M21.1 20.0L325.3 20.4L323.9 240.3L20.7 239.2Z" fill="#eed5cc" stroke="none"/><path d="M18.5 20.0Q172.6 20.0 326.8 19.6M19.5 20.4Q173.0 19.6 326.5 20.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M325.8 18.3Q324.2 129.7 325.0 241.2M324.9 17.9Q326.9 129.5 325.3 241.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M326.5 239.4Q172.6 242.2 18.7 239.5M326.4 239.7Q172.1 238.2 17.8 240.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 241.0Q20.0 129.3 20.1 17.7M20.2 240.9Q18.5 130.1 19.1 19.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="172.5" y="81.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Background synchronization</text><text x="172.5" y="103.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">external batch or periodic process</text><text x="172.5" y="125.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">slowest consistency, good response</text><text x="172.5" y="147.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">couples every data source,</text><text x="172.5" y="169.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">breaks bounded contexts,</text><text x="172.5" y="191.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">duplicates business logic</text><path d="M344.1 19.9L650.2 19.7L650.7 239.7L346.0 239.8Z" fill="#efe0ca" stroke="none"/><path d="M343.4 19.3Q497.2 20.9 651.0 19.1M342.7 19.3Q497.1 21.7 651.5 19.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.9 17.9Q651.6 129.6 649.3 241.3M649.2 18.5Q648.8 129.5 650.4 240.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.3 239.5Q497.1 240.0 342.9 239.1M650.9 240.2Q496.9 241.3 342.9 240.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M345.2 242.1Q347.7 130.5 345.3 18.9M344.8 242.0Q343.2 130.2 344.0 18.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="497.5" y="81.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Orchestrated request-based</text><text x="497.5" y="103.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">orchestrator drives all updates</text><text x="497.5" y="125.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">while the user waits</text><text x="497.5" y="147.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">favours consistency over response</text><text x="497.5" y="169.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">complex error handling,</text><text x="497.5" y="191.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">compensating transactions</text><path d="M671.1 19.0L975.3 20.4L975.5 238.8L669.4 241.1Z" fill="#d6e1cf" stroke="none"/><path d="M668.4 19.4Q822.5 21.4 976.6 19.4M669.6 20.2Q822.5 20.6 975.5 20.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M975.9 19.2Q976.9 129.8 975.3 240.5M976.1 17.5Q973.6 129.0 974.8 240.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M976.1 239.6Q822.0 241.6 668.0 240.0M977.1 239.3Q822.7 238.6 668.4 239.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 241.3Q672.0 130.2 670.1 19.1M669.5 242.4Q669.6 130.1 670.0 17.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="822.5" y="81.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event-based</text><text x="822.5" y="103.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">publish an event or command</text><text x="822.5" y="125.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">to a topic or stream</text><text x="822.5" y="147.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">decoupled, fast, short window</text><text x="822.5" y="169.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">complex error handling,</text><text x="822.5" y="191.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">durable subscribers and DLQ</text><path d="M19.3 260.1L981.1 260.8L981.1 361.1L19.7 358.8Z" fill="#f1ede5" stroke="none"/><path d="M18.5 260.8Q499.6 262.0 980.6 260.5M17.6 260.4Q499.4 262.4 981.1 260.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 258.1Q981.1 309.9 980.5 361.8M980.0 259.0Q980.4 309.8 979.1 360.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 360.4Q500.6 359.3 19.3 359.1M981.7 360.0Q500.0 358.7 18.3 359.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 362.0Q21.2 309.7 20.3 257.5M21.0 361.4Q21.7 310.4 19.0 259.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="305.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Unsubscribe example: profile row removed at once; contract and billing rows follow later (nightly batch), within</text><text x="500.0" y="327.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">the request (about 2 s via orchestrator), or by consuming the event in parallel. All three trade timeliness, coupling and error handling</text></svg>