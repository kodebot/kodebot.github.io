<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M21.1 20.0L495.3 20.4L493.9 185.3L20.7 184.2Z" fill="#d3dbe0" stroke="none"/><path d="M18.5 20.0Q257.6 20.0 496.8 19.6M19.5 20.4Q258.0 19.6 496.5 20.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 18.3Q494.2 102.2 495.0 186.2M494.9 17.9Q496.9 102.0 495.3 186.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 184.4Q257.6 187.2 18.7 184.5M496.4 184.7Q257.1 183.2 17.8 185.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 186.0Q20.0 101.8 20.1 17.7M20.2 185.9Q18.5 102.6 19.1 19.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="257.5" y="75.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Table split</text><text x="257.5" y="97.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">split into two tables, one owner each</text><text x="257.5" y="119.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ keeps bounded context, no shared tables</text><text x="257.5" y="141.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">- sync between tables, consistency issues</text><path d="M504.1 19.9L980.2 19.7L980.7 184.7L506.0 184.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 19.3Q742.2 20.9 981.0 19.1M502.7 19.3Q742.1 21.7 981.5 19.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 17.9Q981.6 102.1 979.3 186.3M979.2 18.5Q978.8 102.0 980.4 185.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 184.5Q742.1 185.0 502.9 184.1M980.9 185.2Q741.9 186.3 502.9 185.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 187.1Q507.7 103.0 505.3 18.9M504.8 187.0Q503.2 102.7 504.0 18.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="742.5" y="75.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Data domain</text><text x="742.5" y="97.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">services share a schema (broader context)</text><text x="742.5" y="119.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ fast, consistent, independent</text><text x="742.5" y="141.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">- schema changes involve more services</text><path d="M21.1 199.0L495.3 200.4L495.5 363.8L19.4 366.1Z" fill="#efe0ca" stroke="none"/><path d="M18.4 199.4Q257.5 201.4 496.6 199.4M19.6 200.2Q257.5 200.6 495.5 200.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 199.2Q496.9 282.3 495.3 365.5M496.1 197.5Q493.6 281.5 494.8 365.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 364.6Q257.0 366.6 18.0 365.0M497.1 364.3Q257.7 363.6 18.4 364.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.6 366.3Q22.0 282.7 20.1 199.1M19.5 367.4Q19.6 282.6 20.0 197.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="257.5" y="255.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Delegate</text><text x="257.5" y="277.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">one service owns, others call it</text><text x="257.5" y="299.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ one owner, abstracted structure</text><text x="257.5" y="321.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">- coupling, latency, no atomic write</text><path d="M504.3 200.1L981.1 200.8L981.1 366.1L504.7 363.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.5 200.8Q742.1 202.0 980.6 200.5M502.6 200.4Q741.9 202.4 981.1 200.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 198.1Q981.3 282.4 980.5 366.8M980.0 199.0Q980.6 282.3 979.1 365.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 365.4Q743.1 364.3 504.3 364.1M981.7 365.0Q742.5 363.7 503.3 364.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 367.0Q506.5 282.2 505.3 197.5M506.0 366.4Q507.1 282.9 504.0 199.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="742.5" y="255.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Service consolidation</text><text x="742.5" y="277.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">merge the owners into one service</text><text x="742.5" y="299.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ ACID kept, good performance</text><text x="742.5" y="321.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">- coarser scale, less fault tolerance</text><text x="500" y="392" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">Joint ownership techniques (Tables 9-1 to 9-4)</text></svg>