<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="360" fill="#fbf7ef"/><path d="M21.1 20.0L325.3 20.4L323.9 190.3L20.7 189.2Z" fill="#d6e1cf" stroke="none"/><path d="M18.5 20.0Q172.6 20.0 326.8 19.6M19.5 20.4Q173.0 19.6 326.5 20.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M325.8 18.3Q324.2 104.7 325.0 191.2M324.9 17.9Q326.9 104.5 325.3 191.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M326.5 189.4Q172.6 192.2 18.7 189.5M326.4 189.7Q172.1 188.2 17.8 190.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 191.0Q20.0 104.3 20.1 17.7M20.2 190.9Q18.5 105.1 19.1 19.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="172.5" y="78.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Single ownership</text><text x="172.5" y="100.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one service writes the table</text><text x="172.5" y="122.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Wishlist Service owns Wishlist</text><text x="172.5" y="144.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">resolve these first</text><path d="M344.1 19.9L650.2 19.7L650.7 189.7L346.0 189.8Z" fill="#efe0ca" stroke="none"/><path d="M343.4 19.3Q497.2 20.9 651.0 19.1M342.7 19.3Q497.1 21.7 651.5 19.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.9 17.9Q651.6 104.6 649.3 191.3M649.2 18.5Q648.8 104.5 650.4 190.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.3 189.5Q497.1 190.0 342.9 189.1M650.9 190.2Q496.9 191.3 342.9 190.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M345.2 192.1Q347.7 105.5 345.3 18.9M344.8 192.0Q343.2 105.2 344.0 18.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="497.5" y="67.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Common ownership</text><text x="497.5" y="89.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">most or all services write it</text><text x="497.5" y="111.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(the Audit table)</text><text x="497.5" y="133.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">dedicated Audit Service owns it;</text><text x="497.5" y="155.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">others send persisted-queue messages</text><path d="M671.1 19.0L975.3 20.4L975.5 188.8L669.4 191.1Z" fill="#eed5cc" stroke="none"/><path d="M668.4 19.4Q822.5 21.4 976.6 19.4M669.6 20.2Q822.5 20.6 975.5 20.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M975.9 19.2Q976.9 104.8 975.3 190.5M976.1 17.5Q973.6 104.0 974.8 190.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M976.1 189.6Q822.0 191.6 668.0 190.0M977.1 189.3Q822.7 188.6 668.4 189.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 191.3Q672.0 105.2 670.1 19.1M669.5 192.4Q669.6 105.1 670.0 17.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="822.5" y="67.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Joint ownership</text><text x="822.5" y="89.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a few services in one domain</text><text x="822.5" y="111.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">write it (Product table:</text><text x="822.5" y="133.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Catalog and Inventory)</text><text x="822.5" y="155.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">four techniques</text><path d="M19.3 215.1L981.1 215.8L981.1 336.1L19.7 333.8Z" fill="#f1ede5" stroke="none"/><path d="M18.5 215.8Q499.6 217.0 980.6 215.5M17.6 215.4Q499.4 217.4 981.1 215.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 213.1Q981.3 274.9 980.5 336.8M980.0 214.0Q980.6 274.8 979.1 335.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 335.4Q500.6 334.3 19.3 334.1M981.7 335.0Q500.0 333.7 18.3 334.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 337.0Q21.4 274.7 20.3 212.5M21.0 336.4Q22.0 275.4 19.0 214.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="259.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Rule of thumb: the service that writes a table owns it; read-only access does not make an owner</text><text x="500.0" y="281.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Do not just put a common table in a shared schema: it brings back change control, connection starvation,</text><text x="500.0" y="303.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">scalability and fault tolerance problems (chapter 6)</text></svg>