<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M21.1 20.0L490.3 20.4L488.9 60.3L20.7 59.2Z" fill="#d6e1cf" stroke="none"/><path d="M18.5 20.0Q255.1 20.0 491.8 19.6M19.5 20.4Q255.5 19.6 491.5 20.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 18.3Q489.8 39.7 490.0 61.2M489.9 17.9Q491.0 39.5 490.3 61.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 59.4Q255.1 62.2 18.7 59.5M491.4 59.7Q254.6 58.2 17.8 60.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 61.0Q20.3 39.3 20.1 17.7M20.2 60.9Q19.1 40.1 19.1 19.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Replicated cache: strengths</text><path d="M19.1 69.9L490.2 69.7L490.7 199.7L21.0 199.8Z" fill="#f1ede5" stroke="none"/><path d="M18.4 69.3Q254.7 70.9 491.0 69.1M17.7 69.3Q254.6 71.7 491.5 69.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 67.9Q491.6 134.6 489.3 201.3M489.2 68.5Q488.8 134.5 490.4 200.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 199.5Q254.6 200.0 17.9 199.1M490.9 200.2Q254.4 201.3 17.9 200.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.2 202.1Q22.7 135.5 20.3 68.9M19.8 202.0Q18.2 135.2 19.0 68.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="108.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Fastest access to data you do not own</text><text x="255.0" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Catalog Service can go down once the cache is loaded</text><text x="255.0" y="152.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Wishlist scales independently</text><text x="255.0" y="174.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Ownership preserved: only Catalog writes</text><path d="M511.1 19.0L980.3 20.4L980.5 58.8L509.4 61.1Z" fill="#eed5cc" stroke="none"/><path d="M508.4 19.4Q745.0 21.4 981.6 19.4M509.6 20.2Q745.0 20.6 980.5 20.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 19.2Q981.3 39.8 980.3 60.5M981.1 17.5Q979.6 39.0 979.8 60.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 59.6Q744.5 61.6 508.0 60.0M982.1 59.3Q745.2 58.6 508.4 59.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 61.3Q511.1 40.2 510.1 19.1M509.5 62.4Q509.7 40.1 510.0 17.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Replicated cache: trade-offs</text><path d="M509.3 70.1L981.1 70.8L981.1 201.1L509.7 198.8Z" fill="#f1ede5" stroke="none"/><path d="M508.5 70.8Q744.6 72.0 980.6 70.5M507.6 70.4Q744.4 72.4 981.1 70.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 68.1Q981.3 134.9 980.5 201.8M980.0 69.0Q980.6 134.8 979.1 200.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 200.4Q745.6 199.3 509.3 199.1M981.7 200.0Q745.0 198.7 508.3 199.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.9 202.0Q511.5 134.7 510.3 67.5M511.0 201.4Q512.1 135.4 509.0 69.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="108.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">First instance needs the owner running (startup wait)</text><text x="745.0" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">High data volumes (over about 500 MB) hurt</text><text x="745.0" y="152.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">High update rates cannot stay in sync (inventory)</text><text x="745.0" y="174.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Cloud and container configuration can be hard</text><path d="M19.1 219.1L979.6 219.3L979.6 315.2L19.4 315.1Z" fill="#f1ede5" stroke="none"/><path d="M17.7 219.3Q499.8 221.0 981.8 219.3M19.1 219.1Q500.1 222.8 981.2 220.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.0 219.4Q981.6 267.9 979.4 316.3M980.1 218.9Q980.7 267.7 980.0 316.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.4 315.6Q500.2 314.2 18.1 314.5M982.5 314.0Q500.2 314.8 17.9 314.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 316.0Q20.9 267.4 21.0 218.7M20.3 315.5Q20.2 266.8 19.6 218.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="262.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Suits relatively static data such as product descriptions. Discovery uses TCP/IP broadcasts and lookups,</text><text x="500.0" y="284.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">so a wide range slows the handshake and dynamic cloud IP addresses make it harder</text></svg>