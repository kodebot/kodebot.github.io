.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Choreography looks simpler on the happy path, but each error scenario adds communication links that the happy path did not need</text><text x="500.0" y="282.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Semantic coupling (the domain&#x27;s inherent workflow) cannot be reduced by implementation, only made worse</text></svg>