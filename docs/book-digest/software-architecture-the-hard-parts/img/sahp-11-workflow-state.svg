<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M21.1 20.0L325.3 20.4L323.9 210.3L20.7 209.2Z" fill="#efe0ca" stroke="none"/><path d="M18.5 20.0Q172.6 20.0 326.8 19.6M19.5 20.4Q173.0 19.6 326.5 20.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M325.8 18.3Q324.2 114.7 325.0 211.2M324.9 17.9Q326.9 114.5 325.3 211.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M326.5 209.4Q172.6 212.2 18.7 209.5M326.4 209.7Q172.1 208.2 17.8 210.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 211.0Q20.0 114.3 20.1 17.7M20.2 210.9Q18.5 115.1 19.1 19.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="172.5" y="88.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Front controller</text><text x="172.5" y="110.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">first service owns workflow state</text><text x="172.5" y="132.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ order state trivial to query</text><text x="172.5" y="154.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">- more state and chatter, slower, harder</text><path d="M344.1 19.9L650.2 19.7L650.7 209.7L346.0 209.8Z" fill="#d0dfdc" stroke="none"/><path d="M343.4 19.3Q497.2 20.9 651.0 19.1M342.7 19.3Q497.1 21.7 651.5 19.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.9 17.9Q651.6 114.6 649.3 211.3M649.2 18.5Q648.8 114.5 650.4 210.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.3 209.5Q497.1 210.0 342.9 209.1M650.9 210.2Q496.9 211.3 342.9 210.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M345.2 212.1Q347.7 115.5 345.3 18.9M344.8 212.0Q343.2 115.2 344.0 18.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="497.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Stateless choreography</text><text x="497.5" y="99.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">no transient state anywhere;</text><text x="497.5" y="121.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">query each service on demand</text><text x="497.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ fast, scalable, very decoupled</text><text x="497.5" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">- state built on the fly, costly</text><path d="M671.1 19.0L975.3 20.4L975.5 208.8L669.4 211.1Z" fill="#d6e1cf" stroke="none"/><path d="M668.4 19.4Q822.5 21.4 976.6 19.4M669.6 20.2Q822.5 20.6 975.5 20.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M975.9 19.2Q976.9 114.8 975.3 210.5M976.1 17.5Q973.6 114.0 974.8 210.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M976.1 209.6Q822.0 211.6 668.0 210.0M977.1 209.3Q822.7 208.6 668.4 209.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 211.3Q672.0 115.2 670.1 19.1M669.5 212.4Q669.6 115.1 670.0 17.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="822.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Stamp coupling</text><text x="822.5" y="99.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">workflow state travels in the message</text><text x="822.5" y="121.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ no state owner, no extra queries</text><text x="822.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">- bigger contracts, no just-in-time</text><text x="822.5" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">status query</text><path d="M19.3 235.1L981.1 235.8L981.1 316.1L19.7 313.8Z" fill="#f1ede5" stroke="none"/><path d="M18.5 235.8Q499.6 237.0 980.6 235.5M17.6 235.4Q499.4 237.4 981.1 235.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 233.1Q981.0 274.9 980.5 316.8M980.0 234.0Q980.3 274.8 979.1 315.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 315.4Q500.6 314.3 19.3 314.1M981.7 315.0Q500.0 313.7 18.3 314.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 317.0Q21.1 274.7 20.3 232.5M21.0 316.4Q21.5 275.4 19.0 234.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="270.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Options for who holds workflow state when there is no orchestrator (Tables 11-2 to 11-4).</text><text x="500.0" y="292.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Orchestrated solutions normally keep it in the orchestrator (some use stateless orchestrators for scale)</text></svg>