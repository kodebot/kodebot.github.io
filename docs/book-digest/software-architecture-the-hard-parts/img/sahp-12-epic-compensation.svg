middle">the expert is told to retry</text><path d="M509.1 99.1L989.6 99.3L989.6 200.2L509.4 200.1Z" fill="#eed5cc" stroke="none"/><path d="M507.7 99.3Q749.8 101.0 991.8 99.3M509.1 99.1Q750.1 102.8 991.2 100.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 99.4Q991.7 150.4 989.4 201.3M990.1 98.9Q990.7 150.2 990.0 201.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 200.6Q750.2 199.2 508.1 199.5M992.5 199.0Q750.2 199.8 507.9 199.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.9 201.0Q510.9 149.9 511.0 98.7M510.3 200.5Q510.2 149.3 509.6 98.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="134.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Side effect: Ticket Service already queued data;</text><text x="750.0" y="156.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Analytics Service has processed it (no isolation),</text><text x="750.0" y="178.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">so the compensation cannot undo that</text><path d="M9.5 219.2L489.1 220.5L490.6 314.4L9.8 316.2Z" fill="#eed5cc" stroke="none"/><path d="M8.0 219.5Q250.2 216.6 492.4 220.0M7.8 220.6Q250.1 221.6 492.4 220.2" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.0 217.6Q490.1 267.6 490.3 317.5M490.0 218.5Q488.7 267.7 490.9 317.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 315.9Q250.1 312.3 8.9 314.2M491.4 314.3Q250.2 311.8 9.0 315.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 317.5Q12.5 267.8 9.3 218.2M9.8 317.3Q12.0 267.8 9.7 218.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="262.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Compensation can fail: the ticket stays &#x27;complete&#x27;,</text><text x="250.0" y="284.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">a retry gives &#x27;already complete&#x27;, the user is confused</text><path d="M511.0 219.5L990.5 219.4L989.4 316.1L508.8 314.1Z" fill="#efe0ca" stroke="none"/><path d="M508.7 218.9Q749.6 216.7 990.6 219.7M509.2 220.4Q750.8 219.5 992.4 220.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 218.5Q987.8 267.9 989.0 317.3M990.6 218.4Q991.0 267.6 990.7 316.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 314.2Q750.4 314.3 508.2 315.1M990.6 314.0Q750.0 316.3 509.4 314.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.8 316.2Q511.2 267.7 510.5 219.3M509.9 315.7Q508.4 266.6 508.9 217.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="262.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">The user waits for all corrective action, and is</text><text x="750.0" y="284.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">semantically coupled to a survey they should not care about</text></svg>