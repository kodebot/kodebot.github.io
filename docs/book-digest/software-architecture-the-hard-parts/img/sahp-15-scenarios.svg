="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 183.1Q981.3 247.4 980.5 311.8M980.0 184.0Q980.6 247.3 979.1 310.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 310.4Q500.6 309.3 19.3 309.1M981.7 310.0Q500.0 308.7 18.3 309.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 312.0Q21.4 247.2 20.3 182.5M21.0 311.4Q22.0 247.9 19.0 184.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="231.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Bottom line for stakeholders: performance and data consistency (single payment service) or</text><text x="500.0" y="253.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">extensibility and agility (separate services)? Reduce the analysis to a few points and a plain choice,</text><text x="500.0" y="275.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">not to all the technical detail gathered</text></svg>