<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 260" width="990" height="260" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="990" height="260" fill="#ffffff"/><rect x="20" y="30" width="170" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="105.0" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Caller</text><text x="105.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">calls publishComment()</text><line x1="190" y1="70" x2="215" y2="70" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="215" y="30" width="170" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="300.0" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Aspect log()</text><text x="300.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">logs &#x27;will execute&#x27;</text><line x1="385" y1="70" x2="410" y2="70" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="410" y="30" width="170" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="495.0" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">proceed()</text><text x="495.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">calls the real method</text><line x1="580" y1="70" x2="605" y2="70" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="605" y="30" width="170" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="690.0" y="65.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Real method</text><text x="690.0" y="85.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">publishComment() runs</text><line x1="775" y1="70" x2="800" y2="70" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="800" y="30" width="170" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="885.0" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Aspect again</text><text x="885.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">logs &#x27;executed&#x27;</text><rect x="300" y="160" width="420" height="80" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="510.0" y="195.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Skip proceed() and the real method never runs</text><text x="510.0" y="215.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">the caller does not notice (e.g. authorization says no)</text><line x1="505" y1="110" x2="505" y2="160" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/></svg>