<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 150" width="1020" height="150" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1020" height="150" fill="#ffffff"/><rect x="20" y="25" width="220" height="100" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="130.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Constructor</text><text x="130.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Spring creates the object</text><line x1="240" y1="75" x2="270" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="270" y="25" width="220" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="380.0" y="70.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">@PostConstruct</text><text x="380.0" y="90.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">runs after the constructor</text><line x1="490" y1="75" x2="520" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="520" y="25" width="220" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="630.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Bean in use</text><text x="630.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">the app works with it</text><line x1="740" y1="75" x2="770" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="770" y="25" width="220" height="100" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="880.0" y="60.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">@PreDestroy</text><text x="880.0" y="80.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">before the context closes</text><text x="880.0" y="100.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">(not guaranteed)</text></svg>