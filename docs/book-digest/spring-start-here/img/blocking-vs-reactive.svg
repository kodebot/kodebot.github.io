<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><rect x="20" y="20" width="470" height="360" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="54" font-size="16" font-weight="700" fill="#14324f">Blocking: one thread per request</text><rect x="45" y="60" width="420" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="255.0" y="90.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">1 receive user id</text><line x1="255" y1="110" x2="255" y2="122" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="45" y="122" width="420" height="50" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="255.0" y="142.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">2 ask: other credits?</text><text x="255.0" y="162.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">thread waits</text><line x1="255" y1="172" x2="255" y2="184" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="45" y="184" width="420" height="50" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="255.0" y="204.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">3 internal debt</text><text x="255.0" y="224.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">thread waits</text><line x1="255" y1="234" x2="255" y2="246" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="45" y="246" width="420" height="50" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="255.0" y="266.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">4 external debt</text><text x="255.0" y="286.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">thread waits</text><line x1="255" y1="296" x2="255" y2="308" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="45" y="308" width="420" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="255.0" y="338.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">5 sum and respond</text><rect x="510" y="20" width="450" height="360" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="532" y="54" font-size="16" font-weight="700" fill="#14324f">Reactive: tasks with dependencies</text><rect x="560" y="70" width="350" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="735.0" y="100.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">A: receive user id</text><rect x="540" y="170" width="190" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="635.0" y="195.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">B: other credits?</text><text x="635.0" y="215.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">independent</text><rect x="750" y="170" width="190" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="845.0" y="195.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">C: internal debt</text><text x="845.0" y="215.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">independent</text><rect x="560" y="280" width="350" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="735.0" y="310.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">D: sum  (waits for B and C)</text><line x1="735" y1="120" x2="635" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="735" y1="120" x2="845" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="635" 