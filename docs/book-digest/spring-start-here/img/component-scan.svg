<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="180" fill="#ffffff"/><rect x="30" y="40" width="250" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="155.0" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">1. @Component</text><text x="155.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">on the class</text><text x="155.0" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">you want as a bean</text><rect x="325" y="40" width="250" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="450.0" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">2. @ComponentScan</text><text x="450.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">on the config class</text><text x="450.0" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">tells Spring where to look</text><rect x="620" y="40" width="250" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="745.0" y="75.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Result</text><text x="745.0" y="95.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">Spring creates the instance</text><text x="745.0" y="115.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">and adds it to the context</text><line x1="280" y1="90" x2="325" y2="90" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="575" y1="90" x2="620" y2="90" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/></svg>