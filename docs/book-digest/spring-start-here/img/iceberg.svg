<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f3fb"/><stop offset="1" stop-color="#f7fbfe"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9fd0"/><stop offset="1" stop-color="#16456d"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9f7"/><stop offset="1" stop-color="#8fc3e3"/>
    </linearGradient>
  </defs>
  <rect width="760" height="470" fill="url(#sky)"/>
  <rect y="150" width="760" height="320" fill="url(#sea)"/>
  <!-- submerged mass -->
  <polygon points="215,150 425,150 505,205 520,290 470,365 360,425 235,395 165,320 150,235" fill="url(#deep)" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
  <!-- tip -->
  <polygon points="320,28 372,98 425,150 215,150 262,92" fill="#ffffff" stroke="#9fc4dc" stroke-width="2"/>
  <polygon points="320,28 372,98 425,150 340,150" fill="#e6f1f8"/>
  <!-- waterline -->
  <line x1="0" y1="150" x2="760" y2="150" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- tip label -->
  <line x1="372" y1="98" x2="470" y2="70" stroke="#27536f" stroke-width="1.5"/>
  <circle cx="372" cy="98" r="3.5" fill="#27536f"/>
  <text x="476" y="60" font-size="16" font-weight="700" fill="#17384f">Business logic</text>
  <text x="476" y="80" font-size="13" fill="#27536f">what users see and expect:</text>
  <text x="476" y="98" font-size="13" fill="#27536f">"click link → invoice generated"</text>
  <text x="476" y="122" font-size="13" font-weight="600" fill="#17384f">You write this (small part)</text>
  <!-- waterline label -->
  <text x="18" y="142" font-size="12" fill="#27536f">visible to users</text>
  <text x="18" y="170" font-size="12" fill="#e6f4fb">hidden underwater</text>
  <!-- submerged label -->
  <text x="330" y="188" font-size="16" font-weight="700" fill="#0f3550" text-anchor="middle">"Plumbing"</text>
  <text x="330" y="206" font-size="12" fill="#27536f" text-anchor="middle">provided by the framework (dependencies)</text>
  <g font-size="14" fill="#0f3550" text-anchor="middle">
    <text x="330" y="240">Security</text>
    <text x="330" y="266">Logging</text>
    <text x="330" y="292">Transactions (data consistency)</text>
    <text x="330" y="318">Caching</text>
    <text x="330" y="344">App-to-app communication</text>
    <text x="330" y="370">Data storage · vulnerability protection</text>
  </g>
  <text x="640" y="300" font-size="13" fill="#e6f4fb" text-anchor="middle">Most of the app</text>
  <text x="640" y="318" font-size="13" fill="#e6f4fb" text-anchor="middle">lives down here</text>
</svg>
