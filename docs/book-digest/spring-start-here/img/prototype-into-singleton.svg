<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="330" fill="#ffffff"/><rect x="20" y="20" width="450" height="290" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="54" font-size="16" font-weight="700" fill="#14324f">Wrong: inject the prototype</text><rect x="40" y="100" width="170" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="125.0" y="130.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">CommentService</text><text x="125.0" y="150.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">singleton</text><rect x="320" y="100" width="130" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="385.0" y="130.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Processor</text><text x="385.0" y="150.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">ONE instance</text><line x1="210" y1="135" x2="320" y2="135" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="265.0" y="122" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">injected once</text><rect x="45" y="215" width="395" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="242.5" y="245.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Every sendComment() call shares it:</text><text x="242.5" y="265.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">race conditions are back</text><rect x="490" y="20" width="450" height="290" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="512" y="54" font-size="16" font-weight="700" fill="#14324f">Right: ask the context per call</text><rect x="510" y="100" width="170" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="595.0" y="130.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">CommentService</text><text x="595.0" y="150.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">holds the context</text><rect x="730" y="100" width="190" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="825.0" y="130.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">ApplicationContext</text><text x="825.0" y="150.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">getBean(...)</text><line x1="680" y1="135" x2="730" y2="135" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="510" y="215" width="410" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="715.0" y="245.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">A NEW CommentProcessor per call</text><text x="715.0" y="265.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">safe to mutate</text><line x1="825" y1="170" x2="825" y2="215" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="837" y="198" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">new instance</text></svg>