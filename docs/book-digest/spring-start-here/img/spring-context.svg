<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <!-- outer: app memory -->
  <rect x="20" y="20" width="580" height="290" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/>
  <text x="44" y="54" font-size="17" font-weight="700" fill="#14324f">Your app memory</text>
  <!-- plain object -->
  <rect x="44" y="110" width="150" height="86" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/>
  <text x="119" y="144" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">new Parrot()</text>
  <text x="119" y="165" font-size="13" fill="#5c4007" text-anchor="middle">plain object</text>
  <text x="119" y="183" font-size="13" fill="#5c4007" text-anchor="middle">invisible to Spring</text>
  <!-- inner: spring context -->
  <rect x="228" y="76" width="352" height="214" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/>
  <text x="250" y="108" font-size="16" font-weight="700" fill="#14324f">Spring context (IoC container)</text>
  <rect x="254" y="130" width="300" height="64" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/>
  <text x="404" y="158" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">bean 'parrot'</text>
  <text x="404" y="178" font-size="13" fill="#134a26" text-anchor="middle">managed by Spring</text>
  <rect x="254" y="212" width="300" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/>
  <text x="404" y="246" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">bean 'hello'</text>
  <!-- arrow to capabilities -->
  <line x1="554" y1="162" x2="696" y2="162" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/>
  <text x="640" y="146" font-size="12" fill="#14324f" text-anchor="middle">Spring plugs</text>
  <text x="640" y="182" font-size="12" fill="#14324f" text-anchor="middle">in features</text>
  <rect x="700" y="116" width="180" height="92" rx="10" fill="#14324f"/>
  <text x="790" y="150" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Framework</text>
  <text x="790" y="170" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">capabilities</text>
  <text x="790" y="192" font-size="12" fill="#cfe0f0" text-anchor="middle">DI, AOP, transactions…</text>
</svg>
