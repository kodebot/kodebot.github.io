<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="380" fill="#ffffff"/><rect x="300" y="20" width="380" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="490.0" y="50.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Your repositories</text><text x="490.0" y="70.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">interfaces only, no SQL classes</text><rect x="240" y="130" width="500" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="490.0" y="160.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Spring Data</text><text x="490.0" y="180.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">one common abstraction (umbrella project)</text><line x1="490" y1="90" x2="490" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="250" width="220" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="130.0" y="280.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Spring Data JDBC</text><text x="130.0" y="300.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">plain JDBC</text><line x1="490" y1="200" x2="130" y2="250" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="260" y="250" width="220" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="370.0" y="280.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Spring Data JPA</text><text x="370.0" y="300.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Hibernate</text><line x1="490" y1="200" x2="370" y2="250" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="500" y="250" width="220" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="610.0" y="280.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Spring Data MongoDB</text><text x="610.0" y="300.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">NoSQL</text><line x1="490" y1="200" x2="610" y2="250" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="740" y="250" width="220" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="850.0" y="280.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Spring Data Redis</text><text x="850.0" y="300.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">NoSQL</text><line x1="490" y1="200" x2="850" y2="250" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="335" width="940" height="36" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="358.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Each module is its own Maven dependency: there is no single &#x27;spring-data&#x27; dependency</text></svg>