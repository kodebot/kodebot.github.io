<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" width="980" height="280" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="280" fill="#ffffff"/><rect x="20" y="90" width="160" height="80" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="100.0" y="125.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Transaction</text><text x="100.0" y="145.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">begins</text><rect x="220" y="90" width="200" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="320.0" y="125.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Step 1</text><text x="320.0" y="145.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">withdraw</text><rect x="460" y="90" width="200" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="560.0" y="125.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Step 2</text><text x="560.0" y="145.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">deposit</text><line x1="180" y1="130" x2="220" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="420" y1="130" x2="460" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="740" y="20" width="220" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="850.0" y="50.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">COMMIT</text><text x="850.0" y="70.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">all steps succeeded:</text><text x="850.0" y="90.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">changes are persisted</text><rect x="740" y="160" width="220" height="90" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="850.0" y="190.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">ROLLBACK</text><text x="850.0" y="210.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">a runtime exception:</text><text x="850.0" y="230.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">data restored to the start</text><line x1="660" y1="115" x2="740" y2="65" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="700.0" y="82.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">success</text><line x1="660" y1="145" x2="740" y2="205" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="700.0" y="167.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">exception</text><rect x="20" y="205" width="640" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="340.0" y="238.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Atomicity: all the changes happen, or none of them do</text></svg>