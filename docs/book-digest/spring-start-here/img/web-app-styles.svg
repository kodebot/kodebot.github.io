<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="300" fill="#ffffff"/><rect x="20" y="20" width="450" height="260" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="54" font-size="16" font-weight="700" fill="#14324f">Server builds the page</text><rect x="45" y="100" width="150" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="120.0" y="140.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Browser</text><rect x="290" y="100" width="150" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="365.0" y="140.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Backend</text><line x1="195" y1="125" x2="290" y2="125" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="242.5" y="117.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">request</text><line x1="290" y1="150" x2="195" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="242.5" y="168" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">HTML, CSS, JS</text><rect x="45" y="200" width="395" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="242.5" y="233.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Browser shows exactly what it receives</text><rect x="490" y="20" width="450" height="260" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="512" y="54" font-size="16" font-weight="700" fill="#14324f">Frontend / backend separation</text><rect x="515" y="100" width="190" height="