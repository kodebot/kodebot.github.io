<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><rect x="30" y="30" width="330" height="72" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="195.0" y="61.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Do you own the class</text><text x="195.0" y="81.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">and need one instance?</text><rect x="480" y="30" width="390" height="72" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="675.0" y="61.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Stereotype annotation</text><text x="675.0" y="81.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">@Component + @ComponentScan</text><line x1="360" y1="66" x2="480" y2="66" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="420.0" y="58.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><rect x="30" y="170" width="330" height="72" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="195.0" y="201.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Need decision logic at runtime</text><text x="195.0" y="221.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">(if/else, loops over data)?</text><rect x="480" y="170" width="390" height="72" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="675.0" y="201.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">registerBean()</text><text x="675.0" y="221.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">programmatic registration</text><line x1="360" y1="206" x2="480" y2="206" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="420.0" y="198.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><line x1="195" y1="102" x2="195" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="207" y="140" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">no</text><rect x="30" y="305" width="560" height="72" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="310.0" y="336.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">@Bean method</text><text x="310.0" y="356.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">third-party types, many instances, custom setup</text><line x1="195" y1="242" x2="195" y2="305" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="207" y="278" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">no</text></svg>