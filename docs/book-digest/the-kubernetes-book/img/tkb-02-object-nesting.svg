<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="700" height="360" fill="#ffffff"/><rect x="20" y="20" width="660" height="320" rx="12" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="34" y="44" font-size="15" font-weight="700" fill="#5c4007" text-anchor="start">Deployment</text><text x="34" y="63" font-size="12" font-weight="400" fill="#5c4007" text-anchor="start">adds self-healing, scaling, rollouts</text><rect x="60" y="85" width="580" height="235" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="74" y="109" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Pod</text><text x="74" y="128" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">wraps the container so it runs on Kubernetes</text><rect x="100" y="150" width="500" height="150" rx="12" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="114" y="174" font-size="15" font-weight="700" fill="#134a26" text-anchor="start">Container</text><text x="114" y="193" font-size="12" font-weight="400" fill="#134a26" text-anchor="start">wraps the app and provides its dependencies</text><rect x="140" y="220" width="420" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="350.0" y="253.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Your application</text></svg>