<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="780" height="230" fill="#ffffff"/><rect x="30" y="50" width="160" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="110.0" y="75.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Pending</text><text x="110.0" y="95.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">no node yet</text><rect x="310" y="50" width="160" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="390.0" y="75.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Running</text><text x="390.0" y="95.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">all containers up</text><rect x="590" y="50" width="160" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="670.0" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Succeeded</text><text x="670.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">all containers done</text><line x1="190" y1="80" x2="310" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="250.0" y="70" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">scheduled, started</text><line x1="470" y1="80" x2="590" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="530.0" y="70" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">containers finish</text><text x="110" y="150" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">stays Pending if the scheduler</text><text x="110" y="167" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">finds no suitable node</text><text x="390" y="150" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">long-lived Pod (web server):</text><text x="390" y="167" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">stays Running indefinitely</text><text x="670" y="150" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">short-lived Pod (batch job)</text><text x="390" y="210" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">Pods are never restarted: a failed Pod is replaced by a new one</text></svg>