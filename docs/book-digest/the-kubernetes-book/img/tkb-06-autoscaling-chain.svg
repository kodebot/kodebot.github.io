<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="230" fill="#ffffff"/><rect x="20" y="50" width="160" height="72" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="100.0" y="91.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Demand rises</text><rect x="220" y="50" width="160" height="72" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="300.0" y="81.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">HPA</text><text x="300.0" y="101.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">asks for more Pods</text><rect x="420" y="50" width="160" height="72" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="500.0" y="71.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Scheduler</text><text x="500.0" y="91.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">no node has room:</text><text x="500.0" y="111.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">Pods Pending</text><rect x="620" y="50" width="160" height="72" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="700.0" y="81.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Cluster Autoscaler</text><text x="700.0" y="101.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">adds a node</text><rect x="820" y="50" width="160" height="72" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="900.0" y="71.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Scheduler</text><text x="900.0" y="91.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">places the</text><text x="900.0" y="111.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">pending Pods</text><line x1="180" y1="86.0" x2="220" y2="86.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="380" y1="86.0" x2="420" y2="86.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="580" y1="86.0" x2="620" y2="86.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="780" y1="86.0" x2="820" y2="86.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="180" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Scaling down runs in reverse: fewer Pods, then possibly fewer nodes</text></svg>