<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="700" height="340" fill="#ffffff"/><rect x="20" y="20" width="660" height="300" rx="12" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="34" y="44" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">LoadBalancer</text><text x="34" y="63" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">cloud load balancer on a low port</text><rect x="60" y="85" width="580" height="215" rx="12" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="74" y="109" font-size="15" font-weight="700" fill="#5c4007" text-anchor="start">NodePort</text><text x="74" y="128" font-size="12" font-weight="400" fill="#5c4007" text-anchor="start">a port (30000-32767) on every node</text><rect x="100" y="150" width="500" height="135" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="114" y="174" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">ClusterIP</text><text x="114" y="193" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">stable internal name, IP and port</text><rect x="140" y="215" width="420" height="48" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="350.0" y="234.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Pods</text><text x="350.0" y="254.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">chosen from the EndpointSlice</text></svg>