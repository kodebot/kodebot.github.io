<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 220" width="950" height="220" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="950" height="220" fill="#ffffff"/><rect x="20" y="60" width="150" height="76" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="95.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Pod</text><text x="95.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">runtimeClassName:</text><text x="95.0" y="123.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">rc-spin</text><rect x="210" y="60" width="150" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="285.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">RuntimeClass rc-spin</text><text x="285.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">nodeSelector wasm=yes</text><text x="285.0" y="123.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">handler: spin</text><rect x="400" y="60" width="150" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="475.0" y="83.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Scheduler</text><text x="475.0" y="103.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">filters on</text><text x="475.0" y="123.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">label wasm=yes</text><rect x="590" y="60" width="150" height="76" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="665.0" y="93.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Node agent-1</text><text x="665.0" y="113.0" font-size="13" font-weight="400" fill="