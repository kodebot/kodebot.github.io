<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="230" fill="#ffffff"/><rect x="20" y="40" width="200" height="86" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="120.0" y="68.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Storage providers</text><text x="120.0" y="88.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">EMC, NetApp,</text><text x="120.0" y="108.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">cloud storage</text><rect x="275" y="40" width="200" height="86" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="375.0" y="78.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">CSI plugin</text><text x="375.0" y="98.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Pods in kube-system</text><rect x="530" y="40" width="200" height="86" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="630.0" y="68.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Persistent volume</text><text x="630.0" y="88.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">subsystem</text><text x="630.0" y="108.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">PV, PVC, StorageClass</text><rect x="785" y="40" width="200" height="86" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="885.0" y="78.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Pod</text><text x="885.0" y="98.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">mounts the volume</text><line x1="220" y1="83.0" x2="275" y2="83.0" stroke=