<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 290" width="940" height="290" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="940" height="290" fill="#ffffff"/><rect x="20" y="20" width="190" height="80" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="115.0" y="45.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">1</text><text x="115.0" y="65.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">Create the Secret:</text><text x="115.0" y="85.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">unencrypted in the store</text><rect x="250" y="20" width="190" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="345.0" y="45.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">2</text><text x="345.0" y="65.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Schedule a Pod</text><text x="345.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">that uses the Secret</text><rect x="480" y="20" width="190" height="80" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="575.0" y="45.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">3</text><text x="575.0" y="65.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">Sent to the node</text><text x="575.0" y="85.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">in plain text</text><rect x="710" y="20" width="190" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="805.0" y="45.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">4</text><text x="805.0" y="65.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">kubelet starts the</text><text x="805.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Pod and containers</text><rect x="710" y="150" width="190" height="80" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="805.0" y="175.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">5</text><text x="805.0" y="195.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">tmpfs mount, decoded</text><text x="805.0" y="215.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">from base64 to plain</text><rect x="480" y="150" width="190" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="575.0" y="175.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">6</text><text x="575.0" y="195.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">App reads it</text><text x="575.0" y="215.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">as plain text</text><rect x="250" y="150" width="190" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="345.0" y="175.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">7</text><text x="345.0" y="195.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Pod deleted: node copy</text><text x="345.0" y="215.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">removed, store copy stays</text><line x1="210" y1="60.0" x2="250" y2="60.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="440" y1="60.0" x2="480" y2="60.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="670" y1="60.0" x2="710" y2="60.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="805.0" y1="100" x2="805.0" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="710" y1="190.0" x2="670" y2="190.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="480" y1="190.0" x2="440" y2="190.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/></svg>