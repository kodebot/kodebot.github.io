<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><text x="20" y="32" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Create and scale up: one at a time, in order</text><rect x="20" y="45" width="230" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="135.0" y="70.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">tkb-sts-0</text><text x="135.0" y="90.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">start first</text><rect x="315" y="45" width="230" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="430.0" y="70.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">tkb-sts-1</text><text x="430.0" y="90.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">after 0 is ready</text><rect x="610" y="45" width="230" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="725.0" y="70.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">tkb-sts-2</text><text x="725.0" y="90.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">after 1 is ready</text><line x1="250" y1="75.0" x2="315" y2="75.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="282.5" y="67.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">running + ready</text><line x1="545" y1="75.0" x2="610" y2="75.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="577.5" y="67.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">running + ready</text><text x="20" y="152" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Scale down 3 to 2: highest ordinal first</text><rect x="20" y="165" width="230" height="60" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="135.0" y="190.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">tkb-sts-2</text><text x="135.0" y="210.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">terminated first</text><rect x="315" y="165" width="230" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="430.0" y="190.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">tkb-sts-1</text><text x="430.0" y="210.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">next, if scaled further</text><rect x="610" y="165" width="230" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="725.0" y="190.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">tkb-sts-0</text><text x="725.0" y="210.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">last</text><line x1="250" y1="195.0" x2="315" y2="195.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="282.5" y="187.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">fully terminated</text><line x1="545" y1="195.0" x2="610" y2="195.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="577.5" y="187.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">fully terminated</text><text x="20" y="272" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">PVCs are never deleted by scaling down</text><rect x="20" y="290" width="250" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="145.0" y="313.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">webroot-tkb-sts-0</text><text x="145.0" y="333.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">survives scale-down</text><rect x="315" y="290" width="250" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="440.0" y="313.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">webroot-tkb-sts-1</text><text x="440.0" y="333.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">survives scale-down</text><rect x="610" y="290" width="250" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="735.0" y="313.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">webroot-tkb-sts-2</text><text x="735.0" y="333.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">survives scale-down</text><text x="450" y="380" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Scaling back up recreates the Pod and reattaches the same PVC</text></svg>