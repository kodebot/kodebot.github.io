<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 240" width="1080" height="240" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1080" height="240" fill="#ffffff"/><rect x="20" y="60" width="170" height="88" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="105.0" y="89.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Client certificate</text><text x="105.0" y="109.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">CN=kubernetes-admin</text><text x="105.0" y="129.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">O=kubeadm:cluster-admins</text><rect x="238" y="60" width="170" height="88" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="323.0" y="89.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Authentication</text><text x="323.0" y="109.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">signed by the</text><text x="323.0" y="129.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">cluster&#x27;s CA: passes</text><rect x="456" y="60" width="170" height="88" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="541.0" y="99.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">ClusterRoleBinding</text><text x="541.0" y="119.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">kubeadm:cluster-admins</text><rect x="674" y="60" width="170" height="88" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="759.0" y="99.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">ClusterRole</text><text x="759.0" y="119.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">cluster-admin</text><rect x="892" y="60" width="170" height="88" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="977.0" y="89.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">All verbs on all</text><text x="977.0" y="109.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">resources in all</text><text x="977.0" y="129.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">Namespaces (root-like)</text><line x1="190" y1="104.0" x2="238" y2="104.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="408" y1="104.0" x2="456" y2="104.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="432.0" y="96.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">group</text><line x1="626" y1="104.0" x2="674" y2="104.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="650.0" y="96.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">binds to</text><line x1="844" y1="104.0" x2="892" y2="104.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="868.0" y="96.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">grants</text><text x="540" y="190" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">CN is the username, O is the group membership, both read from the certificate</text></svg>