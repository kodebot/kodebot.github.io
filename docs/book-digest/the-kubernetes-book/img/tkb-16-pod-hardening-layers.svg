<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="800" height="460" fill="#ffffff"/><rect x="20" y="15" width="760" height="430" rx="12" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="34" y="39" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Pod Security Admission: enforces a PSS policy at creation</text><rect x="60" y="70" width="680" height="360" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="74" y="94" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Mandatory access control: AppArmor, SELinux</text><rect x="100" y="125" width="600" height="290" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="114" y="149" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">seccomp: filter syscalls</text><rect x="140" y="180" width="520" height="220" rx="12" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="154" y="204" font-size="15" font-weight="700" fill="#5c4007" text-anchor="start">Capabilities: drop what is not needed</text><rect x="180" y="235" width="440" height="150" rx="12" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="194" y="259" font-size="15" font-weight="700" fill="#134a26" text-anchor="start">Non-root user, no privilege escalation</text><rect x="250" y="295" width="300" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="400.0" y="330.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Container process</text></svg>