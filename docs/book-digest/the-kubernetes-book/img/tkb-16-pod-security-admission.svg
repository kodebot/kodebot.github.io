<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="380" fill="#ffffff"/><rect x="20" y="30" width="220" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="130.0" y="60.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Privileged</text><text x="130.0" y="80.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">wide-open allow-all</text><line x1="240" y1="65" x2="330" y2="175" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="130" width="220" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="130.0" y="160.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Baseline</text><text x="130.0" y="180.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">sensible defaults</text><line x1="240" y1="165" x2="330" y2="175" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="230" width="220" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="130.0" y="260.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Restricted</text><text x="130.0" y="280.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">current best practice</text><line x1="240" y1="265" x2="330" y2="175" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="330" y="135" width="250" height="90" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="455.0" y="165.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Pod Security Admission</text><text x="455.0" y="185.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">validating admission controller</text><text x="455.0" y="205.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">per-Namespace label</text><rect x="680" y="30" width="300" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="830.0" y="60.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Enforce</text><text x="830.0" y="80.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">reject violating Pods</text><line x1="580" y1="180" x2="680" y2="65" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="680" y="130" width="300" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="830.0" y="160.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Warn</text><text x="830.0" y="180.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">allow + user-facing warning</text><line x1="580" y1="180" x2="680" y2="165" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="680" y="230" width="300" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="830.0" y="260.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Audit</text><text x="830.0" y="280.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">allow + audit event</text><line x1="580" y1="180" x2="680" y2="265" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="340" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">label format: pod-security.kubernetes.io/&lt;mode&gt;: &lt;policy&gt;</text><text x="500" y="362" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">acts only when Pods are created or modified: running Pods are not terminated</text></svg>