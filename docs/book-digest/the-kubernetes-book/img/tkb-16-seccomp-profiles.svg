 122.1Q332.0 80.5 330.3 38.9M329.8 122.0Q328.6 80.2 329.0 38.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="445.0" y="75.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Test extensively</text><text x="445.0" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">in dev and test</text><path d="M641.1 39.0L880.3 40.4L880.5 118.8L639.4 121.1Z" fill="#d6e1cf" stroke="none"/><path d="M638.4 39.4Q760.0 41.4 881.6 39.4M639.6 40.2Q760.0 40.6 880.5 40.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M880.9 39.2Q881.6 79.8 880.3 120.5M881.1 37.5Q879.2 79.0 879.8 120.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M881.1 119.6Q759.5 121.6 638.0 120.0M882.1 119.3Q760.2 118.6 638.4 119.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M640.6 121.3Q641.5 80.2 640.1 39.1M639.5 122.4Q639.6 80.1 640.0 37.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="760.0" y="64.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Custom profile</text><text x="760.0" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">only the syscalls the</text><text x="760.0" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">app needs</text><path d="M249.4 80.1Q290.2 82.5 331.0 80.7M251.0 79.8Q289.9 81.6 328.9 80.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.6 80.3Q324.7 77.0 319.6 74.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.8 80.3Q324.8 83.1 319.7 85.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M560.5 80.3Q600.0 81.1 639.6 80.0M559.1 79.2Q599.4 80.7 639.6 80.5" fill="none" stroke="#3b2f20" stroke