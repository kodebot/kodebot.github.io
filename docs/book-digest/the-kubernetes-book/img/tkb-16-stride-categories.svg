<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 290" width="990" height="290" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="990" height="290" fill="#ffffff"/><rect x="20" y="20" width="290" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="165.0" y="55.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Spoofing</text><text x="165.0" y="75.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">mTLS, protect the CA,</text><text x="165.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">service account tokens</text><rect x="340" y="20" width="290" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="485.0" y="55.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Tampering</text><text x="485.0" y="75.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">TLS in transit, read-only</text><text x="485.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">filesystems, audit</text><rect x="660" y="20" width="290" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="805.0" y="55.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Repudiation</text><text x="805.0" y="75.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">audit logs from every</text><text x="805.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">component, secure store</text><rect x="20" y="150" width="290" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="165.0" y="185.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Information disclosure</text><text x="165.0" y="205.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">KMS v2, protect etcd,</text><text x="165.0" y="225.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">use Secrets</text><rect x="340" y="150" width="290" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="485.0" y="185.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Denial of service</text><text x="485.0" y="205.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">HA, quotas, limits,</text><text x="485.0" y="225.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">NetworkPolicies</text><rect x="660" y="150" width="290" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="805.0" y="185.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Elevation of privilege</text><text x="805.0" y="205.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">RBAC, non-root,</text><text x="805.0" y="225.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Pod Security Admission</text><text x="495" y="280" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">STRIDE: six threat categories; no model guarantees to cover every threat</text></svg>