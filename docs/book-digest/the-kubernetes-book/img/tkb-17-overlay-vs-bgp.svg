<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><rect x="20" y="15" width="460" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Overlay pod network</text><rect x="45" y="70" width="130" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="110.0" y="93.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Pod A</text><text x="110.0" y="113.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">pod IP</text><rect x="325" y="70" width="130" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="390.0" y="93.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Pod B</text><text x="390.0" y="113.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">pod IP</text><rect x="45" y="170" width="410" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="250.0" y="190.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Encapsulated (VXLAN) packet</text><text x="250.0" y="210.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">outer header: node IPs</text><text x="250.0" y="230.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">hides the original pod IPs</text><line x1="110" y1="126" x2="110" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="390" y1="170" x2="390" y2="126" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="115" y="285" width="270" height="60" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="250.0" y="310.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Firewall</text><text x="250.0" y="330.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">sees only the outer packet</text><line x1="250" y1="240" x2="250" y2="285" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="500" y="15" width="460" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="522" y="49" font-size="16" font-weight="700" fill="#14324f">BGP pod network</text><rect x="525" y="70" width="130" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="590.0" y="93.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Pod A</text><text x="590.0" y="113.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">pod IP</text><rect x="805" y="70" width="130" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="870.0" y="93.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Pod B</text><text x="870.0" y="113.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">pod IP</text><rect x="525" y="170" width="410" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="730.0" y="190.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Plain packet, no encapsulation</text><text x="730.0" y="210.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">original source and</text><text x="730.0" y="230.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">destination pod IPs visible</text><line x1="590" y1="126" x2="590" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="870" y1="170" x2="870" y2="126" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="595" y="285" width="270" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="730.0" y="310.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Firewall</text><text x="730.0" y="330.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">sees the real addresses</text><line x1="730" y1="240" x2="730" y2="285" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/></svg>