<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Figures P-2 and P-3: three pillars on a foundation of technical knowledge, braced by &#x27;humaning&#x27; skills</text><path d="M9.1 84.9L330.2 84.7L330.7 274.7L11.0 274.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 84.3Q169.7 85.9 331.0 84.1M7.7 84.3Q169.6 86.7 331.5 84.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 82.9Q331.6 179.6 329.3 276.3M329.2 83.5Q328.8 179.5 330.4 275.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 274.5Q169.6 275.0 7.9 274.1M330.9 275.2Q169.4 276.3 7.9 275.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 277.1Q12.7 180.5 10.3 83.9M9.8 277.0Q8.2 180.2 9.0 83.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="153.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Big-picture thinking</text><text x="170.0" y="175.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">step back, see context, think beyond the current time:</text><text x="170.0" y="197.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">yearlong projects, software easy to decommission, what</text><text x="170.0" y="219.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the company needs in three years</text><path d="M341.1 84.0L660.3 85.4L660.5 273.8L339.4 276.1Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 84.4Q500.0 86.4 661.6 84.4M339.6 85.2Q500.0 85.6 660.5 85.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 84.2Q661.9 179.8 660.3 275.5M661.1 82.5Q658.6 179.0 659.8 275.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 274.6Q499.5 276.6 338.0 275.0M662.1 274.3Q500.2 273.6 338.4 274.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 276.3Q342.0 180.2 340.1 84.1M339.5 277.4Q339.6 180.1 340.0 82.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="153.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Execution</text><text x="500.0" y="175.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">messier, more ambiguous projects with more people; need</text><text x="500.0" y="197.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">political capital, influence or culture change to</text><text x="500.0" y="219.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">succeed</text><path d="M669.3 85.1L991.1 85.8L991.1 276.1L669.7 273.8Z" fill="#efe0ca" stroke="none"/><path d="M668.5 85.8Q829.6 87.0 990.6 85.5M667.6 85.4Q829.4 87.4 991.1 85.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap=