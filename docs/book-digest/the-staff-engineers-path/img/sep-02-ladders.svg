<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">Figure 1-1: two example career ladders; the dual-track one lets a senior engineer choose manager or staff, and later moves between them are sideways</text><path d="M9.1 89.9L310.2 89.7L310.7 419.7L11.0 419.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 89.3Q159.7 90.9 311.0 89.1M7.7 89.3Q159.6 91.7 311.5 89.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M309.9 87.9Q311.6 254.6 309.3 421.3M309.2 88.5Q308.8 254.5 310.4 420.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M311.3 419.5Q159.6 420.0 7.9 419.1M310.9 420.2Q159.4 421.3 7.9 420.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 422.1Q12.7 255.5 10.3 88.9M9.8 422.0Q8.2 255.2 9.0 88.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="160.0" y="228.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Management-only ladder</text><text x="160.0" y="250.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">engineer rungs, then the only way up is to become a</text><text x="160.0" y="272.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">manager: stay in the craft or grow the career, not</text><text x="160.0" y="294.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">both</text><path d="M331.1 89.0L660.3 90.4L660.5 418.8L329.4 421.1Z" fill="#d6e1cf" stroke="none"/><path d="M328.4 89.4Q495.0 91.4 661.6 89.4M329.6 90.2Q495.0 90.6 660.5 90.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 89.2Q661.9 254.8 660.3 420.5M661.1 87.5Q658.6 254.0 659.8 420.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 419.6Q494.5 421.6 328.0 420.0M662.1 419.3Q495.2 418.6 328.4 419.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.6 421.3Q332.0 255.2 330.1 89.1M329.5 422.4Q329.6 255.1 330.0 87.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="495.0" y="217.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Dual-track ladder: technical side</text><text x="495.0" y="239.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">senior (the &#x27;anchor&#x27; level) then staff, senior staff,</text><text x="495.0" y="261.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">principal; staff is roughly a line manager&#x27;s seniority,</text><text x="495.0" y="283.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">principal a director&#x27;s; &#x27;staff+&#x27; covers every role above</text><text x="495.0" y="305.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">senior</text><path d="M679.3 90.1L991.1 90.8L991.1 421.1L679.7 418.8Z" fill="#d0dfdc" stroke="none"/><path d="M678.5 90.8Q834.6 92.0 990.6 90.5M677.6 90.4Q834.4 92.4 991.1 90.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 88.1Q991.3 254.9 990.5 421.8M990.0 89.0Q990.6 254.8 989.1 420.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 420.4Q835.6 419.3 679.3 419.1M991.7 420.0Q835.0 418.7 678.3 419.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M679.9 422.0Q681.5 254.7 680.3 87.5M681.0 421.4Q682.1 255.4 679.0 89.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="835.0" y="228.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Dual-track ladder: management side</text><text x="835.0" y="250.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">senior then manager, senior manager, director; a move</text><text x="835.0" y="272.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">from staff to manager (or back) is a sideways move,</text><text x="835.0" y="294.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">not a promotion</text></svg>