0" y="208.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Option A: best for one team</text><text x="250.0" y="230.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">just works, no setup; but it makes ongoing work for legal and security, and its</text><text x="250.0" y="252.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">authentication needs make IT and the platform team treat it as a special case</text><text x="250.0" y="274.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">forever; costs the company more overall</text><path d="M511.1 89.0L990.3 90.4L990.5 378.8L509.4 381.1Z" fill="#d6e1cf" stroke="none"/><path d="M508.4 89.4Q750.0 91.4 991.6 89.4M509.6 90.2Q750.0 90.6 990.5 90.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 234.8 990.3 380.5M991.1 87.5Q988.6 234.0 989.8 380.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 379.6Q749.5 381.6 508.0 380.0M992.1 379.3Q750.2 378.6 508.4 379.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 381.3Q512.0 235.2 510.1 89.1M509.5 382.4Q509.6 235.1 510.0 87.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="208.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Option B: best for the company</text><text x="750.0" y="230.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">a couple of sprints of wrangling, nobody enthusiastic; only slightly worse for the</text><text x="750.0" y="252.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">team but much better overall; the extra two sprints pay for themselves within a</text><text x="750.0" y="274.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">quarter, which is obvious only to someone with a wider lens</text></svg>