<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="470" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="40.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Figure 1-3: staff+ engineers reporting at different levels (A high, D low); same seniority, but A gets organisational context and director-level conversations far more</text><text x="500.0" y="62.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">easily than D</text><path d="M9.1 89.9L490.2 89.7L490.7 339.7L11.0 339.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 89.3Q249.7 90.9 491.0 89.1M7.7 89.3Q249.6 91.7 491.5 89.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 87.9Q491.6 214.6 489.3 341.3M489.2 88.5Q488.8 214.5 490.4 340.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 339.5Q249.6 340.0 7.9 339.1M490.9 340.2Q249.4 341.3 7.9 340.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 342.1Q12.7 215.5 10.3 88.9M9.8 342.0Q8.2 215.2 9.0 88.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="188.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Reporting &#x27;high&#x27; (director or VP)</text><text x="250.0" y="210.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">pros: broad, impactful information and problems; watch a senior person decide, run</text><text x="250.0" y="232.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">meetings, handle crises; cons: less of your manager&#x27;s time and advocacy, may feel</text><text x="250.0" y="254.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">disconnected from a team or drag the director into local disagreements</text><path d="M511.1 89.0L990.3 90.4L990.5 338.8L509.4 341.1Z" fill="#efe0ca" stroke="none"/><path d="M508.4 89.4Q750.0 91.4 991.6 89.4M509.6 90.2Q750.0 90.6 990.5 90.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 214.8 990.3 340.5M991.1 87.5Q988.6 214.0 989.8 340.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 339.6Q749.5 341.6 508.0 340.0M992.1 339.3Q750.2 338.6 508.4 339.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 341.3Q512.0 215.2 510.1 89.1M509.5 342.4Q509.6 215.1 510.0 87.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="177.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Reporting &#x27;low&#x27; (line manager)</text><text x="750.0" y="199.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">pros: focused attention, an advocate, a manager close to your area; cons: less</text><text x="750.0" y="221.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">influence (people notice reporting chains), filtered information, a possibly less</text><text x="750.0" y="243.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">experienced manager, and tension over local versus organisation-wide priorities;</text><text x="750.0" y="265.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">use skip-level meetings</text><path d="M9.3 355.1L991.1 355.8L991.1 456.1L9.7 453.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 355.8Q499.6 357.0 990.6 355.5M7.6 355.4Q499.4 357.4 991.1 355.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 353.1Q991.1 404.9 990.5 456.8M990.0 354.0Q990.4 404.8 989.1 455.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 455.4Q500.6 454.3 9.3 454.1M991.7 455.0Q500.0 453.7 8.3 454.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 457.0Q11.2 404.7 10.3 352.5M11.0 456.4Q11.7 405.4 9.0 354.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="411.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">If arguments about priorities keep happening because one person rates and pays the other, consider advocating to report one level higher</text></svg>