<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Shaping your role: scope too broad or too narrow, and the questions that define your shape</text><path d="M9.1 79.9L490.2 79.7L490.7 309.7L11.0 309.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 79.3Q249.7 80.9 491.0 79.1M7.7 79.3Q249.6 81.7 491.5 79.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 77.9Q491.6 194.6 489.3 311.3M489.2 78.5Q488.8 194.5 490.4 310.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 309.5Q249.6 310.0 7.9 309.1M490.9 310.2Q249.4 311.3 7.9 310.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 312.1Q12.7 195.5 10.3 78.9M9.8 312.0Q8.2 195.2 9.0 78.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="157.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Scope too broad</text><text x="250.0" y="179.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">lack of impact (a role of side quests with no narrative); becoming a bottleneck</text><text x="250.0" y="201.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">when you must be in every decision; decision fatigue; missing relationships, and</text><text x="250.0" y="223.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">other engineers lose a local staff engineer. Choose an area, build influence,</text><text x="250.0" y="245.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">solve some problems entirely, then move on</text><path d="M511.1 79.0L990.3 80.4L990.5 308.8L509.4 311.1Z" fill="#efe0ca" stroke="none"/><path d="M508.4 79.4Q750.0 81.4 991.6 79.4M509.6 80.2Q750.0 80.6 990.5 80.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 194.8 990.3 310.5M991.1 77.5Q988.6 194.0 989.8 310.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 309.6Q749.5 311.6 508.0 310.0M992.1 309.3Q750.2 308.6 508.4 309.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 311.3Q512.0 195.2 510.1 79.1M509.5 312.4Q509.6 195.1 510.0 77.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="168.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Scope too narrow</text><text x="750.0" y="190.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">lack of impact (work that does not need a staff engineer); opportunity cost (not</text><text x="750.0" y="212.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">top of mind for problems elsewhere); overshadowing less experienced engineers;</text><text x="750.0" y="234.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">overengineering from spare time. Fine only for a core, mission-critical area</text><path d="M9.3 325.1L491.1 325.8L491.1 551.1L9.7 548.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 325.8Q249.6 327.0 490.6 325.5M7.6 325.4Q249.4 327.4 491.1 325.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 323.1Q491.3 437.4 490.5 551.8M490.0 324.0Q490.6 437.3 489.1 550.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M492.0 550.4Q250.6 549.3 9.3 549.1M491.7 550.0Q250.0 548.7 8.3 549.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 552.0Q11.5 437.2 10.3 322.5M11.0 551.4Q12.1 437.9 9.0 324.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="399.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Questions about shape</text><text x="250.0" y="421.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">depth-first or breadth-first; which of Zunger&#x27;s four disciplines you gravitate</text><text x="250.0" y="443.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">toward (core technical, product, project, people management); how much you want to</text><text x="250.0" y="465.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">code; your delayed gratification; whether to keep a foot on the manager track</text><text x="250.0" y="487.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">(tech lead manager, pendulum)</text><path d="M509.1 324.1L989.6 324.3L989.6 550.2L509.4 550.1Z" fill="#d6e1cf" stroke="none"/><path d="M507.7 324.3Q749.8 326.0 991.8 324.3M509.1 324.1Q750.1 327.8 991.2 325.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 324.4Q992.1 437.9 989.4 551.3M990.1 323.9Q990.8 437.7 990.0 551.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 550.6Q750.2 549.2 508.1 549.5M992.5 549.0Q750.2 549.8 507.9 549.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.9 551.0Q510.9 437.4 511.0 323.7M510.3 550.5Q510.2 436.8 509.6 323.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="399.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Staff archetypes (Will Larson)</text><text x="750.0" y="421.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">tech lead (guides execution of teams with managers); architect (technical</text><text x="750.0" y="443.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">direction and quality across a critical area); solver (one difficult problem at a</text><text x="750.0" y="465.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">time); right hand (adds leadership bandwidth). Describing your shape, not a</text><text x="750.0" y="487.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">prescription</text></svg>