<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Figure 2-8: seven culture sliders; most companies sit near the middle, and the far ends are hardest to work in</text><path d="M9.1 84.9L495.2 84.7L495.7 204.7L11.0 204.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 84.3Q252.2 85.9 496.0 84.1M7.7 84.3Q252.1 86.7 496.5 84.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 82.9Q496.5 144.6 494.3 206.3M494.2 83.5Q493.8 144.5 495.4 205.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 204.5Q252.1 205.0 7.9 204.1M495.9 205.2Q251.9 206.3 7.9 205.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 207.1Q12.6 145.5 10.3 83.9M9.8 207.0Q8.3 145.2 9.0 83.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="129.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Secret &lt;&gt; open</text><text x="252.5" y="151.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">secret: information is currency, do not reshare a confidence; open: access to</text><text x="252.5" y="173.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">everything, decision fatigue, more drama, and withholding looks political</text><path d="M506.1 84.0L990.3 85.4L990.5 203.8L504.4 206.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 84.4Q747.5 86.4 991.6 84.4M504.6 85.2Q747.5 85.6 990.5 85.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 84.2Q991.9 144.8 990.3 205.5M991.1 82.5Q988.7 144.0 989.8 205.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 204.6Q747.0 206.6 503.0 205.0M992.1 204.3Q747.7 203.6 503.4 204.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 206.3Q506.9 145.2 505.1 84.1M504.5 207.4Q504.6 145.1 505.0 82.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="129.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Oral &lt;&gt; written</text><text x="747.5" y="151.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">oral: hallway decisions, a design doc over a page goes unread; written: specs,</text><text x="747.5" y="173.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">sign-offs, a one-line change can take a quarter; no change ticket looks sloppy</text><path d="M9.3 215.1L496.1 215.8L496.1 336.1L9.7 333.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 215.8Q252.1 217.0 495.6 215.5M7.6 215.4Q251.9 217.4 496.1 215.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 213.1Q496.3 274.9 495.5 336.8M495.0 214.0Q495.6 274.8 494.1 335.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 335.4Q253.1 334.3 9.3 334.1M496.7 335.0Q252.5 333.7 8.3 334.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 337.0Q11.4 274.7 10.3 212.5M11.0 336.4Q12.0 275.4 9.0 214.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="248.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Top-down &lt;&gt; bottom-up</text><text x="252.5" y="270.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">top-down: decisive but lacking local context; bottom-up: empowered but deadlocks</text><text x="252.5" y="292.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">without a decider; autonomous staff engineers may look low-initiative in a top-down</text><text x="252.5" y="314.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">habit</text><path d="M504.1 214.1L989.6 214.3L989.6 335.2L504.4 335.1Z" fill="#d0dfdc" stroke="none"/><path d="M502.7 214.3Q747.3 216.0 991.8 214.3M504.1 214.1Q747.6 217.8 991.2 215.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 214.4Q991.9 275.4 989.4 336.3M990.1 213.9Q990.8 275.2 990.0 336.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 335.6Q747.7 334.2 503.1 334.5M992.5 334.0Q747.7 334.8 502.9 334.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 336.0Q505.9 274.9 506.0 213.7M505.3 335.5Q505.2 274.3 504.6 213.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="259.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Fast &lt;&gt; deliberate change</text><text x="747.5" y="281.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">fast firms want incremental wins; slow ones need the whole plan thought through;</text><text x="747.5" y="303.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">tied to oral versus written</text><path d="M9.5 344.2L494.1 345.5L495.6 464.4L9.8 466.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.0 344.5Q252.7 341.6 497.4 345.0M7.8 345.6Q252.6 346.6 497.4 345.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 342.6Q495.0 405.1 495.3 467.5M495.0 343.5Q493.4 405.2 495.9 467.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 465.9Q252.6 462.3 8.9 464.2M496.4 464.3Q252.7 461.8 9.0 465.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 467.5Q12.9 405.3 9.3 343.2M9.8 467.3Q12.4 405.3 9.7 343.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="389.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Back channels &lt;&gt; front doors</text><text x="252.5" y="411.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">a chat with a counterpart versus tickets and the management chain; back channels</text><text x="252.5" y="433.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">are quick, front doors predictable and fair; skipping the queue can be rude</text><path d="M506.0 344.5L990.5 344.4L989.4 466.1L503.8 464.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.7 343.9Q747.1 341.7 990.6 344.7M504.2 345.4Q748.3 344.5 992.4 345.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 343.5Q987.6 405.4 989.0 467.3M990.6 343.4Q991.0 405.1 990.7 466.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 464.2Q747.9 464.3 503.2 465.1M990.6 464.0Q747.5 466.3 504.4 464.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.8 466.2Q506.4 405.2 505.5 344.3M504.9 465.7Q503.2 404.1 503.9 342.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="389.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Allocated &lt;&gt; available</text><text x="747.5" y="411.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">overworked teams say no fast, so favour ideas that free time; teams with spare</text><text x="747.5" y="433.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">cycles breed competing grassroots projects, so pick one and rally others</text><path d="M10.7 476.1L493.9 475.6L496.1 595.6L9.4 595.8Z" fill="#d0dfdc" stroke="none"/><path d="M7.8 474.2Q251.7 476.5 495.5 475.6M7.8 474.5Q252.1 476.6 496.5 474.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 474.3Q497.2 535.6 495.7 597.0M493.9 473.1Q494.4 534.8 495.1 596.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.7 595.8Q252.2 597.3 7.7 595.8M495.7 595.8Q252.5 593.8 9.3 595.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.7 596.6Q10.8 535.5 9.8 474.5M9.5 595.6Q11.1 534.4 9.0 473.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="519.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Liquid &lt;&gt; crystallized</text><text x="252.5" y="541.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">crystallized: fixed hierarchy, you rise with your group and when it is your turn</text><text x="252.5" y="563.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">(do not take someone&#x27;s promotion project); liquid: room to move but you must hustle</text></svg>