<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Figures 2-3 and 2-5, locator map techniques: take an outsider view, escape the echo chamber, ask what is actually important, know your customer, check prior art</text><path d="M9.1 84.9L495.2 84.7L495.7 244.7L11.0 244.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 84.3Q252.2 85.9 496.0 84.1M7.7 84.3Q252.1 86.7 496.5 84.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 82.9Q496.6 164.6 494.3 246.3M494.2 83.5Q493.8 164.5 495.4 245.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 244.5Q252.1 245.0 7.9 244.1M495.9 245.2Q251.9 246.3 7.9 245.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 247.1Q12.7 165.5 10.3 83.9M9.8 247.0Q8.2 165.2 9.0 83.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="138.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Outsider view</text><text x="252.5" y="160.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a new person always sees the problems (no history, no boiling frog); keep that</text><text x="252.5" y="182.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">view: would anyone notice if your group stopped? Humility: &#x27;respect what came</text><text x="252.5" y="204.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">before&#x27;</text><path d="M506.1 84.0L990.3 85.4L990.5 243.8L504.4 246.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 84.4Q747.5 86.4 991.6 84.4M504.6 85.2Q747.5 85.6 990.5 85.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 84.2Q991.9 164.8 990.3 245.5M991.1 82.5Q988.6 164.0 989.8 245.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 244.6Q747.0 246.6 503.0 245.0M992.1 244.3Q747.7 243.6 503.4 244.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 246.3Q507.0 165.2 505.1 84.1M504.5 247.4Q504.6 165.1 505.0 82.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="149.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Echo chamber</text><text x="747.5" y="171.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">befriend other staff engineers (a virtual team above your group, and principal</text><text x="747.5" y="193.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">engineers above your org) and non-engineers; speak the truth with goodwill built up</text><path d="M9.3 255.1L496.1 255.8L496.1 416.1L9.7 413.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 255.8Q252.1 257.0 495.6 255.5M7.6 255.4Q251.9 257.4 496.1 255.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 253.1Q496.3 334.9 495.5 416.8M495.0 254.0Q495.6 334.8 494.1 415.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 415.4Q253.1 414.3 9.3 414.1M496.7 415.0Q252.5 413.7 8.3 414.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 417.0Q11.5 334.7 10.3 252.5M11.0 416.4Q12.1 335.4 9.0 254.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="308.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">What is important?</text><text x="252.5" y="330.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">a project at the centre of your universe may be small on a bigger map; goals shift</text><text x="252.5" y="352.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">with company stage; know the &#x27;objectives that are always true&#x27; (exist, pay people,</text><text x="252.5" y="374.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">good reputation)</text><path d="M504.1 254.1L989.6 254.3L989.6 415.2L504.4 415.1Z" fill="#d0dfdc" stroke="none"/><path d="M502.7 254.3Q747.3 256.0 991.8 254.3M504.1 254.1Q747.6 257.8 991.2 255.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 254.4Q992.1 335.4 989.4 416.3M990.1 253.9Q990.8 335.2 990.0 416.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 415.6Q747.7 414.2 503.1 414.5M992.5 414.0Q747.7 414.8 502.9 414.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 416.0Q505.9 334.9 506.0 253.7M505.3 415.5Q505.2 334.3 504.6 253.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="319.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">What do customers care about?</text><text x="747.5" y="341.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">&#x27;Nines don&#x27;t matter when users aren&#x27;t happy&#x27; (Charity Majors); Bing tracked down</text><text x="747.5" y="363.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">unreliable ISPs because users do not tell DNS, ISP, CDN and endpoint apart</text><path d="M9.5 424.2L494.1 425.5L495.6 584.4L9.8 586.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.0 424.5Q252.7 421.6 497.4 425.0M7.8 425.6Q252.6 426.6 497.4 425.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 422.6Q494.9 505.1 495.3 587.5M495.0 423.5Q493.2 505.2 495.9 587.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 585.9Q252.6 582.3 8.9 584.2M496.4 584.3Q252.7 581.8 9.0 585.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 587.5Q13.0 505.3 9.3 423.2M9.8 587.3Q12.6 505.3 9.7 423.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="489.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Solved before?</text><text x="252.5" y="511.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">many problems are not new; study what exists inside and outside; goal is to solve</text><text x="252.5" y="533.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">the problem, not to write code; keep up via newsletters, conferences, communities</text><path d="M506.0 424.5L990.5 424.4L989.4 586.1L503.8 584.1Z" fill="#d6e1cf" stroke="none"/><path d="M503.7 423.9Q747.1 421.7 990.6 424.7M504.2 425.4Q748.3 424.5 992.4 425.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 423.5Q987.5 505.4 989.0 587.3M990.6 423.4Q991.0 505.1 990.7 586.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 584.2Q747.9 584.3 503.2 585.1M990.6 584.0Q747.5 586.3 504.4 584.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.8 586.2Q506.4 505.2 505.5 424.3M504.9 585.7Q503.2 504.1 503.9 422.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="489.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Keep it fresh</text><text x="747.5" y="511.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">all-hands, skip-level one-on-ones, time with customers; if you cannot explain why</text><text x="747.5" y="533.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">this needs a staff engineer, you may be doing the wrong thing</text></svg>