<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="600" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Points of interest on the topographical map (Figures 2-6 to 2-10), and the cost of not knowing them</text><path d="M9.1 79.9L495.2 79.7L495.7 229.7L11.0 229.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 79.3Q252.2 80.9 496.0 79.1M7.7 79.3Q252.1 81.7 496.5 79.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 77.9Q496.6 154.6 494.3 231.3M494.2 78.5Q493.8 154.5 495.4 230.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 229.5Q252.1 230.0 7.9 229.1M495.9 230.2Q251.9 231.3 7.9 230.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 232.1Q12.7 155.5 10.3 78.9M9.8 232.0Q8.2 155.2 9.0 78.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="128.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Chasms</text><text x="252.5" y="150.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">gaps between teams or orgs, e.g. product engineering versus infrastructure,</text><text x="252.5" y="172.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">security or platforms; goals and norms evolve apart; small chasms inside an org</text><text x="252.5" y="194.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">lose work in the gaps</text><path d="M506.1 79.0L990.3 80.4L990.5 228.8L504.4 231.1Z" fill="#efe0ca" stroke="none"/><path d="M503.4 79.4Q747.5 81.4 991.6 79.4M504.6 80.2Q747.5 80.6 990.5 80.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 154.8 990.3 230.5M991.1 77.5Q988.6 154.0 989.8 230.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 229.6Q747.0 231.6 503.0 230.0M992.1 229.3Q747.7 228.6 503.4 229.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 231.3Q507.0 155.2 505.1 79.1M504.5 232.4Q504.6 155.1 505.0 77.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="128.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Fortresses</text><text x="747.5" y="150.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">gatekeeping teams or people, mostly well-intentioned; bring a token of sponsorship,</text><text x="747.5" y="172.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">the &#x27;password&#x27; (risks mitigated, checklists, comment replies), avoid a Pyrrhic</text><text x="747.5" y="194.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fight, or go around and lose their wisdom</text><path d="M9.3 240.1L496.1 240.8L496.1 391.1L9.7 388.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 240.8Q252.1 242.0 495.6 240.5M7.6 240.4Q251.9 242.4 496.1 240.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 238.1Q496.3 314.9 495.5 391.8M495.0 239.0Q495.6 314.8 494.1 390.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 390.4Q253.1 389.3 9.3 389.1M496.7 390.0Q252.5 388.7 8.3 389.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 392.0Q11.5 314.7 10.3 237.5M11.0 391.4Q12.1 315.4 9.0 239.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="288.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Disputed territory</text><text x="252.5" y="310.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">pieces of work several teams think they own; Reilly&#x27;s example: a system whose</text><text x="252.5" y="332.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">ownership was smeared across three teams, so nobody could say whether migrating it</text><text x="252.5" y="354.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">was safe</text><path d="M504.1 239.1L989.6 239.3L989.6 390.2L504.4 390.1Z" fill="#eed5cc" stroke="none"/><path d="M502.7 239.3Q747.3 241.0 991.8 239.3M504.1 239.1Q747.6 242.8 991.2 240.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 239.4Q992.1 315.4 989.4 391.3M990.1 238.9Q990.8 315.2 990.0 391.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 390.6Q747.7 389.2 503.1 389.5M992.5 389.0Q747.7 389.8 502.9 389.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 391.0Q505.9 314.9 506.0 238.7M505.3 390.5Q505.2 314.3 504.6 238.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="299.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Uncrossable deserts</text><text x="747.5" y="321.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">battles others call unwinnable (too big, a standing veto); worth trying only with</text><text x="747.5" y="343.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">evidence that this time differs</text><path d="M9.5 399.2L494.1 400.5L495.6 549.4L9.8 551.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.0 399.5Q252.7 396.6 497.4 400.0M7.8 400.6Q252.6 401.6 497.4 400.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 397.6Q494.9 475.1 495.3 552.5M495.0 398.5Q493.2 475.2 495.9 552.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 550.9Q252.6 547.3 8.9 549.2M496.4 549.3Q252.7 546.8 9.0 550.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 552.5Q13.0 475.3 9.3 398.2M9.8 552.3Q12.6 475.3 9.7 398.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="459.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Paved roads and goat tracks</text><text x="252.5" y="481.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">know the official easy path and the undocumented shortcuts; the new paved road may</text><text x="252.5" y="503.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">not lead where people really go</text><path d="M506.0 399.5L990.5 399.4L989.4 551.1L503.8 549.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.7 398.9Q747.1 396.7 990.6 399.7M504.2 400.4Q748.3 399.5 992.4 400.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 398.5Q987.5 475.4 989.0 552.3M990.6 398.4Q991.0 475.1 990.7 551.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 549.2Q747.9 549.3 503.2 550.1M990.6 549.0Q747.5 551.3 504.4 549.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.8 551.2Q506.4 475.2 505.5 399.3M504.9 550.7Q503.2 474.1 503.9 397.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="459.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Without the map</text><text x="747.5" y="481.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">good ideas get no traction (being right is less than half the battle); you find the</text><text x="747.5" y="503.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">hard part too late; everything takes longer (planning cycles, OKR timing)</text></svg>