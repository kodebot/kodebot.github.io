<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="40.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Three maps for the big picture: they already exist in your organisation but are hidden by &#x27;fog of war&#x27;; learn to notice facts and gain access to the rooms where</text><text x="500.0" y="62.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">decisions happen</text><path d="M9.1 89.9L330.2 89.7L330.7 389.7L11.0 389.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 89.3Q169.7 90.9 331.0 89.1M7.7 89.3Q169.6 91.7 331.5 89.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 87.9Q331.6 239.6 329.3 391.3M329.2 88.5Q328.8 239.5 330.4 390.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 389.5Q169.6 390.0 7.9 389.1M330.9 390.2Q169.4 391.3 7.9 390.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 392.1Q12.7 240.5 10.3 88.9M9.8 392.0Q8.2 240.2 9.0 88.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="191.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Locator map: you are here</text><text x="170.0" y="213.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">your part of the organisation set against the whole</text><text x="170.0" y="235.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">company; fixes perspective (Figures 2-1 and 2-5);</text><text x="170.0" y="257.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">counters four risks of staring inward: bad</text><text x="170.0" y="279.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">prioritising, lost empathy, tuning out background</text><text x="170.0" y="301.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">noise, forgetting what the work is for</text><path d="M341.1 89.0L660.3 90.4L660.5 388.8L339.4 391.1Z" fill="#efe0ca" stroke="none"/><path d="M338.4 89.4Q500.0 91.4 661.6 89.4M339.6 90.2Q500.0 90.6 660.5 90.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 89.2Q661.9 239.8 660.3 390.5M661.1 87.5Q658.6 239.0 659.8 390.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 389.6Q499.5 391.6 338.0 390.0M662.1 389.3Q500.2 388.6 338.4 389.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 391.3Q342.0 240.2 340.1 89.1M339.5 392.4Q339.6 240.1 340.0 87.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="202.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Topographical map: the terrain</text><text x="500.0" y="224.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">plate-tectonic team boundaries (Figures 2-6, 2-7);</text><text x="500.0" y="246.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">culture, chasms, fortresses, disputed territory,</text><text x="500.0" y="268.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">deserts, paved roads; how decisions are made, the</text><text x="500.0" y="290.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">&#x27;room&#x27; and the shadow org chart</text><path d="M669.3 90.1L991.1 90.8L991.1 391.1L669.7 388.8Z" fill="#d6e1cf" stroke="none"/><path d="M668.5 90.8Q829.6 92.0 990.6 90.5M667.6 90.4Q829.4 92.4 991.1 90.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 88.1Q991.3 239.9 990.5 391.8M990.0 89.0Q990.6 239.8 989.1 390.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 390.4Q830.6 389.3 669.3 389.1M991.7 390.0Q830.0 388.7 668.3 389.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 392.0Q671.5 239.7 670.3 87.5M671.0 391.4Q672.1 240.4 669.0 89.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="202.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Treasure map: where we are going</text><text x="830.0" y="224.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">the real goal behind each project and the stops on the</text><text x="830.0" y="246.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">way (Figures 2-12 to 2-14); if nobody has declared the</text><text x="830.0" y="268.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">treasure, or paths compete, draw a new map: a vision or</text><text x="830.0" y="290.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">strategy (chapter 3)</text><path d="M9.1 404.1L989.6 404.3L989.6 505.2L9.4 505.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 404.3Q499.8 406.0 991.8 404.3M9.1 404.1Q500.1 407.8 991.2 405.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 404.4Q991.7 455.4 989.4 506.3M990.1 403.9Q990.7 455.2 990.0 506.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 505.6Q500.2 504.2 8.1 504.5M992.5 504.0Q500.2 504.8 7.9 504.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 506.0Q10.9 454.9 11.0 403.7M10.3 505.5Q10.2 454.3 9.6 403.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="450.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Clearing the fog: continually notice and remember facts (a marketing all-hands may signal a traffic spike), and get access to decisions and discussions you would not</text><text x="500.0" y="472.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">hear about unless you knew they existed</text></svg>