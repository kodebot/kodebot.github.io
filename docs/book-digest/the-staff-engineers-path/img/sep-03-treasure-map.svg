" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.4 224.1L490.8 225.8L490.1 490.6L10.7 490.2Z" fill="#efe0ca" stroke="none"/><path d="M8.3 226.0Q250.0 222.5 491.7 224.5M7.5 224.7Q249.8 221.6 492.2 224.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.0 223.0Q490.6 357.2 490.8 491.4M489.2 224.4Q487.0 358.1 489.1 491.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.6 490.2Q250.5 488.4 9.5 489.6M492.3 490.0Q249.9 489.0 7.4 490.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 490.7Q11.7 356.6 9.2 222.4M9.7 492.4Q8.4 357.6 10.3 222.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="330.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Only short-term goals means</text><text x="250.0" y="352.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">harder to keep everyone going the same way; you do not finish big things; cruft</text><text x="250.0" y="374.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">accumulates (over-flexible or edge-case designs); competing grassroots</text><text x="250.0" y="396.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">initiatives; engineers stop growing</text><path d="M510.0 225.2L990.7 224.7L989.9 490.3L509.4 491.1Z" fill="#d6e1cf" stroke="none"/><path d="M507.8 224.5Q749.6 225.4 991.4 225.4M508.2 224.6Q749.8 227.9 991.4 226.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.6 224.6Q992.7 358.0 989.0 491.4M989.6 224.2Q992.0 358.0 989.6 491.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.9 491.0Q750.0 492.9 508.1 490.2M991.0 489.2Q750.2 490.4 509.3 489.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.3 491.8Q512.8 357.7 509.4 223.5M510.1 491.6Q508.7 357.8 509.2 224.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="319.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">With a long view</text><text x="750.0" y="341.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">no need for tight alignment along the way; teams choose their own route and</text><text x="750.0" y="363.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">narrative; fewer wrong turns, less hedging and technical debt; celebrate wins</text><text x="750.0" y="385.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">while remembering the real goal. Share the map: where you are, where you are</text><text x="750.0" y="407.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">going, why, a clear definition of success, and progress made</text></svg>