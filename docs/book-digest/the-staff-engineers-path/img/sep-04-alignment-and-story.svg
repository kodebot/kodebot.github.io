<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Figure 3-3 and the story: align without surprises, tell a story people can repeat, then launch and keep it fresh</text><path d="M9.1 89.9L330.2 89.7L330.7 339.7L11.0 339.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 89.3Q169.7 90.9 331.0 89.1M7.7 89.3Q169.6 91.7 331.5 89.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 87.9Q331.6 214.6 329.3 341.3M329.2 88.5Q328.8 214.5 330.4 340.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 339.5Q169.6 340.0 7.9 339.1M330.9 340.2Q169.4 341.3 7.9 340.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 342.1Q12.7 215.5 10.3 88.9M9.8 342.0Q8.2 215.2 9.0 88.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="177.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Be reasonable: the Overton window</text><text x="170.0" y="199.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">the range of ideas tolerated without seeming extreme;</text><text x="170.0" y="221.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">futuristic plans lose credibility; if people are far</text><text x="170.0" y="243.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">from A, convince them of A first and take the next step</text><text x="170.0" y="265.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">later</text><path d="M341.1 89.0L660.3 90.4L660.5 338.8L339.4 341.1Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 89.4Q500.0 91.4 661.6 89.4M339.6 90.2Q500.0 90.6 660.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 89.2Q661.9 214.8 660.3 340.5M661.1 87.5Q658.6 214.0 659.8 340.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 339.6Q499.5 341.6 338.0 340.0M662.1 339.3Q500.2 338.6 338.4 339.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 341.3Q342.0 215.2 340.1 89.1M339.5 342.4Q339.6 215.1 340.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="166.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Nemawashi</text><text x="500.0" y="188.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">share information early and one to one (hear the &#x27;spicy</text><text x="500.0" y="210.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">opinions&#x27;) so the decision meeting finds consensus</text><text x="500.0" y="232.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">already formed; &#x27;don&#x27;t call for a vote until you know</text><text x="500.0" y="254.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">you have the votes&#x27;; Keavy McMinn arrived with her boss</text><text x="500.0" y="276.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and his boss on board</text><path d="M669.3 90.1L991.1 90.8L991.1 341.1L669.7 338.8Z" fill="#d6e1cf" stroke="none"/><path d="M668.5 90.8Q829.6 92.0 990.6 90.5M667.6 90.4Q829.4 92.4 991.1 90.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 88.1Q991.3 214.9 990.5 341.8M990.0 89.0Q990.6 214.8 989.1 340.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 340.4Q830.6 339.3 669.3 339.1M991.7 340.0Q830.0 338.7 668.3 339.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 342.0Q671.5 214.7 670.3 87.5M671.0 341.4Q672.1 215.4 669.0 89.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="166.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Work on your story</text><text x="830.0" y="188.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">comprehensible (short, coherent), relatable (show their</text><text x="830.0" y="210.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">lives improve), comfortable (not too far ahead); a</text><text x="830.0" y="232.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">bumper sticker such as &#x27;Cloud only 2020&#x27; (Financial</text><text x="830.0" y="254.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Times) is quotable; tell the hard part too: &#x27;the heroes</text><text x="830.0" y="276.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">get caught in the pit, then get out&#x27;</text><path d="M9.1 354.1L489.6 354.3L489.6 510.2L9.4 510.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 354.3Q249.8 356.0 491.8 354.3M9.1 354.1Q250.1 357.8 491.2 355.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.0 354.4Q492.1 432.9 489.4 511.3M490.1 353.9Q490.8 432.7 490.0 511.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M492.4 510.6Q250.2 509.2 8.1 509.5M492.5 509.0Q250.2 509.8 7.9 509.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 511.0Q10.9 432.4 11.0 353.7M10.3 510.5Q10.2 431.8 9.6 353.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="405.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Final draft and launch easy to read: white space, bullets, personas, a concrete</text><text x="250.0" y="427.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">hard scenario, no jargon; add a deck and a one-page pitch. Make it official:</text><text x="250.0" y="449.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">executive endorsement, an official site, closed comments, staffing and headcount,</text><text x="250.0" y="471.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">stay involved</text><path d="M509.5 354.2L989.1 355.5L990.6 509.4L509.8 511.2Z" fill="#f1ede5" stroke="none"/><path d="M508.0 354.5Q750.2 351.6 992.4 355.0M507.8 355.6Q750.1 356.6 992.4 355.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 352.6Q989.9 432.6 990.3 512.5M990.0 353.5Q988.2 432.7 990.9 512.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 510.9Q750.1 507.3 508.9 509.2M991.4 509.3Q750.2 506.8 509.0 510.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.9 512.5Q513.0 432.8 509.3 353.2M509.8 512.3Q512.6 432.8 509.7 353.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="427.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Keep it fresh revisit in a year or earlier; explain what changed, update, tell a</text><text x="750.0" y="449.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">new story; the direction may simply have been wrong</text></svg>