<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 85.3L10.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.6 49.7 990.0 86.2M989.9 12.9Q991.3 49.5 990.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 84.4Q500.1 87.2 8.7 84.5M991.4 84.7Q499.6 83.2 7.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 86.0Q10.2 49.3 10.1 12.7M10.2 85.9Q8.9 50.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="45.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">SockMatcher case study: a monolith where every new matchable item (socks, gloves, buttons, now food storage containers) adds if-statements in billing and</text><text x="500.0" y="67.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">personalization; a three-hour deploy; availability complaints</text><path d="M9.1 99.9L330.2 99.7L330.7 429.7L11.0 429.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 99.3Q169.7 100.9 331.0 99.1M7.7 99.3Q169.6 101.7 331.5 99.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 97.9Q331.6 264.6 329.3 431.3M329.2 98.5Q328.8 264.5 330.4 430.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 429.5Q169.6 430.0 7.9 429.1M330.9 430.2Q169.4 431.3 7.9 430.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 432.1Q12.7 265.5 10.3 98.9M9.8 432.0Q8.2 265.2 9.0 98.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="194.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Diagnosis (simplified from ten facts)</text><text x="170.0" y="216.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">every feature change needs complex logic changes in</text><text x="170.0" y="238.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">shared components; changes there are slow and hard;</text><text x="170.0" y="260.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">unexpected interactions cause outages and long fixes;</text><text x="170.0" y="282.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">each new item type adds coupling. Interviews corrected</text><text x="170.0" y="304.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">assumptions: celebrity spikes caused only minutes of</text><text x="170.0" y="326.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">downtime a month, the real damage was ordinary bugs</text><text x="170.0" y="348.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">plus three-hour deploys</text><path d="M341.1 99.0L660.3 100.4L660.5 428.8L339.4 431.1Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 99.4Q500.0 101.4 661.6 99.4M339.6 100.2Q500.0 100.6 660.5 100.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 99.2Q661.9 264.8 660.3 430.5M661.1 97.5Q658.6 264.0 659.8 430.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 429.6Q499.5 431.6 338.0 430.0M662.1 429.3Q500.2 428.6 338.4 429.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 431.3Q342.0 265.2 340.1 99.1M339.5 432.4Q339.6 265.1 340.0 97.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="205.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Guiding policy</text><text x="500.0" y="227.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">&#x27;The billing and personalization systems should be easy</text><text x="500.0" y="249.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">and safe to integrate with.&#x27; Rejected: break up the</text><text x="500.0" y="271.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">monolith into microservices (at least three years,</text><text x="500.0" y="293.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">risky shared changes, new on-call, no help for the</text><text x="500.0" y="315.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">launch). Leverage point chosen for a virtuous cycle of</text><text x="500.0" y="337.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fewer outages and more time</text><path d="M669.3 100.1L991.1 100.8L991.1 431.1L669.7 428.8Z" fill="#efe0ca" stroke="none"/><path d="M668.5 100.8Q829.6 102.0 990.6 100.5M667.6 100.4Q829.4 102.4 991.1 100.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 98.1Q991.3 264.9 990.5 431.8M990.0 99.0Q990.6 264.8 989.1 430.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 430.4Q830.6 429.3 669.3 429.1M991.7 430.0Q830.0 428.7 668.3 429.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 432.0Q671.5 264.7 670.3 97.5M671.0 431.4Q672.1 265.4 669.0 99.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="205.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Coherent actions</text><text x="830.0" y="227.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">1 feature flagging for staged rollout and quick</text><text x="830.0" y="249.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">rollback; 2 add two engineers to payments and one to</text><text x="830.0" y="271.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">personalization; 3 make billing and personalization</text><text x="830.0" y="293.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">self-service for new items; 4 onboard food storage into</text><text x="830.0" y="315.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">the existing systems, then migrate it as a pilot of the</text><text x="830.0" y="337.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">self-service route</text><path d="M9.1 444.1L989.6 444.3L989.6 625.2L9.4 625.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 444.3Q499.8 446.0 991.8 444.3M9.1 444.1Q500.1 447.8 991.2 445.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 444.4Q992.1 535.4 989.4 626.3M990.1 443.9Q990.8 535.2 990.0 626.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 625.6Q500.2 624.2 8.1 624.5M992.5 624.0Q500.2 624.8 7.9 624.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 626.0Q10.9 534.9 11.0 443.7M10.3 625.5Q10.2 534.3 9.6 443.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="508.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">How the author got it done: studied why two predecessors failed (a solution handed down; a working group that stalled); focused on organisational alignment; won sponsor</text><text x="500.0" y="530.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Jesse by promising the launch would not be delayed; recruited Geneva and Fran; scoped to a one-year strategy with an OKR naming her as DRI; interviewed widely; Fran</text><text x="500.0" y="552.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">wrote it, with trade-offs and alternatives. Result: grumbling but momentum, Jody offered the feature-flag system, and the board-game launch reused the isolated</text><text x="500.0" y="574.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">functionality</text></svg>