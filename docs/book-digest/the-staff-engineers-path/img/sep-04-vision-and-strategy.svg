<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">Figure 3-1: a vision and a strategy at different scopes (engineering-wide, team-scoped or between); do not create one unless you need it</text><path d="M9.1 89.9L490.2 89.7L490.7 309.7L11.0 309.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 89.3Q249.7 90.9 491.0 89.1M7.7 89.3Q249.6 91.7 491.5 89.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 87.9Q491.6 199.6 489.3 311.3M489.2 88.5Q488.8 199.5 490.4 310.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 309.5Q249.6 310.0 7.9 309.1M490.9 310.2Q249.4 311.3 7.9 310.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 312.1Q12.7 200.5 10.3 88.9M9.8 312.0Q8.2 200.2 9.0 88.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="162.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Technical vision: the future you want</text><text x="250.0" y="184.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">describes the world after the objectives are met and the biggest problems solved;</text><text x="250.0" y="206.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">a &#x27;north star&#x27;; makes a shared reality in writing; may hold values and goals,</text><text x="250.0" y="228.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">decision principles, decisions already made, an architecture diagram; clear,</text><text x="250.0" y="250.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">opinionated, realistic; a sentence, a 20-page essay or a deck</text><path d="M511.1 89.0L990.3 90.4L990.5 308.8L509.4 311.1Z" fill="#d0dfdc" stroke="none"/><path d="M508.4 89.4Q750.0 91.4 991.6 89.4M509.6 90.2Q750.0 90.6 990.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 199.8 990.3 310.5M991.1 87.5Q988.6 199.0 989.8 310.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 309.6Q749.5 311.6 508.0 310.0M992.1 309.3Q750.2 308.6 508.4 309.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 311.3Q512.0 200.2 510.1 89.1M509.5 312.4Q509.6 200.1 510.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="173.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Technical strategy: the plan of action</text><text x="750.0" y="195.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">how you get past the obstacles; a specific document, not just strategic thinking;</text><text x="750.0" y="217.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">clarity about the path, specific challenges, strong direction, prioritised</text><text x="750.0" y="239.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">actions; a page or a 60-page behemoth; may stand alone or partner a vision</text><path d="M9.3 325.1L991.1 325.8L991.1 551.1L9.7 548.8Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 325.8Q499.6 327.0 990.6 325.5M7.6 325.4Q499.4 327.4 991.1 325.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 323.1Q991.3 437.4 990.5 551.8M990.0 324.0Q990.6 437.3 989.1 550.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 550.4Q500.6 549.3 9.3 549.1M991.7 550.0Q500.0 548.7 8.3 549.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 552.0Q11.5 437.2 10.3 322.5M11.0 551.4Q12.1 437.9 9.0 324.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="410.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Kernel of a strategy (Richard Rumelt, Good Strategy/Bad Strategy)</text><text x="500.0" y="432.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">1 Diagnosis: what is going on, simpler than the messy reality (patterns, metaphors); 2 Guiding policy: the approach for bypassing the obstacles, short, a signpost; 3</text><text x="500.0" y="454.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Coherent actions: what you will and will not do, usually beyond technology (teams, processes, projects), realistic and staffed. Draw on your advantages in a self-</text><text x="500.0" y="476.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">reinforcing loop (Isaac Perez Moncho freed a strong DevOps team&#x27;s time so they could automate and free more)</text></svg>