<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="600" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="40.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Your dashboard of five needs (Figure 4-6, like The Sims panel): a project raises or lowers each; at different times you optimise for different ones, and some projects</text><text x="500.0" y="62.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">need a minimum level of a resource first</text><path d="M9.1 89.9L495.2 89.7L495.7 249.7L11.0 249.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 89.3Q252.2 90.9 496.0 89.1M7.7 89.3Q252.1 91.7 496.5 89.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 87.9Q496.6 169.6 494.3 251.3M494.2 88.5Q493.8 169.5 495.4 250.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 249.5Q252.1 250.0 7.9 249.1M495.9 250.2Q251.9 251.3 7.9 250.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 252.1Q12.7 170.5 10.3 88.9M9.8 252.0Q8.2 170.2 9.0 88.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="143.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Energy (&#x27;smartbrain&#x27;)</text><text x="252.5" y="165.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">the focus to start and do useful work; what drains one person energises another</text><text x="252.5" y="187.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">(Reilly: one-on-ones wipe her out, others thrive); life outside work counts: a baby</text><text x="252.5" y="209.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">that does not sleep, illness, moving</text><path d="M506.1 89.0L990.3 90.4L990.5 248.8L504.4 251.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 89.4Q747.5 91.4 991.6 89.4M504.6 90.2Q747.5 90.6 990.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 169.8 990.3 250.5M991.1 87.5Q988.6 169.0 989.8 250.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 249.6Q747.0 251.6 503.0 250.0M992.1 249.3Q747.7 248.6 503.4 249.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 251.3Q507.0 170.2 505.1 89.1M504.5 252.4Q504.6 170.1 505.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="143.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Quality of life</text><text x="747.5" y="165.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">enjoying the work and people, belief in the goals, money (for example caring for a</text><text x="747.5" y="187.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">parent); work can pay well and still make you unhappy; a step toward a future goal</text><text x="747.5" y="209.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">is a valid reason to stay</text><path d="M9.3 260.1L496.1 260.8L496.1 421.1L9.7 418.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 260.8Q252.1 262.0 495.6 260.5M7.6 260.4Q251.9 262.4 496.1 260.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 258.1Q496.3 339.9 495.5 421.8M495.0 259.0Q495.6 339.8 494.1 420.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 420.4Q253.1 419.3 9.3 419.1M496.7 420.0Q252.5 418.7 8.3 419.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 422.0Q11.5 339.7 10.3 257.5M11.0 421.4Q12.1 340.4 9.0 259.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="313.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Credibility</text><text x="252.5" y="335.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">whether people think you can do it: solve hard problems, show good judgment;</text><text x="252.5" y="357.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">drifting too far from the trenches loses trust; absolutism and rude, jargon-heavy</text><text x="252.5" y="379.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or rambling behaviour lose it; a bar to entry for opportunities</text><path d="M504.1 259.1L989.6 259.3L989.6 420.2L504.4 420.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 259.3Q747.3 261.0 991.8 259.3M504.1 259.1Q747.6 262.8 991.2 260.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 259.4Q992.1 340.4 989.4 421.3M990.1 258.9Q990.8 340.2 990.0 421.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 420.6Q747.7 419.2 503.1 419.5M992.5 419.0Q747.7 419.8 502.9 419.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 421.0Q505.9 339.9 506.0 258.7M505.3 420.5Q505.2 339.3 504.6 258.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="313.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Social capital</text><text x="747.5" y="335.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">whether people want to help you: trust, friendship, goodwill; builds by helping and</text><text x="747.5" y="357.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">delivering; spend it deliberately (you get one &#x27;unreasonable request&#x27;); sponsorship</text><text x="747.5" y="379.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">lends yours to someone else</text><path d="M9.5 429.2L494.1 430.5L495.6 589.4L9.8 591.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.0 429.5Q252.7 426.6 497.4 430.0M7.8 430.6Q252.6 431.6 497.4 430.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 427.6Q494.9 510.1 495.3 592.5M495.0 428.5Q493.2 510.2 495.9 592.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 590.9Q252.6 587.3 8.9 589.2M496.4 589.3Q252.7 586.8 9.0 590.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 592.5Q13.0 510.3 9.3 428.2M9.8 592.3Q12.6 510.3 9.7 428.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="483.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Skills</text><text x="252.5" y="505.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">always slowly decreasing as technology moves; raise them by deliberate learning, by</text><text x="252.5" y="527.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">working near great people, or by learning by doing; a bar to entry for projects and</text><text x="252.5" y="549.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">roles</text></svg>