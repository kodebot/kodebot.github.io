<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="500" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Finite time: 168 hours a week; everything you commit to has an opportunity cost; make the cost visible</text><path d="M9.1 89.9L330.2 89.7L330.7 339.7L11.0 339.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 89.3Q169.7 90.9 331.0 89.1M7.7 89.3Q169.6 91.7 331.5 89.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 87.9Q331.6 214.6 329.3 341.3M329.2 88.5Q328.8 214.5 330.4 340.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 339.5Q169.6 340.0 7.9 339.1M330.9 340.2Q169.4 341.3 7.9 340.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 342.1Q12.7 215.5 10.3 88.9M9.8 342.0Q8.2 215.2 9.0 88.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="177.0" font-size="15.5" fill="#3b2f20" text-anchor="middle">Calendar with non-meetings (Figure 4-1)</text><text x="170.0" y="199.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">put specific focus work in the calendar, not just</text><text x="170.0" y="221.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">meetings; then you see what a side quest displaces and</text><text x="170.0" y="243.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">can say when you will review a 20-page document; a task</text><text x="170.0" y="265.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">rescheduled many times shows how important it really is</text><path d="M341.1 89.0L660.3 90.4L660.5 338.8L339.4 341.1Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 89.4Q500.0 91.4 661.6 89.4M339.6 90.2Q500.0 90.6 660.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 89.2Q661.9 214.8 660.3 340.5M661.1 87.5Q658.6 214.0 659.8 340.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 339.6Q499.5 341.6 338.0 340.0M662.1 339.3Q500.2 338.6 338.4 339.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 341.3Q342.0 215.2 340.1 89.1M339.5 342.4Q339.6 215.1 340.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="177.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Time graph (Figure 4-2)</text><text x="500.0" y="199.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">block the background noise first (all-hands, reviews);</text><text x="500.0" y="221.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the rest holds projects, planning, reviews,</text><text x="500.0" y="243.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">relationships, staying current, mentoring, learning and</text><text x="500.0" y="265.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">lunch; every new commitment adds a block</text><path d="M669.3 90.1L991.1 90.8L991.1 341.1L669.7 338.8Z" fill="#efe0ca" stroke="none"/><path d="M668.5 90.8Q829.6 92.0 990.6 90.5M667.6 90.4Q829.4 92.4 991.1 90.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 88.1Q991.3 214.9 990.5 341.8M990.0 89.0Q990.6 214.8 989.1 340.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 340.4Q830.6 339.3 669.3 339.1M991.7 340.0Q830.0 338.7 668.3 339.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 342.0Q671.5 214.7 670.3 87.5M671.0 341.4Q672.1 215.4 669.0 89.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="177.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">How busy do you like to be? (Figure 4-3)</text><text x="830.0" y="199.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">know your average week, how far you can spike, and</text><text x="830.0" y="221.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">where you fall over; if you allocate 100 percent, a</text><text x="830.0" y="243.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">surprise means dropping something important or spilling</text><text x="830.0" y="265.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">into the rest of life; leave a buffer</text><path d="M9.1 354.1L989.6 354.3L989.6 485.2L9.4 485.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 354.3Q499.8 356.0 991.8 354.3M9.1 354.1Q500.1 357.8 991.2 355.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 354.4Q992.1 420.4 989.4 486.3M990.1 353.9Q990.8 420.2 990.0 486.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 485.6Q500.2 484.2 8.1 484.5M992.5 484.0Q500.2 484.8 7.9 484.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 486.0Q10.9 419.9 11.0 353.7M10.3 485.5Q10.2 419.3 9.6 353.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="415.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Why not a priority queue (Figure 4-4)? Work mixes big and small, engineers differ in fit, and a five-minute introduction would wait behind everything. Choose the next</text><text x="500.0" y="437.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">thing by importance and by what is right for you</text></svg>