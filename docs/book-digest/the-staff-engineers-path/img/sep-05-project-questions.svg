<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Questions to ask about a project, by resource (Figures 4-13 for &#x27;snacking&#x27;; plus the five-things-at-once rule)</text><path d="M9.1 79.9L495.2 79.7L495.7 249.7L11.0 249.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 79.3Q252.2 80.9 496.0 79.1M7.7 79.3Q252.1 81.7 496.5 79.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 77.9Q496.6 164.6 494.3 251.3M494.2 78.5Q493.8 164.5 495.4 250.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 249.5Q252.1 250.0 7.9 249.1M495.9 250.2Q251.9 251.3 7.9 250.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 252.1Q12.7 165.5 10.3 78.9M9.8 252.0Q8.2 165.2 9.0 78.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="127.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Energy</text><text x="252.5" y="149.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">how many things do you already care about (about five at once for Reilly)? does</text><text x="252.5" y="171.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">this kind of work give or take energy? are you procrastinating by &#x27;snacking&#x27; on</text><text x="252.5" y="193.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">low-effort, low-impact work (Des Traynor, Hunter Walk&#x27;s 2x2)? is the fight worth it</text><text x="252.5" y="215.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Camille Fournier, &#x27;OPP&#x27;)?</text><path d="M506.1 79.0L990.3 80.4L990.5 248.8L504.4 251.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 79.4Q747.5 81.4 991.6 79.4M504.6 80.2Q747.5 80.6 990.5 80.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 164.8 990.3 250.5M991.1 77.5Q988.6 164.0 989.8 250.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 249.6Q747.0 251.6 503.0 250.0M992.1 249.3Q747.7 248.6 503.4 249.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 251.3Q507.0 165.2 505.1 79.1M504.5 252.4Q504.6 165.1 505.0 77.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="138.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Quality of life</text><text x="747.5" y="160.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">do you enjoy the work and its mix of technical, product, project and people tasks?</text><text x="747.5" y="182.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">intense or predictable; alone or with people; pairing; on call; travel; talks and</text><text x="747.5" y="204.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">writing; safe colleagues; do you feel good about the goals?</text><path d="M9.3 260.1L496.1 260.8L496.1 431.1L9.7 428.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 260.8Q252.1 262.0 495.6 260.5M7.6 260.4Q251.9 262.4 496.1 260.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 258.1Q496.3 344.9 495.5 431.8M495.0 259.0Q495.6 344.8 494.1 430.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 430.4Q253.1 429.3 9.3 429.1M496.7 430.0Q252.5 428.7 8.3 429.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 432.0Q11.5 344.7 10.3 257.5M11.0 431.4Q12.1 345.4 9.0 259.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="318.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Credibility</text><text x="252.5" y="340.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">does it use your technical skills (do something others failed at)? does it show</text><text x="252.5" y="362.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">leadership: owning outcomes, clear communication? what is the risk of failing an</text><text x="252.5" y="384.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">unwinnable fight?</text><path d="M504.1 259.1L989.6 259.3L989.6 430.2L504.4 430.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 259.3Q747.3 261.0 991.8 259.3M504.1 259.1Q747.6 262.8 991.2 260.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 259.4Q992.1 345.4 989.4 431.3M990.1 258.9Q990.8 345.2 990.0 431.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 430.6Q747.7 429.2 503.1 429.5M992.5 429.0Q747.7 429.8 502.9 429.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 431.0Q505.9 344.9 506.0 258.7M505.3 430.5Q505.2 344.3 504.6 258.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="318.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Social capital</text><text x="747.5" y="340.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">does it match what your company and manager expect at your level? will peers</text><text x="747.5" y="362.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">respect it? are you squandering capital (a new senior hire spent weeks on a fix</text><text x="747.5" y="384.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">nobody needed and lost esteem)? sponsor only people worth the risk</text><path d="M9.5 439.2L494.1 440.5L495.6 609.4L9.8 611.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.0 439.5Q252.7 436.6 497.4 440.0M7.8 440.6Q252.6 441.6 497.4 440.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 437.6Q494.9 525.1 495.3 612.5M495.0 438.5Q493.2 525.2 495.9 612.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 610.9Q252.6 607.3 8.9 609.2M496.4 609.3Q252.7 606.8 9.0 610.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 612.5Q13.0 525.3 9.3 438.2M9.8 612.3Q12.6 525.3 9.7 438.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="509.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Skills</text><text x="252.5" y="531.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">what stories do you want on your future résumé? will people around you raise your</text><text x="252.5" y="553.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">game (&#x27;I&#x27;ll get to learn how CTOs talk to people&#x27;)?</text></svg>