<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Coding, communicating and navigating as project lead</text><path d="M9.1 79.9L490.2 79.7L490.7 309.7L11.0 309.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q249.7 80.9 491.0 79.1M7.7 79.3Q249.6 81.7 491.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 77.9Q491.6 194.6 489.3 311.3M489.2 78.5Q488.8 194.5 490.4 310.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 309.5Q249.6 310.0 7.9 309.1M490.9 310.2Q249.4 311.3 7.9 310.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 312.1Q12.7 195.5 10.3 78.9M9.8 312.0Q8.2 195.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="135.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Coding: exemplar, not bottleneck</text><text x="250.0" y="157.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">coding gives depth and keeps you engaged (Joy Ebertz) but rarely the highest</text><text x="250.0" y="179.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">leverage; beware snacking; pick non-critical-path work; use code as a lever</text><text x="250.0" y="201.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">(Katrina Owen replaced all pagination tests with one pattern); scout and map, and</text><text x="250.0" y="223.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">let the team own the bridge (Ross Donaldson); pair so knowledge spreads (Polina</text><text x="250.0" y="245.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Giralt); be careful in reviews; do not be the only reviewer; whatever you do sets</text><text x="250.0" y="267.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">expectations</text><path d="M511.1 79.0L990.3 80.4L990.5 308.8L509.4 311.1Z" fill="#d6e1cf" stroke="none"/><path d="M508.4 79.4Q750.0 81.4 991.6 79.4M509.6 80.2Q750.0 80.6 990.5 80.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 194.8 990.3 310.5M991.1 77.5Q988.6 194.0 989.8 310.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 309.6Q749.5 311.6 508.0 310.0M992.1 309.3Q750.2 308.6 508.4 309.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 311.3Q512.0 195.2 510.1 79.1M509.5 312.4Q509.6 195.1 510.0 77.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="157.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Communicating</text><text x="750.0" y="179.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">talk to each other: relationships, safe to ask &#x27;what does that term mean?&#x27;; share</text><text x="750.0" y="201.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">status in terms of impact (what users can do now), headlines first, &#x27;that</text><text x="750.0" y="223.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">means...&#x27;; be honest: a &#x27;watermelon&#x27; project is green outside and red inside; if</text><text x="750.0" y="245.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">stuck, ask for help</text><path d="M9.3 325.1L991.1 325.8L991.1 541.1L9.7 538.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 325.8Q499.6 327.0 990.6 325.5M7.6 325.4Q499.4 327.4 991.1 325.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 323.1Q991.3 432.4 990.5 541.8M990.0 324.0Q990.6 432.3 989.1 540.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 540.4Q500.6 539.3 9.3 539.1M991.7 540.0Q500.0 538.7 8.3 539.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 542.0Q11.5 432.2 10.3 322.5M11.0 541.4Q12.1 432.9 9.0 324.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="405.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Navigating obstacles</text><text x="500.0" y="427.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">something will always go wrong (a core technology fails, direction changes, a key person quits); assume it and be curious; you are accountable for rerouting, escalating</text><text x="500.0" y="449.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">or breaking the news; big changes mean restarting the context work; communicate facts and say what you want people to do; your manager&#x27;s job is to make you successful:</text><text x="500.0" y="471.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">&#x27;the biggest failure is not asking for help&#x27;</text></svg>