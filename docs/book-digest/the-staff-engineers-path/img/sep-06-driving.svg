<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="540" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">Driving the project: explore the problem before the solution, then reduce complexity with shared models (Figure 5-2: a graph toward a goal)</text><path d="M9.1 79.9L330.2 79.7L330.7 359.7L11.0 359.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q169.7 80.9 331.0 79.1M7.7 79.3Q169.6 81.7 331.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 77.9Q331.6 219.6 329.3 361.3M329.2 78.5Q328.8 219.5 330.4 360.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 359.5Q169.6 360.0 7.9 359.1M330.9 360.2Q169.4 361.3 7.9 360.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 362.1Q12.7 220.5 10.3 78.9M9.8 362.0Q8.2 220.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="160.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Explore</text><text x="170.0" y="182.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a design with implementation details on day one is</text><text x="170.0" y="204.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">suspicious; find what each team thinks the aim is,</text><text x="170.0" y="226.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">their constraints and vocabulary; build an elevator</text><text x="170.0" y="248.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">pitch and a &#x27;not doing&#x27; list; keep an open mind about</text><text x="170.0" y="270.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">approach; consider existing solutions and what will be</text><text x="170.0" y="292.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">maintained afterwards</text><path d="M341.1 79.0L660.3 80.4L660.5 358.8L339.4 361.1Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 79.4Q500.0 81.4 661.6 79.4M339.6 80.2Q500.0 80.6 660.5 80.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 79.2Q661.9 219.8 660.3 360.5M661.1 77.5Q658.6 219.0 659.8 360.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 359.6Q499.5 361.6 338.0 360.0M662.1 359.3Q500.2 358.6 338.4 359.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 361.3Q342.0 220.2 340.1 79.1M339.5 362.4Q339.6 220.1 340.0 77.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="171.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Clarify with mental models</text><text x="500.0" y="193.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">hook new ideas onto what people know (Alain de Botton&#x27;s</text><text x="500.0" y="215.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">&#x27;beads without a chain&#x27;); analogies and examples</text><text x="500.0" y="237.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">(Kubernetes as a UNIX process); name abstractions</text><text x="500.0" y="259.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">(&#x27;leader election&#x27; versus a consensus algorithm); a</text><text x="500.0" y="281.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">ubiquitous language (Eric Evans) and a glossary</text><path d="M669.3 80.1L991.1 80.8L991.1 361.1L669.7 358.8Z" fill="#efe0ca" stroke="none"/><path d="M668.5 80.8Q829.6 82.0 990.6 80.5M667.6 80.4Q829.4 82.4 991.1 80.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 78.1Q991.3 219.9 990.5 361.8M990.0 79.0Q990.6 219.8 989.1 360.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 360.4Q830.6 359.3 669.3 359.1M991.7 360.0Q830.0 358.7 668.3 359.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 362.0Q671.5 219.7 670.3 77.5M671.0 361.4Q672.1 220.4 669.0 79.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="182.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Pictures and graphs</text><text x="830.0" y="204.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">before-and-after pictures, nesting, ladders, trees; a</text><text x="830.0" y="226.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">stick figure for a person; a cylinder reads as a</text><text x="830.0" y="248.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">datastore and colours carry meaning; a line trending</text><text x="830.0" y="270.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">toward a goal or a disaster point makes the need clear</text><path d="M9.1 374.1L989.6 374.3L989.6 525.2L9.4 525.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 374.3Q499.8 376.0 991.8 374.3M9.1 374.1Q500.1 377.8 991.2 375.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 374.4Q992.1 450.4 989.4 526.3M990.1 373.9Q990.8 450.2 990.0 526.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 525.6Q500.2 524.2 8.1 524.5M992.5 524.0Q500.2 524.8 7.9 524.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 526.0Q10.9 449.9 11.0 373.7M10.3 525.5Q10.2 449.3 9.6 373.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="445.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">The project lead is the one who drives: &#x27;driving doesn&#x27;t mean you put your foot on the gas and go straight&#x27; (Kripa Krishnan, &#x27;Avoid the Lake!&#x27;): choose the route,</text><text x="500.0" y="467.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">decide, react to hazards</text></svg>