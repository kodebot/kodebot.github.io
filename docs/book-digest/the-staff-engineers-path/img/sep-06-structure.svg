<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="600" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Giving the project structure: roles, recruiting, scope, estimates, logistics, kickoff</text><path d="M9.1 84.9L495.2 84.7L495.7 234.7L11.0 234.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 84.3Q252.2 85.9 496.0 84.1M7.7 84.3Q252.1 86.7 496.5 84.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 82.9Q496.6 159.6 494.3 236.3M494.2 83.5Q493.8 159.5 495.4 235.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 234.5Q252.1 235.0 7.9 234.1M495.9 235.2Q251.9 236.3 7.9 235.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 237.1Q12.7 160.5 10.3 83.9M9.8 237.0Q8.2 160.2 9.0 83.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="111.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Define roles (Table 5-1)</text><text x="252.5" y="133.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">table of leadership responsibilities: product manager (needs, KPIs, user-visible</text><text x="252.5" y="155.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">decisions), technical lead (architecture, technical approach, coaching),</text><text x="252.5" y="177.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">engineering manager (team health, performance), TPM (timelines, status); RACI:</text><text x="252.5" y="199.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">responsible, accountable (one), consulted, informed; Lara Hogan&#x27;s what/how/why Venn</text><text x="252.5" y="221.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">diagram; &#x27;uncontroversial structure is the superpower&#x27;</text><path d="M506.1 84.0L990.3 85.4L990.5 233.8L504.4 236.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 84.4Q747.5 86.4 991.6 84.4M504.6 85.2Q747.5 85.6 990.5 85.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 84.2Q991.9 159.8 990.3 235.5M991.1 82.5Q988.6 159.0 989.8 235.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 234.6Q747.0 236.6 503.0 235.0M992.1 234.3Q747.7 233.6 503.4 234.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 236.3Q507.0 160.2 505.1 84.1M504.5 237.4Q504.6 160.1 505.0 82.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="133.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Recruit people</text><text x="747.5" y="155.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">fill missing roles; find complementary skills, people who love what you hate; leads</text><text x="747.5" y="177.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">with optimism, conflict resolution and communication (Mohit Cheppudira); avoid</text><text x="747.5" y="199.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">single points of failure</text><path d="M9.3 245.1L496.1 245.8L496.1 396.1L9.7 393.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 245.8Q252.1 247.0 495.6 245.5M7.6 245.4Q251.9 247.4 496.1 245.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 243.1Q496.3 319.9 495.5 396.8M495.0 244.0Q495.6 319.8 494.1 395.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 395.4Q253.1 394.3 9.3 394.1M496.7 395.0Q252.5 393.7 8.3 394.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 397.0Q11.5 319.7 10.3 242.5M11.0 396.4Q12.1 320.4 9.0 244.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="293.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Agree scope</text><text x="252.5" y="315.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">time, budget, scope triangle; small incremental milestones that are usable (Jackie</text><text x="252.5" y="337.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Benowitz: milestones as beta tests); workstreams and phases; always a milestone in</text><text x="252.5" y="359.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">sight and a date beside it</text><path d="M504.1 244.1L989.6 244.3L989.6 395.2L504.4 395.1Z" fill="#efe0ca" stroke="none"/><path d="M502.7 244.3Q747.3 246.0 991.8 244.3M504.1 244.1Q747.6 247.8 991.2 245.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 244.4Q992.1 320.4 989.4 396.3M990.1 243.9Q990.8 320.2 990.0 396.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 395.6Q747.7 394.2 503.1 394.5M992.5 394.0Q747.7 394.8 502.9 394.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 396.0Q505.9 319.9 506.0 243.7M505.3 395.5Q505.2 319.3 504.6 243.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="293.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Estimate time</text><text x="747.5" y="315.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">almost nobody is good; Hunt and Thomas: gain experience on the same project by</text><text x="747.5" y="337.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">delivering slices and update; keep an estimate log; tell dependent teams early</text><text x="747.5" y="359.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(platform teams hate last-minute requests)</text><path d="M9.5 404.2L494.1 405.5L495.6 554.4L9.8 556.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.0 404.5Q252.7 401.6 497.4 405.0M7.8 405.6Q252.6 406.6 497.4 405.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 402.6Q494.9 480.1 495.3 557.5M495.0 403.5Q493.2 480.2 495.9 557.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 555.9Q252.6 552.3 8.9 554.2M496.4 554.3Q252.7 551.8 9.0 555.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 557.5Q13.0 480.3 9.3 403.2M9.8 557.3Q12.6 480.3 9.7 403.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="453.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Agree logistics</text><text x="252.5" y="475.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">meeting cadence, informal communication (social channel, icebreakers), status</text><text x="252.5" y="497.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">format, a documentation home page, development practices (languages, deployment,</text><text x="252.5" y="519.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">review, tests, feature flags)</text><path d="M506.0 404.5L990.5 404.4L989.4 556.1L503.8 554.1Z" fill="#d6e1cf" stroke="none"/><path d="M503.7 403.9Q747.1 401.7 990.6 404.7M504.2 405.4Q748.3 404.5 992.4 405.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 403.5Q987.5 480.4 989.0 557.3M990.6 403.4Q991.0 480.1 990.7 556.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 554.2Q747.9 554.3 503.2 555.1M990.6 554.0Q747.5 556.3 504.4 554.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.8 556.2Q506.4 480.2 505.5 404.3M504.9 555.7Q503.2 479.1 503.9 402.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="464.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Kickoff meeting</text><text x="747.5" y="486.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">who we are, goals, what has happened, structures, what is next, what you want</text><text x="747.5" y="508.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">people to do (be explicit, not hinting), how to ask questions</text></svg>