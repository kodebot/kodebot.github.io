<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="580" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Arrived, somewhere? (Figure 6-5): three ways to declare victory too soon</text><path d="M9.1 79.9L330.2 79.7L330.7 409.7L11.0 409.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q169.7 80.9 331.0 79.1M7.7 79.3Q169.6 81.7 331.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 77.9Q331.6 244.6 329.3 411.3M329.2 78.5Q328.8 244.5 330.4 410.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 409.5Q169.6 410.0 7.9 409.1M330.9 410.2Q169.4 411.3 7.9 410.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 412.1Q12.7 245.5 10.3 78.9M9.8 412.0Q8.2 245.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="196.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">It is code complete</text><text x="170.0" y="218.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">&#x27;nobody wants to use software, they want to catch a</text><text x="170.0" y="240.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Pokemon&#x27; (Heidi Waterhouse). Define done up front</text><text x="170.0" y="262.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">(definition of done, user acceptance tests); be your</text><text x="170.0" y="284.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">own user (dogfood); celebrate landings, not launches</text><text x="170.0" y="306.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">(the old system turned off, not the new one launched)</text><path d="M341.1 79.0L660.3 80.4L660.5 408.8L339.4 411.1Z" fill="#efe0ca" stroke="none"/><path d="M338.4 79.4Q500.0 81.4 661.6 79.4M339.6 80.2Q500.0 80.6 660.5 80.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 79.2Q661.9 244.8 660.3 410.5M661.1 77.5Q658.6 244.0 659.8 410.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 409.6Q499.5 411.6 338.0 410.0M662.1 409.3Q500.2 408.6 338.4 409.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 411.3Q342.0 245.2 340.1 79.1M339.5 412.4Q339.6 245.1 340.0 77.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="185.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Nobody is using it</text><text x="500.0" y="207.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">&#x27;Beware of the Leopard&#x27; projects: built and hidden.</text><text x="500.0" y="229.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">Sell it: keep telling people (emails, road shows,</text><text x="500.0" y="251.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">posters, testimonials, white-glove service); make it</text><text x="500.0" y="273.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">discoverable (links, shortlinks for likely</text><text x="500.0" y="295.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">misspellings); a harvest that is never taken to market</text><text x="500.0" y="317.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">is wasted (Michael R. Bernstein)</text><path d="M669.3 80.1L991.1 80.8L991.1 411.1L669.7 408.8Z" fill="#eed5cc" stroke="none"/><path d="M668.5 80.8Q829.6 82.0 990.6 80.5M667.6 80.4Q829.4 82.4 991.1 80.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 78.1Q991.3 244.9 990.5 411.8M990.0 79.0Q990.6 244.8 989.1 410.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 410.4Q830.6 409.3 669.3 409.1M991.7 410.0Q830.0 408.7 668.3 409.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 412.0Q671.5 244.7 670.3 77.5M671.0 411.4Q672.1 245.4 669.0 79.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="196.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Built on a shaky foundation</text><text x="830.0" y="218.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">&#x27;there&#x27;s no such thing as a temporary solution&#x27; (an</text><text x="830.0" y="240.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">uncabled data centre rack stays forever). Set a culture</text><text x="830.0" y="262.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">of quality (always ask for tests and monitoring); make</text><text x="830.0" y="284.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">foundation work a user story; negotiate engineer-led</text><text x="830.0" y="306.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">time (fix-it weeks, 20 percent time, a rotation)</text><path d="M9.1 424.1L989.6 424.3L989.6 565.2L9.4 565.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 424.3Q499.8 426.0 991.8 424.3M9.1 424.1Q500.1 427.8 991.2 425.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 424.4Q992.1 495.4 989.4 566.3M990.1 423.9Q990.8 495.2 990.0 566.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 565.6Q500.2 564.2 8.1 564.5M992.5 564.0Q500.2 564.8 7.9 564.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 566.0Q10.9 494.9 11.0 423.7M10.3 565.5Q10.2 494.3 9.6 423.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="501.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">The way to catch these: look at the whole project, not only the tasks completed; the users&#x27; view of &#x27;done&#x27; is the one that counts</text></svg>