<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="600" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">You are lost: three kinds, three sets of techniques</text><path d="M9.1 79.9L330.2 79.7L330.7 479.7L11.0 479.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 79.3Q169.7 80.9 331.0 79.1M7.7 79.3Q169.6 81.7 331.5 79.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 77.9Q331.6 279.6 329.3 481.3M329.2 78.5Q328.8 279.5 330.4 480.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 479.5Q169.6 480.0 7.9 479.1M330.9 480.2Q169.4 481.3 7.9 480.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 482.1Q12.7 280.5 10.3 78.9M9.8 482.0Q8.2 280.2 9.0 78.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="220.0" font-size="16.5" fill="#3b2f20" text-anchor="middle">You do not know where you are going</text><text x="170.0" y="242.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">40 teams on a legacy architecture, many voices,</text><text x="170.0" y="264.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">analysis paralysis. Clarify roles (you decide, with</text><text x="170.0" y="286.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">sponsor backing); choose a strategy (no implementation</text><text x="170.0" y="308.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">talk until the problem is agreed); choose a problem</text><text x="170.0" y="330.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">(wrong is better than vague); or choose a stakeholder</text><text x="170.0" y="352.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and deliver in vertical slices</text><path d="M341.1 79.0L660.3 80.4L660.5 478.8L339.4 481.1Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 79.4Q500.0 81.4 661.6 79.4M339.6 80.2Q500.0 80.6 660.5 80.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 79.2Q661.9 279.8 660.3 480.5M661.1 77.5Q658.6 279.0 659.8 480.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 479.6Q499.5 481.6 338.0 480.0M662.1 479.3Q500.2 478.6 338.4 479.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 481.3Q342.0 280.2 340.1 79.1M339.5 482.4Q339.6 280.1 340.0 77.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="220.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">You do not know how to get there</text><text x="500.0" y="242.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">articulate the problem; revisit assumptions (a solution</text><text x="500.0" y="264.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">may be baked in; Lamport: specify the problem</text><text x="500.0" y="286.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">independent of the solution); give it time; increase</text><text x="500.0" y="308.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">capacity (dedicated, well-rested time); prior art</text><text x="500.0" y="330.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">(aviation, medicine); learn from others; try a</text><text x="500.0" y="352.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">different angle; start smaller; ask for help</text><path d="M669.3 80.1L991.1 80.8L991.1 481.1L669.7 478.8Z" fill="#d6e1cf" stroke="none"/><path d="M668.5 80.8Q829.6 82.0 990.6 80.5M667.6 80.4Q829.4 82.4 991.1 80.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 78.1Q991.3 279.9 990.5 481.8M990.0 79.0Q990.6 279.8 989.1 480.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 480.4Q830.6 479.3 669.3 479.1M991.7 480.0Q830.0 478.7 668.3 479.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 482.0Q671.5 279.7 670.3 77.5M671.0 481.4Q672.1 280.4 669.0 79.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="220.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">You do not know where you stand</text><text x="830.0" y="242.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">priorities and leaders change; silence may mean it is</text><text x="830.0" y="264.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">going well or that you were forgotten. Clarify</text><text x="830.0" y="286.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">organisational support by asking your sponsor; clarify</text><text x="830.0" y="308.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">roles (RACI; &#x27;unofficial lead&#x27; invites failure); ask</text><text x="830.0" y="330.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">for what you need (a mention at all-hands); refuel with</text><text x="830.0" y="352.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">a new kickoff or phase 2 and fresh people</text><path d="M9.1 494.1L989.6 494.3L989.6 585.2L9.4 585.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 494.3Q499.8 496.0 991.8 494.3M9.1 494.1Q500.1 497.8 991.2 495.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 494.4Q991.5 540.4 989.4 586.3M990.1 493.9Q990.7 540.2 990.0 586.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 585.6Q500.2 584.2 8.1 584.5M992.5 584.0Q500.2 584.8 7.9 584.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 586.0Q10.9 539.9 11.0 493.7M10.3 585.5Q10.2 539.3 9.6 493.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="546.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Check first: &#x27;Don&#x27;t forget, seeing a problem doesn&#x27;t mean you should jump on it&#x27;; defend your time</text></svg>