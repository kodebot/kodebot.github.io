<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Remember the goal: a business, a user and a team</text><path d="M9.1 79.9L330.2 79.7L330.7 379.7L11.0 379.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q169.7 80.9 331.0 79.1M7.7 79.3Q169.6 81.7 331.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 77.9Q331.6 229.6 329.3 381.3M329.2 78.5Q328.8 229.5 330.4 380.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 379.5Q169.6 380.0 7.9 379.1M330.9 380.2Q169.4 381.3 7.9 380.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 382.1Q12.7 230.5 10.3 78.9M9.8 382.0Q8.2 230.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="159.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">There is a business</text><text x="170.0" y="181.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">software is a means; adapt to the situation (a</text><text x="170.0" y="203.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">hackathon with throwaway code, a holiday launch,</text><text x="170.0" y="225.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">restart everything during an outage); priorities change</text><text x="170.0" y="247.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">with the company; keep a budget in mind without</text><text x="170.0" y="269.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">freezing; headcount is finite; spend your &#x27;innovation</text><text x="170.0" y="291.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">tokens&#x27; (Dan McKinley) wisely; build the most useful</text><text x="170.0" y="313.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">thing, not the most fun</text><path d="M341.1 79.0L660.3 80.4L660.5 378.8L339.4 381.1Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 79.4Q500.0 81.4 661.6 79.4M339.6 80.2Q500.0 80.6 660.5 80.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 79.2Q661.9 229.8 660.3 380.5M661.1 77.5Q658.6 229.0 659.8 380.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 379.6Q499.5 381.6 338.0 380.0M662.1 379.3Q500.2 378.6 338.4 379.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 381.3Q342.0 230.2 340.1 79.1M339.5 382.4Q339.6 230.1 340.0 77.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="181.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">There is a user</text><text x="500.0" y="203.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">know who uses it and how (a vendor said &#x27;not many</text><text x="500.0" y="225.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">people use Chrome&#x27;; in the cafeteria everyone did);</text><text x="500.0" y="247.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">write requirements and share them, get APIs and mockups</text><text x="500.0" y="269.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">reviewed first; if the user is not happy you built the</text><text x="500.0" y="291.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">wrong thing, whether or not it met the spec</text><path d="M669.3 80.1L991.1 80.8L991.1 381.1L669.7 378.8Z" fill="#efe0ca" stroke="none"/><path d="M668.5 80.8Q829.6 82.0 990.6 80.5M667.6 80.4Q829.4 82.4 991.1 80.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 78.1Q991.3 229.9 990.5 381.8M990.0 79.0Q990.6 229.8 989.1 380.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 380.4Q830.6 379.3 669.3 379.1M991.7 380.0Q830.0 378.7 668.3 379.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 382.0Q671.5 229.7 670.3 77.5M671.0 381.4Q672.1 230.4 669.0 79.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="192.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">There is a team</text><text x="830.0" y="214.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">do not become a single point of failure; do not jump on</text><text x="830.0" y="236.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">every problem; empowering someone else is as much a</text><text x="830.0" y="258.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">victory; your impact is what would not have happened</text><text x="830.0" y="280.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">without you</text><path d="M9.1 394.1L989.6 394.3L989.6 505.2L9.4 505.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 394.3Q499.8 396.0 991.8 394.3M9.1 394.1Q500.1 397.8 991.2 395.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 394.4Q991.8 450.4 989.4 506.3M990.1 393.9Q990.7 450.2 990.0 506.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 505.6Q500.2 504.2 8.1 504.5M992.5 504.0Q500.2 504.8 7.9 504.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 506.0Q10.9 449.9 11.0 393.7M10.3 505.5Q10.2 449.3 9.6 393.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="456.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">&#x27;Be the engineer that everyone wants to work with.&#x27; (John Allspaw): the measure of your success is whether others want to work with you</text></svg>