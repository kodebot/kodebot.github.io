<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="16.0" fill="#3b2f20" text-anchor="middle">Look ahead: &#x27;software engineering is programming integrated over time&#x27; (Titus Winters); plant seeds you will not see grow</text><path d="M9.1 84.9L495.2 84.7L495.7 339.7L11.0 339.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 84.3Q252.2 85.9 496.0 84.1M7.7 84.3Q252.1 86.7 496.5 84.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 82.9Q496.6 212.1 494.3 341.3M494.2 83.5Q493.8 212.0 495.4 340.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 339.5Q252.1 340.0 7.9 339.1M495.9 340.2Q251.9 341.3 7.9 340.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 342.1Q12.7 213.0 10.3 83.9M9.8 342.0Q8.2 212.7 9.0 83.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="163.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Anticipate</text><text x="252.5" y="185.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">ask what Future You will wish you had done; telegraph what is coming (announce an</text><text x="252.5" y="207.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">intent to deprecate); tidy up (tests, style guide, no traps); keep your tools sharp</text><text x="252.5" y="229.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">(faster builds, deleted flaky tests); create institutional memory (decision</text><text x="252.5" y="251.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">records, diagrams with the obvious things, searchable keywords; John Reese as</text><text x="252.5" y="273.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">systems historian)</text><path d="M506.1 84.0L990.3 85.4L990.5 338.8L504.4 341.1Z" fill="#efe0ca" stroke="none"/><path d="M503.4 84.4Q747.5 86.4 991.6 84.4M504.6 85.2Q747.5 85.6 990.5 85.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 84.2Q991.9 212.3 990.3 340.5M991.1 82.5Q988.6 211.5 989.8 340.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 339.6Q747.0 341.6 503.0 340.0M992.1 339.3Q747.7 338.6 503.4 339.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 341.3Q507.0 212.7 505.1 84.1M504.5 342.4Q504.6 212.6 505.0 82.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="185.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Expect failure</text><text x="747.5" y="207.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">a retrospective of a Hosted Graphite outage caused by an AWS outage they did not</text><text x="747.5" y="229.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">use; test error paths; have a response plan; game days and chaos tooling; untested</text><text x="747.5" y="251.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">backups are no backups</text><path d="M9.3 350.1L496.1 350.8L496.1 606.1L9.7 603.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 350.8Q252.1 352.0 495.6 350.5M7.6 350.4Q251.9 352.4 496.1 350.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 348.1Q496.3 477.4 495.5 606.8M495.0 349.0Q495.6 477.3 494.1 605.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 605.4Q253.1 604.3 9.3 604.1M496.7 605.0Q252.5 603.7 8.3 604.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 607.0Q11.5 477.2 10.3 347.5M11.0 606.4Q12.1 477.9 9.0 349.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="439.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Optimise for maintenance</text><text x="252.5" y="461.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">make it understandable (docs for the future reader, one simple picture, observable</text><text x="252.5" y="483.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">systems); keep it simple (find a second solution; Martin Fowler: write code humans</text><text x="252.5" y="505.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">understand; complexity is a cost); contain unavoidable complexity in one component;</text><text x="252.5" y="527.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">build to decommission with clean interfaces</text><path d="M504.1 349.1L989.6 349.3L989.6 605.2L504.4 605.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 349.3Q747.3 351.0 991.8 349.3M504.1 349.1Q747.6 352.8 991.2 350.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 349.4Q992.1 477.9 989.4 606.3M990.1 348.9Q990.8 477.7 990.0 606.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 605.6Q747.7 604.2 503.1 604.5M992.5 604.0Q747.7 604.8 502.9 604.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 606.0Q505.9 477.4 506.0 348.7M505.3 605.5Q505.2 476.8 504.6 348.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="461.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Create future leaders</text><text x="747.5" y="483.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">junior engineers are future seniors; give them hands-on problems; chapter 8</text><text x="747.5" y="505.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">explains how</text></svg>