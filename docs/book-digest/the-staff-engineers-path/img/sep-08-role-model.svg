<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 85.3L10.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.6 49.7 990.0 86.2M989.9 12.9Q991.3 49.5 990.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 84.4Q500.1 87.2 8.7 84.5M991.4 84.7Q499.6 83.2 7.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 86.0Q10.2 49.3 10.1 12.7M10.2 85.9Q8.9 50.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="45.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">You are a role model now: people assume you know what you are talking about, so how you act is how others will act; the clearest sign of company values is what gets</text><text x="500.0" y="67.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">people promoted (Carla Geisser: &#x27;don&#x27;t think out loud&#x27;; half-baked ideas become projects)</text><path d="M9.1 99.9L495.2 99.7L495.7 219.7L11.0 219.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 99.3Q252.2 100.9 496.0 99.1M7.7 99.3Q252.1 101.7 496.5 99.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 97.9Q496.5 159.6 494.3 221.3M494.2 98.5Q493.8 159.5 495.4 220.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 219.5Q252.1 220.0 7.9 219.1M495.9 220.2Q251.9 221.3 7.9 220.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 222.1Q12.6 160.5 10.3 98.9M9.8 222.0Q8.3 160.2 9.0 98.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="155.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1 Be competent</text><text x="252.5" y="177.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">know things, be self-aware, hold high standards, be reliable</text><path d="M506.1 99.0L990.3 100.4L990.5 218.8L504.4 221.1Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 99.4Q747.5 101.4 991.6 99.4M504.6 100.2Q747.5 100.6 990.5 100.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 99.2Q991.9 159.8 990.3 220.5M991.1 97.5Q988.7 159.0 989.8 220.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 219.6Q747.0 221.6 503.0 220.0M992.1 219.3Q747.7 218.6 503.4 219.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 221.3Q506.9 160.2 505.1 99.1M504.5 222.4Q504.6 160.1 505.0 97.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="155.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2 Be responsible</text><text x="747.5" y="177.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">take ownership, take charge, create calm</text><path d="M9.3 230.1L496.1 230.8L496.1 351.1L9.7 348.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 230.8Q252.1 232.0 495.6 230.5M7.6 230.4Q251.9 232.4 496.1 230.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 228.1Q496.3 289.9 495.5 351.8M495.0 229.0Q495.6 289.8 494.1 350.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 350.4Q253.1 349.3 9.3 349.1M496.7 350.0Q252.5 348.7 8.3 349.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 352.0Q11.4 289.7 10.3 227.5M11.0 351.4Q12.0 290.4 9.0 229.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="285.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3 Remember the goal</text><text x="252.5" y="307.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">there is a business, a user and a team</text><path d="M504.1 229.1L989.6 229.3L989.6 350.2L504.4 350.1Z" fill="#d0dfdc" stroke="none"/><path d="M502.7 229.3Q747.3 231.0 991.8 229.3M504.1 229.1Q747.6 232.8 991.2 230.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 229.4Q991.9 290.4 989.4 351.3M990.1 228.9Q990.8 290.2 990.0 351.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 350.6Q747.7 349.2 503.1 349.5M992.5 349.0Q747.7 349.8 502.9 349.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 351.0Q505.9 289.9 506.0 228.7M505.3 350.5Q505.2 289.3 504.6 228.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="285.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">4 Look ahead</text><text x="747.5" y="307.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">anticipate, expect failure, optimise for maintenance, create future leaders</text><path d="M9.5 359.2L989.1 360.5L990.6 509.4L9.8 511.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 359.5Q500.2 356.6 992.4 360.0M7.8 360.6Q500.1 361.6 992.4 360.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 357.6Q989.9 435.1 990.3 512.5M990.0 358.5Q988.2 435.2 990.9 512.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 510.9Q500.1 507.3 8.9 509.2M991.4 509.3Q500.2 506.8 9.0 510.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 512.5Q13.0 435.3 9.3 358.2M9.8 512.3Q12.6 435.3 9.7 358.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="430.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">You do not need to be loud or a public figure; many of the best leaders are quiet and thoughtful. If leadership is frightening, start small: compliment a success in a</text><text x="500.0" y="452.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">public channel, offer to onboard someone. Aspirational ideals, not gatekeeping; if the advice contradicts your judgment, trust yourself</text></svg>