<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="600" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Advice: check it is welcome, then scale it by writing and speaking</text><path d="M9.1 79.9L490.2 79.7L490.7 329.7L11.0 329.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q249.7 80.9 491.0 79.1M7.7 79.3Q249.6 81.7 491.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 77.9Q491.6 204.6 489.3 331.3M489.2 78.5Q488.8 204.5 490.4 330.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 329.5Q249.6 330.0 7.9 329.1M490.9 330.2Q249.4 331.3 7.9 330.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 332.1Q12.7 205.5 10.3 78.9M9.8 332.0Q8.2 205.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="156.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Is it welcome?</text><text x="250.0" y="178.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">solicited versus unsolicited: ask &#x27;Can I offer some advice?&#x27;; unsolicited is</text><text x="250.0" y="200.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">valuable when someone cannot see out of a bad situation or lacks key information</text><text x="250.0" y="222.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">(Foo platform is being turned down); a hard but kind example is &#x27;you talk to your</text><text x="250.0" y="244.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">shoes when you present and it is hard to understand you&#x27;; otherwise write a blog</text><text x="250.0" y="266.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">post</text><path d="M511.1 79.0L990.3 80.4L990.5 328.8L509.4 331.1Z" fill="#d6e1cf" stroke="none"/><path d="M508.4 79.4Q750.0 81.4 991.6 79.4M509.6 80.2Q750.0 80.6 990.5 80.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 204.8 990.3 330.5M991.1 77.5Q988.6 204.0 989.8 330.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 329.6Q749.5 331.6 508.0 330.0M992.1 329.3Q750.2 328.6 508.4 329.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 331.3Q512.0 205.2 510.1 79.1M509.5 332.4Q509.6 205.1 510.0 77.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="156.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Individual: mentoring, answers, feedback</text><text x="750.0" y="178.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">mentoring shares your experience (Neha Batra), but your advice may not fit others</text><text x="750.0" y="200.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">(Lara Hogan: &#x27;be louder&#x27; can undermine); ask &#x27;vent or advice?&#x27;; set expectations</text><text x="750.0" y="222.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">(weekly for six weeks); be accessible and answer the implicit question (/user</text><text x="750.0" y="244.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">versus /fulluser); in reviews say whether a suggestion is optional; be kindly</text><text x="750.0" y="266.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">honest; in peer reviews watch bias (&#x27;consensus building&#x27; or &#x27;indecisive&#x27;)</text><path d="M9.3 345.1L991.1 345.8L991.1 586.1L9.7 583.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 345.8Q499.6 347.0 990.6 345.5M7.6 345.4Q499.4 347.4 991.1 345.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 343.1Q991.3 464.9 990.5 586.8M990.0 344.0Q990.6 464.8 989.1 585.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 585.4Q500.6 584.3 9.3 584.1M991.7 585.0Q500.0 583.7 8.3 584.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 587.0Q11.5 464.7 10.3 342.5M11.0 586.4Q12.1 465.4 9.0 344.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="449.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Group and catalyst write it down once (FAQ, how-to, &#x27;Testing on the Toilet&#x27; one-pagers at Google), take a microphone (all-hands, talks) and use it to carry your message</text><text x="500.0" y="471.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">(the circular dependency outage story); catalyst: encourage writing in oral cultures starting small, set up monthly tech talks with at least three organisers, a</text><text x="500.0" y="493.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">mentorship program (heavier admin than expected, and generally not in an engineer&#x27;s job description)</text></svg>