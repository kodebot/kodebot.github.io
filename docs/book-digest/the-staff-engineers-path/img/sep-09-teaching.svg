<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="660" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Teaching: understanding, not just telling; give a goal, hands-on practice and an artifact</text><path d="M9.1 79.9L330.2 79.7L330.7 359.7L11.0 359.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q169.7 80.9 331.0 79.1M7.7 79.3Q169.6 81.7 331.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 77.9Q331.6 219.6 329.3 361.3M329.2 78.5Q328.8 219.5 330.4 360.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 359.5Q169.6 360.0 7.9 359.1M330.9 360.2Q169.4 361.3 7.9 360.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 362.1Q12.7 220.5 10.3 78.9M9.8 362.0Q8.2 220.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="182.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Unlock a topic</text><text x="170.0" y="204.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">have a lesson-plan goal: draw the system and explain</text><text x="170.0" y="226.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">it, send a first pull request, handle three to five</text><text x="170.0" y="248.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">scenarios alone; the student does (types, leads) and</text><text x="170.0" y="270.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">leaves with a diagram or snippet</text><path d="M341.1 79.0L660.3 80.4L660.5 358.8L339.4 361.1Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 79.4Q500.0 81.4 661.6 79.4M339.6 80.2Q500.0 80.6 660.5 80.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 79.2Q661.9 219.8 660.3 360.5M661.1 77.5Q658.6 219.0 659.8 360.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 359.6Q499.5 361.6 338.0 360.0M662.1 359.3Q500.2 358.6 338.4 359.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 361.3Q342.0 220.2 340.1 79.1M339.5 362.4Q339.6 220.1 340.0 77.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="193.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Shadowing, pairing, reverse shadowing (Figure 8-2)</text><text x="500.0" y="215.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">shadowing: you do, they watch; pairing: together,</text><text x="500.0" y="237.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">checking understanding live; reverse shadowing: they</text><text x="500.0" y="259.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">do, you give notes (also a guardrail)</text><path d="M669.3 80.1L991.1 80.8L991.1 361.1L669.7 358.8Z" fill="#efe0ca" stroke="none"/><path d="M668.5 80.8Q829.6 82.0 990.6 80.5M667.6 80.4Q829.4 82.4 991.1 80.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 78.1Q991.3 219.9 990.5 361.8M990.0 79.0Q990.6 219.8 989.1 360.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 360.4Q830.6 359.3 669.3 359.1M991.7 360.0Q830.0 358.7 668.3 359.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 362.0Q671.5 219.7 670.3 77.5M671.0 361.4Q672.1 220.4 669.0 79.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="171.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Review to teach</text><text x="830.0" y="193.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">understand the assignment (stage and need); explain</text><text x="830.0" y="215.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">why, not just what; give an example; label what matters</text><text x="830.0" y="237.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">(must, nice, nitpick, your call); choose battles</text><text x="830.0" y="259.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">(several passes); if you mean yes say yes; be human, or</text><text x="830.0" y="281.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">pair if the change needs much work</text><path d="M9.1 374.1L489.6 374.3L489.6 525.2L9.4 525.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 374.3Q249.8 376.0 491.8 374.3M9.1 374.1Q250.1 377.8 491.2 375.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.0 374.4Q492.1 450.4 489.4 526.3M490.1 373.9Q490.8 450.2 490.0 526.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M492.4 525.6Q250.2 524.2 8.1 524.5M492.5 524.0Q250.2 524.8 7.9 524.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 526.0Q10.9 449.9 11.0 373.7M10.3 525.5Q10.2 449.3 9.6 373.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="434.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Coaching (differs from mentoring) helps people solve problems themselves: open</text><text x="250.0" y="456.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">questions, active listening, making space (count to five); avoids &#x27;Yes, but...&#x27;</text><text x="250.0" y="478.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Julia Milner)</text><path d="M509.5 374.2L989.1 375.5L990.6 524.4L509.8 526.2Z" fill="#f1ede5" stroke="none"/><path d="M508.0 374.5Q750.2 371.6 992.4 375.0M507.8 375.6Q750.1 376.6 992.4 375.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 372.6Q989.9 450.1 990.3 527.5M990.0 373.5Q988.2 450.2 990.9 527.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 525.9Q750.1 522.3 508.9 524.2M991.4 524.3Q750.2 521.8 509.0 525.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.9 527.5Q513.0 450.3 509.3 373.2M509.8 527.3Q512.6 450.3 509.7 373.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="423.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Group and catalyst classes with a goal and exercises (high up-front cost,</text><text x="750.0" y="445.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">amortised); codelabs; Reilly&#x27;s networking library learning path (jokes file and</text><text x="750.0" y="467.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">team list pull requests, a toy client and server); teach people to teach and add</text><text x="750.0" y="489.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">to onboarding</text></svg>