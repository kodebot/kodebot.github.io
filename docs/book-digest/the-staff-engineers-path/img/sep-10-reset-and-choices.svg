<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Prepare to reset, and your choices matter</text><path d="M9.1 79.9L490.2 79.7L490.7 329.7L11.0 329.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q249.7 80.9 491.0 79.1M7.7 79.3Q249.6 81.7 491.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 77.9Q491.6 204.6 489.3 331.3M489.2 78.5Q488.8 204.5 490.4 330.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 329.5Q249.6 330.0 7.9 329.1M490.9 330.2Q249.4 331.3 7.9 330.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 332.1Q12.7 205.5 10.3 78.9M9.8 332.0Q8.2 205.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="156.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Prepare to reset</text><text x="250.0" y="178.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">in a new role your three maps are out of date: redraw them. Cindy Sridharan:</text><text x="250.0" y="200.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">leaders who try to mould the organisation in the image of their last workplace</text><text x="250.0" y="222.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">tend to fail more than those who learn the ropes and adapt. Talk to people, find</text><text x="250.0" y="244.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">the rooms, learn the shadow org chart, be humble about previous decisions, enjoy</text><text x="250.0" y="266.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the quiet time graph</text><path d="M511.1 79.0L990.3 80.4L990.5 328.8L509.4 331.1Z" fill="#efe0ca" stroke="none"/><path d="M508.4 79.4Q750.0 81.4 991.6 79.4M509.6 80.2Q750.0 80.6 990.5 80.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 204.8 990.3 330.5M991.1 77.5Q988.6 204.0 989.8 330.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 329.6Q749.5 331.6 508.0 330.0M992.1 329.3Q750.2 328.6 508.4 329.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 331.3Q512.0 205.2 510.1 79.1M509.5 332.4Q509.6 205.1 510.0 77.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="167.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Your choices matter</text><text x="750.0" y="189.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">&#x27;You need to take software seriously&#x27;: lost essays, dropped insurance claims,</text><text x="750.0" y="211.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">algorithmic bias, abuse, privacy leaks; life-critical systems (planes, medical</text><text x="750.0" y="233.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">treatment, nuclear power) will be run by the engineers you level up; Canadian</text><text x="750.0" y="255.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">engineers&#x27; iron ring as a reminder; avoid building only for the current promotion</text><path d="M9.3 345.1L991.1 345.8L991.1 496.1L9.7 493.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 345.8Q499.6 347.0 990.6 345.5M7.6 345.4Q499.4 347.4 991.1 345.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 343.1Q991.3 419.9 990.5 496.8M990.0 344.0Q990.6 419.8 989.1 495.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 495.4Q500.6 494.3 9.3 494.1M991.7 495.0Q500.0 493.7 8.3 494.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 497.0Q11.5 419.7 10.3 342.5M11.0 496.4Q12.1 420.4 9.0 344.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="426.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">&#x27;Build good software. Build a good software career. Build a good software industry.&#x27; What senior people do sets the culture of the industry</text></svg>