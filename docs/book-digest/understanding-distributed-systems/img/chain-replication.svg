<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><rect x="20" y="30" width="200" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="120.0" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Client</text><rect x="300" y="30" width="180" height="80" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="390.0" y="65.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Head</text><text x="390.0" y="85.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">replica</text><rect x="520" y="30" width="180" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="610.0" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Middle</text><text x="610.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">replica</text><rect x="740" y="30" width="180" height="80" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="830.0" y="65.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Tail</text><text x="830.0" y="85.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">replica</text><line x1="220" y1="60" x2="300" y2="60" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="260.0" y="50" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">writes</text><line x1="480" y1="60" x2="520" y2="60" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="700" y1="60" x2="740" y2="60" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="740" y1="95" x2="700" y2="95" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="520" y1="95" x2="480" y2="95" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="830" y1="110" x2="830" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="840" y="140" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">reads go ONLY to the tail</text><rect x="20" y="160" width="740" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="390.0" y="195.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Write: head applies, forwards down the chain; the tail commits and the ack flows back to the head</text><text x="390.0" y="215.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">then the head answers the client. Reads served by the tail need no extra coordination</text><rect x="20" y="260" width="460" height="120" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="250.0" y="295.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Control plane (needs consensus, e.g. Raft)</text><text x="250.0" y="315.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">watches health, removes a failed process</text><text x="250.0" y="335.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">head fails: successor becomes head</text><text x="250.0" y="355.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">tail fails: predecessor becomes tail</text><rect x="500" y="260" width="460" height="120" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="730.0" y="295.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Chain trade-offs</text><text x="730.0" y="315.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">tolerates up to N-1 failures; control plane fewer</text><text x="730.0" y="335.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">one slow replica slows every write</text><text x="730.0" y="355.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">pipelined writes; dirty/clean versions allow any replica to read</text></svg>