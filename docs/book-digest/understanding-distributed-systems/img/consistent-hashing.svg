<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="440" fill="#ffffff"/><circle cx="330" cy="215" r="160" fill="#f3f8fd" stroke="#9db4c8" stroke-width="3"/><rect x="337.78370842670887" y="41.43075951804673" width="40" height="32" rx="8" fill="#5b94cf"/><text x="357.78370842670887" y="62.43075951804673" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">P1</text><rect x="460.35081932574536" y="253.72322293210698" width="40" height="32" rx="8" fill="#5b94cf"/><text x="480.35081932574536" y="274.723222932107" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">P2</text><rect x="207.1539824501537" y="321.5671108990365" width="40" height="32" rx="8" fill="#5b94cf"/><text x="227.1539824501537" y="342.5671108990365" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">P3</text><rect x="172.4328891009635" y="96.15398245015372" width="70" height="32" rx="8" fill="#d9a02e"/><text x="207.4328891009635" y="117.15398245015372" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">P4 (new)</text><circle cx="452.5671108990365" cy="112.15398245015372" r="13" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="452.5671108990365" y="117.15398245015372" font-size="13" font-weight="700" fill="#134a26" text-anchor="middle">k1</text><circle cx="384.72322293210703" cy="365.3508193257453" r="13" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="384.72322293210703" y="370.3508193257453" font-size="13" font-weight="700" fill="#134a26" text-anchor="middle">k2</text><circle cx="170.60884830532072" cy="228.9449188396253" r="13" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="170.60884830532072" y="233.9449188396253" font-size="13" font-weight="700" fill="#134a26" text-anchor="middle">k3</text><circle cx="288.5889527835967" cy="60.451867793749074" r="13" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="288.5889527835967" y="65.45186779374907" font-size="13" font-weight="700" fill="#134a26" text-anchor="middle">k4</text><rect x="560" y="20" width="400" height="110" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="760.0" y="60.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Consistent hashing</text><text x="760.0" y="80.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">hash partition IDs and keys onto a circle</text><text x="760.0" y="100.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">each key goes to the next partition clockwise</text><rect x="560" y="150" width="400" height="130" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="760.0" y="190.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Adding P4</text><text x="760.0" y="210.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">only keys that now map to P4 move</text><text x="760.0" y="230.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">(about K/N of them), here k3</text><text x="760.0" y="250.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">modulo hash(key) mod N would reshuffle most keys</text><rect x="560" y="300" width="400" height="120" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="760.0" y="335.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Trade-off vs range partitioning</text><text x="760.0" y="355.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">even spread, but the sort order across</text><text x="760.0" y="375.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">partitions is lost; still sortable inside a partition</text><text x="760.0" y="395.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">by a secondary key</text></svg>