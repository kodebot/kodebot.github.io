<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="360" fill="#ffffff"/><rect x="20" y="30" width="200" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="120.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Sender</text><rect x="760" y="30" width="200" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="860.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Receiver</text><line x1="220" y1="60" x2="760" y2="110" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="72" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">1. SYN  (random sequence number x)</text><line x1="760" y1="150" x2="220" y2="200" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="160" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">2. SYN/ACK  (x+1, random y)</text><line x1="220" y1="240" x2="760" y2="290" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="250" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">3. ACK + first bytes of data  (x+1, y+1)</text><rect x="20" y="310" width="940" height="40" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="490.0" y="335.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">One full round trip with no application data: bandwidth is ~zero until the connection is open</text></svg>