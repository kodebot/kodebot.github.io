<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><rect x="58" y="15" width="144" height="44" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="130.0" y="42.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Client</text><line x1="130" y1="59" x2="130" y2="315" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5"/><rect x="698" y="15" width="144" height="44" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="770.0" y="42.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Server</text><line x1="770" y1="59" x2="770" y2="315" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5"/><line x1="130" y1="95" x2="770" y2="95" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="450.0" y="87" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">1 agree on a cipher suite</text><line x1="130" y1="135" x2="770" y2="135" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="450.0" y="127" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">2 key exchange: create the shared secret</text><line x1="770" y1="180" x2="130" y2="180" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="450.0" y="172" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">3 certificate: client verifies it</text><line x1="130" y1="225" x2="770" y2="225" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="450.0" y="217" font-size="12" fill="#14324f" text-anchor="mi