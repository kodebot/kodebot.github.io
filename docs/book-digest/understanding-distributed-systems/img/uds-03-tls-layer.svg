<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="720" height="360" fill="#ffffff"/><rect x="140" y="20" width="440" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="360.0" y="43.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Application</text><text x="360.0" y="63.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">HTTP, your protocol</text><rect x="140" y="102" width="440" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="360.0" y="125.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">TLS</text><text x="360.0" y="145.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">encryption, authentication, integrity</text><rect x="140" y="184" width="440" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="360.0" y="207.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">TCP</text><text x="360.0" y="227.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">reliable bytes, in the clear</text><rect x="140" y="266" width="440" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="360.0" y="299.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">IP</text><line x1="360.0" y1="76" x2="360.0" y2="102" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="360.0" y1="158" x2="360.0" y2="184" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="360.0" y1="240" x2="360.0" y2="266" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="360" y="345" font-size="13" font-weight="700" fill="#14324f" text