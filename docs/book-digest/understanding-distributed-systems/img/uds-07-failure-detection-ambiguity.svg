<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><rect x="20" y="120" width="150" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="95.0" y="150.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Client</text><text x="95.0" y="170.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">sends a request</text><rect x="300" y="20" width="230" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="415.0" y="55.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Server crashed</text><line x1="170" y1="155" x2="300" y2="50" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="530" y1="50" x2="640" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="300" y="110" width="230" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="415.0" y="145.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Server is slow</text><line x1="170" y1="155" x2="300" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="530" y1="140" x2="640" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="300" y="200" width="230" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="415.0" y="235.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Message was lost</text><line x1="170" y1="155" x2="300" y2="230" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="530" y1="230" x2="640" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="640" y="120" width="240" height="80" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="760.0" y="155.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">No response</text><text x="760.0" y="175.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">indistinguishable causes</text><text x="450" y="315" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">so detectors use timeouts, pings or heartbeats; a perfect detector cannot exist</text></svg>