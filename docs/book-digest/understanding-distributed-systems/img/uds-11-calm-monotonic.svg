<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="360" fill="#fbf7ef"/><path d="M11.1 10.0L495.3 10.4L493.9 350.3L10.7 349.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 10.0Q252.6 10.0 496.8 9.6M9.5 10.4Q253.0 9.6 496.5 10.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 8.3Q494.2 179.7 495.0 351.2M494.9 7.9Q496.9 179.5 495.3 351.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 349.4Q252.6 352.2 8.7 349.5M496.4 349.7Q252.1 348.2 7.8 350.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 351.0Q10.0 179.3 10.1 7.7M10.2 350.9Q8.5 180.1 9.1 9.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="36" font-size="18.0" fill="#3b2f20">Monotonic: coordination-free</text><text x="24" y="56" font-size="14.0" fill="#3b2f20">new input only refines the output</text><path d="M29.1 89.9L230.2 89.7L230.7 159.7L31.0 159.8Z" fill="#f1ede5" stroke="none"/><path d="M28.4 89.3Q129.7 90.9 231.0 89.1M27.7 89.3Q129.6 91.7 231.5 89.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M229.9 87.9Q230.9 124.6 229.3 161.3M229.2 88.5Q229.1 124.5 230.4 160.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M231.3 159.5Q129.6 160.0 27.9 159.1M230.9 160.2Q129.4 161.3 27.9 160.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M30.2 162.1Q31.9 125.5 30.3 88.9M29.8 162.0Q28.6 125.2 29.0 88.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="130.0" y="120.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">set union:</text><text x="130.0" y="142.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">once added, never retracted</text><path d="M31.1 179.0L230.3 180.4L230.5 248.8L29.4 251.1Z" fill="#f1ede5" stroke="none"/><path d="M28.4 179.4Q130.0 181.4 231.6 179.4M29.6 180.2Q130.0 180.6 230.5 180.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M230.9 179.2Q231.5 214.8 230.3 250.5M231.1 177.5Q229.3 214.0 229.8 250.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M231.1 249.6Q129.5 251.6 28.0 250.0M232.1 249.3Q130.2 248.6 28.4 249.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M30.6 251.3Q31.4 215.2 30.1 179.1M29.5 252.4Q29.7 215.1 30.0 177.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="130.0" y="210.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">increment x3</text><text x="130.0" y="232.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">= 3 in any order</text><text x="365" y="150" font-size="15" font-weight="400" fill="#3b2f20" text-anchor="middle">CRDTs are monotonic</text><text x="365" y="175" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">consistent + available +</text><text x="365" y="195" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">partition tolerant</text><path d="M504.3 10.1L991.1 10.8L991.1 351.1L504.7 348.8Z" fill="#eed5cc" stroke="none"/><path d="M503.5 10.8Q747.1 12.0 990.6 10.5M502.6 10.4Q746.9 12.4 991.1 10.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 8.1Q991.3 179.9 990.5 351.8M990.0 9.0Q990.6 179.8 989.1 350.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 350.4Q748.1 349.3 504.3 349.1M991.7 350.0Q747.5 348.7 503.3 349.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 352.0Q506.5 179.7 505.3 7.5M506.0 351.4Q507.1 180.4 504.0 9.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="519" y="36" font-size="18.0" fill="#3b2f20">Non-monotonic: needs coordination</text><text x="519" y="56" font-size="14.0" fill="#3b2f20">new input can retract earlier output</text><path d="M524.1 89.1L724.6 89.3L724.6 160.2L524.4 160.1Z" fill="#f1ede5" stroke="none"/><path d="M522.7 89.3Q624.8 91.0 726.8 89.3M524.1 89.1Q625.1 92.8 726.2 90.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M725.0 89.4Q726.3 125.4 724.4 161.3M725.1 88.9Q725.6 125.2 725.0 161.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M727.4 160.6Q625.2 159.2 523.1 159.5M727.5 159.0Q625.2 159.8 522.9 159.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M525.9 161.0Q525.9 124.9 526.0 88.7M525.3 160.5Q525.1 124.3 524.6 88.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="625.0" y="120.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">assignment: write(1), write(2)</text><text x="625.0" y="142.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">order changes the result</text><path d="M524.5 179.2L724.1 180.5L725.6 249.4L524.8 251.2Z" fill="#f1ede5" stroke="none"/><path d="M523.0 179.5Q625.2 176.6 727.4 180.0M522.8 180.6Q625.1 181.6 727.4 180.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M726.0 177.6Q725.2 215.1 725.3 252.5M725.0 178.5Q724.0 215.2 725.9 252.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M726.3 250.9Q625.1 247.3 523.9 249.2M726.4 249.3Q625.2 246.8 524.0 250.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M525.9 252.5Q527.0 215.3 524.3 178.2M524.8 252.3Q526.6 215.3 524.7 178.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="625.0" y="210.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">write 1,2,3 gives 3;</text><text x="625.0" y="232.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">write 3,2,1 gives 1</text><text x="860" y="150" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">model the application at</text><text x="860" y="172" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">a higher level (increment)</text><text x="860" y="194" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">to avoid the problem</text></svg>