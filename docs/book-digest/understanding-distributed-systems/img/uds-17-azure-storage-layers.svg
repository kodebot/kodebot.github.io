<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><rect x="250" y="15" width="400" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="450.0" y="38.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Location service</text><text x="450.0" y="58.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">global control plane: creates accounts, allocates them to clusters</text><rect x="20" y="95" width="860" height="330" rx="12" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="34" y="119" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Storage cluster (cell)</text><text x="34" y="138" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">three layers</text><rect x="60" y="150" width="780" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="450.0" y="175.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Front-end layer</text><text x="450.0" y="195.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">stateless reverse proxy: authenticates, routes to the partition server</text><rect x="60" y="235" width="780" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="450.0" y="265.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Partition layer</text><text x="450.0" y="285.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">partition manager + partition servers; range-partitioned index of every file</text><rect x="60" y="330" width="780" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="450.0" y="360.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Stream layer</text><text x="450.0" y="380.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">append-only streams of extents, replicated with chain replication; stream manager</text><line x1="450" y1="210" x2="450" y2="235" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="450" y1="305" x2="450" y2="330" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="450" y1="71" x2="450" y2="95" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/></svg>