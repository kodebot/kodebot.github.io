<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><rect x="20" y="15" width="400" height="300" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Local cache</text><rect x="50" y="65" width="160" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="130.0" y="100.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Server 1</text><text x="130.0" y="120.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">own in-process cache</text><rect x="50" y="180" width="160" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="130.0" y="215.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Server 2</text><text x="130.0" y="235.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">own in-process cache</text><text x="320" y="170" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">fast, but copies</text><text x="320" y="188" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">differ per server</text><rect x="460" y="15" width="420" height="300" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="482" y="49" font-size="16" font-weight="700" fill="#14324f">External cache</text><rect x="480" y="65" width="140" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="550.0" y="110.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Server 1</text><rect x="480" y="180" width="140" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="550.0" y="225.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Server 2</text><rect x="700" y="100" width="160" height="110" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="780.0" y="150.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Shared cache</text><text x="780.0" y="170.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">one copy for all</text><line x1="620" y1="105" x2="700" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="620" y1="220" x2="700" y2="180" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/></svg>