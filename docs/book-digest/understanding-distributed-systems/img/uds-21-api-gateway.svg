<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="360" fill="#ffffff"/><rect x="20" y="140" width="130" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="85.0" y="175.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Clients</text><rect x="220" y="25" width="330" height="310" rx="12" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="234" y="49" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">API gateway</text><text x="234" y="68" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">reverse proxy for the public API</text><rect x="240" y="80" width="290" height="66" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="385.0" y="108.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Core: routing, composition,</text><text x="385.0" y="128.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">translation (REST to gRPC)</text><rect x="240" y="165" width="290" height="66" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="385.0" y="193.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Cross-cutting: authentication,</text><text x="385.0" y="213.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">authorisation, caching, rate limits</text><line x1="150" y1="170" x2="220" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="750" y="40" width="200" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="850.0" y="75.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Service A</text><line x1="550" y1="175" x2="750" y2="70" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="750" y="140" width="200" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="850.0" y="175.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Service B</text><line x1="550" y1="175" x2="750" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="750" y="240" width="200" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="850.0" y="275.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Service C</text><line x1="550" y1="175" x2="750" y2="270" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="385" y="300" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">composing many calls lowers availability</text></svg>