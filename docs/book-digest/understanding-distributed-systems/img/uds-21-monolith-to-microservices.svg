<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><rect x="20" y="15" width="360" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Monolith</text><rect x="50" y="65" width="300" height="250" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="200.0" y="155.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">One deployable app</text><text x="200.0" y="175.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">components pile up, couple,</text><text x="200.0" y="195.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">slow every developer,</text><text x="200.0" y="215.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">force whole-app deploys</text><text x="200.0" y="235.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">and rollbacks</text><rect x="420" y="15" width="460" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="442" y="49" font-size="16" font-weight="700" fill="#14324f">Functional decomposition</text><rect x="450" y="70" width="120" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="510.0" y="100.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Service A</text><text x="510.0" y="120.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">own deploy</text><rect x="590" y="70" width="120" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="650.0" y="100.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Service B</text><text x="650.0" y="120.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">own deploy</text><rect x="730" y="70" width="120" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="790.0" y="100.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Service C</text><text x="790.0" y="120.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">own deploy</text><rect x="450" y="200" width="400" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="650.0" y="240.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Independently deployable and scalable services</text><line x1="510" y1="140" x2="510" y2="200" stroke="#6f8aa3" stroke-width="2"/><line x1="650" y1="140" x2="650" y2="200" stroke="#6f8aa3" stroke-width="2"/><line x1="790" y1="140" x2="790" y2="200" stroke="#6f8aa3" stroke-width="2"/><text x="650" y="310" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the price: more moving parts to operate</text></svg>