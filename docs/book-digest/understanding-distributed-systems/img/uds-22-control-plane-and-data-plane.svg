<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="360" fill="#ffffff"/><rect x="20" y="110" width="280" height="100" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="160.0" y="145.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Control plane</text><text x="160.0" y="165.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">config and metadata</text><text x="160.0" y="185.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">consistent, low volume</text><rect x="380" y="130" width="200" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="480.0" y="155.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Buffer store</text><text x="480.0" y="175.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">push, deltas + snapshots</text><rect x="660" y="110" width="300" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="810.0" y="145.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Data plane</text><text x="810.0" y="165.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">serves every request</text><text x="810.0" y="185.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">fast and always up</text><line x1="300" y1="160" x2="380" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="580" y1="160" x2="660" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="660" y="250" width="300" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="810.0" y="275.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Requests</text><text x="810.0" y="295.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">from users</text><line x1="810" y1="250" x2="810" y2="210" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="330" y="260" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">if the control plane is down, the data</text><text x="330" y="278" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">plane keeps running with stale config</text><text x="490" y="40" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">a hard dependency caps availability at the product of both</text></svg>