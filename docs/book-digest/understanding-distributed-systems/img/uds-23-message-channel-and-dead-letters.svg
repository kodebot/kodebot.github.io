<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="360" fill="#ffffff"/><rect x="20" y="100" width="150" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="95.0" y="140.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Producer</text><rect x="260" y="90" width="200" height="90" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="360.0" y="120.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Message channel</text><text x="360.0" y="140.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">broker: decouples,</text><text x="360.0" y="160.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">smooths spikes</text><rect x="560" y="100" width="180" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="650.0" y="130.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Consumer</text><text x="650.0" y="150.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">idempotent</text><line x1="170" y1="135" x2="260" y2="135" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="460" y1="135" x2="560" y2="135" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="510.0" y="125" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">receive</text><rect x="560" y="250" width="180" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="650.0" y="275.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Delete message</text><text x="650.0" y="295.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">after processing</text><line x1="650" y1="170" x2="650" y2="250" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="800" y="90" width="160" height="90" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="880.0" y="120.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Dead letter</text><text x="880.0" y="140.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">channel</text><text x="880.0" y="160.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">after capped retries</text><line x1="740" y1="135" x2="800" y2="135" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="360" y="330" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">at-least-once delivery + idempotent processing = exactly-once processing</text></svg>