<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><rect x="20" y="15" width="860" height="330" rx="12" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="34" y="39" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Region</text><text x="34" y="58" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">spread across Availability Zones for data-centre outages</text><rect x="50" y="85" width="250" height="200" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="64" y="109" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Availability Zone 1</text><rect x="80" y="150" width="190" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="175.0" y="185.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Replica</text><rect x="330" y="85" width="250" height="200" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="344" y="109" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Availability Zone 2</text><rect x="360" y="150" width="190" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="455.0" y="185.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Replica</text><rect x="610" y="85" width="250" height="200" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="624" y="109" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Availability Zone 3</text><rect x="640" y="150" width="190" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="735.0" y="185.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Replica</text><text x="450" y="320" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">redundancy only helps if the copies do not fail for the same reason at the same time</text></svg>