<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="230" fill="#ffffff"/><rect x="20" y="50" width="230" height="84" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="135.0" y="77.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Prepare</text><text x="135.0" y="97.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">backward-compatible</text><text x="135.0" y="117.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">change</text><rect x="310" y="50" width="230" height="84" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="425.0" y="77.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Activate</text><text x="425.0" y="97.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">switch to the new</text><text x="425.0" y="117.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">behaviour</text><rect x="600" y="50" width="230" height="84" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="715.0" y="87.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Cleanup</text><text x="715.0" y="107.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">remove the old</text><line x1="250" y1="92.0" x2="310" y2="92.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="92.0" x2="600" y2="92.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="450.0" y="179" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">split an incompatible change so every release stays backward compatible</text></svg>