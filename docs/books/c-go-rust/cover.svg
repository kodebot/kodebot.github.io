<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">Three terminals, one server: C, Go and Rust each answering a redis-cli PING</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}.dg-defs{position: absolute; width: 0; height: 0; overflow: hidden;}.dg-box{fill: #f4f1ea; stroke: #c7bdb0; stroke-width: 1;}.dg-c{fill: #ecedfa; stroke: #4b4fb3; stroke-width: 1.2;}.dg-go{fill: #e1f1f2; stroke: #0e7c86; stroke-width: 1.2;}.dg-rust{fill: #fae8df; stroke: #b5471a; stroke-width: 1.2;}.dg-ok{fill: #e4f2e6; stroke: #2d7a3e; stroke-width: 1.5;}.dg-bad{fill: #fdecec; stroke: #b3261e; stroke-width: 1.2;}.dg-dim{fill: #fdfcf9; stroke: #c7bdb0; stroke-width: 1; stroke-dasharray: 4 3;}.dg-line{fill: none; stroke: #7b736a; stroke-width: 1.4;}.dg-line-ok{fill: none; stroke: #2d7a3e; stroke-width: 1.6;}.dg-rule{fill: none; stroke: #e3ddd2; stroke-width: 1;}.dg-head{fill: #7b736a;}.dg-head-ok{fill: #2d7a3e;}.dg-t{fill: #22201c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600;}.dg-s{fill: #4d4740; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px;}.dg-m{fill: #22201c; font-family: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace; font-size: 12px;}.dg-lbl{fill: #7b736a; font-family: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace; font-size: 10px; letter-spacing: .06em;}.dg-mute{fill: #7b736a;}.dg-tc{fill: #4b4fb3;}.dg-tgo{fill: #0e7c86;}.dg-trust{fill: #b5471a;}.dg-tok{fill: #2d7a3e;}.dg-tbad{fill: #b3261e;}</style>
  <rect x="12" y="20" width="190" height="200" rx="6" class="dg-c"/>
  <text x="107" y="46" text-anchor="middle" class="dg-lbl">C</text>
  <text x="26" y="80" class="dg-m">$ ./kv</text>
  <text x="26" y="104" class="dg-m">$ redis-cli PING</text>
  <text x="26" y="128" class="dg-m dg-tok">PONG</text>
  <text x="26" y="170" class="dg-lbl">1972</text>
  <text x="26" y="190" class="dg-s">trust the programmer</text>

  <rect x="225" y="20" width="190" height="200" rx="6" class="dg-go"/>
  <text x="320" y="46" text-anchor="middle" class="dg-lbl">GO</text>
  <text x="239" y="80" class="dg-m">$ go run .</text>
  <text x="239" y="104" class="dg-m">$ redis-cli PING</text>
  <text x="239" y="128" class="dg-m dg-tok">PONG</text>
  <text x="239" y="170" class="dg-lbl">2009</text>
  <text x="239" y="190" class="dg-s">keep it simple, add a GC</text>

  <rect x="438" y="20" width="190" height="200" rx="6" class="dg-rust"/>
  <text x="533" y="46" text-anchor="middle" class="dg-lbl">RUST</text>
  <text x="452" y="80" class="dg-m">$ cargo run</text>
  <text x="452" y="104" class="dg-m">$ redis-cli PING</text>
  <text x="452" y="128" class="dg-m dg-tok">PONG</text>
  <text x="452" y="170" class="dg-lbl">2015</text>
  <text x="452" y="190" class="dg-s">safety without a GC</text>

  <line x1="107" y1="232" x2="107" y2="262" class="dg-line" marker-end="url(#dg-arrow)"/>
  <line x1="320" y1="232" x2="320" y2="262" class="dg-line" marker-end="url(#dg-arrow)"/>
  <line x1="533" y1="232" x2="533" y2="262" class="dg-line" marker-end="url(#dg-arrow)"/>
  <rect x="12" y="266" width="616" height="28" rx="4" class="dg-box"/>
  <text x="320" y="285" text-anchor="middle" class="dg-s">the same protocol, the same tests, the same client</text>
</svg>
