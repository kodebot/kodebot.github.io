<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cvA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b3fa0" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#6b3fa0" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="cvB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a5b00" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#9a5b00" stop-opacity=".95"/>
    </linearGradient>
  </defs>

  <!-- left: C# -->
  <g>
    <rect x="24" y="34" width="172" height="9" rx="4.5" fill="url(#cvA)"/>
    <rect x="24" y="60" width="128" height="9" rx="4.5" fill="url(#cvA)" opacity=".82"/>
    <rect x="42" y="86" width="150" height="9" rx="4.5" fill="url(#cvA)" opacity=".70"/>
    <rect x="42" y="112" width="104" height="9" rx="4.5" fill="url(#cvA)" opacity=".58"/>
    <rect x="24" y="138" width="160" height="9" rx="4.5" fill="url(#cvA)" opacity=".46"/>
    <rect x="42" y="164" width="118" height="9" rx="4.5" fill="url(#cvA)" opacity=".34"/>
    <rect x="24" y="190" width="140" height="9" rx="4.5" fill="url(#cvA)" opacity=".24"/>
  </g>

  <!-- translation curves -->
  <g fill="none" stroke-width="1.6" opacity=".55">
    <path d="M205 38 C 275 38, 285 64, 352 64" stroke="#6b3fa0"/>
    <path d="M205 64 C 275 64, 285 38, 352 38" stroke="#9a5b00"/>
    <path d="M205 90 C 280 90, 280 116, 352 116" stroke="#6b3fa0" opacity=".8"/>
    <path d="M205 116 C 280 116, 280 90, 352 90" stroke="#9a5b00" opacity=".8"/>
    <path d="M205 142 C 280 142, 280 168, 352 168" stroke="#6b3fa0" opacity=".6"/>
    <path d="M205 168 C 280 168, 280 142, 352 142" stroke="#9a5b00" opacity=".6"/>
    <path d="M205 194 C 280 194, 280 194, 352 194" stroke="#9a5b00" opacity=".4"/>
  </g>

  <!-- right: Java -->
  <g>
    <rect x="360" y="34" width="150" height="9" rx="4.5" fill="url(#cvB)"/>
    <rect x="360" y="60" width="186" height="9" rx="4.5" fill="url(#cvB)" opacity=".82"/>
    <rect x="378" y="86" width="128" height="9" rx="4.5" fill="url(#cvB)" opacity=".70"/>
    <rect x="378" y="112" width="164" height="9" rx="4.5" fill="url(#cvB)" opacity=".58"/>
    <rect x="360" y="138" width="120" height="9" rx="4.5" fill="url(#cvB)" opacity=".46"/>
    <rect x="378" y="164" width="146" height="9" rx="4.5" fill="url(#cvB)" opacity=".34"/>
    <rect x="360" y="190" width="132" height="9" rx="4.5" fill="url(#cvB)" opacity=".24"/>
  </g>

  <!-- braces -->
  <text x="20" y="252" font-family="ui-monospace, Menlo, monospace" font-size="34"
        fill="#6b3fa0" opacity=".55">{ }</text>
  <text x="556" y="252" font-family="ui-monospace, Menlo, monospace" font-size="34"
        fill="#9a5b00" opacity=".55">{ }</text>
  <line x1="24" y1="272" x2="616" y2="272" stroke="#c4c4c8" stroke-width="1"/>
</svg>
