<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cvC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a9640e" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#a9640e" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="cvD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d4fc2" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#6d4fc2" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <!-- outer layer: adapters -->
  <rect x="40" y="26" width="560" height="232" rx="18" fill="url(#cvC)" stroke="#a9640e" stroke-opacity=".55" stroke-width="1.6"/>
  <!-- middle layer: application -->
  <rect x="130" y="66" width="380" height="152" rx="14" fill="url(#cvD)" stroke="#6d4fc2" stroke-opacity=".6" stroke-width="1.6"/>
  <!-- inner layer: domain -->
  <rect x="236" y="106" width="168" height="72" rx="10" fill="#a9640e" fill-opacity=".9"/>

  <!-- the lines of code inside the domain -->
  <g fill="#fff" opacity=".85">
    <rect x="254" y="124" width="92" height="6" rx="3"/>
    <rect x="254" y="138" width="124" height="6" rx="3"/>
    <rect x="266" y="152" width="78" height="6" rx="3"/>
  </g>

  <!-- arrows: every dependency points inward -->
  <g fill="none" stroke-width="1.8" opacity=".7">
    <path d="M70 142 L 124 142" stroke="#a9640e"/>
    <path d="M118 137 L 126 142 L 118 147" stroke="#a9640e"/>
    <path d="M570 142 L 516 142" stroke="#a9640e"/>
    <path d="M522 137 L 514 142 L 522 147" stroke="#a9640e"/>
    <path d="M160 142 L 230 142" stroke="#6d4fc2"/>
    <path d="M224 137 L 232 142 L 224 147" stroke="#6d4fc2"/>
    <path d="M480 142 L 410 142" stroke="#6d4fc2"/>
    <path d="M416 137 L 408 142 L 416 147" stroke="#6d4fc2"/>
  </g>

  <!-- the ports on the outer edge -->
  <g fill="#a9640e" opacity=".55">
    <circle cx="40" cy="98" r="5"/>
    <circle cx="40" cy="186" r="5"/>
    <circle cx="600" cy="98" r="5"/>
    <circle cx="600" cy="186" r="5"/>
  </g>

  <line x1="24" y1="272" x2="616" y2="272" stroke="#cbc1b4" stroke-width="1"/>
</svg>
