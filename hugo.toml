baseURL = "https://kodebot.com/"
locale = "en-GB"
title = "Kodebot"
publishDir = "docs"
enableEmoji = true

[params]
  description = "Notes, tutorials and books for people who build software."

[services.disqus]
  shortname = "kodebot"

[markup.goldmark.renderer]
  # the notice, img and colorbtn shortcodes emit HTML into markdown
  unsafe = true

[markup.highlight]
  noClasses = false

[outputs]
  home = ["html", "rss"]

[outputFormats.rss]
  baseName = "feed"

[taxonomies]
  tag = "tags"
  category = "categories"

[[menus.main]]
  name = "Blog"
  pageRef = "/blog"
  weight = 10

[[menus.main]]
  name = "Books"
  pageRef = "/books"
  weight = 20

[[menus.main]]
  name = "Tutorials"
  pageRef = "/tutorials"
  weight = 30

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 40
