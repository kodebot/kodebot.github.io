<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <img src="{{ "images/logo.png" | relURL }}" alt="{{ site.Title }}" width="172" height="28">
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {{- $page := . }}
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"
          {{- if hasPrefix $page.RelPermalink .URL }} class="active"{{ end }}
          {{- if eq $page.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
