<a class="tutorial-card" href="{{ .RelPermalink }}">
  {{- with .Resources.GetMatch "thumbnail.*" }}
  <img src="{{ .RelPermalink }}" alt="" width="{{ .Width }}" height="{{ .Height }}" loading="lazy">
  {{- else }}
  <span class="tutorial-thumb" aria-hidden="true">{{ .Title }}</span>
  {{- end }}
  <span class="tutorial-card-body">
    <h3 class="tutorial-card-title">{{ .Title }}</h3>
    {{- with .Description }}
    <span class="tutorial-card-desc">{{ . }}</span>
    {{- end }}
    <span class="tutorial-card-meta">{{ len .RegularPagesRecursive }} lessons</span>
  </span>
</a>
