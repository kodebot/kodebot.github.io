{{- $current := .current -}}
<ol class="toc-list">
  {{- range .section.Pages.ByWeight }}
  <li>
    <a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $current.RelPermalink }} aria-current="page"{{ end }}>
      {{- with .Params.pre }}<span class="toc-num">{{ . | plainify | strings.TrimSpace }}</span> {{ end }}{{ .Title -}}
    </a>
    {{- if .IsSection }}{{ partial "tutorial-tree.html" (dict "section" . "current" $current) }}{{ end }}
  </li>
  {{- end }}
</ol>
