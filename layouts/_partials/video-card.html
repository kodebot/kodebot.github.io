<a class="video-card" href="{{ .url }}">
  <span class="video-thumb">
    <img src="{{ .thumb }}" alt="" width="320" height="180" loading="lazy">
    <span class="video-play">{{ partial "icon.html" "play" }}</span>
  </span>
  <span class="video-card-title">{{ .title }}</span>
  <time class="video-card-date" datetime="{{ .date.Format "2006-01-02" }}">{{ .date.Format "2 Jan 2006" }}</time>
</a>
