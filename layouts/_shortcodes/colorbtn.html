{{- $youtube := in (.Get "icon" | default "") "youtube" -}}
<a class="button{{ if $youtube }} button-youtube{{ end }}"{{ with .Get "href" }} href="{{ . }}" target="_blank" rel="noopener"{{ end }}>{{ if $youtube }}{{ partial "icon.html" "youtube" }}{{ end }}<span>{{ .Inner | strings.TrimSpace }}</span></a>
