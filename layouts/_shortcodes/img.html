{{- $src := .Get 0 -}}
{{- $alt := .Get 1 -}}
{{- $height := .Get 2 -}}
{{- $width := .Get 3 -}}
{{- with .Page.Resources.GetMatch $src -}}
<figure>
<img src="{{ .RelPermalink }}" alt="{{ $alt }}"{{ with $height }} height="{{ . }}"{{ end }}{{ with $width }} width="{{ . }}"{{ end }} loading="lazy">
{{- with $alt }}
<figcaption>{{ . }}</figcaption>
{{- end }}
</figure>
{{- else -}}
{{- warnf "img shortcode: %q not found in %s" $src $.Page.File.Path -}}
{{- end -}}
