{{- $type := .Get 0 | default "note" -}}
{{- $titles := dict "note" "Note" "info" "Info" "tip" "Tip" "warning" "Warning" -}}
<div class="notice notice-{{ $type }}"{{ with .Get 1 }} id="{{ . }}"{{ end }}>
<p class="notice-title">{{ index $titles $type | default (title $type) }}</p>

{{ .Inner }}

</div>
