{{ define "main" }}
<div class="container narrow">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- with .Content }}
    <div class="prose">{{ . }}</div>
    {{- end }}
  </header>
  {{- range (where site.RegularPages "Section" "blog").GroupByDate "2006" }}
  <section class="year-group" aria-labelledby="year-{{ .Key }}">
    <h2 id="year-{{ .Key }}">{{ .Key }}</h2>
    <ul class="post-list">
      {{- range .Pages.ByDate.Reverse }}
      {{ partial "post-item.html" . }}
      {{- end }}
    </ul>
  </section>
  {{- end }}
</div>
{{ end }}
