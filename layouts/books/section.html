{{ define "main" }}
<div class="container">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- with .Content }}
    <div class="prose">{{ . }}</div>
    {{- end }}
  </header>
  <div class="book-list">
    {{- range .Params.books }}
    {{ partial "book-card.html" (dict "book" . "h2" true) }}
    {{- end }}
  </div>
</div>
{{ end }}
