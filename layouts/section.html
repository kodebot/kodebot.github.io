{{ define "main" }}
<div class="container narrow">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  {{- with .Content }}
  <div class="prose">
    {{ . }}
  </div>
  {{- end }}
  {{- with .Pages }}
  <ul class="post-list">
    {{- range . }}
    {{ partial "post-item.html" . }}
    {{- end }}
  </ul>
  {{- end }}
</div>
{{ end }}
