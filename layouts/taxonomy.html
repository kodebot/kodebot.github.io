{{ define "main" }}
<div class="container narrow">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  {{- with .Data.Terms.ByCount }}
  <ul class="term-list">
    {{- range . }}
    <li><a href="{{ .Page.RelPermalink }}">#{{ .Name }}<span class="count">{{ .Count }}</span></a></li>
    {{- end }}
  </ul>
  {{- else }}
  <p>Nothing here yet.</p>
  {{- end }}
</div>
{{ end }}
