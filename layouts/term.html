{{ define "main" }}
<div class="container narrow">
  <header class="page-header">
    {{- with .Parent }}
    <p class="page-kicker"><a href="{{ .RelPermalink }}">{{ .Title }}</a></p>
    {{- end }}
    <h1>#{{ .Data.Term }}</h1>
  </header>
  <ul class="post-list">
    {{- range .Pages.ByDate.Reverse }}
    {{ partial "post-item.html" . }}
    {{- end }}
  </ul>
</div>
{{ end }}
