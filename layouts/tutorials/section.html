{{ define "main" }}
{{- if eq .Parent.Kind "home" }}
<div class="container">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- with .Content }}
    <div class="prose">{{ . }}</div>
    {{- end }}
  </header>
  <div class="card-grid">
    {{- range .Sections.ByWeight }}
    {{ partial "tutorial-card.html" . }}
    {{- end }}
  </div>
</div>
{{- else }}
{{ partial "tutorial-layout.html" . }}
{{- end }}
{{ end }}
