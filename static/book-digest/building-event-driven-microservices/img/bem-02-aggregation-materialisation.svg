<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 145.3L10.7 144.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 79.7 330.0 146.2M329.9 12.9Q331.9 79.5 330.3 146.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 144.4Q170.1 147.2 8.7 144.5M331.4 144.7Q169.6 143.2 7.8 145.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Aggregation (Fig 2-14)</text><text x="170.0" y="75.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">combine events into one result, for example</text><text x="170.0" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">sum a driver&#x27;s traffic fines per key;</text><text x="170.0" y="119.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">needs durable state; one key is one partition</text><path d="M339.1 14.9L660.2 14.7L660.7 144.7L341.0 144.8Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 79.6 659.3 146.3M659.2 13.5Q658.8 79.5 660.4 145.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 144.5Q499.6 145.0 337.9 144.1M660.9 145.2Q499.4 146.3 337.9 145.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 147.1Q342.7 80.5 340.3 13.9M339.8 147.0Q338.2 80.2 339.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Materialisation (2-15)</text><text x="500.0" y="75.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">project a stream into a table: upsert each</text><text x="500.0" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">entity event in order; the latest per key</text><text x="500.0" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">wins (FAST 321, SJFH 372)</text><path d="M671.1 14.0L990.3 15.4L990.5 143.8L669.4 146.1Z" fill="#d6e1cf" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 79.8 990.3 145.5M991.1 12.5Q988.6 79.0 989.8 145.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 144.6Q829.5 146.6 668.0 145.0M992.1 144.3Q830.2 143.6 668.4 144.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 146.3Q672.0 80.2 670.1 14.1M669.5 147.4Q669.6 80.1 670.0 12.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Table to stream (2-16)</text><text x="830.0" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">publish each table change as an event</text><text x="830.0" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(BB upserted twice, DD once gives three</text><text x="830.0" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">events); a database log can be replayed</text><path d="M9.3 160.1L991.1 160.8L991.1 231.1L9.7 228.8Z" fill="#dfd6e7" stroke="none"/><path d="M8.5 160.8Q499.6 162.0 990.6 160.5M7.6 160.4Q499.4 162.4 991.1 160.6" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 158.1Q990.9 194.9 990.5 231.8M990.0 159.0Q990.3 194.8 989.1 230.7" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 230.4Q500.6 229.3 9.3 229.1M991.7 230.0Q500.0 228.7 8.3 229.4" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 232.0Q11.0 194.7 10.3 157.5M11.0 231.4Q11.4 195.4 9.0 159.5" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="201.0" font-size="15.5" fill="#3b2f20" text-anchor="middle">Stream-table duality: a stream can be a table and a table a stream; this is how services share state with no direct coupling.</text><path d="M9.1 244.1L989.6 244.3L989.6 420.2L9.4 420.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 244.3Q499.8 246.0 991.8 244.3M9.1 244.1Q500.1 247.8 991.2 245.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 244.4Q992.1 332.9 989.4 421.3M990.1 243.9Q990.8 332.7 990.0 421.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 420.6Q500.2 419.2 8.1 419.5M992.5 419.0Q500.2 419.8 7.9 419.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 421.0Q10.9 332.4 11.0 243.7M10.3 420.5Q10.2 331.8 9.6 243.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="305.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">Deleting and compaction (Fig 2-17): you cannot delete a record, but publish a tombstone (a keyed event with a null value) that marks the key deleted.</text><text x="500.0" y="327.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Compaction (broker, asynchronous) keeps only the most recent event per key and drops older ones and, after a delay (Kafka default 24 hours), the tombstone.</text><text x="500.0" y="349.5" font-size="14.5" fill="#3b2f20" text-anchor="middle">Guarantees: a minimum compaction lag (min.compaction.lag.ms), offsets unchanged (gaps appear; reading a removed offset is an error),</text><text x="500.0" y="371.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">and a consumer from the start materialises the same table as one running from the beginning. Do not manually delete records: derived state is not fixed.</text></svg>