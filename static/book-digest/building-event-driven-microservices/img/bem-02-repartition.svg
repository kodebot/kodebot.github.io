<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 145.3L10.7 144.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 79.7 495.0 146.2M494.9 12.9Q496.9 79.5 495.3 146.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 144.4Q252.6 147.2 8.7 144.5M496.4 144.7Q252.1 143.2 7.8 145.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="42.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Repartitioning (Fig 2-12)</text><text x="252.5" y="64.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a service reads one stream and writes a new one</text><text x="252.5" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">with a different key, key-to-partition strategy or</text><text x="252.5" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">partition count (two partitions to four); may</text><text x="252.5" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">introduce out-of-order data</text><path d="M504.1 14.9L990.2 14.7L990.7 144.7L506.0 144.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 79.6 989.3 146.3M989.2 13.5Q988.8 79.5 990.4 145.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 144.5Q747.1 145.0 502.9 144.1M990.9 145.2Q746.9 146.3 502.9 145.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 147.1Q507.7 80.5 505.3 13.9M504.8 147.0Q503.2 80.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="42.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Copartitioning (Fig 2-13)</text><text x="747.5" y="64.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">two streams with the same key, key-to-partition</text><text x="747.5" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">strategy and partition count; instance 0 gets</text><text x="747.5" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">partition 0 of both, instance 1 partition 1 of both;</text><text x="747.5" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">key A always to instance 0</text><path d="M11.1 159.0L990.3 160.4L990.5 308.8L9.4 311.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 159.4Q500.0 161.4 991.6 159.4M9.6 160.2Q500.0 160.6 990.5 160.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 159.2Q991.9 234.8 990.3 310.5M991.1 157.5Q988.6 234.0 989.8 310.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 309.6Q499.5 311.6 8.0 310.0M992.1 309.3Q500.2 308.6 8.4 309.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 311.3Q12.0 235.2 10.1 159.1M9.5 312.4Q9.6 235.1 10.0 157.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="230.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Repartition so that streams with different keys or partition counts can be joined, grouped and aggregated.</text><text x="500.0" y="252.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Copartitioning is required for primary-key joins, aggregations and reduce operations, so the same keyed data lands on the same processing instance (data locality).</text></svg>