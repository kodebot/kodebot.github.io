<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="50.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">How small? Tips</text><text x="252.5" y="72.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">do not maximise the service count</text><text x="252.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one person can understand the whole service;</text><text x="252.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a newcomer learns it in a day or two</text><text x="252.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">owned by a team with its output streams</text><text x="252.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">add to an existing service first (less overhead)</text><text x="252.5" y="182.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">build modular components to split later</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="50.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Containers versus virtual machines</text><text x="747.5" y="72.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">containers share the host kernel: cheap, fast to start,</text><text x="747.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">but a kernel vulnerability affects all of them</text><text x="747.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">VMs isolate fully but cost more; microVMs</text><text x="747.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(gVisor, Firecracker, Kata) start in under a second</text><text x="747.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">with hardware isolation; managed by CMSs: Kubernetes,</text><text x="747.5" y="182.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Docker Engine, Amazon ECS, Nomad</text><path d="M11.1 219.0L990.3 220.4L990.5 378.8L9.4 381.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 219.4Q500.0 221.4 991.6 219.4M9.6 220.2Q500.0 220.6 990.5 220.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 219.2Q991.9 299.8 990.3 380.5M991.1 217.5Q988.6 299.0 989.8 380.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 379.6Q499.5 381.6 8.0 380.0M992.1 379.3Q500.2 378.6 8.4 379.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 381.3Q12.0 300.2 10.1 219.1M9.5 382.4Q9.6 300.1 10.0 217.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="284.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">The microservice tax: the financial, manpower and opportunity cost of the event broker, container management, deployment pipelines, monitoring and logging.</text><text x="500.0" y="306.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Pay it centrally (a unified platform) rather than per team (duplicated tooling). It is not all-or-nothing: build incrementally. Small organisations may do better with a</text><text x="500.0" y="328.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">modular monolith until scale demands more. Fully managed cloud services greatly reduce the tax.</text></svg>