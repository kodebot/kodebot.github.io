<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 215.3L10.7 214.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 114.7 495.0 216.2M494.9 12.9Q496.9 114.5 495.3 216.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 214.4Q252.6 217.2 8.7 214.5M496.4 214.7Q252.1 213.2 7.8 215.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 216.0Q10.0 114.3 10.1 12.7M10.2 215.9Q8.5 115.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="55.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Field-level encryption (Table 4-1)</text><text x="252.5" y="77.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">encrypt only chosen fields: email, user and account of a transfer</text><text x="252.5" y="99.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">are encrypted; amount and datetime stay readable</text><text x="252.5" y="121.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumers with keys decrypt; analytics still sums amounts</text><text x="252.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">no separate stream per security level</text><text x="252.5" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">format-preserving encryption keeps types and lengths</text><text x="252.5" y="187.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(so legacy schemas need no renegotiation)</text><path d="M504.1 14.9L990.2 14.7L990.7 214.7L506.0 214.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 114.6 989.3 216.3M989.2 13.5Q988.8 114.5 990.4 215.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 214.5Q747.1 215.0 502.9 214.1M990.9 215.2Q746.9 216.3 502.9 215.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 217.1Q507.7 115.5 505.3 13.9M504.8 217.0Q503.2 115.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="55.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Data catalogue</text><text x="747.5" y="77.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">stores schemas, location, ownership, evolution rules,</text><text x="747.5" y="99.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">sample data, tags (PII, financial)</text><text x="747.5" y="121.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">goes beyond a registry: browse, search, publish datasets</text><text x="747.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">cloud: AWS Glue, Azure Data Catalog, Dataplex</text><text x="747.5" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">open source: Apache Atlas, OpenMetadata, DataHub</text><text x="747.5" y="187.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">weigh compatibility, lock-in and build versus buy</text><path d="M11.1 229.0L990.3 230.4L990.5 378.8L9.4 381.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 229.4Q500.0 231.4 991.6 229.4M9.6 230.2Q500.0 230.6 990.5 230.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 229.2Q991.9 304.8 990.3 380.5M991.1 227.5Q988.6 304.0 989.8 380.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 379.6Q499.5 381.6 8.0 380.0M992.1 379.3Q500.2 378.6 8.4 379.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 381.3Q12.0 305.2 10.1 229.1M9.5 382.4Q9.6 305.1 10.0 227.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="300.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">FLE gives finer-grained access: consumers request keys only for the data they need, shrinking leak surface. It also helps with legal requirements such as the right to</text><text x="500.0" y="322.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">be forgotten (Chapter 18). Data catalogues are not strictly required, but their usefulness tends to lead to adopting one.</text></svg>