<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="450" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 125.3L10.7 124.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.3 69.7 495.0 126.2M494.9 12.9Q496.7 69.5 495.3 126.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 124.4Q252.6 127.2 8.7 124.5M496.4 124.7Q252.1 123.2 7.8 125.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 126.0Q10.1 69.3 10.1 12.7M10.2 125.9Q8.6 70.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Without a registry (Fig 4-5)</text><text x="252.5" y="76.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">each event carries a full copy of its schema: lower throughput,</text><text x="252.5" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">higher replication cost, more consumer load</text><path d="M504.1 14.9L990.2 14.7L990.7 124.7L506.0 124.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.4 69.6 989.3 126.3M989.2 13.5Q988.9 69.5 990.4 125.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 124.5Q747.1 125.0 502.9 124.1M990.9 125.2Q746.9 126.3 502.9 125.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 127.1Q507.4 70.5 505.3 13.9M504.8 127.0Q503.4 70.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">With a registry (Fig 4-6)</text><text x="747.5" y="76.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">producer registers the schema, gets a short ID, writes ID plus data;</text><text x="747.5" y="98.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">consumer reads the ID and fetches the schema (Confluent: 5-byte prefix)</text><path d="M11.1 139.0L495.3 140.4L495.5 228.8L9.4 231.1Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 139.4Q252.5 141.4 496.6 139.4M9.6 140.2Q252.5 140.6 495.5 140.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 139.2Q496.6 184.8 495.3 230.5M496.1 137.5Q494.1 184.0 494.8 230.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 229.6Q252.0 231.6 8.0 230.0M497.1 229.3Q252.7 228.6 8.4 229.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 231.3Q11.6 185.2 10.1 139.1M9.5 232.4Q9.6 185.1 10.0 137.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="169.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Data discovery</text><text x="252.5" y="191.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">streams mapped to schemas; search by field,</text><text x="252.5" y="213.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">documentation, tags</text><path d="M504.3 140.1L991.1 140.8L991.1 231.1L504.7 228.8Z" fill="#efe0ca" stroke="none"/><path d="M503.5 140.8Q747.1 142.0 990.6 140.5M502.6 140.4Q746.9 142.4 991.1 140.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 138.1Q991.1 184.9 990.5 231.8M990.0 139.0Q990.4 184.8 989.1 230.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 230.4Q748.1 229.3 504.3 229.1M991.7 230.0Q747.5 228.7 503.3 229.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 232.0Q506.2 184.7 505.3 137.5M506.0 231.4Q506.6 185.4 504.0 139.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="169.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Evolution validation</text><text x="747.5" y="191.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">registration is on the write path: exceptions for</text><text x="747.5" y="213.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">disallowed evolution or malformed events</text><path d="M9.1 239.1L494.6 239.3L494.6 330.2L9.4 330.1Z" fill="#d6e1cf" stroke="none"/><path d="M7.7 239.3Q252.3 241.0 496.8 239.3M9.1 239.1Q252.6 242.8 496.2 240.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.0 239.4Q496.5 285.4 494.4 331.3M495.1 238.9Q495.7 285.2 495.0 331.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.4 330.6Q252.7 329.2 8.1 329.5M497.5 329.0Q252.7 329.8 7.9 329.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 331.0Q10.9 284.9 11.0 238.7M10.3 330.5Q10.2 284.3 9.6 238.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="269.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Auto documentation</text><text x="252.5" y="291.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">registered names, types and doc fields stay</text><text x="252.5" y="313.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">up to date because they are embedded</text><path d="M504.5 239.2L989.1 240.5L990.6 329.4L504.8 331.2Z" fill="#d3dbe0" stroke="none"/><path d="M503.0 239.5Q747.7 236.6 992.4 240.0M502.8 240.6Q747.6 241.6 992.4 240.2" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 237.6Q990.1 285.1 990.3 332.5M990.0 238.5Q988.7 285.2 990.9 332.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 330.9Q747.6 327.3 503.9 329.2M991.4 329.3Q747.7 326.8 504.0 330.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 332.5Q507.4 285.3 504.3 238.2M504.8 332.3Q506.9 285.3 504.7 238.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="269.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Code generation</text><text x="747.5" y="291.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumers download schemas to generate classes and</text><text x="747.5" y="313.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">test events</text><path d="M11.0 344.5L990.5 344.4L989.4 441.1L8.8 439.1Z" fill="#f1ede5" stroke="none"/><path d="M8.7 343.9Q499.6 341.7 990.6 344.7M9.2 345.4Q500.8 344.5 992.4 345.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 343.5Q987.8 392.9 989.0 442.3M990.6 343.4Q991.0 392.6 990.7 441.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 439.2Q500.4 439.3 8.2 440.1M990.6 439.0Q500.0 441.3 9.4 439.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.8 441.2Q11.2 392.7 10.5 344.3M9.9 440.7Q8.4 391.6 8.9 342.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="387.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">Serialisers must follow the registry&#x27;s proprietary format; registries differ. A custom registration script can check that every field has a non-empty doc string</text><text x="500.0" y="409.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">or scan for PII patterns and request extra verification.</text></svg>