<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 230.3L10.7 229.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 122.2 330.0 231.2M329.9 12.9Q331.9 122.0 330.3 231.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 229.4Q170.1 232.2 8.7 229.5M331.4 229.7Q169.6 228.2 7.8 230.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 231.0Q10.0 121.8 10.1 12.7M10.2 230.9Q8.5 122.6 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="73.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Protobuf (open source 2008)</text><text x="170.0" y="95.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">schema kept in a separate file, shared via a registry</text><text x="170.0" y="117.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">scalar and complex types; no dynamic types</text><text x="170.0" y="139.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">v2: required/optional, custom defaults</text><text x="170.0" y="161.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">v3: all fields optional; defaults only 0, empty, false</text><text x="170.0" y="183.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Editions (2024): edition=&quot;2023&quot;, choose features</text><path d="M339.1 14.9L660.2 14.7L660.7 229.7L341.0 229.8Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 122.1 659.3 231.3M659.2 13.5Q658.8 122.0 660.4 230.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 229.5Q499.6 230.0 337.9 229.1M660.9 230.2Q499.4 231.3 337.9 230.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 232.1Q342.7 123.0 340.3 13.9M339.8 232.0Q338.2 122.7 339.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="73.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Apache Avro (2009)</text><text x="500.0" y="95.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">schema stored with the event by default, or in a</text><text x="500.0" y="117.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">registry primitive and complex types dynamic</text><text x="500.0" y="139.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">deserialisation (GenericRecord) custom defaults;</text><text x="500.0" y="161.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">closely tied to Kafka evolution possible but not part</text><text x="500.0" y="183.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">of the standard</text><path d="M671.1 14.0L990.3 15.4L990.5 228.8L669.4 231.1Z" fill="#efe0ca" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 122.3 990.3 230.5M991.1 12.5Q988.6 121.5 989.8 230.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 229.6Q829.5 231.6 668.0 230.0M992.1 229.3Q830.2 228.6 668.4 229.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 231.3Q672.0 122.7 670.1 14.1M669.5 232.4Q669.6 122.6 670.0 12.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="73.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">JSON Schema</text><text x="830.0" y="95.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">annotates and validates JSON; six primitive types</text><text x="830.0" y="117.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">references to other schemas</text><text x="830.0" y="139.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">validation keywords: minimum, maximum, enum</text><text x="830.0" y="161.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">producers validate before writing</text><text x="830.0" y="183.5" font-size="13.5" fill="#3b2f20" text-anchor="middle">never use schemaless JSON on event streams</text><path d="M9.3 245.1L991.1 245.8L991.1 421.1L9.7 418.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 245.8Q499.6 247.0 990.6 245.5M7.6 245.4Q499.4 247.4 991.1 245.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 243.1Q991.3 332.4 990.5 421.8M990.0 244.0Q990.6 332.3 989.1 420.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 420.4Q500.6 419.3 9.3 419.1M991.7 420.0Q500.0 418.7 8.3 419.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 422.0Q11.5 332.2 10.3 242.5M11.0 421.4Q12.1 332.9 9.0 244.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="316.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">Avro and Protobuf stayed the top two over five years; JSON Schema is a valid third. Pick one centrally (a federated governance team).</text><text x="500.0" y="338.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">JSON Schema&#x27;s range limits (height 1 to 300) catch millimetre mistakes but not inches (72 still fits).</text><text x="500.0" y="360.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">Kleppmann, Designing Data-Intensive Applications, chapter 4, compares JSON, XML, Protobuf, Thrift and Avro.</text></svg>