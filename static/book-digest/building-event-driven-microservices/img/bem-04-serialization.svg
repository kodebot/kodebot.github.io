2" stroke-linecap="round" stroke-linejoin="round"/><text x="385.0" y="55.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Serialise</text><text x="385.0" y="77.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">schema turns object into bytes</text><path d="M531.1 14.0L760.3 15.4L760.5 103.8L529.4 106.1Z" fill="#f1ede5" stroke="none"/><path d="M528.4 14.4Q645.0 16.4 761.6 14.4M529.6 15.2Q645.0 15.6 760.5 15.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M760.9 14.2Q761.6 59.8 760.3 105.5M761.1 12.5Q759.1 59.0 759.8 105.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M761.1 104.6Q644.5 106.6 528.0 105.0M762.1 104.3Q645.2 103.6 528.4 104.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M530.6 106.3Q531.6 60.2 530.1 14.1M529.5 107.4Q529.6 60.1 530.0 12.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="645.0" y="55.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event stream</text><text x="645.0" y="77.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">bytes (schema attached or by ID)</text><path d="M769.3 15.1L991.1 15.8L991.1 106.1L769.7 103.8Z" fill="#d6e1cf" stroke="none"/><path d="M768.5 15.8Q879.6 17.0 990.6 15.5M767.6 15.4Q879.4 17.4 991.1 15.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 13.1Q991.1 59.9 990.5 106.8M990.0 14.0Q990.4 59.8 989.1 105.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 105.4Q880.6 104.3 769.3 104.1M991.7 105.0Q880.0 103.7 768.3 104.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M769.9 107.0Q771.2 59.7 770.3 12.5M771.0 106.4Q771.6 60.4 769.0 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="880.0" y="55.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Consumer</text><text x="880.0" y="77.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">deserialise with the schema</text><path d="M239.1 59.1Q254.4 58.7 269.7 59.3M240.2 59.5Q255.1 58.5 270.1 59.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M270.2 59.7Q264.7 57.6 259.7 54.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M269.8 60.3Q264.7 62.6 259.9 65.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M499.4 59.8Q514.3 60.4 529.2 60.1M500.0 60.1Q514.9 61.3 529.7 60.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M529.8 59.8Q524.4 57.8 519.5 55.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M529.7 60.0Q524.6 63.2 519.3 66.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M761.0 60.2Q765.5 59.4 770.0 60.3M759.6 59.5Q764.9 58.9 770.1 59.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M769.6 60.2Q764.6 57.3 759.6 54.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M770.5 59.7Q764.8 62.8 759.1 66.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.8 119.3L495.6 121.0L495.3 260.4L11.1 259.0Z" fill="#eed5cc" stroke="none"/><path d="M8.8 121.0Q252.8 120.4 496.8 120.0M9.4 120.5Q253.3 122.7 497.3 119.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.4 117.7Q497.8 189.5 496.0 261.4M495.5 118.9Q492.9 190.6 496.0 262.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 259.7Q252.7 257.3 9.5 259.8M496.2 259.8Q252.8 261.8 9.5 260.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 261.0Q6.8 190.2 9.4 119.5M9.1 261.7Q8.1 189.6 8.9 117.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="163.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Without schemas (Fig 4-3)</text><text x="252.5" y="185.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">two streams read by five services give ten separate</text><text x="252.5" y="207.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">interpretations of the data: less structure means more</text><text x="252.5" y="229.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">misreading and divergent results</text><path d="M504.0 120.8L990.5 121.0L990.8 259.6L504.2 260.0Z" fill="#d6e1cf" stroke="none"/><path d="M502.5 120.8Q747.3 120.4 992.1 120.6M504.2 120.4Q747.8 118.3 991.4 121.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.7 118.6Q992.8 189.6 990.1 260.6M990.9 118.1Q991.0 189.7 989.3 261.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 260.8Q748.0 262.8 503.9 259.9M990.4 259.0Q746.7 256.9 503.1 260.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.0 262.1Q503.3 190.6 506.0 119.1M505.7 260.8Q506.7 189.2 504.2 117.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="163.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">With schemas (Fig 4-4)</text><text x="747.5" y="185.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a Java producer and a C++ consumer each generate</text><text x="747.5" y="207.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">classes or structs from the same Person schema;</text><text x="747.5" y="229.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">serialising a String into an Integer field fails</text><path d="M10.6 274.2L989.4 275.0L989.3 410.8L9.9 410.8Z" fill="#f1ede5" stroke="none"/><path d="M9.2 275.5Q500.0 273.5 990.8 273.9M8.6 275.0Q500.1 277.6 991.6 275.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 274.3Q987.1 342.5 989.5 410.7M990.8 273.6Q990.3 342.9 990.6 412.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 411.0Q500.0 412.9 8.7 409.5M990.5 409.7Q499.8 412.2 9.2 409.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.0 411.0Q10.2 342.2 10.8 273.4M9.2 412.4Q11.3 343.1 9.1 273.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="326.5" font-size="14.5" fill="#3b2f20" text-anchor="middle">Benefits: schemas as code (review, history), data protection (a producer cannot publish malformed data without a deliberate bypass),</text><text x="500.0" y="348.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">embedded documentation, a basis for discussion, code generation, safe schema evolution, and test data event generators (Kafka Connect Datagen).</text><text x="500.0" y="370.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">A schema cannot catch every error: a developer may still record height in inches instead of centimetres.</text></svg>