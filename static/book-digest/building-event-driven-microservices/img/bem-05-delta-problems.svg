<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 535" width="1000" height="535" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="535" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 105.3L10.7 104.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.5 59.7 495.0 106.2M494.9 12.9Q496.5 59.5 495.3 106.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 104.4Q252.6 107.2 8.7 104.5M496.4 104.7Q252.1 103.2 7.8 105.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 106.0Q10.1 59.3 10.1 12.7M10.2 105.9Q8.7 60.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="44.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1. Infinite delta types</text><text x="252.5" y="66.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">ItemAdded, ItemRemoved, then ItemQuantityUpdated, coupons,</text><text x="252.5" y="88.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">shipping, subscriptions: each changes how to aggregate</text><path d="M504.1 14.9L990.2 14.7L990.7 104.7L506.0 104.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.2 59.6 989.3 106.3M989.2 13.5Q989.0 59.5 990.4 105.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 104.5Q747.1 105.0 502.9 104.1M990.9 105.2Q746.9 106.3 502.9 105.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 107.1Q507.2 60.5 505.3 13.9M504.8 107.0Q503.5 60.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="44.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2. Logic replicated</text><text x="747.5" y="66.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">every consumer rebuilds the aggregate; out-of-order and</text><text x="747.5" y="88.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">late events handled differently (30 s wait or discard)</text><path d="M11.1 114.0L495.3 115.4L495.5 203.8L9.4 206.1Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 114.4Q252.5 116.4 496.6 114.4M9.6 115.2Q252.5 115.6 495.5 115.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 114.2Q496.6 159.8 495.3 205.5M496.1 112.5Q494.1 159.0 494.8 205.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 204.6Q252.0 206.6 8.0 205.0M497.1 204.3Q252.7 203.6 8.4 204.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 206.3Q11.6 160.2 10.1 114.1M9.5 207.4Q9.6 160.1 10.0 112.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="144.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3. Map poorly to streams</text><text x="252.5" y="166.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">new deltas require consumer code changes; one stream breaks</text><text x="252.5" y="188.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one-schema-per-stream; new streams still need notifying</text><path d="M504.3 115.1L991.1 115.8L991.1 206.1L504.7 203.8Z" fill="#d3dbe0" stroke="none"/><path d="M503.5 115.8Q747.1 117.0 990.6 115.5M502.6 115.4Q746.9 117.4 991.1 115.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 113.1Q991.1 159.9 990.5 206.8M990.0 114.0Q990.4 159.8 989.1 205.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 205.4Q748.1 204.3 504.3 204.1M991.7 205.0Q747.5 203.7 503.3 204.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 207.0Q506.2 159.7 505.3 112.5M506.0 206.4Q506.6 160.4 504.0 114.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="144.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">4. Ownership inverted</text><text x="747.5" y="166.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumer needs (package shipped, saw three ads then bought)</text><text x="747.5" y="188.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">get pushed into the producer; cannot cover other domains</text><path d="M9.1 214.1L494.6 214.3L494.6 305.2L9.4 305.1Z" fill="#d6e1cf" stroke="none"/><path d="M7.7 214.3Q252.3 216.0 496.8 214.3M9.1 214.1Q252.6 217.8 496.2 215.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.0 214.4Q496.5 260.4 494.4 306.3M495.1 213.9Q495.7 260.2 495.0 306.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.4 305.6Q252.7 304.2 8.1 304.5M497.5 304.0Q252.7 304.8 7.9 304.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 306.0Q10.9 259.9 11.0 213.7M10.3 305.5Q10.2 259.3 9.6 213.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="244.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">5. No usable history</text><text x="252.5" y="266.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">deltas cannot be compacted; ten years of cart events can</text><text x="252.5" y="288.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">take weeks to replay; snapshots bring back lambda</text><path d="M9.5 319.2L989.1 320.5L990.6 524.4L9.8 526.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 319.5Q500.2 316.6 992.4 320.0M7.8 320.6Q500.1 321.6 992.4 320.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 317.6Q989.9 422.6 990.3 527.5M990.0 318.5Q988.2 422.7 990.9 527.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 525.9Q500.1 522.3 8.9 524.2M991.4 524.3Q500.2 521.8 9.0 525.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 527.5Q13.0 422.8 9.3 318.2M9.8 527.3Q12.6 422.8 9.7 318.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="395.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Deltas are not bad: they are misused across domain boundaries. Use them inside one bounded context (event sourcing, tightly coupled apps owned by one team),</text><text x="500.0" y="417.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">and publish state events outward (Fig 5-16): context 1 keeps deltas private and composes state events; contexts 2 and 3 consume that state independently;</text><text x="500.0" y="439.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">context 4 consumes context 3&#x27;s state and uses deltas internally. Common weak arguments for deltas: &#x27;state wastes disk&#x27;, &#x27;consumers will know what it means&#x27;,</text><text x="500.0" y="461.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">&#x27;just publish one custom event for me&#x27;. Disk is cheap; engineer time for break-fix work is not.</text></svg>