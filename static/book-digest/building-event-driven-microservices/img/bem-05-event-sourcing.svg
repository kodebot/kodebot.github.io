<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">CRUD (Fig 5-4)</text><text x="252.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">mutable state; only the latest state is kept; audit log only</text><text x="252.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">for auditing; strong read-after-write consistency, simple,</text><text x="252.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">widely supported; limits: direct load on the store, conflicts</text><text x="252.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">under high concurrency</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d3dbe0" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event sourcing (Fig 5-5)</text><text x="747.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">immutable domain events in an append-only log (often a local</text><text x="747.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">table); an aggregator (separate from the writer, scalable apart)</text><text x="747.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">applies them in order to build state; Kafka possible but adds</text><text x="747.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">network latency and availability risk; eventually consistent</text><path d="M11.1 219.0L990.3 220.4L990.5 418.8L9.4 421.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 219.4Q500.0 221.4 991.6 219.4M9.6 220.2Q500.0 220.6 990.5 220.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 219.2Q991.9 319.8 990.3 420.5M991.1 217.5Q988.6 319.0 989.8 420.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 419.6Q499.5 421.6 8.0 420.0M992.1 419.3Q500.2 418.6 8.4 419.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 421.3Q12.0 320.2 10.1 219.1M9.5 422.4Q9.6 320.1 10.0 217.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="304.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">Event sourcing suits building internal state, not interdomain communication: exposing domain deltas lets others couple on a private model</text><text x="500.0" y="326.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">that can change and be misread. Any event you expose becomes part of the public data contract: keep &#x27;events in here&#x27; separate from &#x27;events out there&#x27;.</text><text x="500.0" y="348.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">The refrigerator example uses create, update and delete as events; the owner may add turn_lights_on, open_door and similar deltas.</text></svg>