<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="450" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 230.3L10.7 229.2Z" fill="#efe0ca" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 122.2 330.0 231.2M329.9 12.9Q331.9 122.0 330.3 231.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 229.4Q170.1 232.2 8.7 229.5M331.4 229.7Q169.6 228.2 7.8 230.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 231.0Q10.0 121.8 10.1 12.7M10.2 230.9Q8.5 122.6 9.1 14.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="73.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Hybrid events</text><text x="170.0" y="95.5" font-size="14.5" fill="#3b2f20" text-anchor="middle">a state event with a why or how, such as</text><text x="170.0" y="117.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">method_of_signup (MAIN, VIA_AD_EMAIL,</text><text x="170.0" y="139.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">THIRD_PARTY, ADMIN)</text><text x="170.0" y="161.5" font-size="13.5" fill="#3b2f20" text-anchor="middle">risk grows with delta complexity and change;</text><text x="170.0" y="183.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">document the enum; it becomes part of the contract</text><path d="M339.1 14.9L660.2 14.7L660.7 229.7L341.0 229.8Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 122.1 659.3 231.3M659.2 13.5Q658.8 122.0 660.4 230.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 229.5Q499.6 230.0 337.9 229.1M660.9 230.2Q499.4 231.3 337.9 230.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 232.1Q342.7 123.0 340.3 13.9M339.8 232.0Q338.2 122.7 339.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="84.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Measurement events</text><text x="500.0" y="106.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">complete record of an occurrence at a point in time</text><text x="500.0" y="128.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">(a user saw an ad); enable aggregations; sources may</text><text x="500.0" y="150.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">be lossy (ad-blockers); can drive time-sensitive use</text><text x="500.0" y="172.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">(factory sensors); SLOs decide whether to drop old</text><path d="M671.1 14.0L990.3 15.4L990.5 228.8L669.4 231.1Z" fill="#eed5cc" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 122.3 990.3 230.5M991.1 12.5Q988.6 121.5 989.8 230.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 229.6Q829.5 231.6 668.0 230.0M992.1 229.3Q830.2 228.6 668.4 229.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 231.3Q672.0 122.7 670.1 14.1M669.5 232.4Q669.6 122.6 670.0 12.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="73.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Notification events</text><text x="830.0" y="95.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">minimal fact plus a URI to more information</text><text x="830.0" y="117.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">antipattern when used to send state by pointer:</text><text x="830.0" y="139.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">the mutable resource may have moved on (race), new</text><text x="830.0" y="161.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">consumers see only now, and the owner must also</text><text x="830.0" y="183.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">serve synchronous queries; send the state instead</text><path d="M9.3 245.1L991.1 245.8L991.1 441.1L9.7 438.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 245.8Q499.6 247.0 990.6 245.5M7.6 245.4Q499.4 247.4 991.1 245.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 243.1Q991.3 342.4 990.5 441.8M990.0 244.0Q990.6 342.3 989.1 440.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 440.4Q500.6 439.3 9.3 439.1M991.7 440.0Q500.0 438.7 8.3 439.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 442.0Q11.5 342.2 10.3 242.5M11.0 441.4Q12.1 342.9 9.0 244.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="326.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Measurement in practice (the author at RIM/BlackBerry): a well-defined schema made post-processing easier; completeness mattered more than real time, with events</text><text x="500.0" y="348.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">arriving hours, days or weeks late; SLOs reflected that. Notification race example: SOLD, PARTIAL_RETURN, FULL_RETURN; a lagging consumer can miss PARTIAL_RETURN.</text><text x="500.0" y="370.5" font-size="13.5" fill="#3b2f20" text-anchor="middle">Hybrid example: the sign-up method is immutable and simple, so the risk is low but not zero (a new VIA_MOBILE_APP value can break consumers).</text></svg>