<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="470" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Publish before materialising (Fig 6-12)</text><text x="252.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">write to the stream, then read it back to build internal state:</text><text x="252.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">single source of truth, recovery from the stream;</text><text x="252.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">cost: extra latency, limited to simple upserts, needs refactoring</text><text x="252.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Compromise (Fig 6-13): unidirectional, eventually consistent</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Sinking event data</text><text x="747.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consume events and insert into a store (framework or a</text><text x="747.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">standalone service); replaces legacy point-to-point links;</text><text x="747.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">batch analytics via HDFS, S3, Azure Blob, Google Cloud</text><text x="747.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Storage, Apache Iceberg or Delta Lake tables</text><path d="M11.1 219.0L990.3 220.4L990.5 458.8L9.4 461.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 219.4Q500.0 221.4 991.6 219.4M9.6 220.2Q500.0 220.6 990.5 220.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 219.2Q991.9 339.8 990.3 460.5M991.1 217.5Q988.6 339.0 989.8 460.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 459.6Q499.5 461.6 8.0 460.0M992.1 459.3Q500.2 458.6 8.4 459.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 461.3Q12.0 340.2 10.1 219.1M9.5 462.4Q9.6 340.1 10.0 217.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="313.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Business impact: a central CDC framework team gives a quick start for larger organisations, but shares responsibility with source teams (adding fields can break</text><text x="500.0" y="335.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">connectors) and breeds reliance on connectors. CDC is a bootstrap, not the destination: let teams own publishing (outbox) for an &#x27;event-first&#x27; mindset,</text><text x="500.0" y="357.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">reserve the framework for maintenance-only systems, and refactor active products to produce and consume natively. The spectrum runs from careful integration</text><text x="500.0" y="379.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">(events as written, maybe produce first) to highly reactive pulling; the reactive end causes broken schemas and exposed internals and is unsustainable.</text></svg>