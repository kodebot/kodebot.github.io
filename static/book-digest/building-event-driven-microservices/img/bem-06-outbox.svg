>Table + outbox (one txn)</text><path d="M238.0 54.1Q247.7 55.2 257.3 55.3M235.9 54.4Q247.0 54.0 258.0 54.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M257.1 54.7Q251.9 52.3 246.7 50.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M256.5 55.1Q251.3 57.8 246.4 61.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.4 13.9L730.5 16.2L729.9 94.8L502.9 95.7Z" fill="#efe0ca" stroke="none"/><path d="M502.1 14.6Q617.0 12.9 732.0 15.0M503.1 14.3Q617.7 15.4 732.4 14.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M731.6 13.3Q730.1 55.2 731.1 97.1M730.5 14.4Q730.9 55.1 731.0 95.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M731.9 95.1Q617.7 92.5 503.5 95.7M733.5 94.8Q617.4 92.4 501.4 95.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M503.1 97.0Q504.6 54.8 504.4 12.6M503.6 97.1Q503.2 55.3 504.6 13.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="617.5" y="61.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Connector / publisher</text><path d="M484.5 55.3Q494.0 55.6 503.6 55.0M483.1 54.2Q493.4 55.3 503.6 55.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.4 54.5Q498.9 52.0 493.4 49.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M503.9 54.7Q498.6 57.4 493.5 60.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M751.3 13.9L978.5 16.1L977.9 93.9L752.1 95.8Z" fill="#d6e1cf" stroke="none"/><path d="M748.6 14.1Q863.9 13.1 979.2 14.3M749.7 14.5Q864.6 12.3 979.6 14.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M978.3 12.8Q980.4 55.0 978.6 97.1M977.7 14.1Q976.4 55.3 979.0 96.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M978.9 94.8Q863.8 93.9 748.7 95.1M979.5 95.1Q864.4 93.6 749.2 95.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M750.6 96.0Q748.9 55.3 751.3 14.5M750.4 96.4Q749.6 55.4 750.9 14.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="864.5" y="61.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event stream</text><path d="M732.0 55.2Q741.5 54.2 751.0 55.3M730.6 54.5Q740.9 53.7 751.1 54.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M750.6 55.2Q745.6 52.3 740.6 49.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M751.5 54.7Q745.8 57.8 740.1 61.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.8 109.3L495.6 111.0L495.3 310.4L11.1 309.0Z" fill="#d6e1cf" stroke="none"/><path d="M8.8 111.0Q252.8 110.4 496.8 110.0M9.4 110.5Q253.3 112.7 497.3 109.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.4 107.7Q497.8 209.5 496.0 311.4M495.5 108.9Q492.9 210.6 496.0 312.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 309.7Q252.7 307.3 9.5 309.8M496.2 309.8Q252.8 311.8 9.5 310.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 311.0Q6.8 210.2 9.4 109.5M9.1 311.7Q8.1 209.6 8.9 107.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="172.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Serialise before writing (Fig 6-6, 6-7)</text><text x="252.5" y="194.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a serialisation failure rolls back the transaction: strongest</text><text x="252.5" y="216.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">guarantee, the stream is first-class; one outbox with an</text><text x="252.5" y="238.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">output_stream column possible; cost: serialisation overhead</text><text x="252.5" y="260.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and a failed business process</text><path d="M504.0 110.8L990.5 111.0L990.8 309.6L504.2 310.0Z" fill="#eed5cc" stroke="none"/><path d="M502.5 110.8Q747.3 110.4 992.1 110.6M504.2 110.4Q747.8 108.3 991.4 111.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.7 108.6Q992.8 209.6 990.1 310.6M990.9 108.1Q991.0 209.7 989.3 311.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 310.8Q748.0 312.8 503.9 309.9M990.4 309.0Q746.7 306.9 503.1 310.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.0 312.1Q503.3 210.6 506.0 109.1M505.7 310.8Q506.7 209.2 504.2 107.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="172.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Serialise after writing (Fig 6-8, 6-9)</text><text x="747.5" y="194.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">separate outbox per model; the publisher serialises later;</text><text x="747.5" y="216.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">incompatible rows may already be committed, ending as many</text><text x="747.5" y="238.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">unserialisable events needing manual rescue, possibly with</text><text x="747.5" y="260.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">events out of order in the output streams</text><path d="M10.6 324.2L494.4 325.0L494.3 490.8L9.9 490.8Z" fill="#d0dfdc" stroke="none"/><path d="M9.2 325.5Q252.5 323.5 495.8 323.9M8.6 325.0Q252.6 327.6 496.6 325.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.2 324.3Q492.1 407.5 494.5 490.7M495.8 323.6Q495.3 407.9 495.6 492.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 491.0Q252.5 492.9 8.7 489.5M495.5 489.7Q252.3 492.2 9.2 489.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.0 491.0Q10.2 407.2 10.8 323.4M9.2 492.4Q11.3 408.1 9.1 323.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="380.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Benefits</text><text x="252.5" y="402.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">multi-language; atomic (no missed changes); early schema</text><text x="252.5" y="424.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">enforcement; internal model isolation (choose fields);</text><text x="252.5" y="446.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">denormalise on write; code lives with the application</text><path d="M505.1 325.2L991.0 324.6L990.6 490.9L505.0 488.9Z" fill="#efe0ca" stroke="none"/><path d="M504.1 325.4Q748.0 322.4 992.0 324.2M502.4 325.7Q746.8 326.7 991.2 325.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 322.9Q987.8 407.3 990.0 491.7M989.7 323.4Q987.0 407.2 990.3 490.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 489.5Q747.1 489.5 503.4 490.4M991.2 489.6Q747.3 487.8 503.4 491.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 492.6Q501.9 408.0 504.0 323.4M504.6 492.2Q502.2 408.0 504.6 323.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="380.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Drawbacks</text><text x="747.5" y="402.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">database must support transactions; application code changes;</text><text x="747.5" y="424.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">business process and data store performance impact;</text><text x="747.5" y="446.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">needs a strict ordering ID (or upsert and lose intermediates)</text></svg>