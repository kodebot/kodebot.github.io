<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="440" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="61.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Query-based polling</text><text x="252.5" y="83.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">initial snapshot, then incremental queries using an</text><text x="252.5" y="105.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">updated_at high-water mark (query n+1 from n)</text><text x="252.5" y="127.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Kafka Connect JDBC modes: incrementing, timestamp,</text><text x="252.5" y="149.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">timestamp+incrementing; needs a timestamp or ID column</text><text x="252.5" y="171.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">bulk load first; do not start a query before the last ends</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="61.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Benefits</text><text x="747.5" y="83.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">customisable (any store, any client)</text><text x="747.5" y="105.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">independent polling periods per query and SLA</text><text x="747.5" y="127.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">isolation of the internal model with views or</text><text x="747.5" y="149.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">materialised views</text><text x="747.5" y="171.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(caution: hidden data may need to be liberated)</text><path d="M11.1 219.0L990.3 220.4L990.5 428.8L9.4 431.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 219.4Q500.0 221.4 991.6 219.4M9.6 220.2Q500.0 220.6 990.5 220.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 219.2Q991.9 324.8 990.3 430.5M991.1 217.5Q988.6 324.0 989.8 430.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 429.6Q499.5 431.6 8.0 430.0M992.1 429.3Q500.2 428.6 8.4 429.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 431.3Q12.0 325.2 10.1 219.1M9.5 432.4Q9.6 325.1 10.0 217.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="298.0" font-size="15.5" fill="#3b2f20" text-anchor="middle">Drawbacks: needs an updated-at column; detects only soft deletes (an is_deleted column); brittle source-to-event schema link;</text><text x="500.0" y="320.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">may miss intermediate values between polls; consumes production resources (a read replica helps at extra cost); query time varies with data size</text><text x="500.0" y="342.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(races when a query overruns); transactional inconsistency: a record can arrive before the record it references.</text><text x="500.0" y="364.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">The book: CDC has improved a lot; query polling is mostly for stores and APIs with no log access; start with a framework rather than rolling your own.</text></svg>