<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#efe0ca" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="61.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Triggers (Fig 6-10, 6-11)</text><text x="252.5" y="83.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">AFTER INSERT/UPDATE/DELETE writes to a change table with a</text><text x="252.5" y="105.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">timestamp and sequence ID; if it fails the command fails;</text><text x="252.5" y="127.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">schema validation usually only after the fact; most databases</text><text x="252.5" y="149.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">support triggers; cheap for small data; customisable fields</text><text x="252.5" y="171.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">avoid when possible: overhead, change management, scales linearly</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="61.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Data definition changes</text><text x="747.5" y="83.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">adding, dropping, renaming columns and type changes break</text><text x="747.5" y="105.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">liberated streams; get into the source&#x27;s change process:</text><text x="747.5" y="127.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">watch the data store&#x27;s pull requests; add integration tests</text><text x="747.5" y="149.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">comparing event and store schemas; validate in the pipeline</text><text x="747.5" y="171.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">(an outbox keeps the code in one codebase, so builds break first)</text><path d="M11.1 219.0L990.3 220.4L990.5 418.8L9.4 421.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 219.4Q500.0 221.4 991.6 219.4M9.6 220.2Q500.0 220.6 990.5 220.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 219.2Q991.9 319.8 990.3 420.5M991.1 217.5Q988.6 319.0 989.8 420.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 419.6Q499.5 421.6 8.0 420.0M992.1 419.3Q500.2 418.6 8.4 419.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 421.3Q12.0 320.2 10.1 219.1M9.5 422.4Q9.6 320.1 10.0 217.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="304.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Keep the change table&#x27;s format in sync with the output event schema and compare them in testing. Triggers can suit legacy systems whose load and schemas are stable.</text><text x="500.0" y="326.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Some databases can run languages in triggers (Python in PostgreSQL) to validate schemas, at extra cost and complexity.</text><text x="500.0" y="348.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">The data store and event broker are independent systems; the schema bridge between them is precarious, and team boundaries often sit exactly there.</text></svg>