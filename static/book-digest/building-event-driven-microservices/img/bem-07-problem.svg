<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 145.3L10.7 144.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 79.7 330.0 146.2M329.9 12.9Q331.9 79.5 330.3 146.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 144.4Q170.1 147.2 8.7 144.5M331.4 144.7Q169.6 143.2 7.8 145.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="64.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Item</text><text x="170.0" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">item_id (key), name, price,</text><text x="170.0" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">merchant_id (foreign key), updated_at</text><path d="M339.1 14.9L660.2 14.7L660.7 144.7L341.0 144.8Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 79.6 659.3 146.3M659.2 13.5Q658.8 79.5 660.4 145.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 144.5Q499.6 145.0 337.9 144.1M660.9 145.2Q499.4 146.3 337.9 145.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 147.1Q342.7 80.5 340.3 13.9M339.8 147.0Q338.2 80.2 339.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="64.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Merchant</text><text x="500.0" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">merchant_id, name,</text><text x="500.0" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">premium_partner, updated_at</text><path d="M671.1 14.0L990.3 15.4L990.5 143.8L669.4 146.1Z" fill="#d6e1cf" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 79.8 990.3 145.5M991.1 12.5Q988.6 79.0 989.8 145.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 144.6Q829.5 146.6 668.0 145.0M992.1 144.3Q830.2 143.6 668.4 144.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 146.3Q672.0 80.2 670.1 14.1M669.5 147.4Q669.6 80.1 670.0 12.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="64.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Inventory</text><text x="830.0" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">item_id (shares Item&#x27;s key),</text><text x="830.0" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">quantity_in_stock, updated_at</text><path d="M9.3 160.1L496.1 160.8L496.1 291.1L9.7 288.8Z" fill="#eed5cc" stroke="none"/><path d="M8.5 160.8Q252.1 162.0 495.6 160.5M7.6 160.4Q251.9 162.4 496.1 160.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 158.1Q496.3 224.9 495.5 291.8M495.0 159.0Q495.6 224.8 494.1 290.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 290.4Q253.1 289.3 9.3 289.1M496.7 290.0Q252.5 288.7 8.3 289.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 292.0Q11.5 224.7 10.3 157.5M11.0 291.4Q12.1 225.4 9.0 159.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="209.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Without eventification (Fig 7-1)</text><text x="252.5" y="231.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">every consumer joins Item to Merchant itself to learn</text><text x="252.5" y="253.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">premium partner status: repeated processing and duplicated code</text><path d="M504.1 159.1L989.6 159.3L989.6 290.2L504.4 290.1Z" fill="#efe0ca" stroke="none"/><path d="M502.7 159.3Q747.3 161.0 991.8 159.3M504.1 159.1Q747.6 162.8 991.2 160.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 159.4Q992.1 225.4 989.4 291.3M990.1 158.9Q990.8 225.2 990.0 291.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 290.6Q747.7 289.2 503.1 289.5M992.5 289.0Q747.7 289.8 502.9 289.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 291.0Q505.9 224.9 506.0 158.7M505.3 290.5Q505.2 224.3 504.6 158.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="198.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Consumer client limits</text><text x="747.5" y="220.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">scalable streaming joins are mostly JVM-based (Kafka Streams,</text><text x="747.5" y="242.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Flink, Spark), some Python and SQL; no first-class Go, JS,</text><text x="747.5" y="264.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Ruby or Rust; a private relational database may not fit</text><path d="M9.5 304.2L989.1 305.5L990.6 419.4L9.8 421.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 304.5Q500.2 301.6 992.4 305.0M7.8 305.6Q500.1 306.6 992.4 305.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 302.6Q990.0 362.6 990.3 422.5M990.0 303.5Q988.4 362.7 990.9 422.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 420.9Q500.1 417.3 8.9 419.2M991.4 419.3Q500.2 416.8 9.0 420.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 422.5Q12.8 362.8 9.3 303.2M9.8 422.3Q12.3 362.8 9.7 303.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="357.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">Relational databases resolve relationships at query time; event-driven consumers work best when everything is in the event. Streaming joins are more complex,</text><text x="500.0" y="379.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">slower and costlier than static ones. Eventification denormalises and remodels relational streams so consumers need not (Enriched_Item holds Item plus Merchant).</text></svg>