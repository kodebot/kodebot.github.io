<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="470" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 215.3L10.7 214.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 114.7 495.0 216.2M494.9 12.9Q496.9 114.5 495.3 216.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 214.4Q252.6 217.2 8.7 214.5M496.4 214.7Q252.1 213.2 7.8 215.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 216.0Q10.0 114.3 10.1 12.7M10.2 215.9Q8.5 115.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="66.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">At the transactional outbox (Ex 7-1)</text><text x="252.5" y="88.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">join Item and Merchant inside the same transaction and write</text><text x="252.5" y="110.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Enriched_Item_Outbox; the database engine does the work;</text><text x="252.5" y="132.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the internal model stays encapsulated</text><text x="252.5" y="154.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">not possible for stores without transactions, frozen legacy</text><text x="252.5" y="176.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">systems or strict performance needs</text><path d="M504.1 14.9L990.2 14.7L990.7 214.7L506.0 214.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 114.6 989.3 216.3M989.2 13.5Q988.8 114.5 990.4 215.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 214.5Q747.1 215.0 502.9 214.1M990.9 215.2Q746.9 216.3 502.9 215.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 217.1Q507.7 115.5 505.3 13.9M504.8 217.0Q503.2 115.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">In a dedicated service (Fig 7-2, Ex 7-2)</text><text x="747.5" y="99.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a microservice or streaming SQL job joins the CDC streams:</text><text x="747.5" y="121.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">reduces database load, scales independently, simplifies source</text><text x="747.5" y="143.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">application logic; challenges: synchronising tables, connectors</text><text x="747.5" y="165.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and service, few robust joiners (JVM or SQL), and ownership</text><path d="M11.1 229.0L990.3 230.4L990.5 458.8L9.4 461.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 229.4Q500.0 231.4 991.6 229.4M9.6 230.2Q500.0 230.6 990.5 230.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 229.2Q991.9 344.8 990.3 460.5M991.1 227.5Q988.6 344.0 989.8 460.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 459.6Q499.5 461.6 8.0 460.0M992.1 459.3Q500.2 458.6 8.4 459.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 461.3Q12.0 345.2 10.1 229.1M9.5 462.4Q9.6 345.1 10.0 227.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="318.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">Whichever way you denormalise, when Merchant data changes (a merchant buys premium status) every affected Enriched_Item event must be updated,</text><text x="500.0" y="340.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">or the stream is permanently wrong. The best owner of an eventification service is the team that owns the source data. Windowing can bound materialised data;</text><text x="500.0" y="362.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">watch out-of-order data (Flink watermarks, Chapter 9). Keep it to joins and standardisation, no consumer business logic: SQL makes stray logic easy to spot.</text><text x="500.0" y="384.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Denormalising in a data lake is slow and expensive and pushes quality problems onto consumers.</text></svg>