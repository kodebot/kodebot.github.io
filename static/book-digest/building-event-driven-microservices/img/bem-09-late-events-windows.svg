<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 165.3L10.7 164.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 89.7 495.0 166.2M494.9 12.9Q496.9 89.5 495.3 166.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 164.4Q252.6 167.2 8.7 164.5M496.4 164.7Q252.1 163.2 7.8 165.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 166.0Q10.0 89.3 10.1 12.7M10.2 165.9Q8.5 90.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="63.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Out of order and late (Fig 9-7)</text><text x="252.5" y="85.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">out of order: timestamp lower than events ahead of it; late only</text><text x="252.5" y="107.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">relative to a consumer&#x27;s deadline: watermark W(t) passed, or</text><text x="252.5" y="129.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">stream time advanced; always process one partition in offset order</text><path d="M504.1 14.9L990.2 14.7L990.7 164.7L506.0 164.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 89.6 989.3 166.3M989.2 13.5Q988.8 89.5 990.4 165.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 164.5Q747.1 165.0 502.9 164.1M990.9 165.2Q746.9 166.3 502.9 165.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 167.1Q507.7 90.5 505.3 13.9M504.8 167.0Q503.2 90.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="52.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Causes (Fig 9-8, 9-9)</text><text x="747.5" y="74.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">out-of-order sources; several producers to several partitions</text><text x="747.5" y="96.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(repartitioning with instances at independent stream times,</text><text x="747.5" y="118.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">skew grows with unbalanced partitions, rates and backlogs);</text><text x="747.5" y="140.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a single-threaded producer does not reorder by itself</text><path d="M11.1 179.0L330.3 180.4L330.5 328.8L9.4 331.1Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 179.4Q170.0 181.4 331.6 179.4M9.6 180.2Q170.0 180.6 330.5 180.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.9 179.2Q331.9 254.8 330.3 330.5M331.1 177.5Q328.6 254.0 329.8 330.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.1 329.6Q169.5 331.6 8.0 330.0M332.1 329.3Q170.2 328.6 8.4 329.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 331.3Q12.0 255.2 10.1 179.1M9.5 332.4Q9.6 255.1 10.0 177.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="239.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Tumbling window</text><text x="170.0" y="261.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fixed size, no overlap</text><text x="170.0" y="283.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">&#x27;when is the peak hour?&#x27;</text><path d="M339.3 180.1L661.1 180.8L661.1 331.1L339.7 328.8Z" fill="#d6e1cf" stroke="none"/><path d="M338.5 180.8Q499.6 182.0 660.6 180.5M337.6 180.4Q499.4 182.4 661.1 180.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 178.1Q661.3 254.9 660.5 331.8M660.0 179.0Q660.6 254.8 659.1 330.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M662.0 330.4Q500.6 329.3 339.3 329.1M661.7 330.0Q500.0 328.7 338.3 329.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.9 332.0Q341.5 254.7 340.3 177.5M341.0 331.4Q342.1 255.4 339.0 179.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="239.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Sliding window</text><text x="500.0" y="261.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fixed size plus slide step</text><text x="500.0" y="283.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">&#x27;clicks in the past hour?&#x27;</text><path d="M669.1 179.1L989.6 179.3L989.6 330.2L669.4 330.1Z" fill="#d3dbe0" stroke="none"/><path d="M667.7 179.3Q829.8 181.0 991.8 179.3M669.1 179.1Q830.1 182.8 991.2 180.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 179.4Q992.1 255.4 989.4 331.3M990.1 178.9Q990.8 255.2 990.0 331.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 330.6Q830.2 329.2 668.1 329.5M992.5 329.0Q830.2 329.8 667.9 329.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.9 331.0Q670.9 254.9 671.0 178.7M670.3 330.5Q670.2 254.3 669.6 178.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="239.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Session window</text><text x="830.0" y="261.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">ends after inactivity timeout</text><text x="830.0" y="283.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">&#x27;what did a user view in a session?&#x27;</text><path d="M9.5 344.2L989.1 345.5L990.6 509.4L9.8 511.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 344.5Q500.2 341.6 992.4 345.0M7.8 345.6Q500.1 346.6 992.4 345.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 342.6Q989.9 427.6 990.3 512.5M990.0 343.5Q988.2 427.7 990.9 512.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 510.9Q500.1 507.3 8.9 509.2M991.4 509.3Q500.2 506.8 9.0 510.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 512.5Q13.0 427.8 9.3 343.2M9.8 512.3Q12.6 427.8 9.7 343.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="389.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Handling late events (decide at business level first): discard; keep the window open and delay output (completeness for latency); grace period (emit early, merge late</text><text x="500.0" y="411.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">events and re-emit); route to a separate stream and reconcile or compensate. Questions: how likely, how long to guard, cost of dropping, benefit of waiting, state size,</text><text x="500.0" y="433.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">cost versus benefit. You can never be sure all events arrived. Batch over bounded data is resilient but high latency (hours or a day); unbounded streams trade latency</text><text x="500.0" y="455.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">for determinism. Event-time windows usually have more business use than processing-time windows. Example: a one-hour grace window for the bank&#x27;s deposit and withdrawal</text><text x="500.0" y="477.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">ordering.</text></svg>