<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="480" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 235.3L10.7 234.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 124.7 495.0 236.2M494.9 12.9Q496.9 124.5 495.3 236.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 234.4Q252.6 237.2 8.7 234.5M496.4 234.7Q252.1 233.2 7.8 235.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 236.0Q10.0 124.3 10.1 12.7M10.2 235.9Q8.5 125.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="76.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Reprocessing checklist</text><text x="252.5" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">1. start point: usually the very beginning for stateful consumers</text><text x="252.5" y="120.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">2. which offsets to reset (a bank balance needs every paycheck)</text><text x="252.5" y="142.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">3. data volume and quotas so the broker is not overwhelmed</text><text x="252.5" y="164.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">4. time to reprocess: tell downstream consumers; scale out</text><text x="252.5" y="186.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">5. impact: do not re-email users &#x27;package shipped&#x27;</text><path d="M504.1 14.9L990.2 14.7L990.7 234.7L506.0 234.8Z" fill="#eed5cc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 124.6 989.3 236.3M989.2 13.5Q988.8 124.5 990.4 235.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 234.5Q747.1 235.0 502.9 234.1M990.9 235.2Q746.9 236.3 502.9 235.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 237.1Q507.7 125.5 505.3 13.9M504.8 237.0Q503.2 125.2 504.0 13.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="76.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Producer and broker outage (Fig 9-13 to 9-15)</text><text x="747.5" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">records are stamped in order but cannot be published; the</text><text x="747.5" y="120.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">consumer sees nothing on stream B and moves its event time on;</text><text x="747.5" y="142.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">when the producer reconnects the events are in order, but</text><text x="747.5" y="164.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">near-real-time consumers already treat them as late, while a</text><text x="747.5" y="186.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">later reprocessing would see them in order: results differ</text><path d="M11.1 249.0L990.3 250.4L990.5 468.8L9.4 471.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 249.4Q500.0 251.4 991.6 249.4M9.6 250.2Q500.0 250.6 990.5 250.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 249.2Q991.9 359.8 990.3 470.5M991.1 247.5Q988.6 359.0 989.8 470.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 469.6Q499.5 471.6 8.0 470.0M992.1 469.3Q500.2 468.6 8.4 469.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 471.3Q12.0 360.2 10.1 249.1M9.5 472.4Q9.6 360.1 10.0 247.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="333.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Mitigations: wait a fixed time before processing (adds latency, helps only for shorter delays) or use robust late-event handling in the business logic; make producer</text><text x="500.0" y="355.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">failures noisy. Reprocessing is typically for event-time services, not wall-clock windows. New services are effectively reprocessing history. Full determinism is never</text><text x="500.0" y="377.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">achievable with unbounded streams; best-effort solutions balance latency and correctness. Further reading: Akidau, &#x27;Streaming 101&#x27; and &#x27;Streaming 102&#x27;; Takada,</text><text x="500.0" y="399.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Distributed Systems for Fun and Profit.</text></svg>