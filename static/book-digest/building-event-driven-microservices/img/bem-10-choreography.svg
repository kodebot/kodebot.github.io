<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="470" fill="#fbf7ef"/><path d="M11.1 15.0L188.3 15.4L186.9 85.3L10.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q99.1 15.0 189.8 14.6M9.5 15.4Q99.5 14.6 189.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M188.8 13.3Q187.6 49.7 188.0 86.2M187.9 12.9Q189.3 49.5 188.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M189.5 84.4Q99.1 87.2 8.7 84.5M189.4 84.7Q98.6 83.2 7.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 86.0Q10.2 49.3 10.1 12.7M10.2 85.9Q8.9 50.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="99.0" y="56.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Service A</text><path d="M207.1 14.9L386.2 14.7L386.7 84.7L209.0 84.8Z" fill="#f1ede5" stroke="none"/><path d="M206.4 14.3Q296.7 15.9 387.0 14.1M205.7 14.3Q296.6 16.7 387.5 14.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M385.9 12.9Q386.9 49.6 385.3 86.3M385.2 13.5Q385.1 49.5 386.4 85.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M387.3 84.5Q296.6 85.0 205.9 84.1M386.9 85.2Q296.4 86.3 205.9 85.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M208.2 87.1Q209.9 50.5 208.3 13.9M207.8 87.0Q206.6 50.2 207.0 13.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="297.0" y="56.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Stream 1</text><path d="M189.0 49.1Q198.7 50.2 208.3 50.3M186.9 49.4Q198.0 49.0 209.0 49.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M208.1 49.7Q202.9 47.3 197.7 45.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.5 50.1Q202.3 52.8 197.4 56.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M406.4 13.9L583.5 16.2L582.9 84.8L404.9 85.7Z" fill="#d0dfdc" stroke="none"/><path d="M404.1 14.6Q494.5 12.9 585.0 15.0M405.1 14.3Q495.2 15.4 585.4 14.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M584.6 13.3Q583.2 50.2 584.1 87.1M583.5 14.4Q583.8 50.1 584.0 85.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M584.9 85.1Q495.2 82.5 405.5 85.7M586.5 84.8Q494.9 82.4 403.4 85.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M405.1 87.0Q406.5 49.8 406.4 12.6M405.6 87.1Q405.3 50.3 406.6 13.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="495.0" y="56.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Service B</text><path d="M386.5 50.3Q396.0 50.6 405.6 50.0M385.1 49.2Q395.4 50.3 405.6 50.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M406.4 49.5Q400.9 47.0 395.4 44.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M405.9 49.7Q400.6 52.4 395.5 55.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M604.3 13.9L782.5 16.1L781.9 83.9L605.1 85.8Z" fill="#f1ede5" stroke="none"/><path d="M601.6 14.1Q692.4 13.1 783.2 14.3M602.7 14.5Q693.1 12.3 783.6 14.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M782.3 12.8Q784.2 50.0 782.6 87.1M781.7 14.1Q780.6 50.3 783.0 86.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M782.9 84.8Q692.3 83.9 601.7 85.1M783.5 85.1Q692.9 83.6 602.2 85.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M603.6 86.0Q602.0 50.3 604.3 14.5M603.4 86.4Q602.7 50.4 603.9 14.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="693.0" y="56.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Stream 2</text><path d="M585.0 50.2Q594.5 49.2 604.0 50.3M583.6 49.5Q593.9 48.7 604.1 49.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M603.6 50.2Q598.6 47.3 593.6 44.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M604.5 49.7Q598.8 52.8 593.1 56.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M800.8 14.3L980.6 16.0L980.3 85.4L803.1 84.0Z" fill="#d6e1cf" stroke="none"/><path d="M800.8 16.0Q891.3 15.4 981.8 15.0M801.4 15.5Q891.8 17.7 982.3 14.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.4 12.7Q982.1 49.5 981.0 86.4M980.5 13.9Q978.9 50.6 981.0 87.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.8 84.7Q891.2 82.3 801.5 84.8M981.2 84.8Q891.3 86.8 801.5 85.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M802.5 86.0Q799.9 50.2 801.4 14.5M801.1 86.7Q800.4 49.6 800.9 12.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="891.0" y="56.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Service C</text><path d="M781.1 50.7Q791.8 51.6 802.4 50.9M781.6 49.2Q791.8 50.0 802.0 49.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M802.3 50.3Q796.9 47.4 791.3 44.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M801.9 50.5Q796.4 52.9 790.9 55.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.1 99.0L493.9 100.9L494.6 269.3L9.7 269.7Z" fill="#d6e1cf" stroke="none"/><path d="M9.0 100.8Q253.0 97.9 496.9 99.9M7.4 99.0Q251.7 102.6 496.1 100.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.0 99.1Q496.7 185.6 496.0 272.1M495.7 97.8Q493.2 184.2 494.2 270.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 269.3Q252.5 271.4 8.0 270.0M497.3 269.9Q253.3 268.8 9.3 270.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.3 270.4Q9.5 184.5 9.6 98.6M10.1 271.7Q12.8 184.7 10.8 97.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="147.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Choreography (reactive)</text><text x="252.5" y="169.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">services react independently to events; no blocking, no</text><text x="252.5" y="191.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">central control; the producer does not know its consumers;</text><text x="252.5" y="213.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">very loose coupling, often across teams; easy to extend by</text><text x="252.5" y="235.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">adding steps at the end; common in event-driven systems</text><path d="M504.4 99.1L990.8 100.8L990.1 270.6L505.7 270.2Z" fill="#efe0ca" stroke="none"/><path d="M503.3 101.0Q747.5 97.5 991.7 99.5M502.5 99.7Q747.3 96.6 992.2 99.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 98.0Q990.6 184.7 990.8 271.4M989.2 99.4Q987.0 185.6 989.1 271.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.6 270.2Q748.0 268.4 504.5 269.6M992.3 270.0Q747.4 269.0 502.4 270.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.5 270.7Q506.7 184.1 504.2 97.4M504.7 272.4Q503.4 185.1 505.3 97.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="147.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Changing it (Fig 10-2)</text><text x="747.5" y="169.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">inserting or reordering steps means editing several services,</text><text x="747.5" y="191.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">possibly breaking schema changes, a new event schema, and</text><text x="747.5" y="213.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">draining in-flight work first; restrict access to intermediate</text><text x="747.5" y="235.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">streams so others cannot couple on them</text><path d="M10.0 285.2L990.7 284.7L989.9 460.3L9.4 461.1Z" fill="#f1ede5" stroke="none"/><path d="M7.8 284.5Q499.6 285.4 991.4 285.4M8.2 284.6Q499.8 287.9 991.4 286.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.6 284.6Q992.7 373.0 989.0 461.4M989.6 284.2Q992.0 373.0 989.6 461.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.9 461.0Q500.0 462.9 8.1 460.2M991.0 459.2Q500.2 460.4 9.3 459.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.3 461.8Q12.8 372.7 9.4 283.5M10.1 461.6Q8.7 372.8 9.2 284.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="345.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Monitoring (Fig 10-3): define the workflow and its success metric, then keep a central monitor that consumes each stream and materialises progress to spot stuck or</text><text x="500.0" y="367.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">incomplete events (remediation belongs to service owners); health checks such as heartbeats on the services. For huge workflows watch 5 or 6 critical steps of 100.</text><text x="500.0" y="389.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Monitoring can be brittle as independent services change; it is easier for a few services owned by one team. Workflows often emerge organically with no clear start or</text><text x="500.0" y="411.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">end.</text></svg>