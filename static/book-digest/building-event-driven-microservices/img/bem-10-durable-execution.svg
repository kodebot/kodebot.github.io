<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="470" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Durable execution engine (DEE)</text><text x="252.5" y="94.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">runs long-lived stateful workflows to completion despite failures,</text><text x="252.5" y="116.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">restarts and time-outs (&#x27;workflows as code&#x27;): Cadence, Temporal,</text><text x="252.5" y="138.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">Restate, Resonate; automatic retries, transactions with compensation,</text><text x="252.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">less boilerplate, no re-running finished steps, waits for humans</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">How it recovers</text><text x="747.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">an append-only durable log records progress (last line run),</text><text x="747.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">state, call parameters, returns and durable promises; if it fails</text><text x="747.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">after &#x27;Hello&#x27; and before &#x27;Bye&#x27;, it restores and skips &#x27;Hello&#x27;</text><text x="747.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Temporal sample); embedded as an SDK in your service</text><path d="M11.1 219.0L495.3 220.4L495.5 368.8L9.4 371.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 219.4Q252.5 221.4 496.6 219.4M9.6 220.2Q252.5 220.6 495.5 220.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 219.2Q496.9 294.8 495.3 370.5M496.1 217.5Q493.6 294.0 494.8 370.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 369.6Q252.0 371.6 8.0 370.0M497.1 369.3Q252.7 368.6 8.4 369.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 371.3Q12.0 295.2 10.1 219.1M9.5 372.4Q9.6 295.1 10.0 217.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="257.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Trade-offs</text><text x="252.5" y="279.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">new dependency and lock-in; learning curve; engine-specific</text><text x="252.5" y="301.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">concepts (workflows, activities, workers, timers, signals);</text><text x="252.5" y="323.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">versioning of running workflows; state persistence overhead;</text><text x="252.5" y="345.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">extra resources (or a managed service)</text><path d="M504.3 220.1L991.1 220.8L991.1 371.1L504.7 368.8Z" fill="#d3dbe0" stroke="none"/><path d="M503.5 220.8Q747.1 222.0 990.6 220.5M502.6 220.4Q746.9 222.4 991.1 220.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 218.1Q991.3 294.9 990.5 371.8M990.0 219.0Q990.6 294.8 989.1 370.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 370.4Q748.1 369.3 504.3 369.1M991.7 370.0Q747.5 368.7 503.3 369.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 372.0Q506.5 294.7 505.3 217.5M506.0 371.4Q507.1 295.4 504.0 219.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="257.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">When it fits</text><text x="747.5" y="279.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">complex, long-running workflows triggered by non-repeatable</text><text x="747.5" y="301.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">inputs such as HTTP or RPC requests; often overkill when you can</text><text x="747.5" y="323.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">reconsume a stream; it cannot remove races, so keep requests</text><text x="747.5" y="345.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">idempotent</text><path d="M9.1 384.1L989.6 384.3L989.6 460.2L9.4 460.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 384.3Q499.8 386.0 991.8 384.3M9.1 384.1Q500.1 387.8 991.2 385.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 384.4Q991.3 422.9 989.4 461.3M990.1 383.9Q990.6 422.7 990.0 461.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 460.6Q500.2 459.2 8.1 459.5M992.5 459.0Q500.2 459.8 7.9 459.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 461.0Q10.9 422.4 11.0 383.7M10.3 460.5Q10.1 421.8 9.6 383.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="417.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Choose: choreography for simple, stable, loosely coupled flows; orchestration for changing, many-service flows needing visibility; compensation instead of sagas where</text><text x="500.0" y="439.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">possible.</text></svg>