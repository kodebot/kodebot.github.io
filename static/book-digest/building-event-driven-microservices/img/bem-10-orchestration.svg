<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="490" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 185.3L10.7 184.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 99.7 495.0 186.2M494.9 12.9Q496.9 99.5 495.3 186.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 184.4Q252.6 187.2 8.7 184.5M496.4 184.7Q252.1 183.2 7.8 185.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 186.0Q10.0 99.3 10.1 12.7M10.2 185.9Q8.5 100.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="62.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Orchestration (Fig 10-4)</text><text x="252.5" y="84.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one service holds the whole workflow in code, sends commands,</text><text x="252.5" y="106.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">awaits responses and keeps state of what is done, in progress or</text><text x="252.5" y="128.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">not started (Table 10-1: events 100 done, 101 in progress, 102</text><text x="252.5" y="150.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">dispatched); commands and responses via streams or queues</text><path d="M504.1 14.9L990.2 14.7L990.7 184.7L506.0 184.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 99.6 989.3 186.3M989.2 13.5Q988.8 99.5 990.4 185.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 184.5Q747.1 185.0 502.9 184.1M990.9 185.2Q746.9 186.3 502.9 185.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 187.1Q507.7 100.5 505.3 13.9M504.8 187.0Q503.2 100.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="73.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Request-response orchestration (Fig 10-5)</text><text x="747.5" y="95.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">HTTP or RPC calls, blocking or async (futures, promises);</text><text x="747.5" y="117.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">integrates SaaS and legacy services without event APIs;</text><text x="747.5" y="139.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">low latency; needs routing, scaling and failover support</text><path d="M11.1 199.0L495.3 200.4L495.5 348.8L9.4 351.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 199.4Q252.5 201.4 496.6 199.4M9.6 200.2Q252.5 200.6 495.5 200.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 199.2Q496.9 274.8 495.3 350.5M496.1 197.5Q493.6 274.0 494.8 350.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 349.6Q252.0 351.6 8.0 350.0M497.1 349.3Q252.7 348.6 8.4 349.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 351.3Q12.0 275.2 10.1 199.1M9.5 352.4Q9.6 275.1 10.0 197.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="248.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event-driven orchestration</text><text x="252.5" y="270.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">same tooling as other event-driven services; streams readable</text><text x="252.5" y="292.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">by others; durable (the broker isolates failures); built-in</text><text x="252.5" y="314.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">retry as streams and queues do not advance until processed</text><path d="M504.3 200.1L991.1 200.8L991.1 351.1L504.7 348.8Z" fill="#efe0ca" stroke="none"/><path d="M503.5 200.8Q747.1 202.0 990.6 200.5M502.6 200.4Q746.9 202.4 991.1 200.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 198.1Q991.3 274.9 990.5 351.8M990.0 199.0Q990.6 274.8 989.1 350.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 350.4Q748.1 349.3 504.3 349.1M991.7 350.0Q747.5 348.7 503.3 349.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 352.0Q506.5 274.7 505.3 197.5M506.0 351.4Q507.1 275.4 504.0 199.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="248.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Division of labour</text><text x="747.5" y="270.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">the orchestrator says what (book a flight, pay an order); workers</text><text x="747.5" y="292.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">own how, including retries and failure; the payment service tries</text><text x="747.5" y="314.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">three times and reports only success or failure</text><path d="M9.1 364.1L989.6 364.3L989.6 480.2L9.4 480.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 364.3Q499.8 366.0 991.8 364.3M9.1 364.1Q500.1 367.8 991.2 365.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 364.4Q991.9 422.9 989.4 481.3M990.1 363.9Q990.8 422.7 990.0 481.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 480.6Q500.2 479.2 8.1 479.5M992.5 479.0Q500.2 479.8 7.9 479.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 481.0Q10.9 422.4 11.0 363.7M10.3 480.5Q10.2 421.8 9.6 363.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="406.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">Keep the orchestrator to workflow logic only; a &#x27;God&#x27; service issuing granular commands to weak minions spreads business logic and breaks bounded contexts.</text><text x="500.0" y="428.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">Easier to change (one place) but do not corrupt in-progress events; monitoring is simple (its store holds all state: expose via API or publish state changes).</text><text x="500.0" y="450.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">Mixing event-driven and request-response is fine.</text></svg>