<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Saga (distributed transaction)</text><text x="252.5" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">spans independent data stores; each service processes its part</text><text x="252.5" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and can reverse it; fulfilment and reversal live in one service;</text><text x="252.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">idempotent or rollback-able; best avoided unless necessary</text><text x="252.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(synchronisation, rollbacks, instance and network failures)</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Choreographed saga (Fig 10-6 to 10-8)</text><text x="747.5" y="94.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">each service reads a saga stream and writes an instruction stream;</text><text x="747.5" y="116.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">commit propagates back A to B to C and returns; a local failure in C</text><text x="747.5" y="138.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">makes B and A roll back; brittle, hard to monitor or reorder; arises</text><text x="747.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">organically; lift and shift swaps a whole context</text><path d="M11.1 219.0L495.3 220.4L495.5 408.8L9.4 411.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 219.4Q252.5 221.4 496.6 219.4M9.6 220.2Q252.5 220.6 495.5 220.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 219.2Q496.9 314.8 495.3 410.5M496.1 217.5Q493.6 314.0 494.8 410.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 409.6Q252.0 411.6 8.0 410.0M497.1 409.3Q252.7 408.6 8.4 409.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 411.3Q12.0 315.2 10.1 219.1M9.5 412.4Q9.6 315.1 10.0 217.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="277.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Orchestrated saga (Fig 10-9, 10-10)</text><text x="252.5" y="299.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">orchestrator reverses by running each worker&#x27;s complementary</text><text x="252.5" y="321.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">action; SaaS B fails (1), state updated (2), rollback to A (3, 4, 5),</text><text x="252.5" y="343.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">marked failed (6), result emitted (7); timeouts and human input via</text><text x="252.5" y="365.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">REST; if neither commit nor rollback works, halt and treat as an incident</text><path d="M504.3 220.1L991.1 220.8L991.1 411.1L504.7 408.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.5 220.8Q747.1 222.0 990.6 220.5M502.6 220.4Q746.9 222.4 991.1 220.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 218.1Q991.3 314.9 990.5 411.8M990.0 219.0Q990.6 314.8 989.1 410.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 410.4Q748.1 409.3 504.3 409.1M991.7 410.0Q747.5 408.7 503.3 409.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 412.0Q506.5 314.7 505.3 217.5M506.0 411.4Q507.1 315.4 504.0 219.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="277.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Compensation workflow</text><text x="747.5" y="299.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">move forward instead of undoing: an oversold item (shelf empty)</text><text x="747.5" y="321.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">gets new stock ordered, a delay notice, a discount code, and the</text><text x="747.5" y="343.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">customer may cancel or wait; humans can intervene with an override;</text><text x="747.5" y="365.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">suits digital versus physical mismatches found late</text><path d="M9.1 424.1L989.6 424.3L989.6 510.2L9.4 510.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 424.3Q499.8 426.0 991.8 424.3M9.1 424.1Q500.1 427.8 991.2 425.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 424.4Q991.5 467.9 989.4 511.3M990.1 423.9Q990.6 467.7 990.0 511.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 510.6Q500.2 509.2 8.1 509.5M992.5 509.0Q500.2 509.8 7.9 509.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 511.0Q10.9 467.4 11.0 423.7M10.3 510.5Q10.2 466.8 9.6 423.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="462.5" font-size="13.5" fill="#3b2f20" text-anchor="middle">Each service stays responsible for its own state consistency after a rollback; the orchestrator only issues rollbacks and awaits confirmations.</text><text x="500.0" y="484.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">The overhead of an orchestrator buys clarity and visibility.</text></svg>