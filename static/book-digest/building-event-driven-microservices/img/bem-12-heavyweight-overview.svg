<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="490" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 205.3L10.7 204.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 109.7 330.0 206.2M329.9 12.9Q331.9 109.5 330.3 206.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 204.4Q170.1 207.2 8.7 204.5M331.4 204.7Q169.6 203.2 7.8 205.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="61.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Three defining traits</text><text x="170.0" y="83.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">1. an independent processing cluster</text><text x="170.0" y="105.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(worker nodes plus resource managers)</text><text x="170.0" y="127.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">2. its own failure, recovery, storage and</text><text x="170.0" y="149.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">coordination mechanisms</text><text x="170.0" y="171.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">3. automatic data shuffling between instances</text><path d="M339.1 14.9L660.2 14.7L660.7 204.7L341.0 204.8Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 109.6 659.3 206.3M659.2 13.5Q658.8 109.5 660.4 205.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 204.5Q499.6 205.0 337.9 204.1M660.9 205.2Q499.4 206.3 337.9 205.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 207.1Q342.7 110.5 340.3 13.9M339.8 207.0Q338.2 110.2 339.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">History</text><text x="500.0" y="94.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">descended from batch: Hadoop (2006), MapReduce;</text><text x="500.0" y="116.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Spark began as a faster MapReduce replacement,</text><text x="500.0" y="138.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">stream processing came later; Flink handled streams</text><text x="500.0" y="160.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">from the start; Beam model; also batch jobs</text><path d="M671.1 14.0L990.3 15.4L990.5 203.8L669.4 206.1Z" fill="#d6e1cf" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 109.8 990.3 205.5M991.1 12.5Q988.6 109.0 989.8 205.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 204.6Q829.5 206.6 668.0 205.0M992.1 204.3Q830.2 203.6 668.4 204.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 206.3Q672.0 110.2 670.1 14.1M669.5 207.4Q669.6 110.1 670.0 12.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Cluster roles (Fig 12-3, 12-4)</text><text x="830.0" y="94.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">resource manager schedules workers and tasks, with</text><text x="830.0" y="116.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">backups; worker or executor runs the tasks; ZooKeeper</text><text x="830.0" y="138.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">(or similar) elects the leader; a job is a long-running</text><text x="830.0" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">streaming application split into tasks</text><path d="M9.3 220.1L991.1 220.8L991.1 346.1L9.7 343.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 220.8Q499.6 222.0 990.6 220.5M7.6 220.4Q499.4 222.4 991.1 220.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 218.1Q991.3 282.4 990.5 346.8M990.0 219.0Q990.6 282.3 989.1 345.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 345.4Q500.6 344.3 9.3 344.1M991.7 345.0Q500.0 343.7 8.3 344.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 347.0Q11.4 282.2 10.3 217.5M11.0 346.4Q12.0 282.9 9.0 219.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="277.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Covers Spark, Flink and the Beam model (Storm and Heron were dropped as their use dwindled). Proprietary Google Dataflow runs Beam applications (internals not</text><text x="500.0" y="299.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">described). Parallelism is configurable: one task per partition, one task for all, or many tasks on one partition (as with a queue).</text><path d="M9.1 359.1L989.6 359.3L989.6 480.2L9.4 480.1Z" fill="#efe0ca" stroke="none"/><path d="M7.7 359.3Q499.8 361.0 991.8 359.3M9.1 359.1Q500.1 362.8 991.2 360.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 359.4Q991.9 420.4 989.4 481.3M990.1 358.9Q990.8 420.2 990.0 481.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 480.6Q500.2 479.2 8.1 479.5M992.5 479.0Q500.2 479.8 7.9 479.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 481.0Q10.9 419.9 11.0 358.7M10.3 480.5Q10.2 419.3 9.6 358.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="404.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">Benefits and limits: strong for analytics, ETL, sessions and windows, anomaly detection and aggregation; but not designed for microservice deployment</text><text x="500.0" y="426.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(a dedicated cluster), mostly Java and Python, and some frameworks cannot materialise an entity stream into an indefinite table.</text><text x="500.0" y="448.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Acid test: do they support joins? Check for a global window if not.</text></svg>