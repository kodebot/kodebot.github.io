<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 195.3L10.7 194.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 104.7 495.0 196.2M494.9 12.9Q496.9 104.5 495.3 196.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 194.4Q252.6 197.2 8.7 194.5M496.4 194.7Q252.1 193.2 7.8 195.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 196.0Q10.0 104.3 10.1 12.7M10.2 195.9Q8.5 105.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="67.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event-driven communication (Fig 15-3)</text><text x="252.5" y="89.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">functions connect through internal streams, each manages its own offsets;</text><text x="252.5" y="111.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">one bounded context may hold many functions and streams, sharing a</text><text x="252.5" y="133.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">consumer group; failures lose no data since the broker retains events;</text><text x="252.5" y="155.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">choreography, or orchestration at more complexity</text><path d="M504.1 14.9L990.2 14.7L990.7 194.7L506.0 194.8Z" fill="#eed5cc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 104.6 989.3 196.3M989.2 13.5Q988.8 104.5 990.4 195.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 194.5Q747.1 195.0 502.9 194.1M990.9 195.2Q746.9 196.3 502.9 195.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 197.1Q507.7 105.5 505.3 13.9M504.8 197.0Q503.2 105.2 504.0 13.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="67.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Asynchronous direct calls (Fig 15-4)</text><text x="747.5" y="89.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">function A fires B and does not wait: simple chaining, but A may commit</text><text x="747.5" y="111.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">offsets though B failed, and several B instances race, so events are</text><text x="747.5" y="133.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">processed out of order, even when A first processes the whole batch;</text><text x="747.5" y="155.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">strict in-order work needs A then B per event</text><path d="M11.1 209.0L990.3 210.4L990.5 338.8L9.4 341.1Z" fill="#d3dbe0" stroke="none"/><path d="M8.4 209.4Q500.0 211.4 991.6 209.4M9.6 210.2Q500.0 210.6 990.5 210.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 209.2Q991.9 274.8 990.3 340.5M991.1 207.5Q988.6 274.0 989.8 340.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 339.6Q499.5 341.6 8.0 340.0M992.1 339.3Q500.2 338.6 8.4 339.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 341.3Q12.0 275.2 10.1 209.1M9.5 342.4Q9.6 275.1 10.0 207.8" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="270.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">Synchronous direct calls: orchestration (Fig 15-5). An orchestrator function takes a batch, and for each event calls A, then B with A&#x27;s result, composes the output and produces it;</text><text x="500.0" y="292.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">each event completes before the next, so offset order holds; on success the framework updates the consumer offsets.</text><path d="M9.3 355.1L991.1 355.8L991.1 511.1L9.7 508.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 355.8Q499.6 357.0 990.6 355.5M7.6 355.4Q499.4 357.4 991.1 355.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 353.1Q991.3 432.4 990.5 511.8M990.0 354.0Q990.6 432.3 989.1 510.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 510.4Q500.6 509.3 9.3 509.1M991.7 510.0Q500.0 508.7 8.3 509.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 512.0Q11.5 432.2 10.3 352.5M11.0 511.4Q12.1 432.9 9.0 354.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="405.5" font-size="16.0" fill="#3b2f20" text-anchor="middle">Handling failures: you can always reprocess the stream, so make functions idempotent. Intermittent failures usually resolve;</text><text x="500.0" y="427.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">resource failures (memory) repeat unless redesigned; a batch too big for the lifespan needs more time or smaller batches</text><text x="500.0" y="449.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">(some listeners halve the batch automatically; self-managed consumers can commit partway); an orchestrator failure reruns the whole batch,</text><text x="500.0" y="471.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">repeating side effects and calls, and compensation can fail too: for stronger guarantees look to durable function orchestration.</text></svg>