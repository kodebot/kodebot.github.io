<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event-stream listener (Fig 15-1, 15-2)</text><text x="252.5" y="94.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">the framework consumes and passes an array of events (unordered for a</text><text x="252.5" y="116.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">queue); cloud providers support their own brokers, Kafka Connect can</text><text x="252.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">act as an external listener; synchronous keeps order (limited by</text><text x="252.5" y="160.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">partitions), asynchronous does not; batch size and batch window</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Consumer group lag</text><text x="747.5" y="94.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">poll the group&#x27;s offsets, compute lag, tell the FaaS framework to</text><text x="747.5" y="116.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">start functions; the trigger only notifies, so the function connects,</text><text x="747.5" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumes and commits offsets itself (like a short-lived basic</text><text x="747.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumer); a frequently triggered function may stay warm</text><path d="M11.1 219.0L330.3 220.4L330.5 353.8L9.4 356.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 219.4Q170.0 221.4 331.6 219.4M9.6 220.2Q170.0 220.6 330.5 220.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.9 219.2Q331.9 287.3 330.3 355.5M331.1 217.5Q328.6 286.5 329.8 355.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.1 354.6Q169.5 356.6 8.0 355.0M332.1 354.3Q170.2 353.6 8.4 354.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 356.3Q12.0 287.7 10.1 219.1M9.5 357.4Q9.6 287.6 10.0 217.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="271.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Schedule</text><text x="170.0" y="293.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">start at intervals, poll streams;</text><text x="170.0" y="315.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">not common for event-driven</text><path d="M339.3 220.1L661.1 220.8L661.1 356.1L339.7 353.8Z" fill="#d3dbe0" stroke="none"/><path d="M338.5 220.8Q499.6 222.0 660.6 220.5M337.6 220.4Q499.4 222.4 661.1 220.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 218.1Q661.3 287.4 660.5 356.8M660.0 219.0Q660.6 287.3 659.1 355.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M662.0 355.4Q500.6 354.3 339.3 354.1M661.7 355.0Q500.0 353.7 338.3 354.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.9 357.0Q341.5 287.2 340.3 217.5M341.0 356.4Q342.1 287.9 339.0 219.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="271.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Webhooks</text><text x="500.0" y="293.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">direct invocation by monitoring,</text><text x="500.0" y="315.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">schedulers, third parties</text><path d="M669.1 219.1L989.6 219.3L989.6 355.2L669.4 355.1Z" fill="#f1ede5" stroke="none"/><path d="M667.7 219.3Q829.8 221.0 991.8 219.3M669.1 219.1Q830.1 222.8 991.2 220.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 219.4Q992.1 287.9 989.4 356.3M990.1 218.9Q990.8 287.7 990.0 356.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 355.6Q830.2 354.2 668.1 354.5M992.5 354.0Q830.2 354.8 667.9 354.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.9 356.0Q670.9 287.4 671.0 218.7M670.3 355.5Q670.2 286.8 669.6 218.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="271.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Resource events</text><text x="830.0" y="293.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">file or row changes; handy for FTP</text><text x="830.0" y="315.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">file drops from external sources</text><path d="M9.5 369.2L989.1 370.5L990.6 509.4L9.8 511.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 369.5Q500.2 366.6 992.4 370.0M7.8 370.6Q500.1 371.6 992.4 370.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 367.6Q989.9 440.1 990.3 512.5M990.0 368.5Q988.2 440.2 990.9 512.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 510.9Q500.1 507.3 8.9 509.2M991.4 509.3Q500.2 506.8 9.0 510.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 512.5Q13.0 440.3 9.3 368.2M9.8 512.3Q12.6 440.3 9.7 368.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="413.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Scaling: scale by lag, time of day, throughput or performance; parallelism is limited by partition count when order matters. Beware thrashing: many short-lived</text><text x="500.0" y="435.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">functions with small batches and aggressive scaling can cause near-constant rebalancing, even a rebalance deadlock; use step-based scaling or a hysteresis loop. State:</text><text x="500.0" y="457.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">usually external (no local state policy); warm local state is not guaranteed; restrict store access to the bounded context; durable stateful functions such as Azure</text><text x="500.0" y="479.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Durable Functions persist state automatically.</text></svg>