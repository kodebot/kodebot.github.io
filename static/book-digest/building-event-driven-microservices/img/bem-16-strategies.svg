<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 145.3L10.7 144.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 79.7 495.0 146.2M494.9 12.9Q496.9 79.5 495.3 146.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 144.4Q252.6 147.2 8.7 144.5M496.4 144.7Q252.1 143.2 7.8 145.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Wait, or give up</text><text x="252.5" y="75.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">wait for the completing event (a join, session end, aggregate), retry a</text><text x="252.5" y="97.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">query later, or emit an incomplete result to update; giving up is final:</text><text x="252.5" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a late arrival is too late</text><path d="M504.1 14.9L990.2 14.7L990.7 144.7L506.0 144.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 79.6 989.3 146.3M989.2 13.5Q988.8 79.5 990.4 145.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 144.5Q747.1 145.0 502.9 144.1M990.9 145.2Q746.9 146.3 502.9 145.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 147.1Q507.7 80.5 505.3 13.9M504.8 147.0Q503.2 80.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="64.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Use state events</text><text x="747.5" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">delta events are harder to reconcile and more likely to diverge;</text><text x="747.5" y="108.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">state events are simpler to read, process and integrate (Chapter 5)</text><path d="M11.1 159.0L990.3 160.4L990.5 348.8L9.4 351.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 159.4Q500.0 161.4 991.6 159.4M9.6 160.2Q500.0 160.6 990.5 160.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 159.2Q991.9 254.8 990.3 350.5M991.1 157.5Q988.6 254.0 989.8 350.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 349.6Q499.5 351.6 8.0 350.0M992.1 349.3Q500.2 348.6 8.4 349.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 351.3Q12.0 255.2 10.1 159.1M9.5 352.4Q9.6 255.1 10.0 157.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="228.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Expose eventual consistency in the response (like &#x27;please wait to confirm, do not refresh&#x27;)</text><text x="500.0" y="250.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">halt serving when lag exceeds a threshold: reply 503 Service Unavailable, maybe with Retry-After based on throughput</text><text x="500.0" y="272.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">serve stale data with a stale marker and let the client choose to continue or wait</text><text x="500.0" y="294.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">provide a callback API: register and be called when no longer lagging (client blocks or context-switches; you buffer callbacks and publish SLAs)</text><path d="M9.3 365.1L496.1 365.8L496.1 541.1L9.7 538.8Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 365.8Q252.1 367.0 495.6 365.5M7.6 365.4Q251.9 367.4 496.1 365.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 363.1Q496.3 452.4 495.5 541.8M495.0 364.0Q495.6 452.3 494.1 540.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 540.4Q253.1 539.3 9.3 539.1M496.7 540.0Q252.5 538.7 8.3 539.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 542.0Q11.5 452.2 10.3 362.5M11.0 541.4Q12.1 452.9 9.0 364.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="414.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Detecting lag</text><text x="252.5" y="436.5" font-size="14.5" fill="#3b2f20" text-anchor="middle">event time since the last event works for high-frequency streams</text><text x="252.5" y="458.5" font-size="13.5" fill="#3b2f20" text-anchor="middle">(thousands of clicks a second, 10 s of silence is suspicious) but fails</text><text x="252.5" y="480.5" font-size="14.5" fill="#3b2f20" text-anchor="middle">for slow entity streams (a user entity may be silent for days yet</text><text x="252.5" y="502.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">converged): rely on consumer offsets</text><path d="M504.1 364.1L989.6 364.3L989.6 540.2L504.4 540.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 364.3Q747.3 366.0 991.8 364.3M504.1 364.1Q747.6 367.8 991.2 365.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 364.4Q992.1 452.9 989.4 541.3M990.1 363.9Q990.8 452.7 990.0 541.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 540.6Q747.7 539.2 503.1 539.5M992.5 539.0Q747.7 539.8 502.9 539.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 541.0Q505.9 452.4 506.0 363.7M505.3 540.5Q505.2 451.8 504.6 363.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="414.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Avoid and prevent</text><text x="747.5" y="436.5" font-size="13.5" fill="#3b2f20" text-anchor="middle">avoid direct calls: build a new service that materialises both streams</text><text x="747.5" y="458.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">(drivers and trucks) and query it; assume failures (crashes, network,</text><text x="747.5" y="480.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">broker, cloud storage); DevOps, monitoring, scaling and testing; keep</text><text x="747.5" y="502.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">producers and consumers writing and reading without lag</text></svg>