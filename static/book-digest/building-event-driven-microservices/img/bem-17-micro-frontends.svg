<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 205.3L10.7 204.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 109.7 330.0 206.2M329.9 12.9Q331.9 109.5 330.3 206.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 204.4Q170.1 207.2 8.7 204.5M331.4 204.7Q169.6 203.2 7.8 205.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Monolithic backend</text><text x="170.0" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">separate frontend and backend teams</text><text x="170.0" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">linked by an API; changes cross team</text><text x="170.0" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and technology boundaries; headcount</text><text x="170.0" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">grows with the monolith</text><path d="M339.1 14.9L660.2 14.7L660.7 204.7L341.0 204.8Z" fill="#efe0ca" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 109.6 659.3 206.3M659.2 13.5Q658.8 109.5 660.4 205.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 204.5Q499.6 205.0 337.9 204.1M660.9 205.2Q499.4 206.3 337.9 205.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 207.1Q342.7 110.5 340.3 13.9M339.8 207.0Q338.2 110.2 339.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Microservice backend</text><text x="500.0" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">independent product services behind an</text><text x="500.0" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">aggregation layer that attracts ad hoc</text><text x="500.0" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">business logic: a tragedy of the commons</text><text x="500.0" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(everyone relies on it, no one owns it)</text><path d="M671.1 14.0L990.3 15.4L990.5 203.8L669.4 206.1Z" fill="#d6e1cf" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 109.8 990.3 205.5M991.1 12.5Q988.6 109.0 989.8 205.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 204.6Q829.5 206.6 668.0 205.0M992.1 204.3Q830.2 203.6 668.4 204.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 206.3Q672.0 110.2 670.1 14.1M669.5 207.4Q669.6 110.1 670.0 12.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Micro frontends (Fig 17-14)</text><text x="830.0" y="94.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">each business concern owns its data</text><text x="830.0" y="116.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">store, backend and frontend; modular,</text><text x="830.0" y="138.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">autonomous, independent language, code</text><text x="830.0" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and deployment</text><path d="M9.3 220.1L991.1 220.8L991.1 351.1L9.7 348.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 220.8Q499.6 222.0 990.6 220.5M7.6 220.4Q499.4 222.4 991.1 220.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 218.1Q991.3 284.9 990.5 351.8M990.0 219.0Q990.6 284.8 989.1 350.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 350.4Q500.6 349.3 9.3 349.1M991.7 350.0Q500.0 348.7 8.3 349.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 352.0Q11.5 284.7 10.3 217.5M11.0 351.4Q12.1 285.4 9.0 219.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="269.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Experience search and review app (Fig 17-15 to 17-17): v1 is one service; v2 splits search (geolocation, lat-lon distance, new store) and reviews into their own</text><text x="500.0" y="291.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">services and adds a product micro frontend that stitches them without business logic. Reviews are published as events first and re-ingested, so splitting needs no data</text><text x="500.0" y="313.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">migration; both versions read the same streams, and input streams show which context uses user events.</text><path d="M9.1 364.1L494.6 364.3L494.6 515.2L9.4 515.1Z" fill="#d6e1cf" stroke="none"/><path d="M7.7 364.3Q252.3 366.0 496.8 364.3M9.1 364.1Q252.6 367.8 496.2 365.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.0 364.4Q497.1 440.4 494.4 516.3M495.1 363.9Q495.8 440.2 495.0 516.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.4 515.6Q252.7 514.2 8.1 514.5M497.5 514.0Q252.7 514.8 7.9 514.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 516.0Q10.9 439.9 11.0 363.7M10.3 515.5Q10.2 439.3 9.6 363.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="413.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Benefits</text><text x="252.5" y="435.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">composable (spin up and turn off experiments), pluggable, independent</text><text x="252.5" y="457.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">(frameworks, release schedule, ownership), uses full-stack skills in a</text><text x="252.5" y="479.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">narrower scope</text><path d="M504.5 364.2L989.1 365.5L990.6 514.4L504.8 516.2Z" fill="#eed5cc" stroke="none"/><path d="M503.0 364.5Q747.7 361.6 992.4 365.0M502.8 365.6Q747.6 366.6 992.4 365.2" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 362.6Q989.9 440.1 990.3 517.5M990.0 363.5Q988.2 440.2 990.9 517.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 515.9Q747.6 512.3 503.9 514.2M991.4 514.3Q747.7 511.8 504.0 515.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 517.5Q508.0 440.3 504.3 363.2M504.8 517.3Q507.6 440.3 504.7 363.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="413.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Drawbacks</text><text x="747.5" y="435.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">inconsistent UI and styling (use a style guide and common library); cross-</text><text x="747.5" y="457.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">service updates are harder; varying load times or failures need graceful</text><text x="747.5" y="479.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">handling such as spinners</text></svg>