<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="470" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Requests handled directly or as events (Fig 17-10)</text><text x="252.5" y="94.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">directly: do the operation and respond; event-first: publish the request</text><text x="252.5" y="116.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">to its own stream, then materialise and process it like any event;</text><text x="252.5" y="138.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">benefits: durable audit and replay, compare request time with consumed</text><text x="252.5" y="160.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">events and postpone until earlier events are processed; cost: latency</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">User interfaces</text><text x="747.5" y="94.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">asynchronous UI frameworks keep the UI responsive; manage expectations</text><text x="747.5" y="116.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">(a 500 ms synchronous expectation versus seconds); &#x27;making reservation,</text><text x="747.5" y="138.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">please wait&#x27; spinner; decide when to push updates (impact of acting on</text><text x="747.5" y="160.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">stale state; cost of an update); make consumers idempotent to duplicates</text><path d="M11.1 219.0L990.3 220.4L990.5 448.8L9.4 451.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 219.4Q500.0 221.4 991.6 219.4M9.6 220.2Q500.0 220.6 990.5 220.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 219.2Q991.9 334.8 990.3 450.5M991.1 217.5Q988.6 334.0 989.8 450.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 449.6Q499.5 451.6 8.0 450.0M992.1 449.3Q500.2 448.6 8.4 449.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 451.3Q12.0 335.2 10.1 219.1M9.5 452.4Q9.6 335.1 10.0 217.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="286.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Newspaper publishing approval pattern (Fig 17-11 to 17-13): a populator service writes a candidate populated newspaper event (key pn_key, pdf_uri, version,</text><text x="500.0" y="308.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">page_metadata; Ex 17-6). The editor approval event (Ex 17-7) carries status awaiting_approval, approved or rejected plus rejected ads; advertiser approval events (Ex</text><text x="500.0" y="330.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">17-8) are non-entity events with the same pn_key, aggregated to decide approval. Not every human interaction needs to be an event; the populator can be a monolith that</text><text x="500.0" y="352.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">publishes through an outbox or CDC. The three streams form an auditable narrative. Later the editor and advertiser parts are split (advertiser: choose approvers, slice</text><text x="500.0" y="374.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">PDFs, public exposure and security; editor: layout, a summary of responses, suggestions); new streams: editor-approved populated newspaper (2) and the advertiser</text><text x="500.0" y="396.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">approvals summary (3, Ex 17-9: version, ad status Waiting, Approved, Rejected, Timedout). The editor controls which versions go on; ad logic stays opaque.</text></svg>