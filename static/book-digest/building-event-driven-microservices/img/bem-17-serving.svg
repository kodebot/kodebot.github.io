<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="540" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Serving from internal state (Fig 17-4 to 17-6)</text><text x="252.5" y="94.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">a load balancer routes to instances; with sharded state, route to the</text><text x="252.5" y="116.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">instance that owns the key: a key maps to one partition, a partition to one</text><text x="252.5" y="138.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">instance; apply the partitioner to the key and look up the group&#x27;s</text><text x="252.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">assignments (Kafka Streams interactive queries)</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Cost of sharding (Fig 17-7)</text><text x="747.5" y="94.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">chance of hitting the right instance first = 1 / (number of instances),</text><text x="747.5" y="116.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">so redirects and latency grow with the count; a smart load balancer applies</text><text x="747.5" y="138.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">the partitioner first but couples to state store names and topology: ship it</text><text x="747.5" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">with the service; still best-effort, instances must redirect</text><path d="M11.1 219.0L495.3 220.4L495.5 378.8L9.4 381.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 219.4Q252.5 221.4 496.6 219.4M9.6 220.2Q252.5 220.6 495.5 220.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 219.2Q496.9 299.8 495.3 380.5M496.1 217.5Q493.6 299.0 494.8 380.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 379.6Q252.0 381.6 8.0 380.0M497.1 379.3Q252.7 378.6 8.4 379.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 381.3Q12.0 300.2 10.1 219.1M9.5 382.4Q9.6 300.1 10.0 217.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="273.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Serving from external state</text><text x="252.5" y="295.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">all state reachable from each instance; no forwarding; rebalances need no</text><text x="252.5" y="317.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">rebuild; scale serving apart from storage; access state only through the</text><text x="252.5" y="339.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">service API, never directly (coupling)</text><path d="M504.3 220.1L991.1 220.8L991.1 381.1L504.7 378.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.5 220.8Q747.1 222.0 990.6 220.5M502.6 220.4Q746.9 222.4 991.1 220.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 218.1Q991.3 299.9 990.5 381.8M990.0 219.0Q990.6 299.8 989.1 380.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 380.4Q748.1 379.3 504.3 379.1M991.7 380.0Q747.5 378.7 503.3 379.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 382.0Q506.5 299.7 505.3 217.5M506.0 381.4Q507.1 300.4 504.0 219.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="273.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">All-in-one microservice (Fig 17-8)</text><text x="747.5" y="295.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">each instance processes events, writes the store and serves the API;</text><text x="747.5" y="317.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">simple, quick rebalances; wasteful for asymmetric loads (many serving</text><text x="747.5" y="339.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">instances, one processing); extra instances beyond partitions still serve</text><path d="M9.1 394.1L989.6 394.3L989.6 530.2L9.4 530.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 394.3Q499.8 396.0 991.8 394.3M9.1 394.1Q500.1 397.8 991.2 395.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 394.4Q992.1 462.9 989.4 531.3M990.1 393.9Q990.8 462.7 990.0 531.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 530.6Q500.2 529.2 8.1 529.5M992.5 529.0Q500.2 529.8 7.9 529.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 531.0Q10.9 462.4 11.0 393.7M10.3 530.5Q10.2 461.8 9.6 393.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="435.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Composite service (Fig 17-9): the API service and the event-processing service are separate but share one bounded context, one repository and one deployment. Pros:</text><text x="500.0" y="457.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">different languages and scaling policies, and failures in event processing do not take down the API (state goes stale). Cons: more complexity and risk when data</text><text x="500.0" y="479.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">structures, topologies and request patterns change, and harder end-to-end tests. Used successfully in production; needs careful deployment management and integration</text><text x="500.0" y="501.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">tests.</text></svg>