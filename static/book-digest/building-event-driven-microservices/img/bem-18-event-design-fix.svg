<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">State events: fix once (Fig 18-8 to 18-12)</text><text x="252.5" y="94.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">publish a new event with the correct data (Fig 18-10); it upserts into</text><text x="252.5" y="116.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">every materialisation and compaction cleans the old record; state events</text><text x="252.5" y="138.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">are compactable, deltas are not; fix the source database and let the CDC</text><text x="252.5" y="160.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">connector republish; a Kafka Streams app gets the eventually correct state</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Still your problem</text><text x="747.5" y="94.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">consumers must undo or compensate decisions already taken on bad data</text><text x="747.5" y="116.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">(Chapter 10); a service receiving bad data can log it, divert it to a DLQ and</text><text x="747.5" y="138.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">continue; FTP drops (Fig 18-13): a function parses partner files into</text><text x="747.5" y="160.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">inventory state events; press partners to follow a basic schema or SDK</text><path d="M11.1 219.0L990.3 220.4L990.5 393.8L9.4 396.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 219.4Q500.0 221.4 991.6 219.4M9.6 220.2Q500.0 220.6 990.5 220.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 219.2Q991.9 307.3 990.3 395.5M991.1 217.5Q988.6 306.5 989.8 395.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 394.6Q499.5 396.6 8.0 395.0M992.1 394.3Q500.2 393.6 8.4 394.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 396.3Q12.0 307.7 10.1 219.1M9.5 397.4Q9.6 307.6 10.0 217.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="280.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Build forward: undo bad deltas with new deltas (or compensate). Deltas cannot be compacted or deleted, and each is relative to the previous one, so a bad delta is a</text><text x="500.0" y="302.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">change into a bad state: there is one way to be correct and endlessly many to be wrong, some terminal (a sent package, a crushed car). Undo events may themselves</text><text x="500.0" y="324.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">contain duplicates and you must audit each consumer&#x27;s code and state; practical only for one tightly coupled consumer under the same team. Warning: deltas have no</text><text x="500.0" y="346.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">mechanism to purge data (the GDPR right to be forgotten), so keep sensitive data out.</text><path d="M9.3 410.1L991.1 410.8L991.1 551.1L9.7 548.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 410.8Q499.6 412.0 990.6 410.5M7.6 410.4Q499.4 412.4 991.1 410.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 408.1Q991.3 479.9 990.5 551.8M990.0 409.0Q990.6 479.8 989.1 550.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 550.4Q500.6 549.3 9.3 549.1M991.7 550.0Q500.0 548.7 8.3 549.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 552.0Q11.5 479.7 10.3 407.5M11.0 551.4Q12.1 480.4 9.0 409.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="475.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Compaction is a critical function for deleting bad, private and sensitive data from streams. Delta strategies left: build forward, or rewind, rebuild and retry (labour-</text><text x="500.0" y="497.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">intensive and error-prone).</text></svg>