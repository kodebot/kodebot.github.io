<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="570" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 175.3L10.7 174.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 94.7 495.0 176.2M494.9 12.9Q496.9 94.5 495.3 176.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 174.4Q252.6 177.2 8.7 174.5M496.4 174.7Q252.1 173.2 7.8 175.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 176.0Q10.0 94.3 10.1 12.7M10.2 175.9Q8.5 95.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="57.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Build versus buy</text><text x="252.5" y="79.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">legal and data on-shoring rules may force self-hosting; existing cloud</text><text x="252.5" y="101.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">precedent usually wins; the author prefers fully managed services, falling</text><text x="252.5" y="123.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">back to self-hosting only when necessary (success rests on customers, not</text><text x="252.5" y="145.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">platform building); the monthly bill hides no debugging or engineering cost</text><path d="M504.1 14.9L990.2 14.7L990.7 174.7L506.0 174.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 94.6 989.3 176.3M989.2 13.5Q988.8 94.5 990.4 175.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 174.5Q747.1 175.0 502.9 174.1M990.9 175.2Q746.9 176.3 502.9 175.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 177.1Q507.7 95.5 505.3 13.9M504.8 177.0Q503.2 95.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="57.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Infrastructure as code</text><text x="747.5" y="79.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">code that provisions brokers, registry, CMS, services: Terraform (proprietary</text><text x="747.5" y="101.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">licence, once open source), Pulumi (a Terraform fork, MPL-2.0), Ansible,</text><text x="747.5" y="123.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">Puppet, cloud-native tools; automation, reproducibility, version control,</text><text x="747.5" y="145.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">scaling, provider agnostic, aligned with DevOps; needed beyond one cluster</text><path d="M11.1 189.0L495.3 190.4L495.5 358.8L9.4 361.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 189.4Q252.5 191.4 496.6 189.4M9.6 190.2Q252.5 190.6 495.5 190.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 189.2Q496.9 274.8 495.3 360.5M496.1 187.5Q493.6 274.0 494.8 360.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 359.6Q252.0 361.6 8.0 360.0M497.1 359.3Q252.7 358.6 8.4 359.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 361.3Q12.0 275.2 10.1 189.1M9.5 362.4Q9.6 275.1 10.0 187.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="237.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Identity and access management (IAM)</text><text x="252.5" y="259.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">open source (Keycloak, Zitadel) or cloud-integrated (AWS, GCP, Azure,</text><text x="252.5" y="281.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">Cloudflare) or the streaming platform&#x27;s (Confluent); identities for people,</text><text x="252.5" y="303.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">services and groups, roles and RBAC, authentication and authorisation,</text><text x="252.5" y="325.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">encryption, regulatory needs; several IAMs often coexist</text><path d="M504.3 190.1L991.1 190.8L991.1 361.1L504.7 358.8Z" fill="#efe0ca" stroke="none"/><path d="M503.5 190.8Q747.1 192.0 990.6 190.5M502.6 190.4Q746.9 192.4 991.1 190.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 188.1Q991.3 274.9 990.5 361.8M990.0 189.0Q990.6 274.8 989.1 360.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 360.4Q748.1 359.3 504.3 359.1M991.7 360.0Q747.5 358.7 503.3 359.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 362.0Q506.5 274.7 505.3 187.5M506.0 361.4Q507.1 275.4 504.0 189.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="237.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Service-to-team assignment</text><text x="747.5" y="259.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">who owns each service: permissions for updates, deployments, rollbacks and</text><text x="747.5" y="281.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">errors; enables event-stream ownership via the single writer principle;</text><text x="747.5" y="303.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">start as a spreadsheet of service to owner, then integrate with IAM,</text><text x="747.5" y="325.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">brokers and the CMS; make it a top priority</text><path d="M9.1 374.1L989.6 374.3L989.6 560.2L9.4 560.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 374.3Q499.8 376.0 991.8 374.3M9.1 374.1Q500.1 377.8 991.2 375.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 374.4Q992.1 467.9 989.4 561.3M990.1 373.9Q990.8 467.7 990.0 561.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 560.6Q500.2 559.2 8.1 559.5M992.5 559.0Q500.2 559.8 7.9 559.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 561.0Q10.9 467.4 11.0 373.7M10.3 560.5Q10.2 466.8 9.6 373.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="440.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Stream creation: services may create their own internal streams and choose partition count, retention and replication factor (a critical stream: infinite retention,</text><text x="500.0" y="462.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">high replication; a high-volume low-value stream: many partitions, low replication, short retention); ownership is assigned at creation. Metadata tags (Apache Atlas,</text><text x="500.0" y="484.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Amundsen, OpenMetadata, all Apache 2.0): stream owner, PII (restrict until the owner approves), financial, namespace (hide streams outside a bounded context),</text><text x="500.0" y="506.5" font-size="13.5" fill="#3b2f20" text-anchor="middle">deprecation (block new subscribers, notify the owner when no consumers remain, then delete), and custom tags. Only the owning team edits tags.</text></svg>