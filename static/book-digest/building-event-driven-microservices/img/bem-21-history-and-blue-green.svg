<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="540" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 215.3L10.7 214.2Z" fill="#efe0ca" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 114.7 495.0 216.2M494.9 12.9Q496.9 114.5 495.3 216.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 214.4Q252.6 217.2 8.7 214.5M496.4 214.7Q252.1 213.2 7.8 215.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 216.0Q10.0 114.3 10.1 12.7M10.2 215.9Q8.5 115.1 9.1 14.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Reprocessing historical data</text><text x="252.5" y="99.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">often enough to write new events in the new format, especially for time-limited</text><text x="252.5" y="121.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">streams; entity streams usually need migrating so consumers have one source of</text><text x="252.5" y="143.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">truth (converting once avoids bad data from each consumer); migrate entities, not</text><text x="252.5" y="165.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">old interaction events; consumers may fail to migrate and cannot fall back</text><path d="M504.1 14.9L990.2 14.7L990.7 214.7L506.0 214.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 114.6 989.3 216.3M989.2 13.5Q988.8 114.5 990.4 215.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 214.5Q747.1 215.0 502.9 214.1M990.9 215.2Q746.9 216.3 502.9 215.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 217.1Q507.7 115.5 505.3 13.9M504.8 217.0Q503.2 115.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="77.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Two ways to rebuild</text><text x="747.5" y="99.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">from the producer&#x27;s internal state stores: iterate and write the entities in the</text><text x="747.5" y="121.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">new schema once (or snapshot via a connector); or from upstream streams: rewind and</text><text x="747.5" y="143.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">reprocess inputs (possibly with broker-durable state); test the migration in a</text><text x="747.5" y="165.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">generated environment; synchronised migrations are rare but sometimes unavoidable</text><path d="M11.1 229.0L495.3 230.4L495.5 428.8L9.4 431.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 229.4Q252.5 231.4 496.6 229.4M9.6 230.2Q252.5 230.6 495.5 230.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 229.2Q496.9 329.8 495.3 430.5M496.1 227.5Q493.6 329.0 494.8 430.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 429.6Q252.0 431.6 8.0 430.0M497.1 429.3Q252.7 428.6 8.4 429.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 431.3Q12.0 330.2 10.1 229.1M9.5 432.4Q9.6 330.1 10.0 227.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="292.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Blue-green (Fig 21-6)</text><text x="252.5" y="314.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">blue (new) runs beside green (old) with its own data store, consumer group and</text><text x="252.5" y="336.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">addresses; once blue has caught up, a router sends a few requests, then more, then</text><text x="252.5" y="358.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">all; green idles for a cooldown so traffic can switch back; mostly for</text><text x="252.5" y="380.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">request-response services; include monitoring and alerting</text><path d="M504.3 230.1L991.1 230.8L991.1 431.1L504.7 428.8Z" fill="#eed5cc" stroke="none"/><path d="M503.5 230.8Q747.1 232.0 990.6 230.5M502.6 230.4Q746.9 232.4 991.1 230.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 228.1Q991.3 329.9 990.5 431.8M990.0 229.0Q990.6 329.8 989.1 430.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 430.4Q748.1 429.3 504.3 429.1M991.7 430.0Q747.5 428.7 503.3 429.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 432.0Q506.5 329.7 505.3 227.5M506.0 431.4Q507.1 330.4 504.0 229.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="303.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Blue-green caution</text><text x="747.5" y="325.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">with event streams beware asynchronous materialisation and two consumer groups;</text><text x="747.5" y="347.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">do not let both write to a common output stream (overwrites, duplicates): prefer</text><text x="747.5" y="369.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a rolling update or full-stop deployment there</text><path d="M9.1 444.1L989.6 444.3L989.6 530.2L9.4 530.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 444.3Q499.8 446.0 991.8 444.3M9.1 444.1Q500.1 447.8 991.2 445.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 444.4Q991.5 487.9 989.4 531.3M990.1 443.9Q990.6 487.7 990.0 531.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 530.6Q500.2 529.2 8.1 529.5M992.5 529.0Q500.2 529.8 7.9 529.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 531.0Q10.9 487.4 11.0 443.7M10.3 530.5Q10.2 486.8 9.6 443.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="482.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Summary: pay the microservice tax in deployment and monitoring, delegate deployment to owning teams with supportive tooling, rely on CI and the CMS; full-stop is</text><text x="500.0" y="504.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">simplest but can cause downtime, other patterns trade off.</text></svg>