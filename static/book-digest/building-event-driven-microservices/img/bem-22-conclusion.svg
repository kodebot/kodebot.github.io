<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 165.3L10.7 164.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 89.7 495.0 166.2M494.9 12.9Q496.9 89.5 495.3 166.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 164.4Q252.6 167.2 8.7 164.5M496.4 164.7Q252.1 163.2 7.8 165.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 166.0Q10.0 89.3 10.1 12.7M10.2 165.9Q8.5 90.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="52.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Data communication structure</text><text x="252.5" y="74.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">the broker stores events resiliently and is agnostic to business logic; producers</text><text x="252.5" y="96.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">stop serving custom queries; consumers use their own logic, processing and storage;</text><text x="252.5" y="118.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">ownership and production of data decouple from access; a failed instance only</text><text x="252.5" y="140.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">delays new data</text><path d="M504.1 14.9L990.2 14.7L990.7 164.7L506.0 164.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 89.6 989.3 166.3M989.2 13.5Q988.8 89.5 990.4 165.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 164.5Q747.1 165.0 502.9 164.1M990.9 165.2Q746.9 166.3 502.9 165.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 167.1Q507.7 90.5 505.3 13.9M504.8 167.0Q503.2 90.2 504.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="52.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Bounded contexts and the microservice tax</text><text x="747.5" y="74.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">align services on business bounded contexts (several services for a large one);</text><text x="747.5" y="96.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">the tax: broker and streams, schema registry and metadata, access control, CMS,</text><text x="747.5" y="118.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">CI/CD, monitoring and logging; not all-or-nothing, start with a broker or a CMS;</text><text x="747.5" y="140.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">no award for the most (or the fewest) services</text><path d="M11.1 179.0L495.3 180.4L495.5 328.8L9.4 331.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 179.4Q252.5 181.4 496.6 179.4M9.6 180.2Q252.5 180.6 495.5 180.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 179.2Q496.9 254.8 495.3 330.5M496.1 177.5Q493.6 254.0 494.8 330.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 329.6Q252.0 331.6 8.0 330.0M497.1 329.3Q252.7 328.6 8.4 329.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 331.3Q12.0 255.2 10.1 179.1M9.5 332.4Q9.6 255.1 10.0 177.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="217.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event design and schemas</text><text x="252.5" y="239.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">state events (primary key, copartitioning, compaction, ECST), delta events (not</text><text x="252.5" y="261.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">compactable; event sourcing inside a context), hybrid (a compromise at a cost);</text><text x="252.5" y="283.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">denormalise for stream joins; schemas, evolution, field-level encryption, value</text><text x="252.5" y="305.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">constraints, code generation, registry-based discovery</text><path d="M504.3 180.1L991.1 180.8L991.1 331.1L504.7 328.8Z" fill="#efe0ca" stroke="none"/><path d="M503.5 180.8Q747.1 182.0 990.6 180.5M502.6 180.4Q746.9 182.4 991.1 180.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 178.1Q991.3 254.9 990.5 331.8M990.0 179.0Q990.6 254.8 989.1 330.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 330.4Q748.1 329.3 504.3 329.1M991.7 330.0Q747.5 328.7 503.3 329.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 332.0Q506.5 254.7 505.3 177.5M506.0 331.4Q507.1 255.4 504.0 179.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="217.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Liberation and implementation options</text><text x="747.5" y="239.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">liberate the most commonly used, most critical data first; compose new services</text><text x="747.5" y="261.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">from streams; lightweight frameworks have the most out of the box; heavyweight need</text><text x="747.5" y="283.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a cluster (Kubernetes integration growing); BPC is basic (no event scheduling);</text><text x="747.5" y="305.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">FaaS streamlines management and scaling (orchestrators vary by provider)</text><path d="M9.1 344.1L494.6 344.3L494.6 545.2L9.4 545.1Z" fill="#d6e1cf" stroke="none"/><path d="M7.7 344.3Q252.3 346.0 496.8 344.3M9.1 344.1Q252.6 347.8 496.2 345.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.0 344.4Q497.1 445.4 494.4 546.3M495.1 343.9Q495.8 445.2 495.0 546.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.4 545.6Q252.7 544.2 8.1 544.5M497.5 544.0Q252.7 544.8 7.9 544.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 546.0Q10.9 444.9 11.0 343.7M10.3 545.5Q10.2 444.3 9.6 343.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="407.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Testing</text><text x="252.5" y="429.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">compose events to cover cases (order, timestamps, partitions, contents) from the</text><text x="252.5" y="451.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">schemas; local tests with a broker in the test or in a container; simulate load,</text><text x="252.5" y="473.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">races, outages; a temporary broker populated with production copies for smoke and</text><text x="252.5" y="495.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">performance tests, then discarded</text><path d="M504.5 344.2L989.1 345.5L990.6 544.4L504.8 546.2Z" fill="#d3dbe0" stroke="none"/><path d="M503.0 344.5Q747.7 341.6 992.4 345.0M502.8 345.6Q747.6 346.6 992.4 345.2" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 342.6Q989.9 445.1 990.3 547.5M990.0 343.5Q988.2 445.2 990.9 547.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 545.9Q747.6 542.3 503.9 544.2M991.4 544.3Q747.7 541.8 504.0 545.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 547.5Q508.0 445.3 504.3 343.2M504.8 547.3Q507.6 445.3 504.7 343.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="407.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Deploying and final words</text><text x="747.5" y="429.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">owner-driven deploy and rollback via CI/CD; weigh SLAs, state rebuilds and</text><text x="747.5" y="451.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">reconsumption (millions or billions of events, quotas); an alternative to blue-</text><text x="747.5" y="473.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">green: a thin always-on serving layer with a swappable backend; the broker as</text><text x="747.5" y="495.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">single source of truth gives compositional, decoupled, resilient services</text></svg>