<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><rect x="20" y="15" width="440" height="440" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Three tiers, teams grouped by skill</text><rect x="50" y="70" width="380" height="66" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="240.0" y="98.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">UI team</text><text x="240.0" y="118.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">show the genre choice</text><rect x="50" y="170" width="380" height="66" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="240.0" y="198.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Backend team</text><text x="240.0" y="218.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">expose and change the genre</text><line x1="240" y1="136" x2="240" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="270" width="380" height="66" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="240.0" y="298.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Database team</text><text x="240.0" y="318.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">accept the new value</text><line x1="240" y1="236" x2="240" y2="270" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="240" y="385" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">one small change crosses all three teams and must</text><text x="240" y="403" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">be deployed in order: high cohesion of technology,</text><text x="240" y="421" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">low cohesion of business functionality</text><rect x="490" y="15" width="490" height="440" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="512" y="49" font-size="16" font-weight="700" fill="#14324f">Vertical slice by business domain</text><rect x="510" y="70" width="270" height="240" rx="12" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="524" y="94" font-size="15" font-weight="700" fill="#134a26" text-anchor="start">Customer microservice</text><text x="524" y="113" font-size="12" font-weight="400" fill="#134a26" text-anchor="start">owned by the customer profile team</text><rect x="530" y="130" width="230" height="44" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="645.0" y="157.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">UI slice</text><rect x="530" y="185" width="230" height="44" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="645.0" y="212.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Application logic</text><rect x="530" y="240" width="230" height="44" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="645.0" y="267.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Customer data</text><rect x="810" y="90" width="150" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="885.0" y="113.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Catalog</text><text x="885.0" y="133.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">microservice</text><line x1="810" y1="118" x2="780" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="795" y="82" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">genres</text><rect x="810" y="200" width="150" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="885.0" y="220.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Recommendation</text><text x="885.0" y="240.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">microservice</text><text x="885.0" y="260.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">(later release)</text><line x1="810" y1="240" x2="780" y2="225" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="735" y="350" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a stream-aligned team owns an end-to-end slice</text><text x="735" y="368" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">of user-facing functionality, with few hand-offs</text></svg>