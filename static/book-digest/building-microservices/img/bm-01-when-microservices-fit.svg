<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="360" fill="#ffffff"/><rect x="20" y="15" width="440" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Tips away from microservices</text><rect x="50" y="65" width="380" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="240.0" y="95.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">New product or startup</text><text x="240.0" y="115.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">domain still changing, boundaries move</text><rect x="50" y="153" width="380" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="240.0" y="183.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Small team</text><text x="240.0" y="203.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">the microservice tax takes scarce people</text><rect x="50" y="241" width="380" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="240.0" y="271.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Software customers deploy</text><text x="240.0" y="291.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">they must run your 20 pods</text><rect x="490" y="15" width="490" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="512" y="49" font-size="16" font-weight="700" fill="#14324f">Tips toward microservices</text><rect x="520" y="65" width="430" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="735.0" y="95.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Many developers, one system</text><text x="735.0" y="115.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">less delivery contention</text><rect x="520" y="153" width="430" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="735.0" y="183.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">SaaS run 24-7</text><text x="735.0" y="203.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">independent release and scaling</text><rect x="520" y="241" width="430" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="735.0" y="271.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Cloud and new channels</text><text x="735.0" y="291.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">match services to platforms</text><text x="490" y="352" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a default choice must be justified by the problem: monoliths are a valid, sensible default</text></svg>