<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="380" fill="#ffffff"/><rect x="20" y="15" width="440" height="350" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Aggregates and cross-service references</text><rect x="50" y="70" width="150" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="125.0" y="93.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Customer</text><text x="125.0" y="113.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">aggregate</text><rect x="260" y="55" width="170" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="345.0" y="82.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Order</text><rect x="260" y="115" width="170" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="345.0" y="142.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Wishlist</text><line x1="200" y1="90" x2="260" y2="77" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="200" y1="105" x2="260" y2="137" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="240" y="210" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">one aggregate lives in one microservice;</text><text x="240" y="228" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a service may own several aggregates</text><rect x="50" y="260" width="160" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="130.0" y="283.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Finance service</text><text x="130.0" y="303.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">CustID: 42 (implicit)</text><rect x="260" y="260" width="170" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="345.0" y="293.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Customer service</text><line x1="210" y1="288" x2="260" y2="288" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="490" y="15" width="470" height="350" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="512" y="49" font-size="16" font-weight="700" fill="#14324f">Make the reference explicit</text><rect x="520" y="70" width="410" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="725.0" y="93.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Finance service stores a URI</text><text x="725.0" y="113.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">e.g. a customer URL in a REST system</text><rect x="520" y="160" width="410" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="725.0" y="183.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Pseudo-URI scheme (SoundCloud)</text><text x="725.0" y="203.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">soundcloud:tracks:123</text><text x="725" y="260" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the relationship is visible, can be dereferenced,</text><text x="725" y="280" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">and can drive cross-service lookup code</text></svg>