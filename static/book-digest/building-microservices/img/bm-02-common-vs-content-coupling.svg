<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="420" fill="#ffffff"/><rect x="20" y="15" width="470" height="390" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Order service owns the state</text><rect x="40" y="70" width="140" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="110.0" y="103.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Order Processor</text><rect x="40" y="170" width="140" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="110.0" y="203.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Warehouse</text><rect x="300" y="110" width="160" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="380.0" y="140.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Order service</text><text x="380.0" y="160.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">source of truth</text><line x1="180" y1="98" x2="300" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="240" y="100" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">request</text><line x1="180" y1="198" x2="300" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="240" y="205" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">request</text><rect x="300" y="230" width="160" height="50" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="380.0" y="260.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Order data</text><line x1="380" y1="180" x2="380" y2="230" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="255" y="320" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a request can be rejected: PLACED to PICKING</text><text x="255" y="340" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">is refused; one owner enforces valid transitions</text><rect x="510" y="15" width="470" height="390" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="532" y="49" font-size="16" font-weight="700" fill="#14324f">Content coupling (avoid)</text><rect x="530" y="70" width="140" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="600.0" y="103.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Order Processor</text><rect x="530" y="170" width="140" height="56" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="600.0" y="203.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Warehouse</text><rect x="790" y="110" width="160" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="870.0" y="140.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Order service</text><text x="870.0" y="160.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">bypassed</text><line x1="670" y1="98" x2="790" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="790" y="230" width="160" height="50" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="870.0" y="260.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Order table</text><line x1="670" y1="198" x2="790" y2="255" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="720" y="215" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">writes directly</text><line x1="870" y1="180" x2="870" y2="230" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="745" y="320" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the table becomes part of the contract: logic is duplicated,</text><text x="745" y="340" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">internals exposed, information hiding lost</text></svg>