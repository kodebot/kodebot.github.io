<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" width="980" height="230" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="230" fill="#ffffff"/><rect x="20" y="50" width="150" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="95.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">PLACED</text><rect x="220" y="50" width="150" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="295.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">PAID</text><rect x="420" y="50" width="150" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="495.0" y="83.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">PICKING</text><rect x="620" y="50" width="150" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="695.0" y="83.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">SHIPPED</text><rect x="820" y="50" width="150" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="895.0" y="83.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">COMPLETED</text><line x1="170" y1="78.0" x2="220" y2="78.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="370" y1="78.0" x2="420" y2="78.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="570" y1="78.0" x2="620" y2="78.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="770" y1="78.0" x2="820" y2="78.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="140" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">an order state machine (illustrative): PLACED to PAID is allowed, PLACED to PICKING is not</text><text x="490" y="165" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">Order Processor sets PLACED, PAID, COMPLETED; Warehouse sets PICKING, SHIPPED</text><text x="490" y="190" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a state machine stops invalid transitions: one service should own it</text></svg>