<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Start: wishlist code and data both in the monolith</text><rect x="20" y="40" width="300" height="70" rx="12" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="34" y="64" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Monolith</text><rect x="40" y="70" width="120" height="30" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="100.0" y="90.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Wishlist code</text><rect x="180" y="70" width="120" height="30" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="240.0" y="90.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Wishlist data</text><text x="20" y="150" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Code first (most common)</text><rect x="20" y="165" width="140" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="90.0" y="190.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Wishlist</text><text x="90.0" y="210.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">microservice</text><rect x="200" y="160" width="220" height="70" rx="12" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="214" y="184" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Monolith</text><rect x="220" y="190" width="180" height="30" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="310.0" y="210.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Wishlist data stays</text><line x1="160" y1="195" x2="200" y2="195" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="180.0" y="185" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">reads data</text><text x="560" y="200" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">quick short-term benefit; can abort if code cannot</text><text x="560" y="220" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">be extracted; but check the data is movable first</text><text x="20" y="290" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Data first (less common)</text><rect x="20" y="305" width="220" height="70" rx="12" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="34" y="329" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Monolith</text><rect x="40" y="335" width="180" height="30" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="130.0" y="355.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Wishlist code stays</text><rect x="300" y="305" width="140" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="370.0" y="330.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Wishlist</text><text x="370.0" y="350.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">tables moved</text><line x1="240" y1="335" x2="300" y2="335" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="270.0" y="325" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">reads data</text><text x="560" y="340" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">de-risks the full extraction: faces lost data integrity</text><text x="560" y="360" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">and cross-data transactions up front</text><text x="500" y="450" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">also consider the UI: decomposition of the UI tends to lag the backend, but do not let it lag too much</text></svg>