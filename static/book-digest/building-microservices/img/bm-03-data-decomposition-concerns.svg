ht="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="610.0" y="73.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Transactions</text><text x="610.0" y="93.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">no ACID across databases</text><rect x="500" y="170" width="220" height="76" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="610.0" y="203.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Coping pattern</text><text x="610.0" y="223.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">sagas, not 2PC</text><line x1="610" y1="116" x2="610" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="740" y="40" width="220" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="850.0" y="73.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Tooling</text><text x="850.0" y="93.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">little schema refactoring support</text><rect x="740" y="170" width="220" height="76" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="850.0" y="203.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Coping pattern</text><text x="850.0" y="223.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">delta scripts: Flyway, Liquibase</text><line x1="850" y1="116" x2="850" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="290" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">splitting a database buys new problems: learn to cope rather than expect the old guarantees</text></svg>