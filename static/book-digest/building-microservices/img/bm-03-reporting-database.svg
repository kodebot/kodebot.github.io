<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="340" fill="#ffffff"/><rect x="20" y="110" width="200" height="90" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="120.0" y="150.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Microservice</text><text x="120.0" y="170.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">owns internal state</text><rect x="300" y="60" width="200" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="400.0" y="95.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Internal storage</text><text x="400.0" y="115.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">hidden</text><rect x="300" y="190" width="220" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="410.0" y="220.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Reporting database</text><text x="410.0" y="240.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">minimal subset, schema</text><text x="410.0" y="260.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">tailored to consumers</text><line x1="220" y1="135" x2="300" y2="100" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="220" y1="175" x2="300" y2="225" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="240" y="225" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">pushes data</text><rect x="640" y="110" width="160" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="720.0" y="135.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Consumers</text><text x="720.0" y="155.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">ad hoc SQL, joins,</text><text x="720.0" y="175.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">existing tools</text><line x1="520" y1="235" x2="640" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="800" y="280" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the microservice owner maintains this endpoint&#x27;s</text><text x="800" y="298" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">compatibility like any other contract</text></svg>