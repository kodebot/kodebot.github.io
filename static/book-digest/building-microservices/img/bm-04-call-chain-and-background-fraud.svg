<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">A chain of blocking calls</text><rect x="20" y="45" width="170" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="105.0" y="70.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Order</text><text x="105.0" y="90.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">Processor</text><rect x="250" y="45" width="170" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="335.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Payment</text><rect x="480" y="45" width="170" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="565.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Fraud</text><text x="565.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Detection</text><rect x="710" y="45" width="170" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="795.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Customer</text><line x1="190" y1="75.0" x2="250" y2="75.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="420" y1="75.0" x2="480" y2="75.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="650" y1="75.0" x2="710" y2="75.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="20" y="150" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">every service and network hop is on the critical path; connections stay open all along the chain</text><text x="20" y="205" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Shorter: fraud detection moved to a background process</text><rect x="20" y="222" width="170" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="105.0" y="247.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Order</text><text x="105.0" y="267.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">Processor</text><rect x="250" y="222" width="170" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="335.0" y="257.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Payment</text><line x1="190" y1="252.0" x2="250" y2="252.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="560" y="215" width="200" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="660.0" y="240.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Fraud Detection</text><text x="660.0" y="260.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">background, in parallel</text><rect x="800" y="215" width="170" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="885.0" y="250.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Customer</text><line x1="760" y1="245" x2="800" y2="245" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="660" y1="275" x2="330" y2="285" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="500" y="300" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">flags customers; checked earlier</text><text x="20" y="350" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">shorter chain: lower latency, one fewer dependency on a critical flow</text></svg>