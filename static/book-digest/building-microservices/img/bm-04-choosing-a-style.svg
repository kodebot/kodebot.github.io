<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="430" fill="#ffffff"/><rect x="20" y="160" width="200" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="120.0" y="195.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Do I need the result</text><text x="120.0" y="215.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">before I can carry on?</text><rect x="330" y="40" width="210" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="435.0" y="70.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Request-response</text><text x="435.0" y="90.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">then sync or async</text><line x1="220" y1="180" x2="330" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="275" y="125" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><rect x="330" y="160" width="210" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="435.0" y="190.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Broadcast a fact,</text><text x="435.0" y="210.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">invert intent</text><line x1="220" y1="200" x2="330" y2="195" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="275" y="175" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">no: facts</text><rect x="330" y="280" width="210" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="435.0" y="310.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Large data or legacy</text><text x="435.0" y="330.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">systems: common data</text><line x1="220" y1="220" x2="330" y2="315" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="270" y="275" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">no: bulk</text><rect x="630" y="40" width="340" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="800.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Choose sync when simple or familiar;</text><text x="800.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">async for long-running or long chains</text><line x1="540" y1="75" x2="630" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="630" y="160" width="340" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="800.0" y="190.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Loose coupling wins, but expect</text><text x="800.0" y="210.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">more complexity: monitor, correlation IDs</text><line x1="540" y1="195" x2="630" y2="195" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="630" y="280" width="340" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="800.0" y="310.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Simple tech, high volume, high latency</text><text x="800.0" y="330.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">tolerance; low-latency needs streaming</text><line x1="540" y1="315" x2="630" y2="315" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="400" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">an architecture usually mixes all of these, even inside one microservice (an Order service with an API and events)</text></svg>