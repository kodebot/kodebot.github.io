<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="300" fill="#ffffff"/><rect x="20" y="110" width="190" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="115.0" y="140.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">New Product</text><text x="115.0" y="160.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">Importer</text><rect x="300" y="110" width="170" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="385.0" y="140.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">File or data store</text><text x="385.0" y="160.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">persistent location</text><line x1="210" y1="145" x2="300" y2="145" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="255.0" y="135" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">writes</text><rect x="580" y="40" width="170" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="665.0" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Inventory</text><rect x="580" y="190" width="170" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="665.0" y="225.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Catalog</text><line x1="580" y1="70" x2="470" y2="130" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="520" y="88" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">polls</text><line x1="580" y1="220" x2="470" y2="160" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="520" y="215" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">polls</text><text x="800" y="120" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">unidirectional flow is easier to reason about;</text><text x="800" y="140" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">a shared read-write database is common coupling</text><text x="490" y="285" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">best for large volumes and for restricted or legacy systems; poor for low latency</text></svg>