<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="360" fill="#ffffff"/><rect x="20" y="15" width="460" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">In-process call</text><rect x="500" y="15" width="460" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="522" y="49" font-size="16" font-weight="700" fill="#14324f">Inter-process call</text><rect x="40" y="60" width="420" height="75" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="250.0" y="92.5" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Performance</text><text x="250.0" y="112.5" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">inlined, no real cost; data passed by pointer</text><rect x="520" y="60" width="420" height="75" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="730.0" y="92.5" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Performance</text><text x="730.0" y="112.5" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">packets sent, milliseconds; data serialised and deserialised</text><rect x="40" y="155" width="420" height="75" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="250.0" y="187.5" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Changing interfaces</text><text x="250.0" y="207.5" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">caller and callee ship together, atomic</text><rect x="520" y="155" width="420" height="75" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="730.0" y="187.5" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Changing interfaces</text><text x="730.0" y="207.5" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">separately deployable: lockstep or phased rollout</text><rect x="40" y="250" width="420" height="75" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="250.0" y="282.5" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Errors</text><text x="250.0" y="302.5" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">mostly deterministic, expected or catastrophic</text><rect x="520" y="250" width="420" height="75" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="730.0" y="282.5" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Errors</text><text x="730.0" y="302.5" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">timeouts, crashes, omissions, wrong or late responses</text></svg>