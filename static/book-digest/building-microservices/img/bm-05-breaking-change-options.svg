<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="300" fill="#ffffff"/><rect x="20" y="110" width="190" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="115.0" y="150.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">v1 consumers</text><rect x="20" y="200" width="190" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="115.0" y="240.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">v2 consumers</text><rect x="300" y="110" width="210" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="405.0" y="140.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Coexisting versions</text><text x="405.0" y="160.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">router + two services</text><line x1="210" y1="145" x2="300" y2="145" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="600" y="30" width="380" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="790.0" y="60.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Lockstep: change all consumers together</text><text x="790.0" y="80.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">breaks independent deployability</text><rect x="600" y="120" width="380" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="790.0" y="150.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Coexist versions: two deployments</text><text x="790.0" y="170.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">bug fixes twice, routing smarts, shared data</text><rect x="600" y="210" width="380" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="790.0" y="240.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Emulate old interface (preferred)</text><text x="790.0" y="260.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">one service, /v1 and /v2, expand and contract</text></svg>