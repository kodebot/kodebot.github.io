<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Expand and contract</text><rect x="20" y="45" width="210" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="125.0" y="78.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">1 Expand</text><text x="125.0" y="98.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">old and new endpoint</text><rect x="275" y="45" width="210" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="380.0" y="78.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">2 Migrate</text><text x="380.0" y="98.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">consumers move to new</text><rect x="530" y="45" width="210" height="76" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="635.0" y="78.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">3 Track</text><text x="635.0" y="98.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">logs and client IDs</text><rect x="785" y="45" width="210" height="76" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="890.0" y="78.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">4 Contract</text><text x="890.0" y="98.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">remove old endpoint</text><line x1="230" y1="83.0" x2="275" y2="83.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="485" y1="83.0" x2="530" y2="83.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="740" y1="83.0" x2="785" y2="83.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="20" y="190" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Social contract: agree up front</text><rect x="20" y="205" width="460" height="46" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="250.0" y="233.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">How is the need to change raised?</text><rect x="500" y="205" width="460" height="46" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="730.0" y="233.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">How do teams agree the new shape?</text><rect x="20" y="263" width="460" height="46" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="250.0" y="291.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Who updates the consumers?</text><rect x="500" y="263" width="460" height="46" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="730.0" y="291.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">How long until the old interface goes?</text></svg>