<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><rect x="20" y="15" width="450" height="300" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">REST: one resource, common verbs</text><rect x="40" y="70" width="190" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="135.0" y="105.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Client</text><rect x="270" y="60" width="180" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="360.0" y="95.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">/customer</text><text x="360.0" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">resource</text><line x1="230" y1="90" x2="270" y2="90" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="250.0" y="80" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">POST creates</text><line x1="270" y1="120" x2="230" y2="120" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="250.0" y="135" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">GET retrieves</text><text x="245" y="200" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">verbs behave the same on all resources;</text><text x="245" y="220" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">caches, proxies and HTTP security reused</text><rect x="510" y="15" width="450" height="300" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="532" y="49" font-size="16" font-weight="700" fill="#14324f">RPC: a method per operation</text><rect x="530" y="70" width="190" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="625.0" y="105.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Client stub</text><rect x="760" y="60" width="180" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="850.0" y="85.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Server stub</text><text x="850.0" y="105.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">findCustomer</text><text x="850.0" y="125.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">createCustomer</text><line x1="720" y1="100" x2="760" y2="100" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="735" y="200" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">remote call looks local; binary stubs</text><text x="735" y="220" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">can force lockstep releases</text></svg>