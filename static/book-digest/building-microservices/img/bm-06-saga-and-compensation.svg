<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Order fulfilment saga (steps in different services)</text><rect x="20" y="45" width="210" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="125.0" y="78.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Reserve stock</text><text x="125.0" y="98.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Warehouse</text><rect x="275" y="45" width="210" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="380.0" y="78.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Take payment</text><text x="380.0" y="98.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Payment Gateway</text><rect x="530" y="45" width="210" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="635.0" y="78.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Award points</text><text x="635.0" y="98.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Loyalty</text><rect x="785" y="45" width="210" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="890.0" y="78.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Package and</text><text x="890.0" y="98.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">dispatch (Warehouse)</text><line x1="230" y1="83.0" x2="275" y2="83.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="485" y1="83.0" x2="530" y2="83.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="740" y1="83.0" x2="785" y2="83.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="20" y="175" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Item not found at packaging: run compensating transactions backwards</text><rect x="20" y="195" width="210" height="60" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="125.0" y="230.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Cancel points</text><rect x="275" y="195" width="210" height="60" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="380.0" y="230.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Refund payment</text><rect x="530" y="195" width="210" height="60" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="635.0" y="230.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Release stock</text><rect x="785" y="195" width="210" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="890.0" y="220.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Record aborted order</text><text x="890.0" y="240.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">and tell customer</text><line x1="230" y1="225.0" x2="275" y2="225.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="485" y1="225.0" x2="530" y2="225.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="740" y1="225.0" x2="785" y2="225.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="300" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a semantic rollback: the original steps did happen; you cannot unsend an email, so send a second one</text><text x="500" y="325" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">fail forward instead: once packed, retry dispatch (next day) and then ask a human</text></svg>