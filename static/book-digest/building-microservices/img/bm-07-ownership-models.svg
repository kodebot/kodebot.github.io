<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="330" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Ownership models (sliding scale)</text><rect x="20" y="45" width="270" height="80" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="155.0" y="80.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Strong</text><text x="155.0" y="100.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">owners make every change</text><rect x="330" y="45" width="270" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="465.0" y="80.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Weak</text><text x="465.0" y="100.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">outsiders propose, owners review</text><rect x="640" y="45" width="270" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="775.0" y="80.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Collective</text><text x="775.0" y="100.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">any developer may change</text><line x1="290" y1="85.0" x2="330" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="600" y1="85.0" x2="640" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="20" y="175" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">Tools: GitHub CODEOWNERS maps owners to directories or paths</text><text x="20" y="200" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">Rule of thumb: 20 developers or fewer can run collective ownership; more people need strong or weak</text><text x="20" y="245" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">Variation: a monorepo per team keeps most benefits without the scale problems</text></svg>