<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><rect x="20" y="15" width="300" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">One giant repo, one build</text><rect x="40" y="70" width="260" height="50" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="170.0" y="100.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Single repository</text><rect x="40" y="160" width="260" height="50" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="170.0" y="190.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">One build for everything</text><line x1="170" y1="120" x2="170" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="170" y="260" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a one-line change rebuilds all;</text><text x="170" y="280" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">unclear what to deploy; one break blocks all</text><rect x="350" y="15" width="300" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="372" y="49" font-size="16" font-weight="700" fill="#14324f">Multirepo</text><rect x="370" y="70" width="120" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="430.0" y="97.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">User repo</text><rect x="370" y="150" width="120" height="44" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="430.0" y="177.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Catalog repo</text><rect x="520" y="70" width="110" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="575.0" y="97.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">User build</text><line x1="490" y1="92" x2="520" y2="92" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="520" y="150" width="110" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="575.0" y="177.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Catalog build</text><line x1="490" y1="172" x2="520" y2="172" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="260" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">clear mapping and ownership;</text><text x="500" y="280" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">cross-repo changes need several commits</text><rect x="680" y="15" width="300" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="702" y="49" font-size="16" font-weight="700" fill="#14324f">Monorepo</text><rect x="700" y="70" width="260" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="830.0" y="90.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Single repository</text><text x="830.0" y="110.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">folders per service</text><rect x="700" y="160" width="120" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="760.0" y="187.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">User build</text><rect x="840" y="160" width="120" height="44" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="900.0" y="187.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Catalog build</text><line x1="760" y1="120" x2="760" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="900" y1="120" x2="900" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="830" y="260" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">atomic commit across services;</text><text x="830" y="280" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">needs graph build tools and ownership controls</text></svg>