<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><rect x="20" y="120" width="220" height="76" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="130.0" y="143.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Desired state</text><text x="130.0" y="163.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">e.g. 4 instances across</text><text x="130.0" y="183.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">2 data centres</text><rect x="340" y="120" width="220" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="450.0" y="153.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Platform compares</text><text x="450.0" y="173.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">desired with actual</text><rect x="660" y="120" width="220" height="76" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="770.0" y="153.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Launches or removes</text><text x="770.0" y="173.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">instances to match</text><line x1="240" y1="158" x2="340" y2="158" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="560" y1="158" x2="660" y2="158" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="770" y1="196" x2="770" y2="270" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5"/><line x1="770" y1="270" x2="450" y2="270" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5"/><line x1="450" y1="270" x2="450" y2="196" stroke="#6f8aa3" strok