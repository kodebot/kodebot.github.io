<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="340" fill="#ffffff"/><rect x="20" y="40" width="170" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="105.0" y="65.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Expenses service</text><text x="105.0" y="85.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">one function</text><rect x="250" y="40" width="430" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="465.0" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">entry point dispatches on path: /receipt, /claim, /report</text><line x1="190" y1="70" x2="250" y2="70" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="160" width="170" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="105.0" y="185.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Expenses service</text><text x="105.0" y="205.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">a function per aggregate</text><rect x="250" y="150" width="140" height="36" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="320.0" y="173.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Receipt function</text><rect x="410" y="150" width="140" height="36" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="480.0" y="173.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Claim function</text><rect x="570" y="150" width="140" height="36" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="640.0" y="173.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Report function</text><line x1="190" y1="190" x2="250" y2="168" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="245" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">keep one coarse external interface; shared database is fine while one team owns it,</text><text x="490" y="267" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">split data later if needs diverge; do not go finer than an aggregate (sagas needed)</text></svg>