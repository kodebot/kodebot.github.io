<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><rect x="20" y="15" width="960" height="370" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Kubernetes cluster</text><rect x="40" y="70" width="300" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="190.0" y="93.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Control plane</text><text x="190.0" y="113.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">schedules and manages nodes</text><rect x="40" y="150" width="600" height="215" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="62" y="184" font-size="16" font-weight="700" fill="#14324f">Nodes (physical or virtual machines)</text><rect x="60" y="195" width="170" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="145.0" y="218.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Pod</text><text x="145.0" y="238.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">your container (+ sidecar)</text><rect x="250" y="195" width="170" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="335.0" y="228.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Pod</text><rect x="440" y="195" width="170" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="525.0" y="228.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Pod</text><rect x="60" y="290" width="550" height="50" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="335.0" y="320.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Replica set: keeps N pods running (managed by a deployment)</text><rect x="680" y="195" width="270" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="815.0" y="218.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Service</text><text x="815.0" y="238.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">stable routing endpoint</text><line x1="680" y1="223" x2="610" y2="223" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="680" y="290" width="270" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="815.0" y="313.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Deployment</text><text x="815.0" y="333.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">rolling upgrades, rollbacks, scaling</text></svg>