<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="330" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Where testing happens</text><rect x="20" y="45" width="210" height="90" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="125.0" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Preproduction</text><text x="125.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">unit, service, CDC,</text><text x="125.0" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">performance</text><rect x="270" y="45" width="210" height="90" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="375.0" y="85.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Deployed, not released</text><text x="375.0" y="105.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">smoke tests</text><rect x="520" y="45" width="210" height="90" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="625.0" y="85.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Released gradually</text><text x="625.0" y="105.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">canary release</text><rect x="770" y="45" width="210" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="875.0" y="75.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Live</text><text x="875.0" y="95.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">ping checks, fake users,</text><text x="875.0" y="115.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">monitoring</text><line x1="230" y1="90.0" x2="270" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="480" y1="90.0" x2="520" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="730" y1="90.0" x2="770" y2="90.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="190" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">pre-production testing hits diminishing returns; you cannot reduce failure to zero</text><text x="480" y="215" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">optimise MTTR (fast rollback plus monitoring) as well as MTBF</text><text x="480" y="250" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">tests in production must be safe: no shipped fake orders, no tainted data</text></svg>