<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="360" fill="#ffffff"/><rect x="20" y="15" width="440" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Marick quadrant (Crispin and Gregory)</text><rect x="40" y="60" width="195" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="137.5" y="105.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Acceptance testing</text><text x="137.5" y="125.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">business facing, automated</text><rect x="245" y="60" width="195" height="100" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="342.5" y="105.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Exploratory testing</text><text x="342.5" y="125.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">business facing, manual</text><rect x="40" y="175" width="195" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="137.5" y="220.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Unit and service tests</text><text x="137.5" y="240.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">technology facing</text><rect x="245" y="175" width="195" height="100" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="342.5" y="220.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Property tests</text><text x="342.5" y="240.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">performance, robustness</text><text x="240" y="315" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">mostly preproduction validation: gates for deploying</text><rect x="500" y="15" width="460" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="522" y="49" font-size="16" font-weight="700" fill="#14324f">Cohn&#x27;s test pyramid</text><rect x="660" y="60" width="140" height="50" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="730.0" y="80.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">End-to-end</text><text x="730.0" y="100.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">few, slow, wide</text><rect x="610" y="125" width="240" height="50" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="730.0" y="145.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Service tests</text><text x="730.0" y="165.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">an order of magnitude more</text><rect x="560" y="190" width="340" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="730.0" y="210.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Unit tests</text><text x="730.0" y="230.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">most: fast, precise, cheap</text><text x="730" y="275" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">up: more scope and confidence, slower and harder to diagnose</text><text x="730" y="297" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">down: fast feedback, exact failures</text></svg>