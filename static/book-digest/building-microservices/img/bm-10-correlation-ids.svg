<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><rect x="20" y="120" width="150" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="95.0" y="145.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Gateway</text><text x="95.0" y="165.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">creates ID abc-123</text><rect x="230" y="120" width="150" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="305.0" y="150.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Streaming</text><rect x="460" y="30" width="150" height="50" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="535.0" y="50.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Payment</text><text x="535.0" y="70.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">ERROR</text><rect x="460" y="100" width="150" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="535.0" y="130.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Customer</text><rect x="460" y="170" width="150" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="535.0" y="200.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Email</text><line x1="170" y1="150" x2="230" y2="145" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="380" y1="130" x2="460" y2="55" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="380" y1="145" x2="460" y2="125" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="380" y1="160" x2="460" y2="195" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="690" y="90" width="290" height="110" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="835.0" y="130.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Every log line carries [abc-123]</text><text x="835.0" y="150.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">one query shows the whole flow</text><text x="835.0" y="170.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">clocks may skew: do not trust order</text><text x="500" y="290" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">retrofit is painful: add correlation IDs early; tracing tools can follow later</text></svg>