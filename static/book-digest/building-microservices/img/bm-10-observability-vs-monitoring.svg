<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="340" fill="#ffffff"/><rect x="20" y="15" width="460" height="310" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Monitoring and observability</text><rect x="40" y="70" width="200" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="140.0" y="90.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Monitoring</text><text x="140.0" y="110.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">an activity: watch for</text><text x="140.0" y="130.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">failures you predicted</text><rect x="260" y="70" width="200" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="360.0" y="90.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Observability</text><text x="360.0" y="110.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">a property: ask new</text><text x="360.0" y="130.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">questions of outputs</text><text x="250" y="200" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the more observable the system, the easier</text><text x="250" y="220" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">to understand what went wrong</text><rect x="500" y="15" width="460" height="310" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="522" y="49" font-size="16" font-weight="700" fill="#14324f">Everything is an event</text><rect x="520" y="70" width="420" height="50" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="730.0" y="100.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Events: metrics, logs, traces (MELT) are projections</text><rect x="520" y="150" width="130" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="585.0" y="180.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Trace</text><rect x="665" y="150" width="130" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="730.0" y="180.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Search index</text><rect x="810" y="150" width="130" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="875.0" y="180.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Aggregates</text><line x1="585" y1="120" x2="585" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="730" y1="120" x2="730" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="875" y1="120" x2="875" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="730" y="260" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">think in outputs you can interrogate, not three tool boxes</text></svg>