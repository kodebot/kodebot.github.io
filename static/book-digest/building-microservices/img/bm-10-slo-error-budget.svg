<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">SLA, SLO, SLI and the error budget</text><rect x="20" y="45" width="300" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="170.0" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">SLA</text><text x="170.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">agreement with users;</text><text x="170.0" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">bare minimum, with consequences</text><rect x="350" y="45" width="300" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="500.0" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">SLO</text><text x="500.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">what a team signs up to;</text><text x="500.0" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">may exceed SLA, may be internal</text><rect x="680" y="45" width="300" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="830.0" y="65.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">SLI</text><text x="830.0" y="85.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">measured data: response time,</text><text x="830.0" y="105.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">registrations, errors, orders</text><line x1="320" y1="80" x2="350" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="650" y1="80" x2="680" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="160" width="460" height="90" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="250.0" y="190.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Error budget</text><text x="250.0" y="210.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">99.9% over a quarter allows about 2 h 11 min of downtime</text><text x="250.0" y="230.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">budget left: take risks; budget spent: focus on reliability</text><rect x="520" y="160" width="460" height="90" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="750.0" y="190.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Semantic model (MusicCorp)</text><text x="750.0" y="210.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">customers can register; at least $20,000 sold per hour at peak;</text><text x="750.0" y="230.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">orders ship at a normal rate</text><text x="500" y="285" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">alert on SLOs and the semantic model, not on every low-level metric</text><text x="500" y="310" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">good alerts: relevant, unique, timely, prioritised, understandable, diagnostic, advisory, focusing (EEMUA)</text></svg>