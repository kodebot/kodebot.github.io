<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="320" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">NIST five functions of cybersecurity</text><rect x="20" y="45" width="170" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="105.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Identify</text><text x="105.0" y="100.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">threat modelling</text><rect x="220" y="45" width="170" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="305.0" y="80.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Protect</text><text x="305.0" y="100.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">defence in depth</text><rect x="420" y="45" width="170" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="505.0" y="80.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Detect</text><text x="505.0" y="100.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">logs, IDS</text><rect x="620" y="45" width="170" height="80" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="705.0" y="80.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Respond</text><text x="705.0" y="100.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">breach scope, comms</text><rect x="820" y="45" width="170" height="80" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="905.0" y="80.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Recover</text><text x="905.0" y="100.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">rebuild, backups</text><line x1="190" y1="85.0" x2="220" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="390" y1="85.0" x2="420" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="590" y1="85.0" x2="620" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="790" y1="85.0" x2="820" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="175" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">control types: preventative (encrypt, authenticate), detective (firewalls, intrusion detection), responsive (rebuild, backups, comms plan)</text><text x="500" y="210" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">principles: least privilege, defence in depth, automation, security built into delivery</text><text x="500" y="245" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">do not guard the front door and leave the back door open</text></svg>