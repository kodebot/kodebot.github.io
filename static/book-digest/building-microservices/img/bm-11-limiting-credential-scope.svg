<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/><rect x="20" y="15" width="470" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Shared credential</text><rect x="40" y="70" width="190" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="135.0" y="93.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Inventory instances</text><text x="135.0" y="113.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">all use one login</text><rect x="300" y="70" width="170" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="385.0" y="103.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Database</text><line x1="230" y1="98" x2="300" y2="98" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="265" y="88" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">read + write</text><rect x="40" y="170" width="190" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="135.0" y="193.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Debezium</text><text x="135.0" y="213.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">read-only login</text><line x1="230" y1="198" x2="300" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="255" y="280" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">one leak gives write access to all</text><rect x="510" y="15" width="470" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="532" y="49" font-size="16" font-weight="700" fill="#14324f">Credential per instance</text><rect x="530" y="70" width="190" height="40" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="625.0" y="95.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Inventory 1: own login</text><rect x="530" y="125" width="190" height="40" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="625.0" y="150.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Inventory 2: own login</text><rect x="780" y="90" width="170" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="865.0" y="123.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Database</text><line x1="720" y1="90" x2="780" y2="105" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="720" y1="145" x2="780" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="745" y="220" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">rotate or revoke each independently,</text><text x="745" y="240" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">trace a leak to its source</text><text x="745" y="290" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">tools: Vault, Kubernetes secrets, cloud key vaults</text></svg>