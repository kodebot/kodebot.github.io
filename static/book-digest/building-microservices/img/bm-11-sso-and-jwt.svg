<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="430" fill="#ffffff"/><rect x="20" y="160" width="140" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="90.0" y="183.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Browser</text><text x="90.0" y="203.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">logs in via OIDC</text><rect x="220" y="160" width="140" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="290.0" y="183.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">SSO gateway</text><text x="290.0" y="203.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">session to JWT</text><rect x="420" y="160" width="140" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="490.0" y="183.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Web Shop</text><text x="490.0" y="203.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">BFF</text><line x1="160" y1="188" x2="220" y2="188" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="360" y1="188" x2="420" y2="188" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="390" y="150" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">JWT per request</text><rect x="660" y="90" width="320" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="820.0" y="113.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Order service</text><text x="820.0" y="133.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">validates JWT, decides locally</text><rect x="660" y="230" width="320" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="820.0" y="253.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Shipping service</text><text x="820.0" y="273.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">validates JWT, decides locally</text><line x1="560" y1="175" x2="660" y2="120" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="560" y1="200" x2="660" y2="255" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="20" width="300" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="170.0" y="55.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Identity provider</text><text x="170.0" y="75.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">OpenID Connect, SAML; LDAP or AD behind</text><line x1="90" y1="160" x2="90" y2="100" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="500" y="340" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">confused deputy: customer asks Web Shop for someone else&#x27;s order 12345; authorise in the owning service</text><text x="500" y="365" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">JWT parts: header, payload (claims such as sub, exp, groups), signature</text><text x="500" y="390" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">keep roles coarse and organisational (CALL_CENTER), not CALL_CENTER_50_DOLLAR_REFUND</text></svg>