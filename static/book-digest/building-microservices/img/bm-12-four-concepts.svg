 96.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="185" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">microservices mainly help robustness; resilience is a property of the people and organisation</text><text x="500" y="215" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">robustness adds complexity (Kubernetes fixes some failures, adds new ones); automation cannot handle surprise</text><text x="500" y="245" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">blame-free learning, game days and chaos engineering feed rebound and adaptability</text></svg>