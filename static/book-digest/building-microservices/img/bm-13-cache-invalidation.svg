<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">Cache invalidation options</text><rect x="20" y="45" width="300" height="90" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="170.0" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">TTL</text><text x="170.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Cache-Control, Expires;</text><text x="170.0" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">simple, blunt</text><rect x="350" y="45" width="300" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="500.0" y="75.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Conditional GET</text><text x="500.0" y="95.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">ETag + If-None-Match;</text><text x="500.0" y="115.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">304 Not Modified</text><rect x="680" y="45" width="300" height="90" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="830.0" y="75.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Notification</text><text x="830.0" y="95.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">Stock Change events;</text><text x="830.0" y="115.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">heartbeat to detect silence</text><rect x="20" y="160" width="460" height="90" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="250.0" y="190.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Write-through</text><text x="250.0" y="210.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">update cache and origin together;</text><text x="250.0" y="230.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">easiest server-side</text><rect x="520" y="160" width="460" height="90" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="750.0" y="190.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Write-behind</text><text x="750.0" y="210.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">cache first, origin later;</text><text x="750.0" y="230.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">risk of data loss, unclear source of truth</text><text x="500" y="290" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">TTL trade-off: 5 min to 1 min cuts staleness to a fifth but means five times the origin calls</text><text x="500" y="315" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">cache poisoning: an Expires: Never header left browsers holding pages forever</text></svg>