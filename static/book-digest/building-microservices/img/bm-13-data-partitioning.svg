<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/><rect x="20" y="15" width="470" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Partition key: family name A-M / N-Z</text><rect x="40" y="70" width="190" height="50" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="135.0" y="100.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Customer service</text><rect x="290" y="60" width="170" height="40" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="375.0" y="85.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Partition 1: A to M</text><rect x="290" y="120" width="170" height="40" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="375.0" y="145.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Partition 2: N to Z</text><line x1="230" y1="90" x2="290" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="230" y1="100" x2="290" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="255" y="215" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">skewed: many Chinese surnames fall in N-Z;</text><text x="255" y="235" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">name changes move data</text><rect x="510" y="15" width="470" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="532" y="49" font-size="16" font-weight="700" fill="#14324f">Better: a unique customer ID</text><rect x="530" y="70" width="190" height="50" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="625.0" y="100.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Customer service</text><rect x="780" y="60" width="170" height="40" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="865.0" y="85.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Partition by hash of ID</text><rect x="780" y="120" width="170" height="40" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="865.0" y="145.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Partition by hash of ID</text><line x1="720" y1="90" x2="780" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="720" y1="100" x2="780" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="745" y="215" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">even load; stable key</text><text x="745" y="245" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">cross-shard queries need an alternative read store</text></svg>