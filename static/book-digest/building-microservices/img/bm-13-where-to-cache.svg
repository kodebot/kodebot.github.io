<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="380" fill="#ffffff"/><rect x="20" y="140" width="170" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="105.0" y="165.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Sales</text><text x="105.0" y="185.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">top ten with IDs</text><rect x="300" y="140" width="170" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="385.0" y="165.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Catalog</text><text x="385.0" y="185.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">ID to album name</text><line x1="190" y1="170" x2="300" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="245" y="158" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">names for 10 IDs</text><rect x="620" y="30" width="170" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="705.0" y="50.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Client-side cache</text><text x="705.0" y="70.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">in Sales</text><rect x="620" y="105" width="170" height="50" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="705.0" y="125.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Shared cache</text><text x="705.0" y="145.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">Redis or memcached</text><rect x="620" y="180" width="170" height="50" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="705.0" y="200.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Server-side cache</text><text x="705.0" y="220.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">inside Catalog</text><rect x="620" y="255" width="170" height="50" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="705.0" y="275.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Request cache</text><text x="705.0" y="295.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">the top-ten result</text><text x="905" y="55" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">fastest; consumers</text><text x="905" y="75" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">may disagree</text><text x="905" y="130" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">one copy; extra trip</text><text x="905" y="205" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">invisible to callers;</text><text x="905" y="225" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">round trip remains</text><text x="905" y="280" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">best for speed;</text><text x="905" y="300" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">only that request</text><text x="500" y="350" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">golden rule: cache in as few places as possible; nested caches add up (1 min plus 1 min can be 2 min stale)</text></svg>