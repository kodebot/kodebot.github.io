<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><rect x="20" y="120" width="280" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="160.0" y="155.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Organisation&#x27;s</text><text x="160.0" y="175.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">communication structure</text><rect x="400" y="120" width="280" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="540.0" y="155.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">System design</text><text x="540.0" y="175.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">mirrors it</text><line x1="300" y1="160" x2="400" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="350" y="148" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">Conway&#x27;s law</text><line x1="400" y1="190" x2="300" y2="190" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="350" y="215" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">in reverse (anecdotal)</text><rect x="740" y="50" width="240" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="860.0" y="80.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Loosely coupled</text><text x="860.0" y="100.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">teams, modular systems</text><rect x="740" y="190" width="240" height="70" rx="10" fil