<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="380" fill="#ffffff"/><rect x="20" y="15" width="470" height="350" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Strong ownership</text><rect x="40" y="70" width="430" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="255.0" y="100.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">One team decides changes, technology, deployment</text><text x="255" y="160" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">more autonomy and local optimisation;</text><text x="255" y="182" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">others send requests or pull requests</text><text x="255" y="220" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">aim: full life-cycle ownership over time</text><rect x="510" y="15" width="470" height="350" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="532" y="49" font-size="16" font-weight="700" fill="#14324f">Collective ownership</text><rect x="530" y="70" width="430" height="50" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="745.0" y="100.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Any team may change any service</text><text x="745" y="160" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">flexible staffing, but needs global consistency;</text><text x="745" y="182" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">more coordination, so coupling</text><text x="745" y="220" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">fine inside a team, risky across a large organisation</text><text x="500" y="345" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">consistency at the left, local optimisation at the right; the best organisations keep moving right</text></svg>