<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/><rect x="20" y="15" width="460" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Shared service with many pull requests</text><rect x="40" y="70" width="190" height="50" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="135.0" y="100.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Central service</text><rect x="40" y="140" width="100" height="40" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="90.0" y="165.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">US team</text><rect x="150" y="140" width="100" height="40" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="200.0" y="165.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">SG team</text><line x1="90" y1="140" x2="120" y2="120" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="200" y1="140" x2="160" y2="120" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="255" y="230" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a sign it is really shared</text><rect x="520" y="15" width="460" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="542" y="49" font-size="16" font-weight="700" fill="#14324f">Options</text><rect x="540" y="60" width="420" height="52" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="750.0" y="81.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Change ownership</text><text x="750.0" y="101.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">if pulls come from one team</text><rect x="540" y="125" width="420" height="52" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="750.0" y="146.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Internal open source</text><text x="750.0" y="166.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">core committers vet; stable service</text><rect x="540" y="190" width="420" height="52" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="750.0" y="211.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Variations on a framework</text><text x="750.0" y="231.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">each team runs its own instance</text><rect x="540" y="255" width="420" height="52" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="750.0" y="276.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Contributed libraries</text><text x="750.0" y="296.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">central team schedules deployment</text></svg>