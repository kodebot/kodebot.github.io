<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/><rect x="20" y="40" width="200" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="120.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Stream team A</text><rect x="240" y="40" width="200" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="340.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Stream team B</text><rect x="460" y="40" width="200" height="50" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="560.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Stream team C</text><rect x="20" y="130" width="640" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="340.0" y="160.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Platform: self-service paved road (deploy, logs, desired state, mTLS)</text><line x1="120" y1="90" x2="120" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="340" y1="90" x2="340" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="560" y1="90" x2="560" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="700" y="40" width="280" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="840.0" y="70.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Enabling team</text><text x="840.0" y="90.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">internal consultancy</text><rect x="700" y="130" width="280" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="840.0" y="160.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Community of practice</text><text x="840.0" y="180.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">peer learning, part-time, fluid</text><text x="340" y="235" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">paved road: optional, easy; adoption is the platform team&#x27;s measure (OKRs), not mandate</text><text x="340" y="260" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a platform team&#x27;s job is making delivery easy, not building a platform</text><text x="340" y="295" font-size="12" font-weight="700" fill="#14324f" text-anchor="middle">explain why, then make it easy, rather than forbid</text></svg>