<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="480" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 145.3L10.7 144.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 79.7 495.0 146.2M494.9 12.9Q496.9 79.5 495.3 146.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 144.4Q252.6 147.2 8.7 144.5M496.4 144.7Q252.1 143.2 7.8 145.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="75.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1. Urgent and important</text><text x="252.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(behaviour, some)</text><path d="M504.1 14.9L990.2 14.7L990.7 144.7L506.0 144.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 79.6 989.3 146.3M989.2 13.5Q988.8 79.5 990.4 145.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 144.5Q747.1 145.0 502.9 144.1M990.9 145.2Q746.9 146.3 502.9 145.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 147.1Q507.7 80.5 505.3 13.9M504.8 147.0Q503.2 80.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="75.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2. Not urgent and important</text><text x="747.5" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(architecture)</text><path d="M11.1 159.0L495.3 160.4L495.5 288.8L9.4 291.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 159.4Q252.5 161.4 496.6 159.4M9.6 160.2Q252.5 160.6 495.5 160.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 159.2Q496.9 224.8 495.3 290.5M496.1 157.5Q493.6 224.0 494.8 290.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 289.6Q252.0 291.6 8.0 290.0M497.1 289.3Q252.7 288.6 8.4 289.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 291.3Q12.0 225.2 10.1 159.1M9.5 292.4Q9.6 225.1 10.0 157.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="220.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3. Urgent and not important</text><text x="252.5" y="242.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(many features)</text><path d="M504.3 160.1L991.1 160.8L991.1 291.1L504.7 288.8Z" fill="#f1ede5" stroke="none"/><path d="M503.5 160.8Q747.1 162.0 990.6 160.5M502.6 160.4Q746.9 162.4 991.1 160.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 158.1Q991.3 224.9 990.5 291.8M990.0 159.0Q990.6 224.8 989.1 290.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 290.4Q748.1 289.3 504.3 289.1M991.7 290.0Q747.5 288.7 503.3 289.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 292.0Q506.5 224.7 505.3 157.5M506.0 291.4Q507.1 225.4 504.0 159.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="231.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">4. Not urgent and not important</text><path d="M9.1 304.1L989.6 304.3L989.6 465.2L9.4 465.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 304.3Q499.8 306.0 991.8 304.3M9.1 304.1Q500.1 307.8 991.2 305.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 304.4Q992.1 385.4 989.4 466.3M990.1 303.9Q990.8 385.2 990.0 466.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 465.6Q500.2 464.2 8.1 464.5M992.5 464.0Q500.2 464.8 7.9 464.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 466.0Q10.9 384.9 11.0 303.7M10.3 465.5Q10.2 384.3 9.6 303.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="358.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Eisenhower (speech at Northwestern University, 1954): &#x27;I have two kinds of problems, the urgent and the important. The urgent are not important, and the important are</text><text x="500.0" y="380.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">never urgent.&#x27; Architecture sits in the top two priorities; behaviour in the first and third. The mistake: lifting position 3 to position 1, so unimportant features</text><text x="500.0" y="402.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">crowd out architecture. Managers cannot judge architecture&#x27;s importance; developers were hired to, so the team must assert its importance over the urgency of features:</text><text x="500.0" y="424.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fight for it as an equal stakeholder (architects especially); if architecture comes last, change becomes practically impossible.</text></svg>