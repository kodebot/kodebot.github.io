<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="460" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 195.3L10.7 194.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 104.7 495.0 196.2M494.9 12.9Q496.9 104.5 495.3 196.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 194.4Q252.6 197.2 8.7 194.5M496.4 194.7Q252.1 193.2 7.8 195.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 196.0Q10.0 104.3 10.1 12.7M10.2 195.9Q8.5 105.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="78.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Behaviour (the first value)</text><text x="252.5" y="100.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">make the machine meet the requirements and fix bugs when it does not;</text><text x="252.5" y="122.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">what programmers are hired for; urgent but not always important;</text><text x="252.5" y="144.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">many programmers think this is the whole job (sadly mistaken)</text><path d="M504.1 14.9L990.2 14.7L990.7 194.7L506.0 194.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 104.6 989.3 196.3M989.2 13.5Q988.8 104.5 990.4 195.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 194.5Q747.1 195.0 502.9 194.1M990.9 195.2Q746.9 196.3 502.9 195.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 197.1Q507.7 105.5 505.3 13.9M504.8 197.0Q503.2 105.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="78.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Structure or architecture (the second value)</text><text x="747.5" y="100.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">software is &#x27;soft&#x27;: easy to change; change cost should follow the scope</text><text x="747.5" y="122.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">of the change, not its shape; a system that prefers one shape makes each</text><text x="747.5" y="144.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">request harder to fit; be as shape agnostic as practical</text><path d="M11.1 209.0L990.3 210.4L990.5 318.8L9.4 321.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 209.4Q500.0 211.4 991.6 209.4M9.6 210.2Q500.0 210.6 990.5 210.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 209.2Q991.8 264.8 990.3 320.5M991.1 207.5Q988.9 264.0 989.8 320.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 319.6Q499.5 321.6 8.0 320.0M992.1 319.3Q500.2 318.6 8.4 319.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 321.3Q11.8 265.2 10.1 209.1M9.5 322.4Q9.6 265.1 10.0 207.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="260.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Stakeholders give a stream of changes of roughly similar scope; developers receive jigsaw pieces for a puzzle of ever-growing complexity, as the system&#x27;s shape does not</text><text x="500.0" y="282.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">match the request&#x27;s shape. That mismatch is why costs outgrow the size of requests and year one is cheaper than year two, and two cheaper than three.</text><path d="M9.3 335.1L496.1 335.8L496.1 446.1L9.7 443.8Z" fill="#eed5cc" stroke="none"/><path d="M8.5 335.8Q252.1 337.0 495.6 335.5M7.6 335.4Q251.9 337.4 496.1 335.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 333.1Q496.2 389.9 495.5 446.8M495.0 334.0Q495.5 389.8 494.1 445.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 445.4Q253.1 444.3 9.3 444.1M496.7 445.0Q252.5 443.7 8.3 444.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 447.0Q11.3 389.7 10.3 332.5M11.0 446.4Q11.9 390.4 9.0 334.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="385.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Extreme 1: works but cannot change</text><text x="252.5" y="407.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">becomes useless when requirements change</text><path d="M504.1 334.1L989.6 334.3L989.6 445.2L504.4 445.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 334.3Q747.3 336.0 991.8 334.3M504.1 334.1Q747.6 337.8 991.2 335.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 334.4Q991.8 390.4 989.4 446.3M990.1 333.9Q990.7 390.2 990.0 446.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 445.6Q747.7 444.2 503.1 444.5M992.5 444.0Q747.7 444.8 502.9 444.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 446.0Q505.9 389.9 506.0 333.7M505.3 445.5Q505.2 389.3 504.6 333.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="385.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Extreme 2: easy to change but does not work</text><text x="747.5" y="407.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">can be made to work and kept working: continually useful</text></svg>