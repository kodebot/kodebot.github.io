<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="500" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 195.3L10.7 194.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 104.7 495.0 196.2M494.9 12.9Q496.9 104.5 495.3 196.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 194.4Q252.6 197.2 8.7 194.5M496.4 194.7Q252.1 193.2 7.8 195.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 196.0Q10.0 104.3 10.1 12.7M10.2 195.9Q8.5 105.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="78.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Dijkstra&#x27;s problem and idea</text><text x="252.5" y="100.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">programming is hard and a human cannot manage all the details of a complex</text><text x="252.5" y="122.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">program; his vision: a Euclidean hierarchy of postulates, theorems and lemmas,</text><text x="252.5" y="144.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">with programmers tying proven structures together with code they prove correct</text><path d="M504.1 14.9L990.2 14.7L990.7 194.7L506.0 194.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 104.6 989.3 196.3M989.2 13.5Q988.8 104.5 990.4 195.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 194.5Q747.1 195.0 502.9 194.1M990.9 195.2Q746.9 196.3 502.9 195.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 197.1Q507.7 105.5 505.3 13.9M504.8 197.0Q503.2 105.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="67.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The discovery</text><text x="747.5" y="89.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">some uses of goto stop modules being decomposed recursively, blocking</text><text x="747.5" y="111.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">divide and conquer; &#x27;good&#x27; goto uses match selection (if/then/else) and iteration</text><text x="747.5" y="133.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">(do/while); Bohm and Jacopini had shown all programs need only sequence,</text><text x="747.5" y="155.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">selection and iteration: structured programming was born</text><path d="M11.1 209.0L330.3 210.4L330.5 348.8L9.4 351.1Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 209.4Q170.0 211.4 331.6 209.4M9.6 210.2Q170.0 210.6 330.5 210.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.9 209.2Q331.9 279.8 330.3 350.5M331.1 207.5Q328.6 279.0 329.8 350.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.1 349.6Q169.5 351.6 8.0 350.0M332.1 349.3Q170.2 348.6 8.4 349.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 351.3Q12.0 280.2 10.1 209.1M9.5 352.4Q9.6 280.1 10.0 207.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="264.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Proving sequence</text><text x="170.0" y="286.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">enumerate: trace the inputs of the sequence to its</text><text x="170.0" y="308.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">outputs</text><path d="M339.3 210.1L661.1 210.8L661.1 351.1L339.7 348.8Z" fill="#efe0ca" stroke="none"/><path d="M338.5 210.8Q499.6 212.0 660.6 210.5M337.6 210.4Q499.4 212.4 661.1 210.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 208.1Q661.3 279.9 660.5 351.8M660.0 209.0Q660.6 279.8 659.1 350.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M662.0 350.4Q500.6 349.3 339.3 349.1M661.7 350.0Q500.0 348.7 338.3 349.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.9 352.0Q341.5 279.7 340.3 207.5M341.0 351.4Q342.1 280.4 339.0 209.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="264.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Proving selection</text><text x="500.0" y="286.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">enumerate each path; if both give the right results the</text><text x="500.0" y="308.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">proof holds</text><path d="M669.1 209.1L989.6 209.3L989.6 350.2L669.4 350.1Z" fill="#eed5cc" stroke="none"/><path d="M667.7 209.3Q829.8 211.0 991.8 209.3M669.1 209.1Q830.1 212.8 991.2 210.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 209.4Q992.1 280.4 989.4 351.3M990.1 208.9Q990.8 280.2 990.0 351.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 350.6Q830.2 349.2 668.1 349.5M992.5 349.0Q830.2 349.8 667.9 349.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.9 351.0Q670.9 279.9 671.0 208.7M670.3 350.5Q670.2 279.3 669.6 208.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="264.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Proving iteration</text><text x="830.0" y="286.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">induction: prove case 1, then N implies N+1, and the</text><text x="830.0" y="308.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">start and end criteria</text><path d="M9.5 364.2L989.1 365.5L990.6 479.4L9.8 481.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 364.5Q500.2 361.6 992.4 365.0M7.8 365.6Q500.1 366.6 992.4 365.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 362.6Q990.0 422.6 990.3 482.5M990.0 363.5Q988.4 422.7 990.9 482.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 480.9Q500.1 477.3 8.9 479.2M991.4 479.3Q500.2 476.8 9.0 480.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 482.5Q12.8 422.8 9.3 363.2M9.8 482.3Q12.3 422.8 9.7 363.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="406.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">1968: Dijkstra&#x27;s CACM letter &#x27;Go To Statement Considered Harmful&#x27; (March issue) set off a roughly ten-year battle by letters to editors; he won: goto moved rearward</text><text x="500.0" y="428.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">until it nearly vanished (LISP never had it); named breaks and exceptions are not the unrestricted jumps of Fortran or COBOL. Functional decomposition followed</text><text x="500.0" y="450.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">(structured analysis and design: Yourdon, Constantine, DeMarco, Page-Jones, late 1970s and 1980s).</text></svg>