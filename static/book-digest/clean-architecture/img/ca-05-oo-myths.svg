<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 205.3L10.7 204.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 109.7 330.0 206.2M329.9 12.9Q331.9 109.5 330.3 206.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 204.4Q170.1 207.2 8.7 204.5M331.4 204.7Q169.6 203.2 7.8 205.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="61.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Encapsulation?</text><text x="170.0" y="83.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">C had perfect encapsulation (a forward-declared struct</text><text x="170.0" y="105.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">in a header); C++ broke it: the header must show member</text><text x="170.0" y="127.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">variables; public, private and protected are a partial</text><text x="170.0" y="149.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">repair; Java and C# dropped the split; many OO</text><text x="170.0" y="171.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">languages enforce little. No point for OO</text><path d="M339.1 14.9L660.2 14.7L660.7 204.7L341.0 204.8Z" fill="#efe0ca" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 109.6 659.3 206.3M659.2 13.5Q658.8 109.5 660.4 205.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 204.5Q499.6 205.0 337.9 204.1M660.9 205.2Q499.4 206.3 337.9 205.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 207.1Q342.7 110.5 340.3 13.9M339.8 207.0Q338.2 110.2 339.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="61.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Inheritance?</text><text x="500.0" y="83.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">C programmers could masquerade a NamedPoint as a Point</text><text x="500.0" y="105.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">by keeping the first fields in the same order (C++ does</text><text x="500.0" y="127.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">single inheritance this way); OO made it far more</text><text x="500.0" y="149.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">convenient (implicit upcasts, multiple inheritance).</text><text x="500.0" y="171.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Perhaps a half point</text><path d="M671.1 14.0L990.3 15.4L990.5 203.8L669.4 206.1Z" fill="#d6e1cf" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 109.8 990.3 205.5M991.1 12.5Q988.6 109.0 989.8 205.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 204.6Q829.5 206.6 668.0 205.0M992.1 204.3Q830.2 203.6 668.4 204.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 206.3Q672.0 110.2 670.1 14.1M669.5 207.4Q669.6 110.1 670.0 12.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="72.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Polymorphism?</text><text x="830.0" y="94.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">C had it too, with pointers to functions (UNIX FILE and</text><text x="830.0" y="116.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">getchar); OO (a vtable per class) makes it safe and</text><text x="830.0" y="138.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">convenient: no manual conventions to forget; OO imposes</text><text x="830.0" y="160.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">discipline on indirect transfer of control</text><path d="M9.3 220.1L991.1 220.8L991.1 351.1L9.7 348.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 220.8Q499.6 222.0 990.6 220.5M7.6 220.4Q499.4 222.4 991.1 220.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 218.1Q991.3 284.9 990.5 351.8M990.0 219.0Q990.6 284.8 989.1 350.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 350.4Q500.6 349.3 9.3 349.1M991.7 350.0Q500.0 348.7 8.3 349.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 352.0Q11.5 284.7 10.3 217.5M11.0 351.4Q12.1 285.4 9.0 219.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="269.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">The weak definitions: &#x27;the combination of data and function&#x27; (o.f() is no different from f(o)), &#x27;a way to model the real world&#x27; (evasive) and &#x27;encapsulation,</text><text x="500.0" y="291.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">inheritance, polymorphism&#x27;. Martin&#x27;s verdict after testing each: OO gave nothing wholly new, but made polymorphism safe and convenient, and polymorphism is what matters</text><text x="500.0" y="313.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">to the architect.</text><path d="M9.1 364.1L989.6 364.3L989.6 505.2L9.4 505.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 364.3Q499.8 366.0 991.8 364.3M9.1 364.1Q500.1 367.8 991.2 365.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 364.4Q992.1 435.4 989.4 506.3M990.1 363.9Q990.8 435.2 990.0 506.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 505.6Q500.2 504.2 8.1 504.5M992.5 504.0Q500.2 504.8 7.9 504.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 506.0Q10.9 434.9 11.0 363.7M10.3 505.5Q10.2 434.3 9.6 363.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="419.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Polymorphism&#x27;s power: the copy program (getchar and putchar over STDIN and STDOUT) needs no change, not even a recompile, for a handwriting recognition device and a</text><text x="500.0" y="441.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">speech synthesiser, as long as their drivers supply open, close, read, write and seek; IO devices are plugins. UNIX adopted this because programs written for punched</text><text x="500.0" y="463.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">cards (IBM Hollerith, 80 columns) had to be rewritten for magnetic tape; OO lets the plugin architecture be used anywhere.</text></svg>