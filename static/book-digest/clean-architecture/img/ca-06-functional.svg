<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="83.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Squares of 25 integers</text><text x="252.5" y="105.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Java: a for loop with a mutable loop variable i; Clojure: println of take 25 of map</text><text x="252.5" y="127.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">(fn [x] (* x x)) over range, a never-ending list evaluated only as accessed, and x</text><text x="252.5" y="149.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">is never modified; &#x27;variables in functional languages do not vary&#x27;</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#d3dbe0" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="83.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Why it matters to the architect</text><text x="747.5" y="105.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">all race conditions, deadlocks and concurrent update problems are due to mutable</text><text x="747.5" y="127.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">variables; with no variable ever updated none can occur; immutability is practical</text><text x="747.5" y="149.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">only with compromises (storage and speed are not infinite)</text><path d="M11.1 219.0L495.3 220.4L495.5 398.8L9.4 401.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 219.4Q252.5 221.4 496.6 219.4M9.6 220.2Q252.5 220.6 495.5 220.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 219.2Q496.9 309.8 495.3 400.5M496.1 217.5Q493.6 309.0 494.8 400.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 399.6Q252.0 401.6 8.0 400.0M497.1 399.3Q252.7 398.6 8.4 399.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 401.3Q12.0 310.2 10.1 219.1M9.5 402.4Q9.6 310.1 10.0 217.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="272.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Segregate mutability (Fig 6.1)</text><text x="252.5" y="294.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">split services into immutable (purely functional) components and mutable ones;</text><text x="252.5" y="316.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">protect the mutable with transactional memory (Clojure atom with swap!: compare</text><text x="252.5" y="338.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">and swap, retry); fine for simple cases, not several dependent variables;</text><text x="252.5" y="360.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">push as much processing as possible into the immutable side</text><path d="M504.3 220.1L991.1 220.8L991.1 401.1L504.7 398.8Z" fill="#efe0ca" stroke="none"/><path d="M503.5 220.8Q747.1 222.0 990.6 220.5M502.6 220.4Q746.9 222.4 991.1 220.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 218.1Q991.3 309.9 990.5 401.8M990.0 219.0Q990.6 309.8 989.1 400.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 400.4Q748.1 399.3 504.3 399.1M991.7 400.0Q747.5 398.7 503.3 399.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 402.0Q506.5 309.7 505.3 217.5M506.0 401.4Q507.1 310.4 504.0 219.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="261.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Event sourcing</text><text x="747.5" y="283.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">store transactions, not state; compute a balance by adding every transaction (or</text><text x="747.5" y="305.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">snapshot at midnight and add since then); only create and read, never update or</text><text x="747.5" y="327.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">delete, so CR not CRUD and no concurrent updates; works when storage and processing</text><text x="747.5" y="349.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">suffice for the application&#x27;s lifetime; like a source control system (credit: Greg</text><text x="747.5" y="371.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Young)</text><path d="M9.1 414.1L989.6 414.3L989.6 505.2L9.4 505.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 414.3Q499.8 416.0 991.8 414.3M9.1 414.1Q500.1 417.8 991.2 415.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 414.4Q991.5 460.4 989.4 506.3M990.1 413.9Q990.7 460.2 990.0 506.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 505.6Q500.2 504.2 8.1 504.5M992.5 504.0Q500.2 504.8 7.9 504.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 506.0Q10.9 459.9 11.0 413.7M10.3 505.5Q10.2 459.3 9.6 413.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="455.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Conclusion: structured = discipline on direct transfer of control; OO = on indirect transfer; functional = on assignment. Each removed power; we learned what not to do.</text><text x="500.0" y="477.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Software is sequence, selection, iteration and indirection, as in 1946.</text></svg>