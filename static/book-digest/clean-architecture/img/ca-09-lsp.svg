<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 115.3L10.7 114.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.4 64.7 990.0 116.2M989.9 12.9Q991.6 64.5 990.3 116.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 114.4Q500.1 117.2 8.7 114.5M991.4 114.7Q499.6 113.2 7.8 115.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 116.0Q10.1 64.3 10.1 12.7M10.2 115.9Q8.7 65.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="60.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Liskov (1988): if for each object o1 of type S there is an object o2 of type T such that for all programs P defined in terms of T the behaviour of P is unchanged when o1 is</text><text x="500.0" y="82.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">substituted for o2, then S is a subtype of T</text><path d="M9.1 129.9L495.2 129.7L495.7 309.7L11.0 309.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 129.3Q252.2 130.9 496.0 129.1M7.7 129.3Q252.1 131.7 496.5 129.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 127.9Q496.6 219.6 494.3 311.3M494.2 128.5Q493.8 219.5 495.4 310.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 309.5Q252.1 310.0 7.9 309.1M495.9 310.2Q251.9 311.3 7.9 310.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 312.1Q12.7 220.5 10.3 128.9M9.8 312.0Q8.2 220.2 9.0 128.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="193.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Conforming: License (Fig 9.1)</text><text x="252.5" y="215.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Billing calls calcFee() on a License; PersonalLicense and BusinessLicense compute</text><text x="252.5" y="237.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">the fee differently; Billing&#x27;s behaviour does not depend on which subtype it gets,</text><text x="252.5" y="259.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">so both are substitutable</text><path d="M506.1 129.0L990.3 130.4L990.5 308.8L504.4 311.1Z" fill="#eed5cc" stroke="none"/><path d="M503.4 129.4Q747.5 131.4 991.6 129.4M504.6 130.2Q747.5 130.6 990.5 130.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 129.2Q991.9 219.8 990.3 310.5M991.1 127.5Q988.6 219.0 989.8 310.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 309.6Q747.0 311.6 503.0 310.0M992.1 309.3Q747.7 308.6 503.4 309.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 311.3Q507.0 220.2 505.1 129.1M504.5 312.4Q504.6 220.1 505.0 127.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="182.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Violating: Square and Rectangle (Fig 9.2)</text><text x="747.5" y="204.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Rectangle&#x27;s width and height change independently, a Square&#x27;s together; the user</text><text x="747.5" y="226.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">sets w = 5, h = 2 and asserts area == 10, which fails for a Square; the only</text><text x="747.5" y="248.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">defence is an if in the user to detect a Square, so the user depends on the type:</text><text x="747.5" y="270.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">not substitutable</text><path d="M9.3 325.1L991.1 325.8L991.1 506.1L9.7 503.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 325.8Q499.6 327.0 990.6 325.5M7.6 325.4Q499.4 327.4 991.1 325.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 323.1Q991.3 414.9 990.5 506.8M990.0 324.0Q990.6 414.8 989.1 505.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 505.4Q500.6 504.3 9.3 504.1M991.7 505.0Q500.0 503.7 8.3 504.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 507.0Q11.5 414.7 10.3 322.5M11.0 506.4Q12.1 415.4 9.0 324.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="399.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Broader than inheritance: the principle now covers interfaces and implementations of any form: a Java interface with several implementing classes, several Ruby classes</text><text x="500.0" y="421.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">with the same method signatures, or a set of services answering one REST interface. Wherever users depend on a well-defined interface and on implementations being</text><text x="500.0" y="443.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">substitutable, LSP applies. The best way to see its architectural meaning is to look at what happens to the architecture when it is violated.</text></svg>