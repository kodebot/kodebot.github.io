-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.3 117.8Q993.2 190.0 990.6 262.1M989.7 119.1Q987.7 190.3 991.0 261.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 259.8Q499.3 258.9 7.7 260.1M991.5 260.1Q499.9 258.6 8.2 260.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.6 261.0Q7.0 190.3 10.3 119.5M9.4 261.4Q8.2 190.4 9.9 119.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="185.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Fig 10.3, a problematic architecture: S depends on F, which the authors bound to database D. D has features F does not use, so S does not care about them, yet changes</text><text x="500.0" y="207.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">to those features can force the redeployment of F and so of S; worse, a failure of one of D&#x27;s features can cause failures in F and S.</text><path d="M11.1 275.2L990.0 275.3L988.9 394.6L9.4 395.1Z" fill="#d6e1cf" stroke="none"/><path d="M8.0 274.3Q499.4 276.4 990.7 275.4M7.9 274.9Q500.2 273.3 992.6 274.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 273.5Q988.3 334.7 988.9 395.8M990.9 273.7Q993.2 335.6 990.4 397.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.8 396.0Q500.3 395.6 8.8 395.0M992.4 395.5Q500.8 392.7 9.3 394.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.4 395.7Q8.7 334.5 11.0 273.4M10.5 396.9Q13.5 335.6 11.0 274.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="319.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Lesson</text><text x="500.0" y="341.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">depending on something that carries baggage you do not need can cause troubles you did not expect; the idea returns as the Common Reuse Principle (Chapter 13, Component</text><text x="500.0" y="363.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Cohesion)</text></svg>