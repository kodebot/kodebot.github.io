<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 245.3L10.7 244.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.2 129.7 330.0 246.2M329.9 12.9Q331.9 129.5 330.3 246.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 244.4Q170.1 247.2 8.7 244.5M331.4 244.7Q169.6 243.2 7.8 245.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 246.0Q10.0 129.3 10.1 12.7M10.2 245.9Q8.5 130.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="81.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">REP</text><text x="170.0" y="103.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Reuse/Release Equivalence the granule of reuse is the</text><text x="170.0" y="125.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">granule of release; users reuse only tracked, numbered</text><text x="170.0" y="147.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">releases with notifications and documentation; a</text><text x="170.0" y="169.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">component is a cohesive group with a common theme,</text><text x="170.0" y="191.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">releasable together (inclusive: bigger)</text><path d="M339.1 14.9L660.2 14.7L660.7 244.7L341.0 244.8Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.6 129.6 659.3 246.3M659.2 13.5Q658.8 129.5 660.4 245.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 244.5Q499.6 245.0 337.9 244.1M660.9 245.2Q499.4 246.3 337.9 245.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 247.1Q342.7 130.5 340.3 13.9M339.8 247.0Q338.2 130.2 339.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="92.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">CCP</text><text x="500.0" y="114.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">Common Closure gather classes that change for the same</text><text x="500.0" y="136.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">reasons and at the same times; SRP for components;</text><text x="500.0" y="158.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">maintainability over reusability; closure in the OCP</text><text x="500.0" y="180.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">sense, strategic (inclusive: bigger)</text><path d="M671.1 14.0L990.3 15.4L990.5 243.8L669.4 246.1Z" fill="#efe0ca" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 129.8 990.3 245.5M991.1 12.5Q988.6 129.0 989.8 245.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 244.6Q829.5 246.6 668.0 245.0M992.1 244.3Q830.2 243.6 668.4 244.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 246.3Q672.0 130.2 670.1 14.1M669.5 247.4Q669.6 130.1 670.0 12.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="92.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">CRP</text><text x="830.0" y="114.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Common Reuse do not force users to depend on things</text><text x="830.0" y="136.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">they do not need; classes reused together belong</text><text x="830.0" y="158.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">together and inseparable ones only; the generic form of</text><text x="830.0" y="180.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">ISP (exclusive: smaller)</text><path d="M9.3 260.1L991.1 260.8L991.1 351.1L9.7 348.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 260.8Q499.6 262.0 990.6 260.5M7.6 260.4Q499.4 262.4 991.1 260.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 258.1Q991.1 304.9 990.5 351.8M990.0 259.0Q990.4 304.8 989.1 350.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 350.4Q500.6 349.3 9.3 349.1M991.7 350.0Q500.0 348.7 8.3 349.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 352.0Q11.2 304.7 10.3 257.5M11.0 351.4Q11.6 305.4 9.0 259.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="300.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Together: &#x27;Gather together those things that change at the same times and for the same reasons; separate those that change at different times or for different reasons.&#x27;</text><text x="500.0" y="322.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">And: &#x27;Don&#x27;t depend on things you don&#x27;t need.&#x27;</text><path d="M9.1 364.1L989.6 364.3L989.6 550.2L9.4 550.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 364.3Q499.8 366.0 991.8 364.3M9.1 364.1Q500.1 367.8 991.2 365.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 364.4Q992.1 457.9 989.4 551.3M990.1 363.9Q990.8 457.7 990.0 551.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 550.6Q500.2 549.2 8.1 549.5M992.5 549.0Q500.2 549.8 7.9 549.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 551.0Q10.9 457.4 11.0 363.7M10.3 550.5Q10.2 456.8 9.6 363.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="430.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">The three cohesion principles pull against each other. REP and CCP make components larger; CRP makes them smaller. Focus on REP and CRP only and too many components are</text><text x="500.0" y="452.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">hit by simple changes; focus on CCP and REP and you generate too many unneeded releases. Abandoning REP, the principle on the opposite vertex of CCP and CRP, costs</text><text x="500.0" y="474.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">reusability (implied, as the figure&#x27;s third edge). A good architect picks a spot in the triangle for current concerns and expects it to move: early on, CCP matters more</text><text x="500.0" y="496.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">than REP (develop-ability beats reuse), so projects start on the right where only reuse is sacrificed and slide left as the project matures and others draw from it.</text></svg>