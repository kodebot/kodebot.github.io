<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 205.3L10.7 204.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 109.7 495.0 206.2M494.9 12.9Q496.9 109.5 495.3 206.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 204.4Q252.6 207.2 8.7 204.5M496.4 204.7Q252.1 203.2 7.8 205.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 206.0Q10.0 109.3 10.1 12.7M10.2 205.9Q8.5 110.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="105.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Policy</text><text x="252.5" y="127.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">all business rules and procedures: where the true value of the system lives</text><path d="M504.1 14.9L990.2 14.7L990.7 204.7L506.0 204.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 109.6 989.3 206.3M989.2 13.5Q988.8 109.5 990.4 205.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 204.5Q747.1 205.0 502.9 204.1M990.9 205.2Q746.9 206.3 502.9 205.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 207.1Q507.7 110.5 505.3 13.9M504.8 207.0Q503.2 110.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="83.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Details</text><text x="747.5" y="105.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">what lets humans, other systems and programmers communicate with the policy without</text><text x="747.5" y="127.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">affecting its behaviour: IO devices, databases, web systems, servers, frameworks,</text><text x="747.5" y="149.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">protocols</text><path d="M11.1 219.0L990.3 220.4L990.5 368.8L9.4 371.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 219.4Q500.0 221.4 991.6 219.4M9.6 220.2Q500.0 220.6 990.5 220.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 219.2Q991.9 294.8 990.3 370.5M991.1 217.5Q988.6 294.0 989.8 370.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 369.6Q499.5 371.6 8.0 370.0M992.1 369.3Q500.2 368.6 8.4 369.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 371.3Q12.0 295.2 10.1 219.1M9.5 372.4Q9.6 295.1 10.0 217.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="268.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Decisions to defer: choosing a database (relational, distributed, hierarchical or flat files should not matter to policy); a web server (policy should not know it is</text><text x="500.0" y="290.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">delivered over the web, HTML, AJAX, JSP or JSF); REST; a micro-services or SOA framework; a dependency injection framework. The longer you wait the more information you</text><text x="500.0" y="312.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">have, and you can run experiments (try several databases for fit and performance). If someone already decided, a good architect pretends it has not been and keeps it</text><text x="500.0" y="334.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">deferrable or changeable. &#x27;A good architect maximizes the number of decisions not made.&#x27;</text><path d="M9.3 385.1L496.1 385.8L496.1 511.1L9.7 508.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 385.8Q252.1 387.0 495.6 385.5M7.6 385.4Q251.9 387.4 496.1 385.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 383.1Q496.3 447.4 495.5 511.8M495.0 384.0Q495.6 447.3 494.1 510.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 510.4Q253.1 509.3 9.3 509.1M496.7 510.0Q252.5 508.7 8.3 509.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 512.0Q11.4 447.2 10.3 382.5M11.0 511.4Q12.0 447.9 9.0 384.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="420.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Device independence (1960s)</text><text x="252.5" y="442.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">code bound to card readers and punches had to be rewritten for magnetic tape;</text><text x="252.5" y="464.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">operating systems then abstracted IO as unit records (OCP born, unnamed), so one</text><text x="252.5" y="486.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">program works with cards or tape</text><path d="M504.1 384.1L989.6 384.3L989.6 510.2L504.4 510.1Z" fill="#d3dbe0" stroke="none"/><path d="M502.7 384.3Q747.3 386.0 991.8 384.3M504.1 384.1Q747.6 387.8 991.2 385.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 384.4Q992.0 447.9 989.4 511.3M990.1 383.9Q990.8 447.7 990.0 511.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 510.6Q747.7 509.2 503.1 509.5M992.5 509.0Q747.7 509.8 502.9 509.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 511.0Q505.9 447.4 506.0 383.7M505.3 510.5Q505.2 446.8 504.6 383.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="420.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Two more stories</text><text x="747.5" y="442.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">junk mail printing: programs unchanged when output went to tape for offline</text><text x="747.5" y="464.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">printers; truckers union system: hard-wired cylinder/head/sector addressing</text><text x="747.5" y="486.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">replaced by relative sector numbers and a conversion routine</text></svg>