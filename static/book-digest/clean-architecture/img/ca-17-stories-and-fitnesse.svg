<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 235.3L10.7 234.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 124.7 495.0 236.2M494.9 12.9Q496.9 124.5 495.3 236.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 234.4Q252.6 237.2 8.7 234.5M496.4 234.7Q252.1 233.2 7.8 235.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 236.0Q10.0 124.3 10.1 12.7M10.2 235.9Q8.5 125.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="65.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Company P (premature three-tier)</text><text x="252.5" y="87.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">a 1980s desktop app webified in the late 1990s by young Java programmers: GUI,</text><text x="252.5" y="109.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">middleware and database tiers with every domain object instantiated three times,</text><text x="252.5" y="131.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">serialised and marshalled across the wire; one new field meant three updated</text><text x="252.5" y="153.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">business objects, four messages and eight handlers; developed on one machine for</text><text x="252.5" y="175.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">years and every deployment was a single server, so the server farm never existed</text><text x="252.5" y="197.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(three-tier is a topology, not an architecture)</text><path d="M504.1 14.9L990.2 14.7L990.7 234.7L506.0 234.8Z" fill="#eed5cc" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 124.6 989.3 236.3M989.2 13.5Q988.8 124.5 990.4 235.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 234.5Q747.1 235.0 502.9 234.1M990.9 235.2Q746.9 236.3 502.9 235.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 237.1Q507.7 125.5 505.3 13.9M504.8 237.0Q503.2 125.2 504.0 13.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="65.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Company W (premature SOA)</text><text x="747.5" y="87.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">a fleet-car business whose new &#x27;Architect&#x27; built a huge domain model and a suite of</text><text x="747.5" y="109.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">services: to add a contact to a sales record you looked up ContactService, faked</text><text x="747.5" y="131.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">dozens of fields for CreateContact, then sent UpdateContact to SaleRecordService;</text><text x="747.5" y="153.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">tests needed every service, the message bus and a BPel server; delays and WSDL</text><text x="747.5" y="175.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">churn. Nothing is wrong with services; the error was premature adoption of a</text><text x="747.5" y="197.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">massive suite of domain object services</text><path d="M11.1 249.0L990.3 250.4L990.5 548.8L9.4 551.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 249.4Q500.0 251.4 991.6 249.4M9.6 250.2Q500.0 250.6 990.5 250.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 249.2Q991.9 399.8 990.3 550.5M991.1 247.5Q988.6 399.0 989.8 550.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 549.6Q499.5 551.6 8.0 550.0M992.1 549.3Q500.2 548.6 8.4 549.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 551.3Q12.0 400.2 10.1 249.1M9.5 552.4Q9.6 400.1 10.0 247.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="351.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">FitNesse (a success, started in 2001 by Martin and his son Micah): a wiki wrapping Ward Cunningham&#x27;s FIT acceptance-test tool, with the rule &#x27;Download and Go&#x27; (one</text><text x="500.0" y="373.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">jar). They wrote a simple web server of their own (postponing any web framework; Velocity came much later) and delayed the database by putting an interface, WikiPage,</text><text x="500.0" y="395.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">over data access: MockWikiPage (stubs) for three months of wiki-text-to-HTML work, InMemoryPage (a hash table in RAM) for a year of features, then FileSystemWikiPage</text><text x="500.0" y="417.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">(flat files), judged good enough three months later, so MySQL was deferred into nonexistence. A customer later wrote MySqlWikiPage in a day; it was bundled, then</text><text x="500.0" y="439.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">dropped. For 18 months there were no schema, query, server, password or connection issues and tests ran fast. The line between business rules and database let them</text><text x="500.0" y="461.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">defer and change direction without blocking the original direction.</text></svg>