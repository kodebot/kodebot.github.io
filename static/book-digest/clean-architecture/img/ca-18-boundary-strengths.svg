<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 145.3L10.7 144.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 79.7 495.0 146.2M494.9 12.9Q496.9 79.5 495.3 146.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 144.4Q252.6 147.2 8.7 144.5M496.4 144.7Q252.1 143.2 7.8 145.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 146.0Q10.0 79.3 10.1 12.7M10.2 145.9Q8.5 80.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="75.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Monolith (source level)</text><text x="252.5" y="97.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">no physical boundary; one executable; function calls; very chatty</text><path d="M504.1 14.9L990.2 14.7L990.7 144.7L506.0 144.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 79.6 989.3 146.3M989.2 13.5Q988.8 79.5 990.4 145.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 144.5Q747.1 145.0 502.9 144.1M990.9 145.2Q746.9 146.3 502.9 145.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 147.1Q507.7 80.5 505.3 13.9M504.8 147.0Q503.2 80.2 504.0 13.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="64.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Deployment components</text><text x="747.5" y="86.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">DLL, jar, Gem, shared library, delivered as binary; still one address space;</text><text x="747.5" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">function calls with a one-time load hit; chatty</text><path d="M11.1 159.0L495.3 160.4L495.5 288.8L9.4 291.1Z" fill="#f1ede5" stroke="none"/><path d="M8.4 159.4Q252.5 161.4 496.6 159.4M9.6 160.2Q252.5 160.6 495.5 160.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 159.2Q496.9 224.8 495.3 290.5M496.1 157.5Q493.6 224.0 494.8 290.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 289.6Q252.0 291.6 8.0 290.0M497.1 289.3Q252.7 288.6 8.4 289.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 291.3Q12.0 225.2 10.1 159.1M9.5 292.4Q9.6 225.1 10.0 157.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="220.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Threads not boundaries or units of deployment: a way to organise scheduling and</text><text x="252.5" y="242.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">execution order, inside one component or spread across many</text><path d="M504.3 160.1L991.1 160.8L991.1 291.1L504.7 288.8Z" fill="#efe0ca" stroke="none"/><path d="M503.5 160.8Q747.1 162.0 990.6 160.5M502.6 160.4Q746.9 162.4 991.1 160.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 158.1Q991.3 224.9 990.5 291.8M990.0 159.0Q990.6 224.8 989.1 290.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 290.4Q748.1 289.3 504.3 289.1M991.7 290.0Q747.5 288.7 503.3 289.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 292.0Q506.5 224.7 505.3 157.5M506.0 291.4Q507.1 225.4 504.0 159.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="198.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Local processes</text><text x="747.5" y="220.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">stronger: the same processor or cores but separate address spaces; sockets,</text><text x="747.5" y="242.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">mailboxes or message queues; a kind of uber-component; high-level source must not</text><text x="747.5" y="264.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">name low-level processes; moderately expensive, limit chattiness</text><path d="M9.1 304.1L989.6 304.3L989.6 435.2L9.4 435.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 304.3Q499.8 306.0 991.8 304.3M9.1 304.1Q500.1 307.8 991.2 305.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 304.4Q992.1 370.4 989.4 436.3M990.1 303.9Q990.8 370.2 990.0 436.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 435.6Q500.2 434.2 8.1 434.5M992.5 434.0Q500.2 434.8 7.9 434.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 436.0Q10.9 369.9 11.0 303.7M10.3 435.5Q10.2 369.3 9.6 303.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="343.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Services: the strongest boundary: a process independent of physical location, all communication over the network; very slow compared to function calls (tens of</text><text x="500.0" y="365.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">milliseconds to seconds), so avoid chatting and cope with latency; lower-level services plug into higher-level ones and the higher-level source must not hold any</text><text x="500.0" y="387.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">specific physical knowledge such as a URI. A service is often a facade for interacting local processes, and each service or process is a monolith of source components</text><text x="500.0" y="409.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or a set of deployment components.</text><path d="M9.5 449.2L989.1 450.5L990.6 549.4L9.8 551.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.0 449.5Q500.2 446.6 992.4 450.0M7.8 450.6Q500.1 451.6 992.4 450.2" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 447.6Q990.0 500.1 990.3 552.5M990.0 448.5Q988.6 500.2 990.9 552.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 550.9Q500.1 547.3 8.9 549.2M991.4 549.3Q500.2 546.8 9.0 550.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 552.5Q12.5 500.3 9.3 448.2M9.8 552.3Q12.1 500.3 9.7 448.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="495.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Most systems other than monoliths mix strategies, so boundaries are a mixture of local chatty ones and latency-driven ones; the same rule holds everywhere: source</text><text x="500.0" y="517.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">dependencies point the same way, toward the higher-level component.</text></svg>