<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="540" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 95.3L10.7 94.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.5 54.7 990.0 96.2M989.9 12.9Q991.4 54.5 990.3 96.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 94.4Q500.1 97.2 8.7 94.5M991.4 94.7Q499.6 93.2 7.8 95.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 96.0Q10.2 54.3 10.1 12.7M10.2 95.9Q8.8 55.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="50.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">The tests are part of the system and take part in the architecture; from an architectural view all tests are the same (tiny TDD tests, or large FitNesse, Cucumber,</text><text x="500.0" y="72.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">SpecFlow or JBehave tests)</text><path d="M9.1 109.9L495.2 109.7L495.7 279.7L11.0 279.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 109.3Q252.2 110.9 496.0 109.1M7.7 109.3Q252.1 111.7 496.5 109.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 107.9Q496.6 194.6 494.3 281.3M494.2 108.5Q493.8 194.5 495.4 280.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 279.5Q252.1 280.0 7.9 279.1M495.9 280.2Q251.9 281.3 7.9 280.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 282.1Q12.7 195.5 10.3 108.9M9.8 282.0Q8.2 195.2 9.0 108.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="146.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Tests as components</text><text x="252.5" y="168.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">tests follow the Dependency Rule: detailed, concrete, depending inward on the code</text><text x="252.5" y="190.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">under test; think of them as the outermost circle: nothing in the system depends on</text><text x="252.5" y="212.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">them; independently deployable (usually only in test systems); the most isolated</text><text x="252.5" y="234.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">component, not needed for operation; no less a component, and a model the rest</text><text x="252.5" y="256.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">should follow</text><path d="M506.1 109.0L990.3 110.4L990.5 278.8L504.4 281.1Z" fill="#eed5cc" stroke="none"/><path d="M503.4 109.4Q747.5 111.4 991.6 109.4M504.6 110.2Q747.5 110.6 990.5 110.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 109.2Q991.9 194.8 990.3 280.5M991.1 107.5Q988.6 194.0 989.8 280.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 279.6Q747.0 281.6 503.0 280.0M992.1 279.3Q747.7 278.6 503.4 279.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 281.3Q507.0 195.2 505.1 109.1M504.5 282.4Q504.6 195.1 505.0 107.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="157.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Fragile Tests Problem</text><text x="747.5" y="179.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">tests strongly coupled to the system must change with it: a change to a common</text><text x="747.5" y="201.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">component can break hundreds or thousands of tests; e.g. GUI-driven tests that log</text><text x="747.5" y="223.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">in and navigate pages break on any change to login or navigation; fragility makes</text><text x="747.5" y="245.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">the system rigid (a trivial navigation change that breaks 1000 tests gets resisted)</text><path d="M9.3 295.1L496.1 295.8L496.1 466.1L9.7 463.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 295.8Q252.1 297.0 495.6 295.5M7.6 295.4Q251.9 297.4 496.1 295.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 293.1Q496.3 379.9 495.5 466.8M495.0 294.0Q495.6 379.8 494.1 465.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 465.4Q253.1 464.3 9.3 464.1M496.7 465.0Q252.5 463.7 8.3 464.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 467.0Q11.5 379.7 10.3 292.5M11.0 466.4Q12.1 380.4 9.0 294.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="353.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Design for testability</text><text x="252.5" y="375.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">first rule: don&#x27;t depend on volatile things; GUIs are volatile, so GUI-driven</text><text x="252.5" y="397.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">suites are fragile: design system and tests so business rules are testable without</text><text x="252.5" y="419.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the GUI; treating tests as outside the design is catastrophic</text><path d="M504.1 294.1L989.6 294.3L989.6 465.2L504.4 465.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 294.3Q747.3 296.0 991.8 294.3M504.1 294.1Q747.6 297.8 991.2 295.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 294.4Q992.1 380.4 989.4 466.3M990.1 293.9Q990.8 380.2 990.0 466.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 465.6Q747.7 464.2 503.1 464.5M992.5 464.0Q747.7 464.8 502.9 464.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 466.0Q505.9 379.9 506.0 293.7M505.3 465.5Q505.2 379.3 504.6 293.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="331.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The testing API</text><text x="747.5" y="353.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a specific API with superpowers (bypass security, skip expensive resources like</text><text x="747.5" y="375.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">databases, force testable states), a superset of the interactors and interface</text><text x="747.5" y="397.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">adapters the UI uses; it decouples the structure of the tests from the structure of</text><text x="747.5" y="419.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">the application; keep dangerous parts in a separate, independently deployable</text><text x="747.5" y="441.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">component</text><path d="M9.5 479.2L989.1 480.5L990.6 534.4L9.8 536.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 479.5Q500.2 476.6 992.4 480.0M7.8 480.6Q500.1 481.6 992.4 480.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 477.6Q990.2 507.6 990.3 537.5M990.0 478.5Q989.2 507.7 990.9 537.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 535.9Q500.1 532.3 8.9 534.2M991.4 534.3Q500.2 531.8 9.0 535.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 537.5Q11.8 507.8 9.3 478.2M9.8 537.3Q11.4 507.8 9.7 478.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="502.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Structural coupling (a test class per production class, a test method per method) makes tests fragile and production code rigid; tests grow more concrete as production</text><text x="500.0" y="524.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">code grows more abstract and general, and strong coupling impedes that.</text></svg>