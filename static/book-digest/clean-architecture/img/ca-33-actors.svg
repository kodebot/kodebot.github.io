<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Video sales site (like cleancoders.com): four actors, so four primary sources of change (SRP)</text><path d="M9.1 89.9L245.2 89.7L245.7 239.7L11.0 239.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 89.3Q127.2 90.9 246.0 89.1M7.7 89.3Q127.1 91.7 246.5 89.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M244.9 87.9Q246.6 164.6 244.3 241.3M244.2 88.5Q243.8 164.5 245.4 240.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M246.3 239.5Q127.1 240.0 7.9 239.1M245.9 240.2Q126.9 241.3 7.9 240.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 242.1Q12.7 165.5 10.3 88.9M9.8 242.0Q8.2 165.2 9.0 88.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="127.5" y="149.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Viewers</text><text x="127.5" y="171.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">watch videos they or their company</text><text x="127.5" y="193.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">bought; View Catalog as Viewer</text><path d="M256.1 89.0L490.3 90.4L490.5 238.8L254.4 241.1Z" fill="#d0dfdc" stroke="none"/><path d="M253.4 89.4Q372.5 91.4 491.6 89.4M254.6 90.2Q372.5 90.6 490.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.9 89.2Q491.9 164.8 490.3 240.5M491.1 87.5Q488.6 164.0 489.8 240.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.1 239.6Q372.0 241.6 253.0 240.0M492.1 239.3Q372.7 238.6 253.4 239.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M255.6 241.3Q257.0 165.2 255.1 89.1M254.5 242.4Q254.6 165.1 255.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="372.5" y="116.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Purchasers</text><text x="372.5" y="138.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">individuals pay one price to stream and</text><text x="372.5" y="160.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">a higher one to download and own;</text><text x="372.5" y="182.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">businesses buy streaming-only licences</text><text x="372.5" y="204.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">in batches at quantity discounts; View</text><text x="372.5" y="226.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Catalog as Purchaser</text><path d="M499.3 90.1L736.1 90.8L736.1 241.1L499.7 238.8Z" fill="#d0dfdc" stroke="none"/><path d="M498.5 90.8Q617.1 92.0 735.6 90.5M497.6 90.4Q616.9 92.4 736.1 90.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M734.9 88.1Q736.3 164.9 735.5 241.8M735.0 89.0Q735.6 164.8 734.1 240.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M737.0 240.4Q618.1 239.3 499.3 239.1M736.7 240.0Q617.5 238.7 498.3 239.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M499.9 242.0Q501.5 164.7 500.3 87.5M501.0 241.4Q502.1 165.4 499.0 89.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="617.5" y="138.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Video authors</text><text x="617.5" y="160.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">supply video files, written descriptions</text><text x="617.5" y="182.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">and ancillary files (exams, problems,</text><text x="617.5" y="204.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">solutions, source code)</text><path d="M744.1 89.1L979.6 89.3L979.6 240.2L744.4 240.1Z" fill="#d0dfdc" stroke="none"/><path d="M742.7 89.3Q862.3 91.0 981.8 89.3M744.1 89.1Q862.6 92.8 981.2 90.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.0 89.4Q982.1 165.4 979.4 241.3M980.1 88.9Q980.8 165.2 980.0 241.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.4 240.6Q862.7 239.2 743.1 239.5M982.5 239.0Q862.7 239.8 742.9 239.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M745.9 241.0Q745.9 164.9 746.0 88.7M745.3 240.5Q745.2 164.3 744.6 88.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="862.5" y="138.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Administrators</text><text x="862.5" y="160.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">add video series, add and delete videos</text><text x="862.5" y="182.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">in a series, set prices for the various</text><text x="862.5" y="204.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">licences</text><path d="M9.5 254.2L989.1 255.5L990.6 334.4L9.8 336.2Z" fill="#efe0ca" stroke="none"/><path d="M8.0 254.5Q500.2 251.6 992.4 255.0M7.8 255.6Q500.1 256.6 992.4 255.2" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 252.6Q990.1 295.1 990.3 337.5M990.0 253.5Q988.9 295.2 990.9 337.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 335.9Q500.1 332.3 8.9 334.2M991.4 334.3Q500.2 331.8 9.0 335.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 337.5Q12.2 295.3 9.3 253.2M9.8 337.3Q11.8 295.3 9.7 253.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="290.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Abstract use case: View Catalog (dashed in the book&#x27;s notation) sets a general policy that View Catalog as Viewer and View Catalog as Purchaser flesh out; not strictly</text><text x="500.0" y="312.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">necessary, but the two are so similar it is wise to unify them early</text><path d="M11.0 349.5L990.5 349.4L989.4 421.1L8.8 419.1Z" fill="#f1ede5" stroke="none"/><path d="M8.7 348.9Q499.6 346.7 990.6 349.7M9.2 350.4Q500.8 349.5 992.4 350.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 348.5Q988.0 385.4 989.0 422.3M990.6 348.4Q990.9 385.1 990.7 421.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 419.2Q500.4 419.3 8.2 420.1M990.6 419.0Q500.0 421.3 9.4 419.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.8 421.2Q11.0 385.2 10.5 349.3M9.9 420.7Q8.6 384.1 8.9 347.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="391.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Log-in and log-out use cases are omitted to keep the chapter short; the list is not complete. Partition so a change for one actor does not affect the others.</text></svg>