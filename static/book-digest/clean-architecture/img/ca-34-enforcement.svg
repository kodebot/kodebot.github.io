<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 175.3L10.7 174.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.2 94.7 495.0 176.2M494.9 12.9Q496.9 94.5 495.3 176.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 174.4Q252.6 177.2 8.7 174.5M496.4 174.7Q252.1 173.2 7.8 175.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 176.0Q10.0 94.3 10.1 12.7M10.2 175.9Q8.5 95.1 9.1 14.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="57.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Relaxed layered architecture</text><text x="252.5" y="79.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a newcomer injects the OrdersRepository straight into the OrdersController,</text><text x="252.5" y="101.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">bypassing OrdersService; arrows still point downward and the graph stays acyclic,</text><text x="252.5" y="123.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">yet authorisation checks in the business layer are skipped (acceptable only on</text><text x="252.5" y="145.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">purpose, e.g. CQRS)</text><path d="M504.1 14.9L990.2 14.7L990.7 174.7L506.0 174.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.6 94.6 989.3 176.3M989.2 13.5Q988.8 94.5 990.4 175.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 174.5Q747.1 175.0 502.9 174.1M990.9 175.2Q746.9 176.3 502.9 175.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 177.1Q507.7 95.5 505.3 13.9M504.8 177.0Q503.2 95.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="57.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Enforcing the rule</text><text x="747.5" y="79.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">discipline and code review fail under deadline pressure; static analysis (NDepend,</text><text x="747.5" y="101.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Structure101, Checkstyle) after compilation is crude and has a long feedback loop;</text><text x="747.5" y="123.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">better to let the compiler enforce it, or the code base drifts into a big ball of</text><text x="747.5" y="145.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">mud</text><path d="M11.1 189.0L990.3 190.4L990.5 268.8L9.4 271.1Z" fill="#d3dbe0" stroke="none"/><path d="M8.4 189.4Q500.0 191.4 991.6 189.4M9.6 190.2Q500.0 190.6 990.5 190.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 189.2Q991.6 229.8 990.3 270.5M991.1 187.5Q989.2 229.0 989.8 270.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 269.6Q499.5 271.6 8.0 270.0M992.1 269.3Q500.2 268.6 8.4 269.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 271.3Q11.5 230.2 10.1 189.1M9.5 272.4Q9.6 230.1 10.0 187.8" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="225.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">The devil is in the implementation details: overuse of public makes packages mere folders; with all types public the four styles become identical arrows, effectively</text><text x="500.0" y="247.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">four descriptions of a horizontal layered architecture</text><path d="M9.3 285.1L496.1 285.8L496.1 501.1L9.7 498.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 285.8Q252.1 287.0 495.6 285.5M7.6 285.4Q251.9 287.4 496.1 285.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 283.1Q496.3 392.4 495.5 501.8M495.0 284.0Q495.6 392.3 494.1 500.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 500.4Q253.1 499.3 9.3 499.1M496.7 500.0Q252.5 498.7 8.3 499.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 502.0Q11.5 392.2 10.3 282.5M11.0 501.4Q12.1 392.9 9.0 284.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="343.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Access modifiers per style</text><text x="252.5" y="365.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">package by layer: the interfaces public, the implementations package-protected;</text><text x="252.5" y="387.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">package by feature: only the controller public; ports and adapters: interfaces</text><text x="252.5" y="409.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">public, implementations package-protected and injected; package by component: only</text><text x="252.5" y="431.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">OrdersComponent public, so nothing else can reach the repository (barring</text><text x="252.5" y="453.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">reflection); .NET: internal, with an assembly per component</text><path d="M504.1 284.1L989.6 284.3L989.6 500.2L504.4 500.1Z" fill="#d0dfdc" stroke="none"/><path d="M502.7 284.3Q747.3 286.0 991.8 284.3M504.1 284.1Q747.6 287.8 991.2 285.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 284.4Q992.1 392.9 989.4 501.3M990.1 283.9Q990.8 392.7 990.0 501.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 500.6Q747.7 499.2 503.1 499.5M992.5 499.0Q747.7 499.8 502.9 499.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 501.0Q505.9 392.4 506.0 283.7M505.3 500.5Q505.2 391.8 504.6 283.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="343.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Other decoupling modes</text><text x="747.5" y="365.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">module systems (OSGi, Java 9 modules) distinguish public from published types;</text><text x="747.5" y="387.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">separate source trees per concern (domain, web, persistence) in Maven, Gradle or</text><text x="747.5" y="409.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">MSBuild, idealistic per component; two trees (domain and infrastructure) risk the</text><text x="747.5" y="431.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Peripherique anti-pattern, where infrastructure code calls other infrastructure</text><text x="747.5" y="453.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">directly around the domain, like Paris&#x27;s ring road</text></svg>