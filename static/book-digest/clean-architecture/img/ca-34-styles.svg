<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Four ways to organise the same &#x27;view orders&#x27; use case (online book store; Java; principles apply to other languages)</text><path d="M9.1 89.9L495.2 89.7L495.7 284.7L11.0 284.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 89.3Q252.2 90.9 496.0 89.1M7.7 89.3Q252.1 91.7 496.5 89.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 87.9Q496.6 187.1 494.3 286.3M494.2 88.5Q493.8 187.0 495.4 285.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 284.5Q252.1 285.0 7.9 284.1M495.9 285.2Q251.9 286.3 7.9 285.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 287.1Q12.7 188.0 10.3 88.9M9.8 287.0Q8.2 187.7 9.0 88.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="160.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Package by layer</text><text x="252.5" y="182.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">horizontal slices: web, service, data; OrdersController, OrdersService (interface),</text><text x="252.5" y="204.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">OrdersServiceImpl, OrdersRepository, JdbcOrdersRepository; strict layering depends</text><text x="252.5" y="226.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">only on the adjacent lower layer; quick to start, but says nothing about the domain</text><path d="M506.1 89.0L990.3 90.4L990.5 283.8L504.4 286.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 89.4Q747.5 91.4 991.6 89.4M504.6 90.2Q747.5 90.6 990.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 187.3 990.3 285.5M991.1 87.5Q988.6 186.5 989.8 285.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 284.6Q747.0 286.6 503.0 285.0M992.1 284.3Q747.7 283.6 503.4 284.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 286.3Q507.0 187.7 505.1 89.1M504.5 287.4Q504.6 187.6 505.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="160.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Package by feature</text><text x="747.5" y="182.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">vertical slice: the same types in one package named for the concept (orders);</text><text x="747.5" y="204.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">screams the domain and keeps a use case&#x27;s code together; both of these are</text><text x="747.5" y="226.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">suboptimal</text><path d="M9.3 300.1L496.1 300.8L496.1 496.1L9.7 493.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 300.8Q252.1 302.0 495.6 300.5M7.6 300.4Q251.9 302.4 496.1 300.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 298.1Q496.3 397.4 495.5 496.8M495.0 299.0Q495.6 397.3 494.1 495.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 495.4Q253.1 494.3 9.3 494.1M496.7 495.0Q252.5 493.7 8.3 494.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 497.0Q11.5 397.2 10.3 297.5M11.0 496.4Q12.1 397.9 9.0 299.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="370.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Ports and adapters</text><text x="252.5" y="392.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">an inside (domain) and an outside (infrastructure, UIs, databases) with outside</text><text x="252.5" y="414.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">depending on inside; the repository becomes Orders in the ubiquitous language;</text><text x="252.5" y="436.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">simplified, as interactors and data marshalling are missing</text><path d="M504.1 299.1L989.6 299.3L989.6 495.2L504.4 495.1Z" fill="#d3dbe0" stroke="none"/><path d="M502.7 299.3Q747.3 301.0 991.8 299.3M504.1 299.1Q747.6 302.8 991.2 300.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 299.4Q992.1 397.9 989.4 496.3M990.1 298.9Q990.8 397.7 990.0 496.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 495.6Q747.7 494.2 503.1 494.5M992.5 494.0Q747.7 494.8 502.9 494.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 496.0Q505.9 397.4 506.0 298.7M505.3 495.5Q505.2 396.8 504.6 298.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="370.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Package by component</text><text x="747.5" y="392.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">bundle business logic and persistence behind one coarse-grained component</text><text x="747.5" y="414.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">(OrdersComponent) with the UI kept separate; one place to go for orders; a stepping</text><text x="747.5" y="436.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">stone to micro-services</text><path d="M9.5 504.2L989.1 505.5L990.6 514.4L9.8 516.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 504.5Q500.2 501.6 992.4 505.0M7.8 505.6Q500.1 506.6 992.4 505.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 502.6Q990.4 510.1 990.3 517.5M990.0 503.5Q989.7 510.2 990.9 517.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 515.9Q500.1 512.3 8.9 514.2M991.4 514.3Q500.2 511.8 9.0 515.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 517.5Q11.1 510.3 9.3 503.2M9.8 517.3Q10.7 510.3 9.7 503.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="516.0" font-size="17.0" fill="#3b2f20" text-anchor="middle"></text></svg>