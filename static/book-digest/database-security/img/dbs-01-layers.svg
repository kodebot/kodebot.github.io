<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M21.1 15.0L980.3 15.4L978.9 85.3L20.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M18.5 15.0Q500.1 15.0 981.8 14.6M19.5 15.4Q500.5 14.6 981.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.8 13.3Q979.6 49.7 980.0 86.2M979.9 12.9Q981.3 49.5 980.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.5 84.4Q500.1 87.2 18.7 84.5M981.4 84.7Q499.6 83.2 17.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 86.0Q20.2 49.3 20.1 12.7M20.2 85.9Q18.9 50.1 19.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="34.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1. Network isolation</text><text x="500.0" y="56.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">dedicated internal segment, bind to localhost or socket,</text><text x="500.0" y="78.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">firewall to specific hosts; clients reach it through an API</text><path d="M19.1 94.9L980.2 94.7L980.7 164.7L21.0 164.8Z" fill="#d0dfdc" stroke="none"/><path d="M18.4 94.3Q499.7 95.9 981.0 94.1M17.7 94.3Q499.6 96.7 981.5 94.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 92.9Q980.9 129.6 979.3 166.3M979.2 93.5Q979.1 129.5 980.4 165.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 164.5Q499.6 165.0 17.9 164.1M980.9 165.2Q499.4 166.3 17.9 165.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.2 167.1Q21.9 130.5 20.3 93.9M19.8 167.0Q18.6 130.2 19.0 93.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="114.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2. Transport protection</text><text x="500.0" y="136.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">encrypted connections only, trusted certificate,</text><text x="500.0" y="158.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">TLS 1.2+ with modern ciphers, client verifies the certificate</text><path d="M21.1 174.0L980.3 175.4L980.5 243.8L19.4 246.1Z" fill="#d6e1cf" stroke="none"/><path d="M18.4 174.4Q500.0 176.4 981.6 174.4M19.6 175.2Q500.0 175.6 980.5 175.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 174.2Q981.5 209.8 980.3 245.5M981.1 172.5Q979.3 209.0 979.8 245.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 244.6Q499.5 246.6 18.0 245.0M982.1 244.3Q500.2 243.6 18.4 244.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.6 246.3Q21.4 210.2 20.1 174.1M19.5 247.4Q19.7 210.1 20.0 172.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="194.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3. Authentication</text><text x="500.0" y="216.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">always required, even locally; one account per application,</text><text x="500.0" y="238.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">strong unique passwords, credentials outside code and web root</text><path d="M19.3 255.1L981.1 255.8L981.1 326.1L19.7 323.8Z" fill="#efe0ca" stroke="none"/><path d="M18.5 255.8Q499.6 257.0 980.6 255.5M17.6 255.4Q499.4 257.4 981.1 255.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 253.1Q980.9 289.9 980.5 326.8M980.0 254.0Q980.3 289.8 979.1 325.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 325.4Q500.6 324.3 19.3 324.1M981.7 325.0Q500.0 323.7 18.3 324.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 327.0Q21.0 289.7 20.3 252.5M21.0 326.4Q21.4 290.4 19.0 254.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="274.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">4. Permissions</text><text x="500.0" y="296.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">least privilege: no root, sa or SYS; only needed grants;</text><text x="500.0" y="318.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">separate databases and accounts per environment; views for narrow access</text><path d="M19.1 334.1L979.6 334.3L979.6 405.2L19.4 405.1Z" fill="#eed5cc" stroke="none"/><path d="M17.7 334.3Q499.8 336.0 981.8 334.3M19.1 334.1Q500.1 337.8 981.2 335.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.0 334.4Q981.3 370.4 979.4 406.3M980.1 333.9Q980.6 370.2 980.0 406.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.4 405.6Q500.2 404.2 18.1 404.5M982.5 404.0Q500.2 404.8 17.9 404.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 406.0Q20.9 369.9 21.0 333.7M20.3 405.5Q20.1 369.3 19.6 333.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="354.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">5. Hardening and recovery</text><text x="500.0" y="376.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">patch, low-privilege service account, remove defaults,</text><text x="500.0" y="398.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">separate transaction log disk, protected and encrypted backups</text><text x="500" y="422" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">Database security cheat sheet: five layers around the database</text></svg>