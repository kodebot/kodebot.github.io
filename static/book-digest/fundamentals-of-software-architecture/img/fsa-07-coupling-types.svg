<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#ffffff"/><path d="M16.1 40.0L245.3 40.4L243.9 150.3L15.7 149.2Z" fill="#d6e5f4" stroke="none"/><path d="M13.5 40.0Q130.1 40.0 246.8 39.6M14.5 40.4Q130.5 39.6 246.5 40.9" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M245.8 38.3Q244.3 94.7 245.0 151.2M244.9 37.9Q246.7 94.5 245.3 151.0" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M246.5 149.4Q130.1 152.2 13.7 149.5M246.4 149.7Q129.6 148.2 12.8 150.1" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.9 151.0Q15.1 94.3 15.1 37.7M15.2 150.9Q13.6 95.1 14.1 39.3" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="130.0" y="90.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">Semantic coupling</text><text x="130.0" y="112.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">the problem&#x27;s own coupling</text><path d="M259.1 39.9L490.2 39.7L490.7 149.7L261.0 149.8Z" fill="#d3e9ed" stroke="none"/><path d="M258.4 39.3Q374.7 40.9 491.0 39.1M257.7 39.3Q374.6 41.7 491.5 39.5" fill="none" stroke="#0c8599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 37.9Q491.4 94.6 489.3 151.3M489.2 38.5Q488.9 94.5 490.4 150.6" fill="none" stroke="#0c8599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 149.5Q374.6 150.0 257.9 149.1M490.9 150.2Q374.4 151.3 257.9 150.4" fill="none" stroke="#0c8599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M260.2 152.1Q262.4 95.5 260.3 38.9M259.8 152.0Q258.4 95.2 259.0 38.5" fill="none" stroke="#0c8599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="375.0" y="90.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">Implementation coupling</text><text x="375.0" y="112.0" font-size="13.0" fill="#1e1e1e" text-anchor="middle">how the team chooses to wire it</text><path d="M506.1 39.0L735.3 40.4L735.5 148.8L504.4 151.1Z" fill="#daeedd" stroke="none"/><path d="M503.4 39.4Q620.0 41.4 736.6 39.4M504.6 40.2Q620.0 40.6 735.5 40.1" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M735.9 39.2Q736.8 94.8 735.3 150.5M736.1 37.5Q733.9 94.0 734.8 150.5" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M736.1 149.6Q619.5 151.6 503.0 150.0M737.1 149.3Q620.2 148.6 503.4 149.7" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 151.3Q506.8 95.2 505.1 39.1M504.5 152.4Q504.6 95.1 505.0 37.8" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="620.0" y="79.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">Static coupling</text><text x="620.0" y="101.0" font-size="14.0" fill="#1e1e1e" text-anchor="middle">shared coupling point puts two</text><text x="620.0" y="123.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">services in one quantum</text><path d="M749.3 40.1L981.1 40.8L981.1 151.1L749.7 148.8Z" fill="#fbeed1" stroke="none"/><path d="M748.5 40.8Q864.6 42.0 980.6 40.5M747.6 40.4Q864.4 42.4 981.1 40.6" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 38.1Q981.2 94.9 980.5 151.8M980.0 39.0Q980.5 94.8 979.1 150.7" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 150.4Q865.6 149.3 749.3 149.1M981.7 150.0Q865.0 148.7 748.3 149.4" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M749.9 152.0Q751.3 94.7 750.3 37.5M751.0 151.4Q751.9 95.4 749.0 39.5" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="865.0" y="90.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">Dynamic coupling</text><text x="865.0" y="112.0" font-size="13.0" fill="#1e1e1e" text-anchor="middle">forces when quanta communicate</text><text x="500" y="200" font-size="18" font-weight="400" fill="#1e1e1e" text-anchor="middle">two things are coupled if changing one might break the other</text><text x="500" y="235" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle">static coupling defines the scope of dependencies; quanta should have low external implementation coupling</text><text x="500" y="262" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle">higher coupling is allowed for narrower scopes; the broader the scope, the looser it should be</text></svg>