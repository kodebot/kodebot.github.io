<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="460" fill="#fbf7ef"/><text x="500" y="22" font-size="17" font-weight="400" fill="#3b2f20" text-anchor="middle">Figure 24-3: the room of constraints the architect builds</text><path d="M111.1 50.0L240.3 50.4L238.9 160.3L110.7 159.2Z" fill="#eed5cc" stroke="none"/><path d="M108.5 50.0Q175.1 50.0 241.8 49.6M109.5 50.4Q175.5 49.6 241.5 50.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M240.8 48.3Q239.3 104.7 240.0 161.2M239.9 47.9Q241.7 104.5 240.3 161.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M241.5 159.4Q175.1 162.2 108.7 159.5M241.4 159.7Q174.6 158.2 107.8 160.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M110.9 161.0Q110.1 104.3 110.1 47.7M110.2 160.9Q108.6 105.1 109.1 49.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="175.0" y="111.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Too tight</text><text x="175" y="320" font-size="15" font-weight="400" fill="#3b2f20" text-anchor="middle">control freak: too many constraints</text><text x="175" y="344" font-size="15" font-weight="400" fill="#3b2f20" text-anchor="middle">no tools, libraries or practices;</text><text x="175" y="368" font-size="15" font-weight="400" fill="#3b2f20" text-anchor="middle">frustration, developers leave</text><path d="M384.1 49.9L615.2 49.7L615.7 219.7L386.0 219.8Z" fill="#d6e1cf" stroke="none"/><path d="M383.4 49.3Q499.7 50.9 616.0 49.1M382.7 49.3Q499.6 51.7 616.5 49.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M