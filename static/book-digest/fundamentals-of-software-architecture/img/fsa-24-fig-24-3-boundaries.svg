xt><text x="825" y="344" font-size="15" font-weight="400" fill="#3b2f20" text-anchor="middle">team must act as architect;</text><text x="825" y="368" font-size="15" font-weight="400" fill="#3b2f20" text-anchor="middle">proofs of concept, confusion</text></svg>