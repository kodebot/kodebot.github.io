<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><rect x="15" y="90" width="140" height="100" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="85.0" y="125.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Commit</text><text x="85.0" y="145.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">push or pull</text><text x="85.0" y="165.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">request</text><line x1="155" y1="140" x2="175" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="175" y="90" width="140" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="245.0" y="135.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Lint + tests</text><text x="245.0" y="155.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">fast feedback</text><line x1="315" y1="140" x2="335" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="335" y="90" width="140" height="100" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="405.0" y="125.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Fitness tests</text><text x="405.0" y="145.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">architecture</text><text x="405.0" y="165.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">rules that block</text><line x1="475" y1="140" x2="495" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="495" y="90" width="140" height="100" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="565.0" y="125.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Build image</text><text x="565.0" y="145.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">immutable, tagged</text><text x="565.0" y="165.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">with git SHA</text><line x1="635" y1="140" x2="655" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="655" y="90" width="140" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="725.0" y="135.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Dev</text><text x="725.0" y="155.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">same image</text><line x1="795" y1="140" x2="815" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="815" y="90" width="140" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="885.0" y="125.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Production</text><text x="885.0" y="145.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">dark launch,</text><text x="885.0" y="165.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">canary, flags</text><rect x="15" y="230" width="950" height="60" rx="8" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="255.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Build once, promote the same image. A failing gate stops the belt.</text><text x="490.0" y="275.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Rollback = re-point traffic to the previous image.</text><text x="15" y="60" font-size="15" font-weight="700" fill="#14324f">CI (verify and bake)</text><text x="655" y="60" font-size="15" font-weight="700" fill="#14324f">CD (promote and release)</text></svg>