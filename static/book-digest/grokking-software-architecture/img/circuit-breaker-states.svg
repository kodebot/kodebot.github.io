<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="340" fill="#ffffff"/><circle cx="150" cy="230" r="75" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="150" y="226" font-size="17" font-weight="700" fill="#134a26" text-anchor="middle">Closed</text><text x="150" y="246" font-size="12" font-weight="400" fill="#134a26" text-anchor="middle">calls flow,</text><text x="150" y="266" font-size="12" font-weight="400" fill="#134a26" text-anchor="middle">failures counted</text><circle cx="490" cy="90" r="75" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="490" y="86" font-size="17" font-weight="700" fill="#6b1c1c" text-anchor="middle">Open</text><text x="490" y="106" font-size="12" font-weight="400" fill="#6b1c1c" text-anchor="middle">fail fast,</text><text x="490" y="126" font-size="12" font-weight="400" fill="#6b1c1c" text-anchor="middle">no calls sent</text><circle cx="830" cy="230" r="75" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="830" y="226" font-size="17" font-weight="700" fill="#5c4007" text-anchor="middle">Half-open</text><text x="830" y="246" font-size="12" font-weight="400" fill="#5c4007" text-anchor="middle">one test request</text><text x="830" y="266" font-size="12" font-weight="400" fill="#5c4007" text-anchor="middle">fail: reopen</text><line x1="195" y1="170" x2="445" y2="120" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="250" y="125" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">failures over threshold</text><line x1="535" y1="120" x2="785" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="740" y="125" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">cooldown elapses</text><line x1="755" y1="255" x2="225" y2="255" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490.0" y="282" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">test succeeds: reset to Closed</text></svg>