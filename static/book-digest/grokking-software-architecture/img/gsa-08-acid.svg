f-done maths</text><path d="M749.3 60.1L976.1 60.8L976.1 221.1L749.7 218.8Z" fill="#d6e5f4" stroke="none"/><path d="M748.5 60.8Q862.1 62.0 975.6 60.5M747.6 60.4Q861.9 62.4 976.1 60.6" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M974.9 58.1Q976.3 139.9 975.5 221.8M975.0 59.0Q975.6 139.8 974.1 220.7" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M977.0 220.4Q863.1 219.3 749.3 219.1M976.7 220.0Q862.5 218.7 748.3 219.4" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M749.9 222.0Q751.5 139.7 750.3 57.5M751.0 221.4Q752.1 140.4 749.0 59.5" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="862.5" y="113.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">Durability</text><text x="862.5" y="135.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">committed means</text><text x="862.5" y="157.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">permanent: survives</text><text x="862.5" y="179.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">a server fire</text><text x="500" y="265" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle">durability is not a backup: a DELETE with no WHERE is durably deleted</text><text x="500" y="290" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">isolation is a dial: Serializable (strict, slow) to Read Uncommitted (dirty reads)</text></svg>