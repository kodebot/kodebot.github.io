<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 85.3L10.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.6 49.7 990.0 86.2M989.9 12.9Q991.3 49.5 990.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 84.4Q500.1 87.2 8.7 84.5M991.4 84.7Q499.6 83.2 7.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 86.0Q10.2 49.3 10.1 12.7M10.2 85.9Q8.9 50.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="45.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Cultural intelligence (CQ): the ability to make sense of unfamiliar contexts and blend in; it picks up where emotional intelligence leaves off by separating what is</text><text x="500.0" y="67.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">universal, what is individual, and what is cultural</text><path d="M9.1 99.9L330.2 99.7L330.7 289.7L11.0 289.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 99.3Q169.7 100.9 331.0 99.1M7.7 99.3Q169.6 101.7 331.5 99.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 97.9Q331.6 194.6 329.3 291.3M329.2 98.5Q328.8 194.5 330.4 290.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 289.5Q169.6 290.0 7.9 289.1M330.9 290.2Q169.4 291.3 7.9 290.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 292.1Q12.7 195.5 10.3 98.9M9.8 292.0Q8.2 195.2 9.0 98.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="157.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Head (cognitive)</text><text x="170.0" y="179.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">devise learning strategies, notice clues to shared</text><text x="170.0" y="201.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">understanding and infer patterns from observed</text><text x="170.0" y="223.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">behaviour, as Devin did by looking for consistencies</text><text x="170.0" y="245.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">across many client representatives</text><path d="M341.1 99.0L660.3 100.4L660.5 288.8L339.4 291.1Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 99.4Q500.0 101.4 661.6 99.4M339.6 100.2Q500.0 100.6 660.5 100.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 99.2Q661.9 194.8 660.3 290.5M661.1 97.5Q658.6 194.0 659.8 290.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 289.6Q499.5 291.6 338.0 290.0M662.1 289.3Q500.2 288.6 338.4 289.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 291.3Q342.0 195.2 340.1 99.1M339.5 292.4Q339.6 195.1 340.0 97.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="157.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Body (physical)</text><text x="500.0" y="179.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">mirror customs and gestures: handshake, distance,</text><text x="500.0" y="201.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">speech style; research found candidates who adopted a</text><text x="500.0" y="223.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">recruiter&#x27;s mannerisms were more likely to get offers;</text><text x="500.0" y="245.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">it needs physical poise and no deep reservation</text><path d="M669.3 100.1L991.1 100.8L991.1 291.1L669.7 288.8Z" fill="#efe0ca" stroke="none"/><path d="M668.5 100.8Q829.6 102.0 990.6 100.5M667.6 100.4Q829.4 102.4 991.1 100.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 98.1Q991.3 194.9 990.5 291.8M990.0 99.0Q990.6 194.8 989.1 290.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 290.4Q830.6 289.3 669.3 289.1M991.7 290.0Q830.0 288.7 668.3 289.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 292.0Q671.5 194.7 670.3 97.5M671.0 291.4Q672.1 195.4 669.0 99.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="168.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Heart (emotional and motivational)</text><text x="830.0" y="190.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">belief in your own efficacy, built by past mastery;</text><text x="830.0" y="212.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">persist after setbacks, as Hyong Moon did after a</text><text x="830.0" y="234.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">public conflict on a cross-functional team</text><path d="M9.1 304.1L989.6 304.3L989.6 405.2L9.4 405.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 304.3Q499.8 306.0 991.8 304.3M9.1 304.1Q500.1 307.8 991.2 305.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 304.4Q991.7 355.4 989.4 406.3M990.1 303.9Q990.7 355.2 990.0 406.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 405.6Q500.2 404.2 8.1 404.5M992.5 404.0Q500.2 404.8 7.9 404.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 406.0Q10.9 354.9 11.0 303.7M10.3 405.5Q10.2 354.3 9.6 303.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="350.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Peter&#x27;s trouble at Lilly maps to all three: he did not grasp how the landscape had changed (head), could not align his behaviour with everyone else&#x27;s (body), and became</text><text x="500.0" y="372.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">disheartened (heart). Each faculty is hampered without the other two.</text><path d="M9.5 419.2L989.1 420.5L990.6 509.4L9.8 511.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 419.5Q500.2 416.6 992.4 420.0M7.8 420.6Q500.1 421.6 992.4 420.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 417.6Q990.1 465.1 990.3 512.5M990.0 418.5Q988.7 465.2 990.9 512.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 510.9Q500.1 507.3 8.9 509.2M991.4 509.3Q500.2 506.8 9.0 510.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 512.5Q12.4 465.3 9.3 418.2M9.8 512.3Q11.9 465.3 9.7 418.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="460.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Diagnosis: twelve statements, four per component, scored 1 to 5 and averaged; an average under 3 calls for improvement, over 4.5 is a true strength; compare your three</text><text x="500.0" y="482.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">scores with one another, since a high absolute score is not the objective.</text></svg>