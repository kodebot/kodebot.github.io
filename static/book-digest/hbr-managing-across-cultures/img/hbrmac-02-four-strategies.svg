<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Four strategies, in order of preference; choose by the &#x27;enabling situational conditions&#x27; (flexibility, resources, permanent or temporary team, manager&#x27;s autonomy)</text><path d="M9.1 89.9L495.2 89.7L495.7 259.7L11.0 259.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 89.3Q252.2 90.9 496.0 89.1M7.7 89.3Q252.1 91.7 496.5 89.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 87.9Q496.6 174.6 494.3 261.3M494.2 88.5Q493.8 174.5 495.4 260.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 259.5Q252.1 260.0 7.9 259.1M495.9 260.2Q251.9 261.3 7.9 260.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 262.1Q12.7 175.5 10.3 88.9M9.8 262.0Q8.2 175.2 9.0 88.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="148.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Adaptation (ideal)</text><text x="252.5" y="170.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">team members name the differences and work with or around them, learning as they</text><text x="252.5" y="192.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">go; the American engineer saw Israelis argued with each other, not just him; a US</text><text x="252.5" y="214.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and UK team fused fast and careful approaches</text><path d="M506.1 89.0L990.3 90.4L990.5 258.8L504.4 261.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 89.4Q747.5 91.4 991.6 89.4M504.6 90.2Q747.5 90.6 990.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 174.8 990.3 260.5M991.1 87.5Q988.6 174.0 989.8 260.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 259.6Q747.0 261.6 503.0 260.0M992.1 259.3Q747.7 258.6 503.4 259.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 261.3Q507.0 175.2 505.1 89.1M504.5 262.4Q504.6 175.1 505.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="159.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Structural intervention</text><text x="747.5" y="181.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">reorganise to cut friction: a leader hired a consultant to run meetings because</text><text x="747.5" y="203.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">staff shut down around him; mixed small groups, with a mediator to join the pieces</text><path d="M9.3 270.1L496.1 270.8L496.1 441.1L9.7 438.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 270.8Q252.1 272.0 495.6 270.5M7.6 270.4Q251.9 272.4 496.1 270.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 268.1Q496.3 354.9 495.5 441.8M495.0 269.0Q495.6 354.8 494.1 440.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 440.4Q253.1 439.3 9.3 439.1M496.7 440.0Q252.5 438.7 8.3 439.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 442.0Q11.5 354.7 10.3 267.5M11.0 441.4Q12.1 355.4 9.0 269.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="328.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Managerial intervention</text><text x="252.5" y="350.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">rarely, and best early to set norms: a manager told staff they were chosen for</text><text x="252.5" y="372.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">expertise, not English fluency, and to say &#x27;I realize I have an accent; stop me and</text><text x="252.5" y="394.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">ask questions&#x27;; or escalate respecting both hierarchies</text><path d="M504.1 269.1L989.6 269.3L989.6 440.2L504.4 440.1Z" fill="#eed5cc" stroke="none"/><path d="M502.7 269.3Q747.3 271.0 991.8 269.3M504.1 269.1Q747.6 272.8 991.2 270.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 269.4Q992.1 355.4 989.4 441.3M990.1 268.9Q990.8 355.2 990.0 441.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 440.6Q747.7 439.2 503.1 439.5M992.5 439.0Q747.7 439.8 502.9 439.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 441.0Q505.9 354.9 506.0 268.7M505.3 440.5Q505.2 354.3 504.6 268.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="339.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Exit</text><text x="747.5" y="361.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">last resort when emotions are high and too much face is lost: a Greek and a Polish</text><text x="747.5" y="383.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consultant disagreed and one left the firm</text><path d="M9.5 449.2L989.1 450.5L990.6 509.4L9.8 511.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 449.5Q500.2 446.6 992.4 450.0M7.8 450.6Q500.1 451.6 992.4 450.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 447.6Q990.2 480.1 990.3 512.5M990.0 448.5Q989.1 480.2 990.9 512.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 510.9Q500.1 507.3 8.9 509.2M991.4 509.3Q500.2 506.8 9.0 510.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 512.5Q11.9 480.3 9.3 448.2M9.8 512.3Q11.5 480.3 9.7 448.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="475.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Examples of teams solving it themselves: a call-centre team covered an employee&#x27;s long chatty calls; an Indian manager ran an eBusiness road show to build consensus in</text><text x="500.0" y="497.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Japan without going up the hierarchy.</text></svg>