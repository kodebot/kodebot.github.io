<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 95.3L10.7 94.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.5 54.7 990.0 96.2M989.9 12.9Q991.4 54.5 990.3 96.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 94.4Q500.1 97.2 8.7 94.5M991.4 94.7Q499.6 93.2 7.8 95.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 96.0Q10.2 54.3 10.1 12.7M10.2 95.9Q8.8 55.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="50.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">L&#x27;Oreal&#x27;s answer to the global-local tension: build product-development teams around managers with mixed cultural backgrounds, who can switch among the norms of several</text><text x="500.0" y="72.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">cultures; they were over a third of team managers in L&#x27;Oreal Paris for more than 10 years</text><path d="M9.1 109.9L330.2 109.7L330.7 239.7L11.0 239.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 109.3Q169.7 110.9 331.0 109.1M7.7 109.3Q169.6 111.7 331.5 109.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 107.9Q331.6 174.6 329.3 241.3M329.2 108.5Q328.8 174.5 330.4 240.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 239.5Q169.6 240.0 7.9 239.1M330.9 240.2Q169.4 241.3 7.9 240.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 242.1Q12.7 175.5 10.3 108.9M9.8 242.0Q8.2 175.2 9.0 108.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="148.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Spot opportunities</text><text x="170.0" y="170.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a French-Irish-Cambodian manager saw Asian tinted</text><text x="170.0" y="192.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">creams that also lift and launched one in France; &#x27;I</text><text x="170.0" y="214.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">cannot think about things in one way&#x27;</text><path d="M341.1 109.0L660.3 110.4L660.5 238.8L339.4 241.1Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 109.4Q500.0 111.4 661.6 109.4M339.6 110.2Q500.0 110.6 660.5 110.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 109.2Q661.9 174.8 660.3 240.5M661.1 107.5Q658.6 174.0 659.8 240.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 239.6Q499.5 241.6 338.0 240.0M662.1 239.3Q500.2 238.6 338.4 239.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 241.3Q342.0 175.2 340.1 109.1M339.5 242.4Q339.6 175.1 340.0 107.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="137.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Prevent loss in translation</text><text x="500.0" y="159.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">a French hair-feature test failed because the German</text><text x="500.0" y="181.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">lab heard something different from what was meant; a</text><text x="500.0" y="203.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">multicultural manager found the gap, after a costly</text><text x="500.0" y="225.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">rerun</text><path d="M669.3 110.1L991.1 110.8L991.1 241.1L669.7 238.8Z" fill="#d0dfdc" stroke="none"/><path d="M668.5 110.8Q829.6 112.0 990.6 110.5M667.6 110.4Q829.4 112.4 991.1 110.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 108.1Q991.3 174.9 990.5 241.8M990.0 109.0Q990.6 174.8 989.1 240.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 240.4Q830.6 239.3 669.3 239.1M991.7 240.0Q830.0 238.7 668.3 239.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 242.0Q671.5 174.7 670.3 107.5M671.0 241.4Q672.1 175.4 669.0 109.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="148.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Integrate outsiders</text><text x="830.0" y="170.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">a complaint that a Shanghai newcomer was &#x27;very rude&#x27;</text><text x="830.0" y="192.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">turned out to be directness without bad intention;</text><text x="830.0" y="214.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">advice to adapt both ways</text><path d="M9.1 249.1L329.6 249.3L329.6 380.2L9.4 380.1Z" fill="#d0dfdc" stroke="none"/><path d="M7.7 249.3Q169.8 251.0 331.8 249.3M9.1 249.1Q170.1 252.8 331.2 250.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.0 249.4Q332.1 315.4 329.4 381.3M330.1 248.9Q330.8 315.2 330.0 381.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M332.4 380.6Q170.2 379.2 8.1 379.5M332.5 379.0Q170.2 379.8 7.9 379.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 381.0Q10.9 314.9 11.0 248.7M10.3 380.5Q10.2 314.3 9.6 248.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="288.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Mediate with bosses</text><text x="170.0" y="310.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">a French boss never starts on time, so the team leader</text><text x="170.0" y="332.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">explains delays in advance and handles conflicts more</text><text x="170.0" y="354.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">tolerantly</text><path d="M339.5 249.2L659.1 250.5L660.6 379.4L339.8 381.2Z" fill="#efe0ca" stroke="none"/><path d="M338.0 249.5Q500.2 246.6 662.4 250.0M337.8 250.6Q500.1 251.6 662.4 250.2" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.0 247.6Q659.9 315.1 660.3 382.5M660.0 248.5Q658.2 315.2 660.9 382.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 380.9Q500.1 377.3 338.9 379.2M661.4 379.3Q500.2 376.8 339.0 380.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.9 382.5Q343.0 315.3 339.3 248.2M339.8 382.3Q342.6 315.3 339.7 248.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="288.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Bridge subsidiary and headquarters</text><text x="500.0" y="310.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">India&#x27;s &#x27;we&#x27;ll do our best&#x27; meant they would not do it;</text><text x="500.0" y="332.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">the leader found a substitute ingredient instead of</text><text x="500.0" y="354.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">escalating</text><path d="M11.0 399.5L990.5 399.4L989.4 551.1L8.8 549.1Z" fill="#f1ede5" stroke="none"/><path d="M8.7 398.9Q499.6 396.7 990.6 399.7M9.2 400.4Q500.8 399.5 992.4 400.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 398.5Q987.5 475.4 989.0 552.3M990.6 398.4Q991.0 475.1 990.7 551.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 549.2Q500.4 549.3 8.2 550.1M990.6 549.0Q500.0 551.3 9.4 549.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.8 551.2Q11.4 475.2 10.5 399.3M9.9 550.7Q8.2 474.1 8.9 397.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="459.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Roles 1 and 2 can be trained; roles 3 to 5 rest on skills from early life, so are harder to teach. Others can partly learn from training with multiculturals and</text><text x="500.0" y="481.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">repatriates, coaching, language and semantics training and leadership in a foreign language; beware short-term rotations, which dull cultural sensitivity by focusing on</text><text x="500.0" y="503.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">what is common.</text></svg>