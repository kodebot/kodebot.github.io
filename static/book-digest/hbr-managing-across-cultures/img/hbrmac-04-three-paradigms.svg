<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 85.3L10.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.6 49.7 990.0 86.2M989.9 12.9Q991.3 49.5 990.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 84.4Q500.1 87.2 8.7 84.5M991.4 84.7Q499.6 83.2 7.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 86.0Q10.2 49.3 10.1 12.7M10.2 85.9Q8.9 50.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="45.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Diversity efforts often backfire because leaders treat diversity as head-count (identity-group representation) rather than as different perspectives and approaches to</text><text x="500.0" y="67.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">work</text><path d="M9.1 99.9L330.2 99.7L330.7 329.7L11.0 329.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 99.3Q169.7 100.9 331.0 99.1M7.7 99.3Q169.6 101.7 331.5 99.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 97.9Q331.6 214.6 329.3 331.3M329.2 98.5Q328.8 214.5 330.4 330.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 329.5Q169.6 330.0 7.9 329.1M330.9 330.2Q169.4 331.3 7.9 330.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 332.1Q12.7 215.5 10.3 98.9M9.8 332.0Q8.2 215.2 9.0 98.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="166.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">1. Discrimination and fairness (assimilation)</text><text x="170.0" y="188.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">premise: we are all the same; goal: fair hiring and</text><text x="170.0" y="210.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">treatment; cost: differences are muted, so the firm</text><text x="170.0" y="232.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">misses new ideas and staff feel detached; Iversen</text><text x="170.0" y="254.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">Dunham read clashes over qualitative methods as racial</text><text x="170.0" y="276.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">discord</text><path d="M341.1 99.0L660.3 100.4L660.5 328.8L339.4 331.1Z" fill="#efe0ca" stroke="none"/><path d="M338.4 99.4Q500.0 101.4 661.6 99.4M339.6 100.2Q500.0 100.6 660.5 100.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 99.2Q661.9 214.8 660.3 330.5M661.1 97.5Q658.6 214.0 659.8 330.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 329.6Q499.5 331.6 338.0 330.0M662.1 329.3Q500.2 328.6 338.4 329.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 331.3Q342.0 215.2 340.1 99.1M339.5 332.4Q339.6 215.1 340.0 97.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="177.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">2. Access and legitimacy (differentiation)</text><text x="500.0" y="199.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">premise: we celebrate differences; match staff to niche</text><text x="500.0" y="221.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">markets; cost: pigeonholing and exploitation; Access</text><text x="500.0" y="243.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">Capital&#x27;s European teams thrived but nobody understood</text><text x="500.0" y="265.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">why</text><path d="M669.3 100.1L991.1 100.8L991.1 331.1L669.7 328.8Z" fill="#d6e1cf" stroke="none"/><path d="M668.5 100.8Q829.6 102.0 990.6 100.5M667.6 100.4Q829.4 102.4 991.1 100.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 98.1Q991.3 214.9 990.5 331.8M990.0 99.0Q990.6 214.8 989.1 330.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 330.4Q830.6 329.3 669.3 329.1M991.7 330.0Q830.0 328.7 668.3 329.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 332.0Q671.5 214.7 670.3 97.5M671.0 331.4Q672.1 215.4 669.0 99.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="177.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">3. Learning and effectiveness (integration)</text><text x="830.0" y="199.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">equal opportunity plus valued differences, so people&#x27;s</text><text x="830.0" y="221.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">differing approaches reshape goals, processes,</text><text x="830.0" y="243.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">leadership and teams; Dewey and Levin took English-</text><text x="830.0" y="265.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">only-policy cases after hiring attorneys of colour</text><path d="M9.1 344.1L989.6 344.3L989.6 545.2L9.4 545.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 344.3Q499.8 346.0 991.8 344.3M9.1 344.1Q500.1 347.8 991.2 345.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 344.4Q992.1 445.4 989.4 546.3M990.1 343.9Q990.8 445.2 990.0 546.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 545.6Q500.2 544.2 8.1 544.5M992.5 544.0Q500.2 544.8 7.9 544.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 546.0Q10.9 444.9 11.0 343.7M10.3 545.5Q10.2 444.3 9.6 343.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="429.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Why the first two fail: Iversen Dunham&#x27;s mid-level project leaders clashed over the nature of the work (interviewing rank and file, qualitative data, admitting</text><text x="500.0" y="451.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">subjectivity in reports), but top management saw only fairness problems between managers and subordinates; Access Capital&#x27;s US executive: &#x27;If the French team all</text><text x="500.0" y="473.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">resigned tomorrow, what would we do?&#x27; Without exploring what the differences are, they cannot be learned, taught or integrated.</text></svg>