oke="none"/><path d="M8.0 309.5Q252.7 306.6 497.4 310.0M7.8 310.6Q252.6 311.6 497.4 310.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 307.6Q495.0 360.1 495.3 412.5M495.0 308.5Q493.6 360.2 495.9 412.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 410.9Q252.6 407.3 8.9 409.2M496.4 409.3Q252.7 406.8 9.0 410.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 412.5Q12.5 360.3 9.3 308.2M9.8 412.3Q12.1 360.3 9.7 308.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="344.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Deciding</text><text x="252.5" y="366.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">how consensus-minded; independent of hierarchy (Germans more hierarchical than</text><text x="252.5" y="388.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Americans yet build agreement first)</text><path d="M506.0 309.5L990.5 309.4L989.4 411.1L503.8 409.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.7 308.9Q747.1 306.7 990.6 309.7M504.2 310.4Q748.3 309.5 992.4 310.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 308.5Q987.8 360.4 989.0 412.3M990.6 308.4Q991.0 360.1 990.7 411.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 409.2Q747.9 409.3 503.2 410.1M990.6 409.0Q747.5 411.3 504.4 409.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.8 411.2Q506.2 360.2 505.5 309.3M504.9 410.7Q503.4 359.1 503.9 307.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="344.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Trusting</text><text x="747.5" y="366.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">task-based (cognitive, built through work) versus relationship-based (affective,</text><text x="747.5" y="388.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">built through personal connection)</text><path d="M10.7 421.1L493.9 420.6L496.1 520.6L9.4 520.8Z" fill="#d0dfdc" stroke="none"/><path d="M7.8 419.2Q251.7 421.5 495.5 420.6M7.8 419.5Q252.1 421.6 496.5 419.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 419.3Q496.9 470.6 495.7 522.0M493.9 418.1Q494.4 469.8 495.1 521.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.7 520.8Q252.2 522.3 7.7 520.8M495.7 520.8Q252.5 518.8 9.3 520.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.7 521.6Q10.7 470.5 9.8 419.5M9.5 520.6Q10.9 469.4 9.0 418.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="465.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Disagreeing</text><text x="252.5" y="487.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">open disagreement seen as healthy versus harmful to relationships</text><path d="M504.1 418.9L990.0 419.4L990.9 519.9L504.9 519.1Z" fill="#d0dfdc" stroke="none"/><path d="M504.4 419.1Q748.1 420.2 991.8 420.7M503.7 421.0Q747.4 423.0 991.1 420.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 417.4Q989.1 469.7 990.6 521.9M989.2 417.7Q989.8 469.9 988.9 522.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 520.3Q747.6 519.9 502.7 519.4M991.7 520.6Q747.4 519.5 503.2 519.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.4 522.5Q504.2 470.3 504.3 418.0M505.4 521.7Q504.9 469.9 504.7 418.1" fill="non