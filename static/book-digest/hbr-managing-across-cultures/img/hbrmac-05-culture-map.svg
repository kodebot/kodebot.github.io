<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="16.5" fill="#3b2f20" text-anchor="middle">The Culture Map (Erin Meyer): eight scales; compare one culture&#x27;s position with another&#x27;s, never read a position alone</text><path d="M9.1 89.9L495.2 89.7L495.7 189.7L11.0 189.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 89.3Q252.2 90.9 496.0 89.1M7.7 89.3Q252.1 91.7 496.5 89.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 87.9Q496.3 139.6 494.3 191.3M494.2 88.5Q493.9 139.5 495.4 190.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 189.5Q252.1 190.0 7.9 189.1M495.9 190.2Q251.9 191.3 7.9 190.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 192.1Q12.3 140.5 10.3 88.9M9.8 192.0Q8.4 140.2 9.0 88.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="124.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Communicating</text><text x="252.5" y="146.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">low-context (precise, explicit, simple, repeated, written) versus high-context</text><text x="252.5" y="168.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(layered, implied, read between the lines)</text><path d="M506.1 89.0L990.3 90.4L990.5 188.8L504.4 191.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 89.4Q747.5 91.4 991.6 89.4M504.6 90.2Q747.5 90.6 990.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.7 139.8 990.3 190.5M991.1 87.5Q989.0 139.0 989.8 190.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 189.6Q747.0 191.6 503.0 190.0M992.1 189.3Q747.7 188.6 503.4 189.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 191.3Q506.7 140.2 505.1 89.1M504.5 192.4Q504.6 140.1 505.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="124.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Evaluating</text><text x="747.5" y="146.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">frank versus diplomatic negative feedback; not the same as Communicating (the</text><text x="747.5" y="168.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">French are higher-context than Americans yet more direct in criticism)</text><path d="M9.3 200.1L496.1 200.8L496.1 301.1L9.7 298.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 200.8Q252.1 202.0 495.6 200.5M7.6 200.4Q251.9 202.4 496.1 200.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 198.1Q496.1 249.9 495.5 301.8M495.0 199.0Q495.4 249.8 494.1 300.7" fill="none" stroke="#0b7285" s