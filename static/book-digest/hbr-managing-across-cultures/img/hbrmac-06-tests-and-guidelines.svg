<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Two tests when a host country&#x27;s standard seems lower than home&#x27;s</text><path d="M9.1 89.9L495.2 89.7L495.7 279.7L11.0 279.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 89.3Q252.2 90.9 496.0 89.1M7.7 89.3Q252.1 91.7 496.5 89.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 87.9Q496.6 184.6 494.3 281.3M494.2 88.5Q493.8 184.5 495.4 280.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 279.5Q252.1 280.0 7.9 279.1M495.9 280.2Q251.9 281.3 7.9 280.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 282.1Q12.7 185.5 10.3 88.9M9.8 282.0Q8.2 185.2 9.0 88.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="147.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Conflict of relative development</text><text x="252.5" y="169.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">ask: would the practice be acceptable at home if my country were at a similar stage</text><text x="252.5" y="191.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">of economic development? Lower Angolan oil-rig wages (yes, or lose investment and</text><text x="252.5" y="213.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">jobs); Entero Vioform for dysentery in India (yes); but not oil-rig pollution that</text><text x="252.5" y="235.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">sharply raises cancer risk</text><path d="M506.1 89.0L990.3 90.4L990.5 278.8L504.4 281.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 89.4Q747.5 91.4 991.6 89.4M504.6 90.2Q747.5 90.6 990.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 184.8 990.3 280.5M991.1 87.5Q988.6 184.0 989.8 280.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 279.6Q747.0 281.6 503.0 280.0M992.1 279.3Q747.7 278.6 503.4 279.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 281.3Q507.0 185.2 505.1 89.1M504.5 282.4Q504.6 185.1 505.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="147.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Conflict of cultural tradition</text><text x="747.5" y="169.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">permissible only if you answer no to both: can business succeed in the host country</text><text x="747.5" y="191.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">without the practice? does it violate a core human value? Japanese gift-giving</text><text x="747.5" y="213.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">passes; suitcases of cash to politicians (Lockheed&#x27;s Carl Kotchian) goes beyond the</text><text x="747.5" y="235.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">tradition&#x27;s limits</text><path d="M9.3 295.1L991.1 295.8L991.1 511.1L9.7 508.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 295.8Q499.6 297.0 990.6 295.5M7.6 295.4Q499.4 297.4 991.1 295.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 293.1Q991.3 402.4 990.5 511.8M990.0 294.0Q990.6 402.3 989.1 510.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 510.4Q500.6 509.3 9.3 509.1M991.7 510.0Q500.0 508.7 8.3 509.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 512.0Q11.5 402.2 10.3 292.5M11.0 511.4Q12.1 402.9 9.0 294.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="364.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Guidelines for leaders: treat corporate values and conduct codes as absolutes (Motorola walked away from a $10 million sale when officials asked for a $1 million fee);</text><text x="500.0" y="386.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">set conditions of engagement for suppliers and customers (Levi Strauss ended business with the Tan family); let foreign units help formulate standards (Texas</text><text x="500.0" y="408.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">Instruments&#x27; Global Business Practices Council); support efforts to reduce institutional corruption; exercise moral imagination (Levi Strauss paid Bangladeshi</text><text x="500.0" y="430.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">children&#x27;s wages while they went to school, then offered jobs at 14; Coca-Cola declined Egyptian bribe requests and sponsored a fruit-tree project). Bribery is</text><text x="500.0" y="452.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">intolerable even when routine: it destroys predictability and undermines economic and social systems.</text></svg>