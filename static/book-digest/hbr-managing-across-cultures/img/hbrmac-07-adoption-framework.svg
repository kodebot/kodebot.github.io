<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="480" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="16.0" fill="#3b2f20" text-anchor="middle">Adoption framework: two factors, buy-in (will it benefit me or the firm?) and belief in capacity (can I gain enough fluency?)</text><path d="M9.1 89.9L495.2 89.7L495.7 219.7L11.0 219.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 89.3Q252.2 90.9 496.0 89.1M7.7 89.3Q252.1 91.7 496.5 89.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 87.9Q496.6 154.6 494.3 221.3M494.2 88.5Q493.8 154.5 495.4 220.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 219.5Q252.1 220.0 7.9 219.1M495.9 220.2Q251.9 221.3 7.9 220.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 222.1Q12.7 155.5 10.3 88.9M9.8 222.0Q8.2 155.2 9.0 88.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="150.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Inspired</text><text x="252.5" y="172.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">high buy-in, high belief: excited and confident, likely to embrace the challenge</text><path d="M506.1 89.0L990.3 90.4L990.5 218.8L504.4 221.1Z" fill="#efe0ca" stroke="none"/><path d="M503.4 89.4Q747.5 91.4 991.6 89.4M504.6 90.2Q747.5 90.6 990.5 90.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 154.8 990.3 220.5M991.1 87.5Q988.6 154.0 989.8 220.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 219.6Q747.0 221.6 503.0 220.0M992.1 219.3Q747.7 218.6 503.4 219.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 221.3Q507.0 155.2 505.1 89.1M504.5 222.4Q504.6 155.1 505.0 87.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="139.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Frustrated</text><text x="747.5" y="161.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">high buy-in, low belief: move to inspired with constant encouragement and many</text><text x="747.5" y="183.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">language-development opportunities</text><path d="M9.3 235.1L496.1 235.8L496.1 366.1L9.7 363.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 235.8Q252.1 237.0 495.6 235.5M7.6 235.4Q251.9 237.4 496.1 235.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 233.1Q496.3 299.9 495.5 366.8M495.0 234.0Q495.6 299.8 494.1 365.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 365.4Q253.1 364.3 9.3 364.1M496.7 365.0Q252.5 363.7 8.3 364.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 367.0Q11.5 299.7 10.3 232.5M11.0 366.4Q12.1 300.4 9.0 234.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="284.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Indifferent</text><text x="252.5" y="306.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">low buy-in, high belief: move to inspired by improving buy-in; once invested,</text><text x="252.5" y="328.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">skills follow</text><path d="M504.1 234.1L989.6 234.3L989.6 365.2L504.4 365.1Z" fill="#eed5cc" stroke="none"/><path d="M502.7 234.3Q747.3 236.0 991.8 234.3M504.1 234.1Q747.6 237.8 991.2 235.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 234.4Q992.1 300.4 989.4 366.3M990.1 233.9Q990.8 300.2 990.0 366.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 365.6Q747.7 364.2 503.1 364.5M992.5 364.0Q747.7 364.8 502.9 364.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 366.0Q505.9 299.9 506.0 233.7M505.3 365.5Q505.2 299.3 504.6 233.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="295.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Oppressed</text><text x="747.5" y="317.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">low buy-in, low belief: think it is a bad idea and that they will not cut it</text><path d="M9.5 379.2L989.1 380.5L990.6 469.4L9.8 471.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 379.5Q500.2 376.6 992.4 380.0M7.8 380.6Q500.1 381.6 992.4 380.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 377.6Q990.1 425.1 990.3 472.5M990.0 378.5Q988.7 425.2 990.9 472.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 470.9Q500.1 467.3 8.9 469.2M991.4 469.3Q500.2 466.8 9.0 470.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 472.5Q12.4 425.3 9.3 378.2M9.8 472.3Q11.9 425.3 9.7 378.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="420.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Raise belief: give experience, model positive attitudes and risk-taking, use verbal persuasion, encourage study habits. Raise buy-in: constant messaging, internal</text><text x="500.0" y="442.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">marketing, branding people as global. Mikitani replied to roughly 120 managers&#x27; weekly reports to push language growth and held top executives&#x27; reviews in English.</text></svg>