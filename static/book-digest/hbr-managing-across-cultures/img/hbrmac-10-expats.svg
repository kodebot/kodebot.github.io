<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="540" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 105.3L10.7 104.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.5 59.7 990.0 106.2M989.9 12.9Q991.5 59.5 990.3 106.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 104.4Q500.1 107.2 8.7 104.5M991.4 104.7Q499.6 103.2 7.8 105.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 106.0Q10.1 59.3 10.1 12.7M10.2 105.9Q8.7 60.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="55.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Expatriates cost two to three times a home-country equivalent (a package of $300,000 to $1 million a year); across about 750 firms, 10 to 20 percent of US managers</text><text x="500.0" y="77.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">returned early, nearly a third of those who stayed under-performed, and a quarter left within a year of returning, double the usual turnover</text><path d="M9.1 119.9L330.2 119.7L330.7 339.7L11.0 339.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 119.3Q169.7 120.9 331.0 119.1M7.7 119.3Q169.6 121.7 331.5 119.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 117.9Q331.6 229.6 329.3 341.3M329.2 118.5Q328.8 229.5 330.4 340.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 339.5Q169.6 340.0 7.9 339.1M330.9 340.2Q169.4 341.3 7.9 340.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 342.1Q12.7 230.5 10.3 118.9M9.8 342.0Q8.2 230.2 9.0 118.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="181.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">1. Right reasons</text><text x="170.0" y="203.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">not rewards, dumping grounds or only fire-fighting:</text><text x="170.0" y="225.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">expats should create and transfer knowledge (Nokia: 36</text><text x="170.0" y="247.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">R&amp;D centres in 11 countries) or develop global leaders</text><text x="170.0" y="269.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">(Disney&#x27;s Stephen Burke at EuroDisney, who pushed wine</text><text x="170.0" y="291.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and tour-operator packages)</text><path d="M341.1 119.0L660.3 120.4L660.5 338.8L339.4 341.1Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 119.4Q500.0 121.4 661.6 119.4M339.6 120.2Q500.0 120.6 660.5 120.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 119.2Q661.9 229.8 660.3 340.5M661.1 117.5Q658.6 229.0 659.8 340.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 339.6Q499.5 341.6 338.0 340.0M662.1 339.3Q500.2 338.6 338.4 339.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 341.3Q342.0 230.2 340.1 119.1M339.5 342.4Q339.6 230.1 340.0 117.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="170.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2. Right people</text><text x="500.0" y="192.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">cultural openness equal to technical skill: drive to</text><text x="500.0" y="214.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">communicate, broad sociability, cultural flexibility,</text><text x="500.0" y="236.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">cosmopolitan orientation, collaborative negotiation;</text><text x="500.0" y="258.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">Huntsman travels with candidates; LG surveys (about 97</text><text x="500.0" y="280.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">percent succeed); Colgate-Palmolive starts with short</text><text x="500.0" y="302.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">stints</text><path d="M669.3 120.1L991.1 120.8L991.1 341.1L669.7 338.8Z" fill="#efe0ca" stroke="none"/><path d="M668.5 120.8Q829.6 122.0 990.6 120.5M667.6 120.4Q829.4 122.4 991.1 120.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 118.1Q991.3 229.9 990.5 341.8M990.0 119.0Q990.6 229.8 989.1 340.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 340.4Q830.6 339.3 669.3 339.1M991.7 340.0Q830.0 338.7 668.3 339.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 342.0Q671.5 229.7 670.3 117.5M671.0 341.4Q672.1 230.4 669.0 119.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="181.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3. Right ending (repatriation)</text><text x="830.0" y="203.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a third still in temporary jobs after three months,</text><text x="830.0" y="225.0" font-size="10.5" fill="#3b2f20" text-anchor="middle">over three-quarters felt demoted, 61 percent had no use</text><text x="830.0" y="247.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">for foreign experience, 25 percent turnover; Monsanto</text><text x="830.0" y="269.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">matches jobs three to six months ahead; Unocal runs a</text><text x="830.0" y="291.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">one-day debrief; Honda under 5 percent turnover</text><path d="M9.1 354.1L989.6 354.3L989.6 530.2L9.4 530.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 354.3Q499.8 356.0 991.8 354.3M9.1 354.1Q500.1 357.8 991.2 355.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 354.4Q992.1 442.9 989.4 531.3M990.1 353.9Q990.8 442.7 990.0 531.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 530.6Q500.2 529.2 8.1 529.5M992.5 529.0Q500.2 529.8 7.9 529.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 531.0Q10.9 442.4 11.0 353.7M10.3 530.5Q10.2 441.8 9.6 353.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="426.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">All three practices are needed: they reinforce each other and cover the whole assignment. GE Medical Systems nearly eliminated unwanted post-return turnover while</text><text x="500.0" y="448.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">international sales rose from 10 percent to over 50 percent of the total; the business case is that these assignments are the largest single investment in executive</text><text x="500.0" y="470.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">development.</text></svg>