<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="920" height="330" fill="#ffffff"/><rect x="340" y="120" width="240" height="90" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="460.0" y="150.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Learning plan</text><text x="460.0" y="170.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">prioritise and timebox</text><text x="460.0" y="190.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">(15 to 30 minutes counts)</text><rect x="20" y="110" width="270" height="110" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="155.0" y="150.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Technical skills</text><text x="155.0" y="170.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">release notes, newsletters,</text><text x="155.0" y="190.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">communities, influencers</text><rect x="630" y="110" width="270" height="110" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="765.0" y="150.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Soft skills</text><text x="765.0" y="170.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">practise on the job:</text><text x="765.0" y="190.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">conflict, empathy, feedback</text><line x1="340" y1="165" x2="290" y2="165" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="580" y1="165" x2="630" y2="165" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="460" y="280" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">embrace failure: it is part of learning</text></svg>