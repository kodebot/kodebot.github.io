<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="370" fill="#ffffff"/><rect x="30" y="40" width="330" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="195.0" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">1 Find your content type</text><text x="195.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">video, written, interactive,</text><text x="195.0" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">samples, podcasts, audiobooks</text><rect x="540" y="40" width="330" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="705.0" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">2 Boost memory</text><text x="705.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">active recall, teaching,</text><text x="705.0" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">mnemonics, chunking</text><rect x="540" y="230" width="330" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="705.0" y="265.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">3 Apply your skills</text><text x="705.0" y="285.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">personal projects, community</text><text x="705.0" y="305.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">projects, prototypes</text><rect x="30" y="230" width="330" height="100" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="195.0" y="265.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">4 Beat blockers</text><text x="195.0" y="285.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">breaks, attainable goals,</text><text x="195.0" y="305.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">ask for help, rubber duck</text><line x1="360" y1="90" x2="540" y2="90" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="705" y1="140" x2="705" y2="230" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="280" x2="360" y2="280" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="195" y1="230" x2="195" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="355" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">sleep, stress and mental health affect all four</text></svg>