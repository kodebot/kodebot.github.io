<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="940" height="300" fill="#ffffff"/><rect x="20" y="20" width="190" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="115.0" y="40.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">1</text><text x="115.0" y="60.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Define it</text><text x="115.0" y="80.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">(team&#x27;s input)</text><rect x="250" y="20" width="190" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="345.0" y="50.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">2</text><text x="345.0" y="70.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Document it</text><rect x="480" y="20" width="190" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="575.0" y="50.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">3</text><text x="575.0" y="70.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Communicate it</text><rect x="710" y="20" width="190" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="805.0" y="40.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">4</text><text x="805.0" y="60.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Assign roles and</text><text x="805.0" y="80.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">responsibilities</text><rect x="710" y="140" width="190" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="805.0" y="170.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">5</text><text x="805.0" y="190.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Establish deadlines</text><rect x="480" y="140" width="190" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="575.0" y="160.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">6</text><text x="575.0" y="180.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Encourage</text><text x="575.0" y="200.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">collaboration</text><rect x="250" y="140" width="190" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="345.0" y="160.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">7</text><text x="345.0" y="180.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Use tools</text><text x="345.0" y="200.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Jira, Trello, Asana, GitHub</text><rect x="20" y="140" width="190" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="115.0" y="160.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">8</text><text x="115.0" y="180.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">Review and update</text><text x="115.0" y="200.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">regularly</text><line x1="210" y1="55.0" x2="250" y2="55.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="440" y1="55.0" x2="480" y2="55.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="670" y1="55.0" x2="710" y2="55.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="805.0" y1="90" x2="805.0" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="710" y1="175.0" x2="670" y2="175.0" stroke