<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="270" fill="#ffffff"/><rect x="20" y="90" width="230" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="135.0" y="113.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Is the work well</text><text x="135.0" y="133.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">understood and</text><text x="135.0" y="153.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">precise?</text><rect x="380" y="25" width="250" height="66" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="505.0" y="53.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Hourly estimate</text><text x="505.0" y="73.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">precise work, billing</text><line x1="250" y1="115" x2="380" y2="58" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="310" y="75" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><rect x="380" y="115" width="250" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="505.0" y="138.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Story points</text><text x="505.0" y="158.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">relative complexity, not hours,</text><text x="505.0" y="178.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">for uncertain work</text><line x1="250" y1="140" x2="380" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="315" y="135" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">no</text><rect x="130" y="215" width="640" height="44" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="450.0" y="242.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Either way: include the team, surface assumptions, define scope</text></svg>