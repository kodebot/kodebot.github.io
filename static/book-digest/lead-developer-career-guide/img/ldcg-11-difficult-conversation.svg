<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="820" height="280" fill="#ffffff"/><rect x="20" y="50" width="220" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="130.0" y="90.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Prepare</text><rect x="300" y="50" width="220" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="410.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Listen more</text><text x="410.0" y="100.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">than you talk</text><rect x="580" y="50" width="220" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="690.0" y="80.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Follow up</text><text x="690.0" y="100.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">every two weeks</text><line x1="240" y1="85.0" x2="300" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="520" y1="85.0" x2="580" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="710" y1="120" x2="710" y2="190" stroke="#6f8aa3" stroke-width="2"/><line x1="710" y1="190" x2="130" y2="190" stroke="#6f8aa3" stroke-width="2"/><line x1="130" y1="190" x2="130" y2="120" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="410" y="240" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">difficult conversations are an ongoing process, not one meeting</text></svg>