<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="360" fill="#fbf7ef"/><path d="M21.1 20.0L320.3 20.4L318.9 150.3L20.7 149.2Z" fill="#eed5cc" stroke="none"/><path d="M18.5 20.0Q170.1 20.0 321.8 19.6M19.5 20.4Q170.5 19.6 321.5 20.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.8 18.3Q319.2 84.7 320.0 151.2M319.9 17.9Q321.9 84.5 320.3 151.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.5 149.4Q170.1 152.2 18.7 149.5M321.4 149.7Q169.6 148.2 17.8 150.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 151.0Q20.0 84.3 20.1 17.7M20.2 150.9Q18.5 85.1 19.1 19.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="47.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Shared database</text><text x="170.0" y="69.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Fig 1-9)</text><text x="170.0" y="91.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Recommendation reads the</text><text x="170.0" y="113.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Order service&#x27;s tables:</text><text x="170.0" y="135.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">coupled to schema and SQL</text><path d="M349.1 19.9L650.2 19.7L650.7 149.7L351.0 149.8Z" fill="#d6e1cf" stroke="none"/><path d="M348.4 19.3Q499.7 20.9 651.0 19.1M347.7 19.3Q499.6 21.7 651.5 19.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.9 17.9Q651.6 84.6 649.3 151.3M649.2 18.5Q648.8 84.5 650.4 150.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.3 149.5Q499.6 150.0 347.9 149.1M650.9 150.2Q499.4 151.3 347.9 150.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M350.2 152.1Q352.7 85.5 350.3 18.9M349.8 152.0Q348.2 85.2 349.0 18.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="47.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Via an API</text><text x="500.0" y="69.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Fig 1-10)</text><text x="500.0" y="91.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Recommendation asks the</text><text x="500.0" y="113.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Order service; internal</text><text x="500.0" y="135.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">detail stays hidden</text><path d="M681.1 19.0L980.3 20.4L980.5 148.8L679.4 151.1Z" fill="#d0dfdc" stroke="none"/><path d="M678.4 19.4Q830.0 21.4 981.6 19.4M679.6 20.2Q830.0 20.6 980.5 20.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 19.2Q981.9 84.8 980.3 150.5M981.1 17.5Q978.6 84.0 979.8 150.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 149.6Q829.5 151.6 678.0 150.0M982.1 149.3Q830.2 148.6 678.4 149.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M680.6 151.3Q682.0 85.2 680.1 19.1M679.5 152.4Q679.6 85.1 680.0 17.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="47.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Exposed dataset</text><text x="830.0" y="69.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Fig 1-11)</text><text x="830.0" y="91.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Order publishes a separate</text><text x="830.0" y="113.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">database for bulk use,</text><text x="830.0" y="135.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">shaped for consumers</text><path d="M19.3 180.1L981.1 180.8L981.1 331.1L19.7 328.8Z" fill="#f1ede5" stroke="none"/><path d="M18.5 180.8Q499.6 182.0 980.6 180.5M17.6 180.4Q499.4 182.4 981.1 180.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 178.1Q981.3 254.9 980.5 331.8M980.0 179.0Q980.6 254.8 979.1 330.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 330.4Q500.6 329.3 19.3 329.1M981.7 330.0Q500.0 328.7 18.3 329.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 332.0Q21.5 254.7 20.3 177.5M21.0 331.4Q22.1 255.4 19.0 179.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="239.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Information hiding: expose as little as possible; you can always share more later.</text><text x="500.0" y="261.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Outside-in design: ask the people who will call the service what they need, and treat the interface like a user interface.</text><text x="500.0" y="283.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Do not share databases unless you really have to: one of the worst things for independent deployability.</text></svg>