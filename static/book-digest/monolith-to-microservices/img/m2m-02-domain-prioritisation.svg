<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="360" fill="#fbf7ef"/><path d="M21.1 20.0L320.3 20.4L318.9 170.3L20.7 169.2Z" fill="#eed5cc" stroke="none"/><path d="M18.5 20.0Q170.1 20.0 321.8 19.6M19.5 20.4Q170.5 19.6 321.5 20.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.8 18.3Q319.2 94.7 320.0 171.2M319.9 17.9Q321.9 94.5 320.3 171.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.5 169.4Q170.1 172.2 18.7 169.5M321.4 169.7Q169.6 168.2 17.8 170.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 171.0Q20.0 94.3 20.1 17.7M20.2 170.9Q18.5 95.1 19.1 19.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="57.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Notification (Fig 2-5)</text><text x="170.0" y="79.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">many inbound dependencies:</text><text x="170.0" y="101.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">lots of parts of the system call it,</text><text x="170.0" y="123.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">so many local calls must become</text><text x="170.0" y="145.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">service calls: likely harder</text><path d="M349.1 19.9L650.2 19.7L650.7 169.7L351.0 169.8Z" fill="#d6e1cf" stroke="none"/><path d="M348.4 19.3Q499.7 20.9 651.0 19.1M347.7 19.3Q499.6 21.7 651.5 19.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.9 17.9Q651.6 94.6 649.3 171.3M649.2 18.5Q648.8 94.5 650.4 170.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.3 169.5Q499.6 170.0 347.9 169.1M650.9 170.2Q499.4 171.3 347.9 170.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M350.2 172.1Q352.7 95.5 350.3 18.9M349.8 172.0Q348.2 95.2 349.0 18.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="57.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Invoicing (Fig 2-6)</text><text x="500.0" y="79.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">no inbound dependencies:</text><text x="500.0" y="101.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">easier to extract; calls can be</text><text x="500.0" y="123.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">proxied before reaching the</text><text x="500.0" y="145.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">monolith (strangler fig)</text><path d="M681.1 19.0L980.3 20.4L980.5 168.8L679.4 171.1Z" fill="#d0dfdc" stroke="none"/><path d="M678.4 19.4Q830.0 21.4 981.6 19.4M679.6 20.2Q830.0 20.6 980.5 20.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 19.2Q981.9 94.8 980.3 170.5M981.1 17.5Q978.6 94.0 979.8 170.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 169.6Q829.5 171.6 678.0 170.0M982.1 169.3Q830.2 168.6 678.4 169.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M680.6 171.3Q682.0 95.2 680.1 19.1M679.5 172.4Q679.6 95.1 680.0 17.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="68.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The domain model (Fig 2-4)</text><text x="830.0" y="90.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Music Corp&#x27;s bounded contexts and</text><text x="830.0" y="112.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">their relationships, a logical view;</text><text x="830.0" y="134.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">other contexts not named in the text</text><path d="M19.3 195.1L981.1 195.8L981.1 326.1L19.7 323.8Z" fill="#f1ede5" stroke="none"/><path d="M18.5 195.8Q499.6 197.0 980.6 195.5M17.6 195.4Q499.4 197.4 981.1 195.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 193.1Q981.3 259.9 980.5 326.8M980.0 194.0Q980.6 259.8 979.1 325.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 325.4Q500.6 324.3 19.3 324.1M981.7 325.0Q500.0 323.7 18.3 324.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 327.0Q21.5 259.7 20.3 192.5M21.0 326.4Q22.1 260.4 19.0 194.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="244.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Caveats: the model is logical, so the real code may be more entangled; it does not show which contexts own database tables</text><text x="500.0" y="266.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Invoicing may manage lots of data). Combine ease with benefit: if Invoicing rarely changes and the goal is time to market,</text><text x="500.0" y="288.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">extracting it first may not be worth the effort.</text></svg>