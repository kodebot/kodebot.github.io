<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="380" fill="#fbf7ef"/><path d="M21.1 20.0L490.3 20.4L488.9 60.3L20.7 59.2Z" fill="#f1ede5" stroke="none"/><path d="M18.5 20.0Q255.1 20.0 491.8 19.6M19.5 20.4Q255.5 19.6 491.5 20.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 18.3Q489.8 39.7 490.0 61.2M489.9 17.9Q491.0 39.5 490.3 61.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 59.4Q255.1 62.2 18.7 59.5M491.4 59.7Q254.6 58.2 17.8 60.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 61.0Q20.3 39.3 20.1 17.7M20.2 60.9Q19.1 40.1 19.1 19.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">As-is (Fig 2-9): activities mapped to teams</text><path d="M19.1 69.9L490.2 69.7L490.7 199.7L21.0 199.8Z" fill="#efe0ca" stroke="none"/><path d="M18.4 69.3Q254.7 70.9 491.0 69.1M17.7 69.3Q254.6 71.7 491.5 69.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 67.9Q491.6 134.6 489.3 201.3M489.2 68.5Q488.8 134.5 490.4 200.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 199.5Q254.6 200.0 17.9 199.1M490.9 200.2Q254.4 201.3 17.9 200.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.2 202.1Q22.7 135.5 20.3 68.9M19.8 202.0Q18.2 135.2 19.0 68.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="108.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Frontend team, backend team, operations team</text><text x="255.0" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">each owns part of delivery: building, test</text><text x="255.0" y="152.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">environments, deployment, incidents</text><text x="255.0" y="174.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(a subset of responsibilities)</text><path d="M511.1 19.0L980.3 20.4L980.5 58.8L509.4 61.1Z" fill="#f1ede5" stroke="none"/><path d="M508.4 19.4Q745.0 21.4 981.6 19.4M509.6 20.2Q745.0 20.6 980.5 20.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 19.2Q981.3 39.8 980.3 60.5M981.1 17.5Q979.6 39.0 979.8 60.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 59.6Q744.5 61.6 508.0 60.0M982.1 59.3Q745.2 58.6 508.4 59.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 61.3Q511.1 40.2 510.1 19.1M509.5 62.4Q509.7 40.1 510.0 17.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">To-be (Fig 2-10): redrawn for 6 to 12 months ahead</text><path d="M509.3 70.1L981.1 70.8L981.1 201.1L509.7 198.8Z" fill="#d6e1cf" stroke="none"/><path d="M508.5 70.8Q744.6 72.0 980.6 70.5M507.6 70.4Q744.4 72.4 981.1 70.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 68.1Q981.3 134.9 980.5 201.8M980.0 69.0Q980.6 134.8 979.1 200.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 200.4Q745.6 199.3 509.3 199.1M981.7 200.0Q745.0 198.7 508.3 199.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.9 202.0Q511.5 134.7 510.3 67.5M511.0 201.4Q512.1 135.4 509.0 69.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="108.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Frontend and backend responsibilities merged;</text><text x="745.0" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">teams provision their own test environments via a</text><text x="745.0" y="152.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">self-service platform from operations; delivery team</text><text x="745.0" y="174.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">handles all incidents in working hours first</text><path d="M489.1 134.1Q499.4 133.8 509.7 134.3M490.2 134.5Q500.1 133.6 510.1 134.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.2 134.7Q504.7 132.6 499.7 129.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.8 135.3Q504.7 137.6 499.9 140.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.4 224.8L979.1 225.1L980.4 355.0L20.1 354.7Z" fill="#f1ede5" stroke="none"/><path d="M19.4 225.6Q500.2 226.0 981.1 224.5M19.5 224.0Q500.2 224.1 980.9 224.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 223.0Q981.0 289.9 981.0 356.7M980.3 222.5Q979.7 289.3 979.6 356.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.0 354.3Q499.4 353.3 17.7 355.4M980.9 354.9Q500.2 356.0 19.6 354.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 356.5Q21.6 289.7 18.9 222.8M20.9 356.7Q18.0 290.6 20.4 224.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="274.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Method: list every delivery activity with all roles in the room; map to current teams; redraw for the near future;</text><text x="500.0" y="296.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">ask what skills each shift needs; talk to people on the ground; change one responsibility at a time.</text><text x="500.0" y="318.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Do not copy another company&#x27;s structure (the Spotify model was a 2012 snapshot; copy the questions, not the answers).</text></svg>