<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M11.1 20.0L330.3 20.4L328.9 140.3L10.7 139.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 20.0Q170.1 20.0 331.8 19.6M9.5 20.4Q170.5 19.6 331.5 20.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 18.3Q329.3 79.7 330.0 141.2M329.9 17.9Q331.8 79.5 330.3 141.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 139.4Q170.1 142.2 8.7 139.5M331.4 139.7Q169.6 138.2 7.8 140.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 141.0Q10.0 79.3 10.1 17.7M10.2 140.9Q8.6 80.1 9.1 19.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="42.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Database triggers (Fig 3-36)</text><text x="170.0" y="64.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fire on INSERT and call a service;</text><text x="170.0" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">simple, but a slippery slope:</text><text x="170.0" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one or two fine, a system built</text><text x="170.0" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">on them is terrible (Randy Shoup)</text><path d="M339.1 19.9L660.2 19.7L660.7 139.7L341.0 139.8Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 19.3Q499.7 20.9 661.0 19.1M337.7 19.3Q499.6 21.7 661.5 19.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 17.9Q661.5 79.6 659.3 141.3M659.2 18.5Q658.8 79.5 660.4 140.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 139.5Q499.6 140.0 337.9 139.1M660.9 140.2Q499.4 141.3 337.9 140.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 142.1Q342.6 80.5 340.3 18.9M339.8 142.0Q338.3 80.2 339.0 18.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="42.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Transaction log pollers (Fig 3-37)</text><text x="500.0" y="64.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">separate process reads the log;</text><text x="500.0" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">only committed changes; can read a</text><text x="500.0" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">replica; tooling depends on the</text><text x="500.0" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">database; the neatest option</text><path d="M671.1 19.0L990.3 20.4L990.5 138.8L669.4 141.1Z" fill="#efe0ca" stroke="none"/><path d="M668.4 19.4Q830.0 21.4 991.6 19.4M669.6 20.2Q830.0 20.6 990.5 20.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 19.2Q991.9 79.8 990.3 140.5M991.1 17.5Q988.7 79.0 989.8 140.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 139.6Q829.5 141.6 668.0 140.0M992.1 139.3Q830.2 138.6 668.4 139.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 141.3Q671.9 80.2 670.1 19.1M669.5 142.4Q669.6 80.1 670.0 17.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="42.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Batch delta copier</text><text x="830.0" y="64.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">scheduled job copies changed data;</text><text x="830.0" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">hard to know what changed</text><text x="830.0" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(table-level metadata only,</text><text x="830.0" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">timestamps may need adding)</text><path d="M9.3 160.1L991.1 160.8L991.1 271.1L9.7 268.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 160.8Q499.6 162.0 990.6 160.5M7.6 160.4Q499.4 162.4 991.1 160.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 158.1Q991.2 214.9 990.5 271.8M990.0 159.0Q990.5 214.8 989.1 270.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 270.4Q500.6 269.3 9.3 269.1M991.7 270.0Q500.0 268.7 8.3 269.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 272.0Q11.3 214.7 10.3 157.5M11.0 271.4Q11.9 215.4 9.0 159.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="210.0" font-size="15.5" fill="#3b2f20" text-anchor="middle">Loyalty cards example (Fig 3-34, 3-35): enrolment returns little information, so detect inserts into the LoyaltyAccount table</text><text x="500.0" y="232.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and fire a Loyalty Account Created event; the printing service batches work from a message broker.</text><path d="M9.1 289.1L989.6 289.3L989.6 380.2L9.4 380.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 289.3Q499.8 291.0 991.8 289.3M9.1 289.1Q500.1 292.8 991.2 290.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 289.4Q991.5 335.4 989.4 381.3M990.1 288.9Q990.7 335.2 990.0 381.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 380.6Q500.2 379.2 8.1 379.5M992.5 379.0Q500.2 379.8 7.9 379.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 381.0Q10.9 334.9 11.0 288.7M10.3 380.5Q10.2 334.3 9.6 288.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="330.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Use when you must react to data changes and cannot intercept at the perimeter or change the code. The capture system is coupled to the monolith&#x27;s datastore</text><text x="500.0" y="352.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(unavoidable). Keep use to a minimum.</text></svg>