<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 20.0L495.3 20.4L493.9 150.3L10.7 149.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 20.0Q252.6 20.0 496.8 19.6M9.5 20.4Q253.0 19.6 496.5 20.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 18.3Q494.2 84.7 495.0 151.2M494.9 17.9Q496.9 84.5 495.3 151.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 149.4Q252.6 152.2 8.7 149.5M496.4 149.7Q252.1 148.2 7.8 150.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 151.0Q10.0 84.3 10.1 17.7M10.2 150.9Q8.5 85.1 9.1 19.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="47.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Parallel run (Fig 3-30)</text><text x="252.5" y="69.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">call both old and new, compare the results;</text><text x="252.5" y="91.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one is the source of truth (old, until trusted);</text><text x="252.5" y="113.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">check functional and non-functional behaviour</text><text x="252.5" y="135.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(latency, time-outs)</text><path d="M504.1 19.9L990.2 19.7L990.7 149.7L506.0 149.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 19.3Q747.2 20.9 991.0 19.1M502.7 19.3Q747.1 21.7 991.5 19.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 17.9Q991.6 84.6 989.3 151.3M989.2 18.5Q988.8 84.5 990.4 150.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 149.5Q747.1 150.0 502.9 149.1M990.9 150.2Q746.9 151.3 502.9 150.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 152.1Q507.7 85.5 505.3 18.9M504.8 152.0Q503.2 85.2 504.0 18.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="58.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Credit derivative pricing example</text><text x="747.5" y="80.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">both systems priced each event; daily reconciliation</text><text x="747.5" y="102.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">in a spreadsheet; some differences were bugs in the</text><text x="747.5" y="124.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">old system; switched after a month</text><path d="M11.1 169.0L495.3 170.4L495.5 288.8L9.4 291.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 169.4Q252.5 171.4 496.6 169.4M9.6 170.2Q252.5 170.6 495.5 170.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 169.2Q496.9 229.8 495.3 290.5M496.1 167.5Q493.7 229.0 494.8 290.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 289.6Q252.0 291.6 8.0 290.0M497.1 289.3Q252.7 288.6 8.4 289.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 291.3Q11.9 230.2 10.1 169.1M9.5 292.4Q9.6 230.1 10.0 167.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="203.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Spies (Fig 3-31)</text><text x="252.5" y="225.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">stub the side effect (sending an email) so it is not</text><text x="252.5" y="247.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">sent twice and can be verified later, but a spy inside</text><text x="252.5" y="269.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the monolith would skip testing the remote call</text><path d="M504.3 170.1L991.1 170.8L991.1 291.1L504.7 288.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.5 170.8Q747.1 172.0 990.6 170.5M502.6 170.4Q746.9 172.4 991.1 170.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 168.1Q991.3 229.9 990.5 291.8M990.0 169.0Q990.6 229.8 989.1 290.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 290.4Q748.1 289.3 504.3 289.1M991.7 290.0Q747.5 288.7 503.3 289.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 292.0Q506.4 229.7 505.3 167.5M506.0 291.4Q507.0 230.4 504.0 169.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="203.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Related ideas</text><text x="747.5" y="225.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">N-version programming (fly-by-wire): several versions,</text><text x="747.5" y="247.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">quorum picks the answer; GitHub Scientist library;</text><text x="747.5" y="269.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Homegate ran both FTP importers</text><path d="M9.1 314.1L989.6 314.3L989.6 415.2L9.4 415.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 314.3Q499.8 316.0 991.8 314.3M9.1 314.1Q500.1 317.8 991.2 315.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 314.4Q991.7 365.4 989.4 416.3M990.1 313.9Q990.7 365.2 990.0 416.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 415.6Q500.2 414.2 8.1 414.5M992.5 414.0Q500.2 414.8 7.9 414.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 416.0Q10.9 364.9 11.0 313.7M10.3 415.5Q10.2 364.3 9.6 313.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="360.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Canary release: a subset of users sees the new code. Dark launch: new code live but invisible. Parallel run is a way to dark launch.</text><text x="500.0" y="382.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">All sit under progressive delivery (term from James Governor). Parallel run is rarely trivial: use it for high-risk functionality.</text></svg>