<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="380" fill="#fbf7ef"/><path d="M11.1 20.0L495.3 20.4L493.9 150.3L10.7 149.2Z" fill="#eed5cc" stroke="none"/><path d="M8.5 20.0Q252.6 20.0 496.8 19.6M9.5 20.4Q253.0 19.6 496.5 20.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 18.3Q494.2 84.7 495.0 151.2M494.9 17.9Q496.9 84.5 495.3 151.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 149.4Q252.6 152.2 8.7 149.5M496.4 149.7Q252.1 148.2 7.8 150.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 151.0Q10.0 84.3 10.1 17.7M10.2 150.9Q8.5 85.1 9.1 19.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="58.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Proxy transforms protocol (Fig 3-12)</text><text x="252.5" y="80.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">for example SOAP to gRPC in the proxy:</text><text x="252.5" y="102.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">logic builds up in a shared layer, a new source</text><text x="252.5" y="124.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">of contention; &#x27;smart pipes&#x27; problem</text><path d="M504.1 19.9L990.2 19.7L990.7 149.7L506.0 149.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 19.3Q747.2 20.9 991.0 19.1M502.7 19.3Q747.1 21.7 991.5 19.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 17.9Q991.6 84.6 989.3 151.3M989.2 18.5Q988.8 84.5 990.4 150.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 149.5Q747.1 150.0 502.9 149.1M990.9 150.2Q746.9 151.3 502.9 150.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 152.1Q507.7 85.5 505.3 18.9M504.8 152.0Q503.2 85.2 504.0 18.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="58.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Service supports both (Fig 3-13)</text><text x="747.5" y="80.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the service exposes old and new protocols and</text><text x="747.5" y="102.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">maps internally; the proxy stays simple; upstream</text><text x="747.5" y="124.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">consumers migrate on their own time</text><path d="M11.1 179.0L990.3 180.4L990.5 348.8L9.4 351.1Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 179.4Q500.0 181.4 991.6 179.4M9.6 180.2Q500.0 180.6 990.5 180.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 179.2Q991.9 264.8 990.3 350.5M991.1 177.5Q988.6 264.0 989.8 350.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 349.6Q499.5 351.6 8.0 350.0M992.1 349.3Q500.2 348.6 8.4 349.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 351.3Q12.0 265.2 10.1 179.1M9.5 352.4Q9.6 265.1 10.0 177.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="249.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">Service mesh (Fig 3-14): each service instance talks through its own local proxy, configured per instance, with a central control plane.</text><text x="500.0" y="271.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">No central smart proxy. Square used it to move from a homegrown RPC mechanism to gRPC, building its own mesh on the Envoy proxy.</text><text x="500.0" y="293.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Concept &#x27;spot on&#x27; but tooling was still stabilising (Istio the leader; Linkerd another); advice: give it time to settle if you can.</text></svg>