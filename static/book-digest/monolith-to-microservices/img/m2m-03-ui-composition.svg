<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><path d="M11.1 20.0L495.3 20.4L493.9 140.3L10.7 139.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 20.0Q252.6 20.0 496.8 19.6M9.5 20.4Q253.0 19.6 496.5 20.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 18.3Q494.3 79.7 495.0 141.2M494.9 17.9Q496.8 79.5 495.3 141.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 139.4Q252.6 142.2 8.7 139.5M496.4 139.7Q252.1 138.2 7.8 140.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 141.0Q10.0 79.3 10.1 17.7M10.2 140.9Q8.6 80.1 9.1 19.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="42.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Page composition</text><text x="252.5" y="64.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">migrate page by page or vertical by vertical</text><text x="252.5" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(The Guardian, Travel first; redirect old links;</text><text x="252.5" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">later a CDN, Fastly, did the routing); REA Group owns</text><text x="252.5" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">whole channels with different branding</text><path d="M504.1 19.9L990.2 19.7L990.7 139.7L506.0 139.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 19.3Q747.2 20.9 991.0 19.1M502.7 19.3Q747.1 21.7 991.5 19.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 17.9Q991.5 79.6 989.3 141.3M989.2 18.5Q988.8 79.5 990.4 140.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 139.5Q747.1 140.0 502.9 139.1M990.9 140.2Q746.9 141.3 502.9 140.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 142.1Q507.6 80.5 505.3 18.9M504.8 142.0Q503.3 80.2 504.0 18.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="42.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Widget composition (Fig 3-19)</text><text x="747.5" y="64.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">first a single top-10 travel destinations widget,</text><text x="747.5" y="86.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">spliced into old pages with Edge-Side Includes;</text><text x="747.5" y="108.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">today often composed in the browser so one</text><text x="747.5" y="130.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">failing widget degrades only part of the page</text><path d="M11.1 159.0L495.3 160.4L495.5 268.8L9.4 271.1Z" fill="#efe0ca" stroke="none"/><path d="M8.4 159.4Q252.5 161.4 496.6 159.4M9.6 160.2Q252.5 160.6 495.5 160.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 159.2Q496.8 214.8 495.3 270.5M496.1 157.5Q493.9 214.0 494.8 270.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 269.6Q252.0 271.6 8.0 270.0M497.1 269.3Q252.7 268.6 8.4 269.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 271.3Q11.8 215.2 10.1 159.1M9.5 272.4Q9.6 215.1 10.0 157.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="188.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Orbitz (Fig 3-20, 3-21)</text><text x="252.5" y="210.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">UI modules (search form, booking form, map) served by</text><text x="252.5" y="232.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one Content Orchestration monolith, then delegated one</text><text x="252.5" y="254.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">at a time to backing services, starting with editorial</text><path d="M504.3 160.1L991.1 160.8L991.1 271.1L504.7 268.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.5 160.8Q747.1 162.0 990.6 160.5M502.6 160.4Q746.9 162.4 991.1 160.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 158.1Q991.2 214.9 990.5 271.8M990.0 159.0Q990.5 214.8 989.1 270.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 270.4Q748.1 269.3 504.3 269.1M991.7 270.0Q747.5 268.7 503.3 269.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 272.0Q506.3 214.7 505.3 157.5M506.0 271.4Q506.9 215.4 504.0 159.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="188.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Mobile and micro frontends</text><text x="747.5" y="210.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">app stores add delay, so push dynamic changes from the</text><text x="747.5" y="232.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">server (web views; Spotify&#x27;s server-defined components);</text><text x="747.5" y="254.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">single-page apps need micro frontends (Web Components)</text><path d="M9.1 294.1L989.6 294.3L989.6 375.2L9.4 375.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 294.3Q499.8 296.0 991.8 294.3M9.1 294.1Q500.1 297.8 991.2 295.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 294.4Q991.4 335.4 989.4 376.3M990.1 293.9Q990.6 335.2 990.0 376.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 375.6Q500.2 374.2 8.1 374.5M992.5 374.0Q500.2 374.8 7.9 374.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 376.0Q10.9 334.9 11.0 293.7M10.3 375.5Q10.2 334.3 9.6 293.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="341.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">Where it fits: lets you migrate whole vertical slices, but you must be able to change the existing UI; websites are easy, single-page apps harder</text></svg>