<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="440" fill="#fbf7ef"/><path d="M11.1 15.0L495.3 15.4L493.9 135.3L10.7 134.2Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 15.0Q252.6 15.0 496.8 14.6M9.5 15.4Q253.0 14.6 496.5 15.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 13.3Q494.3 74.7 495.0 136.2M494.9 12.9Q496.8 74.5 495.3 136.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 134.4Q252.6 137.2 8.7 134.5M496.4 134.7Q252.1 133.2 7.8 135.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 136.0Q10.0 74.3 10.1 12.7M10.2 135.9Q8.6 75.1 9.1 14.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Split the database first (4-26)</text><text x="252.5" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">find performance and transaction problems early;</text><text x="252.5" y="92.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">reversible; little short-term benefit; not for</text><text x="252.5" y="114.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">black-box monoliths</text><path d="M504.1 14.9L990.2 14.7L990.7 134.7L506.0 134.8Z" fill="#efe0ca" stroke="none"/><path d="M503.4 14.3Q747.2 15.9 991.0 14.1M502.7 14.3Q747.1 16.7 991.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 12.9Q991.5 74.6 989.3 136.3M989.2 13.5Q988.8 74.5 990.4 135.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 134.5Q747.1 135.0 502.9 134.1M990.9 135.2Q746.9 136.3 502.9 135.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 137.1Q507.6 75.5 505.3 13.9M504.8 137.0Q503.3 75.2 504.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Split the code first (4-29)</text><text x="747.5" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">most teams: quick win, clearer data needs; risk</text><text x="747.5" y="92.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">of stopping with a shared database; joins move</text><text x="747.5" y="114.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">into the application</text><path d="M11.1 144.0L495.3 145.4L495.5 263.8L9.4 266.1Z" fill="#eed5cc" stroke="none"/><path d="M8.4 144.4Q252.5 146.4 496.6 144.4M9.6 145.2Q252.5 145.6 495.5 145.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 144.2Q496.9 204.8 495.3 265.5M496.1 142.5Q493.7 204.0 494.8 265.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 264.6Q252.0 266.6 8.0 265.0M497.1 264.3Q252.7 263.6 8.4 264.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 266.3Q11.9 205.2 10.1 144.1M9.5 267.4Q9.6 205.1 10.0 142.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="189.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Split both at once (4-33)</text><text x="252.5" y="211.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a much bigger step and slower feedback:</text><text x="252.5" y="233.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">avoid</text><path d="M504.3 145.1L991.1 145.8L991.1 266.1L504.7 263.8Z" fill="#d6e1cf" stroke="none"/><path d="M503.5 145.8Q747.1 147.0 990.6 145.5M502.6 145.4Q746.9 147.4 991.1 145.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 143.1Q991.3 204.9 990.5 266.8M990.0 144.0Q990.6 204.8 989.1 265.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 265.4Q748.1 264.3 504.3 264.1M991.7 265.0Q747.5 263.7 503.3 264.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 267.0Q506.4 204.7 505.3 142.5M506.0 266.4Q507.0 205.4 504.0 144.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="178.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Newman&#x27;s pick</text><text x="747.5" y="200.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">if you can change the monolith and fear performance</text><text x="747.5" y="222.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">or consistency impact, split the schema first;</text><text x="747.5" y="244.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">otherwise split the code and learn ownership</text><path d="M9.1 269.1L494.6 269.3L494.6 430.2L9.4 430.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 269.3Q252.3 271.0 496.8 269.3M9.1 269.1Q252.6 272.8 496.2 270.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.0 269.4Q497.1 350.4 494.4 431.3M495.1 268.9Q495.8 350.2 495.0 431.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.4 430.6Q252.7 429.2 8.1 429.5M497.5 429.0Q252.7 429.8 7.9 429.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 431.0Q10.9 349.9 11.0 268.7M10.3 430.5Q10.2 349.3 9.6 268.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="301.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Preparation patterns</text><text x="252.5" y="323.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">repository per bounded context (4-27):</text><text x="252.5" y="345.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">see which context uses which tables</text><text x="252.5" y="367.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">database per bounded context (4-28): hedge</text><text x="252.5" y="389.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">monolith as data access layer (4-30, 4-31)</text><text x="252.5" y="411.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">multischema storage (4-32)</text><path d="M504.5 269.2L989.1 270.5L990.6 429.4L504.8 431.2Z" fill="#f1ede5" stroke="none"/><path d="M503.0 269.5Q747.7 266.6 992.4 270.0M502.8 270.6Q747.6 271.6 992.4 270.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 267.6Q989.9 350.1 990.3 432.5M990.0 268.5Q988.2 350.2 990.9 432.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 430.9Q747.6 427.3 503.9 429.2M991.4 429.3Q747.7 426.8 504.0 430.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 432.5Q508.0 350.3 504.3 268.2M504.8 432.3Q507.6 350.3 504.7 268.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="312.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Logical versus physical (Fig 4-24, 4-25)</text><text x="747.5" y="334.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">logical split: independent change, information hiding</text><text x="747.5" y="356.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">physical split: robustness, less contention; needs the</text><text x="747.5" y="378.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">logical split first. Same engine is a single point of</text><text x="747.5" y="400.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">failure (but clusters exist) and views need one engine</text></svg>