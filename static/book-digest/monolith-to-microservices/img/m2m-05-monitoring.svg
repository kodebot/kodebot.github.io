<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 135.3L10.7 134.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.3 74.7 330.0 136.2M329.9 12.9Q331.8 74.5 330.3 136.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 134.4Q170.1 137.2 8.7 134.5M331.4 134.7Q169.6 133.2 7.8 135.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 136.0Q10.0 74.3 10.1 12.7M10.2 135.9Q8.6 75.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Log aggregation</text><text x="170.0" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">central searchable logs: ELK stack,</text><text x="170.0" y="92.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">Humio; do it FIRST, before microservices;</text><text x="170.0" y="114.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a test of the organisation&#x27;s readiness</text><path d="M339.1 14.9L660.2 14.7L660.7 134.7L341.0 134.8Z" fill="#d0dfdc" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.5 74.6 659.3 136.3M659.2 13.5Q658.8 74.5 660.4 135.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 134.5Q499.6 135.0 337.9 134.1M660.9 135.2Q499.4 136.3 337.9 135.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 137.1Q342.6 75.5 340.3 13.9M339.8 137.0Q338.3 75.2 339.0 13.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Correlation IDs and tracing</text><text x="500.0" y="70.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">ID created at the edge (API gateway or mesh),</text><text x="500.0" y="92.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">passed on (Fig 5-6); Jaeger traces timing</text><text x="500.0" y="114.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">(Fig 5-7); needed sooner if latency matters</text><path d="M671.1 14.0L990.3 15.4L990.5 133.8L669.4 136.1Z" fill="#efe0ca" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 74.8 990.3 135.5M991.1 12.5Q988.7 74.0 989.8 135.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 134.6Q829.5 136.6 668.0 135.0M992.1 134.3Q830.2 133.6 668.4 134.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 136.3Q671.9 75.2 670.1 14.1M669.5 137.4Q669.6 75.1 670.0 12.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Test in production</text><text x="830.0" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">synthetic transactions: scripted fake</text><text x="830.0" y="92.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">customers (Atomist sign-ups) alert on failure;</text><text x="830.0" y="114.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">avoid real impact (200 washing machines)</text><path d="M9.3 150.1L991.1 150.8L991.1 271.1L9.7 268.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 150.8Q499.6 152.0 990.6 150.5M7.6 150.4Q499.4 152.4 991.1 150.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 148.1Q991.3 209.9 990.5 271.8M990.0 149.0Q990.6 209.8 989.1 270.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 270.4Q500.6 269.3 9.3 269.1M991.7 270.0Q500.0 268.7 8.3 269.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 272.0Q11.4 209.7 10.3 147.5M11.0 271.4Q12.0 210.4 9.0 149.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="194.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">Toward observability: with complex systems you cannot predict every failure, so collect lots of information and be able to ask open-ended</text><text x="500.0" y="216.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">questions after the fact (tracing and logs, ad hoc querying). Do not assume you know the answers up front; expect to be surprised.</text><text x="500.0" y="238.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Book: Distributed Systems Observability (Cindy Sridharan).</text><path d="M9.1 289.1L989.6 289.3L989.6 415.2L9.4 415.1Z" fill="#eed5cc" stroke="none"/><path d="M7.7 289.3Q499.8 291.0 991.8 289.3M9.1 289.1Q500.1 292.8 991.2 290.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 289.4Q992.0 352.9 989.4 416.3M990.1 288.9Q990.8 352.7 990.0 416.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 415.6Q500.2 414.2 8.1 414.5M992.5 414.0Q500.2 414.8 7.9 414.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 416.0Q10.9 352.4 11.0 288.7M10.3 415.5Q10.2 351.8 9.6 288.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="347.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">Signs: unexplainable production issues, alerts when the system looks healthy, &#x27;is everything OK?&#x27; is hard to answer. One process at 100% CPU may not</text><text x="500.0" y="369.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">justify a 3 a.m. page. Hard to predict when: from the first production failure to 20+ services.</text></svg>