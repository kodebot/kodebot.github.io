<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="430" fill="#fbf7ef"/><path d="M11.1 15.0L330.3 15.4L328.9 135.3L10.7 134.2Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 15.0Q170.1 15.0 331.8 14.6M9.5 15.4Q170.5 14.6 331.5 15.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 13.3Q329.3 74.7 330.0 136.2M329.9 12.9Q331.8 74.5 330.3 136.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.5 134.4Q170.1 137.2 8.7 134.5M331.4 134.7Q169.6 133.2 7.8 135.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 136.0Q10.0 74.3 10.1 12.7M10.2 135.9Q8.6 75.1 9.1 14.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Strong ownership</text><text x="170.0" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">every service has owners; outsiders</text><text x="170.0" y="92.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">submit changes (a pull request)</text><text x="170.0" y="114.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">common above about 100 developers</text><path d="M339.1 14.9L660.2 14.7L660.7 134.7L341.0 134.8Z" fill="#efe0ca" stroke="none"/><path d="M338.4 14.3Q499.7 15.9 661.0 14.1M337.7 14.3Q499.6 16.7 661.5 14.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M659.9 12.9Q661.5 74.6 659.3 136.3M659.2 13.5Q658.8 74.5 660.4 135.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.3 134.5Q499.6 135.0 337.9 134.1M660.9 135.2Q499.4 136.3 337.9 135.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.2 137.1Q342.6 75.5 340.3 13.9M339.8 137.0Q338.3 75.2 339.0 13.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="59.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Weak ownership</text><text x="500.0" y="81.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">anyone can change anything</text><text x="500.0" y="103.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">but should talk to the owner first</text><path d="M671.1 14.0L990.3 15.4L990.5 133.8L669.4 136.1Z" fill="#eed5cc" stroke="none"/><path d="M668.4 14.4Q830.0 16.4 991.6 14.4M669.6 15.2Q830.0 15.6 990.5 15.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 14.2Q991.9 74.8 990.3 135.5M991.1 12.5Q988.7 74.0 989.8 135.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 134.6Q829.5 136.6 668.0 135.0M992.1 134.3Q830.2 133.6 668.4 134.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.6 136.3Q671.9 75.2 670.1 14.1M669.5 137.4Q669.6 75.1 670.0 12.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="48.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Collective ownership</text><text x="830.0" y="70.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">no owner, anyone can change anything:</text><text x="830.0" y="92.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fine for about 20 co-located people;</text><text x="830.0" y="114.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">disastrous at scale (colander architecture)</text><path d="M9.3 150.1L496.1 150.8L496.1 281.1L9.7 278.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 150.8Q252.1 152.0 495.6 150.5M7.6 150.4Q251.9 152.4 496.1 150.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 148.1Q496.3 214.9 495.5 281.8M495.0 149.0Q495.6 214.8 494.1 280.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 280.4Q253.1 279.3 9.3 279.1M496.7 280.0Q252.5 278.7 8.3 279.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 282.0Q11.5 214.7 10.3 147.5M11.0 281.4Q12.1 215.4 9.0 149.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="188.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Two versions running (Fig 5-2)</text><text x="252.5" y="210.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">two builds of the service with different</text><text x="252.5" y="232.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">endpoints; extra infrastructure, data compatibility,</text><text x="252.5" y="254.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">bug fixes in both: only for short periods</text><path d="M504.1 149.1L989.6 149.3L989.6 280.2L504.4 280.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 149.3Q747.3 151.0 991.8 149.3M504.1 149.1Q747.6 152.8 991.2 150.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 149.4Q992.1 215.4 989.4 281.3M990.1 148.9Q990.8 215.2 990.0 281.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 280.6Q747.7 279.2 503.1 279.5M992.5 279.0Q747.7 279.8 502.9 279.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 281.0Q505.9 214.9 506.0 148.7M505.3 280.5Q505.2 214.3 504.6 148.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="188.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">One service, two contracts (Fig 5-3)</text><text x="747.5" y="210.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">preferred: one version exposes both contracts</text><text x="747.5" y="232.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(for example two ports); complexity moves into the</text><text x="747.5" y="254.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">service; some teams support three or more old contracts</text><path d="M9.5 294.2L989.1 295.5L990.6 419.4L9.8 421.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 294.5Q500.2 291.6 992.4 295.0M7.8 295.6Q500.1 296.6 992.4 295.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 292.6Q989.9 357.6 990.3 422.5M990.0 293.5Q988.3 357.7 990.9 422.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 420.9Q500.1 417.3 8.9 419.2M991.4 419.3Q500.2 416.8 9.0 420.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 422.5Q12.9 357.8 9.3 293.2M9.8 422.3Q12.5 357.8 9.7 293.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="341.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">Rules: eliminate accidental breaking changes (explicit schemas; protolock for protocol buffers; make contract changes obvious; test for semantic breaks);</text><text x="500.0" y="363.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">prefer expansion changes; if you must break, give consumers time to migrate. Lock-step releases are a warning sign.</text><text x="500.0" y="385.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">Treat consumers like customers. Sort this out fast: small microservice organisations that do not will not become large ones.</text></svg>