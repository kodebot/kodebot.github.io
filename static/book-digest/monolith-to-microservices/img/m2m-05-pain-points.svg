500.0" y="259.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">Fig 5-1 plots these against the number of services (deeply unscientific, anecdotal): think of adopting microservices as turning a dial, not</text><text x="500.0" y="281.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">flipping a switch; each turn brings new pain points and needs new skills, techniques or tools. The figure&#x27;s exact positions are not described in the</text><text x="500.0" y="303.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">text; a more coupled architecture brings robustness, testing and tracing problems earlier. Build feedback mechanisms to spot them.</text></svg>