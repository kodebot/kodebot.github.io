<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M21.1 20.0L490.3 20.4L488.9 140.3L20.7 139.2Z" fill="#eed5cc" stroke="none"/><path d="M18.5 20.0Q255.1 20.0 491.8 19.6M19.5 20.4Q255.5 19.6 491.5 20.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 18.3Q489.3 79.7 490.0 141.2M489.9 17.9Q491.8 79.5 490.3 141.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 139.4Q255.1 142.2 18.7 139.5M491.4 139.7Q254.6 138.2 17.8 140.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 141.0Q20.0 79.3 20.1 17.7M20.2 140.9Q18.6 80.1 19.1 19.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Unsafe</text><text x="255.0" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">query = &quot;... WHERE id = &quot; + userInput</text><text x="255.0" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the interpreter cannot tell data from command</text><text x="255.0" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">so hostile input runs as a command</text><path d="M509.1 19.9L980.2 19.7L980.7 139.7L511.0 139.8Z" fill="#d6e1cf" stroke="none"/><path d="M508.4 19.3Q744.7 20.9 981.0 19.1M507.7 19.3Q744.6 21.7 981.5 19.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 17.9Q981.5 79.6 979.3 141.3M979.2 18.5Q978.8 79.5 980.4 140.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 139.5Q744.6 140.0 507.9 139.1M980.9 140.2Q744.4 141.3 507.9 140.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.2 142.1Q512.6 80.5 510.3 18.9M509.8 142.0Q508.3 80.2 509.0 18.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="53.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Safe</text><text x="745.0" y="75.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">parameterised query: command first,</text><text x="745.0" y="97.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">data passed separately</text><text x="745.0" y="119.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the data is never parsed as a command</text><path d="M491.0 79.1Q500.7 80.2 510.3 80.3M488.9 79.4Q500.0 79.0 511.0 79.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.1 79.7Q504.9 77.3 499.7 75.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.5 80.1Q504.3 82.8 499.4 86.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.4 168.9L979.5 171.2L978.9 289.8L18.9 290.7Z" fill="#f1ede5" stroke="none"/><path d="M18.1 169.6Q499.5 167.9 981.0 170.0M19.1 169.3Q500.2 170.4 981.4 169.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.6 168.3Q978.8 230.2 980.1 292.1M979.5 169.4Q979.9 230.1 980.0 290.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 290.1Q500.2 287.5 19.5 290.7M982.5 289.8Q499.9 287.4 17.4 290.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.1 292.0Q20.8 229.8 20.4 167.6M19.6 292.1Q18.9 230.3 20.6 168.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="214.0" font-size="16.0" fill="#3b2f20" text-anchor="middle">If you cannot separate them: positive server-side validation, escaping for the specific interpreter (incomplete defences).</text><text x="500.0" y="236.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Table and column names cannot be escaped, so never take them from users.</text><text x="500.0" y="258.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Stored procedures can still be injectable if they concatenate input.</text><text x="500" y="315" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">A05 Injection: keep data separate from commands</text></svg>