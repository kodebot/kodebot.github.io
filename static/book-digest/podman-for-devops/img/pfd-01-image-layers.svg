<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="700" height="330" fill="#ffffff"/><rect x="40" y="20" width="340" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="210.0" y="43.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Container layer</text><text x="210.0" y="63.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">thin, read/write, ephemeral</text><rect x="40" y="90" width="340" height="52" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="210.0" y="111.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Layer 3</text><text x="210.0" y="131.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">read-only, shared by containers</text><rect x="40" y="152" width="340" height="52" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="210.0" y="173.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Layer 2</text><text x="210.0" y="193.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">read-only, shared by containers</text><rect x="40" y="214" width="340" height="52" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="210.0" y="235.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Base layer</text><text x="210.0" y="255.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">read-only, shared by containers</text><text x="540" y="60" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">writes go here (copy-on-write)</text><line x1="480" y1="70" x2="385" y2="50" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="540" y="170" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">image layers are</text><text x="540" y="188" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">immutable (OCI standard)</text><text x="210" y="310" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">data that must survive lives outside the container</text></svg>