<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="860" height="380" fill="#ffffff"/><rect x="30" y="130" width="140" height="56" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="100.0" y="163.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Created</text><rect x="330" y="130" width="140" height="56" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="400.0" y="163.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Running</text><rect x="630" y="130" width="140" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="700.0" y="163.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Stopped</text><rect x="330" y="270" width="140" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="400.0" y="303.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Paused</text><rect x="630" y="270" width="140" height="56" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="700.0" y="303.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Removed</text><line x1="170" y1="158" x2="330" y2="158" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="250.0" y="148" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">start</text><line x1="470" y1="148" x2="630" y2="148" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="550.0" y="138" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">stop / kill</text><line x1="630" y1="172" x2="470" y2="172" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="550.0" y="190" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">start / restart</text><line x1="390" y1="186" x2="390" y2="270" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="380" y="232" font-size="12" fill="#14324f" text-anchor="end" stroke="#ffffff" stroke-width="4" paint-order="stroke">pause</text><line x1="410" y1="270" x2="410" y2="186" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="232" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">unpause</text><line x1="700" y1="186" x2="700" y2="270" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="710" y="232" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">rm</text><text x="430" y="360" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">stop sends SIGTERM, then SIGKILL after 10 s; pause uses the cgroup freezer, not signals</text></svg>