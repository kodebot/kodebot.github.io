<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="880" height="300" fill="#ffffff"/><rect x="20" y="20" width="300" height="66" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="170.0" y="48.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">FROM</text><text x="170.0" y="68.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">starts from base image layers</text><rect x="20" y="116" width="300" height="66" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="170.0" y="144.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">RUN, COPY, ADD</text><text x="170.0" y="164.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">each creates a filesystem layer</text><rect x="20" y="212" width="300" height="66" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="170.0" y="240.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">CMD, ENV, LABEL, EXPOSE</text><text x="170.0" y="260.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">metadata only, no layer</text><rect x="560" y="100" width="300" height="100" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="710.0" y="135.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Image</text><text x="710.0" y="155.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">stack of immutable</text><text x="710.0" y="175.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">copy-on-write layers</text><line x1="320" y1="53" x2="560" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="440" y="82" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">base layers</text><line x1="320" y1="149" x2="560" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="440.0" y="140" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">+ layers</text><line x1="320" y1="245" x2="560" y2="175" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="440" y="232" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">config only</text></svg>