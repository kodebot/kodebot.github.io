<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="360" fill="#ffffff"/><text x="20" y="32" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">From an existing base image</text><rect x="20" y="45" width="220" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="130.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">buildah from</text><text x="130.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">working container</text><rect x="310" y="45" width="220" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="420.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">mount, run, copy,</text><text x="420.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">config</text><rect x="600" y="45" width="220" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="710.0" y="70.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">buildah commit</text><text x="710.0" y="90.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">new image</text><line x1="240" y1="75.0" x2="310" y2="75.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="530" y1="75.0" x2="600" y2="75.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="20" y="150" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">From scratch</text><rect x="20" y="163" width="220" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="130.0" y="188.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">buildah from scratch</text><text x="130.0" y="208.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">empty root</text><rect x="310" y="163" width="220" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="420.0" y="188.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">mount, then dnf</text><text x="420.0" y="208.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">--installroot</text><rect x="600" y="163" width="220" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="710.0" y="188.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">buildah commit</text><text x="710.0" y="208.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">new image</text><line x1="240" y1="193.0" x2="310" y2="193.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="530" y1="193.0" x2="600" y2="193.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="20" y="268" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">From a Dockerfile</text><rect x="20" y="281" width="220" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="130.0" y="306.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">podman build or</text><text x="130.0" y="326.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">buildah build</text><rect x="310" y="281" width="220" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="420.0" y="316.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">New image</text><line x1="240" y1="311.0" x2="310" y2="311.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="640" y="90" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">working containers are short-lived</text><text x="640" y="108" font-size="12" font-weight="400" fill="#14324f" text-anchor="