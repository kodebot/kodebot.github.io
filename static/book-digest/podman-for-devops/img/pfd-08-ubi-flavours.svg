<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="270" fill="#ffffff"/><rect x="20" y="50" width="200" height="84" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="120.0" y="77.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">UBI Standard</text><text x="120.0" y="97.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">about 230 MiB</text><text x="120.0" y="117.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">uses yum</text><rect x="260" y="50" width="200" height="84" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="360.0" y="77.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">UBI Minimal</text><text x="360.0" y="97.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">about half the size</text><text x="360.0" y="117.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">uses microdnf</text><rect x="500" y="50" width="200" height="84" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="600.0" y="77.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">UBI Micro</text><text x="600.0" y="97.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">distroless</text><text x="600.0" y="117.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">no package manager</text><rect x="740" y="50" width="200" height="84" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="840.0" y="87.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">UBI Init</text><text x="840.0" y="107.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">systemd as PID 1</text><line x1="220" y1="92.0" x2="260" y2="92.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="460" y1="92.0" x2="500" y2="92.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="700" y1="92.0" x2="740" y2="92.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="190" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Red Hat&#x27;s freely redistributable RHEL-based base images</text></svg>