<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="360" fill="#fbf7ef"/><path d="M21.1 20.0L320.3 20.4L318.9 150.3L20.7 149.2Z" fill="#d3dbe0" stroke="none"/><path d="M18.5 20.0Q170.1 20.0 321.8 19.6M19.5 20.4Q170.5 19.6 321.5 20.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.8 18.3Q319.2 84.7 320.0 151.2M319.9 17.9Q321.9 84.5 320.3 151.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.5 149.4Q170.1 152.2 18.7 149.5M321.4 149.7Q169.6 148.2 17.8 150.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 151.0Q20.0 84.3 20.1 17.7M20.2 150.9Q18.5 85.1 19.1 19.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="58.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Consumer team</text><text x="170.0" y="80.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">writes tests for the data</text><text x="170.0" y="102.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">it needs from the API</text><text x="170.0" y="124.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and publishes them</text><path d="M349.1 19.9L650.2 19.7L650.7 149.7L351.0 149.8Z" fill="#d6e1cf" stroke="none"/><path d="M348.4 19.3Q499.7 20.9 651.0 19.1M347.7 19.3Q499.6 21.7 651.5 19.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.9 17.9Q651.6 84.6 649.3 151.3M649.2 18.5Q648.8 84.5 650.4 150.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.3 149.5Q499.6 150.0 347.9 149.1M650.9 150.2Q499.4 151.3 347.