st one integration point</text><path d="M521.1 190.2L980.0 190.3L978.9 309.6L519.4 310.1Z" fill="#f1ede5" stroke="none"/><path d="M518.0 189.3Q749.4 191.4 980.7 190.4M517.9 189.9Q750.2 188.3 982.6 189.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 188.5Q978.3 249.7 978.9 310.8M980.9 188.7Q983.2 250.6 980.4 312.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.8 311.0Q750.3 310.6 518.8 310.0M982.4 310.5Q750.8 307.7 519.3 309.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M520.4 310.7Q518.7 249.5 521.0 188.4M520.5 311.9Q523.5 250.6 521.0 189.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="234.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Why fakes for other services</text><text x="750.0" y="256.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">tests stay independent of quotas,</text><text x="750.0" y="278.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">outages and what the other team does</text><text x="500" y="340" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">Consumer-driven contract tests and narrow integration tests</text></svg>