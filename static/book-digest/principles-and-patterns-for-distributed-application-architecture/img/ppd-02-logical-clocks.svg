join="round"/><text x="255.0" y="123.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">When a process does work: increment the counter</text><path d="M41.1 159.0L470.3 160.4L470.5 213.8L39.4 216.1Z" fill="#f1ede5" stroke="none"/><path d="M38.4 159.4Q255.0 161.4 471.6 159.4M39.6 160.2Q255.0 160.6 470.5 160.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M470.9 159.2Q471.4 187.3 470.3 215.5M471.1 157.5Q469.4 186.5 469.8 215.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.1 214.6Q254.5 216.6 38.0 215.0M472.1 214.3Q255.2 213.6 38.4 214.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.6 216.3Q41.3 187.7 40.1 159.1M39.5 217.4Q39.7 187.6 40.0 157.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="193.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">When it sends a message: include the counter</text><path d="M39.3 230.1L471.1 230.8L471.1 286.1L39.7 283.8Z" fill="#f1ede5" stroke="none"/><path d="M38.5 230.8Q254.6 232.0 470.6 230.5M37.6 230.4Q254.4 232.4 471.1 230.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M469.9 228.1Q470.8 257.4 470.5 286.8M470.0 229.0Q470.2 257.3 469.1 285.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M472.0 285.4Q255.6 284.3 39.3 284.1M471.7 285.0Q255.0 283.7 38.3 284.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M39.9 287.0Q40.9 257.2 40.3 227.5M41.0 286.4Q41.2 257.9 39.0 229.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="263.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">On receipt: counter = max(local, received) + 1</text><path d="M509.1 19.