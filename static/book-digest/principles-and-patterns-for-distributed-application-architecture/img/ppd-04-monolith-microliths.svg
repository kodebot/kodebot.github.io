<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M21.1 20.0L320.3 20.4L318.9 160.3L20.7 159.2Z" fill="#eed5cc" stroke="none"/><path d="M18.5 20.0Q170.1 20.0 321.8 19.6M19.5 20.4Q170.5 19.6 321.5 20.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.8 18.3Q319.2 89.7 320.0 161.2M319.9 17.9Q321.9 89.5 320.3 161.0" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.5 159.4Q170.1 162.2 18.7 159.5M321.4 159.7Q169.6 158.2 17.8 160.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 161.0Q20.0 89.3 20.1 17.7M20.2 160.9Q18.5 90.1 19.1 19.3" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="74.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Three-tier monolith (Figure 4-3)</text><text x="170.0" y="96.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">servlets, EJB, JPA, SQL database</text><text x="170.0" y="118.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">deep synchronous call chains</text><path d="M349.1 19.9L650.2 19.7L650.7 159.7L351.0 159.8Z" fill="#efe0ca" stroke="none"/><path d="M348.4 19.3Q499.7 20.9 651.0 19.1M347.7 19.3Q499.6 21.7 651.5 19.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.9 17.9Q651.6 89.6 649.3 161.3M649.2 18.5Q648.8 89.5 650.4 160.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.3 159.5Q499.6 160.0 347.9 159.1M650.9 160.2Q499.4 161.3 347.9 160.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M350.2 162.1Q352.7 90.5 350.3 18.9M349.8 162.0Q348.2 90.2 349.0 18.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="63.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Microliths (Figure 4-4)</text><text x="500.0" y="85.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">single instance each, synchronous</text><text x="500.0" y="107.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">blocking RPC, CRUD via JPA</text><text x="500.0" y="129.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">small monoliths</text><path d="M681.1 19.0L980.3 20.4L980.5 158.8L679.4 161.1Z" fill="#eed5cc" stroke="none"/><path d="M678.4 19.4Q830.0 21.4 981.6 19.4M679.6 20.2Q830.0 20.6 980.5 20.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 19.2Q981.9 89.8 980.3 160.5M981.1 17.5Q978.6 89.0 979.8 160.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 159.6Q829.5 161.6 678.0 160.0M982.1 159.3Q830.2 158.6 678.4 159.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M680.6 161.3Q682.0 90.2 680.1 19.1M679.5 162.4Q679.6 90.1 680.0 17.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="74.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Monolith in disguise (Figure 4-2)</text><text x="830.0" y="96.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">services sharing one database</text><text x="830.0" y="118.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">cross-service joins</text><path d="M19.3 190.1L981.1 190.8L981.1 311.1L19.7 308.8Z" fill="#f1ede5" stroke="none"/><path d="M18.5 190.8Q499.6 192.0 980.6 190.5M17.6 190.4Q499.4 192.4 981.1 190.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 188.1Q981.3 249.9 980.5 311.8M980.0 189.0Q980.6 249.8 979.1 310.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 310.4Q500.6 309.3 19.3 309.1M981.7 310.0Q500.0 308.7 18.3 309.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 312.0Q21.4 249.7 20.3 187.5M21.0 311.4Q22.0 250.4 19.0 189.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="245.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Consequences: upgrade together, failures cascade, cannot scale one service,</text><text x="500.0" y="267.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">containers and Kubernetes do not remove the distributed-systems problems</text></svg>