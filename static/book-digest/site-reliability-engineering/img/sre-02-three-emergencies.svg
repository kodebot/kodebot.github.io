<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M21.1 20.0L320.3 20.4L318.9 180.3L20.7 179.2Z" fill="#d0dfdc" stroke="none"/><path d="M18.5 20.0Q170.1 20.0 321.8 19.6M19.5 20.4Q170.5 19.6 321.5 20.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.8 18.3Q319.2 99.7 320.0 181.2M319.9 17.9Q321.9 99.5 320.3 181.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.5 179.4Q170.1 182.2 18.7 179.5M321.4 179.7Q169.6 178.2 17.8 180.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 181.0Q20.0 99.3 20.1 17.7M20.2 180.9Q18.5 100.1 19.1 19.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="62.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Test-induced</text><text x="170.0" y="84.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">block access to one of 100</text><text x="170.0" y="106.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">databases; hidden dependencies</text><text x="170.0" y="128.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">broke users; rollback was</text><text x="170.0" y="150.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">untested and failed</text><path d="M349.1 19.9L650.2 19.7L650.7 179.7L351.0 179.8Z" fill="#efe0ca" stroke="none"/><path d="M348.4 19.3Q499.7 20.9 651.0 19.1M347.7 19.3Q499.6 21.7 651.5 19.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.9 17.9Q651.6 99.6 649.3 181.3M649.2 18.5Q648.8 99.5 650.4 180.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.3 179.5Q499.6 180.0 347.9 179.1M650.9 180.2Q499.4 181.3 347.9 180.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M350.2 182.1Q352.7 100.5 350.3 18.9M349.8 182.0Q348.2 100.2 349.0 18.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="62.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Change-induced</text><text x="500.0" y="84.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">a configuration push crashed</text><text x="500.0" y="106.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the fleet; a rare keyword had</text><text x="500.0" y="128.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">skipped the strict canary;</text><text x="500.0" y="150.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">rolled back within 5 minutes</text><path d="M681.1 19.0L980.3 20.4L980.5 178.8L679.4 181.1Z" fill="#eed5cc" stroke="none"/><path d="M678.4 19.4Q830.0 21.4 981.6 19.4M679.6 20.2Q830.0 20.6 980.5 20.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 19.2Q981.9 99.8 980.3 180.5M981.1 17.5Q978.6 99.0 979.8 180.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 179.6Q829.5 181.6 678.0 180.0M982.1 179.3Q830.2 178.6 678.4 179.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M680.6 181.3Q682.0 100.2 680.1 19.1M679.5 182.4Q679.6 100.1 680.0 17.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="62.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Process-induced</text><text x="830.0" y="84.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">turndown automation sent an</text><text x="830.0" y="106.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">empty filter, meaning all</text><text x="830.0" y="128.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">machines were wiped;</text><text x="830.0" y="150.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">recovery took days</text><path d="M19.3 205.1L981.1 205.8L981.1 296.1L19.7 293.8Z" fill="#f1ede5" stroke="none"/><path d="M18.5 205.8Q499.6 207.0 980.6 205.5M17.6 205.4Q499.4 207.4 981.1 205.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 203.1Q981.1 249.9 980.5 296.8M980.0 204.0Q980.4 249.8 979.1 295.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 295.4Q500.6 294.3 19.3 294.1M981.7 295.0Q500.0 293.7 18.3 294.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 297.0Q21.2 249.7 20.3 202.5M21.0 296.4Q21.6 250.4 19.0 204.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="245.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Shared pattern: responders did not panic, pulled in others, followed incident process,</text><text x="500.0" y="267.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and then fixed the system (canaries, sanity checks, tested rollbacks)</text><text x="500" y="320" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">Three emergencies from the Emergency Response chapter</text></svg>