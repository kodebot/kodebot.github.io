5.0" y="151.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Decision: gains</text><text x="255.0" y="173.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">core ticketing more available (fault tolerance)</text><text x="255.0" y="195.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">scalability for customers and ticket creation</text><text x="255.0" y="217.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">reporting load separated from the database</text><text x="255.0" y="239.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">faster features and fixes (agility)</text><text x="255.0" y="261.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fewer bugs (testability), weekly or daily deploys</text><path d="M511.1 89.0L980.3 90.4L980.5 308.8L509.4 311.1Z" fill="#efe0ca" stroke="none"/><path d="M508.4 89.4Q745.0 91.4 981.6 89.4M509.6 90.2Q745.0 90.6 980.5 90.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 89.2Q981.9 199.8 980.3 310.5M981.1 87.5Q978.6 199.0 979.8 310.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 309.6Q744.5 311.6 508.0 310.0M982.1 309.3Q745.2 308.6 508.4 309.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 311.3Q512.0 200.2 510.1 89.1M509.5 312.4Q509.6 200.1 510.0 87.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="151.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Consequences</text><text x="745.0" y="173.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">new features delayed while developers migrate</text><text x="745.0" y="195.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">additional cost (estimates to be determined)</text><text x="745.0" y="217.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">release engineers manage several deployment units</text><text x="745.0" y="239.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">until the pipeline is modified</text><text x="745.0" y="261.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the monolithic database must be broken apart</text></svg>