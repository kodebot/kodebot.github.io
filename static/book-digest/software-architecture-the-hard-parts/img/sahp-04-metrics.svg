<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M21.1 20.0L320.3 20.4L318.9 150.3L20.7 149.2Z" fill="#d0dfdc" stroke="none"/><path d="M18.5 20.0Q170.1 20.0 321.8 19.6M19.5 20.4Q170.5 19.6 321.5 20.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.8 18.3Q319.2 84.7 320.0 151.2M319.9 17.9Q321.9 84.5 320.3 151.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.5 149.4Q170.1 152.2 18.7 149.5M321.4 149.7Q169.6 148.2 17.8 150.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 151.0Q20.0 84.3 20.1 17.7M20.2 150.9Q18.5 85.1 19.1 19.3" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="69.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Afferent coupling (Ca)</text><text x="170.0" y="91.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">incoming connections to a</text><text x="170.0" y="113.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">code artifact</text><path d="M349.1 19.9L650.2 19.7L650.7 149.7L351.0 149.8Z" fill="#efe0ca" stroke="none"/><path d="M348.4 19.3Q499.7 20.9 651.0 19.1M347.7 19.3Q499.6 21.7 651.5 19.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.9 17.9Q651.6 84.6 649.3 151.3M649.2 18.5Q648.8 84.5 650.4 150.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.3 149.5Q499.6 150.0 347.9 149.1M650.9 150.2Q499.4 151.3 347.9 150.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M350.2 152.1Q352.7 85.5 350.3 18.9M349.8 152.0Q348.2 85.2 349.0 18.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="69.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Efferent coupling (Ce)</text><text x="500.0" y="91.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">outgoing connections to</text><text x="500.0" y="113.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">other code artifacts</text><path d="M681.1 19.0L980.3 20.4L980.5 148.8L679.4 151.1Z" fill="#d6e1cf" stroke="none"/><path d="M678.4 19.4Q830.0 21.4 981.6 19.4M679.6 20.2Q830.0 20.6 980.5 20.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 19.2Q981.9 84.8 980.3 150.5M981.1 17.5Q978.6 84.0 979.8 150.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 149.6Q829.5 151.6 678.0 150.0M982.1 149.3Q830.2 148.6 678.4 149.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M680.6 151.3Q682.0 85.2 680.1 19.1M679.5 152.4Q679.6 85.1 680.0 17.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="69.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Abstractness  A = sum(ma) / (sum(mc) + sum(ma))</text><text x="830.0" y="91.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">ma abstract elements, mc concrete</text><text x="830.0" y="113.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">ratio of abstract to all</text><path d="M19.3 180.1L501.1 180.8L501.1 311.1L19.7 308.8Z" fill="#d3dbe0" stroke="none"/><path d="M18.5 180.8Q259.6 182.0 500.6 180.5M17.6 180.4Q259.4 182.4 501.1 180.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M499.9 178.1Q501.3 244.9 500.5 311.8M500.0 179.0Q500.6 244.8 499.1 310.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M502.0 310.4Q260.6 309.3 19.3 309.1M501.7 310.0Q260.0 308.7 18.3 309.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.9 312.0Q21.5 244.7 20.3 177.5M21.0 311.4Q22.1 245.4 19.0 179.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="260.0" y="229.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Instability  I = Ce / (Ce + Ca)</text><text x="260.0" y="251.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">example: Ca = 2, Ce = 0 gives 0;  Ca = 2, Ce = 3 gives 3/5</text><text x="260.0" y="273.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">near 1: highly unstable;  near 0: stable (mostly abstract) or rigid (mostly concrete)</text><path d="M519.1 179.1L979.6 179.3L979.6 310.2L519.4 310.1Z" fill="#dfd6e7" stroke="none"/><path d="M517.7 179.3Q749.8 181.0 981.8 179.3M519.1 179.1Q750.1 182.8 981.2 180.6" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.0 179.4Q982.1 245.4 979.4 311.3M980.1 178.9Q980.8 245.2 980.0 311.6" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.4 310.6Q750.2 309.2 518.1 309.5M982.5 309.0Q750.2 309.8 517.9 309.9" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M520.9 311.0Q520.9 244.9 521.0 178.7M520.3 310.5Q520.2 244.3 519.6 178.0" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="229.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Distance from the main sequence</text><text x="750.0" y="251.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">D = |A + I - 1|</text><text x="750.0" y="273.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">look at A and I together, not alone</text></svg>