<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M21.1 20.0L490.3 20.4L488.9 60.3L20.7 59.2Z" fill="#efe0ca" stroke="none"/><path d="M18.5 20.0Q255.1 20.0 491.8 19.6M19.5 20.4Q255.5 19.6 491.5 20.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 18.3Q489.8 39.7 490.0 61.2M489.9 17.9Q491.0 39.5 490.3 61.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 59.4Q255.1 62.2 18.7 59.5M491.4 59.7Q254.6 58.2 17.8 60.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 61.0Q20.3 39.3 20.1 17.7M20.2 60.9Q19.1 40.1 19.1 19.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Coarse-grained library (SharedStuff.jar)</text><path d="M19.1 69.9L490.2 69.7L490.7 179.7L21.0 179.8Z" fill="#f1ede5" stroke="none"/><path d="M18.4 69.3Q254.7 70.9 491.0 69.1M17.7 69.3Q254.6 71.7 491.5 69.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 67.9Q491.4 124.6 489.3 181.3M489.2 68.5Q488.9 124.5 490.4 180.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 179.5Q254.6 180.0 17.9 179.1M490.9 180.2Q254.4 181.3 17.9 180.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.2 182.1Q22.4 125.5 20.3 68.9M19.8 182.0Q18.4 125.2 19.0 68.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="109.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Dependency management is simple</text><text x="255.0" y="131.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Any change forces every service to adopt it eventually</text><text x="255.0" y="153.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Large retest and redeploy scope</text><path d="M511.1 19.0L980.3 20.4L980.5 58.8L509.4 61.1Z" fill="#d6e1cf" stroke="none"/><path d="M508.4 19.4Q745.0 21.4 981.6 19.4M509.6 20.2Q745.0 20.6 980.5 20.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 19.2Q981.3 39.8 980.3 60.5M981.1 17.5Q979.6 39.0 979.8 60.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 59.6Q744.5 61.6 508.0 60.0M982.1 59.3Q745.2 58.6 508.4 59.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 61.3Q511.1 40.2 510.1 19.1M509.5 62.4Q509.7 40.1 510.0 17.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Fine-grained libraries (by function)</text><path d="M509.3 70.1L981.1 70.8L981.1 181.1L509.7 178.8Z" fill="#f1ede5" stroke="none"/><path d="M508.5 70.8Q744.6 72.0 980.6 70.5M507.6 70.4Q744.4 72.4 981.1 70.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 68.1Q981.2 124.9 980.5 181.8M980.0 69.0Q980.5 124.8 979.1 180.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 180.4Q745.6 179.3 509.3 179.1M981.7 180.0Q745.0 178.7 508.3 179.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.9 182.0Q511.3 124.7 510.3 67.5M511.0 181.4Q511.9 125.4 509.0 69.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="109.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">A change touches only the services using that library</text><text x="745.0" y="131.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Dependency matrix grows into a &#x27;distributed monolith&#x27;</text><text x="745.0" y="153.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(200 services and 40 libraries is unmaintainable)</text><path d="M19.1 199.1L979.6 199.3L979.6 315.2L19.4 315.1Z" fill="#d0dfdc" stroke="none"/><path d="M17.7 199.3Q499.8 201.0 981.8 199.3M19.1 199.1Q500.1 202.8 981.2 200.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.0 199.4Q981.9 257.9 979.4 316.3M980.1 198.9Q980.8 257.7 980.0 316.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.4 315.6Q500.2 314.2 18.1 314.5M982.5 314.0Q500.2 314.8 17.9 314.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 316.0Q20.9 257.4 21.0 198.7M20.3 315.5Q20.2 256.8 19.6 198.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="241.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">Advice: favour change control over dependency management. Carve off static code (formatters, security) into its own library.</text><text x="500.0" y="263.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">Always version; keep a deprecation policy per library (frequent changers need more retained versions);</text><text x="500.0" y="285.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">never depend on LATEST; serious defects force all services onto the new version at once</text></svg>