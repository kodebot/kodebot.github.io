<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" width="1000" height="415" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="415" fill="#fbf7ef"/><path d="M21.1 20.0L495.3 20.4L493.9 195.3L20.7 194.2Z" fill="#efe0ca" stroke="none"/><path d="M18.5 20.0Q257.6 20.0 496.8 19.6M19.5 20.4Q258.0 19.6 496.5 20.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.8 18.3Q494.2 107.2 495.0 196.2M494.9 17.9Q496.9 107.0 495.3 196.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.5 194.4Q257.6 197.2 18.7 194.5M496.4 194.7Q257.1 193.2 17.8 195.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 196.0Q20.0 106.8 20.1 17.7M20.2 195.9Q18.5 107.6 19.1 19.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="257.5" y="69.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Interservice communication</text><text x="257.5" y="91.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">ask the owner over a remote call</text><text x="257.5" y="113.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ simple, no data volume limit</text><text x="257.5" y="135.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">- latency, scale and availability coupling,</text><text x="257.5" y="157.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">needs contracts</text><path d="M504.1 19.9L980.2 19.7L980.7 194.7L506.0 194.8Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 19.3Q742.2 20.9 981.0 19.1M502.7 19.3Q742.1 21.7 981.5 19.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 17.9Q981.6 107.1 979.3 196.3M979.2 18.5Q978.8 107.0 980.4 195.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 194.5Q742.1 195.0 502.9 194.1M980.9 195.2Q741.9 196.3 502.9 195.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.2 197.1Q507.7 108.0 505.3 18.9M504.8 197.0Q503.2 107.7 504.0 18.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="742.5" y="69.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Column schema replication</text><text x="742.5" y="91.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">copy the column into your table</text><text x="742.5" y="113.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ fast, independent</text><text x="742.5" y="135.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">- sync, consistency, ownership governance</text><text x="742.5" y="157.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">(good for reporting, aggregation)</text><path d="M21.1 209.0L495.3 210.4L495.5 383.8L19.4 386.1Z" fill="#d6e1cf" stroke="none"/><path d="M18.4 209.4Q257.5 211.4 496.6 209.4M19.6 210.2Q257.5 210.6 495.5 210.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 209.2Q496.9 297.3 495.3 385.5M496.1 207.5Q493.6 296.5 494.8 385.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.1 384.6Q257.0 386.6 18.0 385.0M497.1 384.3Q257.7 383.6 18.4 384.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.6 386.3Q22.0 297.7 20.1 209.1M19.5 387.4Q19.6 297.6 20.0 207.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="257.5" y="259.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Replicated cache</text><text x="257.5" y="281.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">read-only in-memory copy per service</text><text x="257.5" y="303.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ fast, fault tolerant, owner kept</text><text x="257.5" y="325.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">- startup dependency, volume,</text><text x="257.5" y="347.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">update rate, cloud configuration</text><path d="M504.3 210.1L981.1 210.8L981.1 386.1L504.7 383.8Z" fill="#d3dbe0" stroke="none"/><path d="M503.5 210.8Q742.1 212.0 980.6 210.5M502.6 210.4Q741.9 212.4 981.1 210.6" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 208.1Q981.3 297.4 980.5 386.8M980.0 209.0Q980.6 297.3 979.1 385.7" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 385.4Q743.1 384.3 504.3 384.1M981.7 385.0Q742.5 383.7 503.3 384.4" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.9 387.0Q506.5 297.2 505.3 207.5M506.0 386.4Q507.1 297.9 504.0 209.5" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="742.5" y="259.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Data domain</text><text x="742.5" y="281.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">services share a schema</text><text x="742.5" y="303.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">+ SQL joins, consistent, independent</text><text x="742.5" y="325.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">- broad context, governance,</text><text x="742.5" y="347.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">security of access</text><text x="500" y="405" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">Four read-access patterns (Tables 10-1 to 10-4), example: Wishlist Service needs item_desc owned by Catalog Service</text></svg>