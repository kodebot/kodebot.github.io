<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M21.1 20.0L490.3 20.4L488.9 60.3L20.7 59.2Z" fill="#efe0ca" stroke="none"/><path d="M18.5 20.0Q255.1 20.0 491.8 19.6M19.5 20.4Q255.5 19.6 491.5 20.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.8 18.3Q489.8 39.7 490.0 61.2M489.9 17.9Q491.0 39.5 490.3 61.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.5 59.4Q255.1 62.2 18.7 59.5M491.4 59.7Q254.6 58.2 17.8 60.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 61.0Q20.3 39.3 20.1 17.7M20.2 60.9Q19.1 40.1 19.1 19.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Stamp coupling</text><path d="M19.1 69.9L490.2 69.7L490.7 189.7L21.0 189.8Z" fill="#f1ede5" stroke="none"/><path d="M18.4 69.3Q254.7 70.9 491.0 69.1M17.7 69.3Q254.6 71.7 491.5 69.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 67.9Q491.5 129.6 489.3 191.3M489.2 68.5Q488.8 129.5 490.4 190.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 189.5Q254.6 190.0 17.9 189.1M490.9 190.2Q254.4 191.3 17.9 190.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.2 192.1Q22.6 130.5 20.3 68.9M19.8 192.0Q18.3 130.2 19.0 68.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="103.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">A large structure passes between services;</text><text x="255.0" y="125.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">each uses only a small part (travel itinerary XML)</text><text x="255.0" y="147.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Over-coupling: Profile change in an unused field</text><text x="255.0" y="169.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(state) still breaks Wishlist</text><path d="M511.1 19.0L980.3 20.4L980.5 58.8L509.4 61.1Z" fill="#eed5cc" stroke="none"/><path d="M508.4 19.4Q745.0 21.4 981.6 19.4M509.6 20.2Q745.0 20.6 980.5 20.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 19.2Q981.3 39.8 980.3 60.5M981.1 17.5Q979.6 39.0 979.8 60.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.1 59.6Q744.5 61.6 508.0 60.0M982.1 59.3Q745.2 58.6 508.4 59.7" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 61.3Q511.1 40.2 510.1 19.1M509.5 62.4Q509.7 40.1 510.0 17.8" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Bandwidth</text><path d="M509.3 70.1L981.1 70.8L981.1 191.1L509.7 188.8Z" fill="#f1ede5" stroke="none"/><path d="M508.5 70.8Q744.6 72.0 980.6 70.5M507.6 70.4Q744.4 72.4 981.1 70.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 68.1Q981.3 129.9 980.5 191.8M980.0 69.0Q980.6 129.8 979.1 190.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 190.4Q745.6 189.3 509.3 189.1M981.7 190.0Q745.0 188.7 508.3 189.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.9 192.0Q511.4 129.7 510.3 67.5M511.0 191.4Q512.0 130.4 509.0 69.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="103.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2,000 requests per second at 500 KB each is</text><text x="745.0" y="125.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">about 1,000,000 KB per second</text><text x="745.0" y="147.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">versus 200 bytes of name only: about 400 KB</text><text x="745.0" y="169.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(the book&#x27;s example; bandwidth is not infinite)</text><path d="M19.1 209.1L979.6 209.3L979.6 315.2L19.4 315.1Z" fill="#d0dfdc" stroke="none"/><path d="M17.7 209.3Q499.8 211.0 981.8 209.3M19.1 209.1Q500.1 212.8 981.2 210.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.0 209.4Q981.7 262.9 979.4 316.3M980.1 208.9Q980.7 262.7 980.0 316.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.4 315.6Q500.2 314.2 18.1 314.5M982.5 314.0Q500.2 314.8 17.9 314.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 316.0Q20.9 262.4 21.0 208.7M20.3 315.5Q20.2 261.8 19.6 208.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="246.5" font-size="15.5" fill="#3b2f20" text-anchor="middle">Stamp coupling for workflow: the contract carries workflow status and transactional state; each service updates its part</text><text x="500.0" y="268.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">and passes it on, so complex workflows can run choreographed. Cost: higher (sometimes artificial) coupling and</text><text x="500.0" y="290.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">bandwidth issues at scale. Semantic coupling must go somewhere</text></svg>