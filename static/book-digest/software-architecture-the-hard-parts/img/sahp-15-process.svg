.9 150.4L344.0 150.4Z" fill="#d0dfdc" stroke="none"/><path d="M343.3 19.5Q497.1 18.6 650.9 19.1M342.9 20.2Q496.9 19.3 650.9 20.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M650.2 19.1Q647.8 85.5 650.3 151.9M649.8 19.0Q650.6 85.2 649.0 151.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M652.5 149.1Q498.2 148.3 343.8 150.3M650.4 149.4Q497.5 151.5 344.5 149.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M345.1 150.9Q346.0 85.2 345.7 19.6M344.0 151.6Q346.6 85.5 345.1 19.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="497.5" y="58.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">2. Analyse the coupling</text><text x="497.5" y="80.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">if X changes, might Y have to</text><text x="497.5" y="102.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">change? model combinations,</text><text x="497.5" y="124.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">static coupling diagram</text><path d="M650.3 84.0Q660.0 84.0 669.6 86.1M649.8 84.0Q660.2 83.9 670.6 84.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.7 85.0Q664.3 82.6 659.0 79.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.0 84.8Q664.8 87.9 659.5 90.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.1 20.7L975.6 19.5L976.0 150.0L669.2 149.9Z" fill="#d6e1cf" stroke="none"/><path d="M667.9 20.1Q822.7 23.4 977.5 20.7M669.5 19.8Q822.4 22.3 975.4 20.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M974.1 19.0Q973.7 84.8 975.4 150.6M974.6 19.1Q976.4 85.3 975.6 151.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M977.0 150.3Q822.5 148.8 668.1 150.0M975.6 149.2Q821.9 148.6 668.1 150.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.8 150.6Q670.5 84.6 670.2 18.7M669.8 150.9Q671.7 84.6 670.4 18.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="822.5" y="58.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">3. Assess trade-offs</text><text x="822.5" y="80.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">impact of change on the</text><text x="822.5" y="102.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">interdependent parts; fix one</text><text x="822.5" y="124.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">dimension, iterate on the next</text><path d="M20.3 173.9L980.5 176.1L979.9 283.9L21.1 285.8Z" fill="#f1ede5" stroke="none"/><path d="M17.6 174.1Q499.4 173.1 981.2 174.3M18.7 174.5Q500.1 172.3 981.6 174.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.3 172.8Q982.8 230.0 980.6 287.1M979.7 174.1Q978.0 230.3 981.0 286.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.9 284.8Q499.3 283.9 17.7 285.1M981.5 285.1Q499.9 283.6 18.2 285.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.6 286.0Q17.4 230.3 20.3 174.5M19.4 286.4Q18.4 230.4 19.9 174.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="225.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Iterate: no first draft is perfect. Build sample topologies and a matrix, play qualitative what-if games.</text><text x="500.0" y="247.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">What is left after the entangled decisions are solved is design</text></svg>