<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="300" fill="#ffffff"/><rect x="20" y="20" width="920" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="480.0" y="43.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">@Around wraps the whole call</text><text x="480.0" y="63.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">you decide when, and whether, to call proceed()</text><rect x="20" y="130" width="150" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="95.0" y="160.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">@Before</text><text x="95.0" y="180.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">then the method</text><rect x="215" y="130" width="200" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="315.0" y="160.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Intercepted</text><text x="315.0" y="180.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">method</text><rect x="490" y="95" width="230" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="605.0" y="125.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">@AfterReturning</text><text x="605.0" y="145.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">success: gets the value</text><rect x="490" y="200" width="230" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="605.0" y="230.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">@AfterThrowing</text><text x="605.0" y="250.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">exception: gets it</text><rect x="780" y="140" width="160" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="860.0" y="170.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">@After</text><text x="860.0" y="190.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">always runs</text><line x1="170" y1="165" x2="215" y2="165" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="415" y1="150" x2="490" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="415" y1="180" x2="490" y2="235" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="720" y1="130" x2="780" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="720" y1="235" x2="780" y2="190" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/></svg>