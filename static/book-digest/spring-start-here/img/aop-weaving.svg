<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><rect x="20" y="40" width="150" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="95.0" y="70.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">No aspect</text><text x="95.0" y="90.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">direct call</text><rect x="210" y="40" width="170" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="295.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Caller</text><rect x="470" y="40" width="260" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="600.0" y="70.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">CommentService bean</text><text x="600.0" y="90.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">publishComment()</text><line x1="380" y1="75" x2="470" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="190" width="150" height="80" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="95.0" y="225.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Aspect</text><text x="95.0" y="245.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">applied</text><rect x="210" y="190" width="140" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="280.0" y="235.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Caller</text><rect x="395" y="190" width="170" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="480.0" y="225.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Proxy</text><text x="480.0" y="245.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">Spring gives you</text><rect x="610" y="190" width="150" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="685.0" y="225.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Aspect logic</text><text x="685.0" y="245.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">advice: when</text><rect x="805" y="190" width="160" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="885.0" y="225.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Real bean</text><text x="885.0" y="245.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">publishComment()</text><line x1="350" y1="230" x2="395" y2="230" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="565" y1="230" x2="610" y2="230" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="760" y1="230" x2="805" y2="230" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="210" y="310" width="755" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="587.5" y="340.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Weaving = wrapping the target bean in a proxy</text><text x="587.5" y="360.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">getBean() and @Autowired both hand you the proxy, not the real bean</text></svg>