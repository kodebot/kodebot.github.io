<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="200" fill="#ffffff"/><rect x="30" y="50" width="200" height="96" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="130.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">1. Configuration class</text><text x="130.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">annotate it</text><text x="130.0" y="123.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">@Configuration</text><rect x="270" y="50" width="200" height="96" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="370.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">2. Bean method</text><text x="370.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">returns the object,</text><text x="370.0" y="123.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">annotated @Bean</text><rect x="510" y="50" width="200" height="96" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="610.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">3. Start the context</text><text x="610.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">pass the config class</text><text x="610.0" y="123.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">to its constructor</text><rect x="750" y="50" width="220" height="96" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="860.0" y="83.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Result</text><text x="860.0" y="103.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">Spring calls the method and</text><text x="860.0" y="123.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">stores the object as a bean</text><line x1="230" y1="98" x2="270" y2="98" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="470" y1="98" x2="510" y2="98" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="710" y1="98" x2="750" y2="98" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/></svg>