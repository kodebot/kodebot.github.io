<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="380" fill="#ffffff"/><rect x="250" y="20" width="400" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="450.0" y="45.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Inject a Parrot</text><text x="450.0" y="65.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">but several Parrot beans exist</text><rect x="40" y="150" width="240" height="64" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="160.0" y="187.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">@Primary on one bean</text><rect x="330" y="150" width="240" height="64" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="450.0" y="177.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">@Qualifier(&quot;parrot2&quot;)</text><text x="450.0" y="197.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">or matching parameter name</text><rect x="620" y="150" width="240" height="64" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="740.0" y="187.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Neither of them</text><line x1="380" y1="80" x2="160" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="450" y1="80" x2="450" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="520" y1="80" x2="740" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="280" width="240" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="160.0" y="310.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Spring injects</text><text x="160.0" y="330.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">the primary bean</text><rect x="330" y="280" width="240" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="450.0" y="310.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Spring injects</text><text x="450.0" y="330.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">parrot2 (Miki)</text><rect x="620" y="280" width="240" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="740.0" y="310.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Exception: found several,</text><text x="740.0" y="330.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">cannot choose</text><line x1="160" y1="214" x2="160" y2="280" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="450" y1="214" x2="450" y2="280" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="740" y1="214" x2="740" y2="280" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/></svg>