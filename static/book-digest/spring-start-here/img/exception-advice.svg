<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="360" fill="#ffffff"/><rect x="20" y="40" width="150" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="95.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Client</text><text x="95.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">POST /payment</text><rect x="230" y="40" width="220" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="340.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">PaymentController</text><text x="340.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">happy path only</text><rect x="510" y="40" width="220" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="620.0" y="70.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">PaymentService</text><text x="620.0" y="90.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">throws NotEnoughMoney</text><line x1="170" y1="75" x2="230" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="450" y1="75" x2="510" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="230" y="200" width="300" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="380.0" y="225.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">ExceptionControllerAdvice</text><text x="380.0" y="245.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">@RestControllerAdvice</text><text x="380.0" y="265.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">@ExceptionHandler(...)</text><line x1="620" y1="110" x2="440" y2="200" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="600" y="160" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">exception intercepted</text><rect x="640" y="200" width="320" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="800.0" y="225.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">400 Bad Request</text><text x="800.0" y="245.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">body: ErrorDetails</text><text x="800.0" y="265.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">message: Not enough money</text><line x1="530" y1="240" x2="640" y2="240" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="305" width="940" height="40" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="330.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">One place handles an exception for every endpoint, so controllers stay simple and nothing is duplicated</text></svg>