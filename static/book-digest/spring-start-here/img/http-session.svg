<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><rect x="20" y="110" width="150" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="95.0" y="145.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Client</text><text x="95.0" y="165.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">no memory</text><rect x="280" y="30" width="260" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="410.0" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Request 1: add item</text><text x="410.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">server creates session ID</text><rect x="280" y="210" width="260" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="410.0" y="245.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Request 2: add item</text><text x="410.0" y="265.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">header carries session ID</text><rect x="650" y="100" width="310" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="805.0" y="135.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Server memory</text><text x="805.0" y="155.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">session ID abc123</text><text x="805.0" y="175.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">cart: item 1, item 2</text><line x1="170" y1="140" x2="280" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="170" y1="165" x2="280" y2="245" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="70" x2="650" y2="130" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="250" x2="650" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="650" y="230" width="310" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="805.0" y="260.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Session ends after idle time</text><text x="805.0" y="280.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">usually under an hour, never many hours</text></svg>