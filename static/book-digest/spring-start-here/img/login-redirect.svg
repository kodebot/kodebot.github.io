<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><rect x="20" y="130" width="170" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="105.0" y="170.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">GET /main</text><rect x="250" y="130" width="250" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="375.0" y="160.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Session bean has</text><text x="375.0" y="180.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">a username?</text><line x1="190" y1="165" x2="250" y2="165" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="600" y="30" width="270" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="735.0" y="60.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">return main.html</text><text x="735.0" y="80.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">welcome page</text><rect x="600" y="230" width="270" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="735.0" y="260.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">redirect:/</text><text x="735.0" y="280.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">back to the login page</text><line x1="500" y1="150" x2="600" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="550.0" y="107.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><line x1="500" y1="185" x2="600" y2="255" stroke="#6