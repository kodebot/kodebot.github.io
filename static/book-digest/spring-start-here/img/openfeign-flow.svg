<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 200" width="980" height="200" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="200" fill="#ffffff"/><rect x="20" y="40" width="280" height="90" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="160.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">@FeignClient interface</text><text x="160.0" y="100.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">PaymentsProxy: methods + annotations</text><line x1="300" y1="85" x2="340" y2="85" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="340" y="40" width="280" height="90" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="480.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">OpenFeign</text><text x="480.0" y="100.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">implements it at startup</text><line x1="620" y1="85" x2="660" y2="85" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="660" y="40" width="280" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="800.0" y="80.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Bean in the context</text><text x="800.0" y="100.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">inject it like any bean</text><rect x="20" y="150" width="940" height="36" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="173.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">@EnableFeignClients(basePackages = ...) tells OpenFeign where to look</text></svg>