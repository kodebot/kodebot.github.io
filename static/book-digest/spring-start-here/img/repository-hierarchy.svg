<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><rect x="250" y="20" width="480" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="50.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Repository</text><text x="490.0" y="70.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">marker interface: no operations</text><rect x="250" y="115" width="480" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="490.0" y="145.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">CrudRepository</text><text x="490.0" y="165.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">create, read, update, delete</text><rect x="250" y="210" width="480" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="490.0" y="240.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">PagingAndSortingRepository</text><text x="490.0" y="260.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">adds sorting and pages</text><rect x="100" y="305" width="320" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="260.0" y="335.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">JpaRepository</text><text x="260.0" y="355.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Spring Data JPA only</text><rect x="560" y="305" width="320" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="720.0" y="335.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">MongoRepository</text><