<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="340" fill="#ffffff"/><rect x="340" y="20" width="300" height="64" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="490.0" y="47.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Need to call a</text><text x="490.0" y="67.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">REST endpoint</text><rect x="20" y="150" width="220" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="130.0" y="185.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">RestClient</text><text x="130.0" y="205.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">simple, no extra dependency</text><text x="130.0" y="225.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">default choice</text><rect x="270" y="150" width="220" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="380.0" y="185.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">OpenFeign</text><text x="380.0" y="205.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">write an interface, Spring</text><text x="380.0" y="225.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">implements it (Spring Cloud)</text><rect x="520" y="150" width="220" height="100" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="630.0" y="185.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">WebClient</text><text x="630.0" y="205.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">reactive, non-blocking</text><text x="630.0" y="225.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">needs WebFlux</text><rect x="770" y="150" width="190" height="100" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="865.0" y="185.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">RestTemplate</text><text x="865.0" y="205.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">legacy</text><text x="865.0" y="225.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">not for new code</text><line x1="490" y1="84" x2="130" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="490" y1="84" x2="380" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="490" y1="84" x2="630" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="490" y1="84" x2="865" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="280" width="940" height="44" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="307.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Not reactive: RestClient or OpenFeign. Reactive app: WebClient. Spring docs&#x27; WebClient advice only suits reactive apps.</text></svg>