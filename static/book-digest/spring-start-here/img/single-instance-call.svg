<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><rect x="30" y="100" width="220" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="140.0" y="130.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">person() calls parrot()</text><text x="140.0" y="150.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">inside the config class</text><rect x="330" y="100" width="240" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="450.0" y="130.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Is the Parrot bean</text><text x="450.0" y="150.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">already in the context?</text><line x1="250" y1="135" x2="330" y2="135" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="680" y="25" width="200" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="780.0" y="60.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Return the existing</text><text x="780.0" y="80.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">instance (no new call)</text><rect x="680" y="170" width="200" height="90" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="780.0" y="200.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Call parrot(), store</text><text x="780.0" y="220.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">the result as the bean,</text><text x="780.0" y="240.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">then return it</text><line x1="570" y1="120" x2="680" y2="70" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="625.0" y="87.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><line x1="570" y1="150" x2="680" y2="205" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="625.0" y="169.5" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">no</text><rect x="30" y="215" width="520" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="290.0" y="240.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Result: only ONE Parrot exists</text><text x="290.0" y="260.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">the constructor message prints once</text></svg>