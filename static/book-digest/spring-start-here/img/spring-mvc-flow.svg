<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="420" fill="#ffffff"/><rect x="20" y="40" width="140" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="90.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Client</text><text x="90.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">1 HTTP request</text><rect x="205" y="40" width="170" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="290.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Tomcat</text><text x="290.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">2 calls servlet</text><rect x="420" y="40" width="230" height="70" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="535.0" y="70.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">DispatcherServlet</text><text x="535.0" y="90.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">3 front controller</text><rect x="710" y="40" width="240" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="830.0" y="70.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Controller</text><text x="830.0" y="90.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">5 you write this</text><line x1="160" y1="75" x2="205" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="375" y1="75" x2="420" y2="75" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="650" y1="62" x2="710" y2="62" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><t