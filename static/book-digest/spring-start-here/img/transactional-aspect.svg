<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="380" fill="#ffffff"/><rect x="20" y="30" width="160" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="100.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Caller</text><rect x="240" y="30" width="240" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="360.0" y="60.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Spring transaction aspect</text><text x="360.0" y="80.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">starts a transaction</text><rect x="540" y="30" width="220" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="650.0" y="60.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">transferMoney()</text><text x="650.0" y="80.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">@Transactional</text><line x1="180" y1="65" x2="240" y2="65" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="480" y1="65" x2="540" y2="65" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="800" y="15" width="160" height="40" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="880.0" y="40.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">exception thrown</text><rect x="800" y="75" width="160" height="40" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="880.0" y="100.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">method returns</text><line x1="760" y1="55" x2="800" y2="35" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="760" y1="78" x2="800" y2="95" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="160" width="440" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="240.0" y="190.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Exception reaches the aspect</text><text x="240.0" y="210.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">ROLLBACK</text><text x="240.0" y="230.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">data restored</text><rect x="500" y="160" width="460" height="90" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="730.0" y="190.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Method catches it and does NOT rethrow</text><text x="730.0" y="210.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">the aspect never sees it</text><text x="730.0" y="230.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">COMMIT of partial work</text><rect x="20" y="275" width="940" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="310.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Default rollback: runtime exceptions only. Checked exceptions do not roll back (they are controlled</text><text x="490.0" y="330.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">scenarios you must handle); you can change this with attributes of @Transactional, but keep defaults when you can.</text></svg>