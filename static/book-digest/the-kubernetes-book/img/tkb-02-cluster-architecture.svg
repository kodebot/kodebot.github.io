<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="430" fill="#ffffff"/><rect x="20" y="15" width="540" height="400" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Control plane node (3 or 5 for HA)</text><rect x="40" y="70" width="160" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="120.0" y="93.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Cluster store</text><text x="120.0" y="113.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">etcd</text><rect x="260" y="70" width="190" height="56" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="355.0" y="93.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">API server</text><text x="355.0" y="113.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">front end for everything</text><line x1="260" y1="98" x2="200" y2="98" stroke="#6f8aa3" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="230.0" y="62" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">desired state</text><rect x="40" y="230" width="150" height="56" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="115.0" y="253.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Scheduler</text><text x="115.0" y="273.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">assigns Pods</text><line x1="355" y1="126" x2="115" y2="230" stroke="#6f8aa3" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><rect x="200" y=