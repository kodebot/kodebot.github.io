<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="820" height="340" fill="#ffffff"/><rect x="30" y="60" width="200" height="80" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="130.0" y="85.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Desired state</text><text x="130.0" y="105.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">what you asked for</text><text x="130.0" y="125.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">e.g. 10 replicas</text><rect x="310" y="60" width="200" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="410.0" y="95.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Controller</text><text x="410.0" y="115.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">background watch loop</text><rect x="590" y="60" width="200" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="690.0" y="85.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Observed state</text><text x="690.0" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">what is running</text><text x="690.0" y="125.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">e.g. 8 replicas</text><line x1="230" y1="100" x2="310" y2="100" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="270.0" y="92" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">reads</text><line x1="590" y1="100" x2="510" y2="100" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="550.0" y="92" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">reads</text><rect x="310" y="200" width="200" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="410.0" y="225.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Reconcile</text><text x="410.0" y="245.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">create 2 replicas</text><line x1="410" y1="140" x2="410" y2="200" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="174" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">differs</text><line x1="510" y1="230" x2="690" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="640" y="205" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">observed becomes 10</text><rect x="160" y="290" width="500" height="40" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="410.0" y="315.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Runs continuously: failures, scaling and updates all trigger it</text></svg>