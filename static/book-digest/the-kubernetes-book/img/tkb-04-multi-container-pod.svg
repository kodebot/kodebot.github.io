<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="840" height="390" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="840" height="390" fill="#ffffff"/><rect x="20" y="140" width="110" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="75.0" y="175.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Client</text><rect x="170" y="20" width="520" height="300" rx="12" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="184" y="44" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Pod  (IP 10.0.10.15)</text><text x="184" y="63" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">one shared execution environment</text><rect x="200" y="85" width="210" height="80" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="305.0" y="120.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Main app</text><text x="305.0" y="140.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">port 8080</text><rect x="450" y="85" width="210" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="555.0" y="120.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Sidecar</text><text x="555.0" y="140.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">port 5005</text><line x1="410" y1="125" x2="450" y2="125" stroke="#6f8aa3" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="430.0" y="113" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">localhost</text><rect x="200" y="215" width="460" height="56" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="430.0" y="238.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Shared volume</text><text x="430.0" y="258.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">sidecar syncs content, app serves it</text><line x1="305" y1="165" x2="305" y2="215" stroke="#6f8aa3" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="555" y1="165" x2="555" y2="215" stroke="#6f8aa3" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="130" y1="170" x2="170" y2="170" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="150.0" y="160" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">Pod IP:port</text><text x="430" y="350" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">Shared by all containers: network (net), files and volumes (mnt), memory (IPC), process tree (pid), hostname (uts)</text></svg>