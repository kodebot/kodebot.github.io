<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><rect x="20" y="15" width="420" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">One cluster: soft isolation</text><rect x="50" y="60" width="360" height="40" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="230.0" y="85.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Shared nodes and control plane</text><rect x="50" y="115" width="165" height="160" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="64" y="139" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Namespace A</text><text x="64" y="158" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">own quotas, policies</text><rect x="245" y="115" width="165" height="160" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="259" y="139" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Namespace B</text><text x="259" y="158" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">own quotas, policies</text><rect x="65" y="205" width="135" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="132.5" y="235.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">App</text><rect x="260" y="205" width="135" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="327.5" y="235.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">App</text><line x1="200" y1="230" x2="260" y2="230" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="230" y="296" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a compromised workload can</text><text x="230" y="312" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">reach the other Namespace</text><rect x="470" y="15" width="410" height="330" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="492" y="49" font-size="16" font-weight="700" fill="#14324f">Separate clusters: strong isolation</text><rect x="490" y="60" width="175" height="215" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="504" y="84" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Cluster A</text><text x="504" y="103" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">own control plane</text><rect x="685" y="60" width="175" height="215" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="699" y="84" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Cluster B</text><text x="699" y="103" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">own control plane</text><rect x="505" y="130" width="145" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="577.5" y="160.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Tenant A</text><rect x="700" y="130" width="145" height="50" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="772.5" y="160.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Tenant B</text><rect x="505" y="205" width="145" height="50" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="577.5" y="235.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Own hardware</text><rect x="700" y="205" width="145" height="50" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="772.5" y="235.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Own hardware</text><text x="675" y="300" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">costs more and adds management overhead</text></svg>