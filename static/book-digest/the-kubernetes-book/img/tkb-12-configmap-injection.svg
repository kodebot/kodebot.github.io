<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><rect x="20" y="120" width="170" height="90" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="105.0" y="150.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">ConfigMap</text><text x="105.0" y="170.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">key-value pairs,</text><text x="105.0" y="190.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">up to 1 MiB</text><rect x="300" y="25" width="270" height="62" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="435.0" y="51.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Environment variables</text><text x="435.0" y="71.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">fixed at container start</text><line x1="190" y1="165" x2="300" y2="56" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="570" y1="56" x2="660" y2="165" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="300" y="130" width="270" height="62" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="435.0" y="156.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Startup command args</text><text x="435.0" y="176.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">fixed at container start</text><line x1="190" y1="165" x2="300" y2="161" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="570" y1="161" x2="660" y2="165" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="300" y="235" width="270" height="62" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="435.0" y="261.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Files in a volume</text><text x="435.0" y="281.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">updates reach live containers</text><line x1="190" y1="165" x2="300" y2="266" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="570" y1="266" x2="660" y2="165" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="660" y="120" width="210" height="90" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="765.0" y="150.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Container</text><text x="765.0" y="170.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">reads env, args</text><text x="765.0" y="190.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">or files</text></svg>