<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="290" fill="#ffffff"/><rect x="20" y="50" width="270" height="100" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="155.0" y="85.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Alpha</text><text x="155.0" y="105.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">experimental, bugs likely</text><text x="155.0" y="125.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">off by default</text><rect x="365" y="50" width="270" height="100" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="500.0" y="85.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Beta</text><text x="500.0" y="105.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">pre-release, on by default</text><text x="500.0" y="125.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">9-month window to move on</text><rect x="710" y="50" width="270" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="845.0" y="75.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">GA (stable)</text><text x="845.0" y="95.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">production-ready</text><text x="845.0" y="115.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">deprecation: 12 months or</text><text x="845.0" y="135.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">3 releases, longest wins</text><line x1="290" y1="100.0" x2="365" y2="100.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text 