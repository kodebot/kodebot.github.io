<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="380" fill="#ffffff"/><rect x="20" y="30" width="170" height="60" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="105.0" y="65.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">API server</text><rect x="260" y="30" width="210" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="365.0" y="55.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">KMS v2 plugin</text><text x="365.0" y="75.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">control plane node</text><rect x="560" y="30" width="320" height="60" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="720.0" y="55.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">External KMS or HSM</text><text x="720.0" y="75.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">holds the key encryption key (KEK)</text><line x1="190" y1="60" x2="260" y2="60" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="225.0" y="50" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">Unix socket</text><line x1="470" y1="60" x2="560" y2="60" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="515" y="48" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">encrypt / decrypt DEKs</text><rect x="20" y="190" width="170" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="105.0" y="215.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Secret</text><text x="105.0" y="235.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">plain text</text><rect x="260" y="190" width="210" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="365.0" y="215.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Encrypted with a</text><text x="365.0" y="235.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">new DEK per write</text><rect x="560" y="190" width="320" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="720.0" y="215.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Stored: encrypted Secret +</text><text x="720.0" y="235.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">DEK encrypted by the KEK</text><line x1="190" y1="220" x2="260" y2="220" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="470" y1="220" x2="560" y2="220" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="305" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">envelope encryption: attackers must compromise the control plane and the external KMS</text><text x="450" y="328" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a snapshot of a control plane node is not enough to read a Secret in plain text</text></svg>