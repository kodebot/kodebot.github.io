<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><rect x="20" y="40" width="230" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="135.0" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Non-blocking</text><text x="135.0" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">records every syscall</text><text x="135.0" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">to an audit log</text><rect x="330" y="40" width="230" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="445.0" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Test extensively</text><text x="445.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">in dev and test</text><rect x="640" y="40" width="240" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="760.0" y="65.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Custom profile</text><text x="760.0" y="85.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">only the syscalls the</text><text x="760.0" y="105.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">app needs</text><line x1="250" y1="80" x2="330" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="560" y1="80" x2="640" y2="80" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="190" width="270" height="80" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="155.0" y="215.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Blocking</text><text x="155.0" y="235.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">blocks all syscalls: secure,</text><text x="155.0" y="255.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">but nothing useful runs</text><rect x="330" y="190" width="270" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="465.0" y="215.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Runtime default</text><text x="465.0" y="235.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">balanced and tested; a</text><text x="465.0" y="255.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">common place to start</text><text x="450" y="305" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">custom profiles are the preferred approach; edge cases missed in testing can fail in production</text></svg>