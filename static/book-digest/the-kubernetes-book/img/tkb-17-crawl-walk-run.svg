<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="270" fill="#ffffff"/><rect x="20" y="50" width="270" height="96" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="155.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Crawl</text><text x="155.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">threat model your</text><text x="155.0" y="123.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">existing apps</text><rect x="360" y="50" width="270" height="96" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="495.0" y="83.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Walk</text><text x="495.0" y="103.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">move to Kubernetes</text><text x="495.0" y="123.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">with security unchanged</text><rect x="700" y="50" width="270" height="96" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="835.0" y="83.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Run</text><text x="835.0" y="103.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">then improve:</text><text x="835.0" y="123.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">simple apps first</text><line x1="290" y1="98.0" x2="360" y2="98.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="630" y1="98.0" x2="700" y2="98.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="190" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">do not change an app&#x27;s security posture during the migration itself</text><text x="480" y="213" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">otherwise a problem is hard to blame: the security change or the migration?</text></svg>