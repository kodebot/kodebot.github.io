<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/><rect x="20" y="40" width="215" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="127.5" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Build</text><text x="127.5" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">approved base image</text><rect x="275" y="40" width="215" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="382.5" y="75.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Scan image</text><text x="382.5" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">known CVEs</text><rect x="530" y="40" width="215" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="637.5" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Scan config</text><text x="637.5" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Dockerfiles, YAML,</text><text x="637.5" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Helm charts</text><rect x="785" y="40" width="215" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="892.5" y="65.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Sign</text><text x="892.5" y="85.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">policy forces</text><text x="892.5" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">signed images</text><line x1="235" y1="80.0" x2="275" y2="80.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="490" y1="80.0" x2="530" y2="80.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="745" y1="80.0" x2="785" y2="80.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="190" width="300" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="170.0" y="220.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Pass</text><text x="170.0" y="240.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">promote to the production repository</text><rect x="380" y="190" width="300" height="70" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="530.0" y="220.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Fail</text><text x="530.0" y="240.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">fail the build, quarantine the image</text><rect x="740" y="190" width="240" height="70" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="860.0" y="220.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">RBAC + network rules</text><text x="860.0" y="240.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">restrict who pushes and pulls</text><line x1="880" y1="120" x2="170" y2="190" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="880" y1="120" x2="530" y2="190" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="500" y="320" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the list is a menu, not an exact workflow: apply as many of these as you can</text></svg>