<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="250" fill="#ffffff"/><rect x="20" y="50" width="170" height="76" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="105.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Developer</text><text x="105.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">signs the image</text><rect x="230" y="50" width="170" height="76" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="315.0" y="83.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Registry</text><text x="315.0" y="103.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">image + signature</text><rect x="440" y="50" width="170" height="76" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="525.0" y="83.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Consumer</text><text x="525.0" y="103.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">pulls the image</text><rect x="650" y="50" width="170" height="76" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="735.0" y="73.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Verify signature</text><text x="735.0" y="93.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">usually by the</text><text x="735.0" y="113.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">container runtime</text><rect x="860" y="50" width="170" height="76" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="945.0" y="83.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Run</text><text x="945.0" y="103.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">correct, untampered</text><line x1="190" y1="88.0" x2="230" y2="88.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="210.0" y="80.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">push</text><line x1="400" y1="88.0" x2="440" y2="88.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="420.0" y="80.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">pull</text><line x1="610" y1="88.0" x2="650" y2="88.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="820" y1="88.0" x2="860" y2="88.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="840.0" y="80.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">valid</text><text x="500" y="175" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">enforce enterprise-wide signing policies so it is not left to individual users</text></svg>