<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="340" fill="#ffffff"/><rect x="20" y="15" width="440" height="310" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Soft multi-tenancy: trusted workloads</text><rect x="45" y="70" width="190" height="160" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="59" y="94" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Namespace: front end</text><rect x="255" y="70" width="180" height="160" rx="12" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="269" y="94" font-size="15" font-weight="700" fill="#14324f" text-anchor="start">Namespace: back end</text><rect x="60" y="130" width="160" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="140.0" y="165.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Web service</text><rect x="270" y="130" width="150" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="345.0" y="165.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Recommendation</text><text x="240" y="265" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">one cluster, shared nodes and control plane</text><text x="240" y="285" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">Namespaces group, limit and apply RBAC: not a security boundary</text><rect x="480" y="15" width="460" height="310" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="502" y="49" font-size="16" font-weight="700" fill="#14324f">Hard multi-tenancy: hostile workloads</text><rect x="500" y="80" width="130" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="565.0" y="115.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Production</text><text x="565.0" y="135.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">cluster</text><rect x="645" y="80" width="130" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="710.0" y="115.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Non-production</text><text x="710.0" y="135.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">cluster</text><rect x="790" y="80" width="130" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="855.0" y="115.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Other customer</text><text x="855.0" y="135.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">cluster</text><text x="710" y="195" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">workloads needing a strong boundary</text><text x="710" y="218" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">run on their own clusters and hardware</text><text x="710" y="262" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">Kubernetes does not support secure multi-tenant clusters</text></svg>