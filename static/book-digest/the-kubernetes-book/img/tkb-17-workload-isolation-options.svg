<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="960" height="340" fill="#fbf7ef"/><path d="M21.1 20.0L320.3 20.4L318.9 120.3L20.7 119.2Z" fill="#d6e1cf" stroke="none"/><path d="M18.5 20.0Q170.1 20.0 321.8 19.6M19.5 20.4Q170.5 19.6 321.5 20.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.8 18.3Q319.4 69.7 320.0 121.2M319.9 17.9Q321.6 69.5 320.3 121.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.5 119.4Q170.1 122.2 18.7 119.5M321.4 119.7Q169.6 118.2 17.8 120.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 121.0Q20.1 69.3 20.1 17.7M20.2 120.9Q18.7 70.1 19.1 19.3" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Virtual machines</text><text x="170.0" y="76.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">dedicated kernel each: excellent</text><text x="170.0" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">isolation, slower and heavier</text><path d="M334.1 19.9L635.2 19.7L635.7 119.7L336.0 119.8Z" fill="#f1ede5" stroke="none"/><path d="M333.4 19.3Q484.7 20.9 636.0 19.1M332.7 19.3Q484.6 21.7 636.5 19.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M634.9 17.9Q636.3 69.6 634.3 121.3M634.2 18.5Q633.9 69.5 635.4 120.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M636.3 119.5Q484.6 120.0 332.9 119.1M635.9 120.2Q484.4 121.3 332.9 120.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M335.2 122.1Q337.3 70.5 335.3 18.9M334.8 122.0Q333.4 70.2 334.0 18.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="485.0" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Namespaced containers</text><text x="485.0" y="76.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">share the host kernel: fast and</text><text x="485.0" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">light, extra effort to isolate</text><path d="M651.1 19.0L950.3 20.4L950.5 118.8L649.4 121.1Z" fill="#d0dfdc" stroke="none"/><path d="M648.4 19.4Q800.0 21.4 951.6 19.4M649.6 20.2Q800.0 20.6 950.5 20.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M950.9 19.2Q951.7 69.8 950.3 120.5M951.1 17.5Q949.0 69.0 949.8 120.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M951.1 119.6Q799.5 121.6 648.0 120.0M952.1 119.3Q800.2 118.6 648.4 119.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M650.6 121.3Q651.7 70.2 650.1 19.1M649.5 122.4Q649.6 70.1 650.0 17.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="800.0" y="54.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Every container in its own VM</text><text x="800.0" y="76.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">VM-grade security, but loses much</text><text x="800.0" y="98.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">of containers&#x27; appeal; not popular</text><path d="M179.3 150.1L481.1 150.8L481.1 251.1L179.7 248.8Z" fill="#d0dfdc" stroke="none"/><path d="M178.5 150.8Q329.6 152.0 480.6 150.5M177.6 150.4Q329.4 152.4 481.1 150.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M479.9 148.1Q481.1 199.9 480.5 251.8M480.0 149.0Q480.4 199.8 479.1 250.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M482.0 250.4Q330.6 249.3 179.3 249.1M481.7 250.0Q330.0 248.7 178.3 249.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M179.9 252.0Q181.2 199.7 180.3 147.5M181.0 251.4Q181.7 200.4 179.0 149.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="330.0" y="184.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Different runtime classes</text><text x="330.0" y="206.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">all containers, but workloads needing</text><text x="330.0" y="228.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">stronger isolation get a stronger runtime</text><path d="M494.1 149.1L794.6 149.3L794.6 250.2L494.4 250.1Z" fill="#efe0ca" stroke="none"/><path d="M492.7 149.3Q644.8 151.0 796.8 149.3M494.1 149.1Q645.1 152.8 796.2 150.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M795.0 149.4Q796.7 200.4 794.4 251.3M795.1 148.9Q795.7 200.2 795.0 251.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M797.4 250.6Q645.2 249.2 493.1 249.5M797.5 249.0Q645.2 249.8 492.9 249.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.9 251.0Q495.9 199.9 496.0 148.7M495.3 250.5Q495.2 199.3 494.6 148.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="645.0" y="184.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Wasm containers</text><text x="645.0" y="206.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">OCI packaging, run in a</text><text x="645.0" y="228.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">deny-by-default Wasm host</text><text x="480" y="290" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">shared-kernel containers rely on namespaces and cgroups, never designed as strong security boundaries</text><text x="480" y="312" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">harden them with AppArmor, SELinux, seccomp, capabilities and user namespaces</text></svg>