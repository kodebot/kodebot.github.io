<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="340" fill="#ffffff"/><rect x="20" y="20" width="300" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="170.0" y="55.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Virtual machines</text><text x="170.0" y="75.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">dedicated kernel each: excellent</text><text x="170.0" y="95.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">isolation, slower and heavier</text><rect x="335" y="20" width="300" height="100" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="485.0" y="55.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Namespaced containers</text><text x="485.0" y="75.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">share the host kernel: fast and</text><text x="485.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">light, extra effort to isolate</text><rect x="650" y="20" width="300" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="800.0" y="55.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Every container in its own VM</text><text x="800.0" y="75.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">VM-grade security, but loses much</text><text x="800.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">of containers&#x27; appeal; not popular</text><rect x="180" y="150" width="300" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="330.0" y="185.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Different runtime classes</text><text x="330.0" y="205.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">all containers, but workloads needing</text><text x="330.0" y="225.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">stronger isolation get a stronger runtime</text><rect x="495" y="150" width="300" height="100" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="645.0" y="185.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Wasm containers</text><text x="645.0" y="205.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">OCI packaging, run in a</text><text x="645.0" y="225.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">deny-by-default Wasm host</text><text x="480" y="290" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">shared-kernel containers rely on namespaces and cgroups, never designed as strong security boundaries</text><text x="480" y="312" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">harden them with AppArmor, SELinux, seccomp, capabilities and user namespaces</text></svg>