<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="960" height="510" fill="#ffffff"/><rect x="380" y="190" width="200" height="80" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="480.0" y="225.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Pod</text><text x="480.0" y="245.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">smallest unit of scheduling</text><rect x="40" y="30" width="240" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="160.0" y="55.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Deployment</text><text x="160.0" y="75.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">stateless: self-healing,</text><text x="160.0" y="95.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">rollouts (via ReplicaSet)</text><rect x="380" y="20" width="200" height="80" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="480.0" y="55.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">StatefulSet</text><text x="480.0" y="75.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">stateful apps</text><rect x="700" y="30" width="240" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="820.0" y="55.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Service</text><text x="820.0" y="75.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">stable name and IP</text><text x="820.0" y="95.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">to a set of Pods</text><rect x="40" y="340" width="240" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="160.0" y="365.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">ConfigMap, Secret</text><text x="160.0" y="385.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">config injected at</text><text x="160.0" y="405.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">run time</text><rect x="380" y="370" width="200" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="480.0" y="395.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">PVC</text><text x="480.0" y="415.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">claims a PV; StorageClass</text><text x="480.0" y="435.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">provisions it dynamically</text><rect x="700" y="340" width="240" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="820.0" y="365.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Ingress</text><text x="820.0" y="385.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">layer-7 routing to</text><text x="820.0" y="405.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">many Services</text><line x1="280" y1="90" x2="380" y2="205" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="300" y="140" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">manages</text><line x1="480" y1="100" x2="480" y2="190" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="150" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">manages</text><line x1="700" y1="90" x2="580" y2="205" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="660" y="140" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">selects Pods</text><line x1="280" y1="380" x2="380" y2="258" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="300" y="330" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">injected</text><line x1="480" y1="370" x2="480" y2="270" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="330" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">mounted</text><line x1="820" y1="340" x2="820" y2="110" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="830" y="225" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">routes to Service</text><text x="480" y="490" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a Namespace partitions the cluster into virtual clusters: good for quotas and access control, not for strong isolation</text></svg>