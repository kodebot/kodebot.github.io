<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="330" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="16.0" fill="#3b2f20" text-anchor="middle">Figure P-1: a fork in the road for a senior engineer (the two paths share many destinations and skills the further you go)</text><path d="M9.1 89.9L490.2 89.7L490.7 304.7L11.0 304.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 89.3Q249.7 90.9 491.0 89.1M7.7 89.3Q249.6 91.7 491.5 89.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 87.9Q491.6 197.1 489.3 306.3M489.2 88.5Q488.8 197.0 490.4 305.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 304.5Q249.6 305.0 7.9 304.1M490.9 305.2Q249.4 306.3 7.9 305.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 307.1Q12.7 198.0 10.3 88.9M9.8 307.0Q8.2 197.7 9.0 88.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="170.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Manager&#x27;s path</text><text x="250.0" y="192.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">clear and well travelled; common default for anyone who communicates clearly,</text><text x="250.0" y="214.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">stays calm in a crisis and helps colleagues; well studied, airport bookshops full</text><text x="250.0" y="236.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">of advice; you gain direct reports</text><path d="M511.1 89.0L990.3 90.4L990.5 303.8L509.4 306.1Z" fill="#efe0ca" stroke="none"/><path d="M508.4 89.4Q750.0 91.4 991.6 89.4M509.6 90.2Q750.0 90.6 990.5 90.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 197.3 990.3 305.5M991.1 87.5Q988.6 196.5 989.8 305.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 304.6Q749.5 306.6 508.0 305.0M992.1 304.3Q750.2 303.6 508.4 304.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 306.3Q512.0 197.7 510.1 89.1M509.5 307.4Q509.6 197.6 510.0 87.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="170.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Staff engineer&#x27;s path</text><text x="750.0" y="192.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">less defined and poorly signposted; technical leader without reports; expectations</text><text x="750.0" y="214.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">vary by company and are vague, so the job stays unclear even once you are in it;</text><text x="750.0" y="236.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">all of it is learnable</text></svg>