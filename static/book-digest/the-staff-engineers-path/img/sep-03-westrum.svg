<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="520" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 85.3L10.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.6 49.7 990.0 86.2M989.9 12.9Q991.3 49.5 990.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 84.4Q500.1 87.2 8.7 84.5M991.4 84.7Q499.6 83.2 7.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 86.0Q10.2 49.3 10.1 12.7M10.2 85.9Q8.9 50.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="45.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Table 2-1: Westrum&#x27;s organisational typology (2004): how organisations process information; DORA research links high-trust cultures that favour information flow with</text><text x="500.0" y="67.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">better software delivery performance</text><path d="M9.1 99.9L330.2 99.7L330.7 429.7L11.0 429.8Z" fill="#eed5cc" stroke="none"/><path d="M8.4 99.3Q169.7 100.9 331.0 99.1M7.7 99.3Q169.6 101.7 331.5 99.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 97.9Q331.6 264.6 329.3 431.3M329.2 98.5Q328.8 264.5 330.4 430.6" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 429.5Q169.6 430.0 7.9 429.1M330.9 430.2Q169.4 431.3 7.9 430.4" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 432.1Q12.7 265.5 10.3 98.9M9.8 432.0Q8.2 265.2 9.0 98.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="227.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Pathological (power-oriented)</text><text x="170.0" y="249.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">low cooperation; messengers shot; responsibilities</text><text x="170.0" y="271.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">shirked; bridging discouraged; failure leads to</text><text x="170.0" y="293.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">scapegoating; novelty crushed. Plan to take fewer risks</text><text x="170.0" y="315.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and protect yourself</text><path d="M341.1 99.0L660.3 100.4L660.5 428.8L339.4 431.1Z" fill="#efe0ca" stroke="none"/><path d="M338.4 99.4Q500.0 101.4 661.6 99.4M339.6 100.2Q500.0 100.6 660.5 100.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 99.2Q661.9 264.8 660.3 430.5M661.1 97.5Q658.6 264.0 659.8 430.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 429.6Q499.5 431.6 338.0 430.0M662.1 429.3Q500.2 428.6 338.4 429.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 431.3Q342.0 265.2 340.1 99.1M339.5 432.4Q339.6 265.1 340.0 97.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="227.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Bureaucratic (rule-oriented)</text><text x="500.0" y="249.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">modest cooperation; messengers neglected; narrow</text><text x="500.0" y="271.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">responsibilities; bridging tolerated; failure leads to</text><text x="500.0" y="293.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">justice; novelty creates problems. Plan ahead, stay in</text><text x="500.0" y="315.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the rules, respect the chain of command</text><path d="M669.3 100.1L991.1 100.8L991.1 431.1L669.7 428.8Z" fill="#d6e1cf" stroke="none"/><path d="M668.5 100.8Q829.6 102.0 990.6 100.5M667.6 100.4Q829.4 102.4 991.1 100.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 98.1Q991.3 264.9 990.5 431.8M990.0 99.0Q990.6 264.8 989.1 430.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 430.4Q830.6 429.3 669.3 429.1M991.7 430.0Q830.0 428.7 668.3 429.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 432.0Q671.5 264.7 670.3 97.5M671.0 431.4Q672.1 265.4 669.0 99.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="227.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Generative (performance-oriented)</text><text x="830.0" y="249.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">high cooperation; messengers trained; risks shared;</text><text x="830.0" y="271.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">bridging encouraged; failure leads to inquiry; novelty</text><text x="830.0" y="293.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">implemented. Blameless postmortems, experimentation,</text><text x="830.0" y="315.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">fewer silos</text><path d="M9.1 444.1L989.6 444.3L989.6 510.2L9.4 510.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 444.3Q499.8 446.0 991.8 444.3M9.1 444.1Q500.1 447.8 991.2 445.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 444.4Q991.2 477.9 989.4 511.3M990.1 443.9Q990.6 477.7 990.0 511.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 510.6Q500.2 509.2 8.1 509.5M992.5 509.0Q500.2 509.8 7.9 509.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 511.0Q10.9 477.4 11.0 443.7M10.3 510.5Q10.1 476.8 9.6 443.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="483.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">Know which you are in: pushing a cart across cobblestones takes more time than across smooth paving, so budget for it and do not get angry at what you cannot control</text></svg>