<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="15.5" fill="#3b2f20" text-anchor="middle">Where projects come from (and the catch for each); work out the shape and how it will grow before you sign on (Figure 4-12)</text><path d="M9.1 79.9L495.2 79.7L495.7 184.7L11.0 184.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q252.2 80.9 496.0 79.1M7.7 79.3Q252.1 81.7 496.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 77.9Q496.3 132.1 494.3 186.3M494.2 78.5Q493.9 132.0 495.4 185.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 184.5Q252.1 185.0 7.9 184.1M495.9 185.2Q251.9 186.3 7.9 185.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 187.1Q12.4 133.0 10.3 78.9M9.8 187.0Q8.4 132.7 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="127.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">You are invited</text><text x="252.5" y="149.5" font-size="14.5" fill="#3b2f20" text-anchor="middle">momentum and recognition; but may be what you have done before</text><path d="M506.1 79.0L990.3 80.4L990.5 183.8L504.4 186.1Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 79.4Q747.5 81.4 991.6 79.4M504.6 80.2Q747.5 80.6 990.5 80.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.7 132.3 990.3 185.5M991.1 77.5Q988.9 131.5 989.8 185.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 184.6Q747.0 186.6 503.0 185.0M992.1 184.3Q747.7 183.6 503.4 184.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 186.3Q506.8 132.7 505.1 79.1M504.5 187.4Q504.6 132.6 505.0 77.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="127.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">You ask to join</text><text x="747.5" y="149.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">go and ask; do not wait to be noticed (culture permitting)</text><path d="M9.3 195.1L496.1 195.8L496.1 301.1L9.7 298.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.5 195.8Q252.1 197.0 495.6 195.5M7.6 195.4Q251.9 197.4 496.1 195.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 193.1Q496.2 247.4 495.5 301.8M495.0 194.0Q495.5 247.3 494.1 300.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 300.4Q253.1 299.3 9.3 299.1M496.7 300.0Q252.5 298.7 8.3 299.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 302.0Q11.3 247.2 10.3 192.5M11.0 301.4Q11.8 247.9 9.0 194.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="242.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">You have an idea</text><text x="252.5" y="264.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">you lead it your way; you must also win support and headcount</text><path d="M504.1 194.1L989.6 194.3L989.6 300.2L504.4 300.1Z" fill="#efe0ca" stroke="none"/><path d="M502.7 194.3Q747.3 196.0 991.8 194.3M504.1 194.1Q747.6 197.8 991.2 195.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 194.4Q991.7 247.9 989.4 301.3M990.1 193.9Q990.7 247.7 990.0 301.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 300.6Q747.7 299.2 503.1 299.5M992.5 299.0Q747.7 299.8 502.9 299.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 301.0Q505.9 247.4 506.0 193.7M505.3 300.5Q505.2 246.8 504.6 193.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="231.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">The fire alarm</text><text x="747.5" y="253.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">clear goals and a bias to action; but a context switch and no narrative if it is</text><text x="747.5" y="275.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">all firefighting</text><path d="M9.5 309.2L494.1 310.5L495.6 414.4L9.8 416.2Z" fill="#efe0ca" stroke="none"/><path d="M8.0 309.5Q252.7 306.6 497.4 310.0M7.8 310.6Q252.6 311.6 497.4 310.2" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 307.6Q495.0 362.6 495.3 417.5M495.0 308.5Q493.6 362.7 495.9 417.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 415.9Q252.6 412.3 8.9 414.2M496.4 414.3Q252.7 411.8 9.0 415.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 417.5Q12.6 362.8 9.3 308.2M9.8 417.3Q12.2 362.8 9.7 308.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="357.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">You claim a problem</text><text x="252.5" y="379.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">side quests build momentum and kudos; too many displace long-term work</text><path d="M506.0 309.5L990.5 309.4L989.4 416.1L503.8 414.1Z" fill="#efe0ca" stroke="none"/><path d="M503.7 308.9Q747.1 306.7 990.6 309.7M504.2 310.4Q748.3 309.5 992.4 310.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 308.5Q987.7 362.9 989.0 417.3M990.6 308.4Q991.0 362.6 990.7 416.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 414.2Q747.9 414.3 503.2 415.1M990.6 414.0Q747.5 416.3 504.4 414.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.8 416.2Q506.3 362.7 505.5 309.3M504.9 415.7Q503.4 361.6 503.9 307.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="346.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">A grassroots effort</text><text x="747.5" y="368.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">can be high impact or a social group; look for buy-in, time commitment, exit</text><text x="747.5" y="390.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">criteria, a way to decide</text><path d="M10.7 426.1L493.9 425.6L496.1 530.6L9.4 530.8Z" fill="#d0dfdc" stroke="none"/><path d="M7.8 424.2Q251.7 426.5 495.5 425.6M7.8 424.5Q252.1 426.6 496.5 424.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 424.3Q497.0 478.1 495.7 532.0M493.9 423.1Q494.4 477.3 495.1 531.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.7 530.8Q252.2 532.3 7.7 530.8M495.7 530.8Q252.5 528.8 9.3 530.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.7 531.6Q10.8 478.0 9.8 424.5M9.5 530.6Q10.9 476.9 9.0 423.2" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="461.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Someone needs to...</text><text x="252.5" y="483.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">take your fair share, and the grungiest work for juniors; but not at the cost of</text><text x="252.5" y="505.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">expected results</text><path d="M504.1 423.9L990.0 424.4L990.9 529.9L504.9 529.1Z" fill="#eed5cc" stroke="none"/><path d="M504.4 424.1Q748.1 425.2 991.8 425.7M503.7 426.0Q747.4 428.0 991.1 425.5" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 422.4Q989.1 477.2 990.6 531.9M989.2 422.7Q989.8 477.4 988.9 532.2" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 530.3Q747.6 529.9 502.7 529.4M991.7 530.6Q747.4 529.5 503.2 529.9" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.4 532.5Q504.2 477.8 504.3 423.0M505.4 531.7Q504.9 477.4 504.7 423.1" fill="none" stroke="#b3392f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="472.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">You are just meddling</text><text x="747.5" y="494.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">welcome or not; do not &#x27;lob a water balloon&#x27; and leave</text><path d="M11.1 521.0L990.7 521.2L988.9 619.9L8.9 619.6Z" fill="#f1ede5" stroke="none"/><path d="M9.2 519.6Q500.5 520.6 991.8 519.2M9.5 519.6Q500.6 517.9 991.7 519.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 519.3Q988.6 570.2 989.4 621.1M990.3 517.9Q989.8 570.2 990.0 622.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.6 619.2Q500.3 617.4 9.0 619.7M990.5 620.3Q499.2 623.3 7.9 620.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 621.1Q7.8 569.4 9.4 517.7M11.0 621.1Q10.5 569.9 9.2 518.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="565.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Other people are not necessarily right: do not always drop your own work for minor outages or instant Slack replies. Estimate honestly (a one-hour meeting is more with</text><text x="500.0" y="587.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">prep and actions), set exit criteria, go/no-go points or a timeboxed experiment</text></svg>