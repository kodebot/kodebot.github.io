<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="51.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">The design document (RFC): a written design is a very cheap iteration (Cian Synnott); templates act as checklists (Atul Gawande); use your company&#x27;s if one exists</text><path d="M9.1 84.9L495.2 84.7L495.7 234.7L11.0 234.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 84.3Q252.2 85.9 496.0 84.1M7.7 84.3Q252.1 86.7 496.5 84.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 82.9Q496.6 159.6 494.3 236.3M494.2 83.5Q493.8 159.5 495.4 235.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 234.5Q252.1 235.0 7.9 234.1M495.9 235.2Q251.9 236.3 7.9 235.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 237.1Q12.7 160.5 10.3 83.9M9.8 237.0Q8.2 160.2 9.0 83.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="144.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Context</text><text x="252.5" y="166.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">title, author, dates (created and updated), status (idea, in review, superseded,</text><text x="252.5" y="188.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">implementing, done, on hold): anchored in space and time</text><path d="M506.1 84.0L990.3 85.4L990.5 233.8L504.4 236.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 84.4Q747.5 86.4 991.6 84.4M504.6 85.2Q747.5 85.6 990.5 85.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 84.2Q991.9 159.8 990.3 235.5M991.1 82.5Q988.6 159.0 989.8 235.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 234.6Q747.0 236.6 503.0 235.0M992.1 234.3Q747.7 233.6 503.4 234.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 236.3Q507.0 160.2 505.1 84.1M504.5 237.4Q504.6 160.1 505.0 82.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="144.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Goals</text><text x="747.5" y="166.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">the problem or opportunity and why; no implementation details (&#x27;create a serverless</text><text x="747.5" y="188.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">API to translate chicken sounds&#x27; hides the decision); answer &#x27;but why?&#x27; too</text><path d="M9.3 245.1L496.1 245.8L496.1 396.1L9.7 393.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 245.8Q252.1 247.0 495.6 245.5M7.6 245.4Q251.9 247.4 496.1 245.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 243.1Q496.3 319.9 495.5 396.8M495.0 244.0Q495.6 319.8 494.1 395.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 395.4Q253.1 394.3 9.3 394.1M496.7 395.0Q252.5 393.7 8.3 394.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 397.0Q11.5 319.7 10.3 242.5M11.0 396.4Q12.1 320.4 9.0 244.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="282.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Design</text><text x="252.5" y="304.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">enough for readers to judge whether it will work: APIs, code, diagrams, data</text><text x="252.5" y="326.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">models, wireframes, steps, dependencies, costs; &#x27;wrong is better than vague&#x27;;</text><text x="252.5" y="348.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">active verbs with a subject (not the passive: &#x27;by zombies&#x27;); spell out &#x27;this&#x27; and</text><text x="252.5" y="370.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">&#x27;that&#x27;</text><path d="M504.1 244.1L989.6 244.3L989.6 395.2L504.4 395.1Z" fill="#efe0ca" stroke="none"/><path d="M502.7 244.3Q747.3 246.0 991.8 244.3M504.1 244.1Q747.6 247.8 991.2 245.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 244.4Q992.1 320.4 989.4 396.3M990.1 243.9Q990.8 320.2 990.0 396.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 395.6Q747.7 394.2 503.1 394.5M992.5 394.0Q747.7 394.8 502.9 394.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 396.0Q505.9 319.9 506.0 243.7M505.3 395.5Q505.2 319.3 504.6 243.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="304.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Security, privacy, compliance</text><text x="747.5" y="326.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">what is worth protecting and from whom; user data, new access points, key storage,</text><text x="747.5" y="348.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">insiders and outsiders; if none, say why</text><path d="M9.5 404.2L494.1 405.5L495.6 554.4L9.8 556.2Z" fill="#efe0ca" stroke="none"/><path d="M8.0 404.5Q252.7 401.6 497.4 405.0M7.8 405.6Q252.6 406.6 497.4 405.2" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 402.6Q494.9 480.1 495.3 557.5M495.0 403.5Q493.2 480.2 495.9 557.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 555.9Q252.6 552.3 8.9 554.2M496.4 554.3Q252.7 551.8 9.0 555.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 557.5Q13.0 480.3 9.3 403.2M9.8 557.3Q12.6 480.3 9.7 403.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="464.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Alternatives and prior art</text><text x="252.5" y="486.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">could spreadsheets solve it? why not off-the-shelf or what colleagues tried? send</text><text x="252.5" y="508.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">the design to the owners of any existing option you reject</text><path d="M506.0 404.5L990.5 404.4L989.4 556.1L503.8 554.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.7 403.9Q747.1 401.7 990.6 404.7M504.2 405.4Q748.3 404.5 992.4 405.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.2 403.5Q987.5 480.4 989.0 557.3M990.6 403.4Q991.0 480.1 990.7 556.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.5 554.2Q747.9 554.3 503.2 555.1M990.6 554.0Q747.5 556.3 504.4 554.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.8 556.2Q506.4 480.2 505.5 404.3M504.9 555.7Q503.2 479.1 503.9 402.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="464.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Also useful</text><text x="747.5" y="486.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">background and glossary; trade-offs; risks; dependencies (lead time); operations</text><text x="747.5" y="508.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(who runs, monitors, backs up)</text><path d="M10.7 561.1L988.9 560.6L991.1 630.6L9.4 630.8Z" fill="#f1ede5" stroke="none"/><path d="M7.8 559.2Q499.2 561.5 990.5 560.6M7.8 559.5Q499.6 561.6 991.5 559.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 559.3Q991.6 595.6 990.7 632.0M988.9 558.1Q989.4 594.8 990.1 631.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.7 630.8Q499.7 632.3 7.7 630.8M990.7 630.8Q500.0 628.8 9.3 630.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.7 631.6Q10.6 595.5 9.8 559.5M9.5 630.6Q10.5 594.4 9.0 558.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="601.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Writing is learnable: Google&#x27;s Technical Writing courses and the Write the Docs site are named</text></svg>