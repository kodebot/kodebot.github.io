<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 75.3L10.7 74.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 44.7 990.0 76.2M989.9 12.9Q991.2 44.5 990.3 76.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 74.4Q500.1 77.2 8.7 74.5M991.4 74.7Q499.6 73.2 7.8 75.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 76.0Q10.2 44.3 10.1 12.7M10.2 75.9Q8.9 45.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="40.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Leading a big project: usually hard because of ambiguity, not technology; the lead is responsible for the whole problem, including the gaps between teams (Figure 5-1:</text><text x="500.0" y="62.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">lead, contacts and subleads per team)</text><path d="M9.1 89.9L490.2 89.7L490.7 309.7L11.0 309.8Z" fill="#efe0ca" stroke="none"/><path d="M8.4 89.3Q249.7 90.9 491.0 89.1M7.7 89.3Q249.6 91.7 491.5 89.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 87.9Q491.6 199.6 489.3 311.3M489.2 88.5Q488.8 199.5 490.4 310.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 309.5Q249.6 310.0 7.9 309.1M490.9 310.2Q249.4 311.3 7.9 310.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 312.1Q12.7 200.5 10.3 88.9M9.8 312.0Q8.2 200.2 9.0 88.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="151.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">If you feel overwhelmed</text><text x="250.0" y="173.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">normal: &#x27;that feeling of discomfort is called learning&#x27; (Polina Giralt); check</text><text x="250.0" y="195.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">your five resources; most people do not know better than you; mistakes will not</text><text x="250.0" y="217.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">destroy you. Five moves: create an anchor document for yourself; talk to your</text><text x="250.0" y="239.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">sponsor with a written view of success; decide who gets your uncertainty (not</text><text x="250.0" y="261.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">juniors); give yourself a win; use your strengths</text><path d="M511.1 89.0L990.3 90.4L990.5 308.8L509.4 311.1Z" fill="#d0dfdc" stroke="none"/><path d="M508.4 89.4Q750.0 91.4 991.6 89.4M509.6 90.2Q750.0 90.6 990.5 90.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 89.2Q991.9 199.8 990.3 310.5M991.1 87.5Q988.6 199.0 989.8 310.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 309.6Q749.5 311.6 508.0 310.0M992.1 309.3Q750.2 308.6 508.4 309.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 311.3Q512.0 200.2 510.1 89.1M509.5 312.4Q509.6 200.1 510.0 87.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="162.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Building context (the three maps again)</text><text x="750.0" y="184.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">goals (why this project?); customer needs (even internal customers; shadow users,</text><text x="750.0" y="206.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">show sketches, avoid jargon); success metrics (code written is not success;</text><text x="750.0" y="228.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">measure before and after); sponsors, stakeholders and customers; fixed</text><text x="750.0" y="250.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">constraints; risks and history; the team (contacts, subleads, other leaders)</text><path d="M9.3 325.1L991.1 325.8L991.1 541.1L9.7 538.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 325.8Q499.6 327.0 990.6 325.5M7.6 325.4Q499.4 327.4 991.1 325.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 323.1Q991.3 432.4 990.5 541.8M990.0 324.0Q990.6 432.3 989.1 540.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 540.4Q500.6 539.3 9.3 539.1M991.7 540.0Q500.0 538.7 8.3 539.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 542.0Q11.5 432.2 10.3 322.5M11.0 541.4Q12.1 432.9 9.0 324.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="416.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">Examples from the text: a new infrastructure team could not say why another team needed a feature (&#x27;maybe they don&#x27;t&#x27;); Sarah Wells judged a 150-microservice Kubernetes</text><text x="500.0" y="438.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">migration by time spent keeping the cluster healthy and by the number of snarky Slack messages about missing functionality; treat your own ideas with the most</text><text x="500.0" y="460.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">scepticism and set measurable goals early; frequent iterative releases beat one win-or-lose release at the end</text></svg>