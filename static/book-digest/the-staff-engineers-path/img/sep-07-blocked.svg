<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Blocked by a team, a decision, a button click or a single person: what is going on, and what to do</text><path d="M9.1 79.9L495.2 79.7L495.7 334.7L11.0 334.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q252.2 80.9 496.0 79.1M7.7 79.3Q252.1 81.7 496.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 77.9Q496.6 207.1 494.3 336.3M494.2 78.5Q493.8 207.0 495.4 335.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 334.5Q252.1 335.0 7.9 334.1M495.9 335.2Q251.9 336.3 7.9 335.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 337.1Q12.7 208.0 10.3 78.9M9.8 337.0Q8.2 207.7 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="169.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">Another team</text><text x="252.5" y="191.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">causes: misunderstanding, misadventure (someone quit, overloaded), misalignment</text><text x="252.5" y="213.5" font-size="13.0" fill="#3b2f20" text-anchor="middle">(Figure 6-2: your project is their third priority); go and find out by voice,</text><text x="252.5" y="235.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">explain why and by when; ask for something smaller or help unblock them; ask</text><text x="252.5" y="257.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">leaders to adjudicate or escalate politely; replan</text><path d="M506.1 79.0L990.3 80.4L990.5 333.8L504.4 336.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 79.4Q747.5 81.4 991.6 79.4M504.6 80.2Q747.5 80.6 990.5 80.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 207.3 990.3 335.5M991.1 77.5Q988.6 206.5 989.8 335.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 334.6Q747.0 336.6 503.0 335.0M992.1 334.3Q747.7 333.6 503.4 334.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 336.3Q507.0 207.7 505.1 79.1M504.5 337.4Q504.6 207.6 505.0 77.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="169.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">A decision</text><text x="747.5" y="191.5" font-size="11.0" fill="#3b2f20" text-anchor="middle">the decider may be waiting too, or not understand (&#x27;Do you want X or Y?&#x27; &#x27;Yes, that</text><text x="747.5" y="213.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">would be great!&#x27;); be on the same side; reframe with pictures, user stories,</text><text x="747.5" y="235.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">examples; mediate; say which parts are hard to reverse; or guess, document the</text><text x="747.5" y="257.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">trade-offs and tell the decider</text><path d="M9.3 345.1L496.1 345.8L496.1 601.1L9.7 598.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 345.8Q252.1 347.0 495.6 345.5M7.6 345.4Q251.9 347.4 496.1 345.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 343.1Q496.3 472.4 495.5 601.8M495.0 344.0Q495.6 472.3 494.1 600.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 600.4Q253.1 599.3 9.3 599.1M496.7 600.0Q252.5 598.7 8.3 599.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 602.0Q11.5 472.2 10.3 342.5M11.0 601.4Q12.1 472.9 9.0 344.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="434.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">A single button click</text><text x="252.5" y="456.5" font-size="12.5" fill="#3b2f20" text-anchor="middle">their request queue and accountability matter (a security approver shares</text><text x="252.5" y="478.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">responsibility); Reilly&#x27;s load-balancing team motto: &#x27;lack of planning on your part</text><text x="252.5" y="500.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">is not an emergency on mine&#x27;; ask politely and apologise; make your request easy</text><text x="252.5" y="522.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">(Figure 6-3); say thank you; escalating can breed bad blood</text><path d="M504.1 344.1L989.6 344.3L989.6 600.2L504.4 600.1Z" fill="#efe0ca" stroke="none"/><path d="M502.7 344.3Q747.3 346.0 991.8 344.3M504.1 344.1Q747.6 347.8 991.2 345.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 344.4Q992.1 472.9 989.4 601.3M990.1 343.9Q990.8 472.7 990.0 601.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 600.6Q747.7 599.2 503.1 599.5M992.5 599.0Q747.7 599.8 502.9 599.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 601.0Q505.9 472.4 506.0 343.7M505.3 600.5Q505.2 471.8 504.6 343.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="423.5" font-size="17.0" fill="#3b2f20" text-anchor="middle">A single person</text><text x="747.5" y="445.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">the stated reason may hide fear, overload or confusion (Reilly&#x27;s colleague from</text><text x="747.5" y="467.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">operations was intimidated by writing code; pairing fixed it); explain the need,</text><text x="747.5" y="489.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">set an earlier go/no-go date; make it easy (&#x27;Three Bullets and a Call to Action&#x27;);</text><text x="747.5" y="511.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">coach but do not take over; escalate to their manager as a people issue, not a</text><text x="747.5" y="533.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">complaint</text></svg>