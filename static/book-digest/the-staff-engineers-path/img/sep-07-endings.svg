<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The project just stops: four deliberate endings</text><path d="M9.1 79.9L490.2 79.7L490.7 299.7L11.0 299.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q249.7 80.9 491.0 79.1M7.7 79.3Q249.6 81.7 491.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 77.9Q491.6 189.6 489.3 301.3M489.2 78.5Q488.8 189.5 490.4 300.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 299.5Q249.6 300.0 7.9 299.1M490.9 300.2Q249.4 301.3 7.9 300.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 302.1Q12.7 190.5 10.3 78.9M9.8 302.0Q8.2 190.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="152.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">A better place to stop; the wrong journey</text><text x="250.0" y="174.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">done enough: avoid abandoning unhappy customers or leaving a half-migration. Wrong</text><text x="250.0" y="196.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">journey: a storage team found its new system would not scale, killed it and wrote</text><text x="250.0" y="218.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a retrospective; discovering that was a success. Beware the sunk-cost fallacy;</text><text x="250.0" y="240.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">&#x27;That didn&#x27;t work. It&#x27;s OK. Here&#x27;s what we learned&#x27; builds psychological safety</text><path d="M511.1 79.0L990.3 80.4L990.5 298.8L509.4 301.1Z" fill="#efe0ca" stroke="none"/><path d="M508.4 79.4Q750.0 81.4 991.6 79.4M509.6 80.2Q750.0 80.6 990.5 80.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 189.8 990.3 300.5M991.1 77.5Q988.6 189.0 989.8 300.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 299.6Q749.5 301.6 508.0 300.0M992.1 299.3Q750.2 298.6 508.4 299.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 301.3Q512.0 190.2 510.1 79.1M509.5 302.4Q509.6 190.1 510.0 77.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="152.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">The project is canceled</text><text x="750.0" y="174.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">feel it first; get perspective; tell the team yourself, leading with the why; shut</text><text x="750.0" y="196.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">down cleanly (turn off, delete, document if it may restart); protect promotions</text><text x="750.0" y="218.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">and ratings by briefing new managers; celebrate the work; maybe a retrospective;</text><text x="750.0" y="240.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">if technical staff are left out of such decisions, raise it</text><path d="M9.3 315.1L991.1 315.8L991.1 541.1L9.7 538.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 315.8Q499.6 317.0 990.6 315.5M7.6 315.4Q499.4 317.4 991.1 315.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 313.1Q991.3 427.4 990.5 541.8M990.0 314.0Q990.6 427.3 989.1 540.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 540.4Q500.6 539.3 9.3 539.1M991.7 540.0Q500.0 538.7 8.3 539.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 542.0Q11.5 427.2 10.3 312.5M11.0 541.4Q12.1 427.9 9.0 314.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="411.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">The destination: check first that measurable goals are met, users can catch their Pokemon and the foundations are clean; then declare victory deliberately: parties,</text><text x="500.0" y="433.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">shout-outs, internal and external write-ups, a retrospective of what went right, and recognition of the behaviours you want to see more of (helping each other,</text><text x="500.0" y="455.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">communicating well)</text></svg>