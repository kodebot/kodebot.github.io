<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="560" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Blocked by unassigned work, or by a huge crowd (a migration)</text><path d="M9.1 79.9L490.2 79.7L490.7 379.7L11.0 379.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q249.7 80.9 491.0 79.1M7.7 79.3Q249.6 81.7 491.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 77.9Q491.6 229.6 489.3 381.3M489.2 78.5Q488.8 229.5 490.4 380.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 379.5Q249.6 380.0 7.9 379.1M490.9 380.2Q249.4 381.3 7.9 380.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 382.1Q12.7 230.5 10.3 78.9M9.8 382.0Q8.2 230.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="181.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Unassigned work (Figure 6-4: the impassable ridge is staffing)</text><text x="250.0" y="203.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">everyone cares but nobody owns it; more design will not help until an owning team</text><text x="250.0" y="225.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">exists; people may assume you own it now. Do: conversations and a &#x27;rollup&#x27; (Denise</text><text x="250.0" y="247.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Yu): write conclusions explicitly (&#x27;no authentication until at least Q3&#x27;); offer</text><text x="250.0" y="269.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">to mentor the new team; find a sponsor with a polished pitch; if staffing is</text><text x="250.0" y="291.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">always &#x27;next quarter&#x27;, postpone</text><path d="M511.1 79.0L990.3 80.4L990.5 378.8L509.4 381.1Z" fill="#d6e1cf" stroke="none"/><path d="M508.4 79.4Q750.0 81.4 991.6 79.4M509.6 80.2Q750.0 80.6 990.5 80.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 229.8 990.3 380.5M991.1 77.5Q988.6 229.0 989.8 380.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 379.6Q749.5 381.6 508.0 380.0M992.1 379.3Q750.2 378.6 508.4 379.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 381.3Q512.0 230.2 510.1 79.1M509.5 382.4Q509.6 230.1 510.0 77.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="170.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">A huge crowd: the half-finished migration</text><text x="750.0" y="192.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">teams busy, opposed, or tired of constant changes; a half-migration costs</text><text x="750.0" y="214.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">everyone. Do: tell both stories and bridge them; push the work to the migrating</text><text x="750.0" y="236.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">team, automate, be specific, make the new way the default and the old way harder</text><text x="750.0" y="258.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">(&#x27;i_know_this_is_unsupported&#x27;); show a progress graph to zero; get it on</text><text x="750.0" y="280.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">organisational goals; as a last resort withdraw old support with strong backing</text><text x="750.0" y="302.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">(last out turns off the lights)</text><path d="M9.3 395.1L991.1 395.8L991.1 541.1L9.7 538.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 395.8Q499.6 397.0 990.6 395.5M7.6 395.4Q499.4 397.4 991.1 395.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 393.1Q991.3 467.4 990.5 541.8M990.0 394.0Q990.6 467.3 989.1 540.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 540.4Q500.6 539.3 9.3 539.1M991.7 540.0Q500.0 538.7 8.3 539.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 542.0Q11.5 467.2 10.3 392.5M11.0 541.4Q12.1 467.9 9.0 394.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="473.5" font-size="14.0" fill="#3b2f20" text-anchor="middle">Reilly&#x27;s rule of thumb: when the organisational gap is the crux, no amount of clever solutions helps; solve it or you are wasting your time</text></svg>