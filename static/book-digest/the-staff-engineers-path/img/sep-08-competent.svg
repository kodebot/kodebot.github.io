<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Be competent: knowledge, self-awareness, standards, reliability</text><path d="M9.1 79.9L495.2 79.7L495.7 339.7L11.0 339.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q252.2 80.9 496.0 79.1M7.7 79.3Q252.1 81.7 496.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 77.9Q496.6 209.6 494.3 341.3M494.2 78.5Q493.8 209.5 495.4 340.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 339.5Q252.1 340.0 7.9 339.1M495.9 340.2Q251.9 341.3 7.9 340.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 342.1Q12.7 210.5 10.3 78.9M9.8 342.0Q8.2 210.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="172.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Know things</text><text x="252.5" y="194.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">technical skills come from study and practice, not innate aptitude (weaving,</text><text x="252.5" y="216.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">violin); do not rush your prime learning years (Charity Majors on management); &#x27;not</text><text x="252.5" y="238.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">technical enough&#x27; is vague, say which skill; build domain knowledge by pattern-</text><text x="252.5" y="260.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">matching and deliberate learning; stay current and show that you are learning</text><path d="M506.1 79.0L990.3 80.4L990.5 338.8L504.4 341.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 79.4Q747.5 81.4 991.6 79.4M504.6 80.2Q747.5 80.6 990.5 80.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 209.8 990.3 340.5M991.1 77.5Q988.6 209.0 989.8 340.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 339.6Q747.0 341.6 503.0 340.0M992.1 339.3Q747.7 338.6 503.4 339.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 341.3Q507.0 210.2 505.1 79.1M504.5 342.4Q504.6 210.1 505.0 77.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="183.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Be self-aware</text><text x="747.5" y="205.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">admit what you know (volunteer your expertise; it is a fact, not a brag) and what</text><text x="747.5" y="227.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">you do not (ask for an &#x27;ELI5&#x27;); everyone gets faster when seniors admit it; know</text><text x="747.5" y="249.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">your own context; explaining simply is a sign of expertise</text><path d="M9.3 350.1L496.1 350.8L496.1 611.1L9.7 608.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 350.8Q252.1 352.0 495.6 350.5M7.6 350.4Q251.9 352.4 496.1 350.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 348.1Q496.3 479.9 495.5 611.8M495.0 349.0Q495.6 479.8 494.1 610.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 610.4Q253.1 609.3 9.3 609.1M496.7 610.0Q252.5 608.7 8.3 609.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 612.0Q11.5 479.7 10.3 347.5M11.0 611.4Q12.1 480.4 9.0 349.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="453.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Have high standards</text><text x="252.5" y="475.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">clear docs, find out first when it breaks, duct tape only on purpose; seek</text><text x="252.5" y="497.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">criticism (it is not criticism of you); own mistakes: admit, fix, communicate, say</text><text x="252.5" y="519.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">others are not at fault, apologise, hold a retrospective</text><path d="M504.1 349.1L989.6 349.3L989.6 610.2L504.4 610.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 349.3Q747.3 351.0 991.8 349.3M504.1 349.1Q747.6 352.8 991.2 350.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 349.4Q992.1 480.4 989.4 611.3M990.1 348.9Q990.8 480.2 990.0 611.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 610.6Q747.7 609.2 503.1 609.5M992.5 609.0Q747.7 609.8 502.9 609.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 611.0Q505.9 479.9 506.0 348.7M505.3 610.5Q505.2 479.3 504.6 348.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="464.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Be reliable</text><text x="747.5" y="486.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">&#x27;Alex will be in that meeting so I don&#x27;t need to go&#x27;: build a reputation for</text><text x="747.5" y="508.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">getting it done and finishing what you start, or deliberately and openly stopping</text></svg>