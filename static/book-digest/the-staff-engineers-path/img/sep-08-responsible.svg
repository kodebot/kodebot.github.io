<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="660" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Be responsible: &#x27;nobody else is coming to be the grown-up in the room&#x27;</text><path d="M9.1 79.9L330.2 79.7L330.7 419.7L11.0 419.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q169.7 80.9 331.0 79.1M7.7 79.3Q169.6 81.7 331.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.9 77.9Q331.6 249.6 329.3 421.3M329.2 78.5Q328.8 249.5 330.4 420.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M331.3 419.5Q169.6 420.0 7.9 419.1M330.9 420.2Q169.4 421.3 7.9 420.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 422.1Q12.7 250.5 10.3 78.9M9.8 422.0Q8.2 250.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="168.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Take ownership</text><text x="170.0" y="190.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">own the whole problem; avoid &#x27;cover your ass</text><text x="170.0" y="212.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">engineering&#x27; (John Allspaw); radiate intent (Elizabeth</text><text x="170.0" y="234.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Ayer): say what you will do before you do it, so you</text><text x="170.0" y="256.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">keep responsibility and others can intervene; make</text><text x="170.0" y="278.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">decisions and own being wrong; ask the &#x27;obvious&#x27;</text><text x="170.0" y="300.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">questions (on-call for a two-person mission-critical</text><text x="170.0" y="322.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">service?); do not delegate glue work to juniors by</text><text x="170.0" y="344.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">neglect</text><path d="M341.1 79.0L660.3 80.4L660.5 418.8L339.4 421.1Z" fill="#d6e1cf" stroke="none"/><path d="M338.4 79.4Q500.0 81.4 661.6 79.4M339.6 80.2Q500.0 80.6 660.5 80.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M660.9 79.2Q661.9 249.8 660.3 420.5M661.1 77.5Q658.6 249.0 659.8 420.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.1 419.6Q499.5 421.6 338.0 420.0M662.1 419.3Q500.2 418.6 338.4 419.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 421.3Q342.0 250.2 340.1 79.1M339.5 422.4Q339.6 250.1 340.0 77.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="168.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Take charge</text><text x="500.0" y="190.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">in an emergency, announce you are coordinating</text><text x="500.0" y="212.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">(Incident Command System), keep notes, share context,</text><text x="500.0" y="234.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">ask for intent; ask for more information when everyone</text><text x="500.0" y="256.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">is confused (&#x27;I don&#x27;t know what to do with that</text><text x="500.0" y="278.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">information&#x27;); do not feign surprise (Recurse Center</text><text x="500.0" y="300.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">rule); drive meetings: agenda, notes, decisions; if you</text><text x="500.0" y="322.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">see something offensive, say something in public (Sarah</text><text x="500.0" y="344.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">Milstein)</text><path d="M669.3 80.1L991.1 80.8L991.1 421.1L669.7 418.8Z" fill="#efe0ca" stroke="none"/><path d="M668.5 80.8Q829.6 82.0 990.6 80.5M667.6 80.4Q829.4 82.4 991.1 80.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 78.1Q991.3 249.9 990.5 421.8M990.0 79.0Q990.6 249.8 989.1 420.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 420.4Q830.6 419.3 669.3 419.1M991.7 420.0Q830.0 418.7 668.3 419.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.9 422.0Q671.5 249.7 670.3 77.5M671.0 421.4Q672.1 250.4 669.0 79.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="190.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Create calm</text><text x="830.0" y="212.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">defuse, do not amplify; keep small problems small; do</text><text x="830.0" y="234.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">not spill anxieties onto juniors (be clear whether you</text><text x="830.0" y="256.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">are venting or asking for action); avoid blame (curious</text><text x="830.0" y="278.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">questions: what happened, what information was</text><text x="830.0" y="300.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">missing?); be consistent and predictable, and look</text><text x="830.0" y="322.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">after yourself</text><path d="M9.1 434.1L989.6 434.3L989.6 640.2L9.4 640.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 434.3Q499.8 436.0 991.8 434.3M9.1 434.1Q500.1 437.8 991.2 435.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 434.4Q992.1 537.9 989.4 641.3M990.1 433.9Q990.8 537.7 990.0 641.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 640.6Q500.2 639.2 8.1 639.5M992.5 639.0Q500.2 639.8 7.9 639.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 641.0Q10.9 537.4 11.0 433.7M10.3 640.5Q10.2 536.8 9.6 433.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="521.5" font-size="12.0" fill="#3b2f20" text-anchor="middle">Milstein&#x27;s technique for speaking up: describe the culture you are building and use it as the reference (&#x27;respect is a big value here; that message violated those</text><text x="500.0" y="543.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">norms&#x27;); give the person a path to be on your side; in private appeal to their values; tell a manager if there is a pattern. Accept the awkwardness: better to have said</text><text x="500.0" y="565.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">something; &#x27;almost always somebody thanks me later&#x27;</text></svg>