<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="680" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Guardrails: let people move faster because the going is safe (not for leaning on, for steadying)</text><path d="M9.1 79.9L490.2 79.7L490.7 379.7L11.0 379.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q249.7 80.9 491.0 79.1M7.7 79.3Q249.6 81.7 491.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 77.9Q491.6 229.6 489.3 381.3M489.2 78.5Q488.8 229.5 490.4 380.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 379.5Q249.6 380.0 7.9 379.1M490.9 380.2Q249.4 381.3 7.9 380.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 382.1Q12.7 230.5 10.3 78.9M9.8 382.0Q8.2 230.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="181.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Individual: read every line</text><text x="250.0" y="203.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">review code, designs and change plans (write steps before you do them); look for:</text><text x="250.0" y="225.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">should this work exist; does it solve the problem; how does it fail; is it</text><text x="250.0" y="247.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">understandable; does it fit the bigger picture; do the right people know. Project</text><text x="250.0" y="269.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">guardrail: ask questions that keep a stretching colleague off the cliff; say how</text><text x="250.0" y="291.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and when to ask you for help (&#x27;I can be your muscle&#x27;)</text><path d="M511.1 79.0L990.3 80.4L990.5 378.8L509.4 381.1Z" fill="#d6e1cf" stroke="none"/><path d="M508.4 79.4Q750.0 81.4 991.6 79.4M509.6 80.2Q750.0 80.6 990.5 80.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 229.8 990.3 380.5M991.1 77.5Q988.6 229.0 989.8 380.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 379.6Q749.5 381.6 508.0 380.0M992.1 379.3Q750.2 378.6 508.4 379.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 381.3Q512.0 230.2 510.1 79.1M509.5 382.4Q509.6 230.1 510.0 77.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="181.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Group: process, written decisions, robots</text><text x="750.0" y="203.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">lightweight processes (prelaunch questions; make the right way the easy way);</text><text x="750.0" y="225.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Reilly&#x27;s FAQ preamble (&#x27;All guidelines are wrong sometimes&#x27;); style guides, a</text><text x="750.0" y="247.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">paved road (Adopt, Trial, Assess, Hold), sparing policies, vision and strategy;</text><text x="750.0" y="269.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">reminders, linters, search, templates, config checkers (Google&#x27;s SRSly: no more</text><text x="750.0" y="291.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">than 5 percent of servers rebooted at once)</text><path d="M9.3 395.1L991.1 395.8L991.1 666.1L9.7 663.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 395.8Q499.6 397.0 990.6 395.5M7.6 395.4Q499.4 397.4 991.1 395.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 393.1Q991.3 529.9 990.5 666.8M990.0 394.0Q990.6 529.8 989.1 665.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 665.4Q500.6 664.3 9.3 664.1M991.7 665.0Q500.0 663.7 8.3 664.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 667.0Q11.5 529.7 10.3 392.5M11.0 666.4Q12.1 530.4 9.0 394.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="514.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Catalyst: culture change</text><text x="500.0" y="536.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">the strongest guardrail and the hardest; once code review and tests were not the norm. Solve a real problem (have good &#x27;why&#x27; answers); choose your battles (instil</text><text x="500.0" y="558.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">respect for design review, not an exact form); offer support; find allies and sponsors (use the shadow org chart). Be patient</text></svg>