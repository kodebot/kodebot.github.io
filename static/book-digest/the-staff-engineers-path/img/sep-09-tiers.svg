<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 85.3L10.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.6 49.7 990.0 86.2M989.9 12.9Q991.3 49.5 990.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 84.4Q500.1 87.2 8.7 84.5M991.4 84.7Q499.6 83.2 7.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 86.0Q10.2 49.3 10.1 12.7M10.2 85.9Q8.9 50.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="45.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">Figure 8-1 and Table 8-1: three tiers of influence (individual, group, catalyst) and four mechanisms (advice, teaching, guardrails, opportunity); a menu, not a</text><text x="500.0" y="67.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">checklist; do the individual and group work first, and join existing initiatives before creating new ones</text><path d="M9.1 99.9L495.2 99.7L495.7 289.7L11.0 289.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 99.3Q252.2 100.9 496.0 99.1M7.7 99.3Q252.1 101.7 496.5 99.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 97.9Q496.6 194.6 494.3 291.3M494.2 98.5Q493.8 194.5 495.4 290.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 289.5Q252.1 290.0 7.9 289.1M495.9 290.2Q251.9 291.3 7.9 290.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 292.1Q12.7 195.5 10.3 98.9M9.8 292.0Q8.2 195.2 9.0 98.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="179.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Advice</text><text x="252.5" y="201.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">individual: mentoring, sharing knowledge, feedback; group: tech talks,</text><text x="252.5" y="223.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">documentation, articles; catalyst: a mentorship program, tech talk events</text><path d="M506.1 99.0L990.3 100.4L990.5 288.8L504.4 291.1Z" fill="#d6e1cf" stroke="none"/><path d="M503.4 99.4Q747.5 101.4 991.6 99.4M504.6 100.2Q747.5 100.6 990.5 100.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 99.2Q991.9 194.8 990.3 290.5M991.1 97.5Q988.6 194.0 989.8 290.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 289.6Q747.0 291.6 503.0 290.0M992.1 289.3Q747.7 288.6 503.4 289.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 291.3Q507.0 195.2 505.1 99.1M504.5 292.4Q504.6 195.1 505.0 97.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="179.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Teaching</text><text x="747.5" y="201.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">individual: code and design review, coaching, pairing, shadowing; group: classes,</text><text x="747.5" y="223.0" font-size="14.0" fill="#3b2f20" text-anchor="middle">codelabs; catalyst: onboarding curriculum, teaching people to teach</text><path d="M9.3 300.1L496.1 300.8L496.1 491.1L9.7 488.8Z" fill="#efe0ca" stroke="none"/><path d="M8.5 300.8Q252.1 302.0 495.6 300.5M7.6 300.4Q251.9 302.4 496.1 300.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 298.1Q496.3 394.9 495.5 491.8M495.0 299.0Q495.6 394.8 494.1 490.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 490.4Q253.1 489.3 9.3 489.1M496.7 490.0Q252.5 488.7 8.3 489.4" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 492.0Q11.5 394.7 10.3 297.5M11.0 491.4Q12.1 395.4 9.0 299.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="379.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Guardrails</text><text x="252.5" y="401.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">individual: code, change and design review; group: processes, linters, style</text><text x="252.5" y="423.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">guides; catalyst: frameworks and culture change</text><path d="M504.1 299.1L989.6 299.3L989.6 490.2L504.4 490.1Z" fill="#d0dfdc" stroke="none"/><path d="M502.7 299.3Q747.3 301.0 991.8 299.3M504.1 299.1Q747.6 302.8 991.2 300.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 299.4Q992.1 395.4 989.4 491.3M990.1 298.9Q990.8 395.2 990.0 491.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 490.6Q747.7 489.2 503.1 489.5M992.5 489.0Q747.7 489.8 502.9 489.9" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 491.0Q505.9 394.9 506.0 298.7M505.3 490.5Q505.2 394.3 504.6 298.0" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="368.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Opportunity</text><text x="747.5" y="390.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">individual: delegating, sponsorship, cheerleading, ongoing support; group: sharing</text><text x="747.5" y="412.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">the spotlight, empowering your team; catalyst: a culture of opportunity, juniors</text><text x="747.5" y="434.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">who become seniors</text><path d="M9.5 509.2L989.1 510.5L990.6 629.4L9.8 631.2Z" fill="#f1ede5" stroke="none"/><path d="M8.0 509.5Q500.2 506.6 992.4 510.0M7.8 510.6Q500.1 511.6 992.4 510.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.0 507.6Q990.0 570.1 990.3 632.5M990.0 508.5Q988.4 570.2 990.9 632.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.3 630.9Q500.1 627.3 8.9 629.2M991.4 629.3Q500.2 626.8 9.0 630.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 632.5Q12.9 570.3 9.3 508.2M9.8 632.3Q12.4 570.3 9.7 508.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="565.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Why raise others&#x27; skills: your own work gets easier with more competent colleagues; the industry keeps changing and you will need people able to learn the new thing; it</text><text x="500.0" y="587.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">is the right thing to do; and your growth comes from theirs (Bryan Liles: &#x27;build a whole bench behind you&#x27;)</text></svg>