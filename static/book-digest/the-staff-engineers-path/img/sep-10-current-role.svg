<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="660" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 85.3L10.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.6 49.7 990.0 86.2M989.9 12.9Q991.3 49.5 990.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 84.4Q500.1 87.2 8.7 84.5M991.4 84.7Q499.6 83.2 7.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 86.0Q10.2 49.3 10.1 12.7M10.2 85.9Q8.9 50.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="45.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">Your current role: Cate Huston&#x27;s five job-health signals (Table 9-1, scored 0 to 5 over months to avoid recency bias): learning; transferable skills versus coping with</text><text x="500.0" y="67.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">dysfunction; how you feel about recruiting friends; confidence; stress</text><path d="M9.1 99.9L490.2 99.7L490.7 319.7L11.0 319.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.4 99.3Q249.7 100.9 491.0 99.1M7.7 99.3Q249.6 101.7 491.5 99.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 97.9Q491.6 209.6 489.3 321.3M489.2 98.5Q488.8 209.5 490.4 320.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 319.5Q249.6 320.0 7.9 319.1M490.9 320.2Q249.4 321.3 7.9 320.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 322.1Q12.7 210.5 10.3 98.9M9.8 322.0Q8.2 210.2 9.0 98.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="183.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Reasons to stay</text><text x="250.0" y="205.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">feedback loops (see your decisions&#x27; consequences, see colleagues level up); depth;</text><text x="250.0" y="227.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">relationships and goodwill; organisational context (you know the shadow org</text><text x="250.0" y="249.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">chart); familiarity (a schedule that works for your life)</text><path d="M511.1 99.0L990.3 100.4L990.5 318.8L509.4 321.1Z" fill="#efe0ca" stroke="none"/><path d="M508.4 99.4Q750.0 101.4 991.6 99.4M509.6 100.2Q750.0 100.6 990.5 100.1" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 99.2Q991.9 209.8 990.3 320.5M991.1 97.5Q988.6 209.0 989.8 320.5" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 319.6Q749.5 321.6 508.0 320.0M992.1 319.3Q750.2 318.6 508.4 319.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 321.3Q512.0 210.2 510.1 99.1M509.5 322.4Q509.6 210.1 510.0 97.8" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="183.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Reasons to move</text><text x="750.0" y="205.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">employability (learning one culture, not transferable skills); experiences (you</text><text x="750.0" y="227.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">collected what is on offer); growth (it can be easier to step up elsewhere); money</text><text x="750.0" y="249.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">(new hires often negotiate better); mismatch (no role for your interests)</text><path d="M9.3 335.1L991.1 335.8L991.1 486.1L9.7 483.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 335.8Q499.6 337.0 990.6 335.5M7.6 335.4Q499.4 337.4 991.1 335.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 333.1Q991.3 409.9 990.5 486.8M990.0 334.0Q990.6 409.8 989.1 485.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 485.4Q500.6 484.3 9.3 484.1M991.7 485.0Q500.0 483.7 8.3 484.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 487.0Q11.5 409.7 10.3 332.5M11.0 486.4Q12.1 410.4 9.0 334.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="394.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">Check: does the job meet your priority list (Figure 9-3)? Few roles are best on everything: money versus doing good, learning versus prestige. &#x27;Sometimes five years of</text><text x="500.0" y="416.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">experience is just the same year of experience, five times over.&#x27; Captain Awkward&#x27;s test: if things stayed exactly as they are, how long would you stay? Your employer</text><text x="500.0" y="438.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">buys your time but rents your &#x27;brand&#x27;</text><path d="M9.1 499.1L989.6 499.3L989.6 640.2L9.4 640.1Z" fill="#f1ede5" stroke="none"/><path d="M7.7 499.3Q499.8 501.0 991.8 499.3M9.1 499.1Q500.1 502.8 991.2 500.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 499.4Q992.1 570.4 989.4 641.3M990.1 498.9Q990.8 570.2 990.0 641.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 640.6Q500.2 639.2 8.1 639.5M992.5 639.0Q500.2 639.8 7.9 639.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 641.0Q10.9 569.9 11.0 498.7M10.3 640.5Q10.2 569.3 9.6 498.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="576.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Nobody else can make these decisions for you: we all make different trade-offs</text></svg>