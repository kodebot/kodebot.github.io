<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 65.3L10.7 64.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.7 39.7 990.0 66.2M989.9 12.9Q991.1 39.5 990.3 66.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 64.4Q500.1 67.2 8.7 64.5M991.4 64.7Q499.6 63.2 7.8 65.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 66.0Q10.2 39.3 10.1 12.7M10.2 65.9Q9.0 40.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="46.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">What to build: skills, a network, visibility, and deliberate roles (Figure 9-2: spend your ability points)</text><path d="M9.1 79.9L495.2 79.7L495.7 309.7L11.0 309.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 79.3Q252.2 80.9 496.0 79.1M7.7 79.3Q252.1 81.7 496.5 79.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 77.9Q496.6 194.6 494.3 311.3M494.2 78.5Q493.8 194.5 495.4 310.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.3 309.5Q252.1 310.0 7.9 309.1M495.9 310.2Q251.9 311.3 7.9 310.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 312.1Q12.7 195.5 10.3 78.9M9.8 312.0Q8.2 195.2 9.0 78.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="157.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Skills</text><text x="252.5" y="179.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">&#x27;not yet levelled up&#x27;, not &#x27;bad at it&#x27;; put points into what you want to be good</text><text x="252.5" y="201.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">at, not only what you already are; choose the right &#x27;axe&#x27; (Dina Levitan); imposter</text><text x="252.5" y="223.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">syndrome is common at staff level: practise the thing that makes you nervous and</text><text x="252.5" y="245.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">give yourself a break</text><path d="M506.1 79.0L990.3 80.4L990.5 308.8L504.4 311.1Z" fill="#d0dfdc" stroke="none"/><path d="M503.4 79.4Q747.5 81.4 991.6 79.4M504.6 80.2Q747.5 80.6 990.5 80.1" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 79.2Q991.9 194.8 990.3 310.5M991.1 77.5Q988.6 194.0 989.8 310.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 309.6Q747.0 311.6 503.0 310.0M992.1 309.3Q747.7 308.6 503.4 309.7" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.6 311.3Q507.0 195.2 505.1 79.1M504.5 312.4Q504.6 195.1 505.0 77.8" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="157.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Network</text><text x="747.5" y="179.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">a large share of jobs and projects are found by contacts; contacts show what</text><text x="747.5" y="201.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">&#x27;competent&#x27; looks like in other roles; Yvette Pasqua: reach out about a specific</text><text x="747.5" y="223.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">topic, join only energising communities, one-to-one at events; mechanical</text><text x="747.5" y="245.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">networking tips are learnable (Vanessa Van Edwards)</text><path d="M9.3 320.1L496.1 320.8L496.1 551.1L9.7 548.8Z" fill="#d6e1cf" stroke="none"/><path d="M8.5 320.8Q252.1 322.0 495.6 320.5M7.6 320.4Q251.9 322.4 496.1 320.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 318.1Q496.3 434.9 495.5 551.8M495.0 319.0Q495.6 434.8 494.1 550.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0 550.4Q253.1 549.3 9.3 549.1M496.7 550.0Q252.5 548.7 8.3 549.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 552.0Q11.5 434.7 10.3 317.5M11.0 551.4Q12.1 435.4 9.0 319.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="408.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Visibility</text><text x="252.5" y="430.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">skills nobody sees cannot be invited; solve problems visibly; optional external</text><text x="252.5" y="452.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">reputation (open source, articles, talks) costs ability points; do not waste an</text><text x="252.5" y="474.0" font-size="13.0" fill="#3b2f20" text-anchor="middle">opportunity (no talk thrown together on the plane); be visibly competent</text><path d="M504.1 319.1L989.6 319.3L989.6 550.2L504.4 550.1Z" fill="#d6e1cf" stroke="none"/><path d="M502.7 319.3Q747.3 321.0 991.8 319.3M504.1 319.1Q747.6 322.8 991.2 320.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.0 319.4Q992.1 435.4 989.4 551.3M990.1 318.9Q990.8 435.2 990.0 551.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.4 550.6Q747.7 549.2 503.1 549.5M992.5 549.0Q747.7 549.8 502.9 549.9" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.9 551.0Q505.9 434.9 506.0 318.7M505.3 550.5Q505.2 434.3 504.6 318.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747.5" y="408.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Roles and projects</text><text x="747.5" y="430.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">you get better at what you spend time on and it is easy to be typecast (five years</text><text x="747.5" y="452.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">of storage systems); choose roles for the experiences you want; ask people who live</text><text x="747.5" y="474.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">the life you want what experiences got them there (Mason Jones)</text></svg>