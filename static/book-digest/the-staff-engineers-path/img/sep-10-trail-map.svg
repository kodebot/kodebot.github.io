<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="640" fill="#fbf7ef"/><path d="M11.1 15.0L990.3 15.4L988.9 85.3L10.7 84.2Z" fill="#d3dbe0" stroke="none"/><path d="M8.5 15.0Q500.1 15.0 991.8 14.6M9.5 15.4Q500.5 14.6 991.5 15.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.8 13.3Q989.6 49.7 990.0 86.2M989.9 12.9Q991.3 49.5 990.3 86.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.5 84.4Q500.1 87.2 8.7 84.5M991.4 84.7Q499.6 83.2 7.8 85.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.9 86.0Q10.2 49.3 10.1 12.7M10.2 85.9Q8.9 50.1 9.1 14.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="45.0" font-size="11.5" fill="#3b2f20" text-anchor="middle">The trail map (Figure 9-1, the fourth map): if you only follow marked local trails you may reach the next &#x27;dungeon&#x27; at a higher level and miss where you wanted to go;</text><text x="500.0" y="67.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">know your priorities, then plot milestones</text><path d="M9.1 99.9L490.2 99.7L490.7 389.7L11.0 389.8Z" fill="#d0dfdc" stroke="none"/><path d="M8.4 99.3Q249.7 100.9 491.0 99.1M7.7 99.3Q249.6 101.7 491.5 99.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.9 97.9Q491.6 244.6 489.3 391.3M489.2 98.5Q488.8 244.5 490.4 390.6" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 389.5Q249.6 390.0 7.9 389.1M490.9 390.2Q249.4 391.3 7.9 390.4" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 392.1Q12.7 245.5 10.3 98.9M9.8 392.0Q8.2 245.2 9.0 98.5" fill="none" stroke="#0b7285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="207.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">What is important to you? (Cian Synnott&#x27;s priority list)</text><text x="250.0" y="229.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">financial security; supporting your family; a flexible schedule; learning a lot;</text><text x="250.0" y="251.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">being visible; doing cool things; challenging yourself; building wealth; working</text><text x="250.0" y="273.0" font-size="12.0" fill="#3b2f20" text-anchor="middle">for yourself; making a difference; enabling a vocation (music, a farm). Personal</text><text x="250.0" y="295.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">and likely to change; no right answer</text><path d="M511.1 99.0L990.3 100.4L990.5 388.8L509.4 391.1Z" fill="#d6e1cf" stroke="none"/><path d="M508.4 99.4Q750.0 101.4 991.6 99.4M509.6 100.2Q750.0 100.6 990.5 100.1" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M990.9 99.2Q991.9 244.8 990.3 390.5M991.1 97.5Q988.6 244.0 989.8 390.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M991.1 389.6Q749.5 391.6 508.0 390.0M992.1 389.3Q750.2 388.6 508.4 389.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.6 391.3Q512.0 245.2 510.1 99.1M509.5 392.4Q509.6 245.1 510.0 97.8" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="207.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Where are you going?</text><text x="750.0" y="229.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">draw milestones: where in five years, and what must you do now? Do not draw alone:</text><text x="750.0" y="251.0" font-size="11.0" fill="#3b2f20" text-anchor="middle">read, attend conferences, talk to people who took paths you like. Your manager may</text><text x="750.0" y="273.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">not know your path, so find your own advice, teaching, guardrails and</text><text x="750.0" y="295.0" font-size="13.5" fill="#3b2f20" text-anchor="middle">opportunities; consider the ambitious path, and a career is a long time</text><path d="M9.3 405.1L991.1 405.8L991.1 621.1L9.7 618.8Z" fill="#f1ede5" stroke="none"/><path d="M8.5 405.8Q499.6 407.0 990.6 405.5M7.6 405.4Q499.4 407.4 991.1 405.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M989.9 403.1Q991.3 512.4 990.5 621.8M990.0 404.0Q990.6 512.3 989.1 620.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M992.0 620.4Q500.6 619.3 9.3 619.1M991.7 620.0Q500.0 618.7 8.3 619.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 622.0Q11.5 512.2 10.3 402.5M11.0 621.4Q12.1 512.9 9.0 404.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="507.5" font-size="11.5" fill="#3b2f20" text-anchor="middle">What do you need to invest in? Imagine yourself having succeeded: what skills, résumé lines and contacts does that person have? Everything in tech is learnable if worth</text><text x="500.0" y="529.5" font-size="15.0" fill="#3b2f20" text-anchor="middle">the time; do not make the journey harder than it must be (Charity Majors: spend your time mostly on what gives you energy)</text></svg>