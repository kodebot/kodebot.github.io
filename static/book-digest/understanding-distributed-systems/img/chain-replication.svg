.0" fill="#3b2f20" text-anchor="middle">replica</text><path d="M219.1 59.1Q259.4 58.4 299.7 59.3M220.2 59.5Q260.1 57.9 300.1 59.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M300.2 59.7Q294.7 57.6 289.7 54.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M299.8 60.3Q294.7 62.6 289.9 65.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="260.0" y="50.0" font-size="14.0" fill="#3b2f20" text-anchor="middle" stroke="#fbf7ef" stroke-width="5" paint-order="stroke">writes</text><path d="M479.4 59.8Q499.3 60.5 519.2 60.1M480.0 60.1Q499.9 61.4 519.7 60.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M519.8 59.8Q514.4 57.8 509.5 55.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M519.7 60.0Q514.6 63.2 509.3 66.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M701.0 60.2Q720.5 58.9 740.0 60.3M699.6 59.5Q719.9 58.5 740.1 59.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M739.6 60.2Q734.6 57.3 729.6 54.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M740.5 59.7Q734.8 62.8 729.1 66.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M738.9 94.3Q719.8 94.8 700.6 95.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><path d="M700.2 95.5Q705.0 98.5 710.2 100.7" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M700.1 95.0Q705.5 92.7 710.6 89.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M520.8 94.8Q500.8 96.2 480.9 95.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><path d="M480.5 94.9Q485.3 98.0 490.3 100.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M480.5 95.5Q485.8 92.2 491.1 89.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M831.0 109.8Q831.2 134.7 830.8 159.7M831.0 110.9Q831.1 135.7 829.5 160.5" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M829.7 160.5Q832.4 154.7 835.0 148.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M829.5 159.6Q827.2 154.1 824.3 148.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="840.0" y="140.0" font-size="10.5" fill="#3b2f20" text-anchor="start" stroke="#fbf7ef" stroke-width="5" paint-order="stroke">reads go ONLY to the tail</text><path d="M20.5 161.0L760.8 159.6L759.2 240.0L18.9 240.9Z" fill="#d6e1cf" stroke="none"/><path d="M19.1 160.6Q390.2 161.8 761.4 160.7M18.4 161.0Q389.5 160.6 760.7 159.7" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M760.1 157.6Q760.3 200.0 759.0 242.4M759.3 158.3Q757.9 200.2 759.7 242.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M761.9 239.9Q389.8 242.5 17.7 238.9M761.1 240.6Q390.3 238.1 19.5 239.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21.0 242.1Q18.7 200.7 19.4 159.2M19.2 240.5Q18.4 199.8 20.6 159.0" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="390.0" y="195.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">Write: head applies, forwards down the chain; the tail commits and the ack flows back to the head</text><text x="390.0" y="215.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">then the head answers the client. Reads served by the tail need no extra coordination</text><path d="M19.4 260.0L479.3 260.8L479.9 380.8L20.8 380.6Z" fill="#efe0ca" stroke="none"/><path d="M17.8 258.9Q249.5 259.6 481.1 260.1M18.6 260.2Q250.5 262.1 482.3 259.2" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M479.5 257.7Q479.8 320.0 480.8 382.3M480.6 259.2Q477.7 320.2 480.1 381.3" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M481.7 379.5Q249.6 380.2 17.6 379.0M482.2 379.1Q249.9 381.1 17.5 380.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.8 381.4Q22.9 319.5 19.9 257.7M19.1 381.8Q20.5 320.2 20.7 258.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="295.0" font-size="18.0" fill="#3b2f20" text-anchor="middle">Control plane (needs consensus, e.g. Raft)</text><text x="250.0" y="315.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">watches health, removes a failed process</text><text x="250.0" y="335.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">head fails: successor becomes head</text><text x="250.0" y="355.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">tail fails: predecessor becomes tail</text><path d="M501.0 259.6L960.6 260.9L960.0 378.9L500.6 380.5Z" fill="#f1ede5" stroke="none"/><path d="M499.0 259.2Q729.8 261.0 960.7 258.9M498.2 260.9Q730.0 258.4 961.8 259.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M960.0 258.7Q960.6 319.9 960.6 381.2M960.3 257.9Q962.0 319.4 961.0 380.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M961.4 380.4Q730.0 381.1 498.7 379.7M961.4 381.0Q730.4 377.7 499.4 380.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M499.0 381.4Q500.9 319.8 499.0 258.1M499.6 381.8Q502.1 320.3 499.2 258.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="730.0" y="295.0" font-size="18.0" fill="#3b2f20" text-anchor="middle">Chain trade-offs</text><text x="730.0" y="315.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">tolerates up to N-1 failures; control plane fewer</text><text x="730.0" y="335.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">one slow replica slows every write</text><text x="730.0" y="355.0" font-size="14.5" fill="#3b2f20" text-anchor="middle">pipelined writes; dirty/clean versions allow any replica to read</text></svg>