<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="420" fill="#ffffff"/><rect x="20" y="20" width="200" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="120.0" y="55.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Clients</text><text x="120.0" y="75.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">writes</text><rect x="300" y="20" width="240" height="80" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="420.0" y="55.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Leader</text><text x="420.0" y="75.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">write-ahead log</text><line x1="220" y1="60" x2="300" y2="60" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="660" y="15" width="300" height="55" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="810.0" y="47.5" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Follower 1 (sync)</text><line x1="540" y1="60" x2="660" y2="42" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="660" y="80" width="300" height="55" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="810.0" y="112.5" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Follower 2 (async)</text><line x1="540" y1="60" x2="660" y2="107" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="660" y="145" width="300" height="55" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="810.0" y="177.5" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Follower 3 (async)</text><line x1="540" y1="60" x2="660" y2="172" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="215" width="300" height="110" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="170.0" y="255.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Fully asynchronous</text><text x="170.0" y="275.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">fast reply, but the leader can</text><text x="170.0" y="295.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">crash before sending: data loss</text><rect x="340" y="215" width="300" height="110" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="490.0" y="255.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Fully synchronous</text><text x="490.0" y="275.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">one slow or dead replica slows</text><text x="490.0" y="295.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">or stops every write</text><rect x="660" y="215" width="300" height="110" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="810.0" y="255.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Mixed (PostgreSQL)</text><text x="810.0" y="275.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">one sync follower = up-to-date</text><text x="810.0" y="295.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">backup, others async</text><rect x="20" y="345" width="940" height="65" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="372.5" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Followers stream log entries by sequence number and can reconnect where they left off</text><text x="490.0" y="392.5" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Replication scales reads and availability, not writes; the data must still fit on one machine</text></svg>