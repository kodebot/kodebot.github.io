<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><rect x="20" y="30" width="260" height="130" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="150.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Catalog service</text><text x="150.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">1. local ACID transaction</text><text x="150.0" y="110.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">updates products AND</text><text x="150.0" y="130.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">appends to the outbox table</text><rect x="330" y="30" width="200" height="130" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="430.0" y="70.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Outbox table</text><text x="430.0" y="90.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">message exists iff</text><text x="430.0" y="110.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">the transaction</text><text x="430.0" y="130.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">committed</text><rect x="570" y="30" width="180" height="130" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="660.0" y="80.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Relay process</text><text x="660.0" y="100.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">polls, sends, then</text><text x="660.0" y="120.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">deletes after the ack</text><rect x="790" y="30" width="170" height="130" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="875.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Message channel</text><text x="875.0" y="100.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Kafka, Event Hubs</text><text x="875.0" y="120.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">ordered delivery</text><line x1="280" y1="95" x2="330" y2="95" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="530" y1="95" x2="570" y2="95" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="750" y1="95" x2="790" y2="95" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="790" y="200" width="170" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="875.0" y="235.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Search service</text><text x="875.0" y="255.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">(Elasticsearch)</text><line x1="875" y1="160" x2="875" y2="200" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="200" width="740" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="390.0" y="235.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">The relay may crash after sending but before deleting: the message is sent twice</text><text x="390.0" y="255.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">an idempotency key lets the destination de-duplicate (chapter 5.7)</text><rect x="20" y="305" width="940" height="75" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="337.5" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Eventual consistency is fine here; no 2PC needed (the search service has no XA support, and we must not block on it)</text><text x="490.0" y="357.5" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">Conceptually like state machine replication: the outbox table is the log of operations (Debezium is an open source relay)</text></svg>