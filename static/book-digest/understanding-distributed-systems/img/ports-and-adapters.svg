<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="380" fill="#ffffff"/><rect x="330" y="130" width="320" height="120" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="490.0" y="175.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Business logic</text><text x="490.0" y="195.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">the core of the service</text><text x="490.0" y="215.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">depends on interfaces only</text><rect x="20" y="140" width="230" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="135.0" y="185.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Inbound adapter</text><text x="135.0" y="205.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">HTTP: part of the API</text><rect x="730" y="140" width="230" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="845.0" y="185.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Outbound adapter</text><text x="845.0" y="205.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">PostgreSQL repository</text><line x1="250" y1="190" x2="330" y2="190" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="290.0" y="178" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">calls</text><line x1="650" y1="190" x2="730" y2="190" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="690.0" y="178" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">uses</text><rect x="20" y="20" width="230" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="135.0" y="50.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">HTTP request</text><text x="135.0" y="70.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">arrives via IPC</text><rect x="730" y="20" width="230" height="70" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="845.0" y="50.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Database</text><text x="845.0" y="70.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">external service</text><line x1="135" y1="90" x2="135" y2="140" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="845" y1="140" x2="845" y2="90" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="280" width="940" height="80" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="315.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Ports and adapters: the business logic does not depend on technical details,</text><text x="490.0" y="335.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">the technical details depend on the business logic (dependency inversion principle)</text></svg>