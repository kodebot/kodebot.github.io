<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="380" fill="#ffffff"/><rect x="20" y="140" width="220" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="130.0" y="175.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Follower</text><text x="130.0" y="195.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">recognises a leader</text><text x="130.0" y="215.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">all processes start here</text><rect x="380" y="20" width="220" height="100" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="490.0" y="55.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Candidate</text><text x="490.0" y="75.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">starts an election,</text><text x="490.0" y="95.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">votes for itself</text><rect x="740" y="140" width="220" height="100" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="850.0" y="175.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Leader</text><text x="850.0" y="195.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">sends heartbeats</text><text x="850.0" y="215.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">at most one per term</text><line x1="200" y1="140" x2="400" y2="105" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="170" y="105" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">no heartbeat: timeout, term + 1</text><line x1="600" y1="105" x2="740" y2="150" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="690" y="118" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">majority of votes</text><line x1="400" y1="120" x2="240" y2="185" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="210" y="170" font-size="12" fill="#14324f" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">sees a leader with term &gt;= mine</text><rect x="380" y="270" width="580" height="100" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="670.0" y="305.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">No winner (a split vote)?</text><text x="670.0" y="325.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">the candidate times out and starts a new election</text><text x="670.0" y="345.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">a random election timeout makes a repeat unlikely</text><rect x="20" y="270" width="330" height="100" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="185.0" y="305.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Term = logical timestamp</text><text x="185.0" y="325.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">numbered 0, 1, 2 ...</text><text x="185.0" y="345.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">a new election starts a new term</text></svg>