<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#fbf7ef"/><text x="500" y="22" font-size="17" font-weight="400" fill="#3b2f20" text-anchor="middle">How TCP builds a reliable channel</text><path d="M21.1 70.0L200.3 70.4L198.9 140.3L20.7 139.2Z" fill="#d3dbe0" stroke="none"/><path d="M18.5 70.0Q110.1 70.0 201.8 69.6M19.5 70.4Q110.5 69.6 201.5 70.9" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M200.8 68.3Q199.6 104.7 200.0 141.2M199.9 67.9Q201.3 104.5 200.3 141.0" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M201.5 139.4Q110.1 142.2 18.7 139.5M201.4 139.7Q109.6 138.2 17.8 140.1" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 141.0Q20.2 104.3 20.1 67.7M20.2 140.9Q18.9 105.1 19.1 69.3" fill="none" stroke="#1c5d99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="110.0" y="100.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Sender</text><text x="110.0" y="122.0" font-size="12.5" fill="#3b2f20" text-anchor="middle">numbered segments 1,2,3,4</text><path d="M799.1 69.9L980.2 69.7L980.7 139.7L801.0 139.8Z" fill="#d6e1cf" stroke="none"/><path d="M798.4 69.3Q889.7 70.9 981.0 69.1M797.7 69.3Q889.6 71.7 981.5 69.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 67.9Q980.9 104.6 979.3 141.3M979.2 68.5Q979.1 104.5 980.4 140.6" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 139.5Q889.6 140.0 797.9 139.1M980.9 140.2Q889.4 141.3 797.9 140.4" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M800.2 142.1Q801.9 105.5 800.3 68.9M799.8 142.0Q798.6 105.2 799.0 68.5" fill="none" stroke="#2f7d3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="890.0" y="111.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">Receiver</text><path d="M201.0 94.1Q500.7 96.0 800.3 95.3M198.9 94.4Q500.0 92.8 801.0 94.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M800.1 94.7Q794.9 92.3 789.7 90.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M799.5 95.1Q794.3 97.8 789.4 101.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="87" font-size="15" fill="#3b2f20" text-anchor="middle" stroke="#fbf7ef" stroke-width="5" paint-order="stroke">segment 1</text><path d="M200.3 114.0Q500.1 124.6 799.6 141.1" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><path d="M799.9 139.5Q794.8 136.8 789.9 133.8" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M799.7 140.0Q794.4 143.0 788.8 145.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="118" font-size="15" fill="#3b2f20" text-anchor="middle" stroke="#fbf7ef" stroke-width="5" paint-order="stroke">segment 2 (lost)</text><path d="M799.9 169.7Q500.1 170.8 200.3 170.6" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><path d="M200.1 170.3Q205.3 173.2 210.9 175.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M200.0 169.6Q205.3 166.9 210.6 164.2" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="162" font-size="15" fill="#3b2f20" text-anchor="middle" stroke="#fbf7ef" stroke-width="5" paint-order="stroke">ack 1 (and the receiver reports its buffer size)</text><path d="M21.1 230.8L321.1 231.1L319.7 298.8L20.0 300.9Z" fill="#efe0ca" stroke="none"/><path d="M17.6 230.5Q169.8 230.9 321.9 229.1M18.1 230.6Q170.1 229.0 322.1 229.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.5 228.8Q319.2 265.1 319.6 301.5M319.1 227.7Q318.6 264.8 319.6 302.0" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M322.3 299.1Q170.5 299.6 18.7 300.2M321.3 299.4Q170.1 298.0 18.9 299.9" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.3 300.5Q20.2 265.0 20.5 229.5M19.0 302.5Q18.2 265.1 20.7 227.6" fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="260.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">timer fires: no ack for 2</text><text x="170.0" y="282.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">so the sender retransmits segment 2</text><path d="M349.6 229.3L649.6 230.2L649.4 300.1L349.1 299.2Z" fill="#f1ede5" stroke="none"/><path d="M348.8 229.3Q500.4 227.3 652.1 230.6M348.2 230.6Q500.3 233.0 652.5 230.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.4 228.3Q648.6 265.0 649.2 301.6M650.0 228.6Q648.7 265.5 649.7 302.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M651.1 299.5Q499.9 303.2 348.8 301.0M650.9 299.9Q499.7 301.8 348.4 300.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M351.0 301.7Q348.6 265.3 350.0 228.8M349.6 301.0Q348.5 264.5 350.1 228.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="260.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">sequence numbers</text><text x="500.0" y="282.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">reveal holes and duplicates</text><path d="M679.1 230.5L980.6 229.4L979.8 301.2L679.4 299.5Z" fill="#f1ede5" stroke="none"/><path d="M679.4 230.0Q829.9 231.4 980.4 229.3M679.4 230.2Q830.6 228.0 981.9 231.0" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M980.3 229.5Q980.4 265.5 980.3 301.5M980.9 229.0Q979.2 265.2 980.8 301.3" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.9 299.2Q830.7 301.6 679.5 299.9M982.0 300.4Q830.8 297.8 679.5 300.9" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M679.3 301.2Q681.8 264.7 681.0 228.3M679.7 301.3Q679.4 265.4 681.0 229.4" fill="none" stroke="#3b2f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="830.0" y="260.0" font-size="17.0" fill="#3b2f20" text-anchor="middle">checksum</text><text x="830.0" y="282.0" font-size="15.0" fill="#3b2f20" text-anchor="middle">detects corruption in transit</text><text x="500" y="350" font-size="14" font-weight="400" fill="#3b2f20" text-anchor="middle">flow control: a well-behaved sender never sends more than fits in the receive buffer</text></svg>