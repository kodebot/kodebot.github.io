<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><rect x="20" y="20" width="300" height="48" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="170.0" y="49.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">POST /products</text><rect x="380" y="20" width="480" height="48" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="620.0" y="49.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">create a product, returns its URL</text><line x1="320" y1="44" x2="380" y2="44" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="82" width="300" height="48" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="170.0" y="111.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">GET /products</text><rect x="380" y="82" width="480" height="48" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="620.0" y="111.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">list (filter, paginate, sort)</text><line x1="320" y1="106" x2="380" y2="106" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="144" width="300" height="48" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="170.0" y="173.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">GET /products/42</text><rect x="380" y="144" width="480" height="48" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="620.0" y="173.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">retrieve product 42</text><line x1="320" y1="168" x2="380" y2="168" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="206" width="300" height="48" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="170.0" y="235.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">PUT /products/42</text><rect x="380" y="206" width="480" height="48" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="620.0" y="235.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">update product 42</text><line x1="320" y1="230" x2="380" y2="230" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="268" width="300" height="48" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="170.0" y="297.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">DELETE /products/42</text><rect x="380" y="268" width="480" height="48" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="620.0" y="297.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">delete product 42</text><line x1="320" y1="292" x2="380" y2="292" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="345" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">GET is safe and cacheable; PUT and DELETE are idempotent: repeating them has the same end result</text></svg>