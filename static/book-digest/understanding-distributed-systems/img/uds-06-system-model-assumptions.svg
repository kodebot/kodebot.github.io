<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><rect x="20" y="15" width="300" height="280" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="42" y="49" font-size="16" font-weight="700" fill="#14324f">Links</text><rect x="40" y="60" width="260" height="54" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="170.0" y="92.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Fair-loss (lose, duplicate)</text><rect x="40" y="130" width="260" height="54" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="170.0" y="162.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Reliable (exactly once)</text><rect x="40" y="200" width="260" height="54" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="170.0" y="232.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Authenticated reliable</text><rect x="340" y="15" width="300" height="280" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="362" y="49" font-size="16" font-weight="700" fill="#14324f">Processes</text><rect x="360" y="60" width="260" height="54" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="92.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Arbitrary-fault (Byzantine)</text><rect x="360" y="130" width="260" height="54" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="490.0" y="162.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Crash-recovery (default)</text><rect x="360" y="200" width="260" height="54" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="490.0" y="232.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Crash-stop</text><rect x="660" y="15" width="300" height="280" rx="14" fill="#f3f8fd" stroke="#b7cde4" stroke-width="2"/><text x="682" y="49" font-size="16" font-weight="700" fill="#14324f">Timing</text><rect x="680" y="60" width="260" height="54" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="810.0" y="92.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Synchronous (unrealistic)</text><rect x="680" y="130" width="260" height="54" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="810.0" y="162.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Asynchronous</text><rect x="680" y="200" width="260" height="54" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="810.0" y="232.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Partially synchronous (default)</text><text x="490" y="318" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">a system model states assumptions so algorithms can be reasoned about without implementation detail</text></svg>