<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" width="980" height="280" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="280" fill="#ffffff"/><rect x="20" y="40" width="290" height="90" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="165.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Physical clock</text><text x="165.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">wall-clock time</text><text x="165.0" y="110.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">TTLs, timeouts</text><rect x="350" y="40" width="290" height="90" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="495.0" y="70.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Logical clock</text><text x="495.0" y="90.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">a counter</text><text x="495.0" y="110.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">orders causally related events</text><rect x="680" y="40" width="290" height="90" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="825.0" y="70.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Vector clock</text><text x="825.0" y="90.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">one counter per process</text><text x="825.0" y="110.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">tells concurrent from ordered</text><line x1="310" y1="85.0" x2="350" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="640" y1="85.0" x2="680" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="190" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">a distributed system has no shared global clock</text></svg>