<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" width="980" height="260" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="980" height="260" fill="#ffffff"/><rect x="20" y="40" width="215" height="84" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="127.5" y="77.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Start</text><text x="127.5" y="97.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">counter = 0</text><rect x="275" y="40" width="215" height="84" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="382.5" y="77.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Before an operation</text><text x="382.5" y="97.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">counter + 1</text><rect x="530" y="40" width="215" height="84" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="637.5" y="67.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Sending</text><text x="637.5" y="87.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">counter + 1, attach it</text><text x="637.5" y="107.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">to the message</text><rect x="785" y="40" width="215" height="84" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="892.5" y="67.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Receiving</text><text x="892.5" y="87.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">max(local, received)</text><text x="892.5" y="107.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">then + 1</text><line x1="235" y1="82.0" x2="275" y2="82.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="490" y1="82.0" x2="530" y2="82.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="745" y1="82.0" x2="785" y2="82.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="490" y="175" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">guarantee: if O1 happened-before O2 then timestamp(O1) &lt; timestamp(O2)</text><text x="490" y="198" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">the reverse does not hold: unrelated operations can share a timestamp</text></svg>