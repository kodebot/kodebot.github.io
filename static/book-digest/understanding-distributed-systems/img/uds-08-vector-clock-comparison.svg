<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Excalifont, 'Bradley Hand', 'Comic Sans MS', cursive"><style>@font-face{font-family:'Excalifont';src:url(data:font/woff2;base64,) format('woff2');}</style><rect width="1000" height="400" fill="#ffffff"/><text x="500" y="22" font-size="17" font-weight="400" fill="#1e1e1e" text-anchor="middle">Vector clocks: rules and comparison</text><path d="M21.1 50.0L480.3 50.4L478.9 170.3L20.7 169.2Z" fill="#d3e9ed" stroke="none"/><path d="M18.5 50.0Q250.1 50.0 481.8 49.6M19.5 50.4Q250.5 49.6 481.5 50.9" fill="none" stroke="#0c8599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M480.8 48.3Q479.3 109.7 480.0 171.2M479.9 47.9Q481.8 109.5 480.3 171.0" fill="none" stroke="#0c8599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M481.5 169.4Q250.1 172.2 18.7 169.5M481.4 169.7Q249.6 168.2 17.8 170.1" fill="none" stroke="#0c8599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.9 171.0Q20.0 109.3 20.1 47.7M20.2 170.9Q18.6 110.1 19.1 49.3" fill="none" stroke="#0c8599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="72.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">Rules</text><text x="250.0" y="94.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">1 all counters start at 0</text><text x="250.0" y="116.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">2 on an operation, increment your own counter</text><text x="250.0" y="138.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">3 on send: increment, attach a copy of the array</text><text x="250.0" y="160.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">4 on receive: element-wise max, then increment yours</text><path d="M519.1 49.9L980.2 49.7L980.7 169.7L521.0 169.8Z" fill="#d6e5f4" stroke="none"/><path d="M518.4 49.3Q749.7 50.9 981.0 49.1M517.7 49.3Q749.6 51.7 981.5 49.5" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 47.9Q981.5 109.6 979.3 171.3M979.2 48.5Q978.8 109.5 980.4 170.6" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M981.3 169.5Q749.6 170.0 517.9 169.1M980.9 170.2Q749.4 171.3 517.9 170.4" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M520.2 172.1Q522.6 110.5 520.3 48.9M519.8 172.0Q518.3 110.2 519.0 48.5" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="83.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">Comparison</text><text x="750.0" y="105.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">T1 &lt;= T2 everywhere and &lt; somewhere:</text><text x="750.0" y="127.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">O1 happened-before O2</text><text x="750.0" y="149.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">neither: the operations are concurrent</text><path d="M21.1 219.0L480.3 220.4L480.5 328.8L19.4 331.1Z" fill="#daeedd" stroke="none"/><path d="M18.4 219.4Q250.0 221.4 481.6 219.4M19.6 220.2Q250.0 220.6 480.5 220.1" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M480.9 219.2Q481.8 274.8 480.3 330.5M481.1 217.5Q478.9 274.0 479.8 330.5" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M481.1 329.6Q249.5 331.6 18.0 330.0M482.1 329.3Q250.2 328.6 18.4 329.7" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.6 331.3Q21.8 275.2 20.1 219.1M19.5 332.4Q19.6 275.1 20.0 217.8" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.0" y="259.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">[2,1,0] vs [3,1,0]</text><text x="250.0" y="281.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">all counters &lt;=, one strictly &lt;</text><text x="250.0" y="303.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">the first happened-before the second</text><path d="M519.3 220.1L981.1 220.8L981.1 331.1L519.7 328.8Z" fill="#fbeed1" stroke="none"/><path d="M518.5 220.8Q749.6 222.0 980.6 220.5M517.6 220.4Q749.4 222.4 981.1 220.6" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M979.9 218.1Q981.2 274.9 980.5 331.8M980.0 219.0Q980.5 274.8 979.1 330.7" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M982.0 330.4Q750.6 329.3 519.3 329.1M981.7 330.0Q750.0 328.7 518.3 329.4" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M519.9 332.0Q521.3 274.7 520.3 217.5M521.0 331.4Q521.9 275.4 519.0 219.5" fill="none" stroke="#e8a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="259.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">[2,0,0] vs [1,1,0]</text><text x="750.0" y="281.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">each is larger somewhere</text><text x="750.0" y="303.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">concurrent: cannot be ordered</text><text x="500" y="370" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">illustrative numbers; storage per process grows with the number of processes</text></svg>