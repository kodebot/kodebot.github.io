<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 300" width="1010" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1010" height="300" fill="#ffffff"/><rect x="20" y="50" width="215" height="100" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="127.5" y="85.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Best-effort</text><text x="127.5" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">reaches all if the</text><text x="127.5" y="125.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">sender does not crash</text><rect x="275" y="50" width="215" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="382.5" y="85.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Reliable</text><text x="382.5" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">delivered even if the</text><text x="382.5" y="125.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">sender crashes (N^2)</text><rect x="530" y="50" width="215" height="100" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="637.5" y="85.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Gossip</text><text x="637.5" y="105.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">random subset,</text><text x="637.5" y="125.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">probabilistic</text><rect x="785" y="50" width="215" height="100" rx="10" fill="#14324f" stroke="#14324f" stroke-width="2"/><text x="892.5" y="85.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Total order</text><text x="892.5" y="105.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">reliable + same order</text><text x="892.5" y="125.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">needs consensus</text><line x1="235" y1="100.0" x2="275" y2="100.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="255.0" y="92.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">stronger</text><line x1="490" y1="100.0" x2="530" y2="100.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="510.0" y="92.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">scales</text><line x1="745" y1="100.0" x2="785" y2="100.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="765.0" y="92.0" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">orders</text><text x="505.0" y="195" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">stronger guarantees cost more coordination</text></svg>