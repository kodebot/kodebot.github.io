<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><rect x="20" y="40" width="300" height="150" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="170.0" y="100.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">DNS</text><text x="170.0" y="120.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">client picks an IP from the DNS record</text><text x="170.0" y="140.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">cached entries: not resilient</text><rect x="345" y="40" width="300" height="150" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="495.0" y="100.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">L4 (transport)</text><text x="495.0" y="120.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">TCP level, clients see a VIP</text><text x="495.0" y="140.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">hashes the connection tuple, NAT, bytes only</text><rect x="670" y="40" width="300" height="150" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="820.0" y="100.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">L7 (application)</text><text x="820.0" y="120.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">HTTP reverse proxy</text><text x="820.0" y="140.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">terminates TLS, rate-limits, sticky sessions</text><text x="500" y="235" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">L7 has more features, lower throughput: L4 in front helps against SYN floods</text></svg>