<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><rect x="20" y="130" width="130" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="85.0" y="165.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Client</text><rect x="250" y="130" width="150" height="60" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="325.0" y="165.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Application</text><rect x="500" y="40" width="170" height="60" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="585.0" y="65.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Cache</text><text x="585.0" y="85.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">high-speed buffer</text><rect x="500" y="220" width="170" height="60" rx="10" fill="#ffffff" stroke="#9db4c8" stroke-width="2"/><text x="585.0" y="245.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Origin</text><text x="585.0" y="265.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">data store</text><line x1="150" y1="160" x2="250" y2="160" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="400" y1="140" x2="500" y2="70" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="90" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">1 lookup</text><line x1="500" y1="92" x2="400" y2="160" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="700" y="75" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">hit: respond from cache</text><line x1="400" y1="175" x2="500" y2="250" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="430" y="230" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">2 miss</text><line x1="670" y1="250" x2="670" y2="100" stroke="#6f8aa3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="690" y="180" font-size="12" font-weight="400" fill="#14324f" text-anchor="start">fill the cache</text><text x="450" y="315" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">caching is an optimisation: if the cache is down the app may be slower, not broken</text></svg>