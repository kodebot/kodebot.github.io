<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="800" height="230" fill="#ffffff"/><rect x="20" y="50" width="200" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="120.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Monitor</text><text x="120.0" y="100.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">observe the state</text><rect x="280" y="50" width="200" height="70" rx="10" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="380.0" y="80.0" font-size="15" font-weight="700" fill="#14324f" text-anchor="middle">Compare</text><text x="380.0" y="100.0" font-size="13" font-weight="400" fill="#14324f" text-anchor="middle">desired vs actual</text><rect x="540" y="50" width="200" height="70" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="640.0" y="80.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Act</text><text x="640.0" y="100.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">change the system</text><line x1="220" y1="85.0" x2="280" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><line x1="480" y1="85.0" x2="540" y2="85.0" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="400.0" y="165" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">a control plane is a feedback loop; most designs miss the monitoring</text></svg>