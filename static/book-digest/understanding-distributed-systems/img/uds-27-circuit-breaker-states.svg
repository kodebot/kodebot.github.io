<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><rect x="20" y="140" width="160" height="80" rx="10" fill="#e3f5e8" stroke="#3d9a5d" stroke-width="2"/><text x="100.0" y="165.0" font-size="15" font-weight="700" fill="#134a26" text-anchor="middle">Closed</text><text x="100.0" y="185.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">pass-through,</text><text x="100.0" y="205.0" font-size="13" font-weight="400" fill="#134a26" text-anchor="middle">counts failures</text><rect x="370" y="30" width="160" height="80" rx="10" fill="#fdeaea" stroke="#d05555" stroke-width="2"/><text x="450.0" y="55.0" font-size="15" font-weight="700" fill="#6b1c1c" text-anchor="middle">Open</text><text x="450.0" y="75.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">calls fail</text><text x="450.0" y="95.0" font-size="13" font-weight="400" fill="#6b1c1c" text-anchor="middle">immediately</text><rect x="720" y="140" width="160" height="80" rx="10" fill="#fff4dc" stroke="#d9a02e" stroke-width="2"/><text x="800.0" y="165.0" font-size="15" font-weight="700" fill="#5c4007" text-anchor="middle">Half-open</text><text x="800.0" y="185.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">next call</text><text x="800.0" y="205.0" font-size="13" font-weight="400" fill="#5c4007" text-anchor="middle">allowed through</text><line x1="100" y1="140" x2="380" y2="90" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="170" y="100" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">failures over threshold</text><line x1="530" y1="95" x2="735" y2="142" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="700" y="90" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">after some time</text><line x1="720" y1="205" x2="180" y2="205" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="222" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">success</text><line x1="800" y1="140" x2="520" y2="52" stroke="#6f8aa3" stroke-width="2" marker-end="url(#arr)"/><text x="700" y="60" font-size="12" fill="#14324f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">failure</text><text x="450" y="330" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">retries help when the next call is expected to succeed; a breaker when it is expected to fail</text></svg>