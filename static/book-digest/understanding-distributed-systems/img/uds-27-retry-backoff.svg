<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8aa3"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><text x="20" y="30" font-size="14" font-weight="700" fill="#14324f" text-anchor="start">waiting time before each retry</text><rect x="60" y="220" width="100" height="30" rx="6" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="110" y="275" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">d</text><rect x="210" y="190" width="100" height="60" rx="6" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="260" y="275" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">2d</text><rect x="360" y="130" width="100" height="120" rx="6" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="410" y="275" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">4d</text><rect x="510" y="80" width="100" height="170" rx="6" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="560" y="275" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">8d</text><rect x="660" y="80" width="100" height="170" rx="6" fill="#e7f0fa" stroke="#5b94cf" stroke-width="2"/><text x="710" y="275" font-size="13" font-weight="700" fill="#14324f" text-anchor="middle">capped</text><text x="450" y="40" font-size="12" font-weight="400" fill="#14324f" text-anchor="middle">exponential backoff with a cap, plus random jitter; retry at one level only</text></svg>