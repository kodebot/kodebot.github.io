or="middle">Black-box</text><text x="130.0" y="131.0" font-size="13.0" fill="#1e1e1e" text-anchor="middle">up or down? synthetics from</text><text x="130.0" y="153.0" font-size="12.0" fill="#1e1e1e" text-anchor="middle">users&#x27; regions: finds symptoms</text><path d="M261.1 79.0L470.3 80.4L470.5 168.8L259.4 171.1Z" fill="#f4f4f4" stroke="none"/><path d="M258.4 79.4Q365.0 81.4 471.6 79.4M259.6 80.2Q365.0 80.6 470.5 80.1" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M470.9 79.2Q471.6 124.8 470.3 170.5M471.1 77.5Q469.1 124.0 469.8 170.5" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.1 169.6Q364.5 171.6 258.0 170.0M472.1 169.3Q365.2 168.6 258.4 169.7" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M260.6 171.3Q261.6 125.2 260.1 79.1M259.5 172.4Q259.6 125.1 260.0 77.8" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="365.0" y="109.0" font-size="17.0" fill="#1e1e1e" text-anchor="middle">White-box</text><text x="365.0" y="131.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">instrumented metrics:</text><text x="365.0" y="153.0" font-size="15.0" fill="#1e1e1e" text-anchor="middle">helps find the root cause</text><text x="250" y="230" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">example: if the service&#x27;s DNS is down, synthetics</text><text x="250" y="252" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">cannot resolve it, yet the service sees only</text><text x="250" y="274" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle">fewer requests and thinks all is fine</text><path d="M504.3 10.1L991.1 10.8L991.1 411.1L504.7 408.8Z" fill="#fbeed1" stroke="none"/><path d="M503.5 10.8Q747.1 12.0 990.6 10.5M502.6 10.4Q746.9 12.4 991.1 10.6" fill="none" stroke="#e8a200" stroke-width="2"