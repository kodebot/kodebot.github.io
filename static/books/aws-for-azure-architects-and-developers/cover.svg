<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Cover for the kodebot.com books page. What you know, Azure or another platform, on the
       left becomes, through the arrow, an AWS design on the right: an account, a Region, a VPC
       across two Availability Zones, and one traced path with numbered steps. Group lines use
       the colours of AWS's architecture deck; no official icons appear, because AWS permits
       them in architecture diagrams. This file is shown outside the book, so it uses literal
       colours. -->

  <!-- what you know: Azure, or another platform -->
  <g fill="none" stroke-dasharray="5 4" stroke-width="1.4">
    <rect x="24" y="52" width="150" height="86" rx="8" stroke="#0a64b8" stroke-opacity=".7"/>
    <rect x="24" y="158" width="150" height="86" rx="8" stroke="#6b7079" stroke-opacity=".7"/>
  </g>
  <g fill="#0a64b8" fill-opacity=".5">
    <rect x="40" y="70" width="40" height="7" rx="3.5"/>
    <rect x="52" y="88" width="96" height="7" rx="3.5"/>
    <rect x="52" y="106" width="70" height="7" rx="3.5"/>
  </g>
  <g fill="#6b7079" fill-opacity=".55">
    <rect x="40" y="176" width="58" height="7" rx="3.5"/>
    <rect x="52" y="194" width="84" height="7" rx="3.5"/>
    <rect x="52" y="212" width="104" height="7" rx="3.5"/>
  </g>

  <!-- the move -->
  <path d="M190 150 C 212 150, 222 150, 242 150" stroke="#0a6c94" stroke-width="2" fill="none"/>
  <path d="M238 144 L247 150 L238 156 z" fill="#0a6c94"/>

  <!-- the AWS design: account, Region, VPC, two zones, public and private subnets -->
  <g fill="none" stroke-width="1.4">
    <rect x="264" y="30" width="352" height="244" stroke="#e7157b"/>
    <rect x="278" y="52" width="324" height="208" stroke="#00a4a6" stroke-dasharray="2 3"/>
    <rect x="292" y="74" width="296" height="172" stroke="#8c4fff"/>
    <rect x="304" y="96" width="132" height="138" stroke="#00a4a6" stroke-dasharray="6 4"/>
    <rect x="444" y="96" width="132" height="138" stroke="#00a4a6" stroke-dasharray="6 4"/>
    <rect x="314" y="108" width="112" height="50" stroke="#7aa116"/>
    <rect x="314" y="170" width="112" height="54" stroke="#00a4a6"/>
    <rect x="454" y="108" width="112" height="50" stroke="#7aa116"/>
    <rect x="454" y="170" width="112" height="54" stroke="#00a4a6"/>
  </g>
  <!-- group marks in the top-left corners -->
  <rect x="264" y="30" width="14" height="14" fill="#e7157b"/>
  <rect x="278" y="52" width="12" height="12" fill="#00a4a6"/>
  <rect x="292" y="74" width="12" height="12" fill="#8c4fff"/>
  <rect x="314" y="108" width="9" height="9" fill="#7aa116"/>
  <rect x="454" y="108" width="9" height="9" fill="#7aa116"/>
  <rect x="314" y="170" width="9" height="9" fill="#00a4a6"/>
  <rect x="454" y="170" width="9" height="9" fill="#00a4a6"/>

  <!-- service tiles: gateways in the public subnets, compute in the private ones -->
  <g fill="#8c4fff" fill-opacity=".85">
    <rect x="356" y="118" width="28" height="28" rx="5"/>
    <rect x="496" y="118" width="28" height="28" rx="5"/>
  </g>
  <g fill="#ed7100" fill-opacity=".85">
    <rect x="356" y="184" width="28" height="28" rx="5"/>
    <rect x="496" y="184" width="28" height="28" rx="5"/>
  </g>

  <!-- the traced path, with numbered steps -->
  <g fill="none" stroke="#0a6c94" stroke-width="2.4">
    <path d="M370 184 L370 146"/>
    <path d="M370 118 L370 38"/>
  </g>
  <g fill="#1a1c1f">
    <circle cx="370" cy="165" r="8"/>
    <circle cx="370" cy="85" r="8"/>
  </g>
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="370" y="169">1</text>
    <text x="370" y="89">2</text>
  </g>

  <line x1="24" y1="286" x2="616" y2="286" stroke="#c3c8cf" stroke-width="1"/>
</svg>
