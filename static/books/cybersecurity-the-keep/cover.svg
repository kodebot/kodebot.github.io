<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Cybersecurity: The Keep">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f5f66"/><stop offset="1" stop-color="#123d52"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1714"/><stop offset="1" stop-color="#2b2521"/></linearGradient>
</defs>
<rect width="640" height="300" fill="url(#sky)"/>
<circle cx="520" cy="66" r="26" fill="#f4e6c8" fill-opacity=".85"/>
<!-- the keep: curtain wall, two flanking towers, gatehouse, crenellations -->
<g fill="url(#stone)">
  <!-- left tower -->
  <path d="M60 300 V150 h14 v-12 h14 v12 h14 v-12 h14 v12 h14 V300 z"/>
  <!-- curtain wall -->
  <path d="M130 300 V190 h12 v-11 h12 v11 h12 v-11 h12 v11 h12 v-11 h12 v11 h12 v-11 h12 v11 h12 V300 z"/>
  <!-- central keep with gatehouse -->
  <path d="M250 300 V112 h16 v-14 h16 v14 h16 v-14 h16 v14 h16 v-14 h16 v14 h16 V300 z"/>
  <!-- right curtain wall -->
  <path d="M414 300 V190 h12 v-11 h12 v11 h12 v-11 h12 v11 h12 v-11 h12 v11 h12 v-11 h12 v11 h12 V300 z"/>
  <!-- right tower -->
  <path d="M510 300 V150 h14 v-12 h14 v12 h14 v-12 h14 v12 h14 V300 z"/>
</g>
<!-- the gate: an arch, standing open -->
<path d="M296 300 V232 a26 26 0 0 1 52 0 V300 z" fill="#0b2b33"/>
<!-- arrow slits -->
<g fill="#0b2b33">
  <rect x="270" y="150" width="7" height="22" rx="3"/><rect x="366" y="150" width="7" height="22" rx="3"/>
  <rect x="88" y="186" width="6" height="18" rx="3"/><rect x="538" y="186" width="6" height="18" rx="3"/>
</g>
<text x="40" y="52" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" fill-opacity=".8" letter-spacing="3.5">A SHORT STORY</text>
<text x="40" y="262" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#fff">Cybersecurity: The Keep</text>
<text x="40" y="288" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#fff" fill-opacity=".85">From the wax seal to the model &#183; 36 chapters</text>
</svg>
