<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Cover for the kodebot.com books page. Act I on the left: a recipe card (the image) and the
       dish cooked from it (a container). The arrow is the move. On the right, the city: three
       buildings (nodes) with lit apartments (Pods), one phone-number sign (a Service) on the gate.
       Shown outside the book, so literal colours. -->

  <!-- the kitchen: recipe card -->
  <rect x="28" y="52" width="132" height="176" rx="8" fill="#fdf2c4" stroke="#b8860b"/>
  <rect x="28" y="52" width="132" height="22" rx="8" fill="#b8860b"/>
  <rect x="28" y="66" width="132" height="8" fill="#b8860b"/>
  <g fill="#8a6a1e" fill-opacity=".8">
    <rect x="44" y="90" width="52" height="7" rx="3.5"/>
    <rect x="44" y="108" width="98" height="6" rx="3"/>
    <rect x="44" y="124" width="84" height="6" rx="3"/>
    <rect x="44" y="140" width="100" height="6" rx="3"/>
    <rect x="44" y="156" width="70" height="6" rx="3"/>
    <rect x="44" y="172" width="92" height="6" rx="3"/>
    <rect x="44" y="188" width="60" height="6" rx="3"/>
  </g>

  <!-- the dish: a container cooked from the card -->
  <g transform="translate(178 210)">
    <ellipse cx="34" cy="8" rx="34" ry="10" fill="#ffe0b3" stroke="#d2691e"/>
    <path d="M0 8 v14 a34 10 0 0 0 68 0 v-14" fill="#ffe0b3" stroke="#d2691e"/>
    <path d="M18 -6 q4 -8 0 -16 M34 -8 q4 -8 0 -16 M50 -6 q4 -8 0 -16" fill="none" stroke="#d2691e" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".7"/>
  </g>

  <!-- the move -->
  <path d="M258 150 C 282 150, 292 150, 314 150" stroke="#0f6e66" stroke-width="2.5" fill="none"/>
  <path d="M310 143 L320 150 L310 157 z" fill="#0f6e66"/>

  <!-- the city: three buildings -->
  <g stroke="#64748b" fill="#f1f5f9">
    <rect x="344" y="96" width="78" height="150" rx="4"/>
    <rect x="434" y="56" width="88" height="190" rx="4"/>
    <rect x="534" y="120" width="72" height="126" rx="4"/>
  </g>
  <!-- apartments (Pods): lit blue -->
  <g fill="#dbeafe" stroke="#2563eb">
    <rect x="356" y="110" width="22" height="18" rx="2"/><rect x="388" y="110" width="22" height="18" rx="2"/>
    <rect x="356" y="140" width="22" height="18" rx="2"/><rect x="388" y="140" width="22" height="18" rx="2"/>
    <rect x="356" y="170" width="22" height="18" rx="2"/><rect x="388" y="170" width="22" height="18" rx="2"/>
    <rect x="356" y="200" width="22" height="18" rx="2"/><rect x="388" y="200" width="22" height="18" rx="2"/>
    <rect x="448" y="72" width="26" height="18" rx="2"/><rect x="484" y="72" width="26" height="18" rx="2"/>
    <rect x="448" y="102" width="26" height="18" rx="2"/><rect x="484" y="102" width="26" height="18" rx="2"/>
    <rect x="448" y="132" width="26" height="18" rx="2"/><rect x="484" y="132" width="26" height="18" rx="2"/>
    <rect x="448" y="162" width="26" height="18" rx="2"/><rect x="484" y="162" width="26" height="18" rx="2"/>
    <rect x="448" y="192" width="26" height="18" rx="2"/><rect x="484" y="192" width="26" height="18" rx="2"/>
    <rect x="546" y="134" width="20" height="16" rx="2"/><rect x="576" y="134" width="20" height="16" rx="2"/>
    <rect x="546" y="162" width="20" height="16" rx="2"/><rect x="576" y="162" width="20" height="16" rx="2"/>
    <rect x="546" y="190" width="20" height="16" rx="2"/><rect x="576" y="190" width="20" height="16" rx="2"/>
  </g>
  <!-- one empty apartment being refilled by the manager -->
  <rect x="546" y="218" width="20" height="16" rx="2" fill="none" stroke="#2563eb" stroke-dasharray="3 2"/>
  <rect x="576" y="218" width="20" height="16" rx="2" fill="#dbeafe" stroke="#2563eb"/>

  <!-- the ground and the front gate with its phone-number sign (Service) -->
  <path d="M332 246 H616" stroke="#64748b" stroke-width="2"/>
  <rect x="404" y="252" width="132" height="22" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="470" y="267" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#b91c1c">pantry:80</text>

  <!-- city hall watching over -->
  <rect x="344" y="30" width="178" height="14" rx="7" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="433" y="40.5" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#5b21b6" letter-spacing=".08em">CONTROL PLANE</text>
</svg>
