<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Cover for the kodebot.com books page. Stacked configuration layers on the left
       resolve, through the arrow, into a pipeline graph with one traced path.
       This file is shown outside the book, so it uses literal colours. -->
  <defs>
    <linearGradient id="cvLayer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a3fb0" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#6a3fb0" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <!-- configuration layers: includes, templates, defaults -->
  <g fill="none" stroke="#6a3fb0" stroke-dasharray="5 4">
    <rect x="24" y="74" width="150" height="170" rx="8" stroke-opacity=".22"/>
    <rect x="40" y="58" width="150" height="170" rx="8" stroke-opacity=".38"/>
  </g>
  <rect x="56" y="42" width="150" height="170" rx="8" fill="url(#cvLayer)" stroke="#6a3fb0" stroke-opacity=".7"/>
  <g fill="#6a3fb0">
    <rect x="72" y="62" width="96" height="7" rx="3.5" opacity=".85"/>
    <rect x="86" y="82" width="84" height="7" rx="3.5" opacity=".6"/>
    <rect x="86" y="102" width="102" height="7" rx="3.5" opacity=".5"/>
    <rect x="72" y="122" width="72" height="7" rx="3.5" opacity=".75"/>
    <rect x="86" y="142" width="90" height="7" rx="3.5" opacity=".45"/>
    <rect x="86" y="162" width="60" height="7" rx="3.5" opacity=".35"/>
    <rect x="72" y="182" width="110" height="7" rx="3.5" opacity=".3"/>
  </g>

  <!-- decode -->
  <path d="M218 127 C 240 127, 250 127, 270 127" stroke="#0a6c94" stroke-width="2" fill="none"/>
  <path d="M266 121 L275 127 L266 133 z" fill="#0a6c94"/>

  <!-- the pipeline: connectors -->
  <g fill="none" stroke="#9aa3ad" stroke-opacity=".6" stroke-width="1.4">
    <path d="M392 81 C 401 81, 401 56, 410 56"/>
    <path d="M392 81 C 401 81, 401 106, 410 106"/>
    <path d="M392 131 C 401 131, 401 206, 410 206"/>
    <path d="M506 56 C 515 56, 515 106, 524 106"/>
    <path d="M506 106 C 515 106, 515 106, 524 106"/>
  </g>
  <!-- the traced path -->
  <g fill="none" stroke="#0a6c94" stroke-width="2.4">
    <path d="M392 131 C 401 131, 401 156, 410 156"/>
    <path d="M506 156 L 524 156"/>
  </g>

  <!-- jobs -->
  <g fill="#9aa3ad" fill-opacity=".12" stroke="#9aa3ad" stroke-opacity=".7">
    <rect x="296" y="70" width="96" height="22" rx="11"/>
    <rect x="410" y="45" width="96" height="22" rx="11"/>
    <rect x="410" y="95" width="96" height="22" rx="11"/>
    <rect x="410" y="195" width="96" height="22" rx="11"/>
    <rect x="524" y="95" width="96" height="22" rx="11"/>
  </g>
  <g fill="none" stroke="#9aa3ad" stroke-width="1.3">
    <circle cx="309" cy="81" r="5"/>
    <circle cx="423" cy="56" r="5"/>
    <circle cx="423" cy="106" r="5"/>
    <circle cx="537" cy="106" r="5"/>
  </g>
  <circle cx="423" cy="206" r="5" fill="#b3261e"/>
  <g fill="#9aa3ad" fill-opacity=".55">
    <rect x="320" y="78" width="56" height="6" rx="3"/>
    <rect x="434" y="53" width="60" height="6" rx="3"/>
    <rect x="434" y="103" width="48" height="6" rx="3"/>
    <rect x="434" y="203" width="56" height="6" rx="3"/>
    <rect x="548" y="103" width="52" height="6" rx="3"/>
  </g>

  <!-- traced jobs -->
  <g fill="#0a6c94" fill-opacity=".14" stroke="#0a6c94">
    <rect x="296" y="120" width="96" height="22" rx="11"/>
    <rect x="410" y="145" width="96" height="22" rx="11"/>
  </g>
  <rect x="524" y="145" width="96" height="22" rx="11" fill="#1c7a4a" fill-opacity=".16" stroke="#1c7a4a"/>
  <circle cx="309" cy="131" r="5" fill="#0a6c94"/>
  <circle cx="423" cy="156" r="5" fill="#0a6c94"/>
  <circle cx="537" cy="156" r="5" fill="#1c7a4a"/>
  <rect x="320" y="128" width="60" height="6" rx="3" fill="#0a6c94"/>
  <rect x="434" y="153" width="54" height="6" rx="3" fill="#0a6c94"/>
  <rect x="548" y="153" width="58" height="6" rx="3" fill="#1c7a4a"/>

  <line x1="24" y1="272" x2="616" y2="272" stroke="#c3c8cf" stroke-width="1"/>
</svg>
