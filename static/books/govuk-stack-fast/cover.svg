<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Cover for the kodebot.com books page. A React component and a .NET controller on the
       left become, through the arrow, a server-rendered question page with Express and
       Fastify side by side. No crown, logotype or GDS Transport font.
       This file is shown outside the book, so it uses literal colours. -->

  <!-- what you know -->
  <g fill="none" stroke="#6b7079" stroke-dasharray="5 4" stroke-opacity=".7">
    <rect x="24" y="52" width="150" height="86" rx="8"/>
    <rect x="24" y="158" width="150" height="86" rx="8"/>
  </g>
  <g fill="#6b7079" fill-opacity=".55">
    <rect x="40" y="70" width="40" height="7" rx="3.5"/>
    <rect x="52" y="88" width="96" height="7" rx="3.5"/>
    <rect x="52" y="106" width="70" height="7" rx="3.5"/>
    <rect x="40" y="176" width="58" height="7" rx="3.5"/>
    <rect x="52" y="194" width="84" height="7" rx="3.5"/>
    <rect x="52" y="212" width="104" height="7" rx="3.5"/>
  </g>

  <!-- the move -->
  <path d="M190 150 C 212 150, 222 150, 242 150" stroke="#0a6c94" stroke-width="2" fill="none"/>
  <path d="M238 144 L247 150 L238 156 z" fill="#0a6c94"/>

