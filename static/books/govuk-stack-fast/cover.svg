  <rect x="264" y="34" width="190" height="232" rx="8" fill="#ffffff" stroke="#c3c8cf"/>
  <rect x="264" y="34" width="190" height="24" rx="8" fill="#1a1c1f"/>
  <rect x="264" y="50" width="190" height="8" fill="#1a1c1f"/>
  <rect x="280" y="80" width="118" height="10" rx="3" fill="#1a1c1f"/>
  <rect x="280" y="104" width="150" height="26" fill="none" stroke="#1a1c1f" stroke-width="2"/>
  <rect x="280" y="146" width="60" height="22" rx="2" fill="#1e6b3f"/>
  <rect x="280" y="190" width="150" height="6" rx="3" fill="#c3c8cf"/>
  <rect x="280" y="204" width="120" height="6" rx="3" fill="#c3c8cf"/>
  <rect x="280" y="218" width="136" height="6" rx="3" fill="#c3c8cf"/>

  <!-- side by side -->
  <rect x="476" y="60" width="66" height="180" rx="6" fill="#6a3fb0" fill-opacity=".10" stroke="#6a3fb0"/>
  <rect x="552" y="60" width="66" height="180" rx="6" fill="#0b6e6a" fill-opacity=".10" stroke="#0b6e6a"/>
  <g fill="#6a3fb0" fill-opacity=".7">
